- id: QFQFM
  subjectId: b737
  chapterId: "b737.07"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: With A/T engaged, what condition could cause the throttles to be separated (not aligned).
      explanation: |
        > EEC Alternate Mode
        >
        > (...)
        >
        > In the soft alternate mode, the EEC uses the last valid flight conditions to define engine parameters which allows the mode change to occur with no immediate change in engine thru

        If one of the throttles EEC is in ALTN, and the other is functioning normally and MCT is commanded, the two EECs will eventually calculate different MCT leading to a stagger in the throttles. For this reason the QRH will instruct to move both throttles into the HARD ALT mode.
      presets:
        - correctAnswers:
            - text: One EEC in ON, one EEC in ALTN.
          wrongAnswers:
            - text: Throttle stagger cannot occur with A/T engaged as both throttle servo motors work identically to position the throttles symmetrically.
            - text: Both EECs in ALTN.
            - text: One engine A/T suffering a system fault.
- id: QAWOV
  subjectId: b737
  chapterId: "b737.07"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What condition would cause an automatic shutdown of the APU?
      explanation: |-
        ### FCOM 7.30.3, Electronic Control Unit (ECU)

        > An electronic control unit (ECU) monitors and controls the APU. If the ECU detects a fault that may cause damage to the APU or the aircraft, it will **automatically execute a protective shutdown.** One of three different indications on the APU Indicator Panel will appear when a protective shutdown is initiated: • Fault Light, or • Overspeed Light, or • Low Oil Pressure Light
      presets:
        - correctAnswers:
            - text: An APU high oil temperature condition occurs or The APU overspeeds or APU fuel control unit failure.
          wrongAnswers:
            - text: An APU high oil temperature condition occurs or The APU overspeeds.
            - text: The APU overspeeds or APU fuel control unit failure
            - text: The APU has no automatic shutdown protection - shutting down the APU is always Flight Crew initiated.
- id: QPADP
  subjectId: b737
  chapterId: "b737.07"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Which bus powers the left igniter plug?
      explanation: |-
        ### FCOM 7.20.10, Engine Ignition System

        > Each engine has two igniter plugs. The EEC arms the igniter plug(s) selected by the ignition select switch. **The left igniter plug receives power from the associated AC transfer bus. The right igniter plug receives power from the AC standby bus.**
      presets:
        - correctAnswers:
            - text: AC Transfer Bus 1
          wrongAnswers:
            - text: The AC Standby Bus
            - text: DC Bus 1
            - text: AC Transfer Bus 2
