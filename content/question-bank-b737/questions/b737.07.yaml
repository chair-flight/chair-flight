- id: QFVHC
  subjectId: b737
  chapterId: "b737.07"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: At what point during a normal start is the EEC supplied with electrical power?
      explanation: |-
        ### FCOM 7.11.1, Engine Indications

        > The EEC must receive electrical power to supply engine operating data to the flight deck engine indications. When the EEC is not powered, N1, N2, oil quantity and engine vibration are displayed directly from the engine sensors. **Positioning the engine start switch to GRD supplies electrical power to the EEC** and displays pointers/digits for all engine parameters.
      presets:
        - correctAnswers:
            - text: When the engine start switch is positioned to GRD
          wrongAnswers:
            - text: When the engines accelerates to a speed greater than 15% N2
            - text: When the battery switch is placed ON
            - text: When the engines accelerates to a speed greater than 25% N2 or max motoring
- id: QPPRF
  subjectId: b737
  chapterId: "b737.07"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: On a ground start, if a Wet start is detected, when will the EEC turn off ignition and shut off fuel to the engine.
      explanation: |-
        ### FCOM 7.20.9, Abnormal Start Protection (Ground Starts Only)

        > A wet start occurs if the EGT does not rise after the start lever is moved to IDLE. If a wet start is detected, **the EEC turns off the ignition and shuts off fuel to the engine 15 seconds after the start lever is moved to IDLE.**

        The protection works on ground starts only.
      presets:
        - correctAnswers:
            - text: 15 seconds after the start lever moved to Idle
          wrongAnswers:
            - text: 10 seconds after start lever moved to idle
            - text: The EEC does not turn off ignition and fuel - this is a crew responsibility.
            - text: 15 seconds after throttle lever moved to Idle
