            - text: No 1 Main Tank.
          wrongAnswers:
            - text: From tapping in left engine supply line.
            - text: Left side of the Fuel Manifold.
            - text: Suction fed from Centre Tank.
- id: QUNSI
  subjectId: b737
  chapterId: "b737.07"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: How is the engine fuel heated prior to entering the engine?
      explanation: |-
        ### FCOM 7.20.7, Engine Fuel System

        > The fuel flows through a fuel spar shutoff valve located at the engine mounting wing stations. The fuel passes through the first stage engine fuel pump where pressure is increased. It then passes through **two fuel/oil heat exchangers where IDG oil and main engine oil heat the fuel.**

        ![Engine fuel and oil system](annex:AKAI)
      presets:
        - correctAnswers:
            - text: Heated by passing through IDG oil heat exchanger and engine oil heat exchanger.
          wrongAnswers:
            - text: Heated by passing through engine oil heat exchanger only.
            - text: Heated only by Kinetic energy imparted due to pressure increase passing through the 1st and 2nd stage engine fuel pumps.
            - text: Engine fuel is not heated until it is burnt in the engine combustion chamber.
    - type: simple
      question: How is fuel heated prior to reaching the engine?
      explanation: |-
        ### FCOM 7.20.7, Engine Fuel System

        > It then passes through **two fuel/oil heat exchangers where IDG oil and main engine oil heat the fuel.**

        The engine oil is cooled by the fuel in the main engine oil cooler (FCOM 7.20.7, Engine Oil System).

        ![Engine fuel and oil system](annex:AKAI)
      presets:
        - correctAnswers:
            - text: The main engine oil cooler and the IDG oil cooler
          wrongAnswers:
            - text: The IDG oil cooler
            - text: An electrical fuel heater
            - text: The main engine oil cooler.
- id: QRDTK
  subjectId: b737
  chapterId: "b737.07"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Where in the engine oil system is the oil filter located?
      explanation: |-
        ### FCOM 7.20.7, Engine Oil System

        > Oil is returned to the oil tank by engine driven scavenge pumps. **From the scavenge pumps oil passes through a scavenge filter.** If the filter becomes saturated with contaminants, oil automatically bypasses the filter.

        The scavenge filter is therefore in the return line, before the oil tank.

        ![Engine fuel and oil system](annex:AKAI)
      presets:
        - correctAnswers:
            - text: In the engine oil return line before reaching the oil tank
          wrongAnswers:
            - text: In the oil tank
            - text: In the engine bearings supply line
            - text: In the engine oil supply after leaving the oil tank
