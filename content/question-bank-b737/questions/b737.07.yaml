      question: An amber REV indication is displayed in flight without reverse thrust being commanded. The engine responds to forward thrust lever movement and there is no buffet or yaw. What is the implication for the flight?
      explanation: |-
        ### FCOM QRH 7.36, REVERSER UNLOCKED (IN FLIGHT)

        > Condition: The amber REV indication shows with uncommanded reverse thrust. Note: Only multiple failures could allow the engine to go into reverse thrust. Unstowed reverser sleeves produce buffet, yaw, roll and increased airplane drag.
        >
        > Engine responds to forward thrust lever movement and no buffet or yaw exists: **Continue normal operation.**
      presets:
        - correctAnswers:
