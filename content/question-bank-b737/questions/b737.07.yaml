- id: QTPGX
  subjectId: b737
  chapterId: "b737.07"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: At what rotational speed is the Start Lever moved to the IDLE position?
      explanation: |-
        ### FCOM 7.20.9, Engine Start System

        > In the GRD position, the engine start switch uses battery power to close the engine bleed air valve and open the start valve to allow pressure to rotate the starter. When the start valve opens, **an amber START VALVE OPEN alert is provided on the upper display unit.** [...] When the engine accelerates to the recommended value (**25% N2 or max motoring**), moving the engine start lever to the IDLE position opens the fuel valves on the wing spar and engine, and causes the EEC to supply fuel and ignition to the combustor where the fuel ignites.
      presets:
        - correctAnswers:
            - text: Max Motoring - 25% N2.
          wrongAnswers:
            - text: Starter cutout speed - 56% N1.
            - text: Max motoring - 56% N1.
            - text: Starter cutout speed - 56% N2.
