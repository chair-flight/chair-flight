  templates:
    - type: simple
      question: Approach idle is selected in flight by the EECs under what normal conditions(s)?
      explanation: |-
        ### FCOM 7.20.5, Idle Operation

        > Approach idle is selected in flight if any of the following conditions are met: • **Cowl thermal anti-ice switch is ON** for either engine 1 or engine 2 • Altitude is below 19,000 feet MSL AND left or right main landing gear is down and locked • Altitude is below 19,000 feet MSL AND **left or right flaps are in the approach configuration (flaps ≥ 15)**
      presets:
        - correctAnswers:
            - text: Flaps are in landing configuration or engine anti-ice is ON
          wrongAnswers:
            - text: Below 2,000 feet
            - text: Below 15,000 feet
            - text: Landing gear extended
