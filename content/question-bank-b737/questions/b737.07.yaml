- id: QQYAF
  subjectId: b737
  chapterId: "b737.07"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: The REVERSER light located on the aft overhead panel illuminated during a normal reverse sequence indicates ?
      explanation: |-
        ### FCOM 7.20.14, Thrust Reverser

        > The REVERSER light, located on the aft overhead panel, illuminates when the thrust reverser is commanded to stow and **extinguishes 10 seconds later when the isolation valve closes.** Any time the REVERSER light illuminates for more than approximately 12 seconds, a malfunction has occurred and the MASTER CAUTION and ENG system annunciator lights illuminate.
      presets:
        - correctAnswers:
            - text: A normal indication if the light extinguishes 10 seconds after the thrust reverser is commanded to stow.
          wrongAnswers:
            - text: The isolation valve has failed to open and the thrust reverser control valve has not moved to the deploy position.
            - text: A normal indication until the reverser sleeves are stowed at the completion of the reverse sequence.
            - text: One or more faults in the system if the light illuminates at the start of the sequence.
