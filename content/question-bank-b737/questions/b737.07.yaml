    - type: simple
      question: When does the OIL FILTER BYPASS alert illuminate on the upper display unit?
      explanation: |-
        ### FCOM 7.20.7, Engine Oil System

        > If the filter becomes saturated with contaminants, oil automatically bypasses the filter. **Prior to the oil bypassing the scavenge filter, the OIL FILTER BYPASS alert illuminates on the upper display unit.**

        ![Engine fuel and oil system](annex:AKAI)
      presets:
        - correctAnswers:
            - text: Illuminates prior to oil bypassing the scavenge filter.
          wrongAnswers:
            - text: Illuminates just prior to oil pump bypass opening as pressure gets near to pressure required to open the bypass.
            - text: Once the oil filter bypass has opened and oil is bypassing the filter.
            - text: If the oil filter bypass has failed in the closed position and oil pressure is beginning to increase.
