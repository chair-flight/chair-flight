- id: QKWRP
  subjectId: b737
  chapterId: "b737.07"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Raising an engine start lever to the IDLE position opens which fuel valve(s)?
      explanation: |-
        ### FCOM 7.20.7, Engine Fuel System

        > The spar fuel shutoff valve and engine fuel shutoff valve allow fuel flow to the engine when both valves are open. The valves are open when the engine fire switch is in and **the start lever is in IDLE.** Both valves close when either the start lever is in CUTOFF or the engine fire switch is out.

        ![Engine fuel and oil system](annex:AKAI)
      presets:
        - correctAnswers:
            - text: The related spar fuel shutoff valve and engine-mounted fuel shutoff valve.
          wrongAnswers:
            - text: The related engine-mounted fuel shutoff valve and engine bypass valve.
            - text: The related spar fuel shutoff valve.
            - text: The related engine-mounted fuel shutoff valve.
- id: QFTDH
  subjectId: b737
