- id: QDSRY
  subjectId: b737
  chapterId: "b737.10"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: |
        On the PFD, what does the amber annunciation "DISPLAYS CONTROL PANEL" 
        indicate?
      explanation: |-
        ### FCOM 10.11.31, Displays Control Panel Annunciation (EFIS CP)

        > Displays Control Panel Annunciation (amber) **Indicates a failed EFIS control panel on the affected side.** When DISPLAYS CONTROL PANEL appears in the lower right hand corner of the display, altitude information is removed.

        ![Displays control panel annunciation](annex:AHCX)
      presets:
        - correctAnswers:
            - text: The EFIS control panel on the side the annunciation is displayed has failed
          wrongAnswers:
            - text: The PFD the annunciation is displayed on has an error and information displayed may be erroneous.
            - text: The Displays Source Control Panel on the side the annunciation is displayed has failed.
            - text: The Display Select Panel on the side the annunciation is displayed has failed.
- id: QURPY
  subjectId: b737
  chapterId: "b737.10"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: The amber annunciation "INSTR SWITCH" indicates what?
      explanation: |-
        ### FCOM 10.11.32, Instrument Switch Annunciation

        > INSTR SWITCH Annunciation (amber) Indicates both the Captain’s and First Officer’s displays are using the same source of IRU data. **Displayed when the IRS switch on the overhead panel is not in the NORMAL position.**

        ![737 PFD annunciations](annex:ALNZ)
      presets:
        - correctAnswers:
            - text: The IRS switch on the Forward Overhead panel is not selected to NORMAL
          wrongAnswers:
            - text: Captain's and First Officer's displays are using separate sources of IRU data.
            - text: The IRS switch on the Aft Overhead panel is not selected to NORMAL.
            - text: Captain's and First Officer's displays are using the same source of IRU data with the IRS switch selected to OFF.
