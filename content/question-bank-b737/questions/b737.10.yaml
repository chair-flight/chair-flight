- id: QCDQP
  subjectId: b737
  chapterId: "b737.10"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What does an amber ALT DISAGREE in the bottom of the altimeter tape indicate?
      explanation: |-
        The amber DISAGREE alerts trigger as follows:

        - **ALT DISAGREE: Captain's and F/O's altitude indications differ by more than 200 ft for more than 5 seconds.**
        - **IAS DISAGREE:** Captain's and F/O's airspeed indications differ by more than 5 kt for 5 seconds.
        - **AOA DISAGREE:** Captain's and F/O's AOA values differ by more than 10° for more than 10 seconds.
        - **ROLL:** Captain's and F/O's roll angle displays differ by more than 5°.
        - **MAP RANGE DISAGREE:** The selected range on the EFIS control panel is different from the MAP display range.

        ![737 PFD annunciations](annex:ALNZ)
      presets:
        - correctAnswers:
            - text: The captain's and first officer's altitude indications differ more than 200 feet for more than 5 seconds
          wrongAnswers:
            - text: The captains altitude reading and the standby altimeter disagree by more than 200ft for more than 5 seconds
            - text: There is a difference of more than 10 HPa between the selected QNH
            - text: The captains and first officer's altitude indications differ more than 50 feet for more than 5 seconds
