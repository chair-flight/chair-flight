          wrongAnswers:
            - text: FMC computed airspeed if the IAS/MACH window is blank.
            - text: Airspeed manually selected in the IAS/MACH window.
            - text: Current or next speed restriction in the FMC.
- id: QJDBL
  subjectId: b737
  chapterId: "b737.10"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What does the top of the amber bar indicate at the lower end of the speed tape?
      explanation: |-
        ### FCOM 10.11.9, Airspeed Indications – Takeoff and Approach

        > Minimum Maneuver Speed (amber) The amber bar is displayed with the first flap retraction after takeoff or when a valid Vref is entered.
        >
        > **Top of amber bar indicates minimum maneuver speed.** This airspeed provides
        > - **1.3g maneuver capability to stick shaker below approximately 20,000 ft.**
        > - **1.3g maneuver capability to low speed buffet** (or an alternative approved maneuver capability set in the FMC maintenance pages) **above approximately 20,000 ft.**
      presets:
        - correctAnswers:
            - text: Minimum manoeuvre speed (1.3g manoeuvre capability to stick shaker below approximately 20,000 feet) - (1.3g manoeuvre capability to low speed buffet above approximately 20,000 feet).
          wrongAnswers:
            - text: Minimum manoeuvre speed (1.3g manoeuvre capability to stick shaker above approximately 30,000 feet) - (1.3g manoeuvre capability to low speed buffet below approximately 30,000 feet).
            - text: Minimum manoeuvre speed (1.3g manoeuvre capability to stick shaker above approximately 20,000 feet) - (1.3g manoeuvre capability to low speed buffet below approximately 20,000 feet).
            - text: Minimum manoeuvre speed (1.3g manoeuvre capability to stick shaker below approximately 30,000 feet) - (1.3g manoeuvre capability to low speed buffet above approximately 30,000 feet).
- id: QDYEO
  subjectId: b737
  chapterId: "b737.10"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: A white bug that indicates V2 + 15 is displayed at what stage of flight, and when is it removed?
      explanation: |-
        ### FCOM 10.11.9, Airspeed Indications – Takeoff and Approach

        > V2+15 (white) **Displayed for takeoff.** Removed when either of the following occurs:
        > - **at first flap retraction**
        > - **when VREF is entered in the CDU.**

        ![V2+15 bug](annex:AVRT)
      presets:
        - correctAnswers:
            - text: Displayed at Takeoff, removed at first flap retraction or when Vref entered in CDU.
          wrongAnswers:
            - text: Displayed at takeoff, removed when Pitch Flight director moves to 15 degrees nose up.
            - text: Displayed at Approach, removed when flaps at Flap 1 or greater.
            - text: Displayed on Approach, removed once right main landing gear is compressed, throttle levers at Idle, and engines have spooled down from Approach Idle to Ground Idle.
- id: QGRLK
  subjectId: b737
  chapterId: "b737.10"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: During approach the Captain observes his BARO minimum reference/altitude turns from green to flashing amber for three seconds, what does this mean?
      explanation: |-
        ### FCOM 10.11.24, Landing Altitude/Minimums Indications

        > Minimums Reference/Altitude (green) Displays approach minimum reference and altitude set by the MINS selector on the EFIS control panel:
        >
        > BARO – • displayed below ADI when selector is set to BARO, minimums are in feet MSL • **turns amber and flashes for 3 seconds when airplane descends below selected minimum altitude** […]
      presets:
        - correctAnswers:
            - text: The aircraft has descended below the Captain's selected minimum altitude (DA).
          wrongAnswers:
            - text: A windshear has been encountered.
            - text: Radio altitude data is unreliable.
            - text: The aircraft has descended below 1000 feet
