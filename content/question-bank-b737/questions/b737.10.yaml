- id: QPDYF
  subjectId: b737
  chapterId: "b737.10"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: On the navigation display, how is the display presented in VOR, Approach and Plan modes?
      explanation: |-
        ### FCOM 10.16.3, Mode Selector

        > APP – • displays localizer and glideslope information in **heading–up format.**
        >
        > VOR – • displays VOR navigation information in **heading–up format**
        >
        > PLN – • displays a non–moving, **true north up**, route depiction

        MAP mode is track up.
      presets:
        - correctAnswers:
            - text: VOR = heading up, Approach = heading up, Plan = true north up.
          wrongAnswers:
            - text: VOR = heading up, Approach = true north up, Plan = heading up.
            - text: VOR = true north up, Approach = heading up, Plan = heading up.
            - text: VOR = true north up, Approach = true north up, Plan = heading up.
