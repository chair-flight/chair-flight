- id: QBZTQ
  subjectId: b737
  chapterId: "b737.10"
  relatedQuestionIds:
    - QWMTM
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What does a white CDS MAINT message in the lower left corner of the PFD indicate?
      explanation: |-
        ### FCOM 10.11.30, Display System Annunciations

        > When there is a problem with the DEU display system, one of the following indications will appear in the lower left corner of the primary flight display:
        >
        > **CDS MAINT (white) – A dispatchable CDS fault has occurred. Displayed on the ground only, prior to start of the second engine.**
        >
        > CDS FAULT (amber) – A non-dispatchable CDS fault has occurred. Displayed on the ground only, prior to start of the second engine.

        ![CDS MAINT annunciation](annex:AUKK)
      presets:
        - correctAnswers:
            - text: A dispatchable CDS fault has occurred prior to second engine start.
          wrongAnswers:
            - text: A non-dispatchable CDS fault has occurred post second engine start.
            - text: A dispatchable CDS fault has occurred prior to first engine start.
            - text: A non-dispatchable CDS fault has occurred prior to second engine start
