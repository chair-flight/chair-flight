- id: QWPWP
  subjectId: b737
  chapterId: "12"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: In the unlikely situation of total generator failure, at high altitude thrust deterioration may occur. Why?
      explanation: |-
        ### FCOM 12.20.2, Suction Feed

        > When main tank fuel pump pressure is low, each engine can draw fuel from its corresponding main tank through a suction feed line that bypasses the pumps. As the airplane climbs, **dissolved air is released from the fuel in the tank** due to the decrease in air pressure. **This air may collect in the suction feed line and restrict fuel flow. At high altitude, thrust deterioration or engine flameout may occur** as a result of the fuel flow reduction.

        The fuel pumps are AC powered, so with total generator failure the engines suction feed.
      presets:
        - correctAnswers:
            - text: The fuel will be suction fed, which may cause dissolved air released from the fuel to restrict fuel flow in the suction feed line.
          wrongAnswers:
            - text: Loss of AC power will affect the ignition system and therefore create a potential risk of flameout
            - text: When on STBY power the fuel pumps run a little slower
            - text: When on STBY power the HMU will be unreliable, therefore thrust deterioration might occur at high altitude
