- id: QZCJF
  subjectId: b737
  chapterId: "12"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Which fuel valves are Flight Crew made aware of their position by means of flight deck indications?
      explanation: |-
        ### FCOM 12.10.1, Fuel Control Panel

        > Engine Valve Closed (ENG VALVE CLOSED) and SPAR VALVE CLOSED Lights [...]
        >
        > Crossfeed VALVE OPEN Light Extinguished – crossfeed valve is closed. Illuminated (blue) – • bright – crossfeed valve is in transit [...] • dim – crossfeed valve is open.

        The fuel pumps are switched and monitored by their LOW PRESSURE lights, and have no valve position lights.

        ![Fuel system schematic](annex:AQWR)
      presets:
        - correctAnswers:
            - text: Engine Fuel Shutoff valves, Spar Fuel Shutoff valves, Crossfeed valve.
          wrongAnswers:
            - text: Fuel valves are automatic with no flight deck indications.
            - text: Engine Fuel Shutoff valves, Spar Fuel Shutoff valves, Crossfeed valve, Centre, No1 and No2 tanks Fuel Pump valves.
            - text: Centre, No1 and No2 Tanks Fuel Pump Valves, Engine Fuel Shutoff Valve, Cross Feed valve.
- id: QCKRH
  subjectId: b737
  chapterId: "12"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: After the Centre Tank has emptied the auto shutoff logic stops the pumps, how do the pumps then function?
      explanation: |-
        ### FCOM 12.10.2, FUEL PUMP Switches

        > Note: When a center tank fuel pump switch is set to OFF, **the auto shutoff logic for that pump is reset. When the center tank fuel pump switch is set to ON after being OFF, the pump will again activate** until the switch is set to OFF or auto shutoff logic deactivates it.
      presets:
        - correctAnswers:
            - text: Switching the pumps to OFF and then back to ON recycles the auto shutoff logic and the pumps will again activate.
          wrongAnswers:
            - text: There is no shutoff logic, the pumps continue to run with the amber LOW PRESSURE light illuminated until the Flight Crew switch the pumps to OFF.
            - text: The pumps will not function again until the Centre tank has been refueled above 453 kg.
            - text: The pumps can be activated if necessary by tripping the auto shutoff circuit breaker on Panel P6-1 behind the First Officer.
- id: QILID
  subjectId: b737
  chapterId: "12"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What is the correct sequence regarding the SPAR VALVE CLOSED light during a normal engine start procedure after the START LEVER is positioned to IDLE detent?
      explanation: |-
        ### FCOM 12.10.1, Engine Valve Closed and SPAR VALVE CLOSED Lights

        > Extinguished – related engine or spar fuel shutoff valve is open. Illuminated (blue) – • **bright – related engine or spar fuel shutoff valve is in transit**, or valve position and engine start lever or engine fire switch disagree. • **dim – related engine or spar fuel shutoff valve is closed.**

        Moving the start lever to IDLE opens the valve: closed (dim), in transit (bright), open (extinguished). The check is also listed in FCOM SP.12.2, Spar Fuel Shutoff Valve Operational Check During Engine Start.
      presets:
        - correctAnswers:
            - text: Transitions from dim, to bright and then extinguishes.
          wrongAnswers:
            - text: Transitions from extinguished to bright.
            - text: Transitions from extinguished to dim.
            - text: Transitions from extinguished, to bright and then dim.
    - type: simple
      question: During an engine start , when an engine start lever is positioned to IDLE detent, which of the following statements is correct?
      explanation: |-
        ### FCOM 12.10.1, Engine Valve Closed and SPAR VALVE CLOSED Lights

        > Extinguished – related engine or spar fuel shutoff valve is open. Illuminated (blue) – • **bright – related engine or spar fuel shutoff valve is in transit**, or valve position and engine start lever or engine fire switch disagree. • **dim – related engine or spar fuel shutoff valve is closed.**

        Moving the start lever to IDLE opens the valve: closed (dim), in transit (bright), open (extinguished). The check is also listed in FCOM SP.12.2, Spar Fuel Shutoff Valve Operational Check During Engine Start.
      presets:
        - correctAnswers:
            - text: The related blue SPAR VALVE CLOSED light transitions from dim, to bright, and then extinguished.
          wrongAnswers:
            - text: The related blue SPAR VALVE CLOSED light transitions from dim to extinguished.
            - text: The related blue SPAR VALVE CLOSED light transitions from extinguished, to bright, and then dim.
            - text: The related SPAR VALVE CLOSED light is unaffected by the engine start lever position.
- id: QREBW
  subjectId: b737
  chapterId: "12"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: "In flight a fuel imbalance between No1 and No2 tanks can be corrected by:"
      explanation: |-
        ### FCOM SP.12.3, Fuel Balancing

        > If the center tank contains fuel: Center tank fuel pump switches ......... OFF Crossfeed selector ......... **Open** Fuel pump switches (low tank) ......... **OFF** When quantities are balanced: Fuel pump switches (main tank) ......... ON Center tank fuel pump switches ......... ON Crossfeed selector ......... Close

        The fuel from the tank with more fuel feeds both engines through the crossfeed valve. Continued crossfeed use produces a progressive imbalance (FCOM 12.20.2), so the crossfeed is closed once the quantities are balanced.
      presets:
        - correctAnswers:
            - text: Open the Crossfeed cock, turn off the pumps on the low side until the Fuel Quantity Indicators are balanced.
          wrongAnswers:
            - text: Increase thrust setting on the side with higher amount of fuel and decrease thrust setting on side with lower amount of fuel.
            - text: Opening the crossfeed valve, turning OFF the fuel pumps for the tank with lower fuel and allowing the pumps from the tank with the higher amount of fuel to transfer fuel to the other tank until the IMBAL amber warning light extinguishes, then close the Crossfeed valve and turn back on the pumps.
            - text: A Fuel imbalance cannot be rectified in flight, as fuel transfer between tanks can only be carried out on the ground using the Ground Refuelling Panel switches.
