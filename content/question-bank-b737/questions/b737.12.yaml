  templates:
    - type: simple
      question: When is a fuel LOW indication displayed?
      explanation: |-
        ### FCOM 12.10.5, Fuel LOW Alert

        > Displayed (amber) – • **fuel tank quantity less than 453 kgs in related main tank** • display remains until fuel tank quantity is increased to 567 kgs
      presets:
        - correctAnswers:
            - text: When a main tank quantity is less than 453 kg.
          wrongAnswers:
            - text: When a main tank quantity is less than 762 kg.
            - text: When a main tank pump output pressure is low.
            - text: When the fuel supply pressure to an engine is low.
