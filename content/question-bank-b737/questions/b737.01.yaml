            - text: Pull latch mechanism rod to unlock window. Move window forward whilst depressing trigger mechanism, turn handle forward and outboard, release trigger to lock.
          wrongAnswers:
            - text: Pull lock trigger to unlock window. Move window forward whilst depressing trigger mechanism, turn handle forward and outboard, release trigger to lock.
            - text: Handle must be in the locked position. Without touching the trigger mechanism, ensure channel is clear and push window forward until trigger lock mechanism engages.
            - text: Handle must be in the unlocked position.  Without touching the trigger mechanism, ensure channel is clear and push window forward until trigger lock mechanism engages.
