      question: What is the correct method to close the Flight Deck No 2 window?
      explanation: |
        This is one of those questions where doing it once in real life will never leave you confused ever again:

        1. Pull latch mechanism rod to unlock window.
        2. Move window forward whilst depressing trigger mechanism.
        3. Turn handle forward and outboard.
        4.  Release trigger to lock.
      presets:
