- id: QHKHL
  subjectId: b737
  chapterId: "b737.01"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: When operating the forward airstairs, with the external control, what position must the forward entry door be in?
      explanation: |
        - External control: Any position
        - Internal control: Partially open

        External operation can have the door in any position, to allow for the door to be opened and closed when the cabin is secured. This is done at every start and end of the day.

        Internal operation requires that the door is unlocked and partially open as a safety measure. It reduces the risk of the door being opened with the aircraft moving, and prevents the temptation of extending the door with the door fully open which could lead to falls.
      presets:
        - correctAnswers:
            - text: Can be in any position.
          wrongAnswers:
            - text: Must be fully open
            - text: Must be fully closed
            - text: Must be partially open
