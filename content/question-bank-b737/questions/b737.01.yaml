    - type: simple
      question: With the EMER EXIT LIGHTS switch in the guarded position, when would the Emergency Exit Lights automatically illuminate?
      explanation: |
        > ### Emergency (EMER) EXIT LIGHTS Switch
        >
        > - **OFF**: prevents emergency lights system operation if airplane electrical power fails or is turned off.
        > - **ARMED**: (guarded position) all emergency lights illuminate automatically if airplane electrical power to DC bus No. 1 fails or AC power is turned off.
        > - **ON**: all emergency lights illuminate.
      presets:
        - correctAnswers:
            - text: When DC Bus 1 fails, or AC power is turned off.
          wrongAnswers:
            - text: Immediately.  When guarded the switch is in the ON position
            - text: Whenever the FASTEN SEATBELTS signs are illuminated, with the Flaps beyond Flap 15.
            - text: Never.  When guarded the switch is in the OFF position.
