  templates:
    - type: simple
      question: When the PASS OXY switch on the AFT overhead panel is selected to ON, at what cabin altitude will the passenger oxygen system activate?
      explanation: |
        > ## Passenger Oxygen (PASS OXYGEN) Switch
        >
        > - **NORMAL**: (guarded position) passenger masks drop and passenger oxygen system activated automatically if cabin altitude climbs to 14,000 feet. Automatic 'Emergency Descent' PA x 3 is announced in the cabin. The announcement will repeat every 10 seconds for a period of one minute.
        > - **ON**: activates system and drops masks. Automatic 'Emergency Descent' PA x 3 is announced in the cabin. The announcement will repeat every 10 seconds for a period of one minute.
      presets:
        - correctAnswers:
            - text: At altitude selected ON.
          wrongAnswers:
            - text: 14,000 feet.
            - text: 10,000 feet.
            - text: 14,000 m.
