        >
        > **System A:** ailerons, rudder, elevator and elevator feel, flight spoilers (2,4,9,11), **ground spoilers (1,6,7,12)**, **alternate brakes**, **No. 1 thrust reverser**, autopilot A, **normal nose wheel steering**, **landing gear**, landing gear transfer valve, **power transfer unit (PTU)**.

