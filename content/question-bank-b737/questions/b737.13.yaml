- id: QMSXQ
  subjectId: b737
  chapterId: "b737.13"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: "The engine hydraulic pump (ENG 1 and ENG 2) switches are switched ON:"
      explanation: |-
        ### FCOM 13.10.1, Hydraulic Panel

        > **ENGINE HYDRAULIC PUMPS Switches** ON – **de–energizes blocking valve in pump** to allow pump pressure to enter system. Note: **Should remain ON at shutdown** to prolong solenoid life. OFF – energizes blocking valve to block pump output.
      presets:
        - correctAnswers:
            - text: They de-energize the blocking valve to allow pump pressure to enter the system. The switches should remain ON at shutdown to prolong solenoid life.
          wrongAnswers:
            - text: They de-energize the blocking valve to allow pump pressure to enter the system. The switches should remain OFF at shutdown to prolong solenoid life.
            - text: They energize the blocking valve to allow pump pressure to enter the system. The switches should remain OFF at shutdown to prolong solenoid life.
            - text: They energize the blocking valve to allow pump pressure to enter the system. The switches should remain ON at shutdown to prolong solenoid life.
    - type: simple
      question: How is hydraulic oil pressure stopped from entering the system when the Engine Driven Pumps (EDPs) are switched to OFF?
      explanation: |-
        ### FCOM 13.10.1, Hydraulic Panel

        > **ENGINE HYDRAULIC PUMPS Switches** ON – de–energizes blocking valve in pump to allow pump pressure to enter system. OFF – **energizes blocking valve to block pump output.**
      presets:
        - correctAnswers:
            - text: A blocking valve in the pump is energised allowing it to close and stop pressure entering the system.
          wrongAnswers:
            - text: A blocking valve in the pump is de-energised allowing it to close and stop pressure entering the system.
            - text: The EDPs are mechanically disengaged from the engine external gearbox by means of a Sprag clutch.
            - text: The EDPs are mechanically disengaged from the engine external gearbox by means of a electronic clutch.
    - type: simple
      question: What would be the effect of switching the ENG 1 hydraulic pump switch to OFF in flight?
      explanation: |-
        ### FCOM 13.20.2, A and B Hydraulic System Pumps

        > Positioning the switch to OFF **isolates fluid flow from the system components. However, the engine–driven pump continues to rotate as long as the engine is operating.**
      presets:
        - correctAnswers:
            - text: The pump output is isolated, but the pump is still being driven by the engine.
          wrongAnswers:
            - text: The pump drive is disconnected.
            - text: The pump unloader valve is energised, and the pump output is directed back to the reservoir.
            - text: System A output is connected to the ENG 2 pump output.
