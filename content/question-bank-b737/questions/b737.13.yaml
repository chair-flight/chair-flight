- id: QBZRD
  subjectId: b737
  chapterId: "b737.13"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Which systems are powered by the hydraulic system?
      explanation: |-
        ### FCOM 13.20.1, Introduction

        > The airplane has three hydraulic systems: A, B and standby. [...] The hydraulic systems power the following airplane systems:
        > - flight controls
        > - leading edge flaps and slats
        > - trailing edge flaps
        > - landing gear
        > - wheel brakes
        > - nose wheel steering
        > - thrust reversers
        > - autopilots.

        ![Hydraulic system schematic](annex:AABO)
      presets:
        - correctAnswers:
            - text: Flight controls, wheel brakes, leading and trailing edge flaps, leading edge slats, nose wheel steering, landing gear, thrust reversers, autopilots.
          wrongAnswers:
            - text: Flight controls, autothrottles, wheel brakes, leading and trailing edge flaps, leading edge slats, nose wheel steering, landing gear, thrust reversers.
            - text: Yaw damper, autopilot and autothrottle, flight controls, brakes, landing gear, trailing edge flaps and slats, nose wheel steering, tiller, power transfer unit, landing gear transfer unit.
            - text: Flight controls, Anti-skid, trailing edge flaps and slats, nose wheel steering, landing gear, thrust reversers, autopilots.
- id: QSNVL
  subjectId: b737
  chapterId: "b737.13"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: true-or-false
      question: ""
      explanation: |-
        ### FCOM 13.20.1, Introduction

        > Either A or B hydraulic system can power all flight controls with no decrease in airplane controllability.
        >
        > System A and B reservoirs are **pressurized by bleed air**. The standby system reservoir is **connected to the system B reservoir** for pressurization and servicing.
      statements:
        - text: Either hydraulic system A or hydraulic system B can power all the flight controls with no decrease in airplane controllability.
          answer: true
        - text: The hydraulic system A and system B reservoirs are pressurised by bleed air.
          answer: true
        - text: The standby hydraulic reservoir is connected to the system A reservoir for pressurisation and servicing.
          answer: false
        - text: The standby hydraulic reservoir is connected to the system B reservoir for pressurisation and servicing.
          answer: true
        - text: Only hydraulic system A can power all the flight controls with no decrease in airplane controllability.
          answer: false
        - text: The hydraulic system A and system B reservoirs are pressurised by the engine-driven pumps.
          answer: false
