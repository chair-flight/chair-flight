        ![Hydraulic system schematic](annex:AABO)
      presets:
        - correctAnswers:
            - text: Landing gear, normal nose wheel steering and the power transfer unit (PTU)
          wrongAnswers:
            - text: Ground spoilers, normal nose wheel steering and trailing edge flaps
            - text: Ground spoilers, trailing edge flaps and the power transfer unit (PTU)
            - text: Alternate nose wheel steering, alternate brakes and ground spoilers
        - correctAnswers:
            - text: Ground spoilers, alternate brakes and the No. 1 thrust reverser
          wrongAnswers:
            - text: Ground spoilers, normal brakes and the No. 1 thrust reverser
            - text: Ground spoilers, alternate brakes and the No. 2 thrust reverser
            - text: Trailing edge flaps, alternate brakes and the No. 1 thrust reverser
