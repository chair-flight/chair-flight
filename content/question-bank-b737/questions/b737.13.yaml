- id: QUSPU
  subjectId: b737
  chapterId: "b737.13"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: If a leak develops in the hydraulic System A reservoir, which associated pump(s) will have hydraulic fluid available from below the standpipe?
      explanation: |-
        ### FCOM 13.20.3, System A Hydraulic Leak

        > If a leak develops in the engine–driven pump or its related lines, **a standpipe in the reservoir prevents a total system fluid loss.** With fluid level at the top of the standpipe, the reservoir quantity displayed indicates approximately 20% full. **System A hydraulic pressure is maintained by the electric motor–driven pump.**

        ![System A reservoir after an engine-driven pump leak](annex:ALKQ)
      presets:
        - correctAnswers:
            - text: The AC electric motor-driven pump
          wrongAnswers:
            - text: Both the engine driven pump (EDP) and the AC electric motor-driven pump
            - text: Neither pump
            - text: The engine driven pump
    - type: simple
      question: If a leak develops in the supply line to the System A engine-driven hydraulic pump, what would you expect the reservoir quantity to eventually drop to?
      explanation: |-
        ### FCOM 13.20.3, System A Hydraulic Leak

        > If a leak develops in the engine–driven pump or its related lines, a standpipe in the reservoir prevents a total system fluid loss. **With fluid level at the top of the standpipe, the reservoir quantity displayed indicates approximately 20% full.** System A hydraulic pressure is maintained by the electric motor–driven pump.

        ![System A reservoir after an engine-driven pump leak](annex:ALKQ)
      presets:
        - correctAnswers:
            - text: 20% full
          wrongAnswers:
            - text: 0%
            - text: 40% full
            - text: 76% full
- id: QCZZZ
  subjectId: b737
  chapterId: "b737.13"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: If a fluid leak were to occur in the output side of the System A electric pump, what would the eventual consequence be?
      explanation: |-
        ### FCOM 13.20.3, System A Hydraulic Leak

        > If a leak develops in the electric motor–driven pump or its related lines, or components common to both the engine and electric motor–driven pumps, **the quantity in the reservoir steadily decreases to zero and all system pressure is lost.**
      presets:
        - correctAnswers:
            - text: The System A reservoir quantity decreases to zero and System A pressure is lost.
          wrongAnswers:
            - text: The System A reservoir quantity decreases to zero but System A pressure is maintained by the PTU.
            - text: The System A reservoir quantity decreases to approximately 20% and System A pressure is maintained.
            - text: The System A reservoir quantity decreases to approximately 20% and the alternate brakes and steering must be used.
    - type: simple
      question: If a leak were to develop in the input to the System A electric-driven pump, how would this ultimately affect the operation of the PTU?
      explanation: |-
        ### FCOM 13.20.3, System A Hydraulic Leak

        > If a leak develops in the electric motor–driven pump or its related lines, [...] **the quantity in the reservoir steadily decreases to zero and all system pressure is lost.**

        ### FCOM 13.20.3, Power Transfer Unit

        > The PTU uses **system A pressure** to power a hydraulic motor–driven pump, which pressurizes system B hydraulic fluid.

        With no system A pressure, the PTU cannot operate.
      presets:
        - correctAnswers:
            - text: The PTU will not function, as all System A pressure will be lost.
          wrongAnswers:
            - text: The PTU will still operate, as the System A engine-driven pump can provide pressure.
            - text: The PTU will still operate, but at a slower rate.
            - text: The PTU is part of System B and will therefore operate as normal.
- id: QBHFF
  subjectId: b737
  chapterId: "b737.13"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What effect will a leak in system B downstream of the EDP have on the Power Transfer Unit (PTU)?
      explanation: |-
        ### FCOM 13.20.3, System B Hydraulic Leak

        > If a leak develops in either pump, line or component of system B, the quantity decreases until it indicates approximately zero and system B pressure is lost. The system B reservoir has one standpipe which supplies fluid to both the engine–driven pump and the electric motor–driven pump. However, **with fluid level at the top of the standpipe, fluid remaining in the system B reservoir is sufficient for power transfer unit operation.**

        <div style="display:flex;gap:0.75rem;align-items:flex-start">

        ![Hydraulic system schematic](annex:AABO)

        ![System B reservoir after a leak](annex:ALKP)

        </div>
      presets:
        - correctAnswers:
            - text: It will continue to function if required due to oil in the system B reservoir below the standpipe level.
          wrongAnswers:
            - text: It will function as normal as it is part of the standby system and powered by system A oil pressure.
            - text: A leak in system B has no effect as the PTU only uses oil from system A to operate.
            - text: It will cease to function as it requires oil from system B to operate.
