  chapterId: "b737.13"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: When both pumps for a hydraulic system are OFF, what may the system pressure indication read?
      explanation: |-
        ### FCOM 13.10.2, Hydraulic Indications

        > **Note:** When both pumps for a system are OFF, the indication may read **hydraulic system reservoir pressure, normally less than 100 psi.**

