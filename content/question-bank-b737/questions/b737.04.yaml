      question: In a climb with MCP SPD, HDG SEL and V/S engaged, what happens if the speed decreases to the minimum speed for the flap setting?
      explanation: |-
        ### FCOM 4.20.29, Minimum Speed Reversion

        > If actual speed becomes equal to or slightly less than the minimum speed, the underspeed limiting symbol appears in the MCP IAS/Mach Display, and **if operating in the V/S mode [...] the AFDS reverts to LVL CHG.**
      presets:
        - correctAnswers:
            - text: The AFDS switches to LVL CHG and reduces the climb demand to prevent the speed decreasing any further.
          wrongAnswers:
            - text: The autopilot disengages.
            - text: The autothrottle commands full takeoff thrust.
