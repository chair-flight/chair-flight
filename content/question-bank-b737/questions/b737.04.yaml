    - type: simple
      question: In a V/S descent with the speed increasing towards Vmo/Mmo and the autothrottle already at idle, what does the AFDS do to prevent an overspeed?
      explanation: |-
        ### FCOM 4.20.28, Placard Limit Reversion

        > • for VMO/MMO only, if the A/T is engaged in a speed mode and the thrust levers are at idle, the **AFDS, if in a V/S mode [...] will automatically engage to LVL CHG mode.**
      presets:
        - correctAnswers:
            - text: The AFDS switches to LVL CHG to reduce the nose-down attitude and rate of descent.
          wrongAnswers:
            - text: The speedbrakes deploy automatically.
            - text: The autopilot disengages.
            - text: The V/S descent remains commanded, but the autothrottle disengages.
