- id: QYQQE
  subjectId: b737
  chapterId: "04"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What does an illuminated green light mean in the MCP buttons?
      explanation: |
        This question is the centerpiece of the Type Rating. The MCP is not the source of truth on what modes are active. That's the FMA. The MCP green lights simply highlight that a mode can be deselected.

        For example:

        > N1 Switch
        >  - Push – (light illuminated)
        >    - deselects N1 mode and extinguishes switch light
        >    - engages autothrottles in ARM mode.
      presets:
        - correctAnswers:
            - text: That switch can be de-selected.
          wrongAnswers:
            - text: That mode is currently engaged and active.
            - text: The switch is available to be selected.
            - text: That mode is currently de-selected and inactive.
