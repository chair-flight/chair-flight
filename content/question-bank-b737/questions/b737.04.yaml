  templates:
    - type: simple
      question: With VNAV engaged, pushing the SPD INTV switch has what effect?
      explanation: |
        > ### Speed Intervention (SPD INTV) Switch
        > - Push (when VNAV engaged) –
        >   - IAS/MACH display alternately shows selected IAS/Mach and blanks
        >   - when IAS/MACH display is unblanked, FMC speed intervention is active, FMC target speed is displayed, and IAS/MACH Selector may be used to set desired speed
        >   - when IAS/MACH display is blank, FMC computed target speed is active and displayed on the airspeed indicator
      presets:
        - correctAnswers:
            - text: IAS/MACH window opens up showing current FMC target speed, and IAS/MACH selector can be used to set new desired speed.
          wrongAnswers:
            - text: IAS/MACH window blanks and next FMC speed restriction becomes active, magenta target speed displayed above speed tape on PFD.
            - text: Current or next speed restriction deleted from FMC, IAS/MACH window opens up showing previous FMC target speed, and IAS/MACH selector can be used to set new desired speed.
            - text: No effect, VNAV remains engaged with the FMC controlling target speed.
