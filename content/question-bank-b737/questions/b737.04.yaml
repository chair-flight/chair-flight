      question: How can the flight director be engaged in the takeoff mode if both flight director switches are OFF?
      explanation: |-
        ### FCOM 4.20.5, TO/GA – Takeoff

        > **TO/GA can also be engaged for takeoff with F/D switches OFF if a TO/GA switch is pushed after 80 knots IAS below 2000 feet AGL and prior to 150 seconds after lift–off.**
      presets:
        - correctAnswers:
            - text: If a TO/GA switch is pushed after 80 kt, below 2000 ft AGL and before 150 seconds after lift-off.
          wrongAnswers:
            - text: TOGA cannot be selected with the flight directors off.
            - text: Pushing TOGA three times in a row.
            - text: Pressing TOGA after 50 kt and before 180 seconds after lift-off.
