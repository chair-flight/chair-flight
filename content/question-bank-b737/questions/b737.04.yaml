- id: QBYUQ
  subjectId: b737
  chapterId: "04"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: In flight, with Autopilot engaged in CMD B, which FCC controls the logic for the flight directors on the Captain's PFD.
      explanation: |
        > Normally, FCC A drives the captain’s command bars and FCC B drives the first officer’s command bars. With both F/D switches ON, the logic for both pilots’ F/D modes is controlled by the master FCC, and both FMA displays show the same mode status.
        >
        > The master FCC is indicated by illumination of the respective master (MA) F/D indicator light. The master FCC is determined as follows:
        > - with neither A/P engaged in CMD, the FCC for the first F/D turned on is the master
        > - **with one or both A/Ps engaged in CMD, the FCC for the first A/P in CMD is the master FCC, regardless of which F/D is turned on first**.
      presets:
        - correctAnswers:
            - text: FCC B
          wrongAnswers:
            - text: FMS A
            - text: FMS B
            - text: FCC A
