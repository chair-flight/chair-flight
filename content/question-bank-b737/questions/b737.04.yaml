      question: If overspeed limiting occurs, how is this annunciated on the MCP?
      explanation: |-
        ### FCOM 4.10.3, MCP Speed Condition Symbols

        > Overspeed or underspeed limiting symbol appears when commanded speed cannot be reached. Underspeed limiting (flashing character “A”) – minimum speed **Overspeed limiting (flashing character “8”)** – • Vmo or Mmo limit • landing gear limit • flap limit.
      presets:
