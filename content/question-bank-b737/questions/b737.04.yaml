- id: QLAPB
  subjectId: b737
  chapterId: "04"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: In flight below 2000 feet RA, on an ILS Autopilot approach with flare armed, what happens if you push a TO/GA switch once?
      explanation: |
        > ### A/P Go–Around
        >
        > The A/P GA mode requires dual A/P operation and is available after FLARE armed is annunciated and prior to the A/P sensing touchdown.
        >
        > > Note: For go-arounds initiated at or above 2000 feet RA, either a single or a > double button push will engage A/T N1 thrust mode and not the reduced > go-around N1 thrust mode. During this time, the A/T FMA will show N1
        >
        > With the first push of either TO/GA switch:
        > - Below 2000 feet RA (below 15,500 feet pressure altitude if both RA’s have failed):
        >   - A/T (if armed) engages in GA and the A/T Engaged Mode annunciation on the FMA indicates GA
        >   - thrust advances toward the reduced go–around N1 to produce 1000 to 2000 fpm rate of climb
      presets:
        - correctAnswers:
            - text: Autothrottle advances thrust levers to reduced Go-Around N1.
          wrongAnswers:
            - text: Autothrottle will disengage, and ARM is displayed in FMA.
            - text: Autothrottle advances thrust levers to full Go-Around N1.
            - text: Autopilot will disengage, and CWS P will annunciate.
- id: QGSKB
  subjectId: b737
  chapterId: "04"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: true-or-false
      question: ""
      explanation: |
        800 ft RA is a magic number on the 737.

        > At 84 KIAS, the A/T mode annunciates THR HLD. (...) After LIFT-OFF:
        >  - (...)
        >  - the A/T remains in THR HLD until 800 feet above field elevation. A/T annunciation then changes from THR HLD to ARM and reduction to climb thrust can be made by pushing the N1 switch.

        The Two modes are very similar, the only difference is that ARM offers additional protections:

        > - **THR HLD**: the thrust lever autothrottle servos are inhibited; the pilot can set the thrust levers manually
        > - **ARM**: no autothrottle mode engaged. The thrust lever autothrottle servos are inhibited; the pilot can set thrust levers manually. Minimum speed protection is provided
      statements:
        - text: After takeoff the autothrottle will remain in Throttle Hold (THR HLD) until 800 feet RA.
          answer: true
