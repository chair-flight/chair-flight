      question: What will cause the STBY RUDDER ON light to illuminate?
      explanation: |-
        ### FCOM 9.10.2, STBY RUD ON Light

        > Illuminated (amber) - **indicates the standby rudder system is commanded on to pressurize the standby rudder power control unit.**

        The command can come from either FLT CONTROL switch, automatically at takeoff or landing, or from the Force Fight Monitor (FCOM 9.20.13).

        ![Yaw control schematic](annex:AZIT)
      presets:
        - correctAnswers:
            - text: Standby rudder system is commanded on, either manually or automatically, to pressurise the standby rudder PCU.
          wrongAnswers:
