- id: QENVS
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: On the B737-800, if the STAB TRIM AUTOPILOT cutout switch is set to CUTOUT, how is autopilot engagement affected?
      explanation: |-
        ### FCOM 9.10.6, Stabilizer Trim AUTOPILOT Cutout Switch

        > CUTOUT – • deactivates autopilot stabilizer trim operation • **autopilot disengages if engaged.**

        ### FCOM 4.20.2, Autopilot Engagement Criteria

        > A/P engagement in CMD or CWS is inhibited unless both of the following pilot–controlled conditions are met: • no force is being applied to the control wheel • **the STAB TRIM AUTOPILOT cutout switch is at NORMAL.**

        While the switch is in CUTOUT the autopilot cannot be re-engaged.
      presets:
        - correctAnswers:
            - text: The autopilot disengages if engaged and cannot be re-engaged.
          wrongAnswers:
            - text: The autopilot remains engaged.
            - text: The autopilot disengages if engaged, but it can be re-engaged.
- id: QWLIG
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: If you encounter elevator tab vibration, what action should the crew take to reduce it?
      explanation: |-
        ### QRH 9.7, Elevator Tab Vibration

        > Do not use speedbrakes or change aircraft configuration to reduce airspeed. Do not reduce airspeed below the minimum speed for the existing flap setting and gross weight. 2 **Smoothly reduce airspeed until the vibration stops.**
      presets:
        - correctAnswers:
            - text: Smoothly reduce airspeed without changing the configuration until the vibration stops.
          wrongAnswers:
            - text: Increase speed and move the flaps to UP.
            - text: Increase thrust and airspeed in the current configuration until the vibration stops.
            - text: Deploy the speedbrakes to reduce airspeed as quickly as possible.
- id: QJUTK
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What is the effect of moving the STAB TRIM OVERRIDE switch to OVERRIDE?
      explanation: |-
        ### FCOM 9.20.7, Stabilizer Trim

        > Control column actuated stabilizer trim cutout switches stop operation of the main electric and autopilot trim when the control column movement opposes trim direction. **When the STAB TRIM override switch is positioned to OVERRIDE, electric trim can be used regardless of control column position.**

        ![Pitch control schematic](annex:AAPH)
      presets:
        - correctAnswers:
            - text: It allows the electric stabiliser trim to be used regardless of control column position.
          wrongAnswers:
            - text: It removes power to the stabiliser trim motor.
