  templates:
    - type: true-or-false
      question: ""
      explanation: |-
        ### FCOM 9.20.20, Flap Load Relief

        > YW098 - YW164 Flap load relief is available when flaps are selected to 10, 15, 25, 30, or 40. Flap load relief is not available during alternate flap extension.
        >
        > YA573 - YW097 **Flap load relief is available when flaps are selected to 30, or 40.**

        The Flap Slat Electronic Unit provides the function, but the range depends on the airplane, so the statement is false.

        ![Leading edge devices and trailing edge flaps](annex:AQAC)
