            - text: It removes the autopilot inputs to the stabiliser trim system.
- id: QMFWA
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What is the function of the Force Fight Monitor in the main rudder PCU?
      explanation: |-
        ### FCOM 9.20.13, Yaw Control

        > The main rudder PCU contains a Force Fight Monitor (FFM) that **detects opposing pressure (force fight) between A and B actuators.** This may occur if either system A or B input is jammed or disconnected. The FFM output is used to **automatically turn on the Standby Hydraulic pump, open the standby rudder shutoff valve to pressurize the standby rudder PCU**, and illuminate the STBY RUD ON, Master Caution, and Flight Control (FLT CONT) lights.

        ![Yaw control schematic](annex:AZIT)
      presets:
        - correctAnswers:
            - text: It monitors the pressures applied by the A and B actuators and, if opposing forces are detected, turns on the standby hydraulic pump and opens the standby rudder shutoff valve to pressurise the standby rudder PCU.
          wrongAnswers:
            - text: It reduces rudder deflection at airspeeds above approximately 135 kt.
            - text: It detects a difference in force between the main rudder PCU and the standby rudder PCU and shuts down the main PCU.
- id: QXFFJ
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: If the Captain's control wheel becomes jammed in roll, how can the First Officer maintain roll control?
      explanation: |-
        ### FCOM 9.20.3, Aileron Transfer Mechanism

        > If the ailerons or spoilers are jammed, force applied to the Captain’s and the First Officer’s control wheels will identify which system, ailerons or spoilers, is usable and which control wheel, Captain’s or First Officer’s, can provide roll control. **If the aileron control system is jammed, force applied to the First Officer’s control wheel provides roll control from the spoilers.** The ailerons and the Captain’s control wheel are inoperative.

        ### QRH 9.10, Jammed or Restricted Flight Controls

        > 4 Overpower the jammed or restricted system. **Use maximum force, including a combined effort of both pilots, if needed.** 5 Do not turn off any flight control switches.

        ![Roll control schematic](annex:AJTX)
      presets:
        - correctAnswers:
            - text: Apply sufficient roll force to break out the First Officer's control wheel. Roll is then controlled through the flight spoilers.
          wrongAnswers:
            - text: Remove hydraulic power from the flight controls to free the Captain's wheel and control the ailerons in manual reversion.
            - text: Roll control is unavailable for the rest of the flight. Roll can only be maintained with the rudder.
- id: QIPKH
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What is the function of the Speed Trim system?
      explanation: |-
        ### FCOM 9.20.8, Speed Trim System

        > The Speed Trim System (STS) is a speed stability augmentation system designed to improve flight characteristics during operations with a low gross weight, aft center of gravity and high thrust **when the autopilot is not engaged.** The purpose of the STS is to return the airplane to a trimmed speed by commanding the stabilizer in a direction opposite the speed change.

        ![Pitch control schematic](annex:AAPH)
      presets:
        - correctAnswers:
            - text: It provides trim inputs to improve speed stability characteristics during manual flight.
          wrongAnswers:
            - text: It increases the rate at which the trim wheel operates with flaps not up.
            - text: It improves speed stability above Mach 0.615 with the autopilot engaged.
            - text: It increases control column forces when approaching VMO/MMO.
- id: QDHXB
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: When extending the flaps with the ALTERNATE FLAPS switch, why should you monitor the flap position indicator carefully as the flaps extend?
      explanation: |-
        ### FCOM 9.20.22, Alternate Extension

        > The switch must be held in the DOWN position until the flaps reach the desired position. **No asymmetry or skew protection is provided through the alternate (electrical) flap drive system.**

        ![Leading edge devices and trailing edge flaps](annex:AQAC)
      presets:
        - correctAnswers:
            - text: No asymmetry protection is provided when using the alternate flap system.
          wrongAnswers:
            - text: Only the R needle indicates flap position when using alternate flaps.
            - text: Only the L needle indicates flap position when using alternate flaps.
            - text: If the switch is operated to DOWN it latches on and the flaps fully extend until the switch is returned to the centre.
