- id: QYZOR
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What happens to the speed brakes if the SPEED BRAKE lever is left in the DOWN position during landing.
      explanation: |-
        ### FCOM 9.20.17, Ground Operation

        > If the SPEED BRAKE lever is in the DOWN position during landing or rejected takeoff, the auto speed brake system operates when these conditions occur: • main landing gear wheels spin up (more than 60 kts) • both thrust levers are retarded to IDLE • reverse thrust levers are positioned for reverse thrust. **The SPEED BRAKE lever automatically moves to the UP position and spoilers deploy.**

        ![Speed brake schematic](annex:AOTZ)
      presets:
        - correctAnswers:
            - text: The speed brake lever will automatically move to the up position and the spoilers will deploy as normal if all other required conditions are met.
          wrongAnswers:
            - text: The ground spoilers will deploy on landing if all other conditions are met, but flight spoilers will not deploy.
            - text: The spoilers will not deploy regardless of all other required conditions being met.
            - text: The flight spoilers will deploy on landing if all other conditions are met, but ground spoilers will not deploy.
- id: QHFWU
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
