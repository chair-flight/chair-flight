  templates:
    - type: simple
      question: What does a FLT CONTROL "LOW PRESSURE" light illuminated amber indicate?
      explanation: |-
        ### FCOM 9.10.2, Flight Control LOW PRESSURE Lights

        > Illuminated (amber) - • **indicates low hydraulic system (A or B) pressure to ailerons, elevator and rudder** • deactivated when associated FLIGHT CONTROL switch is positioned to STBY RUD and standby rudder shutoff valve opens.

        The light belongs to one system (A or B) and does not refer to the standby rudder system.
      presets:
        - correctAnswers:
            - text: Related hydraulic system pressure to ailerons, elevator and rudder is low.
          wrongAnswers:
            - text: The STBY RUD system pressure is low.
            - text: Both hydraulic systems pressure to ailerons, elevator and rudder are low.
            - text: This light is illuminated whenever the associated FLT CONTROL switch is in the OFF position.
- id: QTWOT
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: true-or-false
      question: ""
      explanation: |-
        ### FCOM 9.20.19, Flap and Slat Sequencing

        > When the FLAP lever is moved from the UP position to the 1, 2, 5, 10, 15, or 25 position, the TE flaps extend to the commanded position and the LE: • **flaps extend to the full extended position** and • slats extend to the extend position.
        >
