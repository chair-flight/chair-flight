        ### FCOM 9.20.25, Trailing Edge Uncommanded Motion

        > The FSEU shuts down the TE drive unit by **closing the TE flap bypass valve**. The TE flap shutdown cannot be reset by the flight crew and they **must use the alternate flap system** to control TE flaps.

