  templates:
    - type: simple
      question: What does the SPEED BRAKE DO NOT ARM light (located on the left forward panel) indicate when illuminated amber?
      explanation: |-
        ### FCOM 9.10.11, SPEED BRAKE DO NOT ARM Light

        > Illuminated (amber) – • **indicates abnormal condition or test inputs to the automatic speed brake system**, or • **during landing, indicates wheel speed has dropped below 60 kts, and the speedbrake lever is not in the DOWN position.**

        ![Speed brake schematic](annex:AOTZ)
      presets:
        - correctAnswers:
            - text: Indicates an abnormal condition or test input in the speed brake system and indicates that the wheel speed has dropped below 60 kts on landing and the speedbrake lever has not been moved to the down position.
          wrongAnswers:
            - text: The speed brakes must not be extended as airspeed currently too high for safe operation.
            - text: Indicates an abnormal condition or test input in the speed brake system.
            - text: Illuminated whenever forward thrust levers are advanced beyond takeoff thrust whilst aircraft on the ground
- id: QAWXB
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What is the purpose of the ALTERNATE FLAPS master switch, and why is the cover red?
      explanation: |-
        ### FCOM 9.10.3, ALTERNATE FLAPS Master Switch

        > ARM – **closes TE flap bypass valve, activates standby pump, and arms the ALTERNATE FLAPS position switch.**

        ### FCOM 9.20.22, Alternate Extension

        > When using alternate flap extension the LE flaps and slats are driven to the full extended position using power from the standby hydraulic system. [...] Note: **The LE devices cannot be retracted by the standby hydraulic system.**

        That is why the cover is red: extending the leading edge devices cannot be reversed in flight.

        ![Leading edge devices and trailing edge flaps](annex:AQAC)
      presets:
        - correctAnswers:
            - text: Closes the trailing edge flap bypass valve, activates standby pump, and arms ALTERNATE FLAPS position switch.  Red because the action of extending the leading edge devices cannot be reversed in flight.
          wrongAnswers:
            - text: Closes the trailing edge flap bypass valve, activates standby pump, and arms ALTERNATE FLAPS position switch.  Red because the action of extending the trailing edge devices cannot be reversed in flight.
            - text: Fully extends the leading and trailing edge flaps. Red because the action cannot be reversed, leading and trailing edge devices cannot be retracted once extended.
            - text: Fully extends the leading edge devices, and can extend and retract the trailing edge flaps. Red because the action cannot be reversed, leading and trailing edge devices cannot be retracted once extended.
