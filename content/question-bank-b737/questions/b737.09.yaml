- id: QGSKP
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: The yaw damper provides inputs to the rudder to provide which of the following, and what effect does it have on the rudder pedals?
      explanation: |-
        ### FCOM 9.20.13, Yaw Control

        > Either yaw damper is capable of providing **dutch roll prevention, gust damping and turn coordination**. **Yaw damper operation does not result in rudder pedal movement.** The pilot can override either main or standby yaw damper inputs using either the rudder pedals or trim inputs.

        ![Yaw control schematic](annex:AZIT)
      presets:
        - correctAnswers:
            - text: Provides Gust Dampening, Dutch roll prevention and Turn coordination. The rudder pedals are not displaced by yaw damper operation.
          wrongAnswers:
            - text: Provides Gust Dampening and Turn coordination. The rudder pedals are not displaced by yaw damper operation.
            - text: Provides Gust Dampening, Dutch roll prevention and Turn coordination. The rudder pedals are displaced by yaw damper operation to provide feedback to the pilot.
            - text: Provides Gust Dampening and Turn coordination. The rudder pedals move to match rudder movement for feedback to the pilot.
- id: QEABX
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: How does the Stall Identification system help the pilot identify and prevent further movement into a stalled condition?
      explanation: |-
        ### FCOM 9.20.12, Stall Identification

        > The EFS module **increases hydraulic system A pressure to the elevator feel and centering unit during a stall. This approximately doubles control column forces.** [...] During high AOA operations, the Stall Management/Yaw Damper (SMYD) reduces yaw damper commanded rudder movement.

        The system makes it harder to pull the column further back. It does not move the elevator.

        ![Pitch control schematic](annex:AAPH)
      presets:
        - correctAnswers:
            - text: Elevator Feel Shift Module increase, hydraulic system A pressure to the Elevator Feel and Centering Unit, significantly increasing the force required to move the control column rearwards to continue into a stalled condition.
          wrongAnswers:
            - text: The elevator feel shift module prevents the yaw damper from making any rudder movement, and the stick shaker activates.
            - text: Elevator Feel Shift Module increase, hydraulic system A pressure to the Elevator Feel and Centering Unit, moving the elevator to provide at least 15 degrees of nose down pitch.
            - text: The yaw damper provides 2 degrees of rudder movement, and the speed trim system automatically pushes the control column forward to warn the pilot that a stall condition was being approached.
- id: QCVNE
  subjectId: b737
  chapterId: "b737.09"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Selecting the Flap lever to the FLAP 1 Gate causes the LE Flaps to move to what position?
      explanation: |-
        ### FCOM 9.20.19, Flap and Slat Sequencing

        > When the FLAP lever is moved from the UP position to the 1, 2, 5, 10, 15, or 25 position, the TE flaps extend to the commanded position and the LE: • **flaps extend to the full extended position** and • slats extend to the extend position.
        >
        > When the FLAP lever is moved beyond the 25 position the TE flaps extend to the commanded position and the LE: • flaps remain at the full extended position and • **slats extend to the full extended position.**

        ![Leading edge devices and trailing edge flaps](annex:AQAC)
      presets:
        - correctAnswers:
            - text: Fully Extended
          wrongAnswers:
            - text: Flap 1 position
            - text: Flap 15 position.
            - text: Takeoff setting
