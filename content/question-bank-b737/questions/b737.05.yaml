      explanation: |-
        ### FCOM 5.10.6, Audio Control Panel (ACP)

        > The **keyline timer limits VHF transmission to approximately 35 seconds**. Approximately 25 to 30 seconds after any PTT is selected, the transceiver makes an aural tone (or, side-tone) in the headset. This tone continues for approximately five seconds. When the tone stops, the RF transmission also stops, and the radio is set to receive mode automatically. The radio remains in receive mode until the PTT is released, and selected again.
      presets:
