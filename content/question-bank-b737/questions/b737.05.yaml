  templates:
    - type: true-or-false
      question: ""
      explanation: |-
        ### FCOM 5.20.4, Passenger Address System

        > The highest priority audio input source is selected when the **flight crew selects "PA" on the audio control panel** and speaks through the boom microphone on a headset, the oxygen mask microphone or the hand-held microphone connected to the Passenger Address microphone jack. These methods will **preempt all music and other announcements**, including announcements in-progress being made using any Flight Attendant handset.
        >
        > The second priority level is announcements made using the **Flight Attendant handsets**. A Flight Attendant handset announcement has priority over the PRAM and entertainment systems.
        >
        > The third priority level is the **PRAM**. [...] Manually generated messages have priority over automatically generated messages, and both of these have priority over music being provided by the PRAM.
      statements:
        - text: A flight crew PA announcement preempts a Flight Attendant handset announcement in progress.
          answer: true
        - text: A Flight Attendant handset announcement in progress cannot be preempted by a flight crew PA announcement.
          answer: false
        - text: A Flight Attendant handset announcement has priority over PRAM messages.
          answer: true
        - text: Automatically generated PRAM messages have priority over manually generated PRAM messages.
          answer: false
        - text: Flight crew PA announcements preempt all music.
          answer: true
- id: QVMIM
  subjectId: b737
  chapterId: "b737.05"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: A radio transmits continuously without crew input (stuck microphone switch). What is the first action of the checklist?
      explanation: |-
        ### QRH NNC 5.2, Radio Transmit Continuous (Stuck Microphone Switch)

        > Condition: A radio transmits continuously without crew input.
        >
        > **MIC SELECTOR switches (all audio selector panels) ... FLT INT** This deselects radios and stops radio transmissions.
        >
        > The associated audio selector panel should stay on flight interphone. All other audio selector panels may be used normally.
      presets:
        - correctAnswers:
            - text: MIC SELECTOR switches, all audio selector panels, FLT INT.
          wrongAnswers:
            - text: ALT-NORM switch, ALT.
            - text: RTP OFF switch, push.
            - text: SERVICE INTERPHONE switch, OFF.
- id: QSBZA
  subjectId: b737
  chapterId: "b737.05"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: ACARS AC power is lost. What is the result?
      explanation: |-
        ### QRH NNC 5.1, ACARS Electrical Power Loss

        > Condition: ACARS AC power is lost.
        >
        > Note: The ACARS automatically **reverts to VOX MODE**. The **DATA MODE is inoperative**.
        >
        > Use normal voice procedures for reporting.
      presets:
        - correctAnswers:
            - text: ACARS reverts to VOX mode and the data mode is inoperative.
          wrongAnswers:
            - text: ACARS reverts to data mode and the voice mode is inoperative.
            - text: ACARS is transferred to the standby AC bus and works normally.
            - text: ACARS reverts to SATCOM data mode.
