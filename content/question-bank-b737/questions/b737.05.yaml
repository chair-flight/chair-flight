- id: QLWHS
  subjectId: b737
  chapterId: "b737.05"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: When the ALT-NORM switch on the Audio Control Panel (ACP) is selected to ALT, what is the result?
      explanation: |-
        ### FCOM 5.20.2, Degraded Audio System Operation

        > Audio system operation can be switched to a degraded mode by placing the ALT–NORM switch to ALT. In this mode, the ACP at that station is inoperative and the crewmember can only communicate on one radio.
        >
        > | CREW STATION AUDIO SYSTEM IN DEGRADED MODE | RADIO AVAILABLE FOR TRANSMISSION AND RECEPTION AT DEGRADED STATION |
        > | ------------------------------------------ | ------------------------------------------------------------------ |
        > | CAPTAIN                                    | **VHF–1**                                                          |
        > | FIRST OFFICER                              | **VHF–2**                                                          |
        > | OBSERVER                                   | **VHF–1**                                                          |
      presets:
        - correctAnswers:
            - text: ACP operates in a degraded mode, VHF-1 for Captain and Observer, VHF-2 for First Officer.
          wrongAnswers:
            - text: ACP operates in a degraded mode, VHF-1 for Captain, HF-1 for Observer and VHF-2 for First Officer.
            - text: All communications are routed through the ACP on the AFT Overhead Panel.
            - text: ACP operates in a degraded mode, VHF-2 for Captain, HF-2 for Observer, and VHF-1 for First Officer.
    - type: simple
      question: The First Officer's ACP ALT-NORM switch is selected to ALT. Which radio can the First Officer transmit and receive on?
      explanation: |-
        ### FCOM 5.20.2, Degraded Audio System Operation

        > Audio system operation can be switched to a degraded mode by placing the ALT–NORM switch to ALT. In this mode, the ACP at that station is inoperative and the crewmember can only communicate on one radio.
        >
        > | CREW STATION AUDIO SYSTEM IN DEGRADED MODE | RADIO AVAILABLE FOR TRANSMISSION AND RECEPTION AT DEGRADED STATION |
        > | ------------------------------------------ | ------------------------------------------------------------------ |
        > | CAPTAIN                                    | **VHF–1**                                                          |
        > | FIRST OFFICER                              | **VHF–2**                                                          |
        > | OBSERVER                                   | **VHF–1**                                                          |
      presets:
        - correctAnswers:
            - text: VHF-2 only.
          wrongAnswers:
            - text: VHF-1 only.
            - text: VHF-3 only.
            - text: Any radio selected with the transmitter selectors.
- id: QTXAM
  subjectId: b737
  chapterId: "b737.05"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: true-or-false
      question: ""
      explanation: |-
        ### FCOM 5.20.3, Degraded Audio System Operation

        > The ACP transmitter selectors are not functional. Any transmission from that station must be from the radio shown on the chart below. [...] The receiver switches are not functional, and only the usable radio is heard at a preset volume, through the headset. The speaker and speaker switch are not functional at that station. In addition, the **flight interphone and service interphone cannot be used**. [...]
        >
        > The mask and boom microphones can be used for transmission on the usable radio. The MASK–BOOM switch works normally in the degraded mode. [...] The **hand microphone is not usable** in the degraded mode of operation.
        >
        > Audio warnings for altitude alert, GPWS, and windshear are heard on an audio system operating in the degraded mode.
        >
        > An audio system operating in the degraded mode cannot access the passenger address system through the audio control panel. The crewmember can still use the service interphone handset and PA microphone if they are installed on the control stand.
      statements:
        - text: In the degraded audio mode, the hand microphone cannot be used.
          answer: true
        - text: In the degraded audio mode, the hand microphone can be used on the usable radio.
          answer: false
        - text: In the degraded audio mode, the flight interphone cannot be used.
          answer: true
        - text: In the degraded audio mode, the receiver switches still adjust the volume of the usable radio.
          answer: false
        - text: In the degraded audio mode, the MASK-BOOM switch works normally.
          answer: true
        - text: In the degraded audio mode, altitude alert, GPWS and windshear audio warnings are not heard.
          answer: false
        - text: In the degraded audio mode, the crewmember cannot access the passenger address system through the audio control panel.
          answer: true
- id: QWOIV
  subjectId: b737
  chapterId: "b737.05"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Selecting the Cockpit Voice Recorder to ON has what effect?
      explanation: |-
        ### FCOM 5.10.13, Cockpit Voice Recorder Switch

        > - **AUTO**: powers the cockpit voice recorder from first engine start until 5 minutes after last engine shutdown
        > - **ON**: powers the cockpit voice recorder **until first engine start**, then trips the switch to AUTO.
      presets:
        - correctAnswers:
            - text: Powers the cockpit voice recorder until first engine is started, then trips to AUTO.
          wrongAnswers:
            - text: Powers the cockpit voice recorder until 5 after the last engine shutdown.
            - text: Powers the cockpit voice recorder until the switch is moved to OFF
            - text: Powers the cockpit voice recorder after the first engine is started until 5 minutes after last engine shutdown.
- id: QQTUY
  subjectId: b737
  chapterId: "b737.05"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: true-or-false
      question: ""
      explanation: |-
        ### FCOM 5.20.6, Cockpit Voice Recorder

        > The cockpit voice recorder uses **four independent channels** to record flight deck audio for **120 minutes**. Recordings older than 120 minutes are automatically erased. One channel records flight deck area conversations using the area microphone. The other channels record individual ACP output (headset) audio and transmissions for the pilots and observer. The voice recorder is equipped with a locator beacon operable for 90 days.

        ### FCOM 5.10.12, Cockpit Voice Recorder

        > **Area Microphone**: Activated when an engine is started or the VOICE RECORDER switch is placed in the ON position.
        >
        > **ERASE Switch (red)**: Push (2 seconds) – all four channels are erased. Operative only when airplane is on ground and parking brake is set.
        >
        > **TEST Switch**: Push – for 5 seconds: STATUS light flashes once. A tone may be heard through a headset plugged into HEADPHONE jack.
      statements:
        - text: The cockpit voice recorder records on four independent channels.
          answer: true
        - text: The cockpit voice recorder records on two independent channels.
          answer: false
        - text: The cockpit voice recorder records the last 120 minutes of flight deck audio.
          answer: true
        - text: The cockpit voice recorder records the last 30 minutes of flight deck audio.
          answer: false
        - text: The cockpit voice recorder ERASE switch is operative only when the airplane is on the ground with the parking brake set.
          answer: true
        - text: The cockpit voice recorder ERASE switch can be used in flight when the VOICE RECORDER switch is AUTO.
          answer: false
        - text: The cockpit voice recorder area microphone is activated when an engine is started or the VOICE RECORDER switch is placed to ON.
          answer: true
