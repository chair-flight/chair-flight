  templates:
    - type: simple
      question: "The rain removal system for the forward windows comprises the following:"
      explanation: |-
        ### FCOM 3.20.4, Windshield Wipers

        > The rain removal system for the forward windows consists of **windshield wipers and a permanent rain repellent coating** on the windows.

        Window heat is an anti-ice system, not part of rain removal.
      presets:
        - correctAnswers:
            - text: Windshield wipers, hydrophobic rain repellent coating.
          wrongAnswers:
            - text: Heated windows, Windshield wipers,
            - text: Windshield wipers, heated windows, hydrophobic rain repellent coating.
            - text: Windshield wipers.
- id: QSSWN
  subjectId: b737
  chapterId: "03"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What do the green ON lights indicate above the Window heat switches?
      explanation: |
        > ### Window Heat ON Lights
        >
        > - **Illuminated (green)**: – window heat is being applied to selected window(s).
        > - **Extinguished**:
        >   - switch is OFF, or
        >   - an overheat is detected, or
        >   - a system failure has occurred
        >   - system is at correct temperature.
      presets:
        - correctAnswers:
            - text: Illuminated means heat being applied to windows, extinguished means windows at correct temperature
          wrongAnswers:
            - text: Illuminated means window heat needs to be switched on for that window, extinguished means heat now being applied to that window.
            - text: Extinguished means heat still being applied to window but not yet at correct operating temperature, illuminated means window at correct temperature.
            - text: Illuminated means the window Overheat system has activated.
