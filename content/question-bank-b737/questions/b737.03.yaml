    - type: true-or-false
      question: ""
      explanation: |
        > ### Probe and Sensor Heat
        >
        > Pitot probes, the total air temperature probe and the alpha vanes are electrically heated. Static ports are not heated. When operating on standby power, only the captain’s pitot probe is heated, however, the CAPT PITOT light does not illuminate for a failure.
      statements:
        - text: |
            When operating on standby power only the Captain's pitot probe is still 
            heated;

            If the Captain's pitot probe heating fails in this condition, there is no 
            CAPT PITOT alert given.
          answer: true
- id: QETYR
  subjectId: b737
  chapterId: "03"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: true-or-false
      question: ""
      explanation: |-
        > ### Wing Anti–Ice System Operation
        >
        > On the ground, positioning the WING ANTI–ICE switch ON opens both control valves if thrust on both engines is below the setting for takeoff warning activation and the temperature inside both wing distribution ducts is less than the thermal switch activation temperature.
        >
        > Both valves close if either engine thrust is above the takeoff warning setting or either temperature sensor senses a duct overtemperature. The valves automatically reopen if thrust on both engines is reduced and both temperature sensors are cool.

        The wing anti-ice valves close if the forward thrust levers are advanced above the takeoff warning setting only on the ground.

        ![Wing anti-ice system schematic](annex:ADBL)
      statements:
        - text: On the ground and in flight, the wing anti-ice valves close if the forward thrust levers are advanced above the takeoff warning setting.
          answer: false
- id: QMNIV
  subjectId: b737
  chapterId: "03"
