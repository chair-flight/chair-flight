- id: QFMXV
  subjectId: b737
  chapterId: "03"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: |
        Whilst on the ground with WING ANTI-ICE selected ON, what is the 
        result of advancing the thrust levers beyond the take-off warning setting?
      explanation: |-
        > Both valves close if either engine thrust is above the takeoff warning setting or either temperature sensor senses a duct overtemperature. The valves automatically reopen if thrust on both engines is reduced and both temperature sensors are cool.

        The switch flicks back to **OFF** when the weight on wheels switch detects the aircraft is airborne.

        > The WING ANTI–ICE switch automatically trips OFF at lift–off when the air/ground sensor goes to the air mode

        ![Wing anti-ice system schematic](annex:ADBL)
      presets:
        - correctAnswers:
            - text: Both wing anti-ice control valves close and the WING ANTI-ICE switch remains in the ON position
          wrongAnswers:
            - text: Both wing anti-ice control valves remain open and the WING ANTI-ICE switch remains set at ON.
            - text: Both wing anti-ice control valves remain open and the WING ANTI-ICE switch trips OFF.
            - text: Both wing anti-ice control valves close and the WING ANTI-ICE switch trips OFF.
- id: QVXIY
  subjectId: b737
  chapterId: "03"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: If the BLEED switch for the number one engine is in the OFF position, will the engine thermal anti-ice continue to work for that engine?
      explanation: |-
        ### FCOM 3.20.5, Engine Anti-Ice System

        > Engine bleed air thermal anti–icing prevents the formation of ice on the engine cowl lip. **Engine anti–ice operation is controlled by individual ENG ANTI–ICE switches.** The engine anti–ice system may be operated on the ground and in flight.

        > Each cowl anti–ice valve is electrically controlled and pressure actuated.

        The cowl anti-ice valve takes bleed air upstream of the engine bleed air valve, so it works with the engine BLEED switch OFF and does not depend on the isolation valve.

        ![Engine anti-ice system schematic](annex:AGBZ)
      presets:
        - correctAnswers:
            - text: Yes, because the Engine Anti-Ice Valve is independent of the Bleed Air Valve.
          wrongAnswers:
            - text: No.
            - text: Only if the ISOLATION VALVE is in the open position.
