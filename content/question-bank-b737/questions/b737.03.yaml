- id: QXGZE
  subjectId: b737
  chapterId: "03"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Positioning ENG ANTI-ICE switch to on has what effect?
      explanation: |
        > ### 3 ENGINE ANTI–ICE Switches
        >
        > - **ON**
        >   - related cowl anti–ice valve is open
        >   - stick shaker logic is set for icing conditions.
        >   - Green TAI indication shows on the engine display.
        > - **OFF**
        >   - related cowl anti–ice valve is closed
        >   - stick shaker logic returns to normal if wing anti–ice has not been used in flight.
        >   - Green TAI indication on the engine display extinguishes.
      presets:
        - correctAnswers:
            - text: Stall warning logic adjusts stick shaker and minimum maneuver speed bars on airspeed indicator.
          wrongAnswers:
            - text: Adjusted stall warning logic for stick shaker, minimum maneuver speed bars on airspeed indicator, and automatically adjusted FMC displayed VREF; remain for rest of flight.
            - text: Adjusted stall warning logic for stick shaker, minimum maneuver speed bars on airspeed indicator, and automatically adjusted FMC displayed VREF; return to normal when engine anti-ice is positioned to OFF.
            - text: FMC displayed VREF is adjusted automatically.
