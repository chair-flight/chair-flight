  templates:
    - type: simple
      question: With the BUS TRANSFER switch in the AUTO position; how do the BTBs operate?
      explanation: |-
        ### FCOM 6.10.6, BUS TRANSFER Switch

        > AUTO (guarded position) – **BTBs operate automatically to maintain power to AC transfer busses from any operating generator or external power** • DC cross tie relay automatically provides normal or isolated operation OFF – isolates AC transfer bus 1 from AC transfer bus 2 if one IDG is supplying • DC cross tie relay opens to isolate DC bus 1 from DC bus 2

        ![AC power](annex:APMC)

        ![Electrical power schematic](annex:AVWS)
      presets:
        - correctAnswers:
            - text: BTBs automatically maintain power to AC Transfer busses from any operating generator or external power.
          wrongAnswers:
            - text: BTBs automatically maintain power to DC Bus 1 and DC Bus 2 through the DC Cross Tie Relay.
            - text: BTBs isolate Transfer Bus 1 from Transfer Bus 2, if only 1 IDG is supplying power, DC Cross Tie Relay closes to connect DC Bus 1 to DC Bus 2.
            - text: BTBs isolate Transfer Bus 1 from Transfer Bus 2, if only 1 IDG is supplying power, DC Cross Tie Relay opens to isolate DC Bus 1 from DC Bus 2.
