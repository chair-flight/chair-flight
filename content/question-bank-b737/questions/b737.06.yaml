- id: QXBKZ
  subjectId: b737
  chapterId: "b737.06"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: If the APU is powering Transfer Bus 1 and GEN 2 is powering Transfer Bus 2, what will occur when the Ground Power (GRD PWR) Switch is turned to ON?
      explanation: |-
        ### FCOM 6.20.3, AC Power

        > With the airplane on the ground and both generator control switches OFF, or with both engines shut down, selecting the GRD PWR switch ON **connects external power to both transfer busses.** Likewise, selecting either APU GEN switch ON connects APU power to both transfer busses. **Whichever source is selected last powers both busses.** It is not possible to power one transfer bus with external power and one transfer bus with APU power.

        ### FCOM 6.10.7, SOURCE OFF Lights

        > Illuminated (amber) – no source has been manually selected to power the related transfer bus, or the manually selected source has been disconnected

        ![AC power](annex:APMC)

        ![Electrical power schematic](annex:AVWS)
      presets:
        - correctAnswers:
            - text: Ground Power will power both Transfer Busses. The SOURCE OFF lights will remain extinguished.
          wrongAnswers:
            - text: Ground Power will power Transfer Bus 1 and GEN 2 will power Transfer Bus 2.
            - text: Ground Power will power both Transfer Busses and the SOURCE OFF lights will illuminate.
            - text: The APU will power Transfer Bus 1 and Ground Power will power Transfer Bus 2.
