        > Either generator or the APU can supply power to both transfer busses. If the BUS TRANS switch is in the AUTO position and the source powering the transfer bus is disconnected or fails, **the source powering the opposite transfer bus automatically picks up the unpowered transfer bus through the BTBs.**

