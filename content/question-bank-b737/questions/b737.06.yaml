- id: QPIVO
  subjectId: b737
  chapterId: "b737.06"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: If an IDG fails and the APU is not available to power the related Transfer Bus, what occurs first if an electrical overload is sensed?
      explanation: |-
        ### FCOM 6.20.4, Automatic Load Shedding (Engine Generators)

        > For single generator operation, the system is designed to shed electrical load incrementally based on actual load sensing. **The galleys and main bus on transfer bus 2 are shed first**; if an overload is still sensed, the galleys and main bus on transfer bus 1 are shed; if overload still exists, the IFE buses are shed.

        ![AC power](annex:APMC)

        ![Electrical power schematic](annex:AVWS)
      presets:
        - correctAnswers:
            - text: Automatic load shedding of the galleys and main bus on Transfer Bus 2
          wrongAnswers:
            - text: Automatic load shedding of the galleys and main bus on Transfer Bus 1.
            - text: Automatic load shedding of the IFE Busses.
            - text: Automatic load shedding of the galley and main busses on both Transfer Busses.
