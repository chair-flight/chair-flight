- id: QGJDQ
  subjectId: b737
  chapterId: "14"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What is the function of the landing gear transfer unit?
      explanation: |-
        ### FCOM 14.20.2, Landing Gear Transfer Unit

        > Hydraulic system B pressure is available for raising the landing gear through the landing gear transfer unit. Hydraulic system B supplies the volume of hydraulic fluid required to raise the landing gear at the normal rate when all of the following conditions exist: • airborne • **No. 1 engine RPM drops below a limit value** • LANDING GEAR lever is positioned UP • either main landing gear is not up and locked.
      presets:
        - correctAnswers:
            - text: It uses system B to help raise the gear when the output of hydraulic system A is insufficient.
          wrongAnswers:
            - text: It ensures system A can operate the leading edge flaps and slats after the loss of system B.
            - text: It is used to lower the gear after the loss of system A.
