- id: QBAOO
  subjectId: b737
  chapterId: "14"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: You select the AUTO BRAKE to RTO on the ground, and the AUTO BRAKE DISARM light illuminates for 2 seconds then extinguishes.  What is the fault?
      explanation: |
        > ### AUTO BRAKE DISARM Light
        > Illuminated (amber) –
        > - SPEED BRAKE lever moved to down detent during RTO or landing
        > - manual brakes applied during RTO or landing
        > - thrust lever(s) advanced during RTO or landing
        >   - except during first 3 seconds after touchdown for landing
        > - landing made with RTO selected
        > - **RTO mode selected on ground**
        >   - **illuminates for one to two seconds then extinguishes**
        > - a malfunction exists in automatic braking system.
      presets:
        - correctAnswers:
            - text: The system has passed the self test and there is NO fault.
          wrongAnswers:
            - text: The Auto Brake has failed the self test and should be re-cycled to off then back to RTO, if the light does not illuminate this time the system is serviceable.
            - text: You do not have the parking brake set.
            - text: Autobrake is unavailable.
- id: QGBOF
  subjectId: b737
  chapterId: "14"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Other than moving the Autobrake selector to OFF, how else can Autobraking be cancelled?
      explanation: |-
        > **Autobrake – Disarm**
        >
        > The pilots may disarm the autobrake system by moving the selector switch to the OFF position. This action does not cause the AUTO BRAKE DISARM light to illuminate. After braking has started, any of the following pilot actions disarm the system immediately and illuminate the AUTO BRAKE DISARM light:
        >   - moving the SPEED BRAKE lever to the down detent
        >   - advancing the forward thrust lever(s), except during the first 3 seconds after touchdown for landing
        >   - applying manual brakes.

        {{wrong-answers-table}}
      presets:
        - correctAnswers:
            - text: Applying manual brakes or Moving Speed Brake lever to DOWN detent.
          wrongAnswers:
            - text: Applying manual brakes, Moving Speed Brake lever to DOWN detent or Advancing forward thrust levers immediately after touchdown.
              mistake: Immediately applying thrust will not cancel autobrake. Only after 3 seconds.
            - text: Applying manual brakes
            - text: Advancing forward thrust levers immediately after touchdown or Applying manual brakes
