        > With RTO selected, if the takeoff is rejected prior to wheel speed reaching 88 knots autobraking is not initiated, the AUTO BRAKE DISARM light does not illuminate and the RTO autobrake function remains armed. If the takeoff is rejected after reaching a wheel speed of 88 knots, maximum braking is applied automatically when the forward thrust levers are retarded to IDLE.

