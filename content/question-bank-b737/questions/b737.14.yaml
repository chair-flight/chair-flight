- id: QTLSN
  subjectId: b737
  chapterId: "14"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Which of the following statements is false for Antiskid Protection.
      explanation: |
        > ### Antiskid Protection
        >
        > Antiskid protection is provided in the normal and alternate brake systems. The normal brake hydraulic system provides each main gear wheel with individual antiskid protection. When the system detects a skid, the associated antiskid valve reduces brake pressure until skidding stops. **The alternate brake hydraulic system works similar to the normal system however antiskid protection is applied to main gear wheel pairs instead of individual wheels**.
      presets:
        - correctAnswers:
            - text: Each wheel is provided with individual Antiskid protection in normal and alternate braking
          wrongAnswers:
            - text: All of the above are false.
            - text: Antiskid protection is provided for both normal and alternate brake systems.
            - text: The Antiskid system provides skid, locked wheel, touchdown and hydroplane protection in both normal and alternate braking.
- id: QXDTF
