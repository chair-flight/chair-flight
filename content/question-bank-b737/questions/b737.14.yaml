  templates:
    - type: simple
      question: In which position should the LANDING GEAR lever be, if possible, when you operate the manual gear extension handles?
      explanation: |-
        ### QRH 14.18, Manual Gear Extension

        > LANDING GEAR lever. . . . . . . . . . . . . . . . . . . **OFF** Manual gear extension handles. . . . . . . . . . . . Pull […] Wait 15 seconds after the last manual gear extension handle is pulled: LANDING GEAR lever . . . . . . . . . . . . . . . . DN

