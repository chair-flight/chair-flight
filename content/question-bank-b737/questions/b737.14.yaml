  templates:
    - type: simple
      question: Which of the following statements is true for the Nose Wheel Steering system
      explanation: |
        > ### Nose Wheel Steering
        >
        > Nose wheel steering is available when the nose gear is in the down position and compressed by weight of the airplane. (...) Alternate nose wheel steering can be activated to provide system B pressure to the nose wheels when the NOSE WHEEL STEERING switch is placed to ALT
      presets:
        - correctAnswers:
            - text: Nose wheel steering is normally powered by hydraulic system A and as well as being in the down position, the nose landing gear must be compressed for nose wheel steering to be available.
          wrongAnswers:
            - text: If alternate nose wheel steering is activated then the standby hydraulic system operates the nose wheel steering.
            - text: If alternate nose wheel steering is activated then the standby hydraulic system operates the nose wheel steering and as well as being in the down position, the nose landing gear must be compressed for nose wheel steering to be available.
            - text: Nose wheel steering is normally powered by hydraulic system A, If alternate nose wheel steering is activated then the standby hydraulic system operates the nose wheel steering and As well as being in the down position, the nose landing gear must be compressed for nose wheel steering to be available.
- id: QSWGN
  subjectId: b737
  chapterId: "14"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: true-or-false
      question: ""
      explanation: |
        > ### Brake Accumulator
        >
        > The brake accumulator is pressurized by hydraulic system B. If both normal and alternate brake system pressure is lost, trapped hydraulic pressure in the brake accumulator can still provide several braking applications or parking brake application.
      statements:
        - text: If both normal and alternative brake system pressure is lost it is still possible to use the brakes to bring the aircraft to a complete stop after landing?
          answer: true
- id: QNNFD
  subjectId: b737
  chapterId: "14"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Which of the following statements is true, when the landing gear Manual Extension Access Door is open?
      explanation: |
        ### Normal landing gear extension is possible if Hydraulic system A operational.

        > Hydraulic power for retraction, extension, and nose wheel steering is normally supplied by hydraulic system A.

        ### The landing gear cannot be retracted.

        ### The landing gear can be manually lowered with the landing gear lever in ANY position.

        > With the manual extension access door open:
        > - manual landing gear extension is possible with the LANDING GEAR lever in any position
      presets:
        - correctAnswers:
            - text: All of the options are true
          wrongAnswers:
            - text: Normal landing gear extension is possible if Hydraulic system A operational.
            - text: The landing gear cannot be retracted.
            - text: The landing gear can be manually lowered with the landing gear lever in ANY position.
- id: QCWIN
  subjectId: b737
  chapterId: "14"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Which hydraulic system operates the parking brake?
      explanation: |
        > ### Parking Brake
        >
        > The parking brake can be set with either A or B hydraulic systems pressurized. If A and B hydraulic systems are not pressurized, parking brake pressure is maintained by the brake accumulator. Accumulator pressure is shown on the HYD BRAKE PRESS indicator.
      presets:
        - correctAnswers:
            - text: All options are correct
          wrongAnswers:
            - text: Hydraulic system A
            - text: Brake accumulator
            - text: Hydraulic system B
