- id: QGLMO
  subjectId: b737
  chapterId: "08"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: How many fire extinguisher bottles are fitted for the Cargo compartments?
      explanation: |-
        ### FCOM 8.20.6, Cargo Compartment Fire Suppression

        > A single fire extinguisher bottle is installed in the air conditioning mix bay on the forward wing spar. Detection of a fire in either the forward or aft compartment will cause the FWD or AFT cargo fire warning light to illuminate. **The extinguisher is armed by pushing the appropriate cargo fire ARMED switch.** Once armed, the system is discharged by pushing the cargo fire DISCH switch. This results in the total discharge of the bottle contents into the selected compartment.

        ![Cargo fire suppression system](annex:AGVM)
      presets:
        - correctAnswers:
            - text: 1 fire extinguisher bottle, that can be selected to be discharged into either cargo hold.
          wrongAnswers:
            - text: 2 fire extinguisher bottles, one for forward cargo hold, and one for rear cargo hold.
            - text: 2 fire extinguisher bottles, 1 rapid discharge bottle and one smaller slow discharge bottle.
            - text: 1 fire extinguisher bottle that can only be discharged into forward cargo hold.
