      explanation: |-
        ### FCOM 8.10.1, Fire Warning BELL CUTOUT Switch

        > Push – • **extinguishes both master FIRE WARN lights** • **silences the fire warning bell** • silences the remote APU fire warning horn (on the ground only) • resets the system for additional warnings.

        Pushing either master FIRE WARN light has the same effect (FCOM 8.10.3). The bell does not depend on the fire condition clearing.
      presets:
        - correctAnswers:
            - text: Pushing Master FIRE WARN light or pushing the BELL CUTOUT switch located on the Overheat/Fire Protection panel.
          wrongAnswers:
            - text: Only by pushing the Master FIRE WARN light
            - text: The fire warning bell is only silenced once the condition causing the Overheat or Fire warning has been removed.
            - text: Pushing the Master FIRE WARN light, or pushing the bell mute button located next to the speaker on the flight deck ceiling.
    - type: simple
      question: How can the Fire Warning Bell be silenced on the flight deck?
      explanation: |-
        ### FCOM 15.10.1, Fire Warning and Master Caution System

        > Master Fire Warning (FIRE WARN) Lights [...] Push – extinguishes both master FIRE WARN lights • **silences fire warning bell** • silences remote APU fire warning horn • resets system for additional warnings. Note: **Pushing fire warning bell cutout switch on overheat/fire protection panel results in the same actions.**

        The APU ground control panel horn cutout only silences the remote APU fire warning horn on the ground, not the flight deck bell.
      presets:
        - correctAnswers:
            - text: Push the master fire warn lights, push fire warning bell cutout switch.
          wrongAnswers:
            - text: Fire bell can only be silenced by pressing either master fire warn light.
            - text: Push the master fire warn lights, press the horn cutout of the APU ground control panel, push fire warning bell cutout switch.
            - text: Push the Master Fire Warn lights, press the Horn Cutout of the APU Ground Control Panel.
