- id: QQFLA
  subjectId: b737
  chapterId: "08"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What is the effect of pulling up the No1 Fire DISCH switch?
      explanation: |-
        ### FCOM 8.20.2, Engine Fire Extinguishing

        > Pulling the engine fire switch up: • closes **both the engine fuel shutoff valve and the spar fuel shutoff valve** • closes the engine bleed air valve [...] • trips the generator control relay and breaker • closes the hydraulic fluid shutoff valve. The engine driven hydraulic pump LOW PRESSURE light is deactivated • **disables thrust reverser** for the related engine • allows the engine fire switch to be rotated for discharge • **arms one discharge squib on each engine fire extinguisher bottle.**

        The bleed valve closure also removes wing anti-ice for that wing and closes the pack valve. Nothing is discharged until the switch is rotated.

        ![Engine fire extinguisher system](annex:ARXZ)
      presets:
        - correctAnswers:
            - text: Closes engine and spar fuel shutoff valves, closes engine bleed air valve, trips IDG control relay, closes hydraulic fluid shutoff valve and isolates EDP low pressure light, disables thrust reverser, arms one Squib on both engine fire bottles, and allows the DISCH switch to be rotated left or right.
          wrongAnswers:
            - text: Closes engine and spar fuel shutoff valves, closes inlet valve to both Air Conditioning Packs, trips IDG control relay, arms both Squibs on both engine fire bottles, and allows the DISCH switch to be rotated left or right.
            - text: Closes engine fuel shutoff valve, closes engine bleed air valve, trips IDG control relay, closes hydraulic fluid shutoff valve and isolates EDP low pressure warning light, disables thrust reverser, arms Squib on No1 engine fire bottle, and allows the DISCH switch to be rotated to the left to discharge bottle into N01 engine.
            - text: Extinguishes Master Caution and Fire Warning lights, silences Fire Warning Bell, shuts down No1 engine, and discharges No1 Fire Bottle into No1 engine.
