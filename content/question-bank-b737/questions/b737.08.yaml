- id: QZYCW
  subjectId: b737
  chapterId: "08"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Why is there a fire warning and a MASTER CAUTION for an engine fire, but only a fire warning for an APU fire?
      explanation: |-
        ### FCOM 8.20.2, Engine Overheat and Fire Detection

        > The indications of an engine overheat are: • both MASTER CAUTION lights illuminate • the OVHT/DET system annunciator light illuminates • the related ENG OVERHEAT light illuminates.

        ### FCOM 8.20.4, APU Fire Detection

        > A single fire detection loop is installed on the APU. As the temperature of the detector increases to a predetermined limit, **the detector senses a fire condition.**

        Engine detectors sense an overheat at a lower temperature than a fire, so the overheat comes first. The APU detector senses a fire only.
      presets:
        - correctAnswers:
            - text: An engine overheat is sensed before an engine fire, but there is no overheat detection for the APU.
          wrongAnswers:
            - text: The MASTER CAUTION does not illuminate for an APU fire because extinguishing is fully automatic.
            - text: An APU fire does not need immediate attention from the crew.
            - text: The failure of the engine triggers a MASTER CAUTION.
