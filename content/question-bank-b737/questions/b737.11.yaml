            - text: ANP equals RNP, and the bars turn amber once the deviation is within the ANP bar limits for 5 continuous seconds.
          wrongAnswers:
            - text: Loss of one GPS.
            - text: Loss of one GPS and one IRS.
            - text: Loss of one GPS, one IRS and one DME.
