  templates:
    - type: simple
      question: Power to the FMC is lost for more than 10 seconds in flight while using LNAV and VNAV. What must you do once power is restored?
      explanation: |-
        ### FCOM 11.32.5, Loss of FMC Electrical Power

        > If power is lost for more than ten seconds in flight: • LNAV and VNAV disengage • all entered data is retained by the FMC, and when power is restored the RTE LEGS page is displayed with the scratchpad message **SELECT ACTIVE WPT/LEG.**
        >
        > **Before LNAV can engage, the FMC must be instructed how to return to the route. Select the desired active waypoint and proceed direct or intercept a course to the waypoint.**
      presets:
        - correctAnswers:
            - text: Select the active waypoint, then proceed direct or intercept a course, and re-engage the modes.
          wrongAnswers:
            - text: Continue the rest of the flight without LNAV or VNAV, as they are no longer available.
            - text: Re-enter the whole route, as all FMC data is lost.
