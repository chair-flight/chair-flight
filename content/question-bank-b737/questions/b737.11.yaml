- id: QHHCS
  subjectId: b737
  chapterId: "11"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: The image below shows the IRS panel located on the AFT overhead panel, for later aircraft YW130 through YW164.  Other than OFF, what are the switch positions in the clockwise order?
      explanation: |-
        ### FCOM 11.10.21, Inertial Reference System (IRS) Mode Selector

        > OFF – • alignment is lost
        >
        > **ALIGN** – • rotating the selector from OFF to ALIGN initiates the alignment cycle
        >
        > **NAV** (detent position) – • system enters the NAV mode after completion of the alignment cycle and entry of present position
        >
        > **ATT** – provides only attitude and heading information

        Clockwise from OFF the positions are ALIGN, NAV, ATT.
      presets:
        - correctAnswers:
            - text: ALIGN, NAV, ATT.
          wrongAnswers:
            - text: NAV, ALIGN, ATT.
            - text: NAV, ALIGN, GLS
            - text: ATT, ALIGN, NAV.
