  templates:
    - type: true-or-false
      question: ""
      explanation: |-
        ### FCOM 11.31.16, Greater Than 99 Numbered Waypoints

        > When the quantity of numbered waypoints **exceeds 99** the identifier will use the first two characters of the entry followed by the smallest three-digit sequence number beginning with 100. Examples: • SEA104/74 becomes SE100 • SEA104/OLM064 becomes SE101.

        The FMC carries on past 99, so the limit does not exist.
      statements:
        - text: A total of 99 numbered waypoints cannot be exceeded for any single route.
          answer: false
