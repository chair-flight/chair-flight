- id: QMVMW
  subjectId: b737
  chapterId: "11"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Which indications are correct for a single FMC failure (left FMC fails)?
      explanation: |-
        ### FCOM 11.32.5, Single FMC Failure

        > If the left FMC fails, the FMC alert light will illuminate. **The FMC/CDU FAIL light will appear on both CDUs**, and both CDUs will display failure modes. VTK will appear on the left navigation display. **LNAV and VNAV will disengage**, but can be reengaged if autopilot B is in use or is selected. **After 25 to 30 seconds, the left navigation display will display failure information.**

        From YW140 the MENU page appears on both CDUs in place of the FAIL light.
      presets:
        - correctAnswers:
            - text: FMC P/RST amber light illuminates, FAIL light on FMC CDU illuminates, LNAV and VNAV disconnect if engaged, failure information displayed on left ND after delay of 25 to 30 seconds.
          wrongAnswers:
            - text: FMC P/RST amber light illuminates, A/P P/RST light illuminates, LNAV and VNAV disconnect if engaged, left ND not available.
            - text: FMC CDU FAIL light illuminates, left FMC CDU screen blanks, left ND screen blanks, LNAV disengages with VNAV remaining available.
            - text: FMC P/RST amber light illuminates, normal operation continues with remaining functioning FMC automatically driving both ND screens.
