- id: QRLKO
  subjectId: b737
  chapterId: "11"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: true-or-false
      question: ""
      explanation: |-
        ### FCOM 11.20.5, Loss of Alignment

        > If an IRS loses both AC and DC power, the alignment is lost. Alignment can be lost if the MSU switch is moved out of the NAV position.
        >
        > If alignment is lost in–flight, **the navigation mode (including present position and ground speed outputs) is inoperative for the remainder of the flight.** However, selecting ATT allows the attitude mode to be used to relevel the system and provide an attitude reference.
      statements:
        - text: If IRS alignment is lost in flight, the navigation mode becomes inoperative for the remainder of the flight.
          answer: true
