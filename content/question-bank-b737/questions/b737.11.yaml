      question: In flight, LNAV and VNAV disengage, the FMC alert light illuminates, the FMC/CDU FAIL light shows on the left CDU and VTK appears in amber on the left navigation display. What is the most likely cause?
      explanation: |-
        ### FCOM 11.32.5, Single FMC Failure

        > If the left FMC fails, the FMC alert light will illuminate. **The FMC/CDU FAIL light will appear on both CDUs**, and both CDUs will display failure modes. VTK will appear on the left navigation display. **LNAV and VNAV will disengage**, but can be reengaged if autopilot B is in use or is selected. **After 25 to 30 seconds, the left navigation display will display failure information.**
      presets:
        - correctAnswers:
            - text: Failure of the left FMC.
          wrongAnswers:
            - text: Loss of power to both ADIRUs.
            - text: Loss of both IRSs.
            - text: End of descent deleted from the active route.
- id: QDEKF
  subjectId: b737
