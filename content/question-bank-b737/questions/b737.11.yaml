      question: What colour is the route on the Nav display when you activate a route by pressing the R6 switch?
      explanation: |-
        ### FCOM 11.31.16, Navigation Displays

        > • an inactive route is displayed as a cyan dashed line • **an activated but not yet executed route is displayed as a cyan dashed line** • the active route is displayed in magenta • modifications to an active route are displayed as dashed white lines

