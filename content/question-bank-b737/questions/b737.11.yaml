  templates:
    - type: simple
      question: What are the LNAV engagement criteria when more than 3 nm from the active route leg?
      explanation: |-
        ### FCOM 11.31.10, Lateral Navigation (LNAV)

        > If selected, LNAV engages when laterally within 3 nautical miles of the active route leg. **If outside of 3 nautical miles of the active route leg, LNAV engages if on an intercept heading of 90 degrees or less and the intercept will occur before the active waypoint.**
      presets:
        - correctAnswers:
            - text: The aircraft must be on an intercept heading of 90 degrees or less, with the intercept before the active waypoint.
          wrongAnswers:
            - text: The aircraft can be on any heading.
            - text: The aircraft must be on an intercept heading, but not necessarily before the active waypoint.
            - text: LNAV cannot be engaged more than 3 nm from the active route.
