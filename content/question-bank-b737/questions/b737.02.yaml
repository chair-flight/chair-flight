- id: QDQCB
  subjectId: b737
  chapterId: "b737.02"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: true-or-false
      question: ""
      explanation: |-
        ### FCOM 2.31.5, Zone Temperature Control

        > The packs produce an air temperature that satisfies the zone which requires the **most cooling**. Zone temperature is controlled by introducing the proper amount of trim air to the zone supply ducts. The quantity of trim air is regulated by individual trim air modulating valves.

        Trim air is decompressed bleed air that has not been cooled. Mixing it with the cold pack air lets one pack satisfy several zones.

        ![Air conditioning distribution schematic](annex:ANKO)
      statements:
        - text: The packs produce the air temperature required by the zone that needs the most cooling, and trim air warms the other zones.
          answer: true
        - text: The packs produce the air temperature required by the zone that needs the least cooling, and the other zones are cooled with trim air.
          answer: false
- id: QDGCB
  subjectId: b737
  chapterId: "b737.02"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: A flight deck zone temperature control fails. What happens?
      explanation: |-
        ### FCOM 2.31.5, Zone Temperature Control Modes

        > Failure of the primary flight deck temperature control will cause an **automatic switch to the back up control** and will illuminate the CONT CAB amber ZONE TEMP light upon Master Caution Recall. Failure of both the primary and standby controls will illuminate the lights automatically.

        ![Air conditioning distribution schematic](annex:ANKO)
      presets:
        - correctAnswers:
            - text: Control switches automatically to the backup controller and the CONT CAB ZONE TEMP light illuminates on Master Caution Recall.
          wrongAnswers:
            - text: The flight deck is supplied with fixed 24°C air by the left pack.
            - text: The CONT CAB ZONE TEMP light illuminates at once and the trim air valve closes.
            - text: Control transfers to the forward cabin Temperature Selector.
    - type: simple
      question: Pressing Master Caution Recall illuminates the CONT CAB ZONE TEMP light. What does this indicate?
      explanation: |-
        ### FCOM 2.10.9, ZONE TEMP Lights

        > During Master Caution light recall:
        > - CONT CAB indicates **failure of the flight deck primary or standby temperature control**
        > - either FWD CAB or AFT CAB indicates failure of the associated zone temperature control
        > - lights will extinguish when Master Caution is reset

        ![Air conditioning distribution schematic](annex:ANKO)
      presets:
        - correctAnswers:
            - text: Failure of either the flight deck primary or the standby temperature control.
          wrongAnswers:
            - text: A flight deck duct overheat.
            - text: Failure of both the primary and standby flight deck temperature controls.
            - text: Failure of the forward cabin temperature control.
- id: QZUHX
  subjectId: b737
  chapterId: "b737.02"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What happens if the primary pack control of one pack fails?
      explanation: |-
        ### FCOM 2.31.2, Pack Temperature Control

        > If a primary pack control fails, the affected pack is controlled by the **standby pack control in the opposite controller**. A primary or standby pack control failure causes the PACK, MASTER CAUTION and AIR COND System Annunciator lights to illuminate during recall.

        ![Air conditioning pack schematic](annex:ATEV)
      presets:
        - correctAnswers:
            - text: The pack is controlled by the standby pack control in the opposite controller.
          wrongAnswers:
            - text: The pack shuts down and the PACK light illuminates.
            - text: The pack is controlled by the standby pack control in the same controller.
            - text: The pack goes to a fixed temperature.
    - type: simple
      question: The right pack primary controller fails. Which controller now controls the right pack?
      explanation: |-
        ### FCOM 2.31.2, Pack Temperature Control

        > If a primary pack control fails, the affected pack is controlled by the **standby pack control in the opposite controller**.

        ![Air conditioning pack schematic](annex:ATEV)
      presets:
        - correctAnswers:
            - text: The standby pack control in the left controller.
          wrongAnswers:
            - text: The standby pack control in the right controller.
            - text: The primary pack control in the left controller.
            - text: No controller; the pack operates uncontrolled.
- id: QWYYZ
  subjectId: b737
  chapterId: "b737.02"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Both PACK switches are AUTO and one pack fails in flight with the flaps up. What flow does the remaining pack deliver?
      explanation: |-
        ### FCOM 2.31.1, Air Conditioning Pack

        > When the aircraft is not on the ground and the flaps are up, and both air conditioning pack switches are set to AUTO, and the engine bleed switches are both set to ON, if one pack fails or one engine fails or a pack switch is selected to OFF, the **remaining pack automatically switches to high air flow**.
      presets:
        - correctAnswers:
            - text: High flow, selected automatically.
          wrongAnswers:
            - text: Low flow, until HIGH is selected manually.
            - text: Normal flow, until the flaps are extended.
            - text: No flow; the second pack must be restarted.
    - type: simple
      question: What is the result if one pack fails in flight?
      explanation: |-
        ### FCOM 2.31.1, Air Conditioning Pack

        > A single pack in high flow is capable of maintaining pressurization and acceptable temperatures throughout the airplane **up to the maximum certified ceiling**.

        ### FCOM 2.40.1, Cabin Pressure Controller

        > [...] at the airplane maximum certified ceiling of 41,000 feet.
      presets:
        - correctAnswers:
            - text: The remaining pack, in high flow, maintains pressurisation and acceptable cabin temperatures up to 41,000 feet.
          wrongAnswers:
            - text: The remaining pack maintains pressurisation only if all Temperature Selectors are OFF.
            - text: The remaining pack cannot operate in high flow.
            - text: The remaining pack maintains pressurisation only up to FL250.
- id: QPWCG
  subjectId: b737
  chapterId: "b737.02"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What is the primary function of the recirculation fans?
      explanation: |-
        ### FCOM 2.31.7, Recirculation Fans

        > The recirculation fan system **reduces the air conditioning system pack load and the engine bleed air demand**. Air from the passenger cabin and electrical equipment compartment is drawn to the forward cargo compartment where it is filtered and recirculated to the mix manifold.
      presets:
        - correctAnswers:
            - text: Reduce the load on the packs and the engine bleed air demand.
          wrongAnswers:
            - text: To provide standby air conditioning if the packs fail.
            - text: To remove contaminants with HEPA filters, as their main purpose.
            - text: To heat the forward cargo compartment.
- id: QZNFD
  subjectId: b737
  chapterId: "b737.02"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: true-or-false
      question: ""
      explanation: |-
        ### FCOM 2.31.1, Air Conditioning System Description

        > Conditioned air from the **left pack, upstream of the mix manifold, flows directly to the flight deck**. Excess air from the left pack, air from the right pack, and air from the recirculation system is combined in the mix manifold.

        ### FCOM 2.31.6, Air Conditioning Distribution

        > Since the flight deck requires only a fraction of the air supply provided by the left pack, most of the left pack output is routed to the mix manifold.
      statements:
        - text: Conditioned air from the left pack flows directly to the flight deck, upstream of the mix manifold.
          answer: true
        - text: Conditioned air from the left pack flows to the flight deck from the mix manifold.
          answer: false
        - text: Most of the left pack output goes to the flight deck.
          answer: false
