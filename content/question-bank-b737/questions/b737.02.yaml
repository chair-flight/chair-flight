- id: QFEEH
  subjectId: b737
  chapterId: "b737.02"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: When operating on the standby pack controls, what temperature do the packs produce?
      explanation: |-
        ### FCOM 2.31.6, Standby Pack Average Temperature

        > If all zone controls and primary pack controls fail, the standby pack controls command the packs to produce air temperatures which will satisfy the **average temperature demand of the two cabin zones**. The trim air modulating valves will close. The flight deck zone Temperature Selector will have no effect on the standby pack controls.

        ![Air conditioning pack schematic](annex:ATEV)
      presets:
        - correctAnswers:
            - text: The average temperature demand of the two passenger cabin zones.
          wrongAnswers:
            - text: A fixed 24°C from the left pack and 18°C from the right pack.
            - text: The temperature selected on the flight deck zone Temperature Selector.
            - text: The last temperature set before the failure.
    - type: simple
      question: If all zone controls and primary pack controls fail, how is cabin temperature controlled?
      explanation: |-
        ### FCOM 2.31.6, Standby Pack Average Temperature

        > If all zone controls and primary pack controls fail, the standby pack controls command the packs to produce air temperatures which will satisfy the **average temperature demand of the two cabin zones**. The trim air modulating valves will close. The flight deck zone Temperature Selector will have no effect on the standby pack controls.

        ![Air conditioning pack schematic](annex:ATEV)
      presets:
        - correctAnswers:
            - text: The standby pack controls command the packs to produce the average temperature demand of the two passenger cabin zones.
          wrongAnswers:
            - text: The last settings before the failure are maintained until the packs are selected OFF.
            - text: Cabin temperature cannot be controlled in this situation.
            - text: A fixed 24°C from the left pack and 18°C from the right pack.
- id: QOMUS
  subjectId: b737
  chapterId: "b737.02"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: If all Temperature Selectors are positioned OFF, which fixed temperatures do the packs produce?
      explanation: |-
        ### FCOM 2.31.6, Fixed Cabin Temperature

        > If all Temperature Selectors are positioned OFF, the pack controls will cause the **left pack to maintain a fixed temperature of 75°F (24°C)** and the **right pack to maintain 65°F (18°C)** as measured at the pack temperature sensor.

        ![Air conditioning pack schematic](annex:ATEV)
      presets:
        - correctAnswers:
            - text: Left pack 24°C, right pack 18°C.
          wrongAnswers:
            - text: Left pack 20°C, right pack 22°C.
            - text: Left pack 18°C, right pack 24°C.
            - text: Left pack 22°C, right pack 20°C.
    - type: simple
      question: What is the result if all zone Temperature Selectors are positioned OFF?
      explanation: |-
        ### FCOM 2.31.6, Fixed Cabin Temperature

        > If all Temperature Selectors are positioned OFF, the pack controls will cause the **left pack to maintain a fixed temperature of 75°F (24°C)** and the **right pack to maintain 65°F (18°C)** as measured at the pack temperature sensor.

        ![Air conditioning pack schematic](annex:ATEV)
      presets:
        - correctAnswers:
            - text: The left pack maintains 24°C and the right pack maintains 18°C.
          wrongAnswers:
            - text: The right pack maintains 75°F and the left pack maintains 65°F.
            - text: The packs maintain an average temperature across all zones.
            - text: The packs stop producing conditioned air.
- id: QNTJV
  subjectId: b737
  chapterId: "b737.02"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Which systems rely on the bleed air system?
      explanation: |-
        ### FCOM 2.20.1, Introduction

        > The following systems rely on the bleed air system for operation:
        > - Air conditioning/pressurization
        > - Wing and engine thermal anti-icing
        > - Engine starting
        > - Hydraulic reservoirs pressurization
        > - Water tank pressurization

        {{wrong-answers-table}}

        ![Bleed air system schematic](annex:AQQH)
      presets:
        - correctAnswers:
            - text: Air conditioning and pressurisation, wing and engine anti-ice, engine starting, hydraulic reservoir pressurisation, water tank pressurisation.
          wrongAnswers:
            - text: Air conditioning and pressurisation, wing and engine anti-ice, engine starting, hydraulic reservoir pressurisation.
              mistake: Missing water tank pressurisation.
            - text: Air conditioning and pressurisation, wing and engine anti-ice, hydraulic reservoir pressurisation, water tank pressurisation.
              mistake: Missing engine starting.
            - text: Wing and engine anti-ice, engine starting, hydraulic reservoir pressurisation, water tank pressurisation.
              mistake: Missing air conditioning and pressurisation.
- id: QQHMB
  subjectId: b737
  chapterId: "b737.02"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: true-or-false
      question: ""
      explanation: |-
        ### FCOM 2.10.10, TRIP RESET Switch

        > Push (if fault condition is corrected) –
        > - resets BLEED TRIP OFF, PACK or ZONE TEMP lights
        > - related engine bleed air valve opens, or related pack valve opens, or related trim air modulating valve opens
        >
        > Lights remain illuminated until reset.

        ### FCOM 2.10.3, WING–BODY OVERHEAT Light

        The TRIP RESET switch does not reset the WING–BODY OVERHEAT light.

        ![Bleed air system schematic](annex:AQQH)
      statements:
        - text: Pushing the TRIP RESET switch resets a BLEED TRIP OFF light and opens the related engine bleed air valve.
          answer: true
        - text: Pushing the TRIP RESET switch resets a ZONE TEMP light and opens the related trim air modulating valve.
          answer: true
        - text: Pushing the TRIP RESET switch resets the WING-BODY OVERHEAT light.
          answer: false
        - text: Pushing the TRIP RESET switch closes the valve associated with the alert and extinguishes the light.
          answer: false
