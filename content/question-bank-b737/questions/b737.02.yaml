      explanation: |-
        ### FCOM 2.10.12, Cabin Altitude Panel

        > Note: The CABIN ALT indicator can show a cabin altitude of **less than 0 feet** and reach the upper end of the cabin altitude scale. This can occur under the following conditions:
        > - on the ground at airports close to or below sea level
        > - **in flight when the cabin is pressurized below sea level**

        The needle continues past zero, so it points to a high cabin altitude when the cabin is in fact below sea level.
