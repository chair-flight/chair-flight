- id: QKFTD
  subjectId: b737
  chapterId: "b737.02"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: When is engine bleed air taken from the 9th stage?
      explanation: |-
        ### FCOM 2.20.1, Engine Bleed System Supply

        > When 5th stage low pressure bleed air is insufficient for the bleed air system requirements, the **high stage valve modulates open** to maintain adequate bleed air pressure. During takeoff, climb, and most cruise conditions, low pressure bleed air from the 5th stage is adequate and the high stage valve remains closed.

        ![Bleed air system schematic](annex:AGCY)
      presets:
        - correctAnswers:
            - text: Only when 5th stage bleed air is insufficient and the high stage valve modulates open.
          wrongAnswers:
            - text: Constantly, together with the 5th stage.
            - text: Only during takeoff and climb.
            - text: Only when the APU bleed air valve is open.
- id: QZZRQ
  subjectId: b737
  chapterId: "b737.02"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: With the ISOLATION VALVE switch in AUTO, when is the isolation valve closed?
      explanation: |-
        ### FCOM 2.20.2, Isolation Valve

        > The isolation valve isolates the left and right sides of the bleed air duct during normal operations. [...]
        >
        > With the isolation valve switch in AUTO, **both engine bleed air switches ON**, and **both air conditioning pack switches AUTO or HIGH**, the isolation valve is **closed**. The isolation valve opens if either engine bleed air switch or air conditioning pack switch is positioned OFF.

        ![Bleed air system schematic](annex:AQQH)
      presets:
        - correctAnswers:
            - text: When both engine BLEED air switches are ON and both PACK switches are AUTO or HIGH.
          wrongAnswers:
            - text: When the APU BLEED air switch is ON.
            - text: When either engine BLEED air switch is OFF.
            - text: When both PACK switches are OFF.
    - type: simple
      question: With the ISOLATION VALVE switch in AUTO, what opens the isolation valve?
      explanation: |-
        ### FCOM 2.20.2, Isolation Valve

        > The isolation valve isolates the left and right sides of the bleed air duct during normal operations. [...]
        >
        > With the isolation valve switch in AUTO, **both engine bleed air switches ON**, and **both air conditioning pack switches AUTO or HIGH**, the isolation valve is **closed**. The isolation valve opens if either engine bleed air switch or air conditioning pack switch is positioned OFF.

        ![Bleed air system schematic](annex:AQQH)
      presets:
        - correctAnswers:
            - text: Either an engine BLEED air switch or a PACK switch positioned OFF.
          wrongAnswers:
            - text: The APU BLEED air switch positioned ON.
            - text: Both PACK switches positioned HIGH.
            - text: Both engine BLEED air switches positioned ON.
- id: QGLLH
  subjectId: b737
  chapterId: "b737.02"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: What is the function of the DUAL BLEED light?
      explanation: |-
        ### FCOM 2.20.2, DUAL BLEED Light

        > The DUAL BLEED light illuminates whenever the APU bleed air valve is open and the position of the engine bleed air switches and isolation valve would permit possible backpressure of the APU. Therefore, **thrust must be limited to idle** with the DUAL BLEED light illuminated.

        ### FCOM 2.20.2, APU Bleed Air Valve

        > With both the APU and engine bleed air valves open, and the engines operating at idle thrust, there is a possibility of APU bleed air back-pressuring the 9th stage modulating and shutoff valve. This would cause the 9th stage valve to close.

        ![Bleed air system schematic](annex:AQQH)
      presets:
        - correctAnswers:
            - text: It illuminates when the APU bleed air valve is open and the engine bleed air switches and isolation valve would permit possible backpressure of the APU.
          wrongAnswers:
            - text: It illuminates whenever both engines are providing bleed air at different thrust settings.
            - text: It illuminates whenever the APU and both engines are running.
            - text: It illuminates whenever APU duct pressure rises above a preset value.
    - type: simple
      question: The DUAL BLEED light is illuminated. What limit applies to engine thrust?
      explanation: |-
        ### FCOM 2.20.2, DUAL BLEED Light

        > The DUAL BLEED light illuminates whenever the APU bleed air valve is open and the position of the engine bleed air switches and isolation valve would permit possible backpressure of the APU. Therefore, **thrust must be limited to idle** with the DUAL BLEED light illuminated.

        ### FCOM 2.20.2, APU Bleed Air Valve

        > With both the APU and engine bleed air valves open, and the engines operating at idle thrust, there is a possibility of APU bleed air back-pressuring the 9th stage modulating and shutoff valve. This would cause the 9th stage valve to close.

        ![Bleed air system schematic](annex:AQQH)
      presets:
        - correctAnswers:
            - text: Thrust must be limited to idle.
          wrongAnswers:
            - text: Thrust must be limited to the takeoff thrust setting.
            - text: Thrust must be limited to the climb thrust setting.
            - text: There is no thrust limit.
