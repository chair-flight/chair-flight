- id: QCEPI
  subjectId: b737
  chapterId: "15"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: The predictive windshear symbol radials, which extend from the predictive windshear symbol to help identify the location of a windshear event, are displayed in what colours?
      explanation: |-
        ### FCOM 15.10.15, Predictive Windshear Display and Annunciations

        > 1 Predictive Windshear Symbol Displayed (red and black) – Predictive windshear alert active. [...]
        >
        > 2 Predictive Windshear Symbol Radials **Displayed (amber)** – Predictive windshear alert active. Extend from predictive windshear symbol to help identify location of windshear event
        >
        > 3 WINDSHEAR Annunciation WINDSHEAR (amber) – predictive windshear caution active. WINDSHEAR (red) – predictive windshear warning active.

        The radials are always amber. The colour of the WINDSHEAR annunciation changes with caution and warning.
      presets:
        - correctAnswers:
            - text: Amber.
          wrongAnswers:
            - text: Red and Black banded.
            - text: Displayed amber when a predictive windshear caution is active, and displayed red when a predictive windshear warning is active.
            - text: Red.
- id: QLLFP
  subjectId: b737
  chapterId: "15"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: The PSEU light will illuminate along with a Master Caution and an OVERHEAD annunciator light, under which of the following situations?
      explanation: |-
        ### FCOM 15.20.7, Proximity Switch Electronic Unit (PSEU)

        > The PSEU monitors the following systems: • takeoff configuration warnings • landing configurations warnings • landing gear • air/ground sensing
        >
        > The PSEU, its sensors, and its input signals are monitored for internal faults. When designated faults are detected, **a PSEU light on the aft overhead panel illuminates, and the OVERHEAD system annunciator light and MASTER CAUTION lights illuminate.** The PSEU light can be reset following a maintenance BITE check or repair of the cause of the fault.

        ### FCOM 15.20.8, Proximity Switch Electronic Unit (PSEU)

        > The PSEU light is inhibited: • in flight • when the thrust levers are advanced toward takeoff power • **for 30 seconds after landing**
      presets:
        - correctAnswers:
            - text: Illuminates 30 seconds after the ground/air system senses ground mode, if an emergency exit flight lock has failed locked or a fault is detected.
          wrongAnswers:
            - text: Illuminates whenever ground/air system senses air mode, and an emergency exit flight lock has failed locked.
            - text: Illuminates 30 seconds after the ground/air system senses air mode, if an emergency exit flight lock has failed locked or a fault is detected.
            - text: Illuminates as soon as the ground/air system senses ground mode, if an emergency exit flight lock has failed locked or a fault is detected.
