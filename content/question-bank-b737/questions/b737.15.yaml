        > Two independent Mach/airspeed warning systems provide a distinct aural warning, **a clacker**, any time the maximum operating airspeed of Vmo/Mmo is exceeded. [...]
        >
        > The airspeed indicator displays **red and black warning bands** indicating maximum and minimum allowable airspeed. The ends of the amber bands indicate maximum and minimum maneuver speeds.

