      explanation: |-
        ### FCOM 15.20.6, Intermittent Cabin Altitude/Configuration Warning

        > Cabin altitude warning activates when cabin altitude exceeds 10,000 feet. **An intermittent warning horn sounds and the CABIN ALTITUDE warning light illuminates.** The warning horn may be silenced by momentarily pressing the ALT HORN CUTOUT switch on the Cabin Altitude Panel. The warning light remains illuminated until the cabin altitude descends below 10,000 feet.

        ### FCOM 15.10.3, Cabin Altitude Warning Light

        > Illuminated (red) – • illuminates when cabin altitude exceeds 10,000 feet • activation is simultaneous with aural warning intermittent horn for CABIN ALTITUDE alert
      presets:
        - correctAnswers:
            - text: An intermittent warning horn sounds and the red CABIN ALTITUDE lights illuminate when the cabin altitude exceeds 10000 feet
          wrongAnswers:
            - text: A steady warning horn sounds and the amber CABIN ALTITUDE lights illuminate when the cabin altitude exceeds 14000 feet.
            - text: A steady warning horn sounds and the red CABIN ALTITUDE warning lights illuminate when the cabin altitude exceeds 14000 feet.
            - text: An intermittent warning horn sounds and the amber CABIN ALTITUDE warning lights illuminate when the cabin altitude exceeds 10000 feet
