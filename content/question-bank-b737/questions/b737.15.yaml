  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Which of these settings would cause a takeoff configuration warning when the thrust levers are advanced?
      explanation: |-
        ### FCOM 15.20.6, Intermittent Cabin Altitude/Configuration Warning

        > Takeoff configuration warning is armed when the airplane is on the ground and either or both forward thrust levers are advanced for takeoff. Takeoff configuration warning activates if: • trailing edge flaps are not in the flaps 1 through 25 takeoff range, or • trailing edge flaps are in a skew or asymmetry condition, or have uncommanded motion, or • leading edge devices are not configured for takeoff or have uncommanded motion, or • speed brake lever is not in the DOWN position, or • **spoiler control valve is open providing pressurized hydraulic fluid to the ground spoiler interlock valve**, or • parking brake is set, or • stabilizer trim not set in the takeoff range.
      presets:
        - correctAnswers:
            - text: The spoiler control valve is open.
          wrongAnswers:
            - text: Flap 1 is set.
            - text: 7 units of stabiliser trim are set.
            - text: All leading edge devices are fully extended.
- id: QMIJH
  subjectId: b737
  chapterId: "15"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: The PSEU light illuminates 30 seconds after landing. What does this indicate?
      explanation: |-
        ### FCOM 15.20.7, Proximity Switch Electronic Unit (PSEU)

        > The PSEU monitors the following systems: • takeoff configuration warnings • landing configurations warnings • landing gear • air/ground sensing
        >
        > The PSEU, its sensors, and its input signals are monitored for internal faults. When designated faults are detected, **a PSEU light on the aft overhead panel illuminates, and the OVERHEAD system annunciator light and MASTER CAUTION lights illuminate.** The PSEU light can be reset following a maintenance BITE check or repair of the cause of the fault.

        ### FCOM 15.20.8, Proximity Switch Electronic Unit (PSEU)

        > The PSEU light is inhibited: • in flight • when the thrust levers are advanced toward takeoff power • **for 30 seconds after landing**
      presets:
        - correctAnswers:
            - text: A fault occurred at some point in the flight in the landing gear position sensing, air/ground sensing or configuration warning systems.
          wrongAnswers:
            - text: The thrust reverser system has detected a fault.
            - text: The PSEU self-test has been successful.
            - text: The autobrake system has failed.
