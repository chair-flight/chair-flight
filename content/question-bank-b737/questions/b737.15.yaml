  templates:
    - type: simple
      question: The EGPWS contains a terrain database, which it uses for look-ahead terrain alerting.  Which of the following statements is correct for this terrain database?
      explanation: |-
        ### FCOM 15.20.13, Look–Ahead Terrain Alerting

        > The EGPWS terrain data base contains detailed terrain data near major airports, and data in lesser detail for areas between airports. [...]
        >
        > Note: **The EGPWS terrain data base, look-ahead terrain alerting, and terrain display do not account for man-made obstructions.**

        This note applies to the earlier airplanes. Later airplanes have a separate obstacle display and alerting for man-made obstacles 100 feet and higher (FCOM 15.20.16), so not every EGPWS database accounts for them in the same way.
      presets:
        - correctAnswers:
            - text: Man-made obstructions are not accounted for in all EGPWS terrain databases
          wrongAnswers:
            - text: All man-made obstructions are accounted for in the detailed areas of the EGPWS terrain database in areas close to major airports.
            - text: All EGPWS terrain databases account for man-made obstructions over 100 feet high, throughout the whole database area.
            - text: All EGPWS terrain databases account for man-made obstructions over 100 feet high, in the more detailed areas of the database near major airports.
