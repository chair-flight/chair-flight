- id: QHIPB
  subjectId: b737
  chapterId: "15"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: simple
      question: Altitude alerting occurs when approaching or departing from the MCP selected altitude.  When is the altitude alerting system inhibited?
      explanation: |
        Altitude alerting occurs when approaching or departing the MCP–selected altitude. Altitude alerting is inhibited when trailing edge flaps are extended to 25 or greater, or while G/S is captured.

        ---

      presets:
        - correctAnswers:
            - text: Glide slope is captured, or trailing edge flaps are extended to 25 or greater.
          wrongAnswers:
            - text: Leading edge flaps are extended to 25 or greater
            - text: Landing gear is down and locked.
            - text: Leading edge flaps are extended to 25 or greater and the landing gear is extended.
- id: QXAKA
  subjectId: b737
  chapterId: "15"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds: []
  templates:
    - type: true-or-false
      question: ""
      explanation: |-
        ### FCOM 15.20.26, Predictive Windshear Alerts

        > (Takeoff) Red WINDSHEAR on both attitude indicators [...] Windshear close to and directly ahead of the airplane detected by the weather radar. Enabled during takeoff, below 1,200 feet RA.
        >
        > (Approach) Windshear within 1.5 miles and directly ahead of the airplane detected by the weather radar. Enabled during approach, **below 1,200 feet RA.**
        >
        > Amber WINDSHEAR message on navigation display (all modes) Windshear within 3 miles and ahead of the airplane detected by the weather radar. Enabled during takeoff and approach, below 1,200 feet RA.

        The red warning covers windshear within 1.5 miles ahead on approach, and the amber caution covers windshear within 3 miles.
      statements:
        - text: In Flight, the Intuvue radar will provide a windshear warning from 0.5nm to 3nm ahead of the aircraft.
          answer: false
