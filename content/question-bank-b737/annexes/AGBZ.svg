<svg xmlns="http://www.w3.org/2000/svg" width="908" height="799" viewBox="0 0 908 799" role="img" aria-labelledby="title desc" xml:lang="en-GB">
<title id="title">737-800 Engine Anti-Ice System Schematic</title>
<desc id="desc">Engine cowl anti-ice and the fifth- and ninth-stage bleed sources. Shows the cowl anti-ice, modulating and shutoff, and engine bleed valves with their related cockpit controls.</desc>
<metadata>Boeing 737-800 FCOM Rev 40, 3.20.6. Redrawn as SVG.</metadata>
<defs>
  <marker id="arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0 0 12 5 0 10Z" fill="#ededed"/>
  </marker>
  <g id="toggle-body">
    <circle r="18" fill="#a6a6a6" stroke="#393939" stroke-width="2"/>
    <circle r="13" fill="#676767" stroke="#393939" stroke-width="2"/>
    <circle r="9" fill="#8c8c8c" stroke="#393939" stroke-width="1.6"/>
  </g>
  <g id="toggle-lever" stroke="#393939" stroke-width="1.7">
    <path d="M-4 0a4 4 0 0 1 8 0l2 10H-6z" fill="#b7b7b7"/>
    <circle cy="12" r="6.6" fill="#cecece"/>
  </g>
  <g id="toggle"><use href="#toggle-body"/><use href="#toggle-lever"/></g>
  <g id="shutoff">
    <rect x="-21" y="-20" width="42" height="40" rx="1.5" fill="#ededed" stroke="#111" stroke-width="2"/>
    <path d="M0-19V19" stroke="#111" stroke-width="4"/>
    <circle r="4.7" fill="#ededed" stroke="#111" stroke-width="2"/>
  </g>
  <g id="modulating">
    <rect x="-24" y="-24" width="48" height="48" fill="#ededed" stroke="#111" stroke-width="2"/>
    <path d="M-23-22H23Q0-7-23-22ZM-23 22H23Q0 7-23 22Z" fill="#111"/>
    <path d="M-18 12 5-11h13L-5 12Z" fill="#111"/>
    <circle r="5" fill="#ededed" stroke="#111" stroke-width="2"/>
  </g>
  <g id="check">
    <rect x="-21" y="-12" width="42" height="24" rx="1.5" fill="#ededed" stroke="#111" stroke-width="2"/>
    <path d="M-15-4H4v-6L17 0 4 10V4h-19Z" fill="#111"/>
  </g>
</defs>
<style>
  svg {background:#080808;color:#ededed}
  text {font-family:Menlo,Consolas,"Liberation Mono",monospace}
  .wire,.signal {fill:none;stroke:#ededed;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .signal {stroke-dasharray:19 10 3 10}
  .arr {marker-end:url(#arrow)}
  .duct-edge,.duct {fill:none;stroke-linecap:butt;stroke-linejoin:round}
  .duct-edge {stroke:#ededed;stroke-width:15}
  .duct {stroke:#c41c1c;stroke-width:12}
  .component {fill:#080808;stroke:#ededed;stroke-width:2.1}
</style>
