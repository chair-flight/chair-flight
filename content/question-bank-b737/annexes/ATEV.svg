<title id="title">737-800 Air Conditioning Pack Schematic</title>
<desc id="desc">The right pack showing bleed air, ram air, the heat exchanger, air cycle machine, water separator, temperature controls and the outlets to the mix manifold and trim air system.</desc>
<metadata>ATEV · Boeing 737-800 FCOM Rev 40, page 2.31.4. Redrawn in SVG.</metadata>
