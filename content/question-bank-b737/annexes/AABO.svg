<svg xmlns="http://www.w3.org/2000/svg" width="969" height="720" viewBox="70 110 969 720" role="img" aria-labelledby="title description" xml:lang="en-GB">
  <title id="title">737-800 Hydraulic Power Distribution Schematic</title>
  <desc id="description">System A is shown in red at left, System B in green at right, and the standby system in blue at the centre. The lines show hydraulic distribution to aircraft equipment. System A drives the power transfer unit motor, which is mechanically coupled to a pump using System B fluid. The landing gear transfer valve has feeds from System A and the System B engine-driven pump.</desc>
  <metadata>Redrawn from the Boeing 737-800 Flight Crew Operations Manual, Rev 38, Chapter 13, page 13.20.1. Configuration: no tail skid or one-position tail skid.</metadata>
  <defs><path id="rotor-vane" class="component-fill" d="M6 -5q6 -9 12 -4l1 5q-6-3-10 4z"/></defs>
  <style>
    :root { --ink: #171a1c; --paper: #ffffff; --red: #c41c1c; --green: #1f7a1f; --blue: #0b6bcb; --backdrop: #f3f4f6 }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #f0f4f8; --paper: #171a1c; --red: #e5484d; --green: #2ea043; --blue: #3a86dc; --backdrop: #0b0d0e }
    }
    :root[data-theme="light"] { --ink: #171a1c; --paper: #ffffff; --red: #c41c1c; --green: #1f7a1f; --blue: #0b6bcb; --backdrop: #f3f4f6 }
    :root[data-theme="dark"] { --ink: #f0f4f8; --paper: #171a1c; --red: #e5484d; --green: #2ea043; --blue: #3a86dc; --backdrop: #0b0d0e }
    .outline { fill: none; stroke: var(--ink); stroke-width: 2.2 }
    .pipe-edge { fill: none; stroke: var(--ink); stroke-width: 15; stroke-linejoin: round }
    .pipe-core { fill: none; stroke-width: 10.5; stroke-linejoin: round }
    .a { stroke: var(--red) }
    .b { stroke: var(--green) }
    .standby { stroke: var(--blue) }
    .fill-a { fill: var(--red) }
    .fill-b { fill: var(--green) }
    .fill-standby { fill: var(--blue) }
    .fill-ink { fill: var(--ink) }
    .component { fill: var(--paper); stroke: var(--ink); stroke-width: 2.2 }
    .stroke-ink { stroke: var(--ink) }
    .label { font-family: Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; font-weight: 700; fill: var(--ink) }
    .label-on-fill { fill: #ffffff }
    .backdrop { fill: var(--backdrop) }
    .configuration { font-family: system-ui, sans-serif; font-size: 20px; font-weight: 750; fill: var(--ink) }
      .component-fill { fill: var(--paper) }
    .stroke-paper { stroke: var(--paper) }
  </style>
