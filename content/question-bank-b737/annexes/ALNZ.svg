<svg xmlns="http://www.w3.org/2000/svg" width="620" height="642" viewBox="0 0 620 642" role="img" aria-labelledby="title desc" xml:lang="en-GB">
  <title id="title">737-800 PFD annunciations</title>
  <desc id="desc">A composite illustration showing AOA DISAGREE, ROLL, IAS DISAGREE, ALT DISAGREE and INSTR SWITCH on one primary flight display.</desc>
  <metadata>B737 FCOM Rev 40, 10.11.2, 10.11.27–29 and 10.11.32–34</metadata>
  <style>
