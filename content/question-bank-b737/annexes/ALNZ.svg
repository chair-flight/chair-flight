    .amber{fill:#ffbf23}
    .green{fill:#00c672}
    .magenta{fill:#ff00a0}
    .larger{font-size:23px}
    .smaller{font-size:13px}
    .heading-numerals text{font-size:14px}
    .line{fill:none;stroke:#eee;stroke-width:1.5}
    .pink{fill:none;stroke:#ff00a0;stroke-width:1.8;stroke-linejoin:round}
  </style>
  <defs>
