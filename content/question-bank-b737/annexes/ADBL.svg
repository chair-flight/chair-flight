<svg xmlns="http://www.w3.org/2000/svg" width="908" height="1080" viewBox="0 0 908 1080" role="img" aria-labelledby="title desc" xml:lang="en-GB">
<title id="title">737-800 Wing Anti-Ice System Schematic</title>
<desc id="desc">Ground configuration with wing anti-ice on, engines at idle thrust and low duct temperatures. Shows the two wing anti-ice control valves, three heated slats per wing, and the related control and indication circuits.</desc>
<metadata>Boeing 737-800 FCOM Rev 40, 3.20.8. Redrawn as SVG.</metadata>
<defs>
  <marker id="arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0 0 12 5 0 10Z" fill="#ededed"/>
  </marker>
  <g id="toggle-body">
    <circle r="18" fill="#a6a6a6" stroke="#393939" stroke-width="2"/>
    <circle r="13" fill="#676767" stroke="#393939" stroke-width="2"/>
    <circle r="9" fill="#8c8c8c" stroke="#393939" stroke-width="1.6"/>
  </g>
  <g id="toggle-lever" stroke="#393939" stroke-width="1.7">
    <path d="M-4 0a4 4 0 0 1 8 0l2 10H-6z" fill="#b7b7b7"/>
    <circle cy="12" r="6.6" fill="#cecece"/>
  </g>
  <g id="toggle"><use href="#toggle-body"/><use href="#toggle-lever"/></g>
  <g id="shutoff">
    <rect x="-21" y="-20" width="42" height="40" rx="1.5" fill="#ededed" stroke="#111" stroke-width="2"/>
    <path d="M0-19V19" stroke="#111" stroke-width="4"/>
    <circle r="4.7" fill="#ededed" stroke="#111" stroke-width="2"/>
  </g>
  <g id="contact"><circle r="3.5" fill="#080808" stroke="#ededed" stroke-width="2"/></g>
  <g id="junction"><circle r="4.5" fill="#ededed"/></g>
</defs>
