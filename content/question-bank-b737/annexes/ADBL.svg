  text {font-family:Menlo,Consolas,"Liberation Mono",monospace}
  .wire,.signal {fill:none;stroke:#ededed;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .signal {stroke-dasharray:19 10 3 10}
  .arr {marker-end:url(#arrow)}
  .duct-edge,.duct {fill:none;stroke-linecap:butt;stroke-linejoin:round}
  .duct-edge {stroke:#ededed;stroke-width:15}
  .duct {stroke:#c41c1c;stroke-width:12}
  .component {fill:#080808;stroke:#ededed;stroke-width:2.1}
</style>
