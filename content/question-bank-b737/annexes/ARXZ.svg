<title id="title">737-800 Engine Fire Extinguisher Schematic</title>
<desc id="desc">Two engine fire switches and two fire bottles. The diagram shows the discharge selections, bottle indications, squibs and discharge routes to both engines.</desc>
<metadata>Boeing 737-800 FCOM Rev 40, 8.20.3. Redrawn as SVG.</metadata>
