<title id="title">737-800 AC Power Schematic</title>
<desc id="desc">In-flight AC power paths from the engine generators to their respective transfer buses, with the APU generator, ground power control, ground service relays and standby inverter.</desc>
<metadata>Boeing 737-800 FCOM Rev 40, 6.20.5. Redrawn as SVG.</metadata>
