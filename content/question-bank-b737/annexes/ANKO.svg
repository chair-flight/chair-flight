    <path d="M0 0 12 5 0 10Z" fill="#ededed"/>
  </marker>
  <g id="toggle-body">
    <circle r="18" fill="#a6a6a6" stroke="#393939" stroke-width="2"/>
    <circle r="13" fill="#676767" stroke="#393939" stroke-width="2"/>
    <circle r="9" fill="#8c8c8c" stroke="#393939" stroke-width="1.6"/>
  </g>
  <g id="toggle-lever" stroke="#393939" stroke-width="1.7">
    <path d="M-4 0a4 4 0 0 1 8 0l2 10H-6z" fill="#b7b7b7"/>
    <circle cy="12" r="6.6" fill="#cecece"/>
  </g>
  <g id="toggle"><use href="#toggle-body"/><use href="#toggle-lever"/></g>
  <g id="check">
    <rect x="-21" y="-12" width="42" height="24" rx="1.5" fill="#ededed" stroke="#111" stroke-width="2"/>
    <path d="M-15-4H4v-6L17 0 4 10V4h-19Z" fill="#111"/>
  </g>
  <g id="trim-air-valve">
    <circle r="17" fill="#ededed" stroke="#111" stroke-width="1.5"/>
    <path d="M-16.5-1.5H-2q1.4 0 2 1.5t2 1.5h14.5" fill="none" stroke="#111" stroke-width="4.6"/>
  </g>
</defs>
