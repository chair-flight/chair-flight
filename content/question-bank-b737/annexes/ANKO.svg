<title id="title">737-800 Air Conditioning Distribution Schematic</title>
<desc id="desc">Packs on in flight. Shows the mix manifold, recirculation fans, trim air valves, and the conditioned air supplies to the three cabin zones.</desc>
<metadata>Boeing 737-800 FCOM Rev 40, 2.31.9. Redrawn as SVG.</metadata>
<defs>
