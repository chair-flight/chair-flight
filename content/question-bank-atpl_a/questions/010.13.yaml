- id: QOCYW
  subjectId: "010"
  chapterId: "010.13"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-108075
    - AVEXAM-98703
    - BGS-101688
    - ATPLQ-103661
    - BGS-101201
  annexes: []
  learningObjectiveIds:
    - 010.13.01.01.03
  templates:
    - type: simple
      question: |-
        Which option correctly describes the following events?

        1\. A near collision which required an avoidance manoeuvre, where no damage or injuries were sustained.   
         2\. A runway excursion which resulted in significant damage to the fuselage and undercarriage, but no injuries.
      explanation: |-
        ### Regulation (EU) No 996/2010, Annex

        > List of examples of serious incidents
        >
        > The incidents listed are typical examples of incidents that are likely to be serious incidents. […]
        > - a **near collision requiring an avoidance manoeuvre** to avoid a collision or an unsafe situation or when an avoidance action would have been appropriate,

        ### Regulation (EU) No 996/2010, Article 2(1)

        > ‘accident’ means an occurrence associated with the operation of an aircraft which, in the case of a manned aircraft, takes place between the time any person boards the aircraft with the intention of flight until such time as all such persons have disembarked […], in which:
        > - […]
        > - (b) the aircraft sustains **damage or structural failure which adversely affects the structural strength, performance or flight characteristics of the aircraft, and would normally require major repair or replacement of the affected component**, except for engine failure or damage, when the damage is limited to a single engine, (including its cowlings or accessories), to propellers, wing tips, antennas, probes, vanes, tires, brakes, wheels, fairings, panels, landing gear doors, windscreens, the aircraft skin (such as small dents or puncture holes) or minor damages to main rotor blades, tail rotor blades, landing gear, and those resulting from hail or bird strike, (including holes in the radome); or
        > - […]
      presets:
        - correctAnswers:
            - text: |-
                Event 1 is classed as a serious incident because a collision almost happened, but did NOT result in damage or harm.   
                 Event 2 is classed as an accident because there was significant damage to the aircraft.
          wrongAnswers:
            - text: |-
                Event 1 is classed as a serious incident because a collision almost happened, but did NOT result in damage or harm.   
                 Event 2 is classed as a serious incident because only the landing gears and fuselage were damaged.
            - text: |-
                Event 1 is classed as an accident because an emergency manoeuvre was required.   
                 Event 2 is classed as a serious incident because, although there was aircraft damage, there were NO injuries.
            - text: |-
                Event 1 is classed as an accident because emergency manoeuvring was required.   
                 Event 2 is classed as an accident because there was significant damage to the aircraft.
    - type: simple
      question: An aircraft has suffered damage to the landing gear and fuselage, as well as experiencing an AIRPROX. How are these two events classified?
      explanation: |-
        ### Regulation (EU) No 996/2010, Annex

        > List of examples of serious incidents
        >
        > The incidents listed are typical examples of incidents that are likely to be serious incidents. […]
        > - a **near collision requiring an avoidance manoeuvre** to avoid a collision or an unsafe situation or when an avoidance action would have been appropriate,

        ### Regulation (EU) No 996/2010, Article 2(1)

        > ‘accident’ means an occurrence associated with the operation of an aircraft which, in the case of a manned aircraft, takes place between the time any person boards the aircraft with the intention of flight until such time as all such persons have disembarked […], in which:
        > - […]
        > - (b) the aircraft sustains **damage or structural failure which adversely affects the structural strength, performance or flight characteristics of the aircraft, and would normally require major repair or replacement of the affected component**, except for engine failure or damage, when the damage is limited to a single engine, (including its cowlings or accessories), to propellers, wing tips, antennas, probes, vanes, tires, brakes, wheels, fairings, panels, landing gear doors, windscreens, the aircraft skin (such as small dents or puncture holes) or minor damages to main rotor blades, tail rotor blades, landing gear, and those resulting from hail or bird strike, (including holes in the radome); or
        > - […]
      presets:
        - correctAnswers:
            - text: Accident and Serious Incident, respectively.
          wrongAnswers:
            - text: Both serious incident.
            - text: Accident and incident, respectively.
            - text: Serious incident and incident, respectively.
