  annexes: []
  learningObjectiveIds:
    - 010.13.03.01.02
  templates:
    - type: simple
      question: Which of the following statements about EU regulation No. 996/2010 and EU regulation No. 376/2014 describes the correct relationship between the two regulations and their contributions to air safety?
      explanation: |-
        ### Regulation (EU) No 996/2010, Article 1(1)

        > This Regulation aims to improve aviation safety by ensuring a high level of efficiency, expediency, and quality of **European civil aviation safety investigations**, the sole objective of which is the prevention of future accidents and incidents without apportioning blame or liability […].
        ### Regulation (EU) No 376/2014, Article 1(1)

        > This Regulation aims to improve aviation safety by ensuring that relevant safety information relating to civil aviation is **reported, collected, stored, protected, exchanged, disseminated and analysed**.
      presets:
        - correctAnswers:
            - text: Both EU regulation No. 996/2010, and EU regulation No. 376/2014, aim to improve aviation safety, whereas 996/2010 focuses on investigations, and 376/2014 focuses on reporting and management of safety relevant information.
          wrongAnswers:
            - text: EU regulation No. 996/2010 refers to the investigation of incidents and occurrences, and EU regulation No. 376/2014 refers to the investigation of accidents.
            - text: EU regulation No. 996/2010 aims to improve aviation safety by ensuring that relevant safety information relating to civil aviation is collected, stored, protected, exchanged, disseminated and analysed, and EU regulation No. 376/2014 aims to improve aviation safety by ensuring that relevant safety information relating to civil aviation is reported.
            - text: EU regulation No. 996/2010 refers to the investigation of accidents involving aircraft with a total mass of less than 5 700 kg, and EU regulation No. 376/2014 refers to the investigation of accidents involving aircraft with a total mass of more than 5 700 kg.
    - type: simple
      question: |-
        Regulation 376/2014 on the reporting, analysis and follow-up of occurrences in civil aviation and Regulation 996/2010 on the investigation and prevention of accidents and incidents both deal with incident reports.

        Regulation 376/2014 intends to...
      explanation: |-
        ### Regulation (EU) No 996/2010, Article 1(1)

        > This Regulation aims to improve aviation safety by ensuring a high level of efficiency, expediency, and quality of **European civil aviation safety investigations**, the sole objective of which is the prevention of future accidents and incidents without apportioning blame or liability […].
        ### Regulation (EU) No 376/2014, Article 1(1)

        > This Regulation aims to improve aviation safety by ensuring that relevant safety information relating to civil aviation is **reported, collected, stored, protected, exchanged, disseminated and analysed**.
      presets:
        - correctAnswers:
            - text: assist Member states, the Agency and organisations in managing aviation safety risk, Regulation 996/2010 prevents accidents by investigating.
          wrongAnswers:
            - text: help judicial authorities in managing aviation safety risks, Regulation 996/2010 aims to prevent accidents by prosecuting.
            - text: prevent accidents by investigating, Regulation 996/2010 aims to assist Member states, the Agency and organisations in managing aviation safety risk.
            - text: prevent accidents by prosecuting, Regulation 996/2010 helps judicial authorities in managing aviation safety risks.
    - type: simple
      question: Consider EU Regulations on accidents, incidents, and occurrences in aviation. Which of the following options is correct?
      explanation: |-
        ### Regulation (EU) No 996/2010, Article 1(1)

        > This Regulation aims to improve aviation safety by ensuring a high level of efficiency, expediency, and quality of **European civil aviation safety investigations**, the sole objective of which is the prevention of future accidents and incidents without apportioning blame or liability […].
        ### Regulation (EU) No 996/2010, Article 3(3)

        > This Regulation shall **not apply to safety investigations into accidents and serious incidents which involve aircraft engaged in military, customs, police or similar services**, except when the Member State concerned so determines […].
        ### Regulation (EU) No 376/2014, Article 1(1)

        > This Regulation aims to improve aviation safety by ensuring that relevant safety information relating to civil aviation is **reported, collected, stored, protected, exchanged, disseminated and analysed**.
      presets:
        - correctAnswers:
            - text: Reg.(EU) 996/2010 addresses safety investigations but excludes, amongst others, incident investigation involving military aircraft; Reg. (EU) 376/2014 addresses occurrence reporting and use of safety information in order to improve aviation safety.
          wrongAnswers:
            - text: Reg.(EU) 996/2010 addresses accident and incident investigations, and implements the SARPs of ICAO Annex 13; Reg.(EU) 376/2014 contains procedures for accident and incident investigations, applicable to all ICAO Member States.
            - text: "Reg.(EU) 996/2010 contains procedures for the investigation of occurrences and incidents; Reg(EU) 376/2014 contains the procedures for the investigation of accidents: both regulations aim to prove aviation safety."
            - text: Reg.(EU) 996/2010 addresses accident and incident investigations for aircraft with an MTOM > 5700 kg; Reg.(EU) 376/2014 regulates accident and incident investigations for aircraft with an MTOM =< 5700 kg.
