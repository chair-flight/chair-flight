  annexes: []
  learningObjectiveIds:
    - 010.13.02.01.02
  templates:
    - type: simple
      question: An aircraft has crashed in France. Its state of registry is the USA and the company is Spanish. Who should contact who?
      explanation: |-
        ### ICAO Annex 13, 4.1

        > The State of Occurrence shall forward a notification of an accident, a serious incident, or an incident to be investigated within the context of this Annex, with a minimum of delay and by the most suitable and quickest means available, to:
        > - a) the **State of Registry**;
        > - b) the **State of the Operator**;
        > - c) the **State of Design**;
        > - d) the **State of Manufacture**; and
        > - e) the **International Civil Aviation Organization**, when the aircraft involved is of a maximum mass of over 2 250 kg or is a turbojet-powered aeroplane.
        >
        > […]
      presets:
        - correctAnswers:
            - text: France shall notify the USA and Spain.
          wrongAnswers:
            - text: France shall notify the USA and the USA shall notify Spain.
            - text: France shall notify Spain.
            - text: France shall notify the USA.
    - type: simple
      question: |-
        An aircraft designed and manufactured in the United States of America (USA), registered and operated in the United Kingdom (UK), and having a maximum mass of 10 tonnes, crashes in France.   
         According to ICAO Annex 13 "Aircraft Accident and incident investigation", which State/organisation(s) must be notified of the accident and by whom?
      explanation: |-
        ### ICAO Annex 13, 4.1

        > The State of Occurrence shall forward a notification of an accident, a serious incident, or an incident to be investigated within the context of this Annex, with a minimum of delay and by the most suitable and quickest means available, to:
        > - a) the **State of Registry**;
        > - b) the **State of the Operator**;
        > - c) the **State of Design**;
        > - d) the **State of Manufacture**; and
        > - e) the **International Civil Aviation Organization**, when the aircraft involved is of a maximum mass of over 2 250 kg or is a turbojet-powered aeroplane.
        >
        > […]
      presets:
        - correctAnswers:
            - text: France must notify the UK, the USA, and ICAO.
          wrongAnswers:
            - text: The USA, the UK, and France must be notified by ICAO.
            - text: The UK must notify France, the USA, and ICAO.
            - text: The USA must notify the UK, France, and ICAO.
