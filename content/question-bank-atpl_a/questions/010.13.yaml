- id: QLPBN
  subjectId: "010"
  chapterId: "010.13"
  relatedQuestionIds:
    - QMDUW
  externalQuestionIds:
    - ATPLQ-102008
    - AVEXAM-40228
    - BGS-101636
  annexes: []
  learningObjectiveIds:
    - 010.13.01.01.04
  templates:
    - type: simple
      question: Which of the following occurrences is classified as an aircraft accident?
      explanation: |-
        ### Regulation (EU) No 996/2010, Article 2(1)

        > ‘accident’ means an occurrence associated with the operation of an aircraft which, in the case of a manned aircraft, **takes place between the time any person boards the aircraft with the intention of flight until such time as all such persons have disembarked** […], in which:
        > - (a) **a person is fatally or seriously injured** as a result of:
        >   - being in the aircraft, or,
        >   - direct contact with any part of the aircraft, including parts which have become detached from the aircraft, or,
        >   - direct exposure to jet blast,
        >
        >   except when the injuries are from natural causes, self-inflicted or **inflicted by other persons**, or when the injuries are to **stowaways hiding outside the areas normally available to the passengers and crew**; or
        > - (b) the aircraft sustains damage or structural failure which adversely affects the structural strength, performance or flight characteristics of the aircraft, and would normally require major repair or replacement of the affected component, except for engine failure or damage, **when the damage is limited to a single engine, (including its cowlings or accessories)**, to propellers, wing tips, antennas, probes, vanes, tires, brakes, wheels, fairings, panels, landing gear doors, windscreens, the aircraft skin (such as small dents or puncture holes) or minor damages to main rotor blades, tail rotor blades, landing gear, and those resulting from hail or bird strike, (including holes in the radome); or
        > - […]
      presets:
        - correctAnswers:
            - text: An engineer is struck and seriously injured after the crew has boarded the aircraft.
          wrongAnswers:
            - text: A stowaway is killed by falling from the undercarriage bay on approach to land.
            - text: In flight, an engine turbine destroys the engine and its cowling but no other part of the aircraft suffers serious damage.
            - text: A cabin crew member is attacked and seriously injured by a passenger during flight.
