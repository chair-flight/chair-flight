      question: "During the flight, the crew becomes aware that a navigation instrument which has NOT been required on this flight but will be required on a future flight is indicating incorrectly. In addition to having the fault investigated by the engineers, Regulation (EU) No 376/2014 requires:"
      explanation: |-
        ### Regulation (EU) No 376/2014, Article 4(6) and 4(7)

        > 6. The following natural persons shall report the occurrences referred to in paragraph 1 through the system established in accordance with paragraph 2 **by the organisation which employs, contracts or uses the services of the reporter** […]:
        >    - (a) the **pilot in command** […]
        >
        > 7. The persons listed in paragraph 6 shall report occurrences **within 72 hours** of becoming aware of the occurrence, unless exceptional circumstances prevent this.
      presets:
        - correctAnswers:
            - text: The Pilot in Command to report the occurrence to the Operator's safety reporting system within 72 hours.
          wrongAnswers:
            - text: Nothing more is required because the failure did NOT affect that flight.
            - text: The Pilot in Command to report the occurrence as a serious incident to the national Civil Aviation Safety Investigation Authority within 7 days.
            - text: The crew member who noticed the fault to report the occurrence as a serious incident to the national Civil Aviation Safety Investigation Authority within 72 hours.
