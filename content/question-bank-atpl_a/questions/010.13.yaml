  annexes: []
  learningObjectiveIds:
    - 010.13.01.01.03
    - 010.13.03.01.01
  templates:
    - type: simple
      question: Shortly before landing the Co-Pilot reports feeling unwell and becomes incapacitated. The aircraft lands safely. How and when should the event be reported, according to Regulation (EU) No. 996/2010?
      explanation: |-
        ### Regulation (EU) No 996/2010, Annex

        > List of examples of serious incidents
        >
        > The incidents listed are typical examples of incidents that are likely to be serious incidents. […]
        > - **flight crew incapacitation in flight**,

        ### Regulation (EU) No 996/2010, Article 9(1)

        > Any person involved who has knowledge of the occurrence of an accident or serious incident shall **notify without delay the competent safety investigation authority** of the State of Occurrence thereof.
      presets:
        - correctAnswers:
            - text: As a serious incident, to the national Civil Aviation Safety Investigation Authority, WITHOUT delay.
          wrongAnswers:
            - text: In a mandatory occurrence report, to the national Civil Aviation Authority, within 72 hours.
            - text: As an accident, to the national Civil Aviation Safety Investigation Authority, WITHOUT delay.
            - text: In a voluntary occurrence report, to the national Civil Aviation Authority, within 72 hours.
    - type: simple
      question: "The first-officer and the commander have just taken off from an airport and are now on the climb-out. The commander suddenly suffers from a major heart attack, which incapacitates them from performing as a crew member. Fortunately, the first officer is able to land the aircraft by themselves. When submitting a report of the occurrence to the CAA, the event will be classified as:"
      explanation: |-
        ### Regulation (EU) No 996/2010, Annex

        > List of examples of serious incidents
        >
        > The incidents listed are typical examples of incidents that are likely to be serious incidents. […]
        > - **flight crew incapacitation in flight**,
      presets:
        - correctAnswers:
            - text: A serious incident.
          wrongAnswers:
            - text: A serious injury.
            - text: An incident.
            - text: An accident.
