      question: For which one of the following does mandatory reporting apply?
      explanation: |-
        ### Regulation (EU) No 376/2014, Article 4(1)

        > Occurrences which may represent a significant risk to aviation safety and which fall into the following categories shall be reported by the persons listed in paragraph 6 through the mandatory occurrence reporting systems pursuant to this Article:
        > - (a) occurrences related to the operation of the aircraft, such as:
        >   - […]
        >   - (vii) **crew incapacitation** and other crew-related occurrences;
        >   - […]
      presets:
        - correctAnswers:
            - text: Crew incapacitation.
          wrongAnswers:
            - text: Debris in the walkway.
            - text: Both passenger and crew sickness.
            - text: Lost baggage.
    - type: simple
      question: Which of the following events is subject to voluntary reporting according to Regulation (EU) No 376/2014?
      explanation: |-
        ### Regulation (EU) No 376/2014, Article 5(4)

        > The voluntary reporting systems shall be used to facilitate the collection of details of occurrences and safety-related information:
        > - (a) **not subject to mandatory reporting** pursuant to Article 4(1);
        > - (b) reported by persons who are not listed in Article 4(6).

        ### Regulation (EU) No 376/2014, Article 4(1)

        > […]
        > - (a) occurrences related to the operation of the aircraft, such as:
        >   - (i) collision-related occurrences;
        >   - […]
        >   - (iii) fuel-related occurrences;
        >   - […]
        >   - (vii) crew incapacitation and other crew-related occurrences;
        >   - […]
        > - (b) occurrences related to technical conditions, maintenance and repair of aircraft, such as:
        >   - […]
        >   - (ii) system malfunctions;
        >   - […]
        >   - (iv) propulsion problems (including engines, propellers and rotor systems) and auxiliary power unit problems;
        > - (c) occurrences related to air navigation services and facilities, such as:
        >   - (i) collisions, near collisions or potential for collisions;
        >   - […]
      presets:
        - correctAnswers:
            - text: Small speed fluctuations during approach.
          wrongAnswers:
            - text: Engine-failure in cruise.
            - text: Abnormal fuel check discrepancies.
            - text: TCAS RA.
        - correctAnswers:
            - text: Debris in the walkway.
          wrongAnswers:
            - text: Crew incapacitation.
            - text: System malfunctions.
            - text: Collisions, near collisions or potential for collisions.
