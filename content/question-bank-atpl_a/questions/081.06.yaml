- id: QFKXS
  subjectId: "081"
  chapterId: "081.06"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-815217
    - AVEXAM-22961
    - ATPLQ-819096
    - ATPLQ-815985
    - AVEXAM-21918
    - AVEXAM-7381
  annexes: []
  learningObjectiveIds:
    - 081.06.02.01.06
    - 081.06.02.01.07
  templates:
    - type: simple
      question: |-
        The VA speed of a light aircraft is {{va}} kt. Determine the aircraft's limit load factor, given the following information from the airspeed indicator:

        - Green arc: {{vs1}} kt - 165 kt
        - White arc: {{vs0}} kt - 85 kt
        - VNE: 185 kt

        What is the limit load factor?
      explanation: |-
        VA is the speed at which the aeroplane can reach its limit load factor. VS1 is the stall speed at maximum mass, shown as the lower end of the green arc. The stall speed rises with the square root of the load factor, so the limit load factor is the square of the ratio VA / VS1, rounded up to two decimals.

        **Solution**

        $$
        {\frac{\text{VA}}{\text{VS1}}}^{2} = \mathbf{ {{answer}}\ \text{G} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} G**: uses VS0, the lower end of the white arc, instead of VS1.
        - **{{d2}} G**: forgets to square the speed ratio.
        - **{{d3}} G**: takes the square root of the ratio instead of the square.
        - **{{d4}} G**: uses the normal category limit of 2.5 G, which does not apply to this aeroplane.
      presets:
        - variables:
            va: 147
            vs1: 73
            vs0: 55
            answer: 4.06
            d1: 7.15
            d2: 2.02
            d3: 1.42
            d4: 2.5
          correctAnswers:
            - text: 4.06 G
          wrongAnswers:
            - text: 7.15 G
            - text: 1.42 G
            - text: 2.5 G
            - text: 2.02 G
        - variables:
            va: 130
            vs1: 66
            vs0: 52
            answer: 3.88
            d1: 6.25
            d2: 1.97
            d3: 1.41
            d4: 2.5
          correctAnswers:
            - text: 3.88 G
          wrongAnswers:
            - text: 6.25 G
            - text: 1.41 G
            - text: 2.5 G
            - text: 1.97 G
        - variables:
            va: 155
            vs1: 78
            vs0: 60
            answer: 3.95
            d1: 6.68
            d2: 1.99
            d3: 1.41
            d4: 2.5
          correctAnswers:
            - text: 3.95 G
          wrongAnswers:
            - text: 6.68 G
            - text: 1.41 G
            - text: 2.5 G
            - text: 1.99 G
