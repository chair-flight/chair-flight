      question: |-
        An aircraft is in steady, straight and level flight. Given:

        - Initial coefficient of lift (CL): {{cl}}
        - Increase in angle of attack from a vertical gust: {{aoa}}°
        - Change in CL for each 1° change in angle of attack: {{dcl}}

        Calculate the final load factor.
      explanation: |-
        A gust changes the angle of attack and therefore the lift. In steady level flight the lift equals the weight, so the load factor is the new lift coefficient divided by the original one.

        **Solution**

        The gust adds {{macro1}} to the coefficient of lift, so the new CL is {{macro2}}.

        $$
        \frac{\text{Initial CL}+\text{Angle of attack increase}\times \text{CL change per degree}}{\text{Initial CL}} = \frac{ {{cl}}+{{aoa}}\times 0.1}{ {{cl}} } = \mathbf{ {{answer}} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}**: inverts the ratio, so the load factor is given the wrong way round.
        - **{{d2}}**: gives the new lift coefficient instead of the load factor.
        - **{{d3}}**: subtracts the change in CL, which has the wrong sign for an increase in angle of attack.
        - **{{d4}}**: adds the angle in degrees straight to the lift coefficient instead of the change in CL.
