        An increase in angle of attack of 1 degree will increase CL by {{slope}}.

        A vertical up gust instantly changes the angle of attack by {{dalpha}} degrees.

        The load factor will be:
      explanation: |-
        In steady flight the lift equals the weight. The gust changes the angle of attack, which changes the lift coefficient in proportion. The load factor is the new lift divided by the lift in steady flight, so the extra lift is added to the 1 g of steady flight.

        **Solution**

