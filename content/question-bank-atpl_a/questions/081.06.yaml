  templates:
    - type: simple
      question: |-
        An aircraft has the following data:

        - 1 g stalling speed: {{vs1}} kt
        - Limit load factor: {{n}} g

        What is the manoeuvring speed VA?
      explanation: |-
        The manoeuvring speed VA is the highest speed at which full control deflection can be made without overstressing the aircraft. It is linked to the stall speed: the stall speed rises with the square root of the load factor, so VA is the 1 g stalling speed multiplied by the square root of the limit load factor.

        **Solution**

        - VA = 1 g stalling speed × √(limit load factor)
        - $$\text{1 g stalling speed}\times \sqrt{\text{Limit load factor}} = {{vs1}}\times \sqrt{ {{n}} } = \mathbf{ {{answer}}\ \text{kt} }$$

        ## Why the other answers are wrong

        - **{{d1}} kt**: divides the stalling speed by the square root of the load factor, which lowers the speed instead of raising it.
        - **{{d2}} kt**: multiplies the stalling speed by the load factor instead of its square root.
        - **{{d3}} kt**: uses a fixed 1.5 g instead of the given load factor.
        - **{{d4}} kt**: squares the load factor instead of taking its square root.
      presets:
        - variables:
            vs1: 70
            n: 2.5
            answer: 111
            d1: 44
            d2: 175
            d3: 105
            d4: 438
          correctAnswers:
