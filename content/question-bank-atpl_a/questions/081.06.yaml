      question: |-
        The design manoeuvring speed (VA) of an aircraft is known at one mass. Given:

        - Original mass: {{m1}} t
        - VA at the original mass: {{va1}} kt
        - New mass: {{m2}} t

        What is the VA at the new mass?
      explanation: |-
        VA depends on the stall speed of the aircraft, and the stall speed rises with the square root of the mass. A lighter aircraft therefore has a lower VA, and the change is the square root of the mass ratio, not the ratio itself.

        **Solution**

        $$
        \text{VA at the original mass}\times \sqrt{\frac{\text{New mass}}{\text{Original mass}}} = {{va1}}\times \sqrt{\frac{ {{m2}} }{ {{m1}} }} = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: assumes VA changes in direct proportion to the mass.
        - **{{d2}} kt**: inverts the mass ratio, so a lighter aircraft would get a higher VA.
        - **{{d3}} kt**: uses the square of the mass ratio instead of its square root.
        - **{{d4}} kt**: keeps the original VA and ignores the change in mass.
      presets:
