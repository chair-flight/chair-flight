  templates:
    - type: simple
      question: On a conventional aeroplane, what does the automatic pitch trim system do?
      explanation: On a conventional aeroplane, the automatic pitch trim senses a sustained force on the elevator control and moves the trim to relieve it, so the pilot does not have to hold the force.
      presets:
        - correctAnswers:
            - text: When force on the elevator control is detected, the system moves the trim to relieve the load.
          wrongAnswers:
            - text: It is an autopilot mode to ensure the correct rotation rate is maintained during take-off.
            - text: It is a system used to compensate for incorrect pilot inputs.
            - text: When force on the elevator control is detected, it directs the pilot to trim the elevator to relieve the load.
