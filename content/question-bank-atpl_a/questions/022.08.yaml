      question: What is the main purpose of dutch roll filter?
      explanation: The Dutch roll filter separates a commanded turn from yaw due to a disturbance or apparent Dutch roll. The yaw damper then acts only on the oscillation, and does not oppose the turn.
      presets:
        - correctAnswers:
            - text: To distinguish commanded turn inputs from yaw due to a disturbance or apparent Dutch roll.
          wrongAnswers:
            - text: To prevent yaw damper overreacting to dutch roll.
            - text: To sense the aeroplane’s motion about the normal or vertical axis.
            - text: To prevent yaw damper from reacting too quickly to dutch roll.
