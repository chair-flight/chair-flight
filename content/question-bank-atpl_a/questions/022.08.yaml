    - type: simple
      question: On a fly-by-wire aeroplane, what does the automatic pitch trim system do?
      explanation: On a fly-by-wire aeroplane, the automatic pitch trim keeps the attitude that the pilot has set. When the pilot releases the pressure at the desired pitch attitude, the system holds the new attitude, and it also works when the autopilot is off.
      presets:
        - correctAnswers:
            - text: If the PF changes pitch attitude and, at the desired attitude, releases control pressure, the system holds that new attitude.
          wrongAnswers:
            - text: It trims the aeroplane, if the autopilot has been engaged.
            - text: If the pitch attitude is alternated and control pressure released, the system returns to the previous pitch rate setting.
            - text: It performs the rotation during take-off.
