  annexes: []
  learningObjectiveIds:
    - 010.02.02.01.01
  templates:
    - type: simple
      question: An aircraft of an airline operating in Malta was built in the USA and registered in Germany. Who bears the responsibility for issuing the Certificate of Airworthiness?
      explanation: |-
        ### Chicago Convention, Article 31

        > Every aircraft engaged in international navigation shall be provided with a **certificate of airworthiness issued or rendered valid by the State in which it is registered**.
      presets:
        - correctAnswers:
            - text: Germany.
          wrongAnswers:
            - text: The state of design.
            - text: Malta.
            - text: USA.
    - type: simple
      question: A certificate of airworthiness shall be issued on the basis of satisfactory evidence that the aircraft complies with the design aspects of the appropriate airworthiness requirements. Who issues the Certificate of Airworthiness?
      explanation: |-
        ### Chicago Convention, Article 31

        > Every aircraft engaged in international navigation shall be provided with a **certificate of airworthiness issued or rendered valid by the State in which it is registered**.
      presets:
        - correctAnswers:
            - text: The authority of the State of Registration.
          wrongAnswers:
            - text: The authority of the State of the Operator.
            - text: The authority of the State of Manufacture.
            - text: The operator.
- id: QALTD
  subjectId: "010"
  chapterId: "010.02"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-106154
    - AVEXAM-90055
    - BGS-101423
    - ATPLQ-104471
    - AVEXAM-34503
  annexes: []
  learningObjectiveIds:
    - 010.02.02.01.02
    - 010.02.02.01.05
  templates:
    - type: simple
      question: |-
        Complete the following phrase:

        An aircraft that is operated in the EU must hold \_\_\_\_\_ that is issued or rendered valid by the State of Registry.
      explanation: |-
        ### Chicago Convention, Article 31

        > Every aircraft engaged in international navigation shall be provided with a **certificate of airworthiness issued or rendered valid by the State in which it is registered**.
      presets:
        - correctAnswers:
            - text: A Certificate of Airworthiness.
          wrongAnswers:
            - text: An Aircraft Technical Log.
            - text: A Journey Log.
            - text: A Type Certificate.
    - type: simple
      question: An aircraft is registered in Germany and flies frequently between Greece and Italy. Under the laws of which State does the renewal of its certificate of airworthiness fall?
      explanation: |-
        ### Chicago Convention, Article 31

        > Every aircraft engaged in international navigation shall be provided with a **certificate of airworthiness issued or rendered valid by the State in which it is registered**.

        Rendering the certificate valid again is therefore the task of Germany, the State of Registry, wherever the aircraft flies.
      presets:
        - correctAnswers:
            - text: Germany.
          wrongAnswers:
            - text: Greece.
            - text: Italy.
            - text: Both Greece and Italy.
- id: QRIYV
  subjectId: "010"
  chapterId: "010.02"
  relatedQuestionIds:
    - QNSRM
    - QJPFE
  externalQuestionIds:
    - ATPLQ-108142
    - AVEXAM-69018
    - BGS-101508
    - ATPLQ-103345
    - AVEXAM-78431
  annexes: []
  learningObjectiveIds:
    - 010.02.02.01.04
  templates:
    - type: simple
      question: The State that shall judge whether a damaged aircraft is airworthy, as defined by the appropriate airworthiness requirements, is the?
      explanation: |-
        ### ICAO Annex 8, Part II, 3.6

        > 3.6.1 When an aircraft has sustained damage, **the State of Registry shall judge** whether the damage is of a nature such that the aircraft is no longer airworthy as defined by the appropriate airworthiness requirements.

        > 3.6.4 When the State of Registry considers that the damage sustained is of a nature such that the aircraft is still airworthy, **the aircraft shall be allowed to resume its flight**.
      presets:
        - correctAnswers:
            - text: State of Registry.
          wrongAnswers:
            - text: Contracting State.
            - text: State of Manufacture.
            - text: State of Design.
    - type: simple
      question: Continued Airworthiness after damage – When an aircraft has sustained damage, the aircraft shall be allowed to resume its flight, if the..
      explanation: |-
        ### ICAO Annex 8, Part II, 3.6

        > 3.6.1 When an aircraft has sustained damage, **the State of Registry shall judge** whether the damage is of a nature such that the aircraft is no longer airworthy as defined by the appropriate airworthiness requirements.

        > 3.6.4 When the State of Registry considers that the damage sustained is of a nature such that the aircraft is still airworthy, **the aircraft shall be allowed to resume its flight**.
      presets:
        - correctAnswers:
            - text: State of Registry considers that the damage sustained is of such nature that the aircraft is still airworthy.
          wrongAnswers:
            - text: State of Manufacture informs the State of Registry that the damage sustained is of a nature such that the aircraft is still airworthy.
            - text: State of Design and the State of Manufacture inform the State of Registry that the aircraft is still airworthy.
            - text: State of Registry, the State of Design and the State of Manufacture consider that the aircraft is still airworthy.
- id: QNSRM
  subjectId: "010"
  chapterId: "010.02"
  relatedQuestionIds:
