  annexes: []
  learningObjectiveIds:
    - 010.02.02.01.04
  templates:
    - type: simple
      question: Which State ensures the existence of a continuing structural integrity programme to ensure the airworthiness of the aeroplane above 5700 kg certificated take-off mass?
      explanation: |-
        ### ICAO Annex 8, Part II, 4.2.1.1

        > The State of Design of an aircraft shall: […] c) ensure that, in respect of aeroplanes over 5 700 kg maximum certificated take-off mass, there exists a **continuing structural integrity programme** to ensure the airworthiness of the aeroplane. The programme shall include specific information concerning corrosion prevention and control.
      presets:
        - correctAnswers:
            - text: The State of Design.
          wrongAnswers:
            - text: The State of Maintenance Facility.
            - text: The State of Registry.
            - text: The State of Manufacture.
    - type: simple
      question: Which of the following refers to the state of design?
      explanation: |-
        ### ICAO Annex 8, Part II, 4.2.1.1

        > The State of Design of an aircraft shall: […] c) ensure that, in respect of aeroplanes over 5 700 kg maximum certificated take-off mass, there exists a **continuing structural integrity programme** to ensure the airworthiness of the aeroplane. The programme shall include specific information concerning corrosion prevention and control.
      presets:
        - correctAnswers:
            - text: It shall ensure that there exists a continuing structural integrity program to ensure the airworthiness of aeroplanes above 5 700 kg.
          wrongAnswers:
            - text: It is responsible for investigation if an accident happened in a non-contracting state.
            - text: It issues the certificate of airworthiness.
            - text: It performs the investigation if an accident occurs in the territory of a contracting state.
- id: QRPAN
  subjectId: "010"
