  learningObjectiveIds:
    - 010.02.04.01.01
  templates:
    - type: simple
      question: In the case of a heavier-than-air aircraft, where on the fuselage structure are the registration marks?
      explanation: |-
        ### ICAO Annex 7, 4.3.2

        > Fuselage (or equivalent structure) and vertical tail surfaces. On heavier-than-air aircraft, the marks shall appear either **on each side of the fuselage (or equivalent structure) between the wings and the tail surface or on the upper halves of the vertical tail surfaces**.
      presets:
        - correctAnswers:
            - text: Either on each side of the fuselage between the wings and the tail surface or on the upper halves of the vertical tail surfaces.
          wrongAnswers:
            - text: Any place that is visible.
            - text: Either on the right side only of the fuselage between the wings and the tail surface or on the lower halves of the vertical tail surfaces.
            - text: Either on the left side only of the fuselage between the wings and the tail surface or on the lower halves of the vertical tail surfaces.
