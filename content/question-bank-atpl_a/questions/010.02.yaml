  templates:
    - type: simple
      question: Which of the following refers to the State of Manufacture?
      explanation: |-
        ### ICAO Annex 13, Chapter 1, Definitions

        > State of Manufacture. The State having jurisdiction over the organization responsible for the **final assembly of the aircraft**, engine or propeller.
      presets:
        - correctAnswers:
            - text: It has jurisdiction over the organisation responsible for the final assembly of the aircraft.
