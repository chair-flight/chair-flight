    - AVEXAM-8704
  annexes: []
  learningObjectiveIds:
    - 061.05.01.02.01
  templates:
    - type: simple
      question: |-
        An aircraft flies between two positions. Determine the arc-to-time difference between them, given:

        - Longitude of position A: {{lon_a}}° (east positive, west negative)
        - Longitude of position B: {{lon_b}}° (east positive, west negative)

        What is the arc-to-time difference?
      explanation: |-
        The Earth turns through 360° of longitude in 24 hours, so every degree of longitude corresponds to 4 minutes of time. The arc-to-time difference uses the shorter arc between the two meridians, which is never more than 180°.

        **Solution**

        Longitude difference: {{macro1}}°, shorter arc: {{macro2}}°

        $$
        \text{round}(\text{min}(|\text{longitude A}-\text{longitude B}|,360-|\text{longitude A}-\text{longitude B}|)\times 4) = \text{round}(\text{min}(|{{lon_a}}-({{lon_b}})|,360-|{{lon_a}}-({{lon_b}})|)\times 4) = \mathbf{ {{answer}} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}**: multiplies the shorter arc by 15, the rate for one hour, instead of 4 minutes per degree.
        - **{{d2}}**: uses the degrees directly as minutes, forgetting the factor of 4.
        - **{{d3}}**: divides by 4 instead of multiplying, which inverts the conversion.
        - **{{d4}}**: adds an extra hour to the correct value.
      presets:
        - variables:
            lon_a: 139.83
            lon_b: -149.87
            macro1: 289.7
            macro2: 70.3
            answer: 4 hours 41 minutes
            d1: 17 hours 34 minutes
            d2: 1 hours 10 minutes
            d3: 0 hours 18 minutes
            d4: 5 hours 41 minutes
          correctAnswers:
            - text: 4 hours 41 minutes
          wrongAnswers:
            - text: 17 hours 34 minutes
            - text: 0 hours 18 minutes
            - text: 5 hours 41 minutes
            - text: 1 hours 10 minutes
        - variables:
            lon_a: -0.46
            lon_b: -73.78
            macro1: 73.32
            macro2: 73.32
            answer: 4 hours 53 minutes
            d1: 18 hours 20 minutes
            d2: 1 hours 13 minutes
            d3: 0 hours 18 minutes
            d4: 5 hours 53 minutes
          correctAnswers:
            - text: 4 hours 53 minutes
          wrongAnswers:
            - text: 18 hours 20 minutes
            - text: 0 hours 18 minutes
            - text: 5 hours 53 minutes
            - text: 1 hours 13 minutes
        - variables:
            lon_a: 15
            lon_b: -100
            macro1: 115
            macro2: 115
            answer: 7 hours 40 minutes
            d1: 28 hours 45 minutes
            d2: 1 hours 55 minutes
            d3: 0 hours 29 minutes
            d4: 8 hours 40 minutes
          correctAnswers:
            - text: 7 hours 40 minutes
          wrongAnswers:
            - text: 28 hours 45 minutes
            - text: 0 hours 29 minutes
            - text: 8 hours 40 minutes
            - text: 1 hours 55 minutes
