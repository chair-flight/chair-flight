- id: QOKDP
  subjectId: "061"
  chapterId: "061.05"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-613318
    - AVEXAM-86197
  annexes: []
  learningObjectiveIds:
    - 061.05.01.02.01
  templates:
    - type: simple
      question: |-
        Your position is latitude {{lat}}° N, longitude {{lon}}° (east positive, west negative). The local mean time (LMT) at this position is {{lmt_h}}:{{lmt_m}}.

        What is the Coordinated Universal Time (UTC) at this moment? Give the answer as hh:mm.
      explanation: |-
        Local Mean Time moves by 4 minutes for every degree of longitude. East of Greenwich the local clock is ahead of UTC, and west of Greenwich it is behind. To find UTC, take the longitude correction away from the local time, and keep the result within one day.

        **Solution**

        - Local time in minutes after midnight: {{lmt_h}}:{{lmt_m}} = {{macro1}} min
        - Longitude correction: {{lon}}° × 4 min = {{macro2}} min
        - UTC in minutes: {{macro1}} − ({{macro2}}) = {{macro3}} min, within one day **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}}**: adds the longitude correction instead of subtracting it
        - **{{d2}}**: ignores the longitude completely
        - **{{d3}}**: adds one hour to the result
        - **{{d4}}**: subtracts the longitude in degrees as if it were minutes
      presets:
        - variables:
            lat: 45.25
            lon: 75.5
            lmt_h: 7
            lmt_m: 40
            macro1: 460
            macro2: 302
            macro3: 158
            answer: 02:38
            d1: 762
            d2: 07:40
            d3: 03:38
            d4: 06:25
          correctAnswers:
            - text: 02:38
          wrongAnswers:
            - text: "762"
            - text: 03:38
            - text: 06:25
            - text: 07:40
