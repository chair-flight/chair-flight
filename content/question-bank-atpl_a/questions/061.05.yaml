  templates:
    - type: simple
      question: |-
        An aircraft departs from an airport and, after a flight, lands at a destination airport. Determine the Local Mean Time (LMT) on landing, given:

        - Departure time: {{dep_h}}:{{dep_m}} LMT
        - Longitude of departure airport: {{dep_lon}}° (east positive, west negative)
        - Flight time: {{flight_h}} hours
        - Longitude of destination airport: {{dest_lon}}° (east positive, west negative)

        What is the Local Mean Time on landing?
      explanation: |-
        Local Mean Time depends on longitude. The sun moves 15° per hour, so each degree of longitude travelled eastward adds 4 minutes to the clock and each degree travelled westward takes 4 minutes away. The longitude change is taken as the eastward distance from the departure meridian to the destination meridian, and the result is kept within one day.

        **Solution**

        Departure time plus flight time: {{macro1}} minutes after midnight

        Eastward longitude change: {{macro2}}° = {{macro3}} minutes

        Total: {{macro4}} minutes, within one day: **{{answer}} LMT**

        ## Why the other answers are wrong

        - **{{d1}}**: forgets the change of longitude and uses the departure time plus flight time only.
        - **{{d2}}**: subtracts the eastward change instead of adding it, which moves the clock the wrong way.
        - **{{d3}}**: leaves out the flight time.
        - **{{d4}}**: counts the flight time twice.
      presets:
