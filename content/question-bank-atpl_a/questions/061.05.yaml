  templates:
    - type: simple
      question: Refer to the figures. What is the duration of evening civil twilight (ECT) at Guangzhou Balyon Airport, China (N23° 24', E113° 18') on the 11th October?
      explanation: |-
        Evening civil twilight is the time between sunset and the moment the sun is 6° below the horizon. Its duration is read from the civil twilight figure for the date and place.

        **Solution**

        - Find 11 October on the figure for the latitude of Guangzhou.
        - Read the duration of evening civil twilight.
        - The duration is **23 minutes**.

        ## Why the other answers are wrong

        - **28 minutes**: read from the wrong point on the figure.
        - **19 minutes**: read a little too early on the curve.
        - **26 minutes**: read a little too late on the curve.
      presets:
        - correctAnswers:
            - text: 23 minutes
          wrongAnswers:
            - text: 26 minutes
            - text: 28 minutes
            - text: 19 minutes
