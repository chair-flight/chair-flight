- id: QSTND
  subjectId: "010"
  chapterId: "010.09"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-108545
    - AVEXAM-75003
    - BGS-101715
  annexes: []
  learningObjectiveIds:
    - 010.09.08.01.01
  templates:
    - type: simple
      question: The declared distances, which shall be calculated for each runway direction, are the take-off run available (TORA), ..
      explanation: |-
        ### GM1 ADR.OPS.A.005, Aerodrome data

        > (b) (1) Where a runway is not provided with a stopway or a clearway and the threshold is located at the extremity of the runway, the four declared distances should normally be **equal to the length of the runway**. (2) When a runway is provided with a clearway (CWY), then the **TODA** will include the length of clearway. (3) Where a runway is provided with a stopway (SWY), then the **ASDA** will include the length of stopway. (4) Where a runway has a displaced threshold, then the **LDA** will be reduced by the distance the threshold is displaced.

        The stopway lengthens only the ASDA. The clearway lengthens only the TODA. The displaced threshold shortens only the LDA. The TORA is not changed by any of them.
      presets:
        - correctAnswers:
            - text: take-off distance available (TODA), accelerate-stop distance available (ASDA), and landing distance available (LDA).
          wrongAnswers:
            - text: take-off distance available (TODA), accelerate-stop distance available (ASDA), and runway-end safety area (RESA).
            - text: accelerate-stop distance available (ASDA), landing distance available (LDA), and, if present, length of any displaced thresholds (THR).
            - text: take-off distance available (TODA), and runway length (RL).
