  templates:
    - type: simple
      question: Before shutdown at the end of the flight, the pilot wants to calculate the drift error of the IRU. What are the two parameters that need to be inserted into an IRU to obtain an error in NM/hr?
      explanation: The drift error is the difference between the position shown by the IRU and the known ramp position, divided by the hours of operation. The inputs are the ramp coordinates and the operating hours, giving an error in NM per hour.
      presets:
        - correctAnswers:
            - text: Ramp position coordinates and hours of IRU operation.
          wrongAnswers:
            - text: Average TAS and average Mach number.
            - text: Average ground speed and flight time.
            - text: Average TAS and hours of IRU operation.
