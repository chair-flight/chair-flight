  templates:
    - type: simple
      question: |-
        A pilot flies under VFR and must clear the highest obstacle on the route by a minimum height. Given the following information:

        - Highest obstacle elevation: {{obstacle}} ft
        - Required clearance: {{clearance}} ft
        - Magnetic track: {{track}}°
        - QNH: {{qnh}} hPa
        - Temperature: ISA {{isa}}°C

        Assume 1 hPa = 30 ft. What is the lowest appropriate VFR flight level that gives this clearance?
      explanation: |-
        The required height is the obstacle elevation plus the clearance. It is corrected for the temperature (4 ft per degree per 1000 ft) and for the QNH (30 ft per hPa) to give a flight level reading, and then the lowest VFR level for the track at or above that value is chosen. For tracks of 000° to 179° magnetic the VFR levels are odd thousands plus 500 ft, and for 180° to 359° they are even thousands plus 500 ft.

        **Solution**

        - Required height: {{macro1}} ft
        - Corrected for temperature: {{macro2}} ft
        - Corrected for QNH: {{macro3}} ft
        - Lowest VFR level for the track at or above that value: **FL{{answer}}**

        ## Why the other answers are wrong

        - **FL{{d1}}**: uses the IFR level pattern instead of the VFR pattern for the track.
        - **FL{{d2}}**: rounds down, so the level does not give the required clearance.
        - **FL{{d3}}**: only converts the obstacle height to a flight level and ignores the corrections.
      presets:
        - variables:
            obstacle: 13421
            clearance: 2000
            track: 311
            qnh: 989
            isa: -10
            macro1: 15421
            macro2: 16064
            macro3: 16791
            answer: 185
