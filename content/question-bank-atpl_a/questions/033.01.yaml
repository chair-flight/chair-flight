  templates:
    - type: simple
      question: |-
        Given the following information, what is the ground speed (kt) of the aircraft?

        - TAS: {{tas}} kt
        - Heading: {{hdg}}°
        - Wind: {{wd}}°/{{ws}} kt
      explanation: |-
        With the heading known, the ground speed is the vector sum of the TAS (along the heading) and the wind. Resolve the wind into a component along the heading and a component across it, then combine them with Pythagoras.

        **Solution**

        Along heading: {{macro1}} kt; across heading: {{macro2}} kt

        $$
        \sqrt{{(\text{TAS}-\text{Wind speed}\times \text{cos}(\text{Wind direction}-\text{Heading}))}^{2}+{(\text{Wind speed}\times \text{sin}(\text{Wind direction}-\text{Heading}))}^{2}} = \sqrt{{({{tas}}-{{ws}}\times \text{cos}({{wd}}-{{hdg}}))}^{2}+{({{ws}}\times \text{sin}({{wd}}-{{hdg}}))}^{2}} = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: Only the head wind component was subtracted; the cross wind was neglected.
        - **{{d2}} kt**: The head wind component was added instead of subtracted.
        - **{{d3}} kt**: The full wind speed was subtracted from TAS.
        - **{{d4}} kt**: The wind was treated as a perpendicular component to TAS.
      presets:
        - variables:
            tas: 250
            hdg: 90
            wd: 30
            ws: 50
            macro1: 225
            macro2: -43
            answer: 229
            d1: 225
