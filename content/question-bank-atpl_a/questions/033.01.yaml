  learningObjectiveIds:
    - 033.01.01.02.06
  templates:
    - type: simple
      question: |-
        On a VFR flight, the traffic circuit altitude has to be established {{off}} NM before reaching the destination aerodrome. The descent must begin no later than how many nautical miles' ground distance from the airfield?

        - Rate of descent: {{rod}} ft/min
        - Ground speed during descent: {{gs}} kt
        - Initial altitude: {{init}} ft AMSL
        - Traffic circuit altitude: {{circ}} ft AMSL
      explanation: |-
        The descent has to be finished at the circuit altitude a fixed distance before the aerodrome. The descent itself covers (height to lose / rate of descent) x ground speed, and the extra distance to the aerodrome is added on top.

        **Solution**

        Height to lose = {{init}} - {{circ}} = {{macro1}} ft
        Descent distance = {{macro1}} / {{rod}} x {{gs}} / 60 = {{macro2}} NM

        $$
        \frac{\frac{\text{Initial altitude}-\text{Circuit altitude}}{\text{Rate of descent}}\times \text{Ground speed}}{60}+\text{Distance before aerodrome} = \frac{\frac{ {{init}}-{{circ}} }{ {{rod}} }\times {{gs}} }{60}+{{off}} = \mathbf{ {{answer}}\ \text{NM} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} NM**: forgets to add the {{off}} NM between the end of the descent and the aerodrome.
        - **{{d2}} NM**: descends from the initial altitude to zero instead of to the circuit altitude, and forgets the {{off}} NM.
        - **{{d3}} NM**: descends to zero instead of to the circuit altitude.
      presets:
        - variables:
            off: 5
            rod: 500
            gs: 130
            init: 4500
            circ: 2500
            macro1: 2000
            macro2: 9
            answer: 14
            d1: 9
            d2: 20
            d3: 25
          correctAnswers:
            - text: 14 NM
          wrongAnswers:
            - text: 25 NM
            - text: 9 NM
            - text: 20 NM
        - variables:
