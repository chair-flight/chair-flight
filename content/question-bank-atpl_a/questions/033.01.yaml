  learningObjectiveIds:
    - 033.01.01.02.06
  templates:
    - type: simple
      question: |-
        How many feet do you have to climb to reach FL{{fl}}?

        Given:

        - Departure aerodrome elevation: {{elev}} ft
        - QNH = {{qnh}} hPa

        Temperature = ISA
        1 hPa = 30 ft
      explanation: |-
        A flight level is a pressure altitude (standard setting 1013 hPa). The pressure altitude of the aerodrome is its elevation corrected by 30 ft per hPa of difference between 1013 hPa and the QNH. The climb required is the difference between the flight level and the aerodrome pressure altitude.

        **Solution**

        Aerodrome pressure altitude = {{elev}} + (1013 - {{qnh}}) × 30 = {{macro1}} ft

        $$
        \text{Flight level}\times 100-(\text{Aerodrome elevation}+(1013-\text{QNH})\times 30) = {{fl}}\times 100-({{elev}}+(1013-{{qnh}})\times 30) = \mathbf{ {{answer}}\ \text{ft} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} ft**: the QNH correction is applied to the flight level with the wrong sign and the aerodrome elevation is ignored.
        - **{{d2}} ft**: the QNH correction is applied with the wrong sign, and twice.
        - **{{d3}} ft**: the flight level minus the elevation, ignoring the QNH correction.
      presets:
        - variables:
            fl: 75
            elev: 1500
            qnh: 1023
            macro1: 1200
            answer: 6300
            d1: 7800
            d2: 6600
            d3: 6000
          correctAnswers:
            - text: 6300 ft
          wrongAnswers:
            - text: 6000 ft
            - text: 7800 ft
            - text: 6600 ft
        - variables:
