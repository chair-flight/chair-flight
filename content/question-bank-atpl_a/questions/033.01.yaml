        You are planning a flight from Niederoblarn aerodrome (LOGO) (47°29′N, 014°00'E) to Leoben Timmersdorf aerodrome (LOGT) (47°23'N, 014°58'E).

        Determine the approximate distance between the LOGO and LOGT aerodromes:
      explanation: |-
        The latitude difference is 6′, which is 6 NM. The longitude difference is 58′, and at 47° N one minute of longitude is about 0.68 NM, so 58 × 0.68 = 39.3 NM.

        The distance is about √(39.3² + 6²) = 39.8, so approximately **39 NM**.
      presets:
