      question: Refer to VFR Chart ED-4 from Jeppesen GSPRM 2017. What is the distance and true course from RODING VOR (RDG, N49°02.5' E012°31.5') to THALMÄSSING-WAIZENHOFEN (EDPW, N49° 03.85' E011° 12.57') airfield?
      explanation: |-
        RODING is at 12°31.5′ E and THALMÄSSING-WAIZENHOFEN at 11°12.57′ E, so it lies to the west by 78.9′ of longitude. At 49° N one minute of longitude is about 0.655 NM, so 78.9 × 0.655 = 51.7 NM. The 1.35′ difference in latitude hardly changes this.

        The true course is just north of due west, **272°**, and the distance is **52 NM**.
      presets:
        - correctAnswers:
            - text: 272°, 52 NM
          wrongAnswers:
            - text: 272°, 39 NM
            - text: 092°, 39 NM
            - text: 092°, 52 NM
