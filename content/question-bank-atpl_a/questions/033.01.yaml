  annexes: []
  learningObjectiveIds:
    - 033.01.01.02.06
  templates:
    - type: simple
      question: |-
        The elevation of the departure airport is {{elev}} ft. 

        An aircraft has to climb to FL{{fl}} with a rate of climb of {{roc}} ft/min. 

        The QNH is {{qnh}} hPa. 

        Determine the climb time.
      explanation: |-
        The flight level is a pressure altitude, so the height to climb is measured from the pressure altitude of the aerodrome: its elevation plus 30 ft per hPa that the QNH is below 1013 hPa. The climb time is that height divided by the rate of climb.

        $$
        \text{Aerodrome pressure altitude} &= {{elev}} + (1013 - {{qnh}}) \times 30 = {{macro1}}\ \text{ft} \\
                    \text{Height to climb} &= {{fl}} \times 100 - {{macro1}} = {{macro3}}\ \text{ft} \\
                               \text{Time} &= \frac{ {{macro3}}\ \text{ft} }{ {{roc}}\ \text{ft/min} } \approx \mathbf{ {{answer}}\ \text{min} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} min**: the QNH correction is ignored; the height is taken from the elevation only.
        - **{{d2}} min**: the QNH correction is applied with the wrong sign, and twice.
        - **{{d3}} min**: the QNH correction is applied twice in the right direction (it is added to the height instead of the aerodrome pressure altitude being computed).
      presets:
