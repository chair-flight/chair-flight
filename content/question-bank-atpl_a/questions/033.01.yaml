      question: |-
        Refer to the VFR chart (Jeppesen GSPRM 2017). An aircraft on a VFR flight intends to fly overhead aerodrome Straubing (EDMS). The upper limit of the Straubing Class F airspace read from the chart is {{top}} ft. What is the minimum indicated altitude (ft) required to clear the airspace by {{margin}} ft?

        Altimeter temperature error with an OAT -7°C at Straubing: {{err}} ft. QNH at Straubing: 998 hPa. Altimeter setting: 998 hPa.
      explanation: |-
        The required true altitude is the airspace limit plus the clearance. In cold air the altimeter over-reads, so the true altitude is lower than indicated; the indicated altitude must therefore be higher by the temperature error. The altimeter setting equals QNH, so no pressure correction is needed.

        **Solution**

        $$
        \text{Airspace upper limit (read from chart)}+\text{Required clearance}+\text{Altimeter temperature error} = {{top}}+{{margin}}+{{err}} = \mathbf{ {{answer}}\ \text{ft} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} ft**: The temperature error was subtracted instead of added.
        - **{{d2}} ft**: The clearance was subtracted instead of added.
        - **{{d3}} ft**: The clearance was forgotten.
        - **{{d4}} ft**: The temperature error was forgotten.
      presets:
