        The leg time is the distance divided by the ground speed. The ground speed follows from the wind triangle: the wind correction angle (WCA) needed to hold the track changes the TAS component along the track, and the wind adds or subtracts its along-track component.

        **Solution**

        WCA = {{macro1}}°

        Ground speed = {{macro2}} kt

        Leg time = $$\frac{\text{Distance}}{\text{TAS}\times \text{cos}(\text{asin}(\frac{\text{Wind speed}\times \text{sin}(\text{Wind direction}-\text{Track})}{\text{TAS}}))-\text{Wind speed}\times \text{cos}(\text{Wind direction}-\text{Track})}\times 60 = \mathbf{ {{answer}}\ \text{minutes} }$$

        ## Why the other answers are wrong

        - **{{d1}} minutes**: wind ignored, distance divided by TAS.
        - **{{d2}} minutes**: the crosswind-related sine component was used as headwind and no wind correction angle was applied.
        - **{{d3}} minutes**: the headwind component was added to the TAS as if it were a tailwind.
