  templates:
    - type: simple
      question: A VFR flight is planned from aerodrome A to aerodrome B on a 085° track. What would be an appropriate Flight Level for this route?
      explanation: Under the semicircular rule, VFR flights on tracks from 000° to 179° fly at odd thousands plus 500 ft (FL35, FL55, FL75), and tracks from 180° to 359° at even thousands plus 500 ft. A 085° track gives FL55.
