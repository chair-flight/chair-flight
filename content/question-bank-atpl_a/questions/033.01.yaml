            rod: 500
            gs: 120
            init: 5000
            circ: 3000
            macro1: 2000
            macro2: 8
            answer: 12
            d1: 8
            d2: 20
            d3: 24
          correctAnswers:
            - text: 12 NM
          wrongAnswers:
            - text: 24 NM
            - text: 8 NM
            - text: 20 NM
        - variables:
