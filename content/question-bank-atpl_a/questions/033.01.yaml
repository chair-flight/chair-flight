  templates:
    - type: simple
      question: |-
        Given the following information, what heading (°) must be selected in order to maintain the desired track DTK?

        - DTK: {{dtk}}°
        - TAS: {{tas}} kt
        - Wind: {{wd}}°/{{ws}} kt
      explanation: |-
        To hold the desired track, the heading must be offset into the wind by the wind correction angle: WCA = asin(WS x sin(wind direction - track) / TAS). The heading is the track plus this angle (a negative angle when the wind comes from the left of track).

        **Solution**

        WCA = {{macro1}}°

        $$
        \text{Desired track}+\text{asin}(\frac{\text{Wind speed}\times \text{sin}(\text{Wind direction}-\text{Desired track})}{\text{TAS}}) = {{dtk}}+\text{asin}(\frac{ {{ws}}\times \text{sin}({{wd}}-{{dtk}})}{ {{tas}} }) = \mathbf{ {{answer}}\ \text{°} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} °**: The correction was applied in the wrong direction (away from the wind).
        - **{{d2}} °**: The full wind speed was used as cross wind, ignoring the wind angle, and applied in the wrong direction.
        - **{{d3}} °**: The full wind speed was used as cross wind, ignoring the wind angle.
        - **{{d4}} °**: The correction was applied to the wind direction instead of the track.
