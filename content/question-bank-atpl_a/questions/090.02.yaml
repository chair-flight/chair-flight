            - text: The pilot shall maintain the vertical speed and report "TCAS RA complete. Request vectors."
    - type: simple
      question: A pilot is following a TCAS Resolution Advisory (RA). TCAS alerted the pilot to climb and the aircraft has diverted from the flight level given by ATC. After completion of the TCAS RA the pilot commences a maneuver to return to FL260, which was the last clearance received by ATC. What should the pilot report to the ATC?
      explanation: ""
      presets:
        - correctAnswers:
            - text: FASTAIR 345, clear of conflict, returning to FL260.
          wrongAnswers:
            - text: FASTAIR 345, RA completed, returning to FL260.
            - text: FASTAIR 345, RA completed, FL260 resumed.
            - text: FASTAIR 345, clear of conflict, FL260 resumed.
