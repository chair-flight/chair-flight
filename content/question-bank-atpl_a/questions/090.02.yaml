      question: The pilot of a jet transport aeroplane is in cruise flight at FL350 when he/she receives the TCAS RA "Descend, descend". The pilot immediately starts to descend and informs ATC about the TCAS RA. Finally, the device reports "Clear of conflict". What should the pilot do next?
      explanation: ""
      presets:
        - correctAnswers:
            - text: The pilot shall initiate a climb back to FL350 and immediately report "Clear of conflict. Returning to FL350".
          wrongAnswers:
            - text: The pilot shall maintain the current altitude, inform ATC using the phrase "TCAS descent complete" and request further instructions.
            - text: The pilot shall initiate a climb back to FL350 and report "TCAS RA clear of conflict. FL350 RESUMED" once he/she has returned to FL350.
            - text: The pilot shall maintain the vertical speed and report "TCAS RA complete. Request vectors."
