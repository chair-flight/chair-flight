  templates:
    - type: simple
      question: An aircraft is in cruise flight at FL350 when the crew receives a TCAS RA "Descend, descend". The pilot starts an immediate descent and informs ATC about the TCAS RA manoeuvre. Eventually, the TCAS reports "Clear of conflict". What should the pilot do next?
      explanation: ""
      presets:
        - correctAnswers:
            - text: The pilot shall initiate a climb back to FL350 and immediately report "Clear of conflict. Returning to FL350".
          wrongAnswers:
            - text: The pilot shall initiate a climb back to FL350 and report "TCAS RA clear of conflict. FL350 RESUMED" once he/she has returned to FL350.
