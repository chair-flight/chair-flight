  learningObjectiveIds:
    - 022.01.01.01.03
  templates:
    - type: simple
      question: "A pressure of {{psi}} psi is equivalent to approximately (in bar):"
      explanation: |-
        1 bar is about 14.5 psi, so for a quick approximation divide the value in psi by about 15 to get bar.

        **Solution**

        $$
        \frac{\text{pressure}}{15} = \frac{ {{psi}} }{15} = \mathbf{ {{answer}}\ \text{bar} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} bar**: divides by 150, one power of ten too much.
        - **{{d2}} bar**: divides by 1500, two powers of ten too much.
        - **{{d3}} bar**: divides by 1.5, one power of ten too little.
      presets:
        - variables:
            psi: 6000
            answer: 400
            d1: 40
            d2: 4
            d3: 4000
          correctAnswers:
            - text: 400 bar
          wrongAnswers:
            - text: 4000 bar
            - text: 40 bar
            - text: 4 bar
        - variables:
            psi: 3000
            answer: 200
            d1: 20
            d2: 2
            d3: 2000
          correctAnswers:
            - text: 200 bar
          wrongAnswers:
            - text: 2000 bar
            - text: 20 bar
            - text: 2 bar
        - variables:
            psi: 4500
            answer: 300
            d1: 30
            d2: 3
            d3: 3000
          correctAnswers:
            - text: 300 bar
          wrongAnswers:
            - text: 3000 bar
            - text: 30 bar
            - text: 3 bar
