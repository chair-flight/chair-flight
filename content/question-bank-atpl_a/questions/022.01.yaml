      question: "A pressure of {{bar}} bar is equivalent to approximately (in psi):"
      explanation: |-
        1 bar is about 14.5 psi, so for a quick approximation multiply the value in bar by about 15 to get psi.

        **Solution**

        $$
        \text{pressure}\times 15 = {{bar}}\times 15 = \mathbf{ {{answer}}\ \text{psi} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} psi**: multiplies by 1.5, one power of ten too little.
        - **{{d2}} psi**: multiplies by 0.15, two powers of ten too little.
        - **{{d3}} psi**: multiplies by 0.015, three powers of ten too little.
      presets:
