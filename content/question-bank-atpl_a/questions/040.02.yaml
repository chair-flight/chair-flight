  templates:
    - type: simple
      question: The average pulse of a healthy adult at rest is about..
      explanation: |-
        A normal resting pulse for an adult is about 60 to 80 beats per minute, and the normal range is quoted as 60 to 100 beats per minute. Athletes can have a resting pulse as low as 30 to 50 beats per minute, which is normal for them: a lower resting heart rate implies a more efficient heart.

        The pulse rate rises with emotion, stress, adrenaline and exercise, and, multiplied by the stroke volume, it gives the cardiac output.
      presets:
        - correctAnswers:
            - text: 60 to 80 beats/min.
          wrongAnswers:
            - text: 30 to 50 beats/min.
            - text: 12 to 18 beats/min.
            - text: 110 to 150 beats/min.
    - type: simple
      question: Which of the following is true concerning the pulse rate?
      explanation: |-
        A normal resting pulse for an adult is about 60 to 80 beats per minute, and the normal range is quoted as 60 to 100 beats per minute. Athletes can have a resting pulse as low as 30 to 50 beats per minute, which is normal for them: a lower resting heart rate implies a more efficient heart.

        The pulse rate rises with emotion, stress, adrenaline and exercise, and, multiplied by the stroke volume, it gives the cardiac output.
      presets:
        - correctAnswers:
            - text: It has a normal range of 60-100 beats per minute.
          wrongAnswers:
            - text: When multiplied by the blood pressure, it gives the cardiac output.
            - text: It is unaffected by emotion.
            - text: It is the only indicator of hypoxia.
