    - type: simple
      question: The normal respiratory rate of an adult at rest is how many breaths per minute?
      explanation: |-
        The normal respiratory rate of an adult at rest is about 12 to 20 breaths per minute (one breath, or cycle, is one inhalation and one exhalation). It is commonly quoted as 10 to 15, 15 to 20 or about 16 breaths per minute.

        Faster rates (20 to 30, above 40) and slower rates (below 10) are not normal for an adult at rest.
      presets:
        - correctAnswers:
            - text: 10 to 15
          wrongAnswers:
            - text: 20 to 25
            - text: 30 to 60
            - text: 6 to 9
