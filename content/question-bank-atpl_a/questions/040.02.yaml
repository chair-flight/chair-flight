    - type: simple
      question: How may the average cardiac output of an adult at rest be calculated?
      explanation: |-
        The cardiac output is the volume of blood the heart pumps each minute: heart rate × stroke volume. At rest a typical adult has a heart rate of about 72 beats per minute and a stroke volume of about 70 ml, which gives about 5 litres per minute.
      presets:
        - correctAnswers:
            - text: Heart rate × stroke volume
          wrongAnswers:
            - text: Heart rate / stroke volume
