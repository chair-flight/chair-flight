  annexes: []
  learningObjectiveIds:
    - 040.02.01.02.01
  templates:
    - type: simple
      question: The lungs expand and contract to make a person breathe in and out, which component of the body makes this happen?
      explanation: |-
        The diaphragm, a dome-shaped muscle below the lungs, is the major muscle of respiration. On inhalation it contracts and flattens, which enlarges the chest cavity and draws air into the lungs. On exhalation it relaxes and the chest cavity gets smaller.

        The lungs have no muscle of their own: they are expanded and compressed by the diaphragm and the chest muscles.
      presets:
        - correctAnswers:
            - text: The diaphragm.
          wrongAnswers:
            - text: The pre-frontal cortex.
            - text: The lungs.
            - text: The heart.
    - type: simple
      question: From the following components of the respiratory system, which one is related to increasing the volume of the chest cavity to achieve normal breathing?
      explanation: |-
        The diaphragm, a dome-shaped muscle below the lungs, is the major muscle of respiration. On inhalation it contracts and flattens, which enlarges the chest cavity and draws air into the lungs. On exhalation it relaxes and the chest cavity gets smaller.

        The lungs have no muscle of their own: they are expanded and compressed by the diaphragm and the chest muscles.
      presets:
        - correctAnswers:
            - text: The diaphragm.
          wrongAnswers:
            - text: The nose and mouth.
            - text: The alveoli.
            - text: The lungs.
