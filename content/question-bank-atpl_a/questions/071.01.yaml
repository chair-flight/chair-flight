- id: QBMVD
  subjectId: "070"
  chapterId: "071.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-708279
    - AVEXAM-38481
  annexes: []
  learningObjectiveIds:
    - 071.01.02.02.16
  templates:
    - type: simple
      question: A VFR flight, operating in the local area with passengers, has differing documentation requirements from a normal commercial flight. What is a key difference?
      explanation: |-
        ### Regulation (EU) No 965/2012, CAT.GEN.MPA.180, Documents, manuals and information to be carried

        > (b) Notwithstanding (a), for operations under visual flight rules (VFR) by day with other-than complex motor-powered aircraft taking off and landing at the same aerodrome or operating site within 24 hours, or remaining within a local area specified in the operations manual, the following documents and information **may be retained at the aerodrome or operating site** instead: (1) noise certificate; (2) aircraft radio licence; (3) journey log, or equivalent; (4) **aircraft technical log**; (5) **NOTAMs and AIS briefing documentation**; (6) meteorological information; (7) notification of SCPs and special loads, if applicable; and (8) **mass and balance documentation**.
      presets:
        - correctAnswers:
            - text: Several Documents can be left on the ground, including the technical log, NOTAMS and mass & balance documentation.
          wrongAnswers:
            - text: Passenger manifests and flight plans are not required for VFR flights.
            - text: There is no difference in document requirements for any type of commercial flight.
            - text: NOTAMs and weather information are not required.
    - type: simple
      question: What differs in terms of documentation between a local VFR flight with passengers and a typical commercial flight?
      explanation: |-
        ### Regulation (EU) No 965/2012, CAT.GEN.MPA.180, Documents, manuals and information to be carried

        > (b) Notwithstanding (a), for operations under visual flight rules (VFR) by day with other-than complex motor-powered aircraft taking off and landing at the same aerodrome or operating site within 24 hours, or remaining within a local area specified in the operations manual, the following documents and information **may be retained at the aerodrome or operating site** instead: (1) noise certificate; (2) aircraft radio licence; (3) journey log, or equivalent; (4) **aircraft technical log**; (5) **NOTAMs and AIS briefing documentation**; (6) meteorological information; (7) notification of SCPs and special loads, if applicable; and (8) **mass and balance documentation**.
      presets:
        - correctAnswers:
            - text: Several Documents can be left on the ground, including the technical log, NOTAMS and mass & balance documentation.
          wrongAnswers:
            - text: There is no difference in document requirements for any type of commercial flight.
            - text: Passenger manifests and flight plans are not required for VFR flights.
            - text: NOTAMs and weather information are not required.
- id: QEFIK
  subjectId: "070"
  chapterId: "071.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-713626
    - AVEXAM-70635
    - BGS-700128
  annexes: []
  learningObjectiveIds:
    - 071.01.02.02.17
  templates:
    - type: simple
      question: During a turnaround, the pilots get a visit from a competent authority who requests to see the aircraft’s documents. What should the commander do in this situation?
      explanation: |-
        ### Regulation (EU) No 965/2012, CAT.GEN.MPA.190, Provision of documentation and records

        > The commander shall, within a reasonable time of being requested to do so by **a person authorised by an authority**, provide to that person the documentation required to be carried on board.

        The request comes from a representative of the competent authority, so the commander provides the documents. Other persons have no such right.
      presets:
        - correctAnswers:
            - text: Provide to that person the documentation required to be carried on board, since s/he is a representative of the authority.
          wrongAnswers:
            - text: The commander must not provide such documents, the inspector should contact the operator.
            - text: Call his/her superior and ask before showing these documents.
            - text: Provide to that person the documentation required to be carried on board, any person can ask for the docs since it's a public matter.
    - type: simple
      question: Between two flights a flight crew has a visit from a representative of the Competent Authority. This person wants to see the aircraft documents. What is the appropriate response by the Commander?
      explanation: |-
        ### Regulation (EU) No 965/2012, CAT.GEN.MPA.190, Provision of documentation and records

        > The commander shall, within a reasonable time of being requested to do so by **a person authorised by an authority**, provide to that person the documentation required to be carried on board.

        The request comes from a representative of the competent authority, so the commander provides the documents. Other persons have no such right.
      presets:
        - correctAnswers:
            - text: To grant this person the access he/she requests as a representative of the competent authority.
          wrongAnswers:
            - text: To deny the request, as only employees of the aircraft Operator have the right to see these documents.
            - text: To call his/her superior and ask him/her whether these documents are to be presented or NOT.
            - text: To grant this person the access he/she requests as anyone who asks is to be given access to the aircraft documents as a matter of public interest.
