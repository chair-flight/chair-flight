        ### Regulation (EU) No 965/2012, CAT.OP.MPA.240, Smoking on board

        > The commander shall not allow smoking on board: (a) whenever considered necessary in the interest of safety; (b) **during refuelling and defuelling of the aircraft**; (c) **while the aircraft is on the surface unless the operator has determined procedures to mitigate the risks during ground operations**; (d) outside designated smoking areas, in the aisle(s) and lavatory(ies); […] (f) in those areas of the passenger compartment where oxygen is being supplied.
      presets:
        - correctAnswers:
