  externalQuestionIds:
    - ATPLQ-718493
    - AVEXAM-8560
    - AVEXAM-55847
  annexes: []
  learningObjectiveIds:
    - 071.01.02.02.07
  templates:
    - type: simple
      question: A CAT operator requires specialist work (which falls under the scope of the CAT operator’s approval) to be carried out by an outside contractor. The contractor’s approval to do these activities has NOT yet been granted by the competent authority. Is it still possible for the contractor to undertake the work for the operator?
      explanation: |-
        ### Regulation (EU) No 965/2012, ORO.GEN.205, Contracted activities

        > (b) When the certified operator […] contracts any part of its activity to an organisation that is not itself certified or authorised in accordance with this Part to carry out such activity, the contracted organisation shall **work under the approval of the operator**. […]

        A contractor without its own approval may still do the work, as a subcontracted activity under the operator's approval and oversight.
      presets:
        - correctAnswers:
            - text: Yes, under the approval and oversight of the operator as a subcontracted activity.
          wrongAnswers:
            - text: No, this work must be done by the operator because it falls under the scope of their approval.
            - text: No, because the overall responsibility for the work rests with the contractor, the contractor must have received their approval.
            - text: Yes, provided the contractor obtains individual approvals for their employees undertaking the work, and agrees with the operator to take full responsibility for the work, in writing.
- id: QBWKM
  subjectId: "070"
  chapterId: "071.01"
  relatedQuestionIds:
