    - BGS-710577
  annexes: []
  learningObjectiveIds:
    - 071.01.02.06.20
  templates:
    - type: simple
      question: "In accordance with OPS regulations, regarding the first aid oxygen, the quantity of undiluted oxygen carried on board a pressurised aeroplane with 8 passengers operated at pressure altitude 27000 ft, shall be sufficient for at least:"
      explanation: |-
        ### Regulation (EU) No 965/2012, CAT.IDE.A.230, First-aid oxygen

        > (a) Pressurised aeroplanes operated at pressure altitudes above 25 000 ft, in the case of operations for which a cabin crew member is required, shall be equipped with a supply of undiluted oxygen for passengers who, for physiological reasons, might require oxygen following a cabin depressurisation.
        >
        > (b) The oxygen supply referred to in (a) shall be sufficient for the remainder of the flight after cabin depressurisation when the cabin altitude **exceeds 8 000 ft** but does not exceed 15 000 ft, **for at least 2 % of the passengers carried, but in no case for less than one person**.

        2 % of 8 passengers is less than one person, so the minimum of one person applies.
      presets:
        - correctAnswers:
            - text: 1 passenger for the remainder of the flight after cabin depressurisation when the cabin altitude exceeds 8000 ft.
          wrongAnswers:
            - text: 2 passengers for the remainder of the flight after cabin depressurisation when the cabin altitude only exceeds 14000 ft.
            - text: 1 passenger for the remainder of the flight after cabin depressurisation when the cabin altitude only exceeds 14000 ft.
            - text: 2 passengers for the remainder of the flight after cabin depressurisation when the cabin altitude exceeds 8000 ft.
