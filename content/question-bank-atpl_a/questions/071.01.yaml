  templates:
    - type: simple
      question: A CAT operator requires specialist work (which falls under the scope of the CAT operator’s approval) to be carried out by an outside contractor. Which of the following options is correct?
      explanation: |-
        ### Regulation (EU) No 965/2012, AMC1 ORO.GEN.205, Contracted activities

        > (b) **A written agreement should exist** between the operator and the contracted organisation clearly defining the contracted activities […] and the applicable requirements.

        An oral agreement, alone or in addition, is not what the AMC describes.
      presets:
        - correctAnswers:
            - text: A written agreement should exist between the operator and the contracted organisation.
          wrongAnswers:
            - text: An oral and written agreement should exist between the operator and the contracted organisation.
            - text: An oral agreement should exist between the operator and the contracted organisation.
            - text: No need for agreement between the operator and the contracted organisation.
