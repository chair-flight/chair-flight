        > The information referred to in (a) includes: (1) a copy of the **operational flight plan**, where appropriate; (2) copies of the relevant part(s) of the **aircraft technical log**; (3) **route-specific NOTAM documentation** if specifically edited by the operator; (4) **mass and balance documentation** if required; and (5) **special loads notification**.

