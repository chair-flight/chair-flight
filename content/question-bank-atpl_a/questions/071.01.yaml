        ### Regulation (EU) No 965/2012, CAT.GEN.MPA.105, Responsibilities of the commander

        > (a) The commander […] shall: […] (5) not allow a person to be carried in the aircraft who appears to be under the influence of alcohol or drugs **to the extent that the safety of the aircraft or its occupants is likely to be endangered**; […]

        The test is whether the intoxication is likely to endanger the aircraft or its occupants. A passive, friendly passenger who accepts the alcohol restriction may travel if the commander judges there is no such danger.
