  templates:
    - type: simple
      question: A CAT operator holds an approval to carry out certain activities, but is currently unable to cope with the amount of work to be undertaken. The operator therefore decides to contract out some of the work to another operator, with the same level of approval. Which of the following statements is true?
      explanation: |-
        ### Regulation (EU) No 965/2012, GM2 ORO.GEN.205, Contracted activities

        > (b) When the contracted organisation is itself certified or authorised to carry out the contracted activities, the operator's compliance monitoring should at least **check that the approval effectively covers the contracted activities and that it is still valid**.

        Contracting is allowed, so it is not prohibited, and the subcontractor's approval must be checked.
      presets:
        - correctAnswers:
            - text: The operator’s compliance monitoring should check that the subcontructor’s approval effectively covers the contracted activities and that it is still valid.
          wrongAnswers:
            - text: There is NO need to check on the subcontractor’s approval, authorisation procedures.
            - text: The type of subcontracting arrangement described is prohibited by the applicable regulations.
            - text: Irrespective of the level of approval held by the subcontractor, the work shall be carried out under the approval of the operator contracting work.
