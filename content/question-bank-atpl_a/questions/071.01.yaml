  learningObjectiveIds:
    - 071.01.02.02.11
  templates:
    - type: simple
      question: While passengers are boarding, the Dispatcher tells the Commander that an intoxicated passenger must be offloaded who, it has been determined, poses a risk to other occupants. The Senior Cabin Crew Member (SCCM) says they remember the passenger, and although the passenger seems intoxicated, the SCCM is happy for the passenger to travel. What is the best action for the commander to take?
      explanation: |-
        ### Regulation (EU) No 965/2012, CAT.GEN.MPA.105, Responsibilities of the commander

        > (a) The commander […] shall: […] (4) have authority to **disembark any person**, or any part of the cargo, that may represent a potential hazard to the safety of the aircraft or its occupants; (5) **not allow a person to be carried** in the aircraft who appears to be under the influence of alcohol or drugs to the extent that the safety of the aircraft or its occupants is likely to be endangered; […]

        The passenger is considered a risk to the other occupants, so the commander does not allow them to travel and assists with the offloading. The SCCM's opinion does not change this.
      presets:
        - correctAnswers:
            - text: If the Dispatcher is requesting to offload the passenger, the Commander should assist in doing this.
          wrongAnswers:
            - text: Once the passenger is on board, it is the Commander’s decision whether they travel, so the Commander should decide alone whether to offload them.
            - text: The Commander should tell the passenger that they may travel on condition that they accept that NO alcohol will be served on the flight.
            - text: If the SCCM is happy for the passenger to travel, then the Commander should allow them to do so.
