  templates:
    - type: simple
      question: A non-pressurised aircraft, carrying 10 passengers, is planning a flight from Zurich (LSZH) to Innsbruck (LOWI) which will be 75 minutes long. 35 minutes are planned to be above FL100\. The final cruising level will be FL130\. The minimum supplemental oxygen that must be carried for the passengers only should be at least adequate for (1) \_\_\_\_\_ passenger(s) and should last for at least (2) \_\_\_\_\_ minutes.
      explanation: |-
        ### Regulation (EU) No 965/2012, CAT.IDE.A.240, Supplemental oxygen – non-pressurised aeroplanes

        > 4. 10 % of passengers: **The entire flying time after 30 minutes at pressure altitudes above 10 000 ft but not exceeding 13 000 ft.**

        10 % of 10 passengers is one passenger. Of the 35 minutes planned above FL100 (10 000 ft), the first 30 minutes are excluded, so the supply must last 35 − 30 = 5 minutes. The final level of FL130 does not exceed 13 000 ft, so the 100 % row does not apply.
      presets:
        - correctAnswers:
            - text: (1) one; (2) five
          wrongAnswers:
            - text: (1) ten; (2) forty-five
            - text: (1) one; (2) forty-five
            - text: (1) ten; (2) five
