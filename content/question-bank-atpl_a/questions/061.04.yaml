        What is the scale of the chart at latitude {{lat}}°? Give the denominator N of 1 : N.
      explanation: |-
        On a Mercator chart the scale increases with latitude as the east-west direction is stretched, so the representative fraction at latitude φ is the Equator scale multiplied by cos φ. The denominator therefore becomes smaller towards the poles. A distance given at the Equator as 1 inch = 25 NM is converted first into the Equator scale denominator (25 NM = 46 300 m, 1 inch = 0.0254 m).

