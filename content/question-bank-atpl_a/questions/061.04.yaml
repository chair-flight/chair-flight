        - **{{d1}} NM**: the ratio is inverted, so the distance is scaled the wrong way.
        - **{{d2}} NM**: the latitude ratio is left out and only the cosine of the new latitude is applied.
        - **{{d3}} NM**: only the cosine of the known latitude is applied, with no ratio.
        - **{{d4}} NM**: the ratio is squared instead of applied once.
