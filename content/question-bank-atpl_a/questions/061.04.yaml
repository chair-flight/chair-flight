        - ASRUS: {{bd}}°{{bm}}' N, {{bld}}°{{blm}}' W

        What is the true track from ST ABBS to ASRUS, measured at ST ABBS? Give the answer to the nearest degree.
      explanation: |-
        A rhumb line keeps the same true track all the way from A to B. On a Mercator chart it is drawn as a straight line, and its track follows from the longitude difference and the latitude difference, where the latitude difference is stretched to suit the chart.

