      question: |-
        A Lambert conformal conic chart has two standard parallels:

        - First standard parallel: {{sp1}}°N
        - Second standard parallel: {{sp2}}°N

        What is the constant of the cone of this chart?
      explanation: |-
        The constant of the cone is the sine of the mean of the two standard parallels.

        **Solution**

        $$
        \text{sin}(\frac{\text{First standard parallel}+\text{Second standard parallel}}{2})
        $$

        $$
        \text{sin}(\frac{ {{sp1}}+{{sp2}} }{2}) = \mathbf{ {{answer}} }
        $$

