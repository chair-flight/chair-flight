      question: |-
        What is the approximate scale of a chart with the following quoted scale? Express the answer as a ratio 1 : n and give n, rounded to the nearest thousand.

        - Quoted scale: 1 inch = {{nm}} NM

        What is n?
      explanation: |-
        A chart scale is the ratio between a distance on the chart and the same distance on the ground. The quoted scale says that one inch on the chart represents {{nm}} NM on the ground. Both distances are converted to the same unit (centimetres), and the answer is rounded to the nearest thousand because the scale is approximate.

        **Solution**

        - {{nm}} NM = {{macro1}} m = {{macro2}} cm
        - 1 inch = 2.54 cm, so the ratio is 2.54 : {{macro2}} cm, which is 1 : {{macro3}}
        - Rounded to the nearest thousand: $$\text{round}(\frac{\frac{\text{Quoted scale (NM per inch)}\times 1852\times 100}{2.54}}{1000})\times 1000 = \text{round}(\frac{\frac{ {{nm}}\times 1852\times 100}{2.54}}{1000})\times 1000$$ = **1 : {{answer}}**

        ## Why the other answers are wrong

        - **1 : {{d1}}**: the inch was treated as one centimetre, so the ratio is 2.54 times too large.
        - **1 : {{d2}}**: metres were used where centimetres are needed, so the ratio is 100 times too small.
        - **1 : {{d3}}**: the thousands were not restored after rounding, so the ratio is 1000 times too small.
        - **1 : {{d4}}**: 2.54 was multiplied instead of divided, which inverts the conversion.
