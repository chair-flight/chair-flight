  templates:
    - type: simple
      question: |-
        A straight line is drawn on a Lambert conformal conic chart between two positions at the same latitude. Longitudes are counted eastwards from 0° to 360°.

        - Latitude of A and B: {{lat}}° N
        - Position A: longitude {{lon_a}}°
        - Position B: longitude {{lon_b}}°
        - Standard parallels: {{sp1}}° N and {{sp2}}° N

        When the line passes the meridian {{lon_x}}°, what is the true track?
      explanation: |-
        Along a straight line on a Lambert chart joining two points of the same latitude, the true track is exactly 270° (due west or due east) where the line crosses the middle meridian between the two points. Further away from that meridian the track changes by the constant of the cone times the distance from it.

        **Solution**

        - Middle meridian: ({{lon_a}}° + {{lon_b}}°) ÷ 2 = {{macro1}}°
        - Distance of the crossing from the middle meridian: {{lon_x}}° − {{macro1}}° = {{macro2}}°
        - Constant of the cone: $$\text{sin}(\frac{\text{First standard parallel}+\text{Second standard parallel}}{2})$$ = {{macro4}}
        - $$270+\text{sin}(\frac{\text{First standard parallel}+\text{Second standard parallel}}{2})\times (\text{Crossed meridian}-\frac{\text{Longitude of A}+\text{Longitude of B}}{2}) = 270+\text{sin}(\frac{ {{sp1}}+{{sp2}} }{2})\times ({{lon_x}}-\frac{ {{lon_a}}+{{lon_b}} }{2}) = \mathbf{ {{answer}}\ \text{°} }$$

        ## Why the other answers are wrong

        - **{{d1}}°**: subtracts the change instead of adding it
        - **{{d2}}°**: forgets the constant of the cone
        - **{{d3}}°**: uses the cosine instead of the sine
        - **{{d4}}°**: measures the distance from position A instead of from the middle meridian
      presets:
