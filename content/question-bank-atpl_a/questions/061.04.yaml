      question: |-
        A pilot uses a Lambert conformal conic navigation chart with a constant of the cone of {{cone}}. A straight line is drawn from the current position to the destination.

        - Current position: latitude {{lat}}° N, longitude {{lon_a}}° (east positive, west negative)
        - True track at the current position: {{track_a}}°
        - True track at the destination: {{track_b}}°

        What is the longitude of the destination? Give the answer in degrees west (east is negative).
      explanation: |-
        On a Lambert chart the track changes along a straight line by the convergence between the two meridians, which is the constant of the cone times the longitude difference. The new longitude is the longitude of the current position plus the change in track divided by the constant of the cone. The result is then brought into the range from 180° east to 180° west, and given here as a west longitude.

        **Solution**

        - Change in track: {{track_b}}° − {{track_a}}° = {{macro1}}°
        - Longitude change = change in track ÷ constant of the cone = {{macro2}}°
        - Longitude before converting: {{lon_a}}° + {{macro2}}° = {{macro3}}°
        - Brought into the range 180° east to 180° west, expressed as west: **{{answer}}° W**

