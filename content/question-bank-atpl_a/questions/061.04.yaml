        - Difference in longitude between the two meridians: {{dlon}}°
        - Convergency between the two meridians: {{conv}}°

        What is the parallel of origin of this map?
      explanation: |-
        On a Lambert conical chart, the convergency between two meridians equals the constant of the cone multiplied by their difference in longitude. The constant of the cone equals the sine of the parallel of origin.

        **Solution**

        - Constant of the cone = {{conv}}° / {{dlon}}° = {{macro1}}
        - Parallel of origin = arcsin({{macro1}}) = **{{answer}}°**

