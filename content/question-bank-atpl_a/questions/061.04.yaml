        On a Mercator chart the distance between the meridians 2°E and 3°E is {{mm}} mm. The scale of the chart at latitude {{lat}}°N is:

        Give the denominator N of 1 : N to two significant figures.
      explanation: |-
        On a Mercator chart one degree of longitude is 111.12 km along the Equator. The chart shows it as the gap between the meridians, which fixes the scale at the Equator. The scale at any other latitude is the Equator scale multiplied by the cosine of that latitude. The answer is given to two significant figures.

