        - Initial great-circle track from X to Y: {{trk_xy}}°
        - Initial great-circle track from Y to X: {{trk_yx}}°

        Determine the difference in longitude between X and Y.
      explanation: |-
        On a Lambert chart the meridians converge towards the pole. The convergency between two meridians is the constant of the cone multiplied by their difference in longitude. The back track from Y to X differs from the track from X to Y by 180° plus the convergency, so the convergency is found first.

        **Solution**

        Convergency = {{trk_yx}}° − {{trk_xy}}° − 180° = {{macro1}}°

