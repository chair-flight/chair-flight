    - type: simple
      question: |-
        Two positions lie on the same parallel of latitude, and a straight line is drawn between them on a Lambert conformal projection.

        - Latitude of both positions: {{lat}}° N
        - Longitude of position A: {{lon_a}}° E
        - Longitude of position B: {{lon_b}}° E
        - True track of departure from A along the straight line: {{track}}°

        What is the constant of the cone of this Lambert conformal projection?
      explanation: |-
        On a Lambert conformal chart a straight line joining two points of the same latitude is symmetric about the middle meridian between them. On that middle meridian the line has a track of exactly 270°. At each end the track differs from 270° by half the convergence between the meridians, and the convergence is the constant of the cone times the longitude difference. The constant of the cone is therefore twice the track difference divided by the longitude difference.

        **Solution**

        - Track difference from 270°: {{track}}° − 270° = {{macro1}}°
        - Longitude difference: {{lon_a}}° − {{lon_b}}° = {{macro2}}°
        - $$\frac{2\times (\text{Track of departure}-270)}{\text{Longitude of A}-\text{Longitude of B}} = \frac{2\times ({{track}}-270)}{ {{lon_a}}-{{lon_b}} } = \mathbf{ {{answer}} }$$

        ## Why the other answers are wrong

        - **{{d1}}**: forgets to double the track difference
        - **{{d2}}**: uses the latitude instead of the track
        - **{{d3}}**: inverts the ratio
        - **{{d4}}**: forgets to divide by the longitude difference
