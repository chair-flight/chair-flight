    - 061.04.03.02.03
  templates:
    - type: simple
      question: |-
        An NDB and a DR position are plotted on a Lambert conformal chart with standard parallels at {{std1}}°N and {{std2}}°N:

        - NDB position: {{ndb_lat_deg}}°{{ndb_lat_min}}'N, {{ndb_lon_deg}}°{{ndb_lon_min}}'E
        - DR position: {{dr_lat_deg}}°{{dr_lat_min}}'N, {{dr_lon_deg}}°{{dr_lon_min}}'E
        - Magnetic variation: {{var_w}}°W
        - The NDB on the RMI reads {{rmi}}°

        Calculate the true direction (T) of the bearing to be plotted from the NDB, in whole degrees.
      explanation: |-
        The NDB bears {{rmi}}° magnetic from the aircraft. To plot the position line from the NDB, three steps are needed: reverse the bearing to get the bearing from the NDB back to the aircraft, convert magnetic to true (for west variation, true = magnetic minus the variation), and then apply the convergence of the meridians on the Lambert chart. The convergence is the longitude difference multiplied by the sine of the mean standard parallel.

        **Solution**

        - Reciprocal magnetic bearing: {{rmi}}° + 180° = {{macro1}}°M
        - True bearing: {{macro1}}° - {{var_w}}° (west variation) = {{macro2}}°T
        - Convergence: $$\text{sin}(\frac{\text{First standard parallel}+\text{Second standard parallel}}{2})\times (\text{NDB longitude (degrees)}+\frac{\text{NDB longitude (minutes)}}{60}-\text{DR longitude (degrees)}-\frac{\text{DR longitude (minutes)}}{60}) = \text{sin}(\frac{ {{std1}}+{{std2}} }{2})\times ({{ndb_lon_deg}}+\frac{ {{ndb_lon_min}} }{60}-{{dr_lon_deg}}-\frac{ {{dr_lon_min}} }{60})$$°
        - Bearing on the chart: {{macro2}}° + convergence = **{{answer}}°T**

        ## Why the other answers are wrong

        - **{{d1}}°**: the variation was added instead of subtracted.
        - **{{d2}}°**: the convergence correction was applied with the wrong sign.
        - **{{d3}}°**: the bearing from the aircraft was not reversed and no convergence correction was made.
        - **{{d4}}°**: the convergence correction was left out.
