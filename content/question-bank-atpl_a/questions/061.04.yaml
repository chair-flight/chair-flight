        - Chart distance: {{cm}} cm

        What is the earth distance, in km?
      explanation: |-
        The chart distance is converted into inches, multiplied by the scale to give nautical miles, and then converted into kilometres (1 NM = 1.852 km).

        **Solution**

        Chart distance in inches: $$\frac{\text{Chart distance}}{2.54} = \frac{ {{cm}} }{2.54}$$ in

