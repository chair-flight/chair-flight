      question: |-
        A straight line is drawn on a Lambert conformal conic chart with standard parallels at {{sp1}}° and {{sp2}}° (negative means south). It runs from position A to position B.

        - Position A: latitude {{lat_a}}°, longitude {{lon_a}}°
        - Position B: latitude {{lat_b}}°, longitude {{lon_b}}°
        - True track at A: {{trk}}°

        Longitudes are east positive and west negative. Calculate the true track at position B.
      explanation: |-
        On a Lambert conformal chart the meridians converge towards the pole. The convergence between two meridians is the constant of the cone times the longitude difference between them. A straight line on the chart changes its true track by this convergence, so the track at B is the track at A plus the convergence. The constant of the cone is the sine of the mean latitude of the two standard parallels.

        **Solution**

        - Constant of the cone: $$\text{sin}(\frac{\text{First standard parallel}+\text{Second standard parallel}}{2})$$ = {{macro2}}
        - Change in longitude from A to B: {{lon_b}}° − {{lon_a}}° = {{macro3}}°
        - Convergence = constant × change in longitude = {{macro4}}°
        - $$\text{True track at A}+\text{sin}(\frac{\text{First standard parallel}+\text{Second standard parallel}}{2})\times (\text{Longitude of B}-\text{Longitude of A}) = {{trk}}+\text{sin}(\frac{ {{sp1}}+({{sp2}})}{2})\times ({{lon_b}}-{{lon_a}}) = \mathbf{ {{answer}}\ \text{°} }$$

        ## Why the other answers are wrong

        - **{{d1}}°**: applies the convergence with the wrong sign
        - **{{d2}}°**: adds the longitude difference without the constant of the cone
        - **{{d3}}°**: subtracts the longitude difference without the constant of the cone
        - **{{d4}}°**: uses the cosine instead of the sine for the constant of the cone
