        - Destination: {{lat2}}° N, {{lon2}}° E

        What is the average true track?
      explanation: |-
        The track is the direction of the line from the start point to the destination, measured clockwise from true north. The east-west difference is scaled by the cosine of the mean latitude to allow for the meridians converging towards the pole. The result is then given as a bearing between 0° and 360°.

