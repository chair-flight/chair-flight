        - **{{d1}} km**: stops at nautical miles and does not convert to kilometres.
        - **{{d2}} km**: divides by 1.852 instead of multiplying.
        - **{{d3}} km**: uses the chart distance in cm as if it were inches.
        - **{{d4}} km**: uses the statute mile instead of the nautical mile.
