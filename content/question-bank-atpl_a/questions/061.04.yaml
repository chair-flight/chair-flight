  templates:
    - type: simple
      question: |-
        Calculate the ground distance in km on an ATS route between two VORs, using the following data:

        - Distance measured on the en-route chart: {{chart_mm}} mm
        - Quoted scale: 1 inch = {{scale_nm}} NM

        What is the ground distance in km?
      explanation: |-
        The distance on the chart is first converted into inches (25.4 mm per inch). The quoted scale then gives the distance in nautical miles, which is converted into kilometres (1 NM = 1.852 km).

        **Solution**

        - Distance in inches: {{macro1}} in
        - Ground distance: {{macro2}} NM

        $$
        \frac{\text{Distance measured on the chart}}{25.4}\times \text{Quoted scale (NM per inch)}\times 1.852 = \frac{ {{chart_mm}} }{25.4}\times {{scale_nm}}\times 1.852 = \mathbf{ {{answer}}\ \text{km} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} km**: the value in nautical miles is given, the conversion to kilometres is forgotten.
        - **{{d2}} km**: the kilometre conversion is inverted (divided instead of multiplied).
        - **{{d3}} km**: the inch conversion is forgotten and the millimetres are multiplied by the scale.
        - **{{d4}} km**: statute miles (1.609 km) are used instead of nautical miles.
