  learningObjectiveIds:
    - 061.04.01.03.02
  templates:
    - type: simple
      question: |-
        An aeronautical chart has a published scale of 1 inch = {{nm_per_inch}} NM. An aircraft flies at a groundspeed of {{gs}} kt for {{minutes}} minutes.

        What is the chart distance covered by the aircraft, in cm?
      explanation: |-
        The chart distance is the ground distance divided by the chart scale. The ground distance is the groundspeed multiplied by the time flown, and the scale gives the number of nautical miles per inch on the chart, so the result in inches is converted to centimetres (1 inch = 2.54 cm).

        **Solution**

        Ground distance = {{gs}} kt × {{minutes}} min ÷ 60 = {{macro1}} NM

        Chart distance = {{macro1}} NM ÷ {{nm_per_inch}} NM per inch = {{macro2}} inch

        In centimetres: {{macro2}} × 2.54 = **{{answer}} cm**

        ## Why the other answers are wrong

        - **{{d1}} cm**: gives the distance in inches and does not convert it to centimetres.
        - **{{d2}} cm**: inverts the scale, multiplying by the NM per inch instead of dividing.
        - **{{d3}} cm**: forgets to convert minutes to hours.
        - **{{d4}} cm**: uses 2.5 cm per inch instead of 2.54 cm.
      presets:
        - variables:
            nm_per_inch: 20
            gs: 150
            minutes: 50
            macro1: 125
            macro2: 6.3
            answer: 15.9
            d1: 6.3
            d2: 984.3
            d3: 952.5
            d4: 15.6
          correctAnswers:
            - text: 15.9 cm
          wrongAnswers:
            - text: 6.3 cm
            - text: 952.5 cm
            - text: 15.6 cm
            - text: 984.3 cm
