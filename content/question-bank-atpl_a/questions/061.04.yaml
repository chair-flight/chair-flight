        - Latitude {{lat1}}° (negative values are south): it represents {{dist1}} NM on the Earth

        What distance on the Earth does the same chart length represent at latitude {{lat2}}°? Give the answer in NM.
      explanation: |-
        A Mercator chart keeps the same chart length for the same change in longitude, but the distance on the Earth covered by that length shrinks with the cosine of the latitude. A given chart length therefore covers more Earth distance at a lower latitude and less at a higher one.

        **Solution**

