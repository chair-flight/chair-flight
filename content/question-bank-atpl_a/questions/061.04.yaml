        - Chart scale: 1:{{ratio}}
        - Chart distance: {{cm}} cm

        What is the earth distance, in metres?
      explanation: |-
        The chart distance in centimetres is multiplied by the scale denominator to give the earth distance in centimetres. Dividing by 100 gives metres.

        **Solution**

        Earth distance in cm: $$\text{Chart distance}\times \text{Scale denominator} = {{cm}}\times {{ratio}}$$ cm

        Earth distance: $$\frac{\text{Chart distance}\times \text{Scale denominator}}{100} = \frac{ {{cm}}\times {{ratio}} }{100} = \mathbf{ {{answer}}\ \text{m} }$$

        ## Why the other answers are wrong

        - **{{d1}} m**: divides by 1 000 instead of 100.
        - **{{d2}} m**: converts to nautical miles and does not convert back to metres.
        - **{{d3}} m**: divides by 10 000 instead of 100.
        - **{{d4}} m**: divides by 100 000, which gives a value in kilometres.
