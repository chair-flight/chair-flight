      question: |-
        What is the chart distance between longitudes {{lon_e}}°E and {{lon_w}}°W on a direct Mercator chart with a scale of 1 : {{scale}} at the Equator?

        Give the chart distance in mm.
      explanation: |-
        On a direct Mercator chart the scale along the Equator is the same as the chart scale, so a longitude difference measured along the Equator can be converted directly into a chart distance. The angle between the two meridians is the difference between 360° and the sum of the two longitudes, because they are on opposite sides of the 180° meridian.

