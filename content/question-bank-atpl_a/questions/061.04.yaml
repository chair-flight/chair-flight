      question: |-
        Two locations A and B have the same latitude and lie on a meridian and its anti-meridian, so they are 180° apart in longitude. On a Lambert conical projection map, the angle between these two meridians is {{angle}}°.

        What is the latitude of the parallel of origin of this map?
      explanation: |-
        On a Lambert conical projection the meridians converge towards the pole of the cone. The angle between two meridians on the map is the difference in longitude multiplied by the cone constant, and the cone constant is the sine of the parallel of origin. Here the difference in longitude is 180°.

        **Solution**

        - $$\text{asin}(\frac{\text{Angle between the two meridians on the chart}}{180}) = \text{asin}(\frac{ {{angle}} }{180}) = \mathbf{ {{answer}}\ \text{°N or S} }$$

        ## Why the other answers are wrong

        - **{{d1}}°N or S**: uses the cosine instead of the sine.
        - **{{d2}}°N or S**: uses the tangent instead of the sine.
        - **{{d3}}°N or S**: uses 360° as the difference in longitude instead of 180°.
        - **{{d4}}°N or S**: takes the complement of the tangent value instead of the sine.
