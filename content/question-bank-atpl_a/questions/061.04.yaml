  templates:
    - type: simple
      question: |-
        On a Mercator chart at the latitude of {{lat1}}°N, a distance of {{chart}} cm on the chart equals {{nm}} NM on the ground.

        What is the same distance on the ground, in km, at a latitude of {{lat2}}°N?

        Give the answer in km.
      explanation: |-
        On a Mercator chart the same chart distance covers less ground the further it is from the Equator. The ground distance changes with the cosine of the latitude, so the new ground distance is the old one multiplied by cos of the new latitude, divided by cos of the old latitude. Nautical miles are converted to kilometres at 1.852 km per NM.

        **Solution**

        Ground distance at {{lat2}}°N: $$\frac{\text{Ground distance at the first latitude}\times 1.852\times \text{cos}(\text{Second latitude})}{\text{cos}(\text{First latitude})} = \frac{ {{nm}}\times 1.852\times \text{cos}({{lat2}})}{\text{cos}({{lat1}})} = \mathbf{ {{answer}}\ \text{km} }$$

        ## Why the other answers are wrong

        - **{{d1}} km**: inverts the latitude ratio.
        - **{{d2}} km**: converts the ground distance but makes no change for latitude.
        - **{{d3}} km**: uses the sine instead of the cosine.
        - **{{d4}} km**: multiplies by both cosines instead of dividing.
