        Longitude difference = 360 − {{lon_e}} − {{lon_w}} = {{macro1}}°

        Ground distance = {{macro1}} × 60 NM = {{macro2}} NM

        Chart distance = {{macro3}} mm ÷ {{scale}} = **{{answer}} mm**

