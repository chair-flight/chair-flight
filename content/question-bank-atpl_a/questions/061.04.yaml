  templates:
    - type: simple
      question: |-
        Refer to the figure or chart E(LO)2 from the Jeppesen GSPRM 2017. The Lambert chart has its standard parallels at 37°N and 65°N.

        An aircraft is flying at N55°00.0', W011°00.0' with a magnetic heading of {{mag}}°. The magnetic variation at the aircraft position is read from the chart.

        The relative bearing from the aircraft to the Donegal NDB (CFN) (N55°02.6', W008°20.4') is {{rel}}°.

        What is the true bearing to be plotted from the NDB to the aircraft position?
      explanation: |-
        The magnetic heading is turned into a true heading by correcting for the magnetic variation. With west variation the magnetic reading is larger than the true reading, so the variation is subtracted. The true heading plus the relative bearing gives the true bearing from the aircraft to the NDB. The bearing to be plotted from the NDB to the aircraft is the reverse, so 180° is added. Results are given between 0° and 360°.

        **Solution**

        - True heading = magnetic heading - variation = {{macro1}}°T
        - Bearing from the aircraft to the NDB = true heading + relative bearing = {{macro2}}°, which is {{macro3}}° after removing full circles
        - Bearing from the NDB to the aircraft = reverse bearing = **{{answer}}°T**

        ## Why the other answers are wrong

        - **{{d1}}°T**: the variation is added instead of subtracted.
        - **{{d2}}°T**: the reverse bearing is not worked out, so the bearing from the aircraft to the NDB is given.
        - **{{d3}}°T**: the relative bearing is subtracted instead of added.
        - **{{d4}}°T**: the relative bearing is left out.
      presets:
