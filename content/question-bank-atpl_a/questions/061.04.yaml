        The Lambert chart has standard parallels at 30°N and 75°N.

        What is the approximate true track of the straight line at X?
      explanation: |-
        On a Lambert chart a straight line keeps a constant angle to the chart grid, while the meridians converge. The track at the ends of the line differs from the average track by half the convergency. Convergency is approximately the longitude difference times the sine of the mean standard parallel, here (30 + 75) / 2 = 52.5°.

        **Solution**

        - Convergency = {{dlon}}° × sin 52.5° = {{macro1}}°
        - Track at X = {{avg}}° + half the convergency = {{avg}}° + {{macro2}}° = **{{answer}}°**

        ## Why the other answers are wrong

        - **{{d1}}°**: gives the track at Y, which has the opposite change.
        - **{{d2}}°**: ignores the convergency.
        - **{{d3}}°**: uses the full convergency instead of half of it.
        - **{{d4}}°**: adds half the longitude difference in degrees instead of the convergency.
