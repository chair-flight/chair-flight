    - 022.03.02.01.05
  templates:
    - type: simple
      question: An aircraft's compass heading is {{compass}}°. The deviation card indicates {{dev}}°W on northerly headings and the variation is {{var}}°W. What is the aircraft's true heading?
      explanation: |-
        True heading = compass heading + deviation + variation, where west is negative and east is positive. Both corrections are westerly here, so both are subtracted; the result is brought into the range 0-360° by adding 360°.

        **Solution**

        $$\text{compass heading}-\text{westerly deviation}-\text{westerly variation} = {{compass}}-{{dev}}-{{var}}$$ -> **{{answer}}°**

        ## Why the other answers are wrong

        - **{{d1}}°**: treats both westerly corrections as easterly and adds them.
        - **{{d2}}°**: subtracts the deviation but adds the variation (wrong sign for the variation).
        - **{{d3}}°**: adds the deviation instead of subtracting it (wrong sign for the deviation).
      presets:
        - variables:
            compass: 4
            dev: 1
            var: 5
            answer: 358
            d1: 10
            d2: 8
            d3: 360
          correctAnswers:
            - text: 358 °
          wrongAnswers:
            - text: 360 °
            - text: 10 °
            - text: 8 °
        - variables:
            compass: 2
            dev: 1
            var: 5
            answer: 356
            d1: 8
            d2: 6
            d3: 358
          correctAnswers:
            - text: 356 °
          wrongAnswers:
            - text: 358 °
            - text: 8 °
            - text: 6 °
        - variables:
            compass: 3
            dev: 2
            var: 6
            answer: 355
            d1: 11
            d2: 7
            d3: 359
          correctAnswers:
            - text: 355 °
          wrongAnswers:
            - text: 359 °
            - text: 11 °
            - text: 7 °
    - type: simple
      question: An aircraft's compass reads 002°. The deviation card shows 2°E on northerly headings and the variation is 12°E. What is the aircraft's true heading?
      explanation: ""
      presets:
        - correctAnswers:
            - text: 016°
          wrongAnswers:
            - text: 352°
            - text: 012°
            - text: 003°
