  templates:
    - type: simple
      question: The pilot of an aircraft changes heading to the right, from {{h1}}° to {{h2}}°, taking the shortest way, and makes a rate-1 turn (3° per second). What is the duration of this manoeuvre, in seconds?
      explanation: |-
        A rate-1 turn is a turn at 3° per second, independent of the bank angle and TAS needed to achieve it. The duration is the heading change divided by the turn rate.

        **Solution**

        Heading change = {{macro1}}°

        $$
        \frac{|\text{Final heading}-\text{Initial heading}|}{3} = \frac{|{{h2}}-{{h1}}|}{3} = \mathbf{ {{answer}}\ \text{s} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} s**: assumes a turn rate of 4° per second instead of 3° per second.
        - **{{d2}} s**: assumes a turn rate of 6° per second (rate-2 turn).
        - **{{d3}} s**: assumes a turn rate of only 2° per second.
        - **{{d4}} s**: adds an arbitrary 10 s to the correct duration.
      presets:
        - variables:
            h1: 214
            h2: 334
            macro1: 120
            answer: 40
            d1: 30
            d2: 20
            d3: 60
            d4: 50
