            d1: 8
            d2: 6
            d3: 10
            d4: -2
          correctAnswers:
            - text: 4 °
          wrongAnswers:
            - text: 8 °
            - text: 10 °
            - text: -2 °
            - text: 6 °
        - variables:
            th: 212
            mh: 220
            steer: 214
