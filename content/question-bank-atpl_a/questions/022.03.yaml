  templates:
    - type: simple
      question: |-
        Determine the magnitude of the compass deviation (in degrees; the direction E or W follows from the sign of magnetic minus compass heading), given:

        - True heading: {{th}}°
        - Magnetic heading: {{mh}}°
        - Compass deviation card: "FOR {{mh}}° STEER {{steer}}°"
      explanation: |-
        Deviation is the difference between magnetic heading and compass heading: deviation = magnetic - compass (positive = East, negative = West). The deviation card tells which compass heading to steer for a given magnetic heading. The true heading is not needed.

        **Solution**

        $$\text{Magnetic heading}-\text{Steer (compass) heading} = {{mh}}-{{steer}}$$, so the deviation is **{{answer}}°** (E if positive, W if negative).

        ## Why the other answers are wrong
        - **{{d1}}°**: doubles the deviation.
        - **{{d2}}°**: uses magnetic minus true, which is the variation, not the deviation.
        - **{{d3}}°**: uses true heading minus compass heading, which mixes variation and deviation.
        - **{{d4}}°**: subtracts the variation from the deviation.
      presets:
        - variables:
            th: 124
            mh: 120
            steer: 114
            answer: 6
            d1: 12
            d2: 4
            d3: 10
            d4: 2
          correctAnswers:
            - text: 6 °
          wrongAnswers:
            - text: 12 °
            - text: 10 °
            - text: 2 °
            - text: 4 °
        - variables:
