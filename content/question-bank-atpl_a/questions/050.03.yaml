- id: QFNEM
  subjectId: "050"
  chapterId: "050.03"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-504314
    - AVEXAM-59214
  annexes: []
  learningObjectiveIds:
    - 050.03.01.03.02
  templates:
    - type: simple
      question: |-
        The air is described below.

        - Maximum water vapour content: {{max}} g/kg
        - Actual water vapour content: {{actual}} g/kg

        What is the relative humidity?
      explanation: |-
        Relative humidity compares the water vapour actually in the air with the most the air could hold at the same temperature. It is given as a percentage.

        **Solution**

        $$
        \frac{\text{Actual water vapour content}}{\text{Maximum water vapour content}}\times 100 = \frac{ {{actual}} }{ {{max}} }\times 100 = \mathbf{ {{answer}}\ \text{%} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}%**: the actual content is used without comparing it with the maximum.
        - **{{d2}}%**: the result is subtracted from 100, which gives the missing part of saturation instead of the humidity.
        - **{{d3}}%**: the ratio is inverted.
        - **{{d4}}%**: the wrong factor is used (10 instead of 100).
      presets:
        - variables:
            max: 20
            actual: 15
            answer: 75
            d1: 15
            d2: 25
            d3: 133
            d4: 8
          correctAnswers:
            - text: 75 %
          wrongAnswers:
            - text: 15 %
            - text: 133 %
            - text: 8 %
            - text: 25 %
        - variables:
            max: 25
            actual: 12
            answer: 48
            d1: 12
            d2: 52
            d3: 208
            d4: 5
          correctAnswers:
            - text: 48 %
          wrongAnswers:
            - text: 12 %
            - text: 208 %
            - text: 5 %
            - text: 52 %
        - variables:
            max: 30
            actual: 6
            answer: 20
            d1: 6
            d2: 80
            d3: 500
            d4: 2
          correctAnswers:
            - text: 20 %
          wrongAnswers:
            - text: 6 %
            - text: 500 %
            - text: 2 %
            - text: 80 %
