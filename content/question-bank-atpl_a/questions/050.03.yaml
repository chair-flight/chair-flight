  templates:
    - type: simple
      question: "Air temperature is {{temp}} °C and the dew point is {{dewp}} °C. Determine the relative humidity from the table:"
      explanation: |-
        Relative humidity is the amount of water vapour in the air compared with the most it could hold at that temperature. The table gives it from the air temperature and the dew point together.

        **Solution**

        - Find the row for the air temperature of {{temp}} °C.
        - Find the column for the dew point of {{dewp}} °C.
        - The relative humidity where they meet is **70%**.

        ## Why the other answers are wrong

        - **80%**: a higher humidity than the table gives for this air temperature and dew point.
        - **33%**: a much drier value, which would need a far larger gap between the two temperatures.
        - **66%**: a value read from the wrong place in the table.
      presets:
