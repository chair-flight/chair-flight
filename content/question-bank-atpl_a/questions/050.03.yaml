    - type: simple
      question: |-
        Use the air temperature and the dew point to estimate the relative humidity.

        - Air temperature: {{temp}} °C
        - Dew point: {{dew}} °C

        What is the approximate relative humidity?
      explanation: |-
        Relative humidity falls by about 5 % for every degree Celsius between the air temperature and the dew point, which is called the spread. This is a quick approximation, not an exact value from a table.

        **Solution**

        Spread: {{macro1}} °C

        $$
        100-5\times (\text{Air temperature}-\text{Dew point}) = 100-5\times ({{temp}}-{{dew}}) = \mathbf{ {{answer}}\ \text{%} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}%**: the factor of 5 is forgotten.
        - **{{d2}}%**: a factor of 4 is used instead of 5.
        - **{{d3}}%**: the dew point is divided by the temperature instead of using the spread.
        - **{{d4}}%**: the spread is given without converting it to a humidity.
      presets:
        - variables:
            temp: 15
            dew: 10
            macro1: 5
            answer: 75
            d1: 95
            d2: 80
            d3: 67
