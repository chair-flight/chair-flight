    - BGS-500525
    - ATPLQ-505358
  annexes: []
  learningObjectiveIds:
    - 050.03.01.03.05
  templates:
    - type: one-two
      question: Check the correctness of the following statements.
      explanation: |-
        Dew point is the temperature to which air must be cooled for saturation, so in unsaturated air the temperature is above the dew point. The two are equal only at saturation, and the dew point is never higher than the temperature.

        Over ice the maximum water vapour pressure is lower than over water at the same temperature, because ice molecules are bound more tightly. Air therefore saturates over ice at a lower vapour content, so for a saturated air mass the dew point over ice (the frost point) is higher than the dew point over water.
      pairs:
        - right:
            - For unsaturated air the dew-point temperature is lower than the temperature
          wrong:
            - For unsaturated air the dew-point temperature is higher than the temperature
        - right:
            - The maximum water vapour pressure is lower over ice than over water with the same temperature
          wrong:
            - The maximum water vapour pressure is higher over ice than over water with the same temperature
    - type: one-two
      question: Which of the following statements are correct/incorrect?
      explanation: |-
        Dew point is the temperature to which air must be cooled for saturation, so in unsaturated air the temperature is above the dew point. The two are equal only at saturation, and the dew point is never higher than the temperature.

        Over ice the maximum water vapour pressure is lower than over water at the same temperature, because ice molecules are bound more tightly. Air therefore saturates over ice at a lower vapour content, so for a saturated air mass the dew point over ice (the frost point) is higher than the dew point over water.
      pairs:
        - right:
            - The actual temperature of an air mass is higher than the dew point temperature if the air mass is unsaturated.
          wrong:
            - The actual temperature of an air mass is lower than the dew point temperature if the air mass is unsaturated.
        - right:
            - For a saturated air mass, the dew point temperature over ice is higher than the dew point temperature over water.
          wrong:
            - For a saturated air mass, the dew point temperature over ice is lower than the dew point temperature over water.
