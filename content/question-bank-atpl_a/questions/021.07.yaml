    - ATPLQ-213469
  annexes: []
  learningObjectiveIds:
    - 021.07.01.01.04
  templates:
    - type: simple
      question: In jet aircraft equipped with a thermal anti-ice system, this is primarily supplied by..
      explanation: A thermal anti-ice system on jets is supplied primarily by hot bleed air from the engines. Pneumatic boots are a mechanical system and are not thermal.
      presets:
        - correctAnswers:
            - text: bleed air from the engines.
          wrongAnswers:
            - text: mechanical anti-icing boots.
            - text: electrically heating the surfaces to be protected.
            - text: ram air, heated via a heat exchanger.
    - type: simple
      question: The engine air intakes of large transport aircraft are usually protected against ice by..
      explanation: The engine air intakes of large transport aircraft are protected against ice by hot bleed air taken from the compressor.
      presets:
        - correctAnswers:
            - text: hot bleed air.
          wrongAnswers:
            - text: pressurised fluid.
            - text: hot engine oil.
            - text: inflatable boots.
    - type: simple
      question: The wing ice protection system currently used on most large jet transport aeroplanes is..
      explanation: The wing ice protection on most large jet transports is a hot bleed air system, which warms the leading edge from inside.
      presets:
        - correctAnswers:
            - text: a hot bleed air system.
          wrongAnswers:
            - text: an exhaust gas bleed system.
            - text: an electrical heater mat system.
            - text: a weeping wing liquid system.
- id: QMKZR
