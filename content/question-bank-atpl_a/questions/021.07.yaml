  templates:
    - type: simple
      question: An in-flight anti-icing system
      explanation: An in-flight anti-icing system prevents ice from forming on protected parts such as the engine air intakes, while a de-icing system removes ice that has already formed.
      presets:
        - correctAnswers:
            - text: prevents ice formation on the engine air intakes.
          wrongAnswers:
            - text: removes ice formed on the tail surfaces.
            - text: removes ice formed on the leading edge flaps.
            - text: prevents ice formation on the trailing edge flaps.
    - type: simple
      question: Which of these is the primary purpose of an aircraft anti-icing system?
      explanation: ""
      presets:
        - correctAnswers:
            - text: To prevent ice from forming on the associated surfaces.
          wrongAnswers:
            - text: To prevent fuel from waxing due to low temperatures.
            - text: To remove frost from the inside of the windscreen.
            - text: To remove ice that has already formed on the associated surfaces.
        - correctAnswers:
            - text: prevent ice from forming on the associated surfaces.
          wrongAnswers:
            - text: remove ice that has already formed on the associated surfaces.
            - text: prevent fuel from waxing due to low temperatures.
            - text: remove frost from the inside of the windscreen.
    - type: simple
      question: What is the main function of an anti-icing system on an aircraft?
      explanation: ""
      presets:
        - correctAnswers:
            - text: To prevent ice from forming on the associated surfaces.
          wrongAnswers:
            - text: To prevent fuel from waxing due to low temperatures.
            - text: To remove ice that has already formed on the associated surfaces.
            - text: To remove frost from the inside of the windscreen.
