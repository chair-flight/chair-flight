  templates:
    - type: simple
      question: The anti-ice system of a turbofan engine passes which substance through the engine inlet cowl to prevent ice formation?
      explanation: The engine inlet cowl of a turbofan is anti-iced by hot air, taken from the compressor as bleed air, which keeps the lip warm enough to stop ice forming.
      presets:
        - correctAnswers:
            - text: Hot air.
          wrongAnswers:
            - text: Cold fuel.
            - text: Cold air.
            - text: Hot oil.
