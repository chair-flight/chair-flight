  templates:
    - type: simple
      question: The (1)\_\_\_\_\_ system on a turbofan engine passes (2)\_\_\_\_\_ through the engine inlet cowl to prevent ice formation.
      explanation: An anti-icing system prevents ice from forming, and on turbofan engines it passes hot air through the inlet cowl. De-icing removes ice that has already formed.
      presets:
        - correctAnswers:
            - text: (1) anti-icing; (2) hot air
          wrongAnswers:
            - text: (1) de-icing; (2) hot air
            - text: (1) de-icing; (2) hot fluid
            - text: (1) anti-icing; (2) hot fluid
