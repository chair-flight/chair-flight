  templates:
    - type: simple
      question: The aircraft is on the QDR of {{qdr}}° in the vicinity of the station, with a magnetic heading of {{hdg}}°. What is the relative bearing on the ADF indicator, in degrees?
      explanation: |-
        The QDR is the magnetic bearing from the station to the aircraft. The bearing from the aircraft to the station is 180° more. The relative bearing is that bearing minus the magnetic heading, given as an angle between 0° and 360° measured clockwise from the nose.

        **Solution**

        - Bearing to the station: {{qdr}}° + 180° = {{macro1}}°
        - Relative bearing: bearing to the station minus the heading, $$\text{QDR}+540-\text{Magnetic heading} = {{qdr}}+540-{{hdg}}$$ less full circles of 360°, gives **{{answer}}°**

        ## Why the other answers are wrong

        - **{{d1}}°**: uses the QDR directly, without the 180° that turns it into the bearing to the station.
        - **{{d2}}°**: subtracts the other way round, which gives the angle counted anticlockwise.
        - **{{d3}}°**: adds the heading instead of subtracting it.
        - **{{d4}}°**: uses the heading minus the reciprocal of the QDR, which is the wrong direction.
      presets:
