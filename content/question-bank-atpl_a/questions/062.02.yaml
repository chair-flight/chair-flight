  templates:
    - type: simple
      question: |-
        Which VOR radial is the aircraft on? Use the great circle from the VOR to the aircraft.

        - Aircraft: latitude {{lat_ac}}°, longitude {{lon_ac}}°, variation {{var_ac}}°
        - VOR: latitude {{lat_vor}}°, longitude {{lon_vor}}°, variation {{var_vor}}°

        North latitude and east longitude are positive, south and west are negative. Variation is east positive and west negative. Give the answer in degrees magnetic.
      explanation: |-
        A VOR radial is a magnetic bearing from the VOR. The true bearing of the aircraft from the VOR is measured along a great circle, the shortest route over the Earth. Because the meridians converge towards the poles, the bearing differs from a plain east-west 270° and has to be calculated from the latitudes and longitudes. The variation at the VOR then gives the magnetic radial. The variation at the aircraft is not needed.

        **Solution**

        - True bearing of the aircraft from the VOR along the great circle: {{macro1}}°
        - Magnetic radial: true bearing − ({{var_vor}})° = {{macro2}}°

        The radial is **{{answer}}°**.

