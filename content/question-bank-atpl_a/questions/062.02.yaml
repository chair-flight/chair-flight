        - True bearing from the VOR: {{track}}° + 180° = {{macro1}}°
        - Magnetic radial: {{macro1}}° − ({{var_vor}})° = {{macro2}}°, kept within 360°

        The radial is **{{answer}}°**.

        ## Why the other answers are wrong

        - **{{d1}}°**: uses the track itself, forgetting the reciprocal.
        - **{{d2}}°**: adds the variation at the VOR instead of subtracting it.
        - **{{d3}}°**: uses the variation at the aircraft instead of the VOR.
        - **{{d4}}°**: adds the variation at the aircraft to the reciprocal.
