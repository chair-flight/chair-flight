      explanation: |-
        The radial is the magnetic bearing of the aircraft from the VOR. An aircraft flying towards the VOR is on the reciprocal of its track as seen from the VOR, so the true bearing from the VOR is the track plus 180°. The variation at the VOR then gives the magnetic radial. The variation at the aircraft is not needed.

