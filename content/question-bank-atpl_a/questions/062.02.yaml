    - 062.02.03.02.04
  templates:
    - type: simple
      question: |-
        Refer to figure. An aircraft is flying on a MH of 210°. The magnetic variation at the VOR is {{var_vor}}°W and at the aircraft {{var_ac}}°W.

        - Radial read from the CDI at the top of the annex: {{cdi_radial}}° (value read from the figure, referenced to magnetic north at the VOR)

        According to the CDI shown in the annex, on which radial is the aircraft?
      explanation: |-
        The radial read from the CDI is referenced to magnetic north at the VOR. Because the variation at the aircraft differs from the variation at the VOR, the reading must be corrected by the difference between the two before the radial can be stated.

        **Solution**

        $$
        \text{Radial read from the CDI (read from figure)}-\text{Variation at the aircraft}+\text{Variation at the VOR} = {{cdi_radial}}-{{var_ac}}+{{var_vor}} = \mathbf{ {{answer}}\ \text{°} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}°**: uses the CDI reading without any variation correction.
        - **{{d2}}°**: applies both variations with the signs reversed.
        - **{{d3}}°**: subtracts both variations instead of their difference.
        - **{{d4}}°**: adds 180°, which gives the reciprocal radial.
      presets:
        - variables:
            var_vor: 5
            var_ac: 10
            cdi_radial: 30
            answer: 25
            d1: 30
            d2: 35
            d3: 15
            d4: 205
