        - **{{d1}}°**: the magnetic heading, which ignores the relative bearing.
        - **{{d2}}°**: the reciprocal of the QDM, which is the QDR.
        - **{{d3}}°**: the reciprocal of the heading.
        - **{{d4}}°**: takes the heading away from the relative bearing, the wrong way round.
