      question: |-
        The aircraft is tuned to an NDB and the following is known:

        - Compass heading: {{compass}}°
        - ADF indication (needle head): {{adf}}°
        - Deviation: {{dev}}°
        - Variation: {{var}}° (east positive, west negative)

        What is the true bearing from the NDB to the aircraft?
      explanation: |-
        An ADF needle points at the NDB relative to the nose of the aircraft. To place the NDB on a true chart, the compass heading is first corrected to magnetic (deviation), the bearing is reversed to get the direction from the NDB to the aircraft, and then it is converted to true (variation). East variation is added, west variation is subtracted.

        **Solution**

        - Magnetic heading = compass heading + deviation = {{macro1}}°
        - Magnetic bearing of the aircraft from the NDB = magnetic heading + ADF reading, between 0° and 360° = {{macro2}}°
        - Magnetic bearing from the NDB to the aircraft = that bearing + 180°, between 0° and 360° = {{macro3}}°
        - True bearing = magnetic bearing + east variation = **{{answer}}°T**

        ## Why the other answers are wrong

        - **{{d1}}°T**: deviation and variation are both ignored.
        - **{{d2}}°T**: the 180° reciprocal is left out, so the bearing to the NDB is given.
        - **{{d3}}°T**: the variation is applied with the wrong sign (west instead of east).
        - **{{d4}}°T**: the deviation is applied with the wrong sign.
