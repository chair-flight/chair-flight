      question: |-
        The RMI reads the NDB bearing as {{rmi}}° (magnetic).

        - Variation at the NDB: {{var_ndb}}° (east positive, west negative)
        - Variation at the DR position: {{var_dr}}° (east positive, west negative)
        - Deviation: {{dev}}°
        - Compass heading: {{ch}}°

        What is the true bearing of the NDB from the aircraft, in degrees?
      explanation: |-
        The RMI already shows the magnetic bearing of the NDB. To turn it into a true bearing the variation at the NDB is applied, with east as positive: true = magnetic + variation. The deviation, the compass heading and the variation at the DR position are not needed.

        **Solution**

        $$\text{RMI bearing (magnetic)}+\text{Variation at the NDB} = {{rmi}}+({{var_ndb}})$$, less 360° if above 360° = **{{answer}}°**

        ## Why the other answers are wrong

        - **{{d1}}°**: uses the variation at the DR position instead of the NDB.
        - **{{d2}}°**: subtracts the variation instead of adding it.
        - **{{d3}}°**: applies the deviation as well, which is not needed for a bearing read from the RMI.
        - **{{d4}}°**: adds the compass heading to the bearing.
