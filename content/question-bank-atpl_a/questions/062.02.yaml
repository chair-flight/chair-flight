- id: QIACQ
  subjectId: "062"
  chapterId: "062.02"
  relatedQuestionIds:
    - QMTCH
  externalQuestionIds:
    - ATPLQ-623419
    - BGS-620852
  annexes: []
  learningObjectiveIds:
    - 062.02.01.03.01
  templates:
    - type: simple
      question: |-
        An aircraft needs a VDF bearing from a station to contact the tower on R/T.

        - Range from the station: {{range}} NM
        - Station elevation: {{site}} ft above MSL

        What is the minimum flight level (ISA conditions) the aircraft must fly?
      explanation: |-
        A VDF bearing can only be received while the aircraft is inside the radio horizon of the station. The rule of thumb is: range in NM = 1.23 × (square root of the aircraft height in ft + square root of the station height in ft). It is turned around here to find the lowest height that still reaches the range, and the result is rounded up to the next full flight level.

        **Solution**

        - Range divided by 1.23, minus the square root of the station height: {{macro1}}
        - Aircraft height needed: {{macro2}} ft
        - Minimum flight level, rounded up: **FL{{answer}}**

        ## Why the other answers are wrong

        - **FL{{d1}}**: ignores the station height in the rule.
        - **FL{{d2}}**: does not square the result to get the height.
        - **FL{{d3}}**: rounds down, which leaves the aircraft just short of the range.
        - **FL{{d4}}**: adds the station height instead of subtracting it.
      presets:
        - variables:
            range: 111
            site: 169
            macro1: 77
            macro2: 5967
            answer: 60
            d1: 82
            d2: 78
            d3: 59
            d4: 107
          correctAnswers:
            - text: 60 FL
          wrongAnswers:
            - text: 82 FL
            - text: 59 FL
            - text: 107 FL
            - text: 78 FL
        - variables:
            range: 100
            site: 400
            macro1: 61
            macro2: 3758
            answer: 38
            d1: 67
            d2: 62
            d3: 37
            d4: 103
          correctAnswers:
            - text: 38 FL
          wrongAnswers:
            - text: 67 FL
            - text: 37 FL
            - text: 103 FL
            - text: 62 FL
        - variables:
            range: 140
            site: 900
            macro1: 84
            macro2: 7026
            answer: 71
            d1: 130
            d2: 84
            d3: 70
            d4: 207
          correctAnswers:
            - text: 71 FL
          wrongAnswers:
            - text: 130 FL
            - text: 70 FL
            - text: 207 FL
            - text: 84 FL
