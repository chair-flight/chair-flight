        - Variation: {{var_w}}°W

        The convergence is negligible.
      explanation: |-
        The ADF shows the direction of the beacon relative to the nose of the aircraft. The magnetic heading is the compass heading plus the deviation. The true heading is the magnetic heading minus a west variation. The bearing to the beacon is the true heading plus the relative bearing, and the bearing from the beacon to the aircraft is 180° more. Full circles of 360° are removed to keep the answer between 0° and 360°.

