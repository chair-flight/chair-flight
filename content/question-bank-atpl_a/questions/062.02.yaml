      question: Refer to figure. The annex above contains a Navigation Display (ND) with a single VOR tuned and identified on both VOR 1 and VOR 2. What radial from the CLT VOR is the aircraft on?
      explanation: |-
        A radial is the magnetic bearing from the VOR out to the aircraft. The VOR pointer on the navigation display shows which radial the aircraft is on, read against the compass card.

        ## Why the other answers are wrong

        - **112°** is the reciprocal of the correct radial, which is the bearing from the aircraft back to the VOR.
        - **273°** and **093°** do not match the position of the pointer on the display.
      presets:
