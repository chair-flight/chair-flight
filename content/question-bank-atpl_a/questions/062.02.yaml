  templates:
    - type: simple
      question: |-
        Given the following information, what relative bearing will be shown on the RBI in order to maintain an outbound course of {{course}}° (M) from overhead the NDB?

        - Wind: {{wd}}° (T) / {{ws}} kt
        - Variation: {{var}}° (east positive)
        - TAS: {{tas}} kt
      explanation: |-
        The aircraft flies outwards from the NDB, so the beacon is behind it and the bearing of the NDB from the aircraft is the track plus 180°. The track is the magnetic course with the variation added. A wind correction angle is needed to hold this track, and it turns the nose away from the track by the same amount, which changes the relative bearing. The relative bearing is therefore 180° minus the wind correction angle.

        **Solution**

        - True track: {{course}}° + {{var}}° = {{macro1}}°

        $$
        180-\text{asin}(\frac{\text{Wind speed}\times \text{sin}(\text{Wind direction (true)}-(\text{Outbound course (magnetic)}+\text{Variation (east positive)}))}{\text{TAS}}) = 180-\text{asin}(\frac{ {{ws}}\times \text{sin}({{wd}}-({{course}}+{{var}}))}{ {{tas}} }) = \mathbf{ {{answer}}\ \text{°} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}°**: applies the wind correction with the wrong sign.
        - **{{d2}}°**: uses the magnetic course instead of the true track in the wind triangle.
        - **{{d3}}°**: the reciprocal of the track with no wind correction.
        - **{{d4}}°**: uses the wind speed without the wind direction.
      presets:
        - variables:
            course: 257
            wd: 230
            ws: 20
            var: 6
            tas: 80
            macro1: 263
            answer: 188
            d1: 172
            d2: 187
            d3: 180
