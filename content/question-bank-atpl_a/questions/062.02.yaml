  templates:
    - type: simple
      question: The aircraft is at a height of {{height}} ft above the DME station and {{ground}} NM away from it, measured horizontally. What distance will the DME display, in NM?
      explanation: |-
        The DME shows the straight-line (slant) distance, which is the longest side of a right-angled triangle. The horizontal distance and the height above the station are the two shorter sides, so the DME distance is the square root of the horizontal distance squared plus the height squared. One NM is about 6076 ft.

        **Solution**

        - Height in NM: {{height}} ft ÷ 6076 = {{macro1}} NM.
        - $$\sqrt{{\text{Horizontal distance}}^{2}+{\frac{\text{Height above the DME}}{6076}}^{2}} = \sqrt{ {{ground}}^{2}+{\frac{ {{height}} }{6076}}^{2}}$$, about **{{answer}} NM**

        ## Why the other answers are wrong

        - **{{d1}} NM**: adds the height in NM to the horizontal distance, which is not how the sides of the triangle combine.
        - **{{d2}} NM**: subtracts the height instead of adding it, which would make the DME distance shorter than the horizontal distance.
        - **{{d3}} NM**: uses the horizontal distance and ignores the height.
        - **{{d4}} NM**: forgets the square root.
      presets:
