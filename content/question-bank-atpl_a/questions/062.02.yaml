  templates:
    - type: simple
      question: |-
        An aircraft tunes in to a VOR or VDF ground station that is sited above mean sea level.

        - Aircraft flight level: FL{{fl}}
        - Station elevation: {{site}} ft above MSL

        What is the approximate maximum theoretical range at which the aircraft can receive the station's signals? Give the answer in NM.
      explanation: |-
        Radio waves travel in straight lines, so the range is limited by the radio horizon of both the aircraft and the station. The rule of thumb is: range in NM = 1.23 × (square root of the aircraft height in ft + square root of the station height in ft).

        **Solution**

        - Aircraft height: FL{{fl}} = {{macro1}} ft
        - $$1.23\times (\sqrt{\text{Flight level}\times 100}+\sqrt{\text{Station elevation}}) = 1.23\times (\sqrt{ {{fl}}\times 100}+\sqrt{ {{site}} }) = \mathbf{ {{answer}}\ \text{NM} }$$

        ## Why the other answers are wrong

        - **{{d1}} NM**: leaves out the constant 1.23.
        - **{{d2}} NM**: uses the flight level number as feet instead of multiplying it by 100.
        - **{{d3}} NM**: converts the range to kilometres (× 1.852) when nautical miles are asked.
        - **{{d4}} NM**: halves the result, as if only one radio horizon counted.
      presets:
        - variables:
            fl: 130
            site: 1024
            macro1: 13000
            answer: 180
            d1: 146
            d2: 53
            d3: 333
            d4: 90
