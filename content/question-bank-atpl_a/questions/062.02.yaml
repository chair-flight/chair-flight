      question: An aircraft is at a height of {{height}} ft above the DME station. The DME reading, uncorrected for altitude, is {{dme}} NM. What is the horizontal ground distance to the DME station, in NM?
      explanation: |-
        The DME measures the straight-line (slant) distance to the station. When the aircraft is above the station, that distance is longer than the ground distance. The height, the ground distance and the DME distance form a right-angled triangle, so the ground distance is the square root of the DME distance squared minus the height squared. One NM is about 6076 ft.

        **Solution**

        - Height in NM: {{height}} ft ÷ 6076 = {{macro1}} NM.
        - $$\sqrt{{\text{DME reading (slant range)}}^{2}-{\frac{\text{Height above the DME}}{6076}}^{2}} = \sqrt{ {{dme}}^{2}-{\frac{ {{height}} }{6076}}^{2}} = \mathbf{ {{answer}}\ \text{NM} }$$

        ## Why the other answers are wrong

        - **{{d1}} NM**: subtracts the height from the DME reading, which is not how the sides of the triangle combine.
