  templates:
    - type: simple
      question: An aircraft has a magnetic heading of {{hdg}}° and is on VOR radial {{radial}}°. Which value has to be selected on the OBS to get a TO indication with the CDI centred?
      explanation: |-
        The radial is the magnetic bearing of the aircraft from the VOR. For a TO indication with the needle centred, the OBS has to be set to the course towards the VOR, which is the reciprocal of the radial. The magnetic heading of the aircraft does not change this setting.

        **Solution**

        $$\text{VOR radial (magnetic)}+180 = {{radial}}+180$$, less 360° if above 360° = **{{answer}}°**

        ## Why the other answers are wrong

        - **{{d1}}°**: the radial itself, which is the setting for a FROM indication.
        - **{{d2}}°**: the magnetic heading, which plays no part here.
        - **{{d3}}°**: the reciprocal of the heading.
        - **{{d4}}°**: subtracts the heading from the radial.
      presets:
        - variables:
            hdg: 290
            radial: 280
            answer: 100
            d1: 280
            d2: 290
