  templates:
    - type: simple
      question: |-
        An NDB is on a relative bearing of {{rb}}° from an aircraft.

        - Compass heading: {{ch}}°
        - Deviation: {{dev}}° (negative = West)
        - Variation at the aircraft: {{var_ac}}° (negative = West)
        - Variation at the NDB: {{var_st}}° (negative = West)

        Calculate the true bearing of the NDB from the aircraft, in degrees.
      explanation: |-
        The compass does not point to true north. The deviation is applied to the compass heading to give the magnetic heading, and the variation at the aircraft then gives the true heading. The bearing of the NDB is the true heading plus the relative bearing. The variation at the NDB is not used.

        **Solution**

        - Magnetic heading: {{ch}}° + ({{dev}})° = {{macro1}}°
        - True heading: {{macro1}}° + ({{var_ac}})° = {{macro2}}°
        - True bearing: {{macro2}}° + {{rb}}° = {{macro3}}°, less 360° if above 360°

        The true bearing is **{{answer}}°**.

        ## Why the other answers are wrong

        - **{{d1}}°**: subtracts the variation at the aircraft instead of adding it.
        - **{{d2}}°**: uses the variation at the NDB instead of the aircraft.
        - **{{d3}}°**: reverses the sign of the deviation.
        - **{{d4}}°**: leaves out the deviation.
