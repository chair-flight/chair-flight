      question: You are on a magnetic heading of {{hdg}}° and your ADF indicates a relative bearing of {{rb}}°. What is the QDM, the magnetic bearing to the beacon?
      explanation: |-
        The QDM is the magnetic bearing from the aircraft to the beacon. It is found by adding the relative bearing to the magnetic heading.

        **Solution**

        $$\text{Magnetic heading}+\text{Relative bearing} = {{hdg}}+{{rb}}$$, less 360° if above 360° = **{{answer}}°**

