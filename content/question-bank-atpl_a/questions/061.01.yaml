        ## Why the other answers are wrong

        - **{{d1}} kt**: uses the full wind speed and ignores the wind angle.
        - **{{d2}} kt**: uses the sine of the angle, which gives the crosswind part instead.
        - **{{d3}} kt**: uses the 1 o'clock share (9/10) instead of the 2 o'clock share (1/2).
        - **{{d4}} kt**: reverses the sign, so a headwind is shown as a tailwind.
