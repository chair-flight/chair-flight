  templates:
    - type: simple
      question: |-
        Determine the ETA at B, given:

        - Distance A to B: {{dist}} km
        - Groundspeed: {{gs}} kt
        - Actual time of departure: {{dep_h}} h {{dep_min}} min

        Give the ETA (hh:mm).
      explanation: |-
        Distances in kilometres must be converted to nautical miles, at 1 NM = 1.852 km, before they are combined with a speed in knots. The flight time in minutes is then 60 times the distance divided by the groundspeed.

        **Solution**

        - Distance: {{dist}} km ÷ 1.852 = {{macro1}} NM
        - Flight time: {{macro1}} NM ÷ {{gs}} kt = {{macro2}} min
        - ETA: {{dep_h}} h {{dep_min}} min + {{macro2}} min = **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}}**: the distance in km is used as if it were NM.
        - **{{d2}}**: 1 NM is taken as 1.6 km.
        - **{{d3}}**: the flight time is subtracted instead of added.
        - **{{d4}}**: the flight time is halved.
