  templates:
    - type: simple
      question: |-
        Given:

        - Position A: {{lat_a}}°N, {{lon_a}}°E
        - Position B: {{lat_b}}°N, {{lon_b}}°W

        What is the difference in longitude between A and B?
      explanation: |-
        The difference in longitude is the smaller of the two angles between the meridians, measured the short way round the Earth. Adding the east and west longitudes gives one of the two angles; the other is 360° minus that sum.

        **Solution**

        East and west longitudes together: {{lon_a}}° + {{lon_b}}° = {{macro1}}°

        The other way round the Earth: 360° − {{macro1}}° = {{macro2}}°

        The smaller of the two angles is the difference: **{{answer}}°**

        ## Why the other answers are wrong

        - **{{d1}}°**: the longer angle is taken, the way round the far side of the Earth.
        - **{{d2}}°**: both longitudes are subtracted as if they were on the same side of Greenwich.
        - **{{d3}}°**: 180° is subtracted from the sum by mistake.
        - **{{d4}}°**: the angle is halved instead of taking the smaller angle.
      presets:
