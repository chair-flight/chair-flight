      question: |-
        An island appears on the airborne weather radar display. Given the following information, determine the true bearing of the aircraft from the island:

        - Island relative to the aircraft's longitudinal axis: {{left}}° to the left
        - Magnetic heading (MH): {{mh}}°
        - Magnetic variation (VAR): {{var}}° (east positive, west negative)

        What is the true bearing of the aircraft from the island?
      explanation: |-
        The true heading is the magnetic heading corrected by the variation (east positive). The island is seen at the true heading minus the angle to the left, so its bearing from the aircraft is that value, and the bearing of the aircraft from the island is the reciprocal: 180° is added and the result is kept between 0° and 360°.

        **Solution**

        True heading: {{mh}}° + {{var}}° = {{macro1}}°

        Bearing of the island from the aircraft: {{macro1}}° - {{left}}° = {{macro2}}°

        Reciprocal: {{macro2}}° + 180° = {{macro3}}°, within 0° to 360°: **{{answer}}°**

        ## Why the other answers are wrong

        - **{{d1}}°**: gives the bearing of the island from the aircraft, forgetting the reciprocal.
        - **{{d2}}°**: applies the variation with the wrong sign.
        - **{{d3}}°**: adds the angle to the left instead of subtracting it, so the island is placed on the right.
        - **{{d4}}°**: forgets the variation completely.
