  templates:
    - type: simple
      question: |-
        An aircraft descends from FL180 to ground level with a constant TAS of {{tas}} kt. The TT in descent is {{tt}}°. The W/V at various flight levels in the area are given below.

        | FL | W/V |
        | --- | --- |
        | Ground | {{wg_d}}°/{{wg_s}} kt |
        | 30 | {{w30_d}}°/{{w30_s}} kt |
        | 60 | {{w60_d}}°/{{w60_s}} kt |
        | 90 | {{w90_d}}°/{{w90_s}} kt |
        | 120 | {{w120_d}}°/{{w120_s}} kt |
        | 150 | {{w150_d}}°/{{w150_s}} kt |
        | 180 | {{w180_d}}°/{{w180_s}} kt |

        Calculate the average GS in descent.
      explanation: |-
        The ground speed is the vector sum of the TAS and the wind. The wind changes with height, so its components are averaged over all the levels and then combined with the TAS along the TT.

        **Solution**

        Average wind over the seven levels is combined with the TAS on the TT of {{tt}}°:

        $$
        \sqrt{{(\text{TAS}\times \text{sin}(\text{true track in descent})-\frac{\text{wind speed at ground}\times \text{sin}(\text{wind direction at ground})+\text{wind speed at FL30}\times \text{sin}(\text{wind direction at FL30})+\text{wind speed at FL60}\times \text{sin}(\text{wind direction at FL60})+\text{wind speed at FL90}\times \text{sin}(\text{wind direction at FL90})+\text{wind speed at FL120}\times \text{sin}(\text{wind direction at FL120})+\text{wind speed at FL150}\times \text{sin}(\text{wind direction at FL150})+\text{wind speed at FL180}\times \text{sin}(\text{wind direction at FL180})}{7})}^{2}+{(\text{TAS}\times \text{cos}(\text{true track in descent})-\frac{\text{wind speed at ground}\times \text{cos}(\text{wind direction at ground})+\text{wind speed at FL30}\times \text{cos}(\text{wind direction at FL30})+\text{wind speed at FL60}\times \text{cos}(\text{wind direction at FL60})+\text{wind speed at FL90}\times \text{cos}(\text{wind direction at FL90})+\text{wind speed at FL120}\times \text{cos}(\text{wind direction at FL120})+\text{wind speed at FL150}\times \text{cos}(\text{wind direction at FL150})+\text{wind speed at FL180}\times \text{cos}(\text{wind direction at FL180})}{7})}^{2}} = \sqrt{{({{tas}}\times \text{sin}({{tt}})-\frac{ {{wg_s}}\times \text{sin}({{wg_d}})+{{w30_s}}\times \text{sin}({{w30_d}})+{{w60_s}}\times \text{sin}({{w60_d}})+{{w90_s}}\times \text{sin}({{w60_d}})+{{w120_s}}\times \text{sin}({{w120_d}})+{{w150_s}}\times \text{sin}({{w150_d}})+{{w150_s}}\times \text{sin}({{w180_d}})}{7})}^{2}+{({{tas}}\times \text{cos}({{tt}})-\frac{ {{wg_s}}\times \text{cos}({{wg_d}})+{{w30_s}}\times \text{cos}({{w30_d}})+{{w60_s}}\times \text{cos}({{w60_d}})+{{w90_s}}\times \text{cos}({{w60_d}})+{{w120_s}}\times \text{cos}({{w120_d}})+{{w150_s}}\times \text{cos}({{w150_d}})+{{w150_s}}\times \text{cos}({{w180_d}})}{7})}^{2}} = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: uses the ground-level wind only instead of the average over all levels.
        - **{{d2}} kt**: the TAS is taken as the ground speed, ignoring the wind.
        - **{{d3}} kt**: the wind components are added instead of subtracted, so a headwind is treated as a tailwind.
        - **{{d4}} kt**: the average wind speed is subtracted from the TAS, ignoring the direction of the wind.
