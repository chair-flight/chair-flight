  templates:
    - type: simple
      question: |-
        Calculate the ground distance in statute miles on an ATS route between two VORs, given:

        - Distance on the en-route chart: {{mm}} mm
        - Quoted chart scale: 1 inch = {{nm_per_inch}} NM

        What is the ground distance in statute miles?
      explanation: |-
        A chart scale tells you how many nautical miles one inch on the chart represents. The distance is measured in millimetres, converted to inches, turned into nautical miles with the scale, and finally converted into statute miles, since 1 nautical mile is 1.15078 statute miles.

        **Solution**

        Distance on the chart = {{mm}} mm ÷ 25.4 = {{macro1}} inch

        Ground distance = {{macro1}} inch × {{nm_per_inch}} NM per inch = {{macro2}} NM

        In statute miles = {{macro2}} NM × 1.15078 = **{{answer}} sm**

        ## Why the other answers are wrong

        - **{{d1}} sm**: gives nautical miles and does not convert to statute miles.
        - **{{d2}} sm**: divides by the conversion factor instead of multiplying.
        - **{{d3}} sm**: treats the chart distance as centimetres and skips the inch conversion.
        - **{{d4}} sm**: uses the kilometre factor for nautical miles (1.852) instead of the statute mile factor.
      presets:
        - variables:
            mm: 137
            nm_per_inch: 15
            macro1: 5
            macro2: 81
            answer: 93
            d1: 81
            d2: 70
            d3: 236
            d4: 150
          correctAnswers:
            - text: 93 sm
          wrongAnswers:
            - text: 81 sm
            - text: 236 sm
            - text: 150 sm
