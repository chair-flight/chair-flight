        - **{{d1}} kt**: the TAS is taken directly as the CAS, ignoring the density correction.
        - **{{d2}} kt**: the pressure ratio is divided instead of the density correction being applied.
        - **{{d3}} kt**: the pressure ratio alone is applied, leaving out the temperature and the square root.
        - **{{d4}} kt**: the density correction is divided instead of multiplied.
