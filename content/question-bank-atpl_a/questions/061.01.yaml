- id: QLYSN
  subjectId: "061"
  chapterId: "061.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-616360
    - AVEXAM-85756
    - AVEXAM-94536
    - AVEXAM-65887
    - ATPLQ-613945
    - AVEXAM-83370
    - ATPLQ-613693
    - BGS-611242
    - AVEXAM-61629
  annexes: []
  learningObjectiveIds:
    - 061.01.08.01.02
  templates:
    - type: simple
      question: |-
        An aircraft descends from FL{{top}} to FL{{bottom}} for the final approach. Calculate the average TAS during the descent, given:

        - CAS: {{cas}} kt
        - Temperature: ISA {{dev}} °C

        What is the average TAS in the descent?
      explanation: |-
        In a descent the air becomes denser as the aircraft goes lower, so a constant CAS corresponds to a TAS that changes with height. The average TAS is taken at the mean altitude of the descent, using the ISA temperature at that altitude plus the ISA deviation.

        **Solution**

        Mean altitude: ({{top}} + {{bottom}}) / 2 = {{macro1}} FL, which is {{macro2}} ft

        $$
        \frac{\text{CAS}}{\sqrt{\frac{{(1-0.000007\times 50\times (\text{start level}+\text{end level}))}^{5.2559}\times 288.15}{288.15-0.002\times 50\times (\text{start level}+\text{end level})+\text{ISA deviation}}}} = \frac{ {{cas}} }{\sqrt{\frac{{(1-0.000007\times 50\times ({{top}}+{{bottom}}))}^{5.2559}\times 288.15}{288.15-0.002\times 50\times ({{top}}+{{bottom}})+({{dev}})}} } = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

