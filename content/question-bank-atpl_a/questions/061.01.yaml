        What is the groundspeed in knots?
      explanation: |-
        The groundspeed is the speed over the ground. The wind acts on the aircraft in two ways. The headwind or tailwind part acts along the heading and changes the speed along the track. The crosswind part pushes the aircraft sideways. The two parts are combined at a right angle with the remaining airspeed.

