        - Mean rate of descent: {{rod}} ft/min
        - Mean groundspeed during the descent: {{gs_desc}} kt

        What is the latest time to commence descent? Give the answer as hh:mm.
      explanation: |-
        The aircraft must start its descent early enough to lose the height before it reaches the VOR. During the descent it still covers some distance at the descent groundspeed. The rest of the distance to the VOR is flown at the cruise groundspeed, and the time for it is added to the present time.

        **Solution**

        - Height to lose: {{alt_from}} ft − {{alt_to}} ft = {{macro1}} ft
        - Descent time at {{rod}} ft/min: {{macro2}} min
        - Distance covered during the descent at {{gs_desc}} kt: {{macro3}} NM
        - Distance left to fly at {{gs}} kt: {{dist}} NM − {{macro3}} NM = {{macro4}} NM
        - Time for that distance: {{macro5}} min
        - Latest start time: {{time_h}}:{{time_m}} + that time = **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}}**: forgets that the aircraft flies some distance during the descent
        - **{{d2}}**: uses the descent groundspeed for the distance left
        - **{{d3}}**: uses the cruise groundspeed for the distance covered during the descent
        - **{{d4}}**: gives only the descent time and ignores the distance to the VOR
