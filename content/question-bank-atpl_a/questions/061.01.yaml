  templates:
    - type: simple
      question: |-
        Given the following information, calculate the magnetic heading.

        - True track: {{trk}}°
        - Drift: {{drift}}° right
        - Variation: {{var}}° E
        - Compass heading: {{comp}}°

        What is the magnetic heading?
      explanation: |-
        Drift to the right means the track lies to the right of the heading, so the true heading is the track minus the drift. An easterly variation is then subtracted to turn the true heading into the magnetic heading. The compass heading is not needed for this calculation.

        **Solution**

