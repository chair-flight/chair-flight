        What are the coordinates of the position reached?
      explanation: |-
        Flying a track of 270º is flying due west, so you stay on the parallel of 40º N and only your longitude changes. A minute of longitude is shorter than a nautical mile away from the equator, so the change in longitude is the distance divided by the cosine of the latitude.

