      question: |-
        The aircraft has the following data.

        - Planned track: {{crs}}°(T)
        - Actual heading: {{hdg}}°(T)
        - Actual in-flight drift: {{drift}}° right

        What is the track error angle?
      explanation: |-
        The track error is the difference between the track the aircraft actually makes good and the planned track. A drift to the right moves the aircraft to the right of its heading, so the drift is added to the heading to get the track made good.

        **Solution**

        Track made good = heading + drift = {{hdg}}° + {{drift}}° = {{macro1}}°(T)

        Track error = track made good - planned track = $$\text{actual heading}+\text{drift (right)}-\text{planned track} = {{hdg}}+{{drift}}-{{crs}} = \mathbf{ {{answer}}\ \text{° right} }$$

        ## Why the other answers are wrong

        - **{{d1}}° right**: ignores the drift and only compares the heading with the planned track.
        - **{{d2}}° right**: doubles the track error.
        - **{{d3}}° right**: gives the track made good itself; the planned track is not subtracted.
