      question: |-
        Determine the CAS, given the following information:

        - TAS: {{tas}} kt
        - Pressure altitude: {{alt}} ft
        - Temperature: ISA {{dev}} °C

        What is the CAS?
      explanation: |-
        CAS is the TAS corrected for air density. The density falls with height and rises when the air is colder than the standard atmosphere (ISA). The ISA temperature falls by 2 °C per 1000 ft, and the ISA deviation is added to it.

        **Solution**

        $$
        \text{TAS}\times \sqrt{\frac{{(1-0.000007\times \text{pressure altitude})}^{5.2559}\times 288.15}{288.15-0.002\times \text{pressure altitude}+\text{ISA deviation}}} = {{tas}}\times \sqrt{\frac{{(1-0.000007\times {{alt}})}^{5.2559}\times 288.15}{288.15-0.002\times {{alt}}+({{dev}})}} = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: the TAS is taken directly as the CAS, ignoring the density correction.
        - **{{d2}} kt**: the ISA deviation is applied with the wrong sign.
        - **{{d3}} kt**: the density ratio is inverted, so the TAS is divided instead of multiplied.
        - **{{d4}} kt**: the temperature correction is left out completely.
