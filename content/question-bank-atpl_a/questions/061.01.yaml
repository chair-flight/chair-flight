  templates:
    - type: simple
      question: |-
        An aircraft has a TAS of {{tas}} kt and a groundspeed of {{gs}} kt. It is estimated to cross a meridian in {{t_now}} minutes. ATC asks for a speed reduction so that it crosses the meridian in {{t_new}} minutes instead.

        What is the approximate reduction in TAS required?
      explanation: |-
        With a constant wind, a change in TAS changes the groundspeed by the same amount. The distance to the meridian does not change, so the groundspeed needed is in inverse proportion to the time available: a longer time means a lower groundspeed.

        **Solution**

        - Groundspeed needed for the later crossing: {{macro1}} kt, down from {{gs}} kt
        - Reduction in TAS: $$\frac{\text{Groundspeed}\times (\text{Time to the meridian after the reduction}-\text{Time to the meridian now})}{\text{Time to the meridian after the reduction}} = \frac{ {{gs}}\times ({{t_new}}-{{t_now}})}{ {{t_new}} } = \mathbf{ {{answer}}\ \text{kt} }$$

        ## Why the other answers are wrong

        - **{{d1}} kt**: the headwind (TAS minus groundspeed) has been taken as the reduction.
        - **{{d2}} kt**: the original time has been used as the base instead of the new time.
        - **{{d3}} kt**: the reduction has been applied to the TAS instead of the groundspeed.
        - **{{d4}} kt**: the difference in time has been divided by 60 instead of by the new time.
