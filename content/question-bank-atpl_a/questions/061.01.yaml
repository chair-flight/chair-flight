        Using mental dead reckoning, determine the crosswind component, to the nearest whole knot, for the following runway and wind:

        - Runway heading: {{rwy}}°
        - Surface wind (magnetic, from the tower): {{wdir}}° / {{wspd}} kt

        What is the crosswind component?
      explanation: |-
        The crosswind component is the part of the wind that blows across the runway. Mental dead reckoning uses the rule of 60: each degree between the wind and the runway is worth one sixtieth of the wind speed, so 30° gives half the wind speed and 60° gives the full wind speed. The result is rounded to the nearest whole knot.

        **Solution**

        Angle between wind and runway: {{macro1}}°

        Crosswind = $${{wspd}}\times \text{min}(\frac{\text{min}(|{{wdir}}-{{rwy}}|,360-|{{wdir}}-{{rwy}}|)}{60},1)$$ = {{macro3}} kt, rounded to **{{answer}} kt**

        ## Why the other answers are wrong

        - **{{d1}} kt**: uses the cosine of the angle, which gives the headwind part instead of the crosswind part.
        - **{{d2}} kt**: divides by 90 instead of 60.
        - **{{d3}} kt**: divides by 30 instead of 60.
        - **{{d4}} kt**: subtracts the crosswind from the wind speed, mixing up the two components.
