      question: |-
        An aircraft at FL{{fl_from}} is required to descend to cross a DME facility at FL{{fl_to}}.

        The rate of descent is {{rod}} ft/min and the mean ground speed for the descent is {{gs}} kt.

        The minimum range from the DME at which the descent should start is:
      explanation: |-
        The descent time is the height to lose divided by the rate of descent. The distance is the ground speed (in NM per minute) times that time.

        **Solution**

        Height to lose = {{macro1}} ft
        Time = {{macro2}} min

        $$
        \frac{\frac{\text{Ground speed}}{60}\times (\text{Initial flight level}-\text{Final flight level})\times 100}{\text{Rate of descent}} = \frac{\frac{ {{gs}} }{60}\times ({{fl_from}}-{{fl_to}})\times 100}{ {{rod}} } = \mathbf{ {{answer}}\ \text{NM} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} NM**: the full initial flight level was used as height to lose.
        - **{{d2}} NM**: only the final flight level was used as height to lose.
        - **{{d3}} NM**: a 3-degree path (300 ft per NM) was assumed, ignoring rate of descent and ground speed.
        - **{{d4}} NM**: the ground speed was not converted to NM per minute.
