    - ATPLQ-612259
  annexes: []
  learningObjectiveIds:
    - 061.01.02.01.03
  templates:
    - type: simple
      question: |-
        An aircraft flies from A to B, both on the same meridian.

        - Latitude of A: {{lat_a}}°
        - Latitude of B: {{lat_b}}°

        What is the latitude change in decimal degrees? Give a positive number when B is south of A and a negative number when B is north of A.
      explanation: |-
        Latitude is measured from the equator, north positive. The latitude change between two points on the same meridian is the difference of their latitudes. A positive result means the aircraft travels south.

        **Solution**

        - $$\text{Latitude of A}-\text{Latitude of B} = {{lat_a}}-{{lat_b}} = \mathbf{ {{answer}}\ \text{°} }$$, so the aircraft travels south

        ## Why the other answers are wrong

        - **{{d1}}°**: adds the latitudes instead of subtracting them
        - **{{d2}}°**: divides the change by three
        - **{{d3}}°**: reverses the direction of travel
        - **{{d4}}°**: multiplies the latitudes instead of subtracting them
      presets:
