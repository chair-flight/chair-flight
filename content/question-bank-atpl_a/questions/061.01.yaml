  templates:
    - type: simple
      question: |-
        A flight crew is instructed by ATC to delay their arrival at the next waypoint by {{delay}} minutes. Calculate the new ground speed they must fly to achieve this.

        - Distance to go: {{dist}} NM
        - Level: {{alt}} ft
        - CAS: {{cas}} kt
        - Temperature: ISA +{{isa}} °C
        - Headwind component: {{hw}} kt

        What new ground speed must be flown?
      explanation: |-
        A delay means the same distance is covered in a longer time, so the ground speed has to come down. The true airspeed is read from the computer using the CAS, the level and the temperature, and it is taken to the nearest knot. The headwind is subtracted to give the ground speed flown now. The time to the waypoint is then extended by the delay, and the new ground speed is the one that covers the same distance in that longer time.

        **Solution**

        - True airspeed, to the nearest knot: {{macro1}} kt
        - Ground speed flown now: {{macro2}} kt
        - New ground speed for the delayed time: **{{answer}} kt**

        ## Why the other answers are wrong

        - **{{d1}} kt**: keeps the ground speed flown now, so the delay is not used.
        - **{{d2}} kt**: subtracts the delay, which speeds the aircraft up instead of slowing it down.
        - **{{d3}} kt**: adds the headwind to the true airspeed instead of taking it off.
        - **{{d4}} kt**: adds the delay in minutes without converting it into hours.
      presets:
