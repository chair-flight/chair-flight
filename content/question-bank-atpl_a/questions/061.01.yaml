        - Ground speed: {{gs}} kt

        What is the descent gradient in percent?
      explanation: |-
        The descent gradient is the height lost per unit of ground distance, expressed as a percentage. The distance flown between the two DME readings is the difference of the two DME distances, and one nautical mile is 6076.12 ft.

