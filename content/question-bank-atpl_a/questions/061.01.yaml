  templates:
    - type: simple
      question: |-
        An aircraft is at FL{{fl}} and Mach {{mach}}, with an outside air temperature of {{oat}} °C and a headwind component of {{wind}} kt (a negative value is a tailwind).

        It is required to reduce speed in order to cross a reporting point {{delay}} min later than planned. If the speed reduction is made {{dist}} NM from the reporting point, what Mach number is required?
      explanation: |-
        The speed of sound depends on the outside air temperature. The groundspeed is the true airspeed minus the headwind. Crossing the same distance later means flying it at a lower groundspeed, so the new true airspeed is the new groundspeed plus the headwind.

        **Solution**

        Speed of sound = 38.9 × √{{macro1}} = {{macro2}} kt

        Current groundspeed = {{mach}} × {{macro2}} − {{wind}} = {{macro3}} kt

        New groundspeed = {{dist}} NM ÷ ({{dist}} NM ÷ current groundspeed + {{delay}} min) = {{macro4}} kt

        Required Mach = (new groundspeed + {{wind}}) ÷ {{macro2}} = **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}}**: the speed of sound at ISA sea level is used instead of the speed of sound at the actual outside air temperature.
        - **{{d2}}**: the time difference is counted twice, so the new speed is too low.
        - **{{d3}}**: the delay in minutes is added as if it were hours.
        - **{{d4}}**: the original Mach number is kept, with no change in speed.
