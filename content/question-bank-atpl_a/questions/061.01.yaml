        - Point A: {{lat_d}}°{{lat_m}}' N, {{a_d}}°{{a_m}}' W
        - Point B: {{lat_d}}°{{lat_m}}' N, {{b_d}}°{{b_m}}' W

        What is the distance between A and B along the parallel? Give the answer in NM.
      explanation: |-
        Parallels of latitude are shorter than the equator: one minute of longitude along a parallel is only as long as one NM multiplied by the cosine of the latitude. The distance along a parallel is therefore the difference in longitude in minutes multiplied by the cosine of the latitude.

        **Solution**

        Difference in longitude = {{macro1}} min

        Distance = $$|{{a_d}}\times 60+{{a_m}}-({{b_d}}\times 60+2)|\times \text{cos}({{lat_d}}+\frac{ {{lat_m}} }{60}) = \mathbf{ {{answer}}\ \text{NM} }$$

        ## Why the other answers are wrong

        - **{{d1}} NM**: the longitude difference is divided by 60 (converted to degrees) instead of being used in minutes.
        - **{{d2}} NM**: the cosine of the latitude is forgotten, so the minutes are taken as if at the equator.
        - **{{d3}} km**: the result is converted to kilometres (x 1.852) instead of being kept in NM.
        - **{{d4}} NM**: the sine of the latitude is used instead of the cosine.
