      question: |-
        Given the following information, determine the actual track of the aircraft:

        - Planned track: {{planned}}° (T)
        - Planned wind correction angle: {{wca}}° left
        - Actual in-flight drift: {{drift}}° right

        What is the actual track (degrees true)?
      explanation: |-
        The heading is the planned track corrected for the planned wind correction angle: a left correction is subtracted from the track. The in-flight drift is then applied to the heading, with right drift counted as positive.

        **Solution**

        Heading: {{planned}} - {{wca}} = {{macro1}}°

        Actual track: $$\text{Planned track}-\text{Planned wind correction angle (left)}+\text{In-flight drift (right)} = {{planned}}-{{wca}}+{{drift}} = \mathbf{ {{answer}}\ \text{°(T)} }$$

        ## Why the other answers are wrong

        - **{{d1}}°(T)**: the left wind correction is applied as a right correction.
        - **{{d2}}°(T)**: the drift is subtracted instead of added.
        - **{{d3}}°(T)**: the wind correction angle is ignored.
        - **{{d4}}°(T)**: right drift is treated as left drift.
      presets:
