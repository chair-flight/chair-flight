      question: |-
        Two positions lie on the same meridian, given:

        - Point A: {{a_d}}°{{a_m}}' N
        - Point B: {{b_d}}°{{b_m}}' S

        What is the shortest distance between A and B? Give the answer in km.
      explanation: |-
        Both points are on the same meridian, so the shortest distance is the latitude difference in minutes, where one minute equals one NM. Point A and point B are in opposite hemispheres, so their distances from the equator are added. The result is converted from NM to km at 1.852 km per NM.

        **Solution**

        Distance in NM = $${{a_d}}\times 60+{{a_m}}+{{b_d}}\times 60+{{b_m}}$$ = {{macro2}} NM

        Distance in km = {{macro2}} x 1.852 = **{{answer}} km**

        ## Why the other answers are wrong

        - **{{d1}} km**: the distance in NM is given without converting it to km.
        - **{{d2}} km**: the distance is divided by 1.852 instead of multiplied.
        - **{{d3}} km**: the latitudes are subtracted, but the points are in opposite hemispheres.
        - **{{d4}} km**: the distance is multiplied by 1.609 (statute miles) instead of 1.852.
