        What is the position of the aircraft at 11:30 UTC?
      explanation: |-
        A track of 270° is due west. Along a parallel, one minute of longitude is shorter than one nautical mile by the factor cos(latitude), so the change in longitude is the distance divided by cos(latitude). The distance flown in 1.5 hours is the groundspeed multiplied by 1.5.

