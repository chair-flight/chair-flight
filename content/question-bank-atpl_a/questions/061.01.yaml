  templates:
    - type: simple
      question: |-
        Given the following information, which radial is the aircraft on?

        - Initial magnetic track of the great circle from the aircraft to the VOR: {{track}}°M
        - Variation at the aircraft: {{var_ac}}°W
        - Latitude of the aircraft: {{lat_ac}}°N
        - Latitude of the VOR: {{lat_vor}}°N
        - Variation at the VOR: {{var_vor}}°W
        - Longitude difference between the aircraft and the VOR: {{dlon}}°

        Which radial is the aircraft on?
      explanation: |-
        The radial is the magnetic bearing of the aircraft from the VOR. The track from the aircraft to the VOR is turned around to give the bearing back from the VOR, a correction is made for the convergence of the meridians between the two positions, and the result is converted to a magnetic bearing using the variation at the VOR.

        **Solution**

        - Reversed true track: {{macro1}}°T
        - Convergence correction: $${{dlon}}\times \text{sin}(\frac{ {{lat_ac}}+{{lat_vor}} }{2})$$°
        - Magnetic radial: $$\text{Initial magnetic track, aircraft to VOR}-\text{Variation at the aircraft (west)}+180+\text{Longitude difference}\times \text{sin}(\frac{\text{Latitude of the aircraft}+\text{Latitude of the VOR}}{2})+\text{Variation at the VOR (west)} = {{track}}-{{var_ac}}+180+{{dlon}}\times \text{sin}(\frac{ {{lat_ac}}+{{lat_vor}} }{2})+{{var_vor}} = \mathbf{ {{answer}}\ \text{radial} }$$

        ## Why the other answers are wrong

        - **{{d1}} radial**: uses the track from the aircraft to the VOR without reversing it.
        - **{{d2}} radial**: forgets the convergence correction and the variation at the VOR.
        - **{{d3}} radial**: adds the variation at the aircraft instead of taking it away.
        - **{{d4}} radial**: takes the convergence correction away instead of adding it.
