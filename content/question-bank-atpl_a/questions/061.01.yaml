    - BGS-610536
  annexes: []
  learningObjectiveIds:
    - 061.01.08.03.05
  templates:
    - type: simple
      question: |-
        Given the following information, calculate the approximate rate of descent.

        - TAS: {{tas}} kt
        - True course: {{course}}°T
        - Wind (direction/speed): {{wdir}}°/{{ws}} kt
        - Descent is initiated at {{start_alt}} ft and completed at {{end_alt}} ft
        - Distance to be covered during descent: {{dist}} NM

        What is the rate of descent, in ft/min?
      explanation: |-
        The groundspeed is the TAS corrected for the wind. Only the part of the wind that acts along the track changes the groundspeed. A headwind reduces it and a tailwind increases it. The component along the track is the wind speed multiplied by the cosine of the angle between the wind direction and the track.

        **Solution**

        - Headwind component: {{macro1}} kt (a negative value is a tailwind)
        - Groundspeed: {{macro2}} kt
        - Time for the descent: {{macro3}} min
        - Rate of descent: $$\frac{\text{Start altitude}-\text{End altitude}}{\frac{\text{Ground distance during the descent}}{\text{TAS}-\text{Wind speed}\times \text{cos}(\text{Wind direction (from)}-\text{True course})}\times 60} = \frac{ {{start_alt}}-{{end_alt}} }{\frac{ {{dist}} }{ {{tas}}-{{ws}}\times \text{cos}({{wdir}}-{{course}})}\times 60} = \mathbf{ {{answer}}\ \text{ft/min} }$$

        ## Why the other answers are wrong

        - **{{d1}} ft/min**: the wind is ignored, so the groundspeed is just the TAS.
        - **{{d2}} ft/min**: the headwind is treated as a tailwind, which raises the groundspeed.
        - **{{d3}} ft/min**: the height is divided by the distance instead of the time, so the groundspeed is ignored.
        - **{{d4}} ft/min**: the start altitude is used instead of the height to lose.
      presets:
        - variables:
            tas: 197
            course: 240
            wdir: 180
            ws: 30
            start_alt: 22000
            end_alt: 4000
            dist: 39
            macro1: 15
            macro2: 182
            macro3: 13
            answer: 1400
            d1: 1515
            d2: 1631
            d3: 27692
            d4: 1711
          correctAnswers:
