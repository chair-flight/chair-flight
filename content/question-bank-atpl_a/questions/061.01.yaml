      question: |-
        An aircraft flies from A to B. The data is:

        - Planned track: {{planned}}°
        - Distance from A to B: {{total}} NM
        - Distance flown when the error is noticed: {{flown}} NM
        - Cross track error: {{xte}}° to the right

        Which track should the pilot now follow to arrive at B?
      explanation: |-
        The aircraft has moved off the planned track by the cross track error. To arrive at B it must turn back: the track change is the error angle plus a correction angle that brings it back to the track within the distance still to fly. The correction angle is the error angle multiplied by the distance flown and divided by the distance still to fly.

        **Solution**

        Distance still to fly: {{total}} NM - {{flown}} NM = {{macro1}} NM

        $$
        \text{Planned track}-\frac{\text{Cross track error}\times \text{Distance from A to B}}{\text{Distance from A to B}-\text{Distance flown}}
        $$

        $$
        {{planned}}-\frac{ {{xte}}\times {{total}} }{ {{total}}-{{flown}} } = \mathbf{ {{answer}}\ \text{°} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}°**: only the cross track error is applied, with no correction for the distance still to fly
        - **{{d2}}°**: adds the track change, so the pilot turns the wrong way
        - **{{d3}}°**: uses the distance flown instead of the total distance in the correction
        - **{{d4}}°**: divides by the distance flown instead of the distance still to fly
