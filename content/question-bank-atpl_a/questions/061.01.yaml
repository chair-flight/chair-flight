        - Average true airspeed: {{tas}} kt
        - Ground distance covered during the climb: {{dist}} NM
        - Average headwind component: {{hw}} kt

        What is the required rate of climb (ft/min, rounded to the nearest 50 ft/min)?
      explanation: |-
        The height to gain divided by the time needed gives the rate of climb. The time depends on the groundspeed, which is the true airspeed minus the headwind.

        **Solution**

        - Height to gain: FL{{fl}} minus {{alt}} ft = {{macro1}} ft
        - Groundspeed: {{tas}} kt − {{hw}} kt = {{macro2}} kt
        - Time for {{dist}} NM: {{macro3}} min
        - Rate of climb: {{macro4}} ft/min, rounded to the nearest 50 ft/min gives **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}} ft/min**: the headwind is added to the speed instead of subtracted.
        - **{{d2}} ft/min**: the headwind is left out.
        - **{{d3}} ft/min**: the starting height is ignored and the headwind is left out.
