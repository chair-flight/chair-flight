        Calculate the maximum allowable wind speed for the following situation.

        - Maximum allowable crosswind component: {{xw}} kt
        - Runway centreline direction: {{rwy}}°M
        - Wind direction: {{wdir}}°M

        What is the maximum allowable wind speed, in kt?
      explanation: |-
        The crosswind component is the part of the wind that blows across the runway. It equals the wind speed multiplied by the sine of the angle between the wind direction and the runway. Turning this round gives the strongest wind that keeps the crosswind within the limit: divide the crosswind limit by the sine of the angle.

