        - **{{d1}}°T**: adds the relative bearing although the island is to the left, and applies the variation with the wrong sign.
        - **{{d2}}°T**: applies the variation with the wrong sign.
        - **{{d3}}°T**: ignores the variation, so the result stays magnetic.
        - **{{d4}}°T**: adds the relative bearing instead of subtracting it.
