    - type: simple
      question: |-
        An aircraft climbs at a given rate of climb and airspeed:

        - Rate of climb: {{roc}} ft/min
        - TAS: {{tas}} kt
        - Required climb gradient: {{grad}}%

        What is the minimum headwind component required to achieve the climb gradient, rounded up to the next 10 kt?
      explanation: |-
        The climb gradient is the rate of climb divided by the groundspeed, with the rate of climb in ft/min and the groundspeed in knots. The groundspeed needed for the gradient is therefore the rate of climb divided by the gradient. A headwind slows the aircraft down, so the headwind is the TAS minus that groundspeed, rounded up to the next 10 kt.

        **Solution**

        - Groundspeed needed: {{roc}} ft/min ÷ {{grad}}% = {{macro1}} kt
        - Headwind: {{tas}} kt - {{macro1}} kt = {{macro2}} kt
        - $$\text{ceil}(\frac{\text{TAS}-\frac{\text{Rate of climb}}{\text{Climb gradient}}}{10})\times 10 = \text{ceil}(\frac{ {{tas}}-\frac{ {{roc}} }{ {{grad}} }}{10})\times 10 = \mathbf{ {{answer}}\ \text{kt} }$$

        ## Why the other answers are wrong

        - **{{d1}} kt**: the headwind was not rounded up to the next 10 kt.
        - **{{d2}} kt**: the headwind was rounded up one 10 kt step too far.
        - **{{d3}} kt**: the groundspeed was added to the TAS instead of subtracted.
        - **{{d4}} kt**: the rate of climb was multiplied by the gradient instead of divided.
