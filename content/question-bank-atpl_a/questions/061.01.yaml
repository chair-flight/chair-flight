- id: QDIGO
  subjectId: "061"
  chapterId: "061.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-612592
    - AVEXAM-50270
  annexes: []
  learningObjectiveIds:
    - 061.01.05.02.01
  templates:
    - type: simple
      question: |-
        An aircraft is flying at the following conditions:

        - Mach number: {{mach}}
        - OAT: {{oat}} °C

        What is the TAS?
      explanation: |-
        The true airspeed is the Mach number multiplied by the local speed of sound. The speed of sound depends only on the air temperature, not on the altitude, so the OAT is all that is needed.

        **Solution**

        $$
        T_{\text{Kelvin}} &= 273.15 + T_{\text{Celsius}} \\
                          &= 273.15 + ({{oat}}) = {{kelvin}}\ \text{K} \\
        LSS &= 38.967854 \times \sqrt{T_{\text{Kelvin}}} \\
            &= 38.967854 \times \sqrt{ {{kelvin}} } = {{lss}}\ \text{kt} \\
        TAS &= {{mach}} \times LSS  \\
            &= {{mach}} \times {{lss}} = {{tas}}\ \text{kt}
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: uses the sea-level speed of sound (661 kt) and ignores the temperature.
        - **{{d2}} kt**: converts the result to km/h by multiplying by 1.852, but the answer is requested in knots.
        - **{{d3}} kt**: reverses the sign of the temperature, so cold air is treated as warm.
        - **{{d4}} kt**: uses 0 °C as the temperature instead of the actual OAT.
