  templates:
    - type: simple
      question: |-
        Using mental dead reckoning, determine the ground speed for the following situation:

        - TAS: {{tas}} kt
        - Wind: {{wspd}} kt, blowing {{angle}}° off your track

        What is the ground speed?
      explanation: |-
        Mental dead reckoning splits the wind into a part that blows along your track and a part that blows across it. Only the part along the track changes your speed over the ground: a headwind slows you down and a tailwind speeds you up. To find that part, round the wind angle to the nearest clock position (1 o'clock = 30°, 2 o'clock = 60°, and so on) and read the share of the wind speed from the clock table: 1 o'clock is 9/10, 2 o'clock is 1/2, 3 o'clock is nothing, and beyond 3 o'clock the share becomes a tailwind.

        **Solution**

        Nearest clock position: {{angle}}° rounds to {{macro1}} o'clock, which is {{macro2}}°

        Share of the wind speed along the track (negative means tailwind): {{macro3}}

        Headwind component = $$\frac{ {{wspd}}\times \text{round}(10\times \text{cos}(30\times \text{round}(\frac{ {{angle}} }{30})))}{10}$$ kt

        Ground speed = $${{tas}}-\frac{ {{wspd}}\times \text{round}(10\times \text{cos}(30\times \text{round}(\frac{ {{angle}} }{30})))}{10} = \mathbf{ {{answer}}\ \text{kt} }$$

        ## Why the other answers are wrong

        - **{{d1}} kt**: the sign of the wind component is reversed, so a headwind is treated as a tailwind.
        - **{{d2}} kt**: takes the full wind speed as headwind and ignores the wind angle.
        - **{{d3}} kt**: subtracts the crosswind part (sine of the angle) instead of the headwind part.
        - **{{d4}} kt**: adds the full wind speed, as if the wind were a straight tailwind.
      presets:
