  templates:
    - type: simple
      question: |-
        An aircraft follows a radial to a VOR/DME station. Given the following information:

        - At 10:00 the DME reads {{dme0}} NM
        - {{dt}} minutes later the DME reads {{dme1}} NM

        What is the estimated time overhead the VOR/DME station? Give the answer as hh:mm.
      explanation: |-
        When the aircraft flies straight towards the station, the DME distance falls at a steady rate. The rate is found from the two readings, and the distance still to go is divided by that rate to give the time left.

        **Solution**

        - Distance flown in {{dt}} minutes: {{macro1}} NM
        - Rate of closing: {{macro2}} NM per minute
        - Time left from the second reading: $$\frac{\text{DME at the second reading}}{\frac{\text{DME at 10:00}-\text{DME at the second reading}}{\text{Time between the two readings}}} = \frac{ {{dme1}} }{\frac{ {{dme0}}-{{dme1}} }{ {{dt}} }}$$ minutes
        - Time over the station: 10:00 + {{dt}} min + {{macro5}} min = **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}}**: uses the DME at 10:00 as the distance still to go, instead of the DME at the second reading.
        - **{{d2}}**: forgets the minutes already flown after 10:00.
        - **{{d3}}**: divides by the DME at 10:00 when working out the time, instead of using the distance flown.
        - **{{d4}}**: adds the distance flown in NM as if it were a number of minutes.
