      question: |-
        Using mental dead reckoning, determine the crosswind component, to the nearest whole knot, for the following track and wind:

        - Magnetic track: {{rwy}}°
        - Wind (magnetic): {{wdir}}° / {{wspd}} kt

        What is the crosswind component?
      explanation: |-
        Mental dead reckoning uses the 1-in-60 rule. The crosswind is the wind speed multiplied by the angle between the wind and the track, divided by 60, and it cannot exceed the full wind speed. The angle is the smaller of the two differences between the wind and track directions.

        **Solution**

        - Angle between wind and track = {{macro1}}°
        - $$\text{wind speed}\times \text{min}(\frac{\text{min}(|\text{wind direction}-\text{magnetic track}|,360-|\text{wind direction}-\text{magnetic track}|)}{60},1) = {{wspd}}\times \text{min}(\frac{\text{min}(|{{wdir}}-{{rwy}}|,360-|{{wdir}}-{{rwy}}|)}{60},1) = \mathbf{ {{answer}}\ \text{kt} }$$

        ## Why the other answers are wrong

        - **{{d1}} kt**: the cosine of the angle was used, which gives the headwind component, not the crosswind.
        - **{{d2}} kt**: the angle was divided by 90 instead of 60, which understates the crosswind.
        - **{{d3}} kt**: the angle was divided by 30 instead of 60, which overstates the crosswind.
        - **{{d4}} kt**: the exact sine of the angle was used instead of the mental 1-in-60 method.
