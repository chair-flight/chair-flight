        An aircraft departs from an airport and climbs to its top of climb, given:

        - Airport elevation: {{elev}} ft
        - QNH: {{qnh}} hPa
        - TAS: {{tas}} kt
        - Headwind component: {{hw}} kt
        - Rate of climb: {{roc}} ft/min
        - Top of climb: FL{{top_fl}}

        At what distance from the airport is the top of climb reached? Give the answer in NM.
      explanation: |-
        The distance is the ground speed multiplied by the time needed to climb. The time is the altitude gained divided by the rate of climb. The starting altitude must be the pressure altitude of the airport, which is its elevation corrected for the QNH: 30 ft for each hPa the QNH differs from the standard 1013 hPa. The headwind reduces the ground speed.

