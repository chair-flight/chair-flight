  templates:
    - type: simple
      question: |-
        Given the following information, determine the track error angle:

        - Planned track: {{track}}°(T)
        - Actual heading: {{heading}}°(T)
        - Actual in-flight drift: {{drift}}° (negative = left, positive = right)

        Give the track error angle in degrees, left or right.
      explanation: "{{explanation}}"
      presets:
        - variables:
            track: 197
            heading: 213
            drift: -12
            explanation: |-
              The track error angle (TKE) is the angle between the planned track and the track actually being made good. The track made good is the heading plus the drift caused by the wind. A drift to the left is subtracted from the heading and a drift to the right is added. If the result is to the right of the planned track the error is to the right, otherwise it is to the left.

              **Solution**

              The track made good is 213° - 12° = 201°. The track error is 201° - 197° = 4°, to the right.

              ## Why the other answers are wrong

              - **4° left**: the right size, but the wrong direction.
              - **12° left**: the drift is taken as the track error, without the planned track.
              - **16° right**: the planned track is not subtracted from the heading, so the heading error is used.
          correctAnswers:
            - text: 4° right
          wrongAnswers:
            - text: 16° right
            - text: 4° left
            - text: 12° left
        - variables:
            track: 240
            heading: 235
            drift: -7
            explanation: |-
              The track error angle (TKE) is the angle between the planned track and the track actually being made good. The track made good is the heading plus the drift caused by the wind. A drift to the left is subtracted from the heading and a drift to the right is added. If the result is to the right of the planned track the error is to the right, otherwise it is to the left.

              **Solution**

              The track made good is 235° - 7° = 228°. The track error is 228° - 240° = -12°, so 12° to the left.

              ## Why the other answers are wrong

