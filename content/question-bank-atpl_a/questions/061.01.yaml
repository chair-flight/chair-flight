      question: |-
        An aeroplane is climbing with a constant TAS of {{tas}} kt and a headwind component of {{hw}} kt. The rate of climb is {{roc}} ft/min.

        What climb gradient is achieved, in %?
      explanation: |-
        The climb gradient is the height gained per unit of horizontal distance covered over the ground. At 1 NM per 6 076 ft, one minute at a groundspeed of 1 kt covers 101.3 ft, so the gradient is the rate of climb divided by the distance covered per minute.

        **Solution**

        Groundspeed = {{tas}} kt − {{hw}} kt = {{macro1}} kt

        Horizontal distance per minute = {{macro1}} × 101.3 = {{macro2}} ft

        Climb gradient = {{roc}} ft/min ÷ {{macro2}} ft × 100 = **{{answer}} %**

        ## Why the other answers are wrong

        - **{{d1}} %**: uses the TAS and ignores the headwind.
        - **{{d2}} %**: adds the headwind instead of subtracting it.
        - **{{d3}} %**: adds twice the headwind to the TAS.
        - **{{d4}} %**: multiplies by 1 000 instead of 100 when converting to a percentage.
