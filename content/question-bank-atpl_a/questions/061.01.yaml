        The pilot wants to fly direct to B from this point. By how many degrees must the track be changed to do this, using the 1 in 60 rule?
      explanation: |-
        The 1 in 60 rule gives a quick estimate of the heading change needed to fly back to the intended track, from the offset and the distance still to be flown. The correction is made to the right, back towards the line to B.

