- id: QMEWK
  subjectId: "061"
  chapterId: "061.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-617175
    - ATPLQ-619540
    - BGS-610439
    - AVEXAM-43650
    - AVEXAM-13625
    - BGS-610435
    - BGS-610462
  annexes: []
  learningObjectiveIds:
    - 061.01.06.02.01
  templates:
    - type: simple
      question: |-
        Given the following information, calculate the true track and groundspeed:

        - TAS: {{tas}} kt
        - Heading: {{hdg}}°(T)
        - Wind: {{wdir}}°(T) / {{wspd}} kt

        Give the track in degrees true and the groundspeed in kt.
      explanation: "{{explanation}}"
      presets:
        - variables:
            tas: 198
            hdg: 180
            wdir: 359
            wspd: 25
            explanation: |-
              The wind triangle links the heading, the true airspeed and the wind. The wind pushes the aircraft along or across its heading, which changes both the track and the groundspeed.

              **Solution**

              The wind comes from almost due north and the aircraft flies south, so the wind is a tailwind of about 25 kt. The track stays at 180° and the groundspeed is 198 + 25 = 223 kt.

              ## Why the other answers are wrong

              - **179 - 220 kt**: a small wrong track, and the tailwind is not fully added.
              - **180 - 183 kt**: the wind is treated as a light headwind instead of a tailwind.
              - **181 - 180 kt**: the track is wrong, and the groundspeed is a slip in the wind effect.
          correctAnswers:
            - text: 180 - 223 kt
          wrongAnswers:
            - text: 181 - 180 kt
            - text: 179 - 220 kt
            - text: 180 - 183 kt
        - variables:
            tas: 170
            hdg: 100
            wdir: 350
            wspd: 30
            explanation: |-
              The wind triangle links the heading, the true airspeed and the wind. The wind pushes the aircraft to one side of its heading, so the track differs from the heading, and it also adds or removes speed along the track.

              **Solution**

              The wind from 350° pushes the aircraft to the right of its heading, so the track is about 9° right of 100°, giving 109°. The wind also gives a tailwind component, so the groundspeed is about 182 kt.

              ## Why the other answers are wrong

              - **Track: 098°T, groundspeed: 178 kt**: the wind correction is applied to the wrong side of the heading.
              - **Track: 103°T, groundspeed: 178 kt**: the track is only partly corrected, and the wind speed is not fully used.
              - **Track: 091°T, groundspeed: 183 kt**: the wind correction is applied in the opposite direction, which is also too far to the left.
          correctAnswers:
            - text: "Track: 109°T, groundspeed: 182 kt"
          wrongAnswers:
            - text: "Track: 091°T, groundspeed: 183 kt"
            - text: "Track: 098°T, groundspeed: 178 kt"
            - text: "Track: 103°T, groundspeed: 178 kt"
