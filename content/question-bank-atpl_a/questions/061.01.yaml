        - TAS: {{tas}} kt
        - True heading: {{hdg}}°
        - Wind: {{wd}}°/{{ws}} kt

        Give the ground speed in knots.
      explanation: |-
        The ground speed is the vector sum of the TAS along the heading and the wind. The law of cosines gives the length of that vector, using the angle between the heading and the direction the wind blows towards.

        **Solution**

        Angle between heading and wind: $$\text{True heading}-\text{Wind direction} = {{hdg}}-{{wd}}$$°

        Ground speed: $$\sqrt{\text{TAS}\times \text{TAS}+\text{Wind speed}\times \text{Wind speed}-2\times \text{TAS}\times \text{Wind speed}\times \text{cos}(\text{True heading}-\text{Wind direction})} = \sqrt{ {{tas}}\times {{tas}}+{{ws}}\times {{ws}}-2\times {{tas}}\times {{ws}}\times \text{cos}({{hdg}}-{{wd}})} = \mathbf{ {{answer}}\ \text{kt} }$$

        ## Why the other answers are wrong

        - **{{d1}} kt**: uses the headwind component only, without the crosswind.
        - **{{d2}} kt**: adds the wind component instead of subtracting it.
        - **{{d3}} kt**: adds the wind speed to the TAS, ignoring direction.
        - **{{d4}} kt**: uses the sine of the angle instead of the cosine.
