- id: QSSUX
  subjectId: "061"
  chapterId: "061.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-615326
  annexes: []
  learningObjectiveIds:
    - 061.01.07.01.04
  templates:
    - type: simple
      question: |-
        Using mental dead reckoning, determine the drift (size only, in degrees), given:

        - TAS: {{tas}} kt
        - Wind: blowing 45° from the left of track at {{wspd}} kt

        What is the drift in degrees?
      explanation: |-
        Mental dead reckoning uses the 1 in 60 rule: the drift in degrees is about 60 times the crosswind component divided by the TAS. For a wind 45 degrees from the track, the crosswind is about three quarters of the wind speed. The wind comes from the left, so the drift is to the right and the correction is to the left.

        **Solution**

        - Crosswind component: 0.75 × {{wspd}} = {{macro1}} kt
        - Drift: 60 × {{macro1}} ÷ {{tas}} = $$\frac{60\times 0.75\times \text{Wind speed}}{\text{TAS}} = \frac{60\times 0.75\times {{wspd}} }{ {{tas}} } = \mathbf{ {{answer}}\ \text{°} }$$

        ## Why the other answers are wrong

        - **{{d1}}°**: the factor for 30 degrees (0.5) is used instead of the one for 45 degrees.
        - **{{d2}}°**: the full wind speed is used as crosswind, as if the wind were at right angles to the track.
        - **{{d3}}°**: the drift is doubled.
      presets:
        - variables:
            tas: 180
            wspd: 50
            macro1: 37.5
            answer: 12.5
            d1: 8.3
            d2: 16.7
            d3: 25
          correctAnswers:
            - text: 12.5 °
          wrongAnswers:
            - text: 25 °
            - text: 8.3 °
            - text: 16.7 °
        - variables:
            tas: 200
            wspd: 30
            macro1: 22.5
            answer: 6.8
            d1: 4.5
            d2: 9
            d3: 13.5
          correctAnswers:
            - text: 6.8 °
          wrongAnswers:
            - text: 13.5 °
            - text: 4.5 °
            - text: 9 °
        - variables:
            tas: 150
            wspd: 40
            macro1: 30
            answer: 12
            d1: 8
            d2: 16
            d3: 24
          correctAnswers:
            - text: 12 °
          wrongAnswers:
            - text: 24 °
            - text: 8 °
            - text: 16 °
