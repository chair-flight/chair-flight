              **Solution**

              The track made good is 258° - 3° = 255°. This is exactly the planned track, so there is no track error.

              ## Why the other answers are wrong

              - **3º Left**: the drift is taken as the track error, without the heading.
              - **3º Right**: the heading error is used and the drift is ignored.
              - **6º Right**: the drift is added to the heading instead of subtracted.
