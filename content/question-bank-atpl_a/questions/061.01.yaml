        - Distance from A to B: {{dist}} NM
        - Groundspeed: {{gs}} kt
        - Actual time of departure: {{dep_h}} h {{dep_min}} min

        Calculate the ETA at B (hh:mm).
      explanation: |-
        The flight time is the distance divided by the groundspeed. The result is in hours, so it is multiplied by 60 to get minutes before it is added to the departure time.

        **Solution**

        - Flight time: {{dist}} NM ÷ {{gs}} kt = {{macro1}} min
