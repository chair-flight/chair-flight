        - Groundspeed: {{gs}} kt

        What is the approximate rate of descent in ft/min? Use 1 NM = 6 000 ft.
      explanation: |-
        At 1 kt the aircraft covers 1 NM every hour, which is 100 ft of ground every minute when 1 NM = 6 000 ft. On a slope of 1 %, you lose 1 ft for every 100 ft of ground, so the rate of descent in feet per minute is the groundspeed multiplied by the slope in per cent.

