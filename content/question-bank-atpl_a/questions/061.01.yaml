  templates:
    - type: simple
      question: |-
        An aircraft overflies waypoint 1 and then waypoint 2. The distance between the two waypoints is measured on the chart.

        - Time from waypoint 1 to waypoint 2: {{time}} min
        - Measured distance on the chart: {{chart_cm}} cm
        - Chart scale: 1 cm represents {{scale}} NM

        What ground speed has been flown between the two waypoints?
      explanation: |-
        Ground speed is the distance flown divided by the time taken. The distance is measured on the chart and converted to nautical miles with the chart scale. The time is in minutes, so the result is multiplied by 60 to give knots.

        **Solution**

        - Distance = {{chart_cm}} cm x {{scale}} NM per cm = {{macro1}} NM
        - $$\frac{\text{Measured distance on chart}\times \text{Chart scale}}{\text{Time between waypoints}}\times 60 = \frac{ {{chart_cm}}\times {{scale}} }{ {{time}} }\times 60 = \mathbf{ {{answer}}\ \text{kt} }$$

        ## Why the other answers are wrong

        - **{{d1}} kt**: does not convert the minutes into hours.
        - **{{d2}} kt**: divides by the chart scale instead of multiplying by it.
        - **{{d3}} kt**: converts the distance into kilometres instead of keeping nautical miles.
