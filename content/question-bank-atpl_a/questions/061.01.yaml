        Calculate the Wind Correction Angle (WCA), given:

        - TAS: {{tas}} kt
        - Crosswind: {{xw}} kt from the right

        Give the WCA in degrees, with + for right and - for left.
      explanation: |-
        A crosswind pushes the aeroplane sideways, so the heading has to be turned into the wind to keep the track. The stronger the crosswind and the slower the aeroplane, the larger the correction.

        **Solution**

        Rule of thumb: the WCA in degrees is about 60 times the crosswind divided by the TAS.

        $$
        \frac{60\times \text{Crosswind}}{\text{TAS}} = \frac{60\times {{xw}} }{ {{tas}} } = \mathbf{ {{answer}}\ \text{°} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}°**: the sign is wrong, the correction for a crosswind from the right is to the right (positive).
        - **{{d2}}°**: uses 100 instead of 60 in the rule of thumb.
        - **{{d3}}°**: adds the crosswind to the TAS instead of dividing by the TAS.
        - **{{d4}}°**: inverts the ratio and divides the TAS by the crosswind.
