  templates:
    - type: simple
      question: |-
        A single-engine class B aeroplane has the following wind limitations:

        - Crosswind: {{xw}} kt
        - Headwind: {{hw}} kt
        - Tailwind: 10 kt

        Consider a take-off from a runway with a heading of {{rwy}}° with the wind from {{wdir}}°. Using trigonometry, determine the maximum wind speed which keeps the crosswind component below the crosswind limit.

        Give the answer in whole knots, rounded down.
      explanation: |-
        The crosswind component is the part of the wind that blows across the runway. It is the wind speed times the sine of the angle between the wind and the runway. To stay below the crosswind limit the wind speed must be low enough, so the answer is rounded down to whole knots.

        **Solution**

        Angle between wind and runway: {{macro1}}°

        Maximum wind: $$\frac{\text{Crosswind limit}}{\text{sin}(\text{Wind direction}-\text{Runway heading})} = \frac{ {{xw}} }{\text{sin}({{wdir}}-{{rwy}})}$$, rounded down to **{{answer}} kt**

        ## Why the other answers are wrong

        - **{{d1}} kt**: rounds to the nearest knot, which lets the crosswind component go above the limit.
        - **{{d2}} kt**: is the crosswind limit itself, without applying the trigonometry.
        - **{{d3}} kt**: uses the cosine instead of the sine, which gives the headwind component.
        - **{{d4}} kt**: uses the headwind limit instead of the crosswind limit.
