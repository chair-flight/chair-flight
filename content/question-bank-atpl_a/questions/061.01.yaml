      question: |-
        The following information is for an aircraft during the climb.

        - Climb time: {{climb}} min
        - Average wind: {{wd}}°(T)/{{ws}} kt
        - Average true track: {{trk}}°
        - Air distance covered during the climb: {{air}} NM

        What ground distance has been covered during the climb, to the nearest NM?
      explanation: |-
        During the climb the aircraft moves over the ground with the wind, so the ground distance differs from the air distance. The wind component along the track is applied for the time of the climb to correct the air distance. A headwind reduces the ground distance and a tailwind increases it.

        **Solution**

        - Wind component along the track = {{macro1}} kt
        - Effect on distance over {{climb}} min = {{macro2}} NM
        - Ground distance = $$\text{Air distance covered}-\frac{\text{Average wind speed}\times \text{cos}(\text{Average wind direction}-\text{Average true track})\times \text{Climb time}}{60} = {{air}}-\frac{ {{ws}}\times \text{cos}({{wd}}-{{trk}})\times {{climb}} }{60} = \mathbf{ {{answer}}\ \text{NM} }$$

