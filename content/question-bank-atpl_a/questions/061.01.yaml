  annexes: []
  learningObjectiveIds:
    - 061.01.07.01.01
  templates:
    - type: simple
      question: |-
        Refer to figure. At 10:07 you make a note of your position over the intersection of highways A3 and A92 (N48°49.0', E012°56.3'). Consider the DR positions DR-5 to DR-8 shown on the annex. Given the following information, determine your DR position at 10:19.

        - TAS: 120 kt
        - Wind: 075°/40 kt
        - True heading: 085°
      explanation: |-
        Dead reckoning moves the start position along the track made good, by the distance flown in the time elapsed. The track and ground speed come from the heading, the TAS and the wind.

        **Solution**

        - Time elapsed: 10:19 minus 10:07 = 12 minutes.
        - Work out the track and ground speed from the TAS, the heading and the wind.
        - Find the DR position that matches this distance and direction from the start point: **DR-7**.

        ## Why the other answers are wrong

        - **DR-8**: a position too far north and east, as if the flight time were longer.
        - **DR-5**: a position too far north, on a track that ignores the wind.
        - **DR-6**: a position on the right longitude, but too far south for the distance flown.
      presets:
        - correctAnswers:
            - text: DR-7 (N48°49.1', E013°21.0')
          wrongAnswers:
