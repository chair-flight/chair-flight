        - **{{d1}}**: the flight time in hours is added as if it were minutes.
        - **{{d2}}**: the flight time is subtracted instead of added.
        - **{{d3}}**: the decimal part of the hours is read as tenths of minutes, so 0.6 h becomes 6 min instead of 36 min.
        - **{{d4}}**: the flight time is halved.
