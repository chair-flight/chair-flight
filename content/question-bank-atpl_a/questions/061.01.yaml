- id: QTPCV
  subjectId: "061"
  chapterId: "061.01"
  relatedQuestionIds:
    - QTSTA
  externalQuestionIds:
    - ATPLQ-612802
    - BGS-611464
    - AVEXAM-85509
  annexes: []
  learningObjectiveIds:
    - 061.01.08.03.05
  templates:
    - type: simple
      question: |-
        Given the following information, calculate the rate of descent (ROD) for an aircraft that is approaching the destination.

        - Ground distance during the descent: {{dist}} NM
        - Average TAS: {{tas}} kt
        - Average tailwind component: {{tw}} kt
        - Descent: from {{start_alt}} ft to a pressure altitude of {{end_alt}} ft

        What is the rate of descent, in ft/min?
      explanation: |-
        The rate of descent is the height lost divided by the time taken to lose it. A tailwind adds to the TAS to give the groundspeed, which shortens the time over the ground. The groundspeed is therefore the TAS plus the tailwind component.

        **Solution**

        - Groundspeed: {{macro1}} kt
        - Time for the descent: {{macro2}} min
        - Height to lose: $${{start_alt}}-{{end_alt}}$$ ft
        - Rate of descent: $$\frac{\text{Start altitude}-\text{End altitude}}{\frac{\text{Ground distance}}{\text{TAS}+\text{Tailwind component}}\times 60} = \frac{ {{start_alt}}-{{end_alt}} }{\frac{ {{dist}} }{ {{tas}}+{{tw}} }\times 60} = \mathbf{ {{answer}}\ \text{ft/min} }$$

        ## Why the other answers are wrong

        - **{{d1}} ft/min**: the tailwind is ignored, so the groundspeed is too low and the descent takes too long.
        - **{{d2}} ft/min**: the tailwind is treated as a headwind, which lowers the groundspeed.
        - **{{d3}} ft/min**: the time is left in hours, so the result is a rate per hour and far too large.
        - **{{d4}} ft/min**: the start and end altitudes are added instead of subtracted.
      presets:
        - variables:
            dist: 25
            tas: 130
            tw: 30
            start_alt: 18000
            end_alt: 3000
            macro1: 160
            macro2: 9
            answer: 1600
            d1: 1300
            d2: 1000
            d3: 96000
            d4: 2240
          correctAnswers:
            - text: 1600 ft/min
          wrongAnswers:
            - text: 1300 ft/min
            - text: 96000 ft/min
            - text: 2240 ft/min
            - text: 1000 ft/min
        - variables:
            dist: 30
            tas: 140
            tw: 20
            start_alt: 15000
            end_alt: 4000
            macro1: 160
            macro2: 11
