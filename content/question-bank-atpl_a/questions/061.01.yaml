        Using mental dead reckoning, determine the headwind component for the following runway and wind:

        - Runway heading: {{rwy}}°
        - Surface wind (magnetic, from the tower): {{wdir}}° / {{wspd}} kt

        What is the headwind component?
      explanation: |-
        The headwind component is the part of the wind that blows straight along the runway. Mental dead reckoning rounds the wind angle to the nearest clock position (30° steps) and reads the share of the wind speed from the clock table: 1 o'clock is 9/10, 2 o'clock is 1/2 and 3 o'clock is nothing. A negative result means a tailwind.

