        Compressibility is a small correction that matters at higher speeds, when the air is squeezed as it enters the pitot tube. The factor given in the stem reduces the TAS calculated for the altitude and temperature.

        **Solution**

        $$
        \frac{\text{CAS}\times \sqrt{\frac{\text{OAT}+273.15}{288.15}}}{{(1-0.000007\times \text{Pressure altitude})}^{2.62794}}\times \text{Compressibility factor} = \frac{ {{cas}}\times \sqrt{\frac{ {{oat}}+273.15}{288.15}} }{{(1-0.000007\times {{pa}})}^{2.62794}}\times {{comp}} = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: forgets the compressibility factor.
        - **{{d2}} kt**: divides by the factor instead of multiplying.
        - **{{d3}} kt**: applies the altitude correction the wrong way round and leaves out the temperature.
        - **{{d4}} kt**: applies the factor to the CAS only and ignores altitude and temperature.
