  templates:
    - type: simple
      question: |-
        Two points lie on the same parallel of latitude, both west of Greenwich, given:

        - Latitude of both points: {{lat_d}}° {{lat_m}}' N
        - Point A: {{a_d}}° {{a_m}}' W
        - Point B: {{b_d}}° {{b_m}}' W

        What is the distance flown along the parallel from A to B? Give the answer in NM.
      explanation: |-
        Along a parallel of latitude, the distance is the difference in longitude, in minutes of arc, multiplied by the cosine of the latitude. Both points are west of Greenwich, so the two longitudes are subtracted from each other.

        **Solution**

        - Longitude difference: $$|\text{Longitude A degrees (W)}+\frac{\text{Longitude A minutes (W)}}{60}-\text{Longitude B degrees (W)}-\frac{\text{Longitude B minutes (W)}}{60}|\times 60 = |{{a_d}}+\frac{ {{a_m}} }{60}-{{b_d}}-\frac{ {{b_m}} }{60}|\times 60$$ minutes of arc
        - Distance: $$|\text{Longitude A degrees (W)}+\frac{\text{Longitude A minutes (W)}}{60}-\text{Longitude B degrees (W)}-\frac{\text{Longitude B minutes (W)}}{60}|\times 60\times \text{cos}(\text{Latitude degrees}+\frac{\text{Latitude minutes}}{60}) = |{{a_d}}+\frac{ {{a_m}} }{60}-{{b_d}}-\frac{ {{b_m}} }{60}|\times 60\times \text{cos}({{lat_d}}+\frac{ {{lat_m}} }{60})$$ NM, which is **{{answer}} NM**

        ## Why the other answers are wrong

        - **{{d1}}**: adds the two longitudes instead of subtracting them
        - **{{d2}}**: forgets the cosine of the latitude, so it measures as if along the equator
        - **{{d3}}**: uses the sine of the latitude instead of the cosine
        - **{{d4}}**: multiplies by 1.852, which converts the answer to kilometres, not nautical miles
