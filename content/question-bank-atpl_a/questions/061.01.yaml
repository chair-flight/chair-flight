        - Glide path angle: {{angle}}°
        - TAS: {{tas}} kt
        - Headwind component: {{hw}} kt
        - Altitude: {{alt}} ft
      explanation: |-
        For a glide path, the rate of descent in ft/min is about 5 times the groundspeed for a 3 degree slope, and it scales in proportion to the angle. A headwind reduces the groundspeed, so the groundspeed is the TAS minus the headwind component. The rate of descent is 5 × groundspeed × angle ÷ 3, rounded to the nearest 100 ft/min. The altitude is not needed.

