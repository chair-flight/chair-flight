      question: |-
        An aircraft departs a point {{lat}}°N, {{lon}}°W and flies:

        - {{dist}} NM south
        - then {{dist}} NM east
        - then {{dist}} NM north
        - then {{dist}} NM west

        What is the final longitude (degrees W)?
      explanation: |-
        Each north or south leg changes only the latitude, and each east or west leg changes only the longitude. One degree is 60 NM. A leg along a parallel covers fewer minutes of longitude the further it is from the equator, so the east and west legs are divided by the cosine of their latitude.

        **Solution**

        - The south leg moves the aircraft to {{macro1}}°N
        - The east leg, flown at that latitude, changes the longitude by {{macro2}}° east
        - The north leg brings the aircraft back to {{lat}}°N
        - The west leg, flown at {{lat}}°N, changes the longitude by {{macro3}}° west
        - Final longitude: {{lon}}°W - {{macro2}}° + {{macro3}}° = **{{answer}}°W**

        ## Why the other answers are wrong

        - **{{d1}}°**: east and west are confused, and the result is shown as a positive value.
        - **{{d2}}°**: the eastward change is added instead of subtracted.
        - **{{d3}}°**: the eastward leg is forgotten and the westward change is added.
        - **{{d4}}°**: the start longitude is ignored and the westward change is counted twice.
