        - **{{d1}} NM**: the QNH correction is not applied, so the airport elevation is used as the starting altitude.
        - **{{d2}} NM**: the headwind is added to the TAS instead of subtracted.
        - **{{d3}} NM**: the headwind is ignored and the TAS is used as ground speed.
        - **{{d4}} NM**: the QNH correction is applied with the wrong sign.
