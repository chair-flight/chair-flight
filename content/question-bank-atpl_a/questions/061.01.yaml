    - ATPLQ-611582
  annexes: []
  learningObjectiveIds:
    - 061.01.05.04.05
  templates:
    - type: simple
      question: |-
        An aircraft diverts to the alternate and is instructed by ATC to hold at minimum drag speed (VMD).

        - Fuel flow at VMD: {{ff}} kg/h
        - Final reserve fuel: {{frt}} min of flight at this fuel flow
        - Remaining usable fuel: {{fuel}} kg

        What is the remaining safe endurance, in minutes?
      explanation: |-
        The final reserve fuel must remain at the alternate, so only the fuel above it can be used for holding. The usable fuel above the reserve is divided by the fuel flow to give hours, which is converted to minutes.

        **Solution**

        Final reserve fuel: $$\frac{\text{Fuel flow at VMD}\times \text{Final reserve time}}{60} = \frac{ {{ff}}\times {{frt}} }{60}$$ kg

        Fuel available for holding: $$\text{Remaining usable fuel}-\frac{\text{Fuel flow at VMD}\times \text{Final reserve time}}{60} = {{fuel}}-\frac{ {{ff}}\times {{frt}} }{60}$$ kg

        Endurance: $$\frac{\text{Remaining usable fuel}-\frac{\text{Fuel flow at VMD}\times \text{Final reserve time}}{60}}{\text{Fuel flow at VMD}}\times 60 = \mathbf{ {{answer}}\ \text{minutes} }$$

        ## Why the other answers are wrong

        - **{{d1}} minutes**: includes the final reserve fuel in the endurance.
        - **{{d2}} minutes**: gives only the final reserve time.
        - **{{d3}} minutes**: gives the result in hours and does not convert to minutes.
        - **{{d4}} minutes**: halves the result by using 30 instead of 60.
      presets:
        - variables:
            ff: 1290
            frt: 30
            fuel: 1640
            answer: 46
            d1: 76
            d2: 30
            d3: 1
            d4: 23
