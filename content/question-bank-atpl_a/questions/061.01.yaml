        - **{{d1}} kt**: the headwind is added instead of subtracted.
        - **{{d2}} kt**: the full wind speed is taken as headwind, ignoring the wind angle.
        - **{{d3}} kt**: the crosswind is subtracted like a headwind instead of being combined at a right angle.
        - **{{d4}} kt**: the wind is ignored and the TAS is used as the groundspeed.
