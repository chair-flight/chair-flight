  templates:
    - type: simple
      question: |-
        Calculate the Mach number, given the following:

        - Calibrated airspeed: {{cas}} kt
        - Pressure altitude: {{alt}} ft

        What is the Mach number?
      explanation: |-
        At speeds below Mach 1 the air is compressed as it enters the pitot tube, so the calibrated airspeed is not the same as the true airspeed. The Mach number follows from the impact pressure (the difference between total and static pressure) and the static pressure at the altitude. Air temperature and the compressibility factor are not needed.

        **Solution**

        Static pressure at {{alt}} ft = {{macro1}} hPa

        Impact pressure from {{cas}} kt CAS = {{macro2}} hPa

        $$
        \sqrt{5\times ({(\frac{{(1+0.2\times {\frac{\text{Calibrated airspeed}}{661.47}}^{2})}^{3.5}-1}{{(1-0.000007\times \text{Pressure altitude})}^{5.2559}}+1)}^{\frac{2}{7}}-1)} = \mathbf{ {{answer}} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}**: the altitude correction is missing and the power 2/7 is not applied.
        - **{{d2}}**: the speed of sound at the altitude is used as a simple ratio, without the compressibility correction.
        - **{{d3}}**: the sea-level static pressure is used instead of the pressure at the altitude.
        - **{{d4}}**: the Mach number is squared.
