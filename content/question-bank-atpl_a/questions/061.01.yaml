        - Measured distance on the chart between the two waypoints: {{chart_cm}} cm
        - Chart scale: 1 cm = {{nm_per_cm}} NM on the Earth

        What ground speed has been flown between the two waypoints in kt?
      explanation: |-
        Ground speed is the distance flown over the ground divided by the time taken. The distance comes from the chart measurement and the scale, and the time is converted from minutes into hours.

        **Solution**

        - Distance flown: {{macro1}} NM
