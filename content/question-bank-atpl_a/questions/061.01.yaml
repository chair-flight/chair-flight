        - Relative bearing: {{rel}}° left
        - Magnetic heading: {{hdg}}°M
        - Variation: {{var}}°W

        What is the true bearing from the aircraft to the island?
      explanation: |-
        A bearing to the left of the nose is subtracted from the heading to get the magnetic bearing of the island. Magnetic is converted to true with the variation; for west variation the value is subtracted.

        **Solution**

        Magnetic bearing = heading - relative bearing = $$\text{magnetic heading}-\text{relative bearing (left)} = {{hdg}}-{{rel}}$$°M

