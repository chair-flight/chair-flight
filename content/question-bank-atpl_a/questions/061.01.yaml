        - TAS: {{tas}} kt
        - Headwind component: {{hw}} kt
        - Rate of climb: {{roc}} ft/min

        What ground distance is covered during the climb, in NM?
      explanation: |-
        The time to climb is the altitude gained divided by the rate of climb. The ground distance is that time multiplied by the groundspeed, which is the TAS reduced by the headwind component. Where the start is given on the QNH, the pressure altitude of the start is the elevation plus 30 ft for every hPa below 1013 hPa.

