  templates:
    - type: simple
      question: |-
        While proceeding en route, the aircraft reaches the half-way point between two waypoints. Given the following information:

        - Distance between the two waypoints: {{total}} NM
        - Position at the half-way point: {{xtk}} NM left of the desired track

        Using the “1 in 60” rule, and to reach the active waypoint, by how many degrees should the heading be changed?
      explanation: |-
        At the half-way point the distance still to go is half the leg. The 1 in 60 rule gives the heading change needed for each mile off track. The heading must be changed back by the same amount again, so the total change is twice the 1 in 60 correction.

        **Solution**

        - Distance still to go: $$\frac{ {{total}} }{2}$$ NM
        - Correction for the offset (1 in 60): $$\frac{ {{xtk}}\times 60}{\frac{ {{total}} }{2}}$$°
        - Heading change to reach the waypoint: $$\frac{2\times \text{Cross-track error at the half-way point}\times 60}{\frac{\text{Distance between the two waypoints}}{2}} = \frac{2\times {{xtk}}\times 60}{\frac{ {{total}} }{2}} = \mathbf{ {{answer}}\ \text{° to the right} }$$

        ## Why the other answers are wrong

        - **{{d1}}° to the right**: uses one 1 in 60 correction only, without doubling it.
        - **{{d2}}° to the right**: uses a quarter of the leg as the distance to go.
        - **{{d3}}° to the right**: converts the answer from nautical miles into kilometres, a unit mistake.
        - **{{d4}}° to the right**: uses 1 in 6 instead of 1 in 60.
      presets:
