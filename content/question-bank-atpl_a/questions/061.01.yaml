  templates:
    - type: simple
      question: |-
        An aircraft departs from an airport and must pass a waypoint at a set altitude:

        - Airport elevation: {{elev}} ft (QNH 1013 hPa)
        - Distance to the waypoint: {{dist}} NM
        - Altitude to pass the waypoint: {{alt}} ft
        - Groundspeed: {{gs}} kt

        What is the minimum rate of climb required, in ft/min?
      explanation: |-
        With the QNH set to 1013 hPa, the altimeter reads the height above sea level at the airport, so the airport elevation is the starting altitude. The height to gain is divided by the time needed to reach the waypoint, which is the distance divided by the groundspeed. The result is rounded to the nearest 10 ft/min.

        **Solution**

        - Height to gain: {{alt}} ft - {{elev}} ft = {{macro1}} ft
        - Time to the waypoint: {{dist}} NM ÷ {{gs}} kt = {{macro2}} min
        - $$\text{round}(\frac{\frac{(\text{Altitude to pass the waypoint}-\text{Airport elevation})\times \text{Groundspeed}}{60\times \text{Distance to the waypoint}}}{10})\times 10 = \text{round}(\frac{\frac{({{alt}}-{{elev}})\times {{gs}} }{60\times {{dist}} }}{10})\times 10 = \mathbf{ {{answer}}\ \text{ft/min} }$$

        ## Why the other answers are wrong

        - **{{d1}} ft/min**: the time was not converted from hours to minutes, so the rate is 60 times too large.
        - **{{d2}} ft/min**: the ratio is inverted, dividing the distance by the groundspeed instead.
        - **{{d3}} ft/min**: the airport elevation was ignored, so the climb was measured from sea level.
        - **{{d4}} ft/min**: the groundspeed was converted to km/h and mixed with a distance in NM.
