    - type: simple
      question: |-
        The island is observed in the following position.

        - Relative bearing: {{rb}}° right
        - Magnetic heading: {{mh}}°M
        - Variation: {{var_e}}°E

        What is the true bearing of the aircraft from the island?
      explanation: |-
        The true heading is the magnetic heading corrected by the variation (east is added). Adding the relative bearing to the right gives the true bearing of the island from the aircraft. The bearing of the aircraft from the island is the reciprocal, so 180° is added. Results above 360° are reduced by 360°.

        **Solution**

        True heading = {{mh}}° + {{var_e}}° = {{macro1}}°

        Bearing of the island from the aircraft = {{macro1}}° + {{rb}}° = {{macro2}}°

        Bearing of the aircraft from the island = {{macro2}}° + 180° = {{macro3}}°, minus 360° = **{{answer}}°(T)**

        ## Why the other answers are wrong

        - **{{d1}}°**: applies the variation with the wrong sign (subtracts the east variation).
        - **{{d2}}°**: subtracts the relative bearing, as if the island were to the left.
        - **{{d3}}°**: ignores the variation.
