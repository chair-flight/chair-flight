        Ground speed = TAS - headwind = {{macro1}} kt

        Pressure altitude of the airport = {{macro2}} ft

        Time to top of climb = ({{macro3}} - {{macro2}}) / {{roc}} = {{macro4}} min

        Distance = {{macro1}} x {{macro4}} / 60 = **{{answer}} NM**

