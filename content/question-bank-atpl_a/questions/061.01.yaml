  templates:
    - type: simple
      question: |-
        During an approach the following data are obtained:

        - DME {{dme_1}} NM, altitude {{alt_1}} ft
        - DME {{dme_2}} NM, altitude {{alt_2}} ft
        - TAS: {{tas}} kt
        - Groundspeed: {{gs}} kt

        What is the rate of descent, in ft/min? Round the answer to the nearest 10 ft/min.
      explanation: |-
        The rate of descent is the height lost divided by the time taken. The two DME readings give the distance flown between the two points. Dividing that distance by the groundspeed gives the time in hours, which is then converted to minutes. The TAS is not needed, because the time is taken over the ground.

        **Solution**

        - Height lost: $${{alt_1}}-{{alt_2}}$$ ft
        - Distance flown: $${{dme_1}}-{{dme_2}}$$ NM
        - Time taken: {{macro3}} min
        - Rate of descent: $$\frac{\text{First altitude}-\text{Second altitude}}{\frac{\text{First DME distance}-\text{Second DME distance}}{\text{Groundspeed}}\times 60} = \frac{ {{alt_1}}-{{alt_2}} }{\frac{ {{dme_1}}-{{dme_2}} }{ {{gs}} }\times 60}$$ ft/min, which rounds to **{{answer}} ft/min**

        ## Why the other answers are wrong

        - **{{d1}} ft/min**: the TAS is used instead of the groundspeed to work out the time.
        - **{{d2}} ft/min**: the height is divided by the distance only, so no time is considered.
        - **{{d3}} ft/min**: the time is left in hours, so the result is a rate per hour and about 60 times too large.
        - **{{d4}} ft/min**: the two altitudes are added instead of subtracted.
      presets:
