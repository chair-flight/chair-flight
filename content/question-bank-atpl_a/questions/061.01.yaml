      question: |-
        Determine the difference in latitude between two positions, given:

        - Position A: {{lat1_d}}°{{lat1_m}}'{{lat1_s}}'' N
        - Position B: {{lat2_d}}°{{lat2_m}}'{{lat2_s}}'' N

        Give the answer in degrees, minutes and seconds.
      explanation: |-
        Latitudes are given in degrees, minutes and seconds. The difference is found by converting both latitudes to seconds, subtracting, and converting the result back to degrees, minutes and seconds. This avoids errors when the minutes or seconds of the second position are larger than those of the first.

        **Solution**

        Difference in seconds = $${{lat1_d}}\times 3600+{{lat1_m}}\times 60+{{lat1_s}}-({{lat2_d}}\times 3600+{{lat2_m}}\times 60+{{lat2_s}})$$

        Converted back to degrees, minutes and seconds: **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}}**: the difference in degrees is converted to minutes instead of degrees.
        - **{{d2}}**: the difference is divided by 100, as if the minutes and seconds were decimals.
        - **{{d3}}**: the latitudes are added instead of subtracted.
        - **{{d4}}**: one degree too many is borrowed, although no borrowing is needed here.
