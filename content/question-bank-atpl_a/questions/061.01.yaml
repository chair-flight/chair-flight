        - Time flown from A when overflying C: {{elapsed}} min

        What ground speed must be flown from C to reach B at the planned arrival time?
      explanation: |-
        The distance still to fly is the total distance minus the distance already flown to C. The time still available is the planned flight time minus the time already flown. The speed needed is the distance left divided by the time left, converted to knots.

