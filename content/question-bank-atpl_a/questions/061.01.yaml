        The rate of descent is the height to be lost divided by the time available. The time comes from the distance to the VOR and the ground speed, converted from hours into minutes. The answer is rounded to the nearest 50 ft/min, as the options are.

        **Solution**

        - Height to lose: $${{h0}}-{{h1}}$$ ft
