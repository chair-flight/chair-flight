        - Angle between wind and runway = {{macro1}}°
        - $$\frac{\text{maximum allowable crosswind}}{\text{sin}(|\text{wind direction}-\text{runway centreline direction}|)} = \frac{ {{xw}} }{\text{sin}(|{{wdir}}-{{rwy}}|)} = \mathbf{ {{answer}}\ \text{kt} }$$

        ## Why the other answers are wrong

        - **{{d1}} kt**: the cosine was used instead of the sine.
        - **{{d2}} kt**: the crosswind limit was multiplied by the cosine instead of divided by the sine.
        - **{{d3}} kt**: the tangent was used instead of the sine.
        - **{{d4}} kt**: the crosswind limit was multiplied by the sine instead of divided by it.
