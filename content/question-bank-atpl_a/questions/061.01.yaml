      question: |-
        An aircraft flies over a small lake located some degrees to the left of the planned track. Using the 1 in 60 rule, determine the drift angle.

        - TAS: {{tas}} kt
        - Tailwind component: {{tw}} kt
        - Flight time from the previous waypoint: {{t}} min
        - Off-track distance between the lake and the track: {{xt}} NM

        What is the drift angle, rounded to the nearest whole degree?
      explanation: |-
        The 1 in 60 rule relates the off-track distance to the distance flown. The ground speed is the TAS plus the tailwind, so the distance flown is the ground speed times the flight time.

        **Solution**

        Ground speed: $$\text{TAS}+\text{Tailwind component} = {{tas}}+{{tw}}$$ kt

        Distance flown: {{macro3}} NM

        Drift: $$\frac{60\times \text{Off-track distance}}{\frac{(\text{TAS}+\text{Tailwind component})\times \text{Flight time}}{60}} = \frac{60\times {{xt}} }{\frac{({{tas}}+{{tw}})\times {{t}} }{60}} = \mathbf{ {{answer}}\ \text{°} }$$

        ## Why the other answers are wrong

        - **{{d1}}°**: forgets the tailwind in the ground speed.
        - **{{d2}}°**: subtracts the tailwind instead of adding it.
        - **{{d3}}°**: divides by the flight time instead of the distance flown.
        - **{{d4}}°**: divides by the TAS and forgets the time.
