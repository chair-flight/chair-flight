      question: |-
        An aeroplane with a two wheel nose gear and four main wheels rests on the ground with a single nose wheel load of {{nose_load}} kg and a single main wheel load of {{main_load}} kg.

        The distance between the nose wheels and the main wheels is {{dist}} m.

        How far is the centre of gravity in front of the main wheels?

        Give the answer in cm.
      explanation: |-
        The nose gear carries two wheels and the main gear four, so the total nose load and main load must be built from the single wheel loads first. Moments about the main wheels then give the CG distance in front of them.

        **Solution**

        Nose load = {{macro1}} kg, main load = {{macro2}} kg

