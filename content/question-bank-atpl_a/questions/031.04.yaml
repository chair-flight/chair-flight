      question: |-
        Refer to the figure. On the common datum scale, the forward CG limit is X = {{x}} in and the aft CG limit is Z = {{z}} in.

        What is the length of the MAC of this aeroplane?
      explanation: |-
        The MAC is the distance between the forward and aft limits measured from the same datum.

        **Solution**

        $$
        \text{Z: aft CG limit from datum}-\text{X: forward CG limit from datum} = \mathbf{ {{answer}}\ \text{in} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} in**: adds the two arms instead of finding their separation.
        - **{{d2}} in**: gives only the forward limit arm.
        - **{{d3}} in**: gives only the aft limit arm.
        - **{{d4}} in**: halves the MAC without justification.
