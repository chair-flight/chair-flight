- id: QSISV
  subjectId: "031"
  chapterId: "031.04"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-311615
    - AVEXAM-15283
  annexes: []
  learningObjectiveIds:
    - 031.04.01.07.02
  templates:
    - type: simple
      question: |-
        According to the AFM, the centre tank fuel has to be consumed prior to the wing tanks fuel. According to the pre-flight fuel planning, the remaining fuel upon landing will be {{lf}} kg. Given the following information below, calculate your CG position upon landing:

        - Zero Fuel Mass: {{zfm}} kg
        - CG position at TOM: {{cgt}} m
        - Fuel in centre tank at take-off: {{fc}} kg
        - Centre fuel tank station: {{xc}} m
        - Fuel in wing tanks at take-off: {{fw}} kg
        - Wing fuel tank station: {{xw}} m
      explanation: |-
        The CG is the total moment divided by the total mass. The take-off mass is ZFM + fuel; its moment is TOM x CG at TOM. The centre tank is emptied first, then the wing tanks are burned down to the landing fuel; subtract the moments of the fuel burned and divide by the landing mass (ZFM + landing fuel).

        **Solution**

        Take-off mass: {{macro1}} kg, moment: {{macro2}} kg m
        Centre tank burned: {{fc}} kg, moment {{macro3}} kg m
        Wing tanks burned: {{macro4}} kg, moment {{macro5}} kg m
        Landing mass: {{macro6}} kg

        $$
        \frac{(\text{ZFM}+\text{Centre tank fuel}+\text{Wing tanks fuel})\times \text{CG at TOM}-\text{Centre tank fuel}\times \text{Centre tank station}-(\text{Wing tanks fuel}-\text{Landing fuel})\times \text{Wing tank station}}{\text{ZFM}+\text{Landing fuel}} = \mathbf{ {{answer}}\ \text{m} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} m**: the wing tank fuel was burned before the centre tank, contrary to the AFM.
        - **{{d2}} m**: the landing moment was divided by the ZFM instead of the landing mass (landing fuel left out of the mass).
        - **{{d3}} m**: all the fuel was removed from the moment, including the landing fuel that stays on board.
      presets:
