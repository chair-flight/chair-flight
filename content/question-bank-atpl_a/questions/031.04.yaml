- id: QONSD
  subjectId: "031"
  chapterId: "031.04"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-314329
  annexes: []
  learningObjectiveIds:
    - 031.04.02.02.01
  templates:
    - type: simple
      question: |-
        An aircraft with one nose landing gear and two main landing gears is weighed on jacks. Determine the CG position of the aircraft, in inches from the datum, using the following readouts:

        - Nose landing gear, located at {{na}} inches from datum, reading: {{nw}} kg
        - Each main landing gear, located at {{ma}} inches from datum, reading: {{mw}} kg
      explanation: |-
        The mass is the sum of all gear readings and the CG is the total moment about the datum divided by the total mass.

        **Solution**

        Mass = {{nw}} + 2 * {{mw}} = {{macro1}} kg

        $$
        \frac{\text{Nose gear reading}\times \text{Nose gear arm}+2\times \text{Reading of each main gear}\times \text{Main gear arm}}{\text{Nose gear reading}+2\times \text{Reading of each main gear}} = \frac{ {{nw}}\times {{na}}+2\times {{mw}}\times {{ma}} }{ {{nw}}+2\times {{mw}} } = \mathbf{ {{answer}}\ \text{in} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} in**: counts only one main gear.
        - **{{d2}} in**: adds the two arms instead of weighting them by the loads.
        - **{{d3}} in**: takes the plain average of the two arms.
        - **{{d4}} in**: divides the total moment by the main gear loads only.
      presets:
        - variables:
            na: 161
            nw: 6448
            ma: 795
            mw: 13738
