  annexes: []
  learningObjectiveIds:
    - 031.04.01.03.03
  templates:
    - type: simple
      question: |-
        The CG position of an aeroplane is {{cg}} inches aft of the datum. Given the following characteristics of the wing, calculate the CG position as % MAC.

        - Leading edge of the wing root: {{rle}} inches aft of the datum
        - Leading edge of the MAC: {{le}} inches aft of the datum
        - Leading edge of the wing tip: {{tle}} inches aft of the datum
        - Length of the wing root chord: {{rc}} inches
        - Length of the MAC: {{mac}} inches
        - Length of the wing tip chord: {{tc}} inches
      explanation: |-
        Only the MAC leading edge and the MAC length are relevant: the CG in % MAC is the CG's distance behind the MAC leading edge divided by the MAC length. The wing root and tip data are distractors.

        **Solution**

        $$
        \frac{\text{CG position}-\text{MAC leading edge}}{\text{MAC length}}\times 100 = \frac{ {{cg}}-{{le}} }{ {{mac}} }\times 100 = \mathbf{ {{answer}}\ \text{% MAC} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} % MAC**: uses the wing root chord and its leading edge instead of the MAC.
        - **{{d2}} % MAC**: uses the MAC leading edge but divides by the wing root chord.
        - **{{d3}} % MAC**: uses the wing tip chord and an arbitrary offset.
        - **{{d4}} % MAC**: uses the wing root leading edge with the MAC length.
      presets:
