  templates:
    - type: simple
      question: The CG position of an aeroplane is {{cg}} m aft of the datum. The MAC leading edge (LEMAC) is {{le}} m aft of the datum and the MAC length is {{mac}} m. What is the CG position in % MAC?
      explanation: |-
        The CG in % MAC is the distance of the CG behind the MAC leading edge divided by the MAC length. Other wing dimensions (root or tip chords) do not matter.

        **Solution**

        $$
        \frac{\text{CG position}-\text{LEMAC}}{\text{MAC length}}\times 100 = \frac{ {{cg}}-{{le}} }{ {{mac}} }\times 100 = \mathbf{ {{answer}}\ \text{% MAC} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} % MAC**: subtracts the leading edge after scaling, so the two terms are inconsistent.
        - **{{d2}} % MAC**: divides by the CG position instead of the MAC length.
        - **{{d3}} % MAC**: measures from the trailing edge instead of the leading edge.
        - **{{d4}} % MAC**: wrong power of ten in the percentage.
        - **{{d5}} % MAC**: forgets to subtract the leading edge and to convert to a percentage.
      presets:
