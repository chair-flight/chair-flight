        - **{{d1}} % MAC**: divides by the trailing edge station instead of the MAC length.
        - **{{d2}} % MAC**: measures from the trailing edge.
        - **{{d3}} % MAC**: divides the CG station by the trailing edge station.
        - **{{d4}} % MAC**: divides by the leading edge station instead of the MAC length.
