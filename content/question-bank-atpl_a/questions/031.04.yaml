    - BGS-310242
  annexes: []
  learningObjectiveIds:
    - 031.04.01.02.03
    - 031.04.01.03.03
  templates:
    - type: simple
      question: "If the CG is located at 670 inches, what would be its position as a percentage of the MAC, given the following characteristics of an aircraft? Leading Edge MAC: 627.1 inches Length of MAC: 155.8 inches"
      explanation: The centre of gravity is 670 − 627.1 = 42.9 inches behind the leading edge of the chord. As a share of the 155.8 inch chord that is 42.9 ÷ 155.8 = **27.6 %** MAC.
      presets:
        - correctAnswers:
            - text: 27.6%
          wrongAnswers:
            - text: 23.2%
            - text: 82%
            - text: 93.6%
    - type: simple
      question: At a given mass the CG position is at {{pct}}% MAC. If the leading edge of MAC is at a position {{lemac}} inches aft of the datum and the MAC is given as {{mac}} inches, determine the position of the CG in relation to the datum.
      explanation: |-
        The CG expressed as a percentage of MAC is measured from the leading edge of the MAC. Its distance from the datum is the distance of the leading edge plus that percentage of the MAC length.

        **Solution**

        $$
        \text{LEMAC}+\frac{\text{CG position}}{100}\times \text{MAC length} = {{lemac}}+\frac{ {{pct}} }{100}\times {{mac}} = \mathbf{ {{answer}}\ \text{inches aft of the datum} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} inches**: this is only the distance of the CG behind the leading edge of the MAC; LEMAC was not added.
        - **{{d2}} inches**: the roles of LEMAC and MAC length were swapped.
        - **{{d3}} inches**: the distance behind the leading edge was subtracted instead of added.
      presets:
        - variables:
            pct: 15
            lemac: 625.6
            mac: 134.5
            answer: 645.77
            d1: 20.18
            d2: 228.34
            d3: 605.43
          correctAnswers:
            - text: 645.77 inches aft of the datum
          wrongAnswers:
            - text: 605.43 inches aft of the datum
            - text: 20.18 inches aft of the datum
            - text: 228.34 inches aft of the datum
        - variables:
            pct: 25
            lemac: 640.2
            mac: 120.4
            answer: 670.3
            d1: 30.1
            d2: 280.45
            d3: 610.1
          correctAnswers:
            - text: 670.3 inches aft of the datum
          wrongAnswers:
            - text: 610.1 inches aft of the datum
            - text: 30.1 inches aft of the datum
            - text: 280.45 inches aft of the datum
        - variables:
            pct: 32
            lemac: 610.8
            mac: 142.6
            answer: 656.43
            d1: 45.63
            d2: 338.06
            d3: 565.17
          correctAnswers:
            - text: 656.43 inches aft of the datum
          wrongAnswers:
            - text: 565.17 inches aft of the datum
            - text: 45.63 inches aft of the datum
            - text: 338.06 inches aft of the datum
