  templates:
    - type: simple
      question: |-
        Determine the length of the MAC in cm, given:

        - Leading edge at wing root: STA {{rle}}
        - Trailing edge at wing root: STA {{rte}}
        - Leading edge at wing tip: STA {{tle}}
        - Trailing edge at wing tip: STA {{tte}}
        - Leading edge of MAC: STA {{mle}}
        - Trailing edge of MAC: STA {{mte}}

        Note: body stations are distances from the aircraft nose in 10^-1 m (1 STA unit = 10 cm).
      explanation: |-
        The MAC length is the distance between the MAC leading and trailing edge stations. Station numbers are in units of 0.1 m, so each unit is 10 cm.

        **Solution**

        $$
        (\text{MAC trailing edge}-\text{MAC leading edge})\times 10 = ({{mte}}-{{mle}})\times 10 = \mathbf{ {{answer}}\ \text{cm} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} cm**: Wrong factor of 100 (treats a station unit as 1 m).
        - **{{d2}} cm**: Leaves the length in station units without converting to cm.
        - **{{d3}} cm**: Is the root chord, not the MAC.
        - **{{d4}} cm**: Is the tip chord, not the MAC.
        - **{{d5}} cm**: Is the mean of root and tip chord, which is not the MAC.
      presets:
