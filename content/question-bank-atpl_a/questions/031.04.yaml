        - **{{d1}} cm**: only one nose wheel and one main wheel are counted.
        - **{{d2}} cm**: the nose gear has two wheels, but only one nose wheel load is used in the moment.
        - **{{d3}} cm**: the nose gear load is left out of the total mass.
        - **{{d4}} cm**: this is the CG distance behind the nose wheels, not in front of the main wheels.
