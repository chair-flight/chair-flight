- id: QYPYV
  subjectId: "031"
  chapterId: "031.04"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-311100
  annexes: []
  learningObjectiveIds:
    - 031.04.01.03.03
  templates:
    - type: simple
      question: |-
        The mean aerodynamic chord published in the flight manual of an aeroplane starts at {{le}} mm and ends at {{te}} mm from the datum line.

        The centre of gravity of a loaded aeroplane is at {{pct}}% MAC.

        Determine the associated distance of the CG position to the datum (in mm).
      explanation: |-
        The CG position as a percentage of MAC is measured from the leading edge of the MAC. The distance to the datum is the leading edge distance plus that fraction of the MAC length.

        **Solution**

        MAC length = {{macro1}} mm

        $$
        \text{MAC leading edge distance}+\frac{\text{CG position}}{100}\times (\text{MAC trailing edge distance}-\text{MAC leading edge distance}) = {{le}}+\frac{ {{pct}} }{100}\times ({{te}}-{{le}}) = \mathbf{ {{answer}}\ \text{mm} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} mm**: the percentage is applied to the trailing edge distance instead of the MAC length.
        - **{{d2}} mm**: the percentage is applied to the trailing edge distance before adding the leading edge distance.
        - **{{d3}} mm**: the CG distance is measured from the trailing edge instead of the leading edge.
        - **{{d4}} mm**: the leading edge distance is not added.
        - **{{d5}} mm**: the percentage is applied to the sum of the leading and trailing edge distances.
      presets:
        - variables:
            le: 520
            te: 1700
            pct: 30
            macro1: 1180
            answer: 874
