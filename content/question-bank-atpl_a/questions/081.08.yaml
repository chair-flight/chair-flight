  templates:
    - type: simple
      question: What is the heading change of an aeroplane after {{t}} seconds in a steady, co-ordinated, horizontal rate-one turn? Give the answer in degrees.
      explanation: |-
        A rate-one turn changes the heading by 3° every second. The heading change is therefore three times the time in seconds.

        **Solution**

        - Rate one = 3° per second
        - $$3\times \text{Time in the turn} = 3\times {{t}} = \mathbf{ {{answer}}\ \text{°} }$$

        ## Why the other answers are wrong

        - **{{d1}}°**: uses the time in seconds as the heading change in degrees.
        - **{{d2}}°**: divides by 3 instead of multiplying.
        - **{{d3}}°**: uses 6° per second, twice the rate-one turn rate.
        - **{{d4}}°**: uses 2° per second instead of the rate-one turn rate.
      presets:
        - variables:
