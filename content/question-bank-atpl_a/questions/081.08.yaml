- id: QDFHG
  subjectId: "081"
  chapterId: "081.08"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-812110
    - AVEXAM-1588
  annexes: []
  learningObjectiveIds:
    - 081.08.01.02.04
  templates:
    - type: simple
      question: |-
        Determine the thrust in a steady climb, given:

        - Climb angle: {{angle}}°
        - Drag: {{drag}} N
        - Weight: {{weight}} N

        What is the thrust required?
      explanation: |-
        In a steady climb the thrust must overcome the drag and also the part of the weight that acts back along the flight path. That part is the weight multiplied by the sine of the climb angle, so the thrust is the drag plus the weight times the sine of the angle.

        **Solution**

        $$
        \text{Drag}+\text{Weight}\times \text{sin}(\text{Climb angle}) = {{drag}}+{{weight}}\times \text{sin}({{angle}}) = \mathbf{ {{answer}}\ \text{N} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} N**: only the drag, leaving out the weight component.
        - **{{d2}} N**: only the weight component, leaving out the drag.
        - **{{d3}} N**: adds the full weight instead of its component along the flight path.
        - **{{d4}} N**: uses the cosine, which gives the component perpendicular to the flight path.
      presets:
        - variables:
            angle: 9
            drag: 300000
            weight: 5750000
            answer: 1199498
            d1: 300000
            d2: 899498
            d3: 6050000
            d4: 5979208
          correctAnswers:
            - text: 1199498 N
          wrongAnswers:
            - text: 300000 N
            - text: 6050000 N
            - text: 5979208 N
            - text: 899498 N
        - variables:
            angle: 6
            drag: 250000
            weight: 4000000
            answer: 668114
            d1: 250000
            d2: 418114
            d3: 4250000
            d4: 4228088
          correctAnswers:
            - text: 668114 N
          wrongAnswers:
            - text: 250000 N
            - text: 4250000 N
            - text: 4228088 N
            - text: 418114 N
        - variables:
            angle: 12
            drag: 400000
            weight: 8000000
            answer: 2063294
            d1: 400000
            d2: 1663294
            d3: 8400000
            d4: 8225181
          correctAnswers:
            - text: 2063294 N
          wrongAnswers:
            - text: 400000 N
            - text: 8400000 N
