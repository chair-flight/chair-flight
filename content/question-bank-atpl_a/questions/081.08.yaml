  templates:
    - type: simple
      question: |-
        Consider an aeroplane in a steady climb. Given the following data, and assuming g = 10 m/s², calculate the climb angle in degrees:

        - Thrust: {{thrust}} N
        - Mass: {{mass}} kg
        - Drag: {{drag}} N

        Give the answer to one decimal place.
      explanation: |-
        In a steady climb the thrust must be greater than drag, and the surplus pulls the aeroplane up the flight path against the part of its weight that acts along the path. The weight is the mass times g, and that part of the weight is the weight times the sine of the climb angle.

        **Solution**

        - Weight: {{macro1}} N
        - Thrust minus drag: {{macro2}} N
        - Climb angle: $$\text{asin}(\frac{\text{Thrust}-\text{Drag}}{\text{Mass}\times 10}) = \text{asin}(\frac{ {{thrust}}-50000}{ {{mass}}\times 10}) = \mathbf{ {{answer}}\ \text{°} }$$

        ## Why the other answers are wrong

        - **{{d1}}°**: ignores drag, so the full thrust is used.
        - **{{d2}}°**: uses drag alone as the force along the flight path instead of thrust minus drag.
        - **{{d3}}°**: uses the tangent instead of the sine of the angle.
        - **{{d4}}°**: divides by thrust instead of weight.
      presets:
        - variables:
            thrust: 200000
            mass: 50000
            drag: 50000
            macro1: 500000
            macro2: 150000
            answer: 17.5
            d1: 23.6
            d2: 5.7
            d3: 16.7
            d4: 48.6
          correctAnswers:
            - text: 17.5 °
          wrongAnswers:
            - text: 23.6 °
            - text: 16.7 °
            - text: 48.6 °
            - text: 5.7 °
        - variables:
