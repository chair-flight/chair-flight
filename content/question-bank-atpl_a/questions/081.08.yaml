      question: |-
        Calculate the still-air gliding distance for a single-engined aeroplane. Assume 1 NM = 6 080 ft.

        - L/D ratio: {{ld}} : 1
        - Altitude: {{alt}} ft

        Give the answer in NM.
      explanation: |-
        The gliding distance depends on how far the aircraft moves forward for each unit of height it loses. With an L/D ratio of {{ld}} : 1, the still-air distance in feet is the height multiplied by the L/D ratio. Dividing by 6 080 ft per NM gives the distance in nautical miles.

        **Solution**

        The distance in feet is {{macro1}} ft.

        $$
        \frac{\text{Altitude}\times \text{L/D ratio}}{6080} = \frac{ {{alt}}\times {{ld}} }{6080} = \mathbf{ {{answer}}\ \text{NM} }
        $$

