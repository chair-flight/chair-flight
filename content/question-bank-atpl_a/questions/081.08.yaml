  learningObjectiveIds:
    - 081.08.01.02.06
  templates:
    - type: simple
      question: "When an aeroplane performs a straight steady climb with a {{gradient}}% climb gradient, the load factor is equal to:"
      explanation: |-
        In a steady climb the lift is smaller than the weight, because part of the weight acts back along the flight path. The load factor is the lift divided by the weight, which equals the cosine of the climb angle. A climb gradient is the tangent of that angle, so the angle is the arctangent of the gradient.

        **Solution**

        $$
        \text{cos}(\text{atan}(\frac{\text{Climb gradient}}{100})) = \text{cos}(\text{atan}(\frac{ {{gradient}} }{100})) = \mathbf{ {{answer}} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}**: divides by the cosine instead of multiplying, which gives a value above 1.
        - **{{d2}}**: ignores the climb completely, as in level flight.
        - **{{d3}}**: subtracts the gradient from 1, which is not a relationship of the climb angle.
        - **{{d4}}**: uses the sine of the climb angle instead of the cosine.
      presets:
        - variables:
            gradient: 20
            answer: 0.98
            d1: 1.02
            d2: 1
            d3: 0.8
            d4: 0.2
          correctAnswers:
