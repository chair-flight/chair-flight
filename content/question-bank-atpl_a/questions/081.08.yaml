        - **{{d1}} NM**: ignores the L/D ratio and only converts the height into nautical miles.
        - **{{d2}} NM**: divides by 1 852 (the length of a nautical mile in metres) when the height is in feet.
        - **{{d3}} NM**: divides by the L/D ratio, so the aircraft appears to glide a short distance.
        - **{{d4}} NM**: uses one less than the L/D ratio, understating the glide.
