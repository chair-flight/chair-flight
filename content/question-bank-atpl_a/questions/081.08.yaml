- id: QNKIK
  subjectId: "081"
  chapterId: "081.08"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-811817
    - AVEXAM-77681
    - BGS-811147
    - AVEXAM-97636
    - AVEXAM-30622
    - BGS-811149
    - ATPLQ-818691
  annexes: []
  learningObjectiveIds:
    - 081.08.01.05.06
  templates:
    - type: simple
      question: |-
        Determine the radius of a steady, level, coordinated turn, given:

        - TAS: {{tas}} kt
        - Bank angle: {{bank}}°
        - g: {{g}} m/s²

        Use 1 kt = 0.5144 m/s. Give the radius in km, to the nearest km.
      explanation: |-
        In a level coordinated turn the radius is the speed squared divided by (g times the tangent of the bank angle). The speed must be in metres per second, and the result in metres is divided by 1000 to give kilometres.

        **Solution**

        $$
        \frac{\frac{{(\text{TAS}\times 0.5144)}^{2}}{g\times \text{tan}(\text{Bank angle})}}{1000} = \frac{\frac{{({{tas}}\times 0.5144)}^{2}}{9.81\times \text{tan}({{bank}})}}{1000} = \mathbf{ {{answer}}\ \text{km} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} km**: uses the diameter, which is twice the radius.
        - **{{d2}} km**: does not square the speed.
        - **{{d3}} km**: gives the radius in metres but labels it as kilometres.
        - **{{d4}} km**: uses knots as if they were metres per second.
      presets:
        - variables:
            tas: 200
            bank: 45
            g: 9.81
            answer: 1
            d1: 2
            d2: 10
            d3: 1079
            d4: 4
          correctAnswers:
            - text: 1 km
          wrongAnswers:
            - text: 2 km
            - text: 1079 km
            - text: 4 km
            - text: 10 km
        - variables:
            tas: 500
            bank: 30
            g: 9.81
            answer: 12
            d1: 23
            d2: 45
            d3: 11680
            d4: 44
          correctAnswers:
            - text: 12 km
          wrongAnswers:
            - text: 23 km
            - text: 11680 km
            - text: 44 km
            - text: 45 km
        - variables:
            tas: 250
            bank: 20
            g: 9.81
            answer: 5
            d1: 9
            d2: 36
            d3: 4632
            d4: 18
          correctAnswers:
            - text: 5 km
          wrongAnswers:
            - text: 9 km
            - text: 4632 km
            - text: 18 km
            - text: 36 km
