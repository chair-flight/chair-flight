- id: QGLNJ
  subjectId: "081"
  chapterId: "081.08"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-817426
    - AVEXAM-55966
    - BGS-812428
    - BGS-970084
    - AVEXAM-25357
  annexes: []
  learningObjectiveIds:
    - 081.08.01.04.03
    - 081.08.01.04.05
  templates:
    - type: simple
      question: |-
        An aeroplane loses all engines and glides with no power. Given the following data:

        - Altitude: {{h}} ft
        - Lift-to-drag ratio: {{ld}} : 1
        - Average TAS: {{tas}} kt
        - Headwind component: {{hw}} kt

        What is the maximum glide range over the ground in NM? Assume 1 NM = 6080 ft.
      explanation: |-
        The still-air glide distance is the glide ratio times the height. A headwind reduces the speed over the ground, so the distance covered over the ground shrinks by the ratio of ground speed to airspeed.

        **Solution**

        - Still-air glide distance: $$\frac{\text{Lift-to-drag ratio}\times \text{Altitude}}{6080}$$ = $$\frac{ {{ld}}\times {{h}} }{6080}$$ = {{macro3}} NM
        - Ground speed: {{macro4}} kt
        - Distance over the ground: $$\frac{\frac{\text{Lift-to-drag ratio}\times \text{Altitude}}{6080}\times (\text{TAS}-\text{Headwind component})}{\text{TAS}} = \frac{\frac{ {{ld}}\times {{h}} }{6080}\times ({{tas}}-{{hw}})}{ {{tas}} } = \mathbf{ {{answer}}\ \text{NM} }$$

        ## Why the other answers are wrong

        - **{{d1}} NM**: ignores the headwind.
        - **{{d2}} NM**: adds the headwind to the airspeed instead of subtracting it.
        - **{{d3}} NM**: inverts the speed ratio.
        - **{{d4}} NM**: divides by the airspeed plus the headwind.
      presets:
        - variables:
            h: 10000
            ld: 15
            tas: 200
            hw: 20
            macro3: 24.7
            macro4: 180
