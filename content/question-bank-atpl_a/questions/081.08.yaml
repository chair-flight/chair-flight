      question: "If an aeroplane performs a steady co-ordinated horizontal turn at a TAS of {{tas}} kt and a turn radius of {{radius}} m, the load factor (n) will be approximately:"
      explanation: |-
        In a steady co-ordinated turn the bank angle is set by the speed and the radius of the turn: the speed squared divided by the product of g and the radius gives the tangent of the bank angle. The load factor is the lift divided by the weight, which equals the square root of one plus that ratio squared.

