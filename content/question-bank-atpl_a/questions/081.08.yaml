  templates:
    - type: simple
      question: What is the time for a heading change of {{dh}} degrees in a steady, co-ordinated, horizontal rate-one turn? Give the answer in seconds.
      explanation: |-
        A rate-one turn changes the heading by 3° every second. The time for a given heading change is therefore the heading change divided by 3, and the answer is in seconds.

        **Solution**

        - $$\frac{\text{Heading change}}{3} = \frac{ {{dh}} }{3} = \mathbf{ {{answer}}\ \text{seconds} }$$

        ## Why the other answers are wrong

        - **{{d1}} seconds**: divides by 2, as if the rate were 2° per second.
        - **{{d2}} seconds**: multiplies by 60, a unit conversion error that treats the answer as minutes.
        - **{{d3}} seconds**: multiplies by 40 instead of dividing.
        - **{{d4}} seconds**: multiplies by 2 instead of dividing by 3.
      presets:
        - variables:
            dh: 3
            answer: 1
            d1: 2
            d2: 60
            d3: 120
            d4: 6
          correctAnswers:
            - text: 1 seconds
          wrongAnswers:
            - text: 2 seconds
            - text: 120 seconds
            - text: 6 seconds
            - text: 60 seconds
        - variables:
            dh: 15
            answer: 5
            d1: 8
            d2: 300
            d3: 600
            d4: 30
          correctAnswers:
            - text: 5 seconds
          wrongAnswers:
            - text: 8 seconds
            - text: 600 seconds
            - text: 30 seconds
            - text: 300 seconds
        - variables:
            dh: 30
            answer: 10
            d1: 15
            d2: 600
            d3: 1200
            d4: 60
          correctAnswers:
            - text: 10 seconds
          wrongAnswers:
            - text: 15 seconds
            - text: 1200 seconds
            - text: 60 seconds
            - text: 600 seconds
