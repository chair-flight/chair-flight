        A light aeroplane glides in still air with the following data:

        - Lift-to-drag ratio: {{ld}} : 1
        - Height: {{h}} m

        What is the maximum gliding distance in metres?
      explanation: |-
        A glide ratio of X : 1 means the aeroplane travels X units forward for each unit it loses in height. The still-air glide distance is therefore the glide ratio times the height, in the same unit as the height.

        **Solution**

        - Gliding distance: $$\text{Lift-to-drag ratio}\times \text{Height} = {{ld}}\times {{h}} = \mathbf{ {{answer}}\ \text{m} }$$

