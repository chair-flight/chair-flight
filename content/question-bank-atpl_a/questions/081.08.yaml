        Load factor: $$\sqrt{1+{\frac{{(\text{TAS}\times 0.5144)}^{2}}{9.81\times \text{Turn radius}}}^{2}} = \mathbf{ {{answer}} }$$

        ## Why the other answers are wrong

        - **{{d1}}**: gives the ratio itself, which is the tangent of the bank angle, not the load factor.
        - **{{d2}}**: forgets to square the ratio inside the root.
        - **{{d3}}**: adds 1 to the ratio, without squaring it or taking the square root.
