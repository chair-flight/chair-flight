      question: |-
        The average temperature of the air mass between FL{{fl_low}} and FL{{fl_high}} is ISA {{dev}} °C (negative = colder than ISA).

        What is the vertical distance between FL{{fl_low}} and FL{{fl_high}}?
      explanation: |-
        Flight levels are pressure altitudes, so the true distance between two of them depends on the mean air temperature. A layer that is warmer than ISA is thicker, a colder layer is thinner: the thickness changes by about 4 ft per 1 000 ft for every °C of deviation, i.e. by 1/250 per °C.

        **Solution**

        ISA distance: {{macro1}} ft

        $$
        (\text{Upper flight level}-\text{Lower flight level})\times 100\times (1+\frac{\text{Mean ISA deviation}}{250}) = ({{fl_high}}-{{fl_low}})\times 100\times (1+\frac{ {{dev}} }{250}) = \mathbf{ {{answer}}\ \text{ft} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} ft**: temperature correction applied with the wrong sign.
        - **{{d2}} ft**: no temperature correction, the ISA distance between the levels.
        - **{{d3}} ft**: the 4 ft/°C correction was applied once instead of per 1 000 ft of layer.
        - **{{d4}} ft**: deviation divided by 100 instead of 250.
