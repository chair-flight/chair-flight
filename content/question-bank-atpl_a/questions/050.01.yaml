    - type: simple
      question: |-
        You plan to fly over a mountain range at a true altitude of {{alt}} ft AMSL.

        - Average temperature: {{cold}} °C colder than ISA
        - Sea level pressure (QNH): {{qnh}} hPa
        - Altimeter setting: {{set}} hPa
        - Barometric lapse rate: {{k}} ft/hPa

        What approximate indication should the altimeter read?
      explanation: |-
        The altimeter reads too high when the sea level pressure is lower than the setting, because the true altitude is then below the altitude the altimeter shows. Cold air also makes the true altitude lower than indicated. Both errors add up, so the altimeter reads higher than the true altitude.

        **Solution**

        - Pressure error: $$(\text{Altimeter setting}-\text{QNH})\times \text{Barometric lapse rate}$$ = {{macro2}} ft
        - Temperature error: $$\frac{\text{Colder than ISA}\times 4\times \text{True altitude}}{1000}$$ = {{macro4}} ft
        - Indication: $$\text{True altitude}+(\text{Altimeter setting}-\text{QNH})\times \text{Barometric lapse rate}+\frac{\text{Colder than ISA}\times 4\times \text{True altitude}}{1000} = {{alt}}+({{set}}-{{qnh}})\times 30+\frac{ {{cold}}\times 4\times {{alt}} }{1000} = \mathbf{ {{answer}}\ \text{ft} }$$

        ## Why the other answers are wrong

        - **{{d1}} ft**: forgets the temperature error
        - **{{d2}} ft**: applies the pressure error with the wrong sign
        - **{{d3}} ft**: applies the temperature error with the wrong sign
        - **{{d4}} ft**: applies both errors with the wrong sign
