        An aircraft is cruising at FL{{fl}}.

        A nearby meteorological station situated at an elevation of {{hs}} ft gives a QNH of {{qnh}} hPa, and the aircraft measures an OAT of {{oat}} °C.

        Calculate the aircraft's clearance from the highest obstacle on its route, which is a mountain of {{obs}} ft elevation. (Assume 1 hPa = {{k}} ft)
      explanation: |-
        At a flight level the altimeter is set to 1013 hPa. First convert the flight level to an altitude above mean sea level using the QNH (a QNH below 1013 hPa means a lower true altitude), then correct for temperature: in air warmer than ISA the true altitude is higher than indicated (about 1/250 per °C). The clearance is the corrected altitude minus the obstacle elevation (rounded to 100 ft).

