        At a flight level the altimeter reads pressure altitude (1013 hPa). With a QNH lower than 1013 hPa the true altitude is lower than the flight level: subtract (1013 - QNH) × ft per hPa. The clearance is the true altitude minus the terrain elevation, converted from metres to feet (1 m = 3.281 ft).

        **Solution**

        True altitude: {{macro1}} - {{macro2}} = {{macro3}} ft

        Terrain elevation: {{obs_m}} m × 3.281 = {{macro4}} ft

        Clearance: {{macro3}} - {{macro4}} ≈ **{{answer}} ft**

        ## Why the other answers are wrong

        - **{{d1}} ft**: QNH correction applied with the wrong sign.
        - **{{d2}} ft**: QNH correction forgotten (flight level taken as true altitude).
        - **{{d3}} ft**: terrain elevation in metres subtracted as if it were feet.
        - **{{d4}} ft**: metres converted to feet by dividing instead of multiplying by 3.281.
