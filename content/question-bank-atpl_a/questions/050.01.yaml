  templates:
    - type: simple
      question: "An aircraft flying at FL{{fl}} (OAT {{oat}} °C) obtains a reading of {{radio}} ft on its radio altimeter (ground elevation {{elev}} ft). What is the value of the QNH, to the nearest hPa, at that point? (Barometric lapse rate: {{k}} ft/hPa)"
      explanation: |-
        The radio altimeter gives the height above the ground, so the true altitude is the radio altimeter reading plus the ground elevation. The OAT equals the ISA temperature at this level, so no temperature correction is needed. The flight level is the pressure altitude (1013 hPa). If the true altitude is higher than the pressure altitude the QNH is higher than 1013 hPa, by the difference divided by the gradient.

        **Solution**

        True altitude: {{radio}} + {{elev}} = {{macro1}} ft

        Pressure altitude: FL{{fl}} = {{macro2}} ft

        $$
        1013+\frac{\text{Radio altimeter reading}+\text{Ground elevation}-\text{Flight level}\times 100}{\text{Barometric lapse rate}} = 1013+\frac{ {{radio}}+{{elev}}-{{fl}}\times 100}{30} = \mathbf{ {{answer}}\ \text{hPa} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} hPa**: the difference between true and pressure altitude was subtracted instead of added.
        - **{{d2}} hPa**: standard pressure, no correction.
        - **{{d3}} hPa**: the ground elevation alone was taken as the true altitude (radio altimeter reading forgotten).
        - **{{d4}} hPa**: the radio altimeter reading alone was taken as the true altitude (ground elevation forgotten).
