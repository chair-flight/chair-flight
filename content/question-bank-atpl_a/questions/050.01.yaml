        What subscale setting (hPa) must be set on the standby altimeter so that it indicates the airfield elevation?
      explanation: |-
        Raising the subscale setting makes an altimeter indicate a higher altitude, with each hPa worth {{k}} ft. To make the standby altimeter read the airfield elevation, its setting must be raised by the missing altitude divided by the lapse rate.

        **Solution**

