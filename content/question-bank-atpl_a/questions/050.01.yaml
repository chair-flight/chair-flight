      question: |-
        You are flying at an indicated altitude of {{alt}} ft with the altimeter set to 1013 hPa and must start a drift down procedure.

        - Highest obstacle elevation: {{obs}} ft
        - QNH 1013 hPa measured at a station at {{hs}} ft
        - ISA deviation: {{dev}} °C

        What is the vertical separation between the aircraft and the highest obstacle?
      explanation: |-
        A cold air mass makes the true altitude lower than the indicated altitude. The correction is 4 ft per 1 000 ft of height above the station for each °C of ISA deviation. The obstacle elevation is then subtracted to get the vertical separation.

        **Solution**

        - Temperature correction: $$\frac{\text{ISA deviation}\times 4\times (\text{Indicated altitude}-\text{Station elevation})}{1000}$$ = {{macro2}} ft
        - True altitude: $$\text{Indicated altitude}+\frac{\text{ISA deviation}\times 4\times (\text{Indicated altitude}-\text{Station elevation})}{1000}$$ = {{macro4}} ft
        - Separation: $$\text{Indicated altitude}+\frac{\text{ISA deviation}\times 4\times (\text{Indicated altitude}-\text{Station elevation})}{1000}-\text{Highest obstacle} = {{alt}}+\frac{ {{dev}}\times 4\times ({{alt}}-{{hs}})}{1000}-{{obs}} = \mathbf{ {{answer}}\ \text{ft} }$$

        ## Why the other answers are wrong

        - **{{d1}} ft**: ignores the temperature correction
        - **{{d2}} ft**: applies the temperature correction with the wrong sign
        - **{{d3}} ft**: uses the altitude above sea level instead of the height above the station
        - **{{d4}} ft**: forgets to subtract the obstacle elevation
