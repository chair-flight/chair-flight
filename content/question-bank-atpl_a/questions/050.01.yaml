- id: QDWHL
  subjectId: "050"
  chapterId: "050.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-501129
    - ATPLQ-508842
    - ATPLQ-504742
    - BGS-502346
    - AVEXAM-253
    - AVEXAM-7366
  annexes: []
  learningObjectiveIds:
    - 050.01.02.02.03
  templates:
    - type: simple
      question: What is the ISA deviation at FL{{fl}} where the OAT was {{oat}} °C?
      explanation: |-
        The ISA deviation is the OAT minus the ISA temperature at that level. The ISA temperature falls by 2 °C per 1 000 ft from 15 °C at sea level up to the tropopause at 36 090 ft (about FL360), and stays constant at -56.5 °C above it.

        **Solution**

        ISA temperature at FL{{fl}}: {{macro1}} °C

        $$
        \text{OAT}-\text{max}(15-0.2\times \text{Flight level},-56.5) = {{oat}}-\text{max}(15-0.2\times {{fl}},-56.5) = \mathbf{ {{answer}}\ \text{°C} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} °C**: sign reversed (ISA temperature minus OAT).
        - **{{d2}} °C**: continued the 2 °C per 1 000 ft lapse rate above the tropopause instead of using the constant -56.5 °C.
        - **{{d3}} °C**: both errors combined: lapse rate continued above the tropopause and sign reversed.
        - **{{d4}} °C**: compared the OAT with the sea-level ISA temperature of 15 °C.
      presets:
        - variables:
            fl: 370
            oat: -45
            macro1: -56.5
            answer: 11.5
            d1: -11.5
            d2: 14
            d3: -14
            d4: -60
          correctAnswers:
            - text: 11.5 °C
          wrongAnswers:
            - text: -11.5 °C
            - text: -14 °C
            - text: -60 °C
            - text: 14 °C
        - variables:
            fl: 390
            oat: -56
            macro1: -56.5
            answer: 0.5
            d1: -0.5
            d2: 7
            d3: -7
            d4: -71
          correctAnswers:
            - text: 0.5 °C
          wrongAnswers:
            - text: -0.5 °C
            - text: -7 °C
            - text: -71 °C
            - text: 7 °C
        - variables:
            fl: 360
            oat: -50
            macro1: -56.5
            answer: 6.5
            d1: -6.5
            d2: 7
            d3: -7
            d4: -65
          correctAnswers:
            - text: 6.5 °C
          wrongAnswers:
            - text: -6.5 °C
            - text: -7 °C
            - text: -65 °C
            - text: 7 °C
