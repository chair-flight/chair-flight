      explanation: |-
        At the transition altitude the aircraft is at an altitude based on QNH. Switching to 1013 hPa changes the reading by the pressure difference times the gradient. If QNH is above 1013, the 1013 hPa surface lies below the QNH surface, so the reading decreases; if QNH is below 1013, it increases.

