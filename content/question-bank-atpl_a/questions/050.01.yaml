        \text{Decision altitude (minimum)}\times (1+0.004\times (15-\text{Aerodrome OAT})) = {{alt}}\times (1+0.004\times (15-({{oat}}))) = \mathbf{ {{answer}}\ \text{ft} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} ft**: sign of the deviation reversed, which reduces the altitude instead of increasing it.
        - **{{d2}} ft**: no temperature correction applied.
        - **{{d3}} ft**: correction factor inverted (divided instead of multiplied).
        - **{{d4}} ft**: OAT used directly instead of the deviation from ISA.
