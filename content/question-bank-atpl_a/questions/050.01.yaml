- id: QNJML
  subjectId: "050"
  chapterId: "050.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-503255
    - BGS-500159
    - AVEXAM-27115
  annexes: []
  learningObjectiveIds:
    - 050.01.03.02.02
  templates:
    - type: simple
      question: "An airfield has a QFE of {{qfe}} hPa and a QNH of {{qnh}} hPa. Barometric lapse rate: {{lapse}} ft/hPa. Determine the approximate elevation of the airfield in metres (rounded to the nearest 10 m)."
      explanation: |-
        The difference between QNH and QFE is the pressure difference between mean sea level and the airfield. Multiplied by the barometric lapse rate, it gives the airfield elevation.

        **Solution**

        Pressure difference: {{macro1}} hPa

        Elevation in feet: $$(\text{QNH}-\text{QFE})\times \text{Barometric lapse rate} = ({{qnh}}-{{qfe}})\times 30$$ ft

        Converted to metres (× 0.3048) and rounded to the nearest 10 m: **{{answer}} m**

        ## Why the other answers are wrong

        - **{{d1}} m**: the result in feet is used as metres (no unit conversion).
        - **{{d2}} m**: sign reversed (QFE minus QNH), giving a negative elevation.
        - **{{d3}} m**: a lapse rate of 27 ft/hPa is used instead of the given value.
        - **{{d4}} m**: wrong conversion; divided by 0.3048 instead of multiplied.
      presets:
        - variables:
            qfe: 980
            qnh: 1000
            lapse: 30
            macro1: 20
            answer: 180
            d1: 600
            d2: -180
            d3: 160
            d4: 1970
          correctAnswers:
            - text: 180 m
          wrongAnswers:
            - text: 600 m
            - text: 160 m
            - text: 1970 m
            - text: -180 m
        - variables:
            qfe: 1003
            qnh: 1013
            lapse: 30
            macro1: 10
            answer: 90
            d1: 300
            d2: -90
            d3: 80
            d4: 980
          correctAnswers:
            - text: 90 m
          wrongAnswers:
            - text: 300 m
            - text: 80 m
            - text: 980 m
            - text: -90 m
        - variables:
            qfe: 990
            qnh: 1020
            lapse: 30
            macro1: 30
            answer: 270
            d1: 900
            d2: -270
            d3: 250
            d4: 2950
          correctAnswers:
            - text: 270 m
          wrongAnswers:
            - text: 900 m
            - text: 250 m
            - text: 2950 m
            - text: -270 m
- id: QECBS
  subjectId: "050"
