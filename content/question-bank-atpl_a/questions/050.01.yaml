  templates:
    - type: simple
      question: In the ISA atmosphere, the air density is {{ratio}} % of the density at mean sea level. At what altitude (ft) does this occur? Give the answer rounded to the nearest 1000 ft.
      explanation: |-
        In the ISA, the density ratio σ = ρ/ρ0 decreases with altitude as σ = (1 − 0.0065·h / 288.15)^4.2559, with h in metres. Solving for h gives h = (288.15 / 0.0065) · (1 − σ^(1/4.2559)).

        **Solution**

        Density ratio σ = {{macro1}}

        Height in metres: $$\frac{288.15}{0.0065}\times (1-{\frac{ {{ratio}} }{100}}^{\frac{1}{4.2559}})$$ m

        Height in feet: {{macro3}} ft, rounded to the nearest 1000 ft: **{{answer}} ft**

        ## Why the other answers are wrong

        - **{{d1}} ft**: the height in metres is used as feet (no conversion).
        - **{{d2}} ft**: the pressure exponent (5.2559) is used instead of the density exponent (4.2559), which gives the altitude for a pressure ratio.
        - **{{d3}} ft**: a typical flight level guessed, not derived from the ISA relation.
        - **{{d4}} ft**: a typical flight level guessed, not derived from the ISA relation.
      presets:
        - variables:
            ratio: 50
            macro1: 1
            macro3: 21859
            answer: 22000
            d1: 7000
            d2: 18000
            d3: 35000
            d4: 40000
          correctAnswers:
            - text: 22000 ft
          wrongAnswers:
            - text: 7000 ft
            - text: 35000 ft
            - text: 40000 ft
            - text: 18000 ft
        - variables:
