        What is the approximate true altitude of an aircraft with the following data?

        - Indicated altitude: {{alt}} ft (correct QNH set in the subscale)
        - OAT: {{oat}} °C

        Give the answer in feet.
      explanation: |-
        The ISA temperature falls by 2 °C per 1 000 ft from 15 °C at sea level. The difference between the OAT and the ISA temperature at the indicated altitude is the ISA deviation, and it changes the true altitude by about 0.4 % of the indicated altitude per degree.

        **Solution**

        ISA temperature at {{alt}} ft: 15 - 2 x {{alt}} / 1 000 = {{macro1}} °C

        ISA deviation: {{oat}} - ({{macro1}}) = {{macro2}} °C

        True altitude: $$\text{Indicated altitude}\times (1+0.004\times (\text{OAT}-(15-0.002\times \text{Indicated altitude}))) = {{alt}}\times (1+0.004\times ({{oat}}-(15-0.002\times {{alt}}))) = \mathbf{ {{answer}}\ \text{ft} }$$

        ## Why the other answers are wrong

        - **{{d1}} ft**: the indicated altitude is taken as the true altitude, with no correction.
        - **{{d2}} ft**: the OAT is used as the deviation instead of the difference to the ISA temperature.
        - **{{d3}} ft**: the correction has the wrong sign.
        - **{{d4}} ft**: 0.04 % per degree is used instead of 0.4 %, a decimal point slip.
