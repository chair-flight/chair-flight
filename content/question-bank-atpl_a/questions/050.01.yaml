        An aircraft has to fly over a mountainous area. The highest obstacle has an elevation of {{obs}} ft and a terrain clearance of at least {{clr}} ft is required. The average temperature deviation from ISA is {{dev}} °C (negative = colder than ISA). The QNH of {{qnh}} hPa is given by a station at an elevation of {{hs}} ft. Assume 1 hPa = {{k}} ft.

        What is the lowest usable flight level?
      explanation: |-
        The lowest usable flight level is found by working backwards from the required true altitude (obstacle elevation plus clearance).

        1. Temperature: in air colder than ISA the altimeter over-reads, so the height above the QNH station is increased by about 1/250 per °C below ISA (decreased when warmer).
        2. Pressure: a QNH below 1013 hPa means the 1013 hPa level is higher, so (1013 - QNH) × ft per hPa is added to obtain the pressure altitude.
        3. The result is rounded up to the next flight level that is a multiple of 5.

        **Solution**

        Required true altitude: {{macro1}} ft

        Temperature-corrected altitude: {{macro2}} ft

        Pressure altitude: {{macro2}} + {{macro3}} = {{macro4}} ft

        Rounded up to the next multiple of 5: **FL{{answer}}**

        ## Why the other answers are wrong

        - **FL{{d1}}**: temperature correction applied with the wrong sign.
        - **FL{{d2}}**: no temperature correction.
        - **FL{{d3}}**: clearance forgotten, only the obstacle elevation was cleared.
        - **FL{{d4}}**: the clearance was counted twice.
