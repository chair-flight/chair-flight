  templates:
    - type: simple
      question: |-
        You are flying over the sea at a pressure altitude of {{alt}} ft (altimeter set to 1013 hPa) and measure an outside air temperature of {{oat}} °C.

        - ISA temperature at this level: {{isa}} °C
        - Sea level pressure (QNH): {{qnh}} hPa
        - Barometric lapse rate: {{k}} ft/hPa

        What is your approximate true altitude AMSL?
      explanation: |-
        A sea level pressure above the standard 1013 hPa means the altimeter, set to 1013 hPa, reads too low. Air colder than ISA means the true altitude is lower than the indicated altitude. Both corrections are applied to the pressure altitude.

        **Solution**

        - Pressure correction: $$(\text{QNH}-1013)\times \text{Barometric lapse rate}$$ = {{macro2}} ft
        - Temperature correction: $$\frac{(\text{Outside air temperature}-\text{ISA temperature})\times 4\times \text{Pressure altitude}}{1000}$$ = {{macro4}} ft
        - True altitude: $$\text{Pressure altitude}+(\text{QNH}-1013)\times \text{Barometric lapse rate}+\frac{(\text{Outside air temperature}-\text{ISA temperature})\times 4\times \text{Pressure altitude}}{1000} = {{alt}}+({{qnh}}-1013)\times 30+\frac{({{oat}}-({{isa}}))\times 4\times {{alt}} }{1000} = \mathbf{ {{answer}}\ \text{ft AMSL} }$$

        ## Why the other answers are wrong

        - **{{d1}} ft**: ignores the temperature correction
        - **{{d2}} ft**: applies the pressure correction with the wrong sign
        - **{{d3}} ft**: applies the temperature correction with the wrong sign
        - **{{d4}} ft**: applies both corrections with the wrong sign
      presets:
