        What will the altimeter read when you are at the recommended minimum altitude?
      explanation: |-
        In air warmer than ISA the pressure levels are stretched, so the true altitude is higher than the indicated altitude by about 4 ft per 1000 ft per °C of deviation. To be at a given true altitude, the altimeter must therefore read less. The QNH is set for a nearly sea-level airport, so no pressure correction is needed.

        **Solution**

        Correction = 4 ft x {{dt}} x {{macro1}} = {{macro2}} ft

        $$
        \text{Minimum altitude}-\frac{4\times \text{ISA deviation}\times \text{Minimum altitude}}{1000} = {{alt}}-\frac{4\times {{dt}}\times {{alt}} }{1000} = \mathbf{ {{answer}}\ \text{ft} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} ft**: the temperature correction was added instead of subtracted (that is the correction for cold air).
        - **{{d2}} ft**: a QNH correction was applied although the QNH is already set and the airport is at sea level.
        - **{{d3}} ft**: a QNH correction was applied with the wrong sign.
        - **{{d4}} ft**: no temperature correction was applied.
