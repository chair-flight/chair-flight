        - **{{d1}} ft**: the correction has the wrong sign.
        - **{{d2}} ft**: no correction was applied; the reading would be unchanged.
        - **{{d3}} ft**: the pressure difference in hPa was added without converting it to feet.
        - **{{d4}} ft**: only the correction was used, the transition altitude was left out.
