    - type: simple
      question: The 0°C isotherm is forecast to be at FL{{fl0}}. At what flight level would you expect a temperature of {{t}}°C?
      explanation: |-
        In the ISA troposphere the temperature falls by about 2°C per 1000 ft, i.e. 1°C per 500 ft, which is 5 flight levels. Colder temperatures are found higher up, warmer ones lower down.

        **Solution**

        $$\text{Isotherm level}-\text{Temperature}\times 5 = {{fl0}}-({{t}})\times 5$$ = **FL{{answer}}**

        ## Why the other answers are wrong

        - **FL{{d1}}**: the sign is wrong; the colder air was placed below the isotherm.
        - **FL{{d2}}**: a lapse rate of 1°C per 1000 ft was used.
        - **FL{{d3}}**: a lapse rate of about 3.3°C per 1000 ft was used.
        - **FL{{d4}}**: a lapse rate of 5°C per 1000 ft was used.
      presets:
