    - 050.01.03.02.03
  templates:
    - type: simple
      question: |-
        In the ISA, at what altitude is the pressure {{ratio}}% of the sea-level pressure?

        Give the altitude in feet, rounded to the nearest 1000 ft.
      explanation: |-
        The standard atmosphere links pressure and altitude through a fixed formula. The height in metres is 44330 × (1 − (p / p0)^0.1903), where p0 is the sea-level pressure. Multiplying by 3.28084 gives feet.

        **Solution**

        $$44330\times (1-{\frac{\text{Pressure as a percentage of sea-level pressure}}{100}}^{0.1903})\times 3.28084 = 44330\times (1-{\frac{ {{ratio}} }{100}}^{0.1903})\times 3.28084$$ ft

        Rounded to the nearest 1000 ft: **{{answer}} ft**

        ## Why the other answers are wrong

        - **{{d1}} ft**: the result is in metres, not feet.
        - **{{d2}} ft**: the bracket is placed wrongly, so (1 - ratio) is raised to the power.
        - **{{d3}} ft**: the result is not rounded to the nearest 1000 ft.
        - **{{d4}} ft**: the metres-to-feet conversion is inverted (divided instead of multiplied).
      presets:
        - variables:
            ratio: 50
            answer: 18000
            d1: 5000
            d2: 127000
            d3: 17973
            d4: 2000
          correctAnswers:
            - text: 18000 ft
          wrongAnswers:
            - text: 5000 ft
            - text: 17973 ft
            - text: 2000 ft
            - text: 127000 ft
        - variables:
            ratio: 70
            answer: 10000
            d1: 3000
            d2: 116000
            d3: 9544
            d4: 1000
          correctAnswers:
            - text: 10000 ft
          wrongAnswers:
            - text: 3000 ft
