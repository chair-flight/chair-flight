      question: |-
        An aerodrome at sea level next to mountainous terrain has a minimum Decision Altitude of {{alt}} ft.

        The aerodrome OAT is {{oat}} °C.

        Below -5 °C the altitude must be temperature corrected.

        Using a correction of 0.4 % per degree Celsius of deviation from ISA (ISA sea-level temperature 15 °C), calculate the lowest altimeter indication at DA (ft).
      explanation: |-
        In cold air the true altitude is lower than the indicated altitude, so the indicated altitude at DA must be increased to make sure the minimum true altitude is respected. The correction is 0.4 % per degree of deviation from ISA.

        **Solution**

        Deviation from ISA (ISA sea level 15 °C): {{macro1}} °C

        Correction factor: 1 + 0.004 × {{macro1}} = {{macro2}}

