      question: |-
        The average temperature of the air mass between FL{{fl_low}} and FL{{fl_high}} is ISA {{dev}} °C (negative = colder than ISA).

        What is the vertical distance between FL{{fl_low}} and FL{{fl_high}}? Give the answer in feet.
      explanation: |-
        Flight levels are pressure altitudes, so the true distance between two of them depends on the mean air temperature. A layer warmer than ISA is thicker and a colder layer is thinner: the thickness changes by about 4 ft per 1 000 ft for every degree of deviation.

        **Solution**

        Pressure altitude difference: {{macro1}} ft

        Vertical distance: $$(\text{Upper flight level}-\text{Lower flight level})\times 100\times (1+\frac{\text{Mean ISA deviation}}{250}) = ({{fl_high}}-{{fl_low}})\times 100\times (1+\frac{ {{dev}} }{250}) = \mathbf{ {{answer}}\ \text{ft} }$$

        ## Why the other answers are wrong

        - **{{d1}} ft**: the sign of the temperature correction is reversed.
        - **{{d2}} ft**: the temperature correction is forgotten.
        - **{{d3}} ft**: 4 ft per degree is added as a flat amount instead of a percentage of the layer thickness.
        - **{{d4}} ft**: the correction uses 1 % per degree instead of 0.4 %.
