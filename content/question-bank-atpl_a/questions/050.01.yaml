  templates:
    - type: simple
      question: |-
        An aircraft is flying at {{ind}} ft indicated altitude with the altimeter set to {{qnh}} hPa. This QNH is given by an airfield at {{elev}} ft elevation, and the air mass over that airfield is on average ISA {{isa_dev}} °C (negative = colder than ISA).

        Calculate the true altitude of the aircraft over the field, rounded to the nearest 10 ft.
      explanation: |-
        The indicated altitude is measured from mean sea level. Only the height above the field is corrected for temperature, by about 0.4 % of that height per degree of ISA deviation. The field elevation is then added back, and the result is rounded to the nearest 10 ft as the question asks.

        **Solution**

        Height above the field: {{ind}} - {{elev}} = {{macro1}} ft

        Corrected height: {{macro2}} ft

        True altitude: $$\text{round}(\frac{\text{Field elevation}+(\text{Indicated altitude}-\text{Field elevation})\times (1+0.004\times \text{ISA deviation})}{10})\times 10 = \text{round}(\frac{ {{elev}}+({{ind}}-{{elev}})\times (1+0.004\times ({{isa_dev}}))}{10})\times 10 = \mathbf{ {{answer}}\ \text{ft} }$$

        ## Why the other answers are wrong

        - **{{d1}} ft**: the indicated altitude is taken as the true altitude, with no correction.
        - **{{d2}} ft**: the temperature correction has the wrong sign.
        - **{{d3}} ft**: the correction is applied to the whole indicated altitude, without taking the field elevation into account.
        - **{{d4}} ft**: 0.04 % per degree is used instead of 0.4 %, a decimal point slip.
      presets:
