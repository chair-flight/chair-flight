        During a climb the pilot changes the altimeter subscale from QNH to standard (1013 hPa) at the transition altitude. Given:

        - Transition altitude: {{ta}} ft
        - QNH: {{qnh}} hPa

        (Assume {{k}} ft per hPa.)

        What is the approximate altimeter reading immediately after the subscale is changed?
      explanation: |-
        At the transition altitude the altimeter shows the transition altitude on the local QNH. Changing to standard pressure moves the reading by the gradient for every hPa of difference. A QNH below 1013 hPa makes the reading go up, and a QNH above 1013 hPa makes it go down.

        **Solution**

        Difference from standard: {{macro1}} hPa

        $$
        \text{Transition altitude}+(1013-\text{QNH})\times \text{Pressure gradient} = {{ta}}+(1013-{{qnh}})\times 30 = \mathbf{ {{answer}}\ \text{ft} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} ft**: the correction has the wrong sign.
        - **{{d2}} ft**: the pressure change is ignored.
        - **{{d3}} ft**: the difference in hPa is not converted to feet.
        - **{{d4}} ft**: the transition altitude is left out.
