  templates:
    - type: simple
      question: Which of the following most accurately defines the apparent wander of a gyroscope?
      explanation: Apparent wander is the apparent change of direction of the spin axis as seen by an observer on the earth. It arises because the gyroscope keeps its direction in space while the earth rotates.
      presets:
        - correctAnswers:
            - text: The appearance to an observer on Earth of the change of direction of the gyroscope's spin axis.
          wrongAnswers:
            - text: The tilting of the spin axis in the vertical plane due to an imperfectly balanced gyroscopic mass.
            - text: Wander as a result of the movement of the gyroscope over the Earth's surface.
            - text: Wander as a result of imperfections such as bearing friction and gimbal system imbalance.
