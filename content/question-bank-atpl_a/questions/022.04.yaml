      question: Due to the rotation of the Earth, what is the magnitude of the apparent drift of a horizontal free gyroscope at a latitude of {{lat}}°S, in degrees per hour?
      explanation: |-
        A horizontal-axis free gyroscope keeps its direction in space while the Earth turns at 15°/h, so it appears to drift by the vertical component of the Earth rate: 15° x sin(latitude). In the southern hemisphere the apparent drift is to the left.

        **Solution**

        $$
        15\times \text{sin}(\text{Latitude}) = 15\times \text{sin}({{lat}}) = \mathbf{ {{answer}}\ \text{°/h} }
        $$

        ## Why the other answers are wrong
        - **{{d1}} °/h**: uses cosine, the horizontal component of Earth rate (this is the transport/tilt term, not the apparent drift).
        - **{{d2}} °/h**: uses tangent instead of sine.
        - **{{d3}} °/h**: divides by sin(latitude) instead of multiplying.
        - **{{d4}} °/h**: scales linearly with latitude instead of using sine.
      presets:
        - variables:
            lat: 30
            answer: 7.5
            d1: 13
            d2: 8.7
            d3: 30
            d4: 5
          correctAnswers:
            - text: 7.5 °/h
          wrongAnswers:
            - text: 13 °/h
            - text: 30 °/h
            - text: 5 °/h
            - text: 8.7 °/h
        - variables:
            lat: 50
            answer: 11.5
            d1: 9.6
            d2: 17.9
            d3: 19.6
            d4: 8.3
          correctAnswers:
            - text: 11.5 °/h
          wrongAnswers:
            - text: 9.6 °/h
            - text: 19.6 °/h
            - text: 8.3 °/h
            - text: 17.9 °/h
        - variables:
            lat: 20
            answer: 5.1
            d1: 14.1
            d2: 5.5
            d3: 43.9
            d4: 3.3
          correctAnswers:
            - text: 5.1 °/h
          wrongAnswers:
            - text: 14.1 °/h
            - text: 43.9 °/h
            - text: 3.3 °/h
            - text: 5.5 °/h
    - type: simple
      question: A free gyro has the axis of the spinning rotor horizontal and aligned with the geographic meridian. - If this free gyro is situated at latitude 60° N, the apparent drift rate according to the earthbound observer is…
