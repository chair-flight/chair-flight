- id: QXXIL
  subjectId: "032"
  chapterId: "032.03"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-323126
    - BGS-321194
    - AVEXAM-98405
    - BGS-321042
  annexes:
    - id: AGOD
  learningObjectiveIds:
    - 032.03.03.01.05
  templates:
    - type: simple
      question: |-
        Refer to the figure (CAP 698 Figure 3.6). Calculate the all-engines obstacle clearance of a multi-engine aeroplane from the end of take-off (reference zero).

        - Ground speed: {{gs}} kt
        - Obstacle height: {{oh}} ft AGL
        - Obstacle distance: {{dist}} ft from reference zero
        - Rate of climb read from the chart: {{roc}} ft/min (1 NM = 6 080 ft)
      explanation: |-
        Time to the obstacle = distance / ground speed. Height gained = time x rate of climb. The clearance is the gained height minus the obstacle height.

        **Solution**

        Time = {{macro1}} min

        $$
        \frac{\text{Obstacle distance}\times 60}{\text{Ground speed}\times 6080}\times \text{Rate of climb read from the graph}-\text{Obstacle height} = \frac{15200\times 60}{121\times 6080}\times 1865-2000 = \mathbf{ {{answer}}\ \text{ft} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} ft**: the obstacle height not subtracted.
        - **{{d2}} ft**: the obstacle height added instead of subtracted.
        - **{{d3}} ft**: an unnecessary gross-to-net factor applied for all-engines.
        - **{{d4}} ft**: distance in feet treated as nautical miles in the time calculation.
      presets:
        - variables:
            gs: 121
            oh: 2000
            dist: 15200
            roc: 1865
            macro1: 1
            answer: 312
            d1: 2312
            d2: 4312
            d3: -222
            d4: 1905
          correctAnswers:
            - text: 312 ft
          wrongAnswers:
            - text: 2312 ft
            - text: -222 ft
            - text: 1905 ft
            - text: 4312 ft
- id: QURVN
  subjectId: "032"
  chapterId: "032.03"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-324608
    - AVEXAM-93473
    - AVEXAM-44978
    - BGS-320447
    - BGS-320144
    - AVEXAM-8132
    - ATPLQ-325066
  annexes: []
  learningObjectiveIds:
    - 032.03.03.01.05
  templates:
    - type: simple
      question: Following a take-off limited by the 50 ft (15 m) screen height, a light twin climbs on a {{grad}}% over-the-ground gradient. What is the obstacle clearance margin above a {{oh}} m obstacle (relative to the runway), situated {{dist}} m from the 50 ft point? (give the answer in metres)
      explanation: |-
        The aeroplane starts at the 50 ft (15 m) screen height and gains height at the climb gradient over the ground distance. The clearance is the height at the obstacle minus the obstacle height.

        **Solution**

        Height gain = {{macro1}} m

        $$
        15+\frac{\text{Climb gradient}}{100}\times \text{Distance from the 50 ft point}-\text{Obstacle height} = 15+\frac{ {{grad}} }{100}\times {{dist}}-{{oh}} = \mathbf{ {{answer}}\ \text{m} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} m**: the 15 m screen height forgotten.
        - **{{d2}} m**: the obstacle height added instead of subtracted.
        - **{{d3}} m**: the sign reversed (obstacle minus climb).
        - **{{d4}} m**: the screen height of 50 ft used as 50 m.
      presets:
        - variables:
            grad: 5
            oh: 160
            dist: 5000
            macro1: 250
            answer: 105
            d1: 90
            d2: 425
            d3: -105
            d4: 140
          correctAnswers:
            - text: 105 m
          wrongAnswers:
            - text: 90 m
            - text: -105 m
            - text: 140 m
