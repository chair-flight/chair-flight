  annexes: []
  learningObjectiveIds:
    - 032.03.03.02.03
  templates:
    - type: simple
      question: |-
        A departure procedure requires a climb gradient of {{grad}}% to an obstacle clearance altitude. Given the data below, estimate the minimum rate of climb required.

        - TAS: {{tas}} kt
        - Average headwind component: {{hw}} kt
      explanation: |-
        A required climb gradient must be flown over the ground, so the rate of climb depends on the groundspeed, not the TAS. Groundspeed is TAS minus the headwind component, and 1 kt is about 101 ft/min.

        **Solution**

        GS = {{macro1}} kt

        $$
        \frac{\text{Climb gradient}}{100}\times (\text{TAS}-\text{Headwind})\times 101 = \frac{ {{grad}} }{100}\times ({{tas}}-{{hw}})\times 101 = \mathbf{ {{answer}}\ \text{ft/min} }
        $$

        ## Why the other answers are wrong

