      question: |-
        At an aerodrome, the minimum climb gradient for obstacle clearance is {{grad}} %. What is the minimum rate of climb (in ft/min, rounded to the nearest 10) the pilot has to maintain during the climb?

        - TAS: {{tas}} kt
        - Tailwind: {{tw}} kt

        (1 NM = 6076 ft)
      explanation: |-
        A climb gradient is the ratio of height gained to horizontal distance covered over the ground, so the required rate of climb equals gradient times ground speed. With a tailwind the ground speed is higher than the TAS, so a higher rate of climb is needed.

        **Solution**

        Ground speed = {{tas}} + {{tw}} = {{macro1}} kt = {{macro2}} ft/min

        $$\frac{\frac{\text{Minimum climb gradient}}{100}\times (\text{TAS}+\text{Tailwind component})\times 6076}{60} = \frac{\frac{ {{grad}} }{100}\times ({{tas}}+{{tw}})\times 6076}{60}$$ ft/min, i.e. about **{{answer}} ft/min**

        ## Why the other answers are wrong

        - **{{d1}} ft/min**: subtracts the tailwind (treats it as a headwind).
        - **{{d2}} ft/min**: ignores the wind and uses the TAS as ground speed.
        - **{{d3}} ft/min**: uses 60 instead of 6076/60 to convert knots to ft/min.
        - **{{d4}} ft/min**: uses 1852 (metres per NM) instead of 6076 ft per NM.
