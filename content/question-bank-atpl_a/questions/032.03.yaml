      question: |-
        Refer to the figure (CAP 698 file 3.6). Given the following information, determine the obstacle clearance in the departure area.

        - Obstacle distance: {{dist}} NM from the threshold
        - Obstacle height: {{oh}} ft above the threshold
        - Ground speed: {{gs}} kt
        - Gross-to-net correction: {{gn}}
        - Rate of climb read from the chart (gross): {{roc}} ft/min

        Height gain = distance / GS x ROC x 60 (distance in NM, GS in kt)
      explanation: |-
        The net height gained over the distance to the obstacle is the gross height divided by the gross-to-net factor; the clearance is that net height minus the obstacle height.

        **Solution**

        Time to the obstacle = {{macro1}} min

        $$
        \frac{\frac{\text{Obstacle distance}}{\text{Ground speed}}\times \text{Gross rate of climb read from the graph}\times 60}{\text{Gross-to-net factor}}-\text{Obstacle height} = \frac{\frac{0.5}{110}\times 1173\times 60}{1.3}-72 = \mathbf{ {{answer}}\ \text{ft} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} ft**: the gross height used, without the gross-to-net correction.
        - **{{d2}} ft**: the correction factor multiplied instead of divided.
        - **{{d3}} ft**: the obstacle height not subtracted.
        - **{{d4}} ft**: the obstacle height added instead of subtracted.
      presets:
