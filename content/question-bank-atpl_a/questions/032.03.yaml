      question: |-
        Refer to the figure (CAP 698 Figure 3.10). Given the following information, calculate the field-length limited landing mass and the 50 ft barrier speed for a Performance Class B aeroplane.

        - OAT: +{{oat}} °C
        - Aerodrome pressure altitude: {{pa}} ft
        - Headwind component: {{headwind}} kt
        - Defactored landing distance: {{ldd}} ft
        - Technique: short field landing

        What are the landing mass and the 50 ft barrier speed?
      explanation: |-
        The field-length limited landing mass is the heaviest mass that can stop within the defactored landing distance. Enter the chart with the temperature, pressure altitude, headwind and defactored distance. The 50 ft barrier speed is read from the same mass line.

        **Solution**

        For a defactored landing distance of {{ldd}} ft at +{{oat}} °C, {{pa}} ft and a {{headwind}} kt headwind, the chart gives a landing mass of **3950 lb** and a 50 ft barrier speed of **77 kt**.

