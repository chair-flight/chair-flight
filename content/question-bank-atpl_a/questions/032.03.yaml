  templates:
    - type: simple
      question: |-
        The take-off distance of an aircraft is {{base}} m in a standard atmosphere, no wind at 0 ft pressure altitude. Use the following corrections:

        - ± 20 m per 1 000 ft field elevation
        - -5 m per kt of headwind
        - +10 m per kt of tailwind
        - ± 15 m per % of runway slope
        - ± 5 m per °C deviation from standard temperature

        What is the take-off distance from an airport with elevation {{elev}} ft, temperature {{oat}} °C, QNH 1013.25 hPa, {{slope}} % up-slope and {{tw}} kt tailwind?
      explanation: |-
        Each correction is applied to the base distance: elevation adds distance, a tailwind adds distance, an up-slope adds distance, and a temperature above ISA adds distance. ISA temperature at the given elevation (pressure altitude equals elevation at QNH 1013.25 hPa) is 15 °C minus 2 °C per 1 000 ft.

        **Solution**

        ISA temperature = {{macro1}} °C, deviation = {{macro2}} °C

        Elevation: {{macro3}} m; temperature: {{macro4}} m; slope: {{macro5}} m; tailwind: {{macro6}} m

        {{macro7}} + {{macro3}} + {{macro4}} + {{macro5}} + {{macro6}} = **{{answer}} m**

        ## Why the other answers are wrong

        - **{{d1}} m**: the tailwind correction was subtracted as if it were a headwind.
        - **{{d2}} m**: elevation and temperature corrections were forgotten.
        - **{{d3}} m**: the up-slope correction was subtracted instead of added, and elevation and temperature were forgotten.
      presets:
        - variables:
            base: 600
            elev: 1000
            oat: 17
            slope: 1
            tw: 10
            macro1: 13
            macro2: 4
            macro3: 20
            macro4: 20
            macro5: 15
            macro6: 100
            macro7: 600
            answer: 755
            d1: 555
            d2: 715
            d3: 685
          correctAnswers:
            - text: 755 m
          wrongAnswers:
            - text: 685 m
            - text: 555 m
            - text: 715 m
        - variables:
            base: 700
            elev: 2000
            oat: 20
            slope: 2
            tw: 8
            macro1: 11
