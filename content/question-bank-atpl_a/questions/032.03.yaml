        - **3500 lb, 73 kt**: reads a lower mass line, which gives a lower speed.
        - **4450 lb, 81 kt**: reads a higher mass line, which needs a longer distance than available.
        - **3200 lb, 70 kt**: applies the headwind correction twice.
