- id: QETQF
  subjectId: "032"
  chapterId: "032.03"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-324025
    - BGS-320115
    - BGS-320736
    - ATPLQ-321818
  annexes:
    - id: AZAI
  learningObjectiveIds:
    - 032.03.03.01.01
    - 032.03.03.01.03
  templates:
    - type: simple
      question: |-
        Refer to the figure (CAP 698 Figure 2.1). For the take-off chart of a single engine aeroplane, determine the take-off distance to 50 ft and the take-off speeds, given:

        - OAT: {{oat}} °C
        - Pressure altitude: {{pa}} ft
        - Aeroplane mass: {{mass}} lb
        - Headwind component: {{headwind}} kt
        - Flaps: up
        - Runway: paved and dry

        What are the take-off distance to 50 ft, the rotation speed and the 50 ft speed?
      explanation: |-
        The take-off distance to 50 ft and the speeds are read from the single engine take-off chart. Enter with the temperature, pressure altitude and mass, then apply the headwind correction to the distance.

        **Solution**

        For {{oat}} °C, {{pa}} ft, {{mass}} lb and a {{headwind}} kt headwind, the chart gives a take-off distance to 50 ft of **1 900 ft**, a rotation speed of **68 kt** and a 50 ft speed of **78 kt**.

        ## Why the other answers are wrong

        - **TOD 2 200 ft, rotation 70 kt, 50 ft 80 kt**: ignores the headwind correction and reads a higher temperature line.
        - **TOD 1 850 ft, rotation 70 kt, 50 ft 80 kt**: mixes the distance from one row with the speeds from another.
        - **TOD 1 650 ft, rotation 68 kt, 50 ft 78 kt**: applies the headwind correction twice, which shortens the distance.
      presets:
        - variables:
            oat: 25
            pa: 4000
            mass: 3000
            headwind: 10
          correctAnswers:
            - text: "TOD: 1 900 ft, Rotation speed: 68kt, 50ft speed: 78kt"
          wrongAnswers:
            - text: "TOD: 1 650 ft, Rotation speed: 68kt, 50ft speed: 78kt"
            - text: "TOD: 2 200 ft, Rotation speed: 70kt, 50ft speed: 80kt"
            - text: "TOD: 1 850 ft, Rotation speed: 70kt, 50ft speed: 80kt"
