            macro4: 45
            macro5: 30
            macro6: 80
            macro7: 700
            answer: 895
            d1: 735
            d2: 810
            d3: 750
          correctAnswers:
            - text: 895 m
          wrongAnswers:
            - text: 750 m
            - text: 735 m
            - text: 810 m
        - variables:
            base: 550
            elev: 500
            oat: 10
            slope: 1
