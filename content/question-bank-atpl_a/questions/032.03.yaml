  templates:
    - type: simple
      question: |-
        The climb gradient of an aircraft after take-off is {{base}}% in standard atmosphere, no wind, at 0 ft pressure altitude. Use the following corrections:

        - ± {{ce}}% per 1 000 ft field elevation
        - ± {{ct}}% per °C from standard temperature
        - -{{wing}}% with wing anti-ice
        - -{{eng}}% with engine anti-ice

        What is the climb gradient after take-off from an airport at {{elev}} ft elevation, {{temp}}°C, QNH 1013.25 hPa, with wing and engine anti-ice operating? (ISA: 15°C at sea level, -2°C per 1 000 ft)
      explanation: |-
        The gradient is corrected downwards for field elevation, for temperatures above ISA and for each anti-ice system in use. The temperature correction applies to the deviation from the ISA temperature at the field elevation.

        **Solution**

        ISA temperature at {{elev}} ft = $$15-\frac{2\times {{elev}} }{1000}$$ = {{macro2}} °C, so the deviation is {{macro3}} °C.

        $$
        \text{base gradient}-\frac{\text{elevation correction per 1 000 ft}\times \text{elevation}}{1000}-\text{temperature correction per °C}\times (\text{OAT}-(15-\frac{2\times \text{elevation}}{1000}))-\text{wing anti-ice correction}-\text{engine anti-ice correction} = {{base}}-\frac{0.2\times {{elev}} }{1000}-0.1\times ({{temp}}-(15-\frac{2\times {{elev}} }{1000}))-1-0.5 = \mathbf{ {{answer}}\ \text{%} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} %**: applies only the engine anti-ice correction and forgets the wing anti-ice correction.
        - **{{d2}} %**: forgets the temperature correction.
        - **{{d3}} %**: adds the elevation correction instead of subtracting it and forgets the temperature correction.
