      presets:
        - correctAnswers:
            - text: Use the airborne weather radar and visual cues to circumnavigate the CB cells. Turbulence can be expected circumnavigating the CB cells.
          wrongAnswers:
            - text: It is safe to fly straight through the cold front at FL360 and keep the flight plan route. Only up to moderate turbulence can be expected within the cloud tops, without further hazards for flight safety.
