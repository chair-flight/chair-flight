  templates:
    - type: simple
      question: Why are Gridded forecasts good?
      explanation: Gridded forecasts present the data about hazards, such as CB and turbulence, over an area in a visual form, so flight crews and dispatchers can see the hazards better.
      presets:
        - correctAnswers:
            - text: Gridded forecasts help flight crews and dispatchers to visualize flight hazards better.
          wrongAnswers:
            - text: Gridded forecasts are an in-flight weather updating tool, so it gives pilots real-time weather.
            - text: Gridded forecasts allow a more straightforward weather prediction when using grid navigation.
            - text: Gridded forecasts give automatic temperature corrections for non-precision approaches via satellite.
