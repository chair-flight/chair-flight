    - type: definition
      question: What is the right granted by the {term} of the air?
      explanation: |-
        The first two freedoms are the technical freedoms. They let an aircraft cross or stop in another State without carrying traffic. The last three are the commercial freedoms, because they let an airline earn revenue by carrying passengers and cargo to, from or beyond another State.

        {table}
      options:
        - id: OFQ3J7K2M
          term: First freedom
          definition: To fly across the territory of another State without landing.
        - id: OS8N4W6RX
          term: Second freedom
          definition: To land in another State for non-traffic purposes, such as a technical stop.
        - id: OT5H9C1LD
          term: Third freedom
          definition: To put down, in another State, traffic coming from the home State of the carrier.
        - id: OF2V7B3ZP
          term: Fourth freedom
          definition: To take on, in another State, traffic destined for the home State of the carrier.
        - id: OF6Y1G8TA
          term: Fifth freedom
          definition: To put down and take on, in another State, traffic coming from or destined to a third State.
      fakeOptions:
        - id: OX8E2N7KV
          definition: To carry traffic between two other States by stopping in the home State of the carrier.
        - id: OX5W9R3FD
          definition: To carry traffic between two points within the same foreign State.
    - type: simple
      question: "An aircraft registered in State A is on the following flight: {{operation}}. Which freedom of the air does it exercise?"
      explanation: "The first two freedoms are the technical freedoms: an aircraft crosses or stops in another State without carrying traffic. The third, fourth and fifth freedoms are the commercial freedoms, because the airline earns revenue by carrying traffic. The third freedom carries traffic from the home State of the carrier to another State, and the fourth freedom carries traffic from another State back to the home State of the carrier."
      presets:
        - variables:
            operation: it flies from State A to State B and overflies State C without landing
          correctAnswers:
            - text: The first freedom.
          wrongAnswers:
            - text: The second freedom.
