  learningObjectiveIds:
    - 010.01.01.02.02
  templates:
    - type: simple
      question: An aircraft is flying from the USA to Germany. the pilot is told that they are no longer allowed to enter Germany. All mentioned countries signed the International Aviation Convention. This situation is…
      explanation: |-
        ### Chicago Convention (1944), Article 1

        > The contracting States recognize that every State has **complete and exclusive sovereignty over the airspace above its territory**.

        Germany can therefore refuse entry. Signing the Convention does not oblige a State to admit any aircraft.
      presets:
        - correctAnswers:
            - text: legal, because each contracting state has the right of sovereignty over its own airspace.
          wrongAnswers:
            - text: illegal, because they signed the convention and therefore are obliged to permit the aircraft to land.
            - text: legal, because the US is not part of EASA.
            - text: illegal, because a permission to enter cannot be withdrawn once given.
- id: QWPMV
  subjectId: "010"
  chapterId: "010.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-105955
    - AVEXAM-86435
    - ATPLQ-103912
    - BGS-100856
  annexes: []
  learningObjectiveIds:
    - 010.01.01.02.02
  templates:
    - type: simple
      question: According to ICAO, who is responsible for providing air traffic services over the high seas?
      explanation: |-
        ### Chicago Convention (1944), Article 12

        > […] **Over the high seas, the rules in force shall be those established under this Convention.** […]

        No State owns the high seas, so nothing there is tied to a national territory. Under Annex 11 (2.1.2), regional air navigation agreements decide which parts of that airspace get air traffic services, and a Contracting State that has accepted the responsibility provides them. Being the nearest State, the nearest ICAO regional office, or a historical arrangement does not give that responsibility.

        Example: Portugal has accepted responsibility for the Santa Maria Oceanic FIR, a vast part of the North Atlantic. Its air traffic services are provided from the Azores, even though most of that airspace is far from Portuguese territory.
      presets:
        - correctAnswers:
            - text: A Contracting State that has accepted the responsibility for providing those services.
          wrongAnswers:
            - text: The Member State closest to the area.
            - text: The regional ICAO office closest to the area.
            - text: "By delegation: the US over the Atlantic, Russia over the Arctic and Australia over the Pacific."
- id: QAZAW
