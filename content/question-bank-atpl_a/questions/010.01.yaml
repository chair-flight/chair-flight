      question: "Select the option which corresponds to IATA's mission statement:"
      explanation: |-
        The correct option is IATA's own mission statement:

        > IATA’s mission is to represent, lead and serve the airline industry. **IATA seeks to improve understanding of the industry among decision makers** […] **It fights for the interests of airlines across the globe**, challenging unreasonable rules and charges, holding regulators and governments to account, and striving for sensible regulation.

        The other options describe ICAO (a forum of States) and EASA (the European rule-maker), or attribute a rule-making role to IATA that it does not have.
      presets:
        - correctAnswers:
            - text: IATA’s mission is to represent, lead and serve the airline industry. IATA seeks to improve understanding of the industry among decision makers and increase awareness of the benefits that aviation brings to national and global economies. It fights for the interests of airlines across the globe, challenging unreasonable rules and charges, holding regulators and governments to account, and striving for sensible regulation.
          wrongAnswers:
            - text: IATA's mission is to serve as the global forum of States for international civil aviation. IATA provides assistance and builds aviation capacity through many other activities and the cooperation of its Member States and stakeholders.
            - text: IATA produces rules and regulations, and promotes the highest common standards of civil aviation safety and environmental protection in Asia and worldwide. It is a counterpart of EASA for countries in Asia.
            - text: IATA produces rules and regulations, and promotes the highest common standards of civil aviation safety and environmental protection in Europe and worldwide.
    - type: simple
      question: Which of these is a primary function of IATA?
      explanation: |-
        IATA describes its mission as follows:

        > IATA’s mission is to represent, lead and serve the airline industry. […] **It fights for the interests of airlines across the globe**, challenging unreasonable rules and charges, holding regulators and governments to account, and striving for sensible regulation.

        IATA is the airlines' trade body, so it tackles the critical issues of the industry on their behalf. It does not act as their lawyer, and it does not set policy for individual airlines.
      presets:
        - correctAnswers:
            - text: To tackle critical issues in Aviation.
          wrongAnswers:
            - text: To help airlines if they were indicted by a customer.
            - text: To give individual airlines policy guidelines.
            - text: To perform the job of a lawyer in order to represent an Airline when they are being sued.
    - type: simple
      question: Which one of the following statements applies to the general organisation and objectives of the IATA? – The IATA is...
      explanation: |-
        IATA describes its mission as follows:

        > IATA’s mission is to **represent, lead and serve the airline industry**. […]

        IATA is a trade body of airlines. It is not a United Nations organisation and it does not develop trade agreements.
      presets:
        - correctAnswers:
            - text: an international trade body which represents, leads and serves airline business in general.
          wrongAnswers:
            - text: a specialised organisation of the United Nations for international air traffic agreements.
            - text: an international organisation for innovation, efficient co-operation and assistance for telecommunications in aviation.
            - text: a multi-national organisation for developing trade agreements in international aviation (scheduled and non-scheduled services).
