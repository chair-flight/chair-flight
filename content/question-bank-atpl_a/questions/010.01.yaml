  templates:
    - type: simple
      question: What does "Hard Law" include? (EASA regulatory material)
      explanation: |-
        Hard law is the binding material: the Basic Regulation, the delegated acts, the implementing acts and the implementing rules. These are adopted by the European Parliament and the Council or by the European Commission.

        Soft law is non-binding and is issued by EASA under Article 76(3) of the Basic Regulation: certification specifications (CS), acceptable means of compliance (AMC) and guidance material (GM).

        "Hard law" and "soft law" are EASA's own names for these two groups. The Basic Regulation does not use them.
      presets:
        - correctAnswers:
            - text: Regulations, Delegated Acts, Implementing Acts and Implementing Rules.
          wrongAnswers:
            - text: Certification Specifications, Acceptable Means of Compliance and Guidance Material.
            - text: Guidance Material, Regulations, Delegated Acts and Implementing Acts.
            - text: Implementing Rules, Implementing Acts and Certification Specifications.
    - type: simple
      question: EASA is responsible for proposing hard law, such...
      explanation: |-
        ### Regulation (EU) 2018/1139 (Basic Regulation), Article 76(1)

        > The Agency shall, upon request, **assist the Commission in the preparation of proposals** for amendments to this Regulation and of **delegated and implementing acts** to be adopted on the basis of this Regulation […]. The documents that the Agency submits to the Commission for those purposes shall take the form of opinions.

        ### Regulation (EU) 2018/1139 (Basic Regulation), Article 76(3)

        > The Agency shall, in accordance with Article 115 and with the applicable delegated and implementing acts adopted on the basis of this Regulation, **issue certification specifications and other detailed specifications, acceptable means of compliance and guidance material** for the application of this Regulation and of the delegated and implementing acts adopted on the basis thereof.

        EASA proposes hard law, and the Commission adopts it. EASA publishes soft law itself.
      presets:
        - correctAnswers:
            - text: Regulations, Implementing Acts, and Delegated Acts, and publishing soft law, such as Acceptable Means of Compliance and Guidance Material.
          wrongAnswers:
            - text: Acceptable Means of Compliance and Guidance Material, and publishing soft law, such as Regulations, Implementing Acts, and Delegated Acts.
            - text: Acceptable Means of Compliance, and publishing soft law, such as Guidance Material.
            - text: Guidance Material, and publishing soft law, such as Acceptable Means of Compliance.
    - type: simple
      question: What does the structure of the regulatory material related to EASA involve?
      explanation: |-
        Hard law is the binding material: the Basic Regulation, the delegated acts, the implementing acts and the implementing rules. These are adopted by the European Parliament and the Council or by the European Commission.

        Soft law is non-binding and is issued by EASA under Article 76(3) of the Basic Regulation: certification specifications (CS), acceptable means of compliance (AMC) and guidance material (GM).

        "Hard law" and "soft law" are EASA's own names for these two groups. The Basic Regulation does not use them.
      presets:
        - correctAnswers:
            - text: A unique structure of hard law (regulations, delegated acts, implementing acts and implementing rules) and soft law (certification specifications, acceptable means of compliance and guidance material).
          wrongAnswers:
            - text: Hard law only (regulations, delegated acts, implementing acts and implementing rules).
            - text: Soft law only (certification specifications, acceptable means of compliance and guidance material).
            - text: Hard law (certification specifications and acceptable means of compliance) and soft law (regulations, delegated acts and implementing acts).
