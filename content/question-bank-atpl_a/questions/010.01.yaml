  templates:
    - type: simple
      question: According to ICAO Doc 7300/9 Convention on International Civil Aviation, Article ‘Landing at customs airport’, what statement is correct?
      explanation: |-
        ### Chicago Convention (1944), Article 10

        > Except in a case where, under the terms of this Convention or a special authorization, aircraft are permitted to **cross the territory of a contracting State without landing**, every aircraft which enters the territory of a contracting State shall, **if the regulations of that State so require, land at an airport designated by that State for the purpose of customs and other examination**. On departure […] such aircraft shall depart from a similarly designated customs airport. Particulars of all designated customs airports shall be published by the State and transmitted to the International Civil Aviation Organization […].
      presets:
        - correctAnswers:
            - text: Aircraft are permitted to cross the territory of a Contracting State without landing, unless the regulations of that State require you to land for customs examination.
          wrongAnswers:
            - text: Aircraft departing from one Contracting State to another Contracting State may depart from a non-customs airport provided that the destination airport has customs facilities.
            - text: Aircraft from another Contracting State may land at a non-designated customs airport for the purpose of re-fuelling and then continue to another Contracting State.
            - text: Particulars of all designated customs airports shall be published by the State and transmitted to the International Air Transport Association (IATA).
