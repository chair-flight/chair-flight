  templates:
    - type: simple
      question: The cabin crew notify the aircraft commander that they have reasonable grounds to believe that a person is about to commit an unlawful act on board the aircraft. What action should the commander take?
      explanation: |-
        ### Tokyo Convention (1963), Article 6

        > 1. The aircraft commander may, when he has **reasonable grounds to believe that a person has committed, or is about to commit**, on board the aircraft, an offence or act contemplated in Article 1, paragraph 1, **impose upon such person reasonable measures including restraint** which are necessary:
        >    (a) to protect the safety of the aircraft, or of persons or property therein; or
        >    (b) to maintain good order and discipline on board; or
        >    (c) to enable him to deliver such person to competent authorities or to disembark him in accordance with the provisions of this Chapter.
        >
        > 2. The aircraft commander may require or authorize the assistance of other crew members and may request or authorize, **but not require**, the assistance of passengers to restrain any person whom he is entitled to restrain.

        The commander does not have to wait for the act: "about to commit" is enough to impose restraint. Crew can be told to help, but passengers can only be **requested** to help, so any option that **requires** passengers  to assist is wrong.
      presets:
        - correctAnswers:
            - text: Impose upon that person reasonable measures, including restraining that person, to maintain good order on board.
            - text: Take necessary actions to restrain or secure the passenger in question.
            - text: Request that passengers help the cabin crew to restrain that person.
          wrongAnswers:
            - text: Immediately inform ATC and squawk Code 7600.
            - text: Leave controlled airspace and land at the nearest suitable aerodrome.
            - text: Require passengers to provide the cabin crew with extra assistance to restrain that person, in order to protect the safety of the aircraft.
            - text: Conduct an emergency descent and land as soon as possible.
            - text: Not require or authorise the assistance of other crew members.
            - text: Divert and land as soon as possible.
            - text: Wait until the person commits the act before taking any action.
