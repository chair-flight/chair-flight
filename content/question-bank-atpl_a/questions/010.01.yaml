  annexes: []
  learningObjectiveIds:
    - 010.01.01.02.01
  templates:
    - type: simple
      question: In the event of non-compliance with an International Standard, what is the obligation of the State?
      explanation: |-
        ### Chicago Convention (1944), Article 38

        > Any State which finds it impracticable to comply in all respects with any such international standard or procedure, […] or which deems it necessary to adopt regulations or practices differing in any particular respect from those established by an international standard, **shall give immediate notification to the International Civil Aviation Organization of the differences** between its own practice and that established by the international standard. In the case of amendments to international standards, any State which does not make the appropriate amendments to its own regulations or practices **shall give notice to the Council within sixty days** of the adoption of the amendment to the international standard, or indicate the action which it proposes to take. […]

        The State must therefore notify ICAO, and publish the differences in the national AIP so that pilots are aware of these differences.
      presets:
        - correctAnswers:
            - text: The State must notify the Council of ICAO and publish such differences in the national AIP.
          wrongAnswers:
            - text: The State must publish such differences in the national AIP only.
            - text: Binding for all member states.
            - text: Modifications to International Standards shall be published in the national AIP only; differences to Recommended Practices have to be notified to ICAO.
