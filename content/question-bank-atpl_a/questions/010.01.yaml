    - 010.01.01.03.01
  templates:
    - type: simple
      question: "Select the option which corresponds to ICAO's mission statement:"
      explanation: |-
        The correct option is ICAO's own mission statement, not a legal text. ICAO develops Standards and Recommended Practices for the States; it does not approve airlines, aircraft or licences. The other options describe IATA (the airlines' trade body) and EASA (the European rule-maker).

        Remember: ICAO is the States' forum, IATA is the airlines' club, EASA is Europe's rule-maker.
      presets:
        - correctAnswers:
            - text: ICAO's mission is to serve as the global forum of States for international civil aviation. ICAO develops policies and Standards, undertakes compliance audits, performs studies and analyses, provides assistance and builds aviation capacity through many other activities and the cooperation of its Member States and stakeholders.
          wrongAnswers:
            - text: ICAO's mission is to approve new international airlines, aircrafts and pilot's licenses.
            - text: ICAO's mission is to represent, lead and serve the airline industry. IATA seeks to improve understanding of the industry among decision makers and increase awareness of the benefits that aviation brings to national and global economies. It fights for the interests of airlines across the globe, challenging unreasonable rules and charges, holding regulators and governments to account, and striving for sensible regulation.
            - text: ICAO produces rules and regulations, and promotes the highest common standards of civil aviation safety and environmental protection in Europe and worldwide.
    - type: simple
      question: One of the main objectives of ICAO is to..
      explanation: |-
        ### Chicago Convention (1944), Article 44

        > The aims and objectives of the Organization are to **develop the principles and techniques of international air navigation** and to foster the planning and development of international air transport so as to: […]

        Approving airlines or fares is not among ICAO's aims.
      presets:
        - correctAnswers:
            - text: develop the principles and techniques for international air navigation.
          wrongAnswers:
            - text: approve new international airlines operating jet aircraft.
            - text: approve air fares set by international airlines.
            - text: approve new international airlines.
