  annexes: []
  learningObjectiveIds:
    - 010.01.02.05.01
    - 010.01.02.05.02
  templates:
    - type: simple
      question: Why must the airline issue a ticket?
      explanation: |-
        ### Montreal Convention (1999), Article 3

        > 1. In respect of carriage of passengers, **an individual or collective document of carriage shall be delivered** containing:
        >    (a) an indication of the places of departure and destination;
        >    (b) if the places of departure and destination are within the territory of a single State Party, one or more agreed stopping places being within the territory of another State, an indication of at least one such stopping place.

        > 5. Non-compliance with the provisions of the foregoing paragraphs **shall not affect the existence or the validity of the contract of carriage**, which shall, nonetheless, be subject to the rules of this Convention including those relating to limitation of liability.

        Paragraph 1 defines what a ticket is without ever calling it a ticket.
      presets:
        - correctAnswers:
            - text: To establish a legal contract between the airline and the passenger.
          wrongAnswers:
            - text: To document that a flight has been made.
            - text: Official identification documents of the pax.
            - text: "To ensure that, if the passenger fails to attend the flight, they have the right to board another flight. "
    - type: simple
      question: A passenger has lost their ticket, which was issued by an airline. In this case\_\_.
      explanation: |-
        ### Montreal Convention (1999), Article 3

        > 1. In respect of carriage of passengers, **an individual or collective document of carriage shall be delivered** containing:
        >    (a) an indication of the places of departure and destination;
        >    (b) if the places of departure and destination are within the territory of a single State Party, one or more agreed stopping places being within the territory of another State, an indication of at least one such stopping place.

        > 5. Non-compliance with the provisions of the foregoing paragraphs **shall not affect the existence or the validity of the contract of carriage**, which shall, nonetheless, be subject to the rules of this Convention including those relating to limitation of liability.

        Paragraph 1 defines what a ticket is without ever calling it a ticket.
      presets:
        - correctAnswers:
            - text: The contract of carriage is NOT affected.
          wrongAnswers:
            - text: The airline CANNOT carry the passenger to their destination.
            - text: A penalty fee will be applied, depending on the number of available seats on the aircraft.
            - text: The passenger must buy another ticket for the same flight.
- id: QYGEQ
  subjectId: "010"
  chapterId: "010.01"
  relatedQuestionIds: []
  externalQuestionIds:
