  templates:
    - type: simple
      question: According to the Montreal Convention of 1999 (ICAO Doc 9740), a carrier is liable for damage sustained in case of destruction or loss of, or of damage to, baggage upon condition only that the event which caused the destruction, loss or damage took place…
      explanation: |-
        ### Montreal Convention (1999), Article 17(2)

        > The carrier is liable for damage sustained in case of destruction or loss of, or of damage to, checked baggage upon condition only that the event which caused the destruction, loss or damage **took place on board the aircraft or during any period within which the checked baggage was in the charge of the carrier**. […] In the case of unchecked baggage, including personal items, the carrier is liable if the damage resulted from its fault or that of its servants or agents.

        For checked baggage, what matters is who has charge of it, not where it is. The airport perimeter and the check-in desk play no part in the test.
      presets:
        - correctAnswers:
            - text: On board the aircraft or during any period within which the checked baggage was in the charge of the carrier.
          wrongAnswers:
            - text: Whether in the possession of the passenger or the baggage handling service.
            - text: After the passenger has claimed the baggage and while the baggage is still within the perimeter of aerodrome.
            - text: Before check-in, while the baggage is within the perimeter of the aerodrome.
    - type: simple
      question: According to the 1999 Montreal Convention, when is an airline responsible for the passenger's checked baggage?
      explanation: |-
        ### Montreal Convention (1999), Article 17(2)

        > The carrier is liable for damage sustained in case of destruction or loss of, or of damage to, checked baggage upon condition only that the event which caused the destruction, loss or damage **took place on board the aircraft or during any period within which the checked baggage was in the charge of the carrier**. […]

        The airline has charge of the checked baggage from check-in until off-loading.
      presets:
        - correctAnswers:
            - text: From the baggage check-in until its off-loading.
          wrongAnswers:
            - text: From entering the departure airport until leaving at the destination airport.
            - text: From the moment of the check-in until the passenger leaves the plane.
            - text: From the moment the baggage is stowed in the aircraft until off-loading it.
