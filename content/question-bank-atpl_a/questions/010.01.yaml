  templates:
    - type: simple
      question: ICAO publications – Standards defined in the Annexes to the Chicago convention are...
      explanation: |-
        ### Chicago Convention (1944), Article 38

        > Any State which finds it impracticable to comply in all respects with any such international standard or procedure, […] or which deems it necessary to adopt regulations or practices differing in any particular respect from those established by an international standard, **shall give immediate notification to the International Civil Aviation Organization of the differences** between its own practice and that established by the international standard. […]

        So Standards bind the Contracting States, but a State may deviate from one if it notifies ICAO of the difference.
      presets:
        - correctAnswers:
            - text: binding for the Contracting States unless they have notified ICAO about a national difference.
          wrongAnswers:
            - text: advice and guidance for the aviation related legislation within the legal framework of the Contracting States.
            - text: recommended explanatory material for the aviation related legislation of the Contracting States.
            - text: binding for all Contracting States without deviation or exception.
    - type: simple
      question: The Annexes established by the International Civil Aviation Organisation contain...
      explanation: |-
        ### Chicago Convention (1944), Article 37

        > […] the International Civil Aviation Organization shall adopt and amend from time to time, as may be necessary, **international standards and recommended practices and procedures** dealing with: (a) Communications systems and air navigation aids, including ground marking; […]

        The Annexes contain these Standards and Recommended Practices. A State that does not follow a Standard must notify ICAO of the difference (Article 38).
      presets:
        - correctAnswers:
            - text: Standards and Recommended Practices to be adopted by Contracting States.
          wrongAnswers:
            - text: proposals for aeronautical regulations in the form of 19 Annexes.
            - text: aeronautical standards binding in all states.
            - text: Standards and Recommended Practices applied without exception by all States, signatory to the Chicago Convention.
- id: QUZQL
  subjectId: "010"
  chapterId: "010.01"
  relatedQuestionIds: []
