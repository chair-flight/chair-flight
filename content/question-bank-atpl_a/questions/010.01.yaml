    - 010.01.01.03.02
  templates:
    - type: simple
      question: Who is the governing body of ICAO?
      explanation: |-
        ### Chicago Convention (1944), Article 43

        > An organization to be named the International Civil Aviation Organization is formed by the Convention. It is made up of an Assembly, a Council, and such other bodies as may be necessary.

        ### Article 50(a)

        > The Council shall be a **permanent body responsible to the Assembly**. […]

        The Council is the permanent body that runs ICAO between Assembly meetings, and it is the one ICAO calls its governing body. The Assembly elects the Council's members.
      presets:
        - correctAnswers:
            - text: The Council.
          wrongAnswers:
            - text: The Authority.
            - text: The Secretariat.
            - text: The Assembly.
