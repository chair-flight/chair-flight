  templates:
    - type: simple
      question: What do you understand by “EASA certification specifications”?
      explanation: |-
        ### Regulation (EU) 2018/1139 (Basic Regulation), Article 76(3)

        > The Agency shall, in accordance with Article 115 and with the applicable delegated and implementing acts adopted on the basis of this Regulation, **issue certification specifications and other detailed specifications, acceptable means of compliance and guidance material** for the application of this Regulation and of the delegated and implementing acts adopted on the basis thereof.

        Certification specifications (CS) are issued by EASA itself, not adopted by the Commission as an act, so they are soft law and are non-binding. They are technical standards for showing that the essential requirements of the Basic Regulation are met. The explanatory and interpretation material in the third option is guidance material (GM), not a CS. The binding rules are the Commission's delegated and implementing acts.
      presets:
        - correctAnswers:
            - text: They are non-binding technical standards, adopted by EASA, to meet the essential requirements of the basic regulation.
          wrongAnswers:
            - text: They are binding technical standards, adopted by EASA, to meet the essential requirements of the basic regulation.
            - text: They are non-binding explanatory and interpretation materials on how to achieve the requirements contained in the basic regulation.
            - text: They are non-binding special detailed technical specifications determined by the NAA for an aerodrome.
