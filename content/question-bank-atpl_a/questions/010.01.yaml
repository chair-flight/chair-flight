    - 010.01.04.01.01
    - 010.01.04.01.02
  templates:
    - type: simple
      question: What is the role and objective of EASA?
      explanation: |-
        ### Regulation (EU) 2018/1139 (Basic Regulation), Article 76(1)

        > The Agency shall, upon request, **assist the Commission in the preparation of proposals** for amendments to this Regulation and of **delegated and implementing acts** to be adopted on the basis of this Regulation […]. The documents that the Agency submits to the Commission for those purposes shall take the form of opinions.

        ### Article 1(1)

        > The principal objective of this Regulation is to establish and maintain **a high uniform level of civil aviation safety** in the Union.

        ### Article 1(2)(c)

        > This Regulation further aims to: […] contribute to **a high, uniform level of environmental protection**;

        EASA proposes, the European Commission adopts. The Agency's proposals reach the Commission as opinions, not the National Aviation Authorities, and the Agency does not adopt implementing rules itself.
      presets:
        - correctAnswers:
            - text: EASA proposes implementing rules to the European Commission and promotes the highest common standards of safety and environmental protection in civil aviation.
          wrongAnswers:
            - text: EASA proposes rules to the National Aviation Authorities and promotes the highest common standards of safety and environmental protection in civil aviation.
            - text: EASA makes only rule propositions to the National Aviation Authorities without the obligation to implement these.
            - text: EASA proposes guidelines to the aviation industry and promotes the highest common standards of safety and environmental protection in civil aviation.
