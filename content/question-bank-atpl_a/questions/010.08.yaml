      presets:
        - correctAnswers:
            - text: an AIP Amendment and be made available by the most expeditious means.
          wrongAnswers:
            - text: an AIP Supplement and be made available when possible.
            - text: an AIP Supplement and be made available by the most expeditious means.
            - text: a NOTAM and be made available when possible.
