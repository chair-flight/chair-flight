      question: Which of the following documents deals with air navigation and air traffic management?
      explanation: |-
        ### Regulation (EU) 2017/373, Article 1

        > This Regulation lays down common requirements for: (a) the provision of **air traffic management and air navigation services** ('ATM/ANS') for general air traffic, in particular for the legal or natural persons providing those services and functions; (b) the competent authorities and the qualified entities acting on their behalf, which perform certification, oversight and enforcement tasks in respect of the services referred to in point (a); (c) the rules and procedures for the **design of airspace structures**.
      presets:
