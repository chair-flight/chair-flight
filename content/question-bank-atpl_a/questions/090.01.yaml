  learningObjectiveIds:
    - 090.01.01.04.01
  templates:
    - type: simple
      question: "An aircraft is in cruise when the pilots hear the following radio transmission: “PAN PAN PAN PAN PAN PAN, Langen Radar, D-JLAA, we have a sick passenger, request vector to Augsburg airport, position 20 NM west of Augsburg FL160, heading 285º.” What category of radio message is this?"
      explanation: |-
        ### ICAO Annex 10, Volume II, 5.3.1.2

        > The radiotelephony distress signal MAYDAY and the radiotelephony urgency signal PAN PAN shall be used at the commencement of the first distress and urgency communication respectively.

        PAN PAN is the urgency signal. A sick passenger concerns the safety of a person on board but does not need immediate assistance, so the message is an urgency message. A distress message (MAYDAY) is reserved for grave and imminent danger requiring immediate assistance.
      presets:
        - correctAnswers:
            - text: Urgency message
          wrongAnswers:
            - text: Distress message
            - text: Flight safety message
            - text: Flight regulatory message
