  templates:
    - type: definition
      question: What does “{term}” mean?
      explanation: |-
        ### ICAO Annex 10, Volume II, 1.3 Communication methods

        > **Air-ground communication.** Two-way communication between aircraft and stations or locations on the surface of the earth.
        >
        > **Air-to-ground communication.** One-way communication from aircraft to stations or locations on the surface of the earth.
        >
        > **Ground-to-air communication.** One-way communication from stations or locations on the surface of the earth to aircraft.

        There is a tricky distinction between **Air-ground** (both ways) and Air **to** Ground (one way).

        | Term                        | Direction                   | 
        | --------------------------- | --------------------------- |
        | Air-ground communication    | Two-way                     |
        | Air-to-ground communication | One-way, aircraft to ground |
        | Ground-to-air communication | One-way, ground to aircraft |
      options:
        - id: DIRECTION1
          term: air–ground communication
          definition: Two-way communication between aircraft and stations or locations on the Earth’s surface.
        - id: DIRECTION2
          term: air-to-ground communication
          definition: One-way communication sent from aircraft to stations or locations on the Earth’s surface.
        - id: DIRECTION3
          term: ground-to-air communication
          definition: One-way communication sent from stations or locations on the Earth’s surface to aircraft.
      fakeOptions:
        - id: DIRECTION4
          definition: Two-way communication between aircraft in flight.
    - type: simple
      question: |-
        Which term describes the following?

        {{definition}}
      explanation: |-
        ### ICAO Annex 10, Volume II, 1.3 Communication methods

        > **Air-ground communication.** Two-way communication between aircraft and stations or locations on the surface of the earth.
        >
        > **Air-to-ground communication.** One-way communication from aircraft to stations or locations on the surface of the earth.
        >
        > **Ground-to-air communication.** One-way communication from stations or locations on the surface of the earth to aircraft.

        There is a tricky distinction between **Air-ground** (both ways) and Air **to** Ground (one way).

        | Term                        | Direction                   | 
        | --------------------------- | --------------------------- |
        | Air-ground communication    | Two-way                     |
        | Air-to-ground communication | One-way, aircraft to ground |
        | Ground-to-air communication | One-way, ground to aircraft |
      presets:
        - variables:
            definition: Two-way communication between aircraft and stations or locations on the Earth’s surface.
          correctAnswers:
            - text: air–ground communication
          wrongAnswers:
            - text: air-to-ground communication
            - text: ground-to-air communication
            - text: air-to-air communication
        - variables:
            definition: One-way communication sent from aircraft to stations or locations on the Earth’s surface.
          correctAnswers:
            - text: air-to-ground communication
          wrongAnswers:
            - text: air–ground communication
            - text: ground-to-air communication
            - text: air-to-air communication
        - variables:
            definition: One-way communication sent from stations or locations on the Earth’s surface to aircraft.
          correctAnswers:
            - text: ground-to-air communication
          wrongAnswers:
            - text: air–ground communication
            - text: air-to-ground communication
            - text: air-to-air communication
