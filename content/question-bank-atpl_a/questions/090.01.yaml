- id: QPPMV
  subjectId: "090"
  chapterId: "090.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-927575
    - AVEXAM-62036
    - BGS-900237
    - AVEXAM-91549
  annexes: []
  learningObjectiveIds:
    - 090.01.01.01.03
  templates:
    - type: simple
      question: An aircraft is on the approach to land. At what point during the approach would the pilot report FINAL?
      explanation: |-
        ### ICAO Doc 4444, 12.3.4.15 Approach instructions

        > Note.— The report "LONG FINAL" is made when aircraft turn on to final approach at a distance greater than 7 km (4 NM) from touchdown or when an aircraft on a straight-in approach is 15 km (8 NM) from touchdown. In both cases a report "FINAL" is required at **7 km (4 NM) from touchdown**.

        The "FINAL" report is tied to distance, not to visual contact with the aerodrome or to being established on the centreline. A pilot turning onto final further out than 4 NM, or 8 NM on a straight-in approach, reports "LONG FINAL" first and then "FINAL" at 4 NM from touchdown.
      presets:
        - correctAnswers:
            - text: At a distance of 4 NM or less from the landing runway.
          wrongAnswers:
            - text: As soon as visual contact with the aerodrome is established.
            - text: At a distance of 5 NM or greater from touchdown.
            - text: When established on the extended centreline of the runway.
    - type: simple
      question: A "FINAL" call is made when the aircraft turns on to final approach within ___ from the landing threshold.
      explanation: |-
        ### ICAO Doc 4444, 12.3.4.15 Approach instructions

        > Note.— The report "LONG FINAL" is made when aircraft turn on to final approach at a distance greater than 7 km (4 NM) from touchdown or when an aircraft on a straight-in approach is 15 km (8 NM) from touchdown. In both cases a report "FINAL" is required at **7 km (4 NM) from touchdown**.

        The "FINAL" report is tied to distance, not to visual contact with the aerodrome or to being established on the centreline. A pilot turning onto final further out than 4 NM, or 8 NM on a straight-in approach, reports "LONG FINAL" first and then "FINAL" at 4 NM from touchdown.
      presets:
        - correctAnswers:
            - text: 4 NM
          wrongAnswers:
            - text: between 4 NM and 8 NM
            - text: 8 km
            - text: 8 NM
    - type: simple
      question: When does a pilot report "LONG FINAL"?
      explanation: |-
        ### ICAO Doc 4444, 12.3.4.15 Approach instructions

        > Note.— The report "LONG FINAL" is made when aircraft turn on to final approach at a distance **greater than 7 km (4 NM) from touchdown** or when an aircraft on a **straight-in approach is 15 km (8 NM) from touchdown**. In both cases a report "FINAL" is required at 7 km (4 NM) from touchdown.

        "LONG FINAL" is reported further out than "FINAL". Both reports are tied to distance from touchdown, not to visual contact with the aerodrome or to being established on the centreline. At 4 NM or less from touchdown the report is "FINAL".
      presets:
        - correctAnswers:
            - text: When turning on to final approach at more than 4 NM from touchdown, or when 8 NM from touchdown on a straight-in approach.
          wrongAnswers:
            - text: When turning on to final approach at 4 NM or less from touchdown.
            - text: As soon as visual contact with the aerodrome is established.
            - text: When established on the extended centreline of the runway.
