    - 062.01.02.01.02
  templates:
    - type: simple
      question: "A dipole antenna in its simplest form, suited for a frequency of {{freq}} MHz, should have a length of (in cm):"
      explanation: |-
        A simple dipole is half a wavelength long. The wavelength in metres equals 300 divided by the frequency in MHz, so half the wavelength in cm equals 15000 divided by the frequency in MHz.

        **Solution**

        $$
        \frac{15000}{\text{Frequency}} = \frac{15000}{ {{freq}} } = \mathbf{ {{answer}}\ \text{cm} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} cm**: a third of the wavelength instead of half of it.
        - **{{d2}} cm**: the full wavelength instead of half of it.
        - **{{d3}} cm**: three quarters of the wavelength.
        - **{{d4}} cm**: a quarter of the wavelength.
      presets:
        - variables:
            freq: 110
            answer: 136
            d1: 91
            d2: 273
            d3: 205
            d4: 68
          correctAnswers:
            - text: 136 cm
          wrongAnswers:
            - text: 91 cm
            - text: 205 cm
            - text: 68 cm
            - text: 273 cm
        - variables:
            freq: 121.5
            answer: 123
            d1: 82
            d2: 247
            d3: 185
            d4: 62
          correctAnswers:
            - text: 123 cm
          wrongAnswers:
            - text: 82 cm
            - text: 185 cm
            - text: 62 cm
            - text: 247 cm
        - variables:
            freq: 146
            answer: 103
            d1: 68
            d2: 205
