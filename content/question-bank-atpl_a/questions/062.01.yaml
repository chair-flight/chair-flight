      question: |-
        An airborne weather radar operates at a frequency of {{freq}} GHz.

        What is the corresponding wavelength in centimetres?
      explanation: |-
        Radio waves travel at the speed of light, about 300 000 km per second, so the wavelength is that speed divided by the frequency. With the frequency in GHz, the wavelength comes out in centimetres as 30 divided by the frequency.

        **Solution**

        - $$\frac{30}{\text{Frequency}} = \frac{30}{ {{freq}} } = \mathbf{ {{answer}}\ \text{cm} }$$

        ## Why the other answers are wrong

        - **{{d1}} cm**: uses 300 instead of 30, which is out by a factor of ten.
        - **{{d2}} cm**: multiplies by the frequency instead of dividing.
        - **{{d3}} cm**: gives the wavelength in metres without converting it to centimetres.
        - **{{d4}} cm**: halves the wavelength.
