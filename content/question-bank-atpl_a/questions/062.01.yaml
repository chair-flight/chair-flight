    - 062.01.01.02.04
  templates:
    - type: simple
      question: What is the wavelength of a non-directional beacon (NDB) transmitting on {{freq}} kHz? Give the answer in metres.
      explanation: |-
        A radio wave travels at the speed of light, about 300 000 000 m/s. The wavelength is that speed divided by the frequency in hertz. The frequency is given in kHz, so the same result is found by dividing 300 000 by the frequency in kHz.

        **Solution**

        $$
        \frac{300000}{\text{Frequency}} = \frac{300000}{ {{freq}} } = \mathbf{ {{answer}}\ \text{m} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} m**: a factor of ten too small, the decimal point is in the wrong place.
        - **{{d2}} m**: a factor of ten too large.
        - **{{d3}} m**: uses 3 000 instead of 300 000 in the calculation.
        - **{{d4}} m**: multiplies by the frequency instead of dividing.
      presets:
        - variables:
            freq: 375
            answer: 800
            d1: 80
            d2: 8000
            d3: 8
            d4: 112500000
          correctAnswers:
            - text: 800 m
          wrongAnswers:
            - text: 80 m
            - text: 8 m
            - text: 112500000 m
            - text: 8000 m
        - variables:
            freq: 300
            answer: 1000
            d1: 100
            d2: 10000
            d3: 10
            d4: 90000000
          correctAnswers:
            - text: 1000 m
          wrongAnswers:
            - text: 100 m
            - text: 10 m
            - text: 90000000 m
            - text: 10000 m
