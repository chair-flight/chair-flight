      question: |-
        A radio wave has a frequency of {{freq}} kHz.

        What is its wavelength in metres?
      explanation: |-
        Wavelength is the speed of light divided by the frequency. The speed of light is 300 000 km/s, or 3 × 10^8 m/s. A kilohertz is 1000 Hz, so with the frequency in kHz the wavelength in metres is 300 000 divided by the frequency.

        **Solution**

        - $$\frac{300000}{\text{Frequency}} = \frac{300000}{ {{freq}} } = \mathbf{ {{answer}}\ \text{m} }$$

        ## Why the other answers are wrong

        - **{{d1}} m**: does not convert kHz to Hz, so the result is out by a factor of 1000.
        - **{{d2}} m**: has an extra factor of ten.
        - **{{d3}} m**: is a factor of ten too small.
        - **{{d4}} m**: gives half the wavelength.
