- id: QLYRO
  subjectId: "033"
  chapterId: "033.05"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-334764
    - AVEXAM-9981
    - BGS-330500
    - AVEXAM-48740
    - BGS-330960
    - ATPLQ-337424
    - BGS-330501
  annexes: []
  learningObjectiveIds:
    - 033.05.01.01.02
  templates:
    - type: simple
      question: |-
        The navigation plan reads:

        - Trip fuel: {{trip}} kg
        - Flight time: {{ftime}} min
        - Taxi fuel: {{taxi}} kg
        - Block fuel: {{block}} kg

        What endurance should be entered on the ICAO flight plan? Give the answer in hours and minutes.
      explanation: |-
        The endurance is the fuel available for the flight, which is the block fuel minus the taxi fuel. The fuel flow is the trip fuel divided by the flight time, so the endurance is the available fuel divided by that flow.

        **Solution**

        Fuel flow = {{trip}} / {{ftime}} x 60 kg/h

        Endurance = ({{block}} - {{taxi}}) / {{trip}} x {{ftime}} = $$\frac{({{block}}-{{taxi}})\times {{ftime}} }{ {{trip}} }$$ min = **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}} min**: uses the block fuel without removing the taxi fuel.
        - **{{d2}} min**: gives the flight time, which is the trip time and not the endurance.
        - **{{d3}} min**: also removes the trip fuel, which is already used on the planned flight.
        - **{{d4}} min**: uses the fuel flow in the wrong unit conversion for the endurance.
      presets:
        - variables:
            trip: 100
            ftime: 95
            taxi: 3
            block: 181
            answer: 2 h 49 min
            d1: 2 h 52 min
            d2: 1 h 35 min
            d3: 1 h 14 min
            d4: 1 h 47 min
          correctAnswers:
            - text: 2 h 49 min
          wrongAnswers:
            - text: 2 h 52 min
            - text: 1 h 14 min
            - text: 1 h 47 min
            - text: 1 h 35 min
        - variables:
            trip: 150
            ftime: 130
            taxi: 5
            block: 250
            answer: 3 h 32 min
            d1: 3 h 37 min
            d2: 2 h 10 min
            d3: 1 h 22 min
            d4: 1 h 38 min
          correctAnswers:
            - text: 3 h 32 min
          wrongAnswers:
            - text: 3 h 37 min
            - text: 1 h 22 min
            - text: 1 h 38 min
            - text: 2 h 10 min
    - type: simple
      question: |-
        The navigation plan reads:

        Trip fuel: 136 kg 
         
