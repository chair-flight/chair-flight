  templates:
    - type: simple
      question: A Multi Engine Jet Aircraft with a passenger capacity of less than 9 and a MTOM of less than 5 700 kg belongs to which performance class?
      explanation: |-
        ### Air Operations, Annex I (Definitions)

        > (93) ‘performance class A aeroplanes’ means multi-engined aeroplanes powered by turbo-propeller engines with an MOPSC of more than nine or a maximum take-off mass exceeding 5 700 kg, and **all multi-engined turbo-jet powered aeroplanes**;
      presets:
        - correctAnswers:
            - text: Performance class A, because all jet aircraft belong to this performance class.
          wrongAnswers:
            - text: Not defined.
            - text: Performance class C, because this is a special categorisation for jets with fewer than 9 passenger seats.
            - text: Performance class B, because it has a passenger seating capacity below 9 and MTOM below 5 700 kg.
