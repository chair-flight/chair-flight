  templates:
    - type: simple
      question: Night is the period between the end of (1)\_\_\_\_\_ and the beginning of (2)\_\_\_\_\_ or such other period between (3)\_\_\_\_\_ and (4)\_\_\_\_\_.
      explanation: |-
        ### Part-FCL, FCL.010 Definitions

        > ‘Night’ means the period between the **end of evening civil twilight** and the **beginning of morning civil twilight** or such other period between **sunset** and **sunrise** as may be prescribed by the appropriate authority.
      presets:
        - correctAnswers:
            - text: (1) evening civil twilight; (2) morning civil twilight; (3) sunset; (4) sunrise.
          wrongAnswers:
            - text: (1) evening civil twilight; (2) morning civil twilight; (3) sunset; (4) morning civil twilight.
            - text: (1) evening civil twilight; (2) morning civil sunrise; (3) evening civil sunset; (4) sunrise.
            - text: (1) evening civil sunset; (2) morning civil sunrise; (3) sunset; (4) sunrise.
