        - correctAnswers:
            - text: Yes, provided they made 3 take offs and landings in the preceding 90 days.
          wrongAnswers:
            - text: No, because they need to make an extra flight before taking passengers.
            - text: Yes, provided they made 3 take offs and landings in the preceding 120 days.
            - text: No, because they need to have one take off and landing in the preceding 30 days.
