- id: QURZX
  subjectId: "010"
  chapterId: "010.04"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-102155
    - BGS-100675
    - AVEXAM-23702
    - AVEXAM-70649
    - ATPLQ-109398
  annexes: []
  learningObjectiveIds:
    - 010.04.02.01.01
  templates:
    - type: simple
      question: '"The administrative action taken within the period of validity of a rating or certificate which allows the holder to continue to exercise the privileges of a rating or certificate for a further specified period consequent upon the fulfilment of specified requirements" is the definition for the term.'
      explanation: |-
        ### Part-FCL, FCL.010 Definitions

        > ‘Revalidation’ (of, e.g. a rating or certificate) means the administrative action taken **within the period of validity** of a rating or certificate which allows the holder to continue to exercise the privileges of a rating or certificate for a further specified period consequent upon the fulfilment of specified requirements.

        Remember: if it is still **valid**, you re**valid**ate it. If it has expired, you need a **new** one: re**new** it.
      presets:
        - correctAnswers:
            - text: revalidation.
          wrongAnswers:
            - text: renewal.
            - text: fulfilment.
            - text: extension
    - type: simple
      question: '"The administrative action taken after a rating or certificate has lapsed for the purpose of renewing the privileges of the rating or certificate for a further specified period consequent upon the fulfilment of specified requirements" is the definition for the term.'
      explanation: |-
        ### Part-FCL, FCL.010 Definitions

        > ‘Renewal’ (of, e.g. a rating or certificate) means the administrative action taken **after a rating or certificate has lapsed** for the purpose of renewing the privileges of the rating or certificate for a further specified period consequent upon the fulfilment of specified requirements.

        Remember: if it is still **valid**, you re**valid**ate it. If it has expired, you need a **new** one: re**new** it.
      presets:
        - correctAnswers:
            - text: renewal.
          wrongAnswers:
            - text: extension.
            - text: fulfilment.
            - text: revalidation.
    - type: definition
      question: What is the definition of "{term}"?
      explanation: |-
        ### Part-FCL, FCL.010 Definitions

        > ‘Revalidation’ […] means the administrative action taken **within the period of validity** of a rating or certificate which allows the holder to continue to exercise the privileges of a rating or certificate for a further specified period consequent upon the fulfilment of specified requirements.
        >
        > ‘Renewal’ […] means the administrative action taken **after a rating or certificate has lapsed** for the purpose of renewing the privileges of the rating or certificate for a further specified period consequent upon the fulfilment of specified requirements.

        Remember: if it is still **valid**, you re**valid**ate it. If it has expired, you need a **new** one: re**new** it.
      options:
        - id: OREVALIDN
          term: revalidation
          definition: The administrative action taken within the period of validity of a rating or certificate which allows the holder to continue to exercise the privileges for a further specified period consequent upon the fulfilment of specified requirements.
        - id: ORENEWALX
          term: renewal
          definition: The administrative action taken after a rating or certificate has lapsed for the purpose of renewing the privileges for a further specified period consequent upon the fulfilment of specified requirements.
      fakeOptions:
        - id: FEXTENSN1
          definition: The administrative action taken by the competent authority to withdraw the privileges of a rating or certificate after a failed check.
        - id: FISSUEXX2
          definition: The administrative action taken to grant a rating or certificate for the first time consequent upon the fulfilment of specified requirements.
