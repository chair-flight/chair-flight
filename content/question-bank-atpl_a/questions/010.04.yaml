      question: A pilot has completed their type rating and hasn’t flown for the preceding 60 days. Is the pilot allowed to take passengers on a flight?
      explanation: |-
        ### Part-FCL, FCL.060 Recent experience

        > (b) […] A pilot shall not operate an aircraft in commercial air transport or for carrying passengers: (1) as PIC or co-pilot unless he or she has carried out, **in the preceding 90 days, at least 3 take-offs, approaches and landings** as a pilot flying in an aircraft of the same type or class or an FFS representing that type or class. […]
