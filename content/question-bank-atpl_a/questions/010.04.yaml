        - id: FJS2IWQNW2
          definition: It is used when accepting aircraft back into service after a period of routine maintenance.
        - id: FJS2IWQNW3
          definition: That part of an aerodrome to be used for the take-off, landing and taxiing of aircraft, consisting of the movement area and the apron.
        - id: FJS2IWQNW4
          definition: That part of the aerodrome is suitable for the safe and efficient manoeuvring of aircraft; to include aprons, taxiways and runways.
        - id: FJS2IWQNW5
