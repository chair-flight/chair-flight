          definition: That part of an aerodrome to be used for the take-off, landing and taxiing of aircraft, excluding aprons.
        - id: OGPVQBSMF
          term: RESA
          definition: Runway End Safety Area
      fakeOptions:
        - id: FJS2IWQNW0
