    - 050.02.02.02.04
  templates:
    - type: simple
      question: If Paris reports a wind of 190/15KT on the METAR, what wind velocity would you expect to encounter at a height of 2000 feet above the ground?
      explanation: In the friction layer of the northern hemisphere, the wind veers with height and its speed increases. At 2 000 ft the wind is about 30° further to the right and roughly twice the surface speed, so 190/15 becomes 220/30.
      presets:
        - correctAnswers:
            - text: 220/30KT
          wrongAnswers:
            - text: 160/20KT
            - text: 220/10KT
            - text: 250/25KT
    - type: simple
      question: If Paris reports a wind of 300/12KT on the METAR, what wind velocity would you expect to encounter at a height of 2000 feet above the ground?
      explanation: Surface friction backs the wind and reduces its speed. Going up to 2 000 ft the wind veers by about 30° and the speed doubles, so 300/12 becomes about 330/25.
      presets:
        - correctAnswers:
            - text: 330/25KT
          wrongAnswers:
            - text: 270/20KT
            - text: 230/30KT
            - text: 300/25KT
    - type: simple
      question: If Paris reports a wind of 080/10KT on the METAR, what wind velocity would you expect to encounter at a height of 2000 feet above the ground?
      explanation: "The wind at 2 000 ft is not affected by friction as much as at the surface: it veers about 30° and has about twice the speed. 080/10 therefore becomes about 110/20."
      presets:
        - correctAnswers:
            - text: 110/20KT
          wrongAnswers:
            - text: 050/20KT
            - text: 080/05KT
            - text: 080/15KT
    - type: simple
      question: A Paris METAR gives a surface wind of 16020KT. Using the standard friction-layer approximation over land, what wind would you expect at about 2 000 ft AGL?
      explanation: For this approximation in the Northern Hemisphere, the wind veers about 30° and its speed roughly doubles as the effect of surface friction decreases. This is an estimate for the question, not a substitute for the forecast wind.
      presets:
        - correctAnswers:
            - text: 190° / 40 kt
          wrongAnswers:
            - text: 130° / 40 kt
            - text: 190° / 20 kt
            - text: 160° / 40 kt
- id: QOHDD
  subjectId: "050"
  chapterId: "050.02"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-506622
    - BGS-502464
    - AVEXAM-94934
  annexes: []
  learningObjectiveIds:
    - 050.02.02.02.02
  templates:
    - type: simple
      question: |-
        A student pilot carried out two identical cross-country flights at 2 000 ft, one in the afternoon and the other just after sunrise. On returning from the early morning cross-country flight the student asked why the flight was so much smoother and easier to fly.

        How can this observation be explained?
      explanation: ""
      presets:
        - correctAnswers:
            - text: The increased stability and reduced convection likely decreased the upper limit of the turbulent friction layer to below 2 000 ft on the early morning cross-country flight.
          wrongAnswers:
            - text: In the early morning, the changes in stability and the lighter winds lift the friction layer to well above 2 000 ft.
