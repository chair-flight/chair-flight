    - BGS-500173
    - ATPLQ-506217
    - ATPLQ-503676
    - BGS-500176
  annexes: []
  learningObjectiveIds:
    - 050.02.01.01.02
  templates:
    - type: simple
      question: What is the approximate speed of a {{kt}}-knot wind, expressed in m/s?
      explanation: |-
        One knot is about 0.5144 m/s, so half the speed in knots gives a quick approximation of the speed in m/s.

        **Solution**

        $$
        \frac{\text{Wind speed}}{2} = \frac{ {{kt}} }{2} = \mathbf{ {{answer}}\ \text{m/s} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} m/s**: the value in knots is copied without any conversion.
        - **{{d2}} m/s**: the speed is doubled instead of halved.
        - **{{d3}} m/s**: knots are multiplied by 1.852, the factor to km/h, which gives a value in km/h and not in m/s.
        - **{{d4}} m/s**: the speed is divided by 4 instead of 2.
      presets:
        - variables:
            kt: 20
            answer: 10
            d1: 20
            d2: 40
            d3: 37
            d4: 5
          correctAnswers:
            - text: 10 m/s
          wrongAnswers:
            - text: 20 m/s
            - text: 37 m/s
            - text: 5 m/s
            - text: 40 m/s
        - variables:
            kt: 40
            answer: 20
            d1: 40
            d2: 80
            d3: 74
            d4: 10
          correctAnswers:
            - text: 20 m/s
          wrongAnswers:
            - text: 40 m/s
            - text: 74 m/s
            - text: 10 m/s
            - text: 80 m/s
        - variables:
            kt: 30
            answer: 15
            d1: 30
            d2: 60
            d3: 56
            d4: 8
          correctAnswers:
            - text: 15 m/s
          wrongAnswers:
            - text: 30 m/s
            - text: 56 m/s
            - text: 8 m/s
            - text: 60 m/s
    - type: simple
      question: What is the approximate speed of a 25-knot wind, expressed in kilometres per hour?
      explanation: ""
      presets:
        - correctAnswers:
            - text: 45 km/h
          wrongAnswers:
            - text: 55 km/h
            - text: 35 km/h
            - text: 60 km/h
    - type: simple
