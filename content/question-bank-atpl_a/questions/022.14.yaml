  templates:
    - type: simple
      question: A Cockpit Voice Recorder must record..
      explanation: "The cockpit voice recorder records audio only: radio communications sent or received by the aeroplane, the flight crew's voices on the flight deck, their interphone and public address communications, and audio identifying navigation or approach aids. Flight data goes to the flight data recorder."
      presets:
        - correctAnswers:
            - text: "voice or audio signals identifying navigation or approach aids introduced into a headset or speaker and voice communications: transmitted from or received in the aeroplane by radio, of flight-crew members on the flight deck, of flight-crew members on the flight deck using the aeroplane's interphone system, and of flight-crew members on the flight-deck using the public address system (if installed)."
          wrongAnswers:
            - text: "flight data, voice or audio signals identifying navigation or approach aids introduced into a headset or speaker and voice communications: transmitted from or received in the aeroplane by radio, and of flight-crew members on the flight deck."
            - text: voice or audio signals identifying navigation or approach aids introduced into a headset or speaker and data recording flight and engine parameters.
            - text: "voice or audio signals identifying navigation or approach aids introduced into a headset or speaker and voice communications: transmitted from or received in the aeroplane by radio, of flight-crew members on the flight deck, of flight-crew members on the flight deck using the aeroplane's interphone system including calls between cabin crew stations (if installed), and of flight-crew members on the flight-deck using the public address system (if installed)."
    - type: multiple-correct
      question: "According to CS25, a CVR (Cockpit Voice Recorder) must record:"
      explanation: "A CVR records audio: radio communications, the flight crew's voices picked up by the area microphone, interphone communications and audio identifying navigation or approach aids. Flight parameters go to the FDR."
      options:
        - text: – communications transmitted from or received in the aeroplane by radio
          correct: true
        - text: – communications of flight-crew members on the flight deck via the area microphone
          correct: true
        - text: – communications of flight-crew members on the flight deck using the aeroplane's interphone system
          correct: true
        - text: – audio signals identifying navigation or approach aids introduced into a headset or speaker
          correct: true
      variants:
        - show:
            - 0
            - 1
            - 2
            - 3
