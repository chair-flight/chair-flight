  learningObjectiveIds:
    - 022.14.01.01.02
  templates:
    - type: simple
      question: A CVR consists of..
      explanation: A CVR consists of a recorder (tape or digital storage) in a shock-resistant, fire-protected case, an underwater locating device, an area microphone in the cockpit and a control unit.
      presets:
        - correctAnswers:
            - text: a tape recorder, Underwater Locating Device, area microphone, and control unit.
          wrongAnswers:
            - text: a Digital Flight Data Acquisition Unit, area microphone, erase button, and tape recorder.
            - text: an Underwater Locating Device, illuminating light, speakers, tape recorder, and control unit.
            - text: an Event Mark Device, Emergency Locator Transmitter, test button, and erase button.
