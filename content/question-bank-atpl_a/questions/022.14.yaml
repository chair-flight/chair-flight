- id: QCLVJ
  subjectId: "022"
  chapterId: "022.14"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-228478
    - AVEXAM-10722
  annexes: []
  learningObjectiveIds:
    - 022.14.03.03.06
  templates:
    - type: simple
      question: What is the main purpose of the flight data monitoring?
      explanation: Flight data monitoring records systems status and flight conditions and sends reports to the operator, which uses them to find adverse safety trends and tailor training. It is a company safety tool and is not sent to the authority.
      presets:
        - correctAnswers:
            - text: To record systems status and flight conditions and automatically send reports to the company for investigation and training.
          wrongAnswers:
            - text: To record systems status and flight conditions in order to generate automatic checklists both normal and abnormal.
            - text: To record systems status and flight conditions and automatically send reports to the authority.
            - text: To record systems status and flight conditions and issue alerts and/or warnings to flight crew as soon as predetermined thresholds have been reached.
