      question: Parameters recorded by a Flight Data Recorder include..
      explanation: A flight data recorder records flight parameters such as attitude, heading, and the thrust or power of each engine. Voices belong on the CVR.
      presets:
        - correctAnswers:
            - text: attitude, heading, and thrust/power on each engine.
          wrongAnswers:
            - text: landing gear position, pressure altitude, and pilot communications.
            - text: airspeed, attitude, and announcements by cabin crew members.
            - text: time or relative time count, aural cockpit warnings, and airspeed.
    - type: simple
      question: "The purpose of the Flight Data Recorder (FDR) is to record specific parameters such as: 1. time 2. attitude 3. airspeed 4. flaps/slats configuration or cockpit selection. The combination that regroups all of the correct statements is:"
      explanation: A flight data recorder records flight parameters such as attitude, heading, and the thrust or power of each engine. Voices belong on the CVR. The flight data recorder records time, attitude, airspeed, pressure altitude, heading, thrust or power on each engine and the flap and slat configuration. Audio from the flight deck belongs on the cockpit voice recorder.
      presets:
        - correctAnswers:
            - text: 1, 2, 3, 4.
          wrongAnswers:
            - text: 2, 3.
            - text: 1, 2, 3.
            - text: 2, 3, 4.
    - type: simple
      question: "The purpose of the Flight Data Recorder (FDR) is to record specific parameters such as: 1. pressure altitude 2. propulsive/thrust power on each engine 3. the audio environment in the flight deck 4. heading. The combination that regroups all of the correct statements is:"
      explanation: A flight data recorder records flight parameters such as attitude, heading, and the thrust or power of each engine. Voices belong on the CVR. The flight data recorder records time, attitude, airspeed, pressure altitude, heading, thrust or power on each engine and the flap and slat configuration. Audio from the flight deck belongs on the cockpit voice recorder.
      presets:
        - correctAnswers:
            - text: 1, 2, 4.
          wrongAnswers:
            - text: 1, 4.
            - text: 2, 4.
            - text: 2, 3, 4.
