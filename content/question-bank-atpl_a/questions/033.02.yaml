  templates:
    - type: simple
      question: |-
        Planning an IFR flight for a twin jet aeroplane. Given:

        - Flight level: FL{{fl}}
        - ISA deviation: {{isa_dev}} °C
        - Cruise procedure: Mach 0.{{mach_h}}

        Determine the TAS in knots.
      explanation: |-
        The ISA temperature falls by 1.98 °C per 1000 ft below the tropopause, so at flight level FL the ISA temperature is 15 - 0.198 x FL °C. Adding the ISA deviation and converting to kelvin gives the static temperature 288.15 - 0.198 x FL + ISA deviation (K). The TAS is the Mach number multiplied by the speed of sound at that temperature.

        **Solution**

        $$
        \frac{\text{Mach number (x 100)}}{100}\times 38.97\times \sqrt{288.15-0.198\times \text{Flight level}+\text{ISA deviation}} = \frac{ {{mach_h}} }{100}\times 38.97\times \sqrt{288.15-0.198\times {{fl}}+({{isa_dev}})} = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong
        - **{{d1}} kt**: ignores the ISA deviation, so the standard temperature for the flight level is used.
        - **{{d2}} kt**: uses the sea-level temperature and ignores the altitude.
        - **{{d3}} kt**: reverses the sign of the ISA deviation.
        - **{{d4}} kt**: gives the speed of sound and forgets to multiply by the Mach number.
      presets:
        - variables:
            fl: 280
            isa_dev: -10
            mach_h: 74
            answer: 430
            d1: 440
            d2: 481
            d3: 449
            d4: 582
