      question: |-
        Refer to the figure, a partially completed navigation plan from an aerodrome with elevation {{elev}} ft. The rate of climb is {{roc}} ft/min and the ground speed during the climb, read from the figure, is {{gs}} kt.

        At what distance from the aerodrome will you reach FL {{fl}}? Answer in NM.
      explanation: |-
        The climb distance is the climb time times the ground speed. The climb time is the height to climb (target level minus aerodrome elevation) divided by the rate of climb. The ground speed is taken from the figure.

        **Solution**

        Height to climb = {{macro1}} ft - {{elev}} ft = {{macro2}} ft

        Time = {{macro2}} ft / {{roc}} ft/min = {{macro3}} min

        $$
        \frac{\frac{\text{Target flight level}\times 100-\text{Aerodrome elevation}}{\text{Rate of climb}}\times \text{Ground speed in climb (read from figure)}}{60} = \frac{\frac{ {{fl}}\times 100-{{elev}} }{ {{roc}} }\times {{gs}} }{60} = \mathbf{ {{answer}}\ \text{NM} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} NM**: this is the climb time in minutes, not a distance.
        - **{{d2}} NM**: the ground speed was not divided by 60.
        - **{{d3}} NM**: the distance was converted with the 1.15 statute mile factor.
        - **{{d4}} NM**: time and ground speed were combined as a ratio instead of a product.
