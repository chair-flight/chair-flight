      question: |-
        Given the following information for a Commercial Air Transport flight:

        - Missed Approach at destination: {{ma}} min
        - Climb to cruise level: {{climb}} min
        - Cruise distance: {{dist}} NM
        - Cruise TAS: {{tas}} kt
        - Tailwind component: {{tw}} kt
        - Anticipated hold at alternate: {{hold}} min
        - Descent to alternate: {{desc}} min
        - Approach to alternate: {{appr}} min

        What is the time (in minutes) needed from the destination to the alternate aerodrome?
      explanation: |-
        The time from the destination to the alternate is the sum of every phase flown after the decision to divert: missed approach, climb, cruise, descent, approach and the anticipated hold at the alternate. Cruise time uses the ground speed, i.e. TAS plus the tailwind component.

        **Solution**

        Cruise time = {{dist}} / ({{tas}} + {{tw}}) × 60 = {{macro1}} min
        Total = {{ma}} + {{climb}} + {{macro1}} + {{hold}} + {{desc}} + {{appr}} = **{{answer}} minutes**

        ## Why the other answers are wrong
        - **{{d1}} minutes**: the anticipated hold at the alternate is left out.
        - **{{d2}} minutes**: the tailwind is subtracted from the TAS (treated as headwind).
        - **{{d3}} minutes**: tailwind treated as headwind and the hold is left out.
