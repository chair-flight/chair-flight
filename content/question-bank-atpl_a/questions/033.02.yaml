        MEA: 4500 ft   
         MOCA: 1500 ft
      explanation: The MEA ensures adequate navigation signal reception and communications as well as obstacle clearance. It is above the MOCA, so the flight must be planned at or above the MEA. With an MEA of 4 500 ft, 5 000 ft or above is correct.
      presets:
        - correctAnswers:
            - text: Plan to fly at 5 000 ft or above to clear obstacles and to have adequate reception of radio navigation aids and communications.
          wrongAnswers:
            - text: Use the MEA value as the minimum altitude to achieve the required obstacle clearance for IFR flight as the MOCA value is for VFR flight.
            - text: Plan to fly between 2 000 ft and 4 000 ft in order to remain within the protected and authorised dimensions of the route segment.
            - text: Use the MOCA value as the minimum safe altitude within the dimensions of the route and MEA if flying within 25 NM of the route centreline.
