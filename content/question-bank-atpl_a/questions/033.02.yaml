  templates:
    - type: simple
      question: |-
        How much is the clearance passing the highest obstacle in the following scenario?

        An aircraft is flying at FL{{fl}} in mountainous terrain on the northern side of the Alps and the charted minimum grid-area altitude is {{mga}} ft.

        The outside air temperature at FL{{fl}} is {{oat}}°C.

        The QNH is {{qnh}} hPa, given by a meteorological station with an elevation of {{elev}} ft.

        Assume 1 hPa = 30 ft. (The minimum grid-area altitude includes a 2 000 ft obstacle clearance in mountainous terrain.)
      explanation: |-
        The altimeter at a flight level reads against 1013.25 hPa, so with a lower QNH the true altitude is lower; every hPa below standard is 30 ft. In cold air the true altitude is further reduced by 4 ft per 1 000 ft (above the station elevation) per °C below ISA. The highest obstacle is the minimum grid-area altitude minus the 2 000 ft clearance included in it.

        **Solution**

        Altitude with QNH = {{macro1}} - ({{macro2}} * 30) = {{macro3}} ft
        ISA deviation = {{oat}} - ({{macro4}}) = {{macro5}} °C
        Temperature correction = 0.004 * {{macro5}} * ({{macro3}} - {{elev}}) = {{macro6}} ft
        True altitude = {{macro7}} ft
        Highest obstacle = {{macro8}} ft

        Clearance = **{{answer}} ft**

        ## Why the other answers are wrong

        - **{{d1}} ft**: ignores the QNH correction.
        - **{{d2}} ft**: ignores the temperature correction.
        - **{{d3}} ft**: forgets the 2 000 ft clearance already contained in the minimum grid-area altitude.
        - **{{d4}} ft**: applies the QNH correction with the wrong sign.
        - **{{d5}} ft**: applies the temperature correction with the wrong sign.
