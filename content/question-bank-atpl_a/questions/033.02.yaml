        Refer to the figure (Flight Planning Manual MRJT 1, Figure 4.5.1). Planning an IFR flight from Paris to London for a twin jet aeroplane. Given: estimated take-off mass 52 000 kg, airport elevation 387 ft, FL 280, ISA deviation -10° C, W/V {{wd}}°/{{ws}} kt, average true course {{tc}}°.

        Values read from the chart: still air distance to the top of climb {{nam}} NAM, climb time {{time}} min.

        Find the ground distance to the top of climb (NM).
      explanation: |-
        The chart gives the still air distance for the climb. The head wind component (wind speed times the cosine of the angle between wind direction and course) shortens the ground distance over the climb time.

        **Solution**

        Head wind component = {{macro1}} kt

        $$
        \text{Still air climb distance (read from chart)}-\frac{\text{Wind speed}\times \text{cos}(\text{Wind direction}-\text{True course})\times \text{Climb time (read from chart)}}{60} = {{nam}}-\frac{ {{ws}}\times \text{cos}({{wd}}-{{tc}})\times {{time}} }{60} = \mathbf{ {{answer}}\ \text{NM} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} NM**: The still air distance, with no wind correction.
        - **{{d2}} NM**: The head wind was treated as a tail wind.
        - **{{d3}} NM**: The full wind speed was used instead of the head wind component.
        - **{{d4}} NM**: The full wind speed was used as a tail wind.
