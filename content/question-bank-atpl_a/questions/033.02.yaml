  templates:
    - type: simple
      question: |-
        An aircraft cruises at FL {{fl}} with a ground speed of {{gs}} kt. The true airspeed stays constant in the descent, the wind is negligible and the temperature is ISA. The pilot wants to arrive overhead the aerodrome at {{alt}} ft (QNH {{qnh}} hPa) with a rate of descent of {{rod}} ft/min.

        At what distance from the aerodrome should the descent be commenced? (Use 1 hPa = 30 ft and standard pressure 1013 hPa; answer in NM.)
      explanation: |-
        The descent distance is the time needed to lose the height multiplied by the ground speed. The height to lose is measured from the true altitude at cruise level: a flight level is flown on the standard setting (1013 hPa), so with QNH {{qnh}} hPa the aeroplane is {{macro1}} ft ({{macro2}} hPa × 30 ft/hPa) higher above the QNH datum than the flight level suggests.

        **Solution**

        Height to lose = {{macro3}} ft + {{macro1}} ft - {{alt}} ft = {{macro4}} ft

        Time = {{macro5}} ft / {{rod}} ft/min = {{macro6}} min

        $$
        \frac{\frac{\text{Cruise flight level}\times 100+(\text{QNH}-1013)\times 30-\text{Altitude to reach}}{\text{Rate of descent}}\times \text{Ground speed}}{60} = \frac{\frac{ {{fl}}\times 100+({{qnh}}-1013)\times 30-{{alt}} }{500}\times {{gs}} }{60} = \mathbf{ {{answer}}\ \text{NM} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} NM**: the QNH correction was ignored and the descent was planned from the flight level as if it were altitude.
        - **{{d2}} NM**: the QNH correction was subtracted instead of added.
        - **{{d3}} NM**: the target altitude was not subtracted, so too much height was assumed.
        - **{{d4}} NM**: this is the descent time in minutes, not multiplied by the ground speed.
