- id: QGSUF
  subjectId: "033"
  chapterId: "033.02"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-338525
    - BGS-330602
    - BGS-330064
    - AVEXAM-59050
  annexes: []
  learningObjectiveIds:
    - 033.02.01.07.06
  templates:
    - type: simple
      question: "On a given flight path, it is possible to choose between four flight levels FL, each associated with a mandatory flight Mach number M. The flight conditions, static air temperature SAT and headwind component HWC are given below: FL 370: M = 0.80, SAT = -60° C, HWC = 15 kt FL 330: M = 0.78, SAT = -60° C, HWC= 5 kt FL 290: M = 0.80, SAT = -55° C, HWC = 15 kt FL 270: M = 0.76, SAT = -43° C, HWC = 0 The Flight Level allowing the highest Ground Speed is.."
      explanation: |-
        The TAS is Mach × local speed of sound (38.95 × √(temperature in kelvin)), and the ground speed is TAS minus the headwind:

        - FL370: 455 − 15 = 440 kt.
        - FL330: 444 − 5 = 439 kt.
        - FL290: 460 − 15 = 445 kt.
        - FL270: 449 − 0 = 449 kt.

        **FL270** gives the highest ground speed.
      presets:
        - correctAnswers:
            - text: FL270.
          wrongAnswers:
            - text: FL330.
            - text: FL290.
            - text: FL370.
