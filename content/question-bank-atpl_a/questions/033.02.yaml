  templates:
    - type: simple
      question: You are flying at {{alt1}} ft on track {{trk}}°(T) and you want to be at {{alt2}} ft {{dist}} NM before you reach the waypoint. If the TAS is {{tas}} kt, the average wind is {{wdir}}°(T)/{{wspd}} kt and the rate of descent is {{rod}} ft/min, how far is the ToD from the waypoint?
      explanation: |-
        The top of descent is the point where the descent must start so that the aircraft reaches the target altitude {{dist}} NM before the waypoint. Its distance from the waypoint is the distance covered during the descent plus the distance still to be flown at the target altitude. The descent distance needs the ground speed, which comes from the wind triangle.

        **Solution**

        Wind angle relative to track: {{macro1}}°
        Drift correction: asin({{wspd}} × sin({{macro1}}°) / {{tas}}) = {{macro2}}°
        Ground speed = {{macro3}} kt
        Descent time = ({{alt1}} - {{alt2}}) / {{rod}} = {{macro4}} min
        Descent distance = {{macro4}} min × {{macro3}} kt / 60 = {{macro5}} NM
        ToD distance = {{macro5}} + {{dist}} = **{{answer}} NM**

        ## Why the other answers are wrong
        - **{{d1}} NM**: only the descent distance; the {{dist}} NM before the waypoint is forgotten.
        - **{{d2}} NM**: the {{dist}} NM is subtracted instead of added.
        - **{{d3}} NM**: the descent distance is counted twice and the {{dist}} NM is forgotten.
