    - 033.02.01.03.08
  templates:
    - type: simple
      question: |-
        Determine the vertical distance between the departure aerodrome and the aircraft at the cruise level (the true height above the ground), given:

        - Aerodrome elevation: {{elev}} ft
        - Cruise level: FL{{fl}}
        - QNH at departure aerodrome: {{qnh}} hPa

        _Assume 30 ft per 1 hPa._ Round to the nearest 100 ft.
      explanation: |-
        A flight level is referenced to 1013 hPa. When the QNH is higher than 1013 hPa the true altitude is higher than the flight level by the pressure difference times 30 ft/hPa. The height above the aerodrome is then the true altitude minus the aerodrome elevation.

        **Solution**

        True altitude = {{macro1}} ft + ({{qnh}} - 1013) hPa x 30 ft/hPa = {{macro2}} ft

        Height above the aerodrome = {{macro2}} ft - {{elev}} ft = {{macro3}} ft, i.e. **{{answer}} ft** to the nearest 100 ft.

        ## Why the other answers are wrong

        - **{{d1}} ft**: the aerodrome elevation was not subtracted, so this is the true altitude, not the height above the aerodrome.
        - **{{d2}} ft**: the QNH correction was applied with the wrong sign (QNH above 1013 hPa lowers the altitude instead of raising it).
        - **{{d3}} ft**: the aerodrome elevation was added instead of subtracted.
      presets:
        - variables:
            elev: 3500
            fl: 250
            qnh: 1030
            macro1: 25000
            macro2: 25510
            macro3: 22010
            answer: 22000
            d1: 25500
            d2: 21000
            d3: 29000
          correctAnswers:
            - text: 22000 ft
          wrongAnswers:
            - text: 29000 ft
            - text: 25500 ft
            - text: 21000 ft
        - variables:
            elev: 2000
            fl: 200
            qnh: 1025
            macro1: 20000
            macro2: 20360
            macro3: 18360
            answer: 18400
            d1: 20400
            d2: 17600
            d3: 22400
          correctAnswers:
            - text: 18400 ft
          wrongAnswers:
            - text: 22400 ft
            - text: 20400 ft
            - text: 17600 ft
