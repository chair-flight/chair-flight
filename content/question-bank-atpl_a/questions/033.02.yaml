  templates:
    - type: simple
      question: |-
        Determine the lowest usable IFR flight level that gives the required obstacle clearance over high terrain.

        - Highest terrain elevation: {{terrain}} ft
        - Required obstacle clearance: {{clearance}} ft
        - QNH: {{qnh}} hPa
        - Temperature: ISA {{dev}} °C

        Use 30 ft per hPa and a height correction of 4 % per 10 °C deviation from ISA. Round up to the next 1 000 ft and give the answer as a flight level.
      explanation: |-
        The lowest usable flight level must clear the terrain by the required obstacle clearance. The QNH and the temperature both change the height. A QNH below 1013 hPa means the aircraft is higher than its flight level indicates, so 30 ft per hPa is added. In cold air the true height is lower than the pressure altitude, so the terrain height is increased by 4 % per 10 °C below ISA.

        **Solution**

        Terrain corrected for temperature: $$\text{Terrain elevation}\times (1-0.004\times \text{ISA deviation})$$ = {{macro2}} ft

        QNH correction: $$(1013-\text{QNH})\times 30$$ = {{macro4}} ft

        Required height: {{macro5}} ft, rounded up to the next 1 000 ft gives **FL{{answer}}**

        ## Why the other answers are wrong

        - **FL{{d1}}**: leaves out the obstacle clearance.
        - **FL{{d2}}**: adds the obstacle clearance twice.
        - **FL{{d3}}**: adds one more 1 000 ft of margin than required.
        - **FL{{d4}}**: rounds down instead of up to the next 1 000 ft.
