  templates:
    - type: simple
      question: |-
        Refer to the Jeppesen GSPRM chart for the area. Find the distance between two points given by their coordinates:

        - Point 1: latitude N {{la1d}}° {{la1m}}', longitude {{lo1d}}° {{lo1m}}'
        - Point 2: latitude N {{la2d}}° {{la2m}}', longitude {{lo2d}}° {{lo2m}}'

        (Longitude is positive East and negative West, applied to both degrees and minutes.)

        Give the distance in NM.
      explanation: |-
        The distance between two points is the great-circle distance. The central angle between them in degrees, multiplied by 60, gives the distance in NM (1 arc minute = 1 NM). Over short distances this is nearly the same as the plane approximation using the mean latitude to compress the difference of longitude.

        **Solution**

        Latitudes and longitudes are first converted to decimal degrees (degrees + minutes / 60).

        $$
        60\times \text{acos}(\text{sin}(\text{Point 1 latitude degrees}+\frac{\text{Point 1 latitude minutes}}{60})\times \text{sin}(\text{Point 2 latitude degrees}+\frac{\text{Point 2 latitude minutes}}{60})+\text{cos}(\text{Point 1 latitude degrees}+\frac{\text{Point 1 latitude minutes}}{60})\times \text{cos}(\text{Point 2 latitude degrees}+\frac{\text{Point 2 latitude minutes}}{60})\times \text{cos}(\text{Point 2 longitude degrees}+\frac{\text{Point 2 longitude minutes}}{60}-(\text{Point 1 longitude degrees}+\frac{\text{Point 1 longitude minutes}}{60}))) = \mathbf{ {{answer}}\ \text{NM} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} NM**: the convergence of the meridians was ignored (difference of longitude not multiplied by the cosine of the latitude).
        - **{{d2}} NM**: the north-south and east-west components were added instead of combined as the hypotenuse.
        - **{{d3}} NM**: the result was converted to statute miles.
        - **{{d4}} NM**: the result was converted to km.
      presets:
        - variables:
            la1d: 53
            la1m: 36
            lo1d: -1
            lo1m: -5
            la2d: 53
            la2m: 45
            lo2d: -2
            lo2m: -6
            answer: 37.2
            d1: 61.7
