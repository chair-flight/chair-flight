  templates:
    - type: simple
      question: |-
        The pilot of an aircraft has received a take-off clearance: 

        “YR-BTO, CLIMB STRAIGHT AHEAD UNTIL 6000 FT, BEFORE TURNING RIGHT, HEADING 110\. REPORT PASSING 4000 FT: RUNWAY 08L CLEARED FOR TAKE-OFF” 

        The flight crew is experiencing a communications receiver failure after take-off. The aircraft is below 4000 ft and the flight crew should transmit blind their next report followed by a complete repetition.

        What is the correct phraseology? “YR-BTO, TRANSMITTING BLIND DUE TO RECEIVER FAILURE…
      explanation: ""
      presets:
        - correctAnswers:
            - text: PASSING 4000 FT, NEXT REPORT 6000 FT. CONTINUING FLIGHT AS PLANNED.”
          wrongAnswers:
            - text: PASSING 6000 FT, NEXT REPORT AT 6000. CONTINUING FLIGHT AS PLANNED.
            - text: AT 4000 FT, NEXT REPORT AT 6000 FT. ALL STATIONS RADIO CHECK.”
            - text: AT 4000 FT, NEXT REPORT AT 6000 FT. HEADING 110 SPEED 160 KNOTS.”
    - type: simple
      question: |-
        An aircraft has received the following take-off clearance: "TC-BTO, CLIMB STRAIGHT AHEAD UNTIL 4000 FT, BEFORE TURNING RIGHT HEADING 270, REPORT RIGHT TURN. RUNWAY 09 CLEARED FOR TAKE-OFF."

        After take-off, the aircraft is experiencing communications receiver failure and the pilots need to transmit blind their report to ATC, followed by a complete repetition. What phraseology shall they use?

        "TC-BTO, TRANSMITTING BLIND DUE TO RECEIVER FAILURE...
      explanation: ""
      presets:
        - correctAnswers:
            - text: ...RIGHT TURN. CONTINUING VFR FOR LANDING RWY 09. NEXT REPORT FINAL."
          wrongAnswers:
            - text: ...RIGHT TURN MAINTAINING 4000 FT. NEXT REPORT AT TIME 1201\. ALL STATIONS RADIO CHECK."
            - text: ...RIGHT TURN HEADING 270 SPEED 160 KNOTS. CONTINUING VFR FOR LANDING RWY 09."
            - text: ...RIGHT TURN HEADING 270 MAINTAINING 4000 FT. CONTINUING VFR FOR LANDING RWY 09."
