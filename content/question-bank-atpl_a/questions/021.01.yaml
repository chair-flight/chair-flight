  learningObjectiveIds:
    - 021.01.05.01.01
  templates:
    - type: simple
      question: An aircraft has been parked up for a significant amount of time. The last entry in the aircraft tech log by the maintenance organisation was made before the aircraft's last flight. Amongst other elements, this statement mentions that the aircraft is considered airworthy up to a certain amount of flight hours, which have not yet been reached by the aircraft. No technical malfunctions or deferred defects have been entered in the tech log. Which of the following statements is correct?
      explanation: A maintenance statement does not only limit flight hours. It can also carry limits in cycles or calendar time, such as a due date for hard-time tasks, so the crew must check every limit, not just hours. Parking alone does not make the statement invalid or hard-time maintenance.
      presets:
        - correctAnswers:
            - text: The airworthiness maintenance statement could also contain a due date for hard-time maintenance after a certain number of cycles, which needs to be verified.
          wrongAnswers:
            - text: The maintenance statement remains always valid up to the flight time limits provided.
            - text: After each parking period, irrespective of the duration, the airworthiness maintenance statement will need to be revised. This is an example of a hard-time maintenance method.
            - text: The aircraft can be considered airworthy provided a visual inspection of the aircraft does NOT reveal technical malfunctions. This is referred to as condition monitoring.
- id: QXSHF
  subjectId: "021"
  chapterId: "021.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-212733
    - BGS-212000
    - AVEXAM-99466
  annexes: []
  learningObjectiveIds:
    - 021.01.05.01.01
  templates:
    - type: simple
      question: Reading the technical log of an aircraft before flight, you notice that the previous maintenance organisation inspected the landing gear for corrosion, and made no further action as no corrosion was found. What type of maintenance is this?
      explanation: On-condition maintenance means inspecting or testing an item, and leaving it in service as long as it meets the standard. Here the landing gear was inspected for corrosion, none was found, and nothing more was needed, so no overhaul or tear-down was required. Hard-time maintenance removes the item at a fixed interval, whatever its condition.
      presets:
        - correctAnswers:
            - text: On-condition maintenance, where the determination of continued airworthiness can be made without overhaul or tear-down inspection.
          wrongAnswers:
            - text: On-condition maintenance, where an aircraft item such as the landing gear is removed from service at or before reaching a specified time or amount of cycles.
            - text: Hard-time maintenance, where an item is completely removed and disassembled to allow for a thorough inspection of the item.
            - text: Hard-time maintenance, overhauling an aircraft component within the time limits of the maintenance programme as determined by the manufacturer.
