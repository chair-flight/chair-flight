      question: Before flight, the Commander notices a document from the maintenance organisation, the CRS (Certificate of Release to Service), which states that "all maintenance checks have been performed. Next check/valid until 5432 hours and 3254 landings." What does this mean?
      explanation: The certificate of release to service confirms that the scheduled checks, both hard-time and on-condition, were done and are valid up to the limits stated. Before those limits are reached, only on-condition tasks, arising from inspection findings or defects, may still be required.
      presets:
        - correctAnswers:
            - text: All the maintenance checks, both hard-time and on-condition, have been performed and are valid until the limits mentioned. Only on-condition maintenance may be required before that time.
          wrongAnswers:
            - text: The maintenance organisation has guaranteed correct operation until the limits mentioned.
            - text: The CRS does not relate to airworthiness.
            - text: The aircraft is not airworthy, and the Commander must not fly it.
