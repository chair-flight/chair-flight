    - id: AIZX
    - id: AKWQ
    - id: AVDJ
  learningObjectiveIds:
    - 021.11.01.02.05
    - 021.11.01.02.09
  templates:
    - type: definition
      question: |-
        Which gas turbine arrangement is shown?

        ![Gas turbine arrangement](annex:{{term}}:md)
      explanation: |-
        Follow the solid blue shapes through each schematic. Each shade groups the parts that rotate together. The dashed line marks the engine centreline.

        **Free power turbine.** The upstream turbine drives the compressor through the dark blue shaft. Exhaust gas then drives a separate power turbine, which turns the propeller through the light blue shaft and reduction gearbox. The two shafts can rotate independently. This example has a centrifugal compressor, which turns the airflow radially outwards.

        **Single shaft (single spool).** One shaft connects the turbine and the compressor. In the fixed-shaft turboprop shown, that same shaft also drives the propeller through a reduction gearbox.

        **Double shaft (twin spool).** The high-pressure turbine drives the high-pressure compressor through the hollow dark blue shaft. The low-pressure turbine drives the low-pressure compressor through the light blue shaft, which runs inside the dark blue shaft. Both spools can rotate independently.
      options:
        - id: OQ7P3LDM2
          term: AIZX
          definition: Free power turbine
        - id: OZT4B7CM9
          term: AKWQ
          definition: Single shaft (single spool)
        - id: OMR8Q2N5V
          term: AVDJ
          definition: Double shaft (twin spool)
      fakeOptions:
        - id: OFK6J9Z3N
          definition: Triple shaft (three spools)
