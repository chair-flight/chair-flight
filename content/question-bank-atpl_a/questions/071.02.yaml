  templates:
    - type: simple
      question: When can a CAT operator use the MMEL instead of MEL?
      explanation: |-
        ### Regulation (EU) No 965/2012, CAT.IDE.A.105, Minimum equipment for flight

        > A flight shall not be commenced when any of the aeroplane's instruments, items of equipment or functions required for the intended flight are inoperative or missing, unless: (a) the aeroplane is operated in accordance with the operator's **MEL**; or (b) **the operator is approved by the competent authority to operate the aeroplane within the constraints of the master minimum equipment list (MMEL)** in accordance with point ORO.MLR.105(j) of Annex III.
      presets:
        - correctAnswers:
            - text: Yes, if this arrangement is approved by the competent authority.
          wrongAnswers:
            - text: No, as the MMEL is written based on the MEL.
            - text: Yes, the operator can choose to use the MMEL instead of the MEL if it suits their needs better.
            - text: No, the MMEL is never approved by the competent authorities since all operators must create their own MEL.
