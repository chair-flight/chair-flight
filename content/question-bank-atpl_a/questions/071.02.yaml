  templates:
    - type: simple
      question: Why are proper procedures required for ground de-icing and anti-icing of an aeroplane?
      explanation: |-
        ### Regulation (EU) No 965/2012, GM3 CAT.OP.MPA.250, Ice and other contaminants — ground procedures

        > Procedures established by the operator for de-icing and/or anti-icing are intended to **ensure that the aircraft is clear of contamination** so that degradation of aerodynamic characteristics or mechanical interference will not occur and, following anti-icing, to maintain the airframe in that condition during the appropriate HOT.
      presets:
        - correctAnswers:
            - text: To ensure effective removal of the ice and snow deposits by following established methods.
          wrongAnswers:
            - text: To satisfy the requirements of the Competent Authority.
            - text: To make sure that ice and snow deposits are only removed from critical areas.
            - text: To make sure that the fuselage is clean, with NO residues of de-icing or anti-icing fluids.
    - type: simple
      question: What is the primary objective of the aircraft's de-icing and anti-icing process?
      explanation: |-
        ### Regulation (EU) No 965/2012, GM3 CAT.OP.MPA.250, Ice and other contaminants — ground procedures

        > Procedures established by the operator for de-icing and/or anti-icing are intended to **ensure that the aircraft is clear of contamination** so that degradation of aerodynamic characteristics or mechanical interference will not occur and, following anti-icing, to maintain the airframe in that condition during the appropriate HOT.
      presets:
        - correctAnswers:
            - text: To follow a methodical process for effective removal of ice and snow deposits.
          wrongAnswers:
            - text: To comply with the regulations set forth by the Competent Authority.
            - text: ​To selectively remove ice from critical parts of the aircraft.
            - text: To ensure complete removal of de-icing and anti-icing fluids from the airframe.
