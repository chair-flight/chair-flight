      question: During a quick turnaround in Cologne, the ATIS reports an air temperature of -10°C and freezing rain. The aircraft has landed with clear ice under the wings. There is only a short time before the next departure, what shall the commander do?
      explanation: |-
        ### Regulation (EU) No 965/2012, CAT.OP.MPA.250, Ice and other contaminants — ground procedures

        > (b) The commander shall **only commence take-off if the aircraft is clear of any deposit** that might adversely affect the performance or controllability of the aircraft, except as permitted under (a) and in accordance with the AFM.

        Clear ice under the wings is a deposit that affects performance. Time pressure on a turnaround does not change this: the whole aircraft is treated before take-off.
      presets:
        - correctAnswers:
            - text: Order a complete de-ice, following the Clean Aircraft Concept.
          wrongAnswers:
            - text: Order a partial de-ice, only under the wings, to gain time.
            - text: Calculate the best cost-effectiveness between on-time departure and de-ice operation.
            - text: Realise the quickest turnaround possible to avoid icing.
    - type: simple
      question: A crew have just landed at Cologne, Germany where the temperature is -10° C and there is a large accumulation of frost on the underside of the wings. Freezing rain is forecast within the next hour and starts to fall shortly before the subsequent planned departure.  What consideration should the Commander make?
      explanation: |-
        ### Regulation (EU) No 965/2012, CAT.OP.MPA.250, Ice and other contaminants — ground procedures

        > (b) The commander shall **only commence take-off if the aircraft is clear of any deposit** that might adversely affect the performance or controllability of the aircraft, except as permitted under (a) and in accordance with the AFM.

        Clear ice under the wings is a deposit that affects performance. Time pressure on a turnaround does not change this: the whole aircraft is treated before take-off.
      presets:
        - correctAnswers:
            - text: The aircraft must be de-iced and anti-iced prior to take-off to comply with the "clean aircraft concept".
          wrongAnswers:
            - text: Inform the ground crew that a very quick turnaround is required in order to avoid the freezing rain accumulating significantly on the aircraft.
            - text: The Commander may decide to only have the underside of the wings de-iced.
            - text: The Commander may decide that the cost of de-icing and anti-icing is too great and that the frost will NOT affect the aircraft performance.
