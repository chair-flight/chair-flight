    - ATPLQ-708410
    - AVEXAM-21767
  annexes: []
  learningObjectiveIds:
    - 071.02.13.03.02
  templates:
    - type: simple
      question: For an aeroplane with a tyre pressure of {{tyre}} bar, at what speed (in kt) is there a risk of dynamic hydroplaning?
      explanation: |-
        Dynamic hydroplaning happens when the tyres ride on a film of water instead of the runway. The speed at which the risk starts depends on the tyre pressure: the higher the pressure, the higher that speed. The pressure is first converted from bar to psi.

        **Solution**

        Tyre pressure in psi: {{tyre}} bar × 14.5038 = {{macro1}} psi

        $$
        9\times \sqrt{\text{Tyre pressure}\times 14.5038} = 9\times \sqrt{ {{tyre}}\times 14.5038} = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: uses the pressure in bar directly, without converting it to psi.
        - **{{d2}} kt**: uses 8 instead of 9 as the constant.
        - **{{d3}} kt**: divides by 1.852, which gives km/h instead of knots.
        - **{{d4}} kt**: subtracts a fixed 10 kt from the correct speed.
      presets:
        - variables:
            tyre: 10
            macro1: 145
            answer: 108
            d1: 28
            d2: 96
            d3: 59
            d4: 98
          correctAnswers:
            - text: 108 kt
          wrongAnswers:
            - text: 28 kt
            - text: 59 kt
            - text: 98 kt
            - text: 96 kt
        - variables:
            tyre: 12
            macro1: 174
            answer: 119
            d1: 31
            d2: 106
            d3: 64
            d4: 109
          correctAnswers:
            - text: 119 kt
          wrongAnswers:
            - text: 31 kt
            - text: 64 kt
            - text: 109 kt
            - text: 106 kt
        - variables:
            tyre: 10.8
            macro1: 157
            answer: 113
            d1: 30
            d2: 100
            d3: 61
            d4: 103
          correctAnswers:
            - text: 113 kt
          wrongAnswers:
            - text: 30 kt
            - text: 61 kt
            - text: 103 kt
            - text: 100 kt
