- id: QXYAI
  subjectId: "070"
  chapterId: "071.02"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-717033
    - BGS-700068
    - AVEXAM-40655
  annexes: []
  learningObjectiveIds:
    - 071.02.01.03.06
  templates:
    - type: simple
      question: |-
        During the pre-flight preparation, a pilot who is operating a Commercial Air Transport flight with passengers, notices a fault with the only GPS receiver on board. The pilot has access to both the MEL and the MMEL, and finds the notes as shown below. How should the effect of the fault be addressed?

        MMEL: May be inoperative provided it is NOT required for navigation.   
         MEL: May be inoperative for VFR-by-day only; or; positioning flights if NOT required for navigation.
      explanation: |-
        ### Regulation (EU) No 965/2012, ORO.MLR.105, Minimum equipment list

        > (e) The operator shall: (1) establish rectification intervals […] The rectification interval in the MEL **shall not be less restrictive than** the corresponding rectification interval in the MMEL; […]

        ### Regulation (EU) No 965/2012, CAT.IDE.A.105

        > […] (a) the aeroplane is operated in accordance with **the operator's MEL** […]

        The operator's MEL is the document the pilot uses. It may be more restrictive than the MMEL, never less. Here it allows the GPS to be inoperative for VFR by day only, so the flight can go ahead only if it is daylight and planned under VFR.
      presets:
        - correctAnswers:
            - text: This flight may be conducted as planned if it is daylight and the flight is planned according to VFR only.
          wrongAnswers:
            - text: The restriction in the MMEL applies because this is the master document produced by the aeroplane manufacturer.
            - text: The pilot may conduct the flight with NO restrictions if the flight remains in VMC and alternative means for navigation are used.
            - text: Restrictions in the MEL are less strict than the MMEL and therefore the MEL must be used in this case.
- id: QNJVG
  subjectId: "070"
  chapterId: "071.02"
  relatedQuestionIds:
    - QOJOJ
  externalQuestionIds:
    - ATPLQ-709390
    - AVEXAM-10238
    - BGS-711786
  annexes: []
  learningObjectiveIds:
    - 071.02.02.01.01
  templates:
    - type: simple
      question: According to OPS regulations what does \`anti-icing\`, in the case of ground procedures, mean?
      explanation: |-
        ### Regulation (EU) No 965/2012, GM1 CAT.OP.MPA.250, Ice and other contaminants — ground procedures

        > ‘Anti-icing’: the process of **protecting the aircraft to prevent contamination** due to existing or expected weather, typically by applying anti-icing fluids on uncontaminated aircraft surfaces.
        >
        > ‘Holdover time (HOT)’: **the period of time during which an anti-icing fluid provides protection** against frozen contamination to the treated aircraft surfaces. […]

        Anti-icing protects for a limited time (the holdover time), not indefinitely.
      presets:
        - correctAnswers:
            - text: A procedure that provides protection against the formation of frost or ice and accumulation of snow on treated surfaces of the aircraft for a limited period of time.
          wrongAnswers:
            - text: A procedure that provides protection against the formation of frost or ice and accumulation of snow on treated surfaces of the aircraft for an unlimited period of time.
            - text: The first step of a two-step procedure by which frost, ice, snow or slush is removed from an aircraft in order to provide uncontaminated surfaces.
            - text: A procedure by which frost, ice, snow or slush is removed from an aircraft in order to provide uncontaminated surfaces.
- id: QOJOJ
  subjectId: "070"
  chapterId: "071.02"
  relatedQuestionIds:
    - QNJVG
  externalQuestionIds:
    - ATPLQ-706848
    - BGS-711365
    - BGS-711453
    - AVEXAM-51283
  annexes: []
  learningObjectiveIds:
    - 071.02.02.01.01
  templates:
    - type: simple
      question: According to OPS regulations what does \`de-icing\`, in the case of ground procedures, mean?
      explanation: |-
        ### Regulation (EU) No 965/2012, GM1 CAT.OP.MPA.250, Ice and other contaminants — ground procedures

        > ‘De-icing’: the process of **eliminating frozen contamination from aircraft surfaces**, typically by applying de-icing fluids.
        >
        > ‘Contamination’: all forms of frozen or semi-frozen deposits on an aircraft, such as frost, snow, slush or ice.
      presets:
        - correctAnswers:
            - text: A procedure by which frost, ice, snow or slush is removed from an aircraft in order to provide uncontaminated surfaces.
          wrongAnswers:
            - text: A procedure that provides protection against the formation of frost or ice and accumulation of snow on treated surfaces of the aircraft for an unlimited period of time.
            - text: A procedure that provides protection against the formation of frost or ice and accumulation of snow on treated surfaces of the aircraft for a limited period of time.
            - text: The second step of a two-step procedure by which frost, ice, snow or slush is removed from an aircraft in order to provide uncontaminated surfaces.
