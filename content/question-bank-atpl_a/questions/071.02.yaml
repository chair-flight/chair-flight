- id: QCHMA
  subjectId: "070"
  chapterId: "071.02"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-707937
  annexes: []
  learningObjectiveIds:
    - 071.02.07.02.04
  templates:
    - type: simple
      question: An aircraft which experiences an increase of headwind of {{hw}} kt while making its way towards the centre of a microburst may expect, when crossing the microburst, to face a windshear of how many kt?
      explanation: |-
        A microburst is a strong downdraught that spreads out at the ground. An aircraft flying into it first gets more headwind, so it gains airspeed. Once it crosses the centre, the same air becomes a tailwind of the same size, so the total change in wind the aircraft meets is twice the headwind increase.

        **Solution**

        $$
        2\times \text{Increase of headwind} = 2\times {{hw}} = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: counts only the headwind, forgetting the tailwind after the centre.
        - **{{d2}} kt**: halves the headwind increase instead of doubling it.
        - **{{d3}} kt**: triples the headwind increase.
        - **{{d4}} kt**: adds a fixed 10 kt to the headwind increase.
      presets:
        - variables:
            hw: 20
            answer: 40
            d1: 20
            d2: 10
            d3: 60
            d4: 30
          correctAnswers:
            - text: 40 kt
          wrongAnswers:
            - text: 20 kt
            - text: 60 kt
            - text: 30 kt
            - text: 10 kt
        - variables:
            hw: 15
            answer: 30
            d1: 15
            d2: 8
            d3: 45
            d4: 25
          correctAnswers:
            - text: 30 kt
          wrongAnswers:
            - text: 15 kt
            - text: 45 kt
            - text: 25 kt
            - text: 8 kt
        - variables:
            hw: 25
            answer: 50
            d1: 25
            d2: 13
            d3: 75
            d4: 35
          correctAnswers:
            - text: 50 kt
          wrongAnswers:
            - text: 25 kt
            - text: 75 kt
            - text: 35 kt
            - text: 13 kt
