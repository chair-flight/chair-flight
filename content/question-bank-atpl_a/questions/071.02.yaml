    - 071.02.13.03.03
  templates:
    - type: simple
      question: |-
        Refer to the figure. Given the following information, choose the lowest possible flap setting for landing on a wet runway in order to avoid dynamic hydroplaning. The landing performance calculation is based on immediate and maximum brake application after main-gear touchdown.

        - Landing mass: 45 000 kg
        - Tyre pressure: 200 psi

        Which flap setting should be selected?
      explanation: |-
        Read the landing flap chart for the landing mass and the tyre pressure. The lowest flap setting that avoids dynamic hydroplaning here is **FLAPS 30**.

        FLAPS 15 does not avoid dynamic hydroplaning at this mass and tyre pressure. FLAPS 40 avoids it too, but it is not the lowest possible setting. The option saying no setting is suitable is not what the chart shows.
      presets:
        - correctAnswers:
            - text: FLAPS 30.
          wrongAnswers:
            - text: FLAPS 15.
            - text: No flap setting is suitable at this landing mass to avoid the possibility of dynamic hydroplaning.
            - text: FLAPS 40.
