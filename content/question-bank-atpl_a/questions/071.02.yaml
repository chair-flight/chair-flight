  templates:
    - type: simple
      question: "The application of a type II anti-icing fluid on an aeroplane on the ground will provide a:"
      explanation: |-
        ### Regulation (EU) No 965/2012, GM1 CAT.OP.MPA.250, Ice and other contaminants — ground procedures

        > ‘Holdover time (HOT)’: the period of time during which an anti-icing fluid provides protection against frozen contamination to the treated aircraft surfaces. It **depends among other variables, on the type and intensity of the precipitation, OAT, wind, the particular fluid (or fluid Type)** and aircraft design and aircraft configuration during the treatment.

        ### Regulation (EU) No 965/2012, GM3 CAT.OP.MPA.250

        > The hold-over protection runs out: (i) at the commencement of the take-off roll (due to aerodynamic shedding of fluid); or (ii) when frozen deposits start to form or accumulate on treated aircraft surfaces […]

        The protection is limited in time, and does not last for the flight.
      presets:
        - correctAnswers:
            - text: limited time of protection, dependent on the outside temperature, precipitations and fluid mixture.
          wrongAnswers:
            - text: protection time up to 24 hours.
            - text: limited time of protection independent of the outside temperature.
            - text: protection against icing for the duration of the flight.
    - type: simple
      question: "The application of a type II anti-icing fluid on an aircraft on the ground will provide a:"
      explanation: |-
        ### Regulation (EU) No 965/2012, GM1 CAT.OP.MPA.250, Ice and other contaminants — ground procedures

        > ‘Holdover time (HOT)’: the period of time during which an anti-icing fluid provides protection against frozen contamination to the treated aircraft surfaces. It **depends among other variables, on the type and intensity of the precipitation, OAT, wind, the particular fluid (or fluid Type)** and aircraft design and aircraft configuration during the treatment.

        ### Regulation (EU) No 965/2012, GM3 CAT.OP.MPA.250

        > The hold-over protection runs out: (i) at the commencement of the take-off roll (due to aerodynamic shedding of fluid); or (ii) when frozen deposits start to form or accumulate on treated aircraft surfaces […]

        The protection is limited in time, and does not last for the flight.
      presets:
        - correctAnswers:
            - text: limited holdover time, dependent on the outside temperature, precipitations and fluid mixture.
          wrongAnswers:
            - text: limited holdover time, independent of the outside temperature.
            - text: protection against icing for the duration of the flight.
            - text: protection time up to 24 hours.
        - correctAnswers:
            - text: limited holdover time depending on outside air temperature.
          wrongAnswers:
            - text: limited time of protection independent of the outside temperature.
            - text: protection time up to 24 hours.
            - text: protection against icing for the duration of the flight.
