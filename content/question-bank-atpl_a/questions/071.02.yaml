- id: QFVFD
  subjectId: "070"
  chapterId: "071.02"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-714134
    - BGS-712112
    - AVEXAM-20411
  annexes: []
  learningObjectiveIds:
    - 071.02.01.03.06
  templates:
    - type: simple
      question: May a flight still be conducted, if during the pre-flight check, one of the flight instruments in an aircraft is found to be inoperative?
      explanation: |-
        ### Regulation (EU) No 965/2012, CAT.IDE.A.105, Minimum equipment for flight

        > A flight shall not be commenced when any of the aeroplane's instruments, items of equipment or functions required for the intended flight are inoperative or missing, unless: (a) the aeroplane is **operated in accordance with the operator's MEL** […]

        The flight can go ahead if the MEL allows the instrument to be inoperative. The commander's acceptance of the risk, or a back-up instrument, is not the criterion.
      presets:
        - correctAnswers:
            - text: Yes, if the MEL allows for the instrument in question to be inoperative.
          wrongAnswers:
            - text: No, conducting a flight with an inoperative flight instrument is NOT allowed.
            - text: Yes, if there is a back-up instrument available in the flight crew compartment.
            - text: Yes, if the Commander accepts the risk of conducting the flight without the instrument in question.
