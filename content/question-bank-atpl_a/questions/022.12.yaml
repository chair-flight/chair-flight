      question: "In a radio altimeter, the height measurement is based upon:"
      explanation: A radio altimeter transmits a frequency-modulated wave. The difference in frequency between the transmitted wave and the wave reflected from the ground is proportional to the height.
      presets:
        - correctAnswers:
            - text: a frequency modulation wave, for which the frequency difference between the transmitted wave and the received wave after ground reflection is measured.
          wrongAnswers:
            - text: a triangular amplitude modulation wave, for which modulation phase shift between transmitted and received waves after ground reflection is measured.
            - text: a wave transmission, for which the frequency shift by DOPPLER effect after ground reflection is measured.
            - text: a pulse transmission, for which time between transmission and reception is measured on a circular scanning screen.
    - type: simple
      question: "Consider a low-altitude radio altimeter that transmits frequency-modulated continuous waves. This altimeter calculates the height above the ground by:"
      explanation: ""
      presets:
        - correctAnswers:
            - text: comparing the frequencies of the transmitted and received signals; the frequency difference is used to calculate the time taken for the wave to travel to the surface and be reflected back to the aircraft.
          wrongAnswers:
            - text: using the area QFE, instead of the area QNH that is normally used below the Transition Altitude.
            - text: measuring the time taken for the VHF radio wave to travel from the transmitter on the aircraft, along the path of the flight, to the surface, to be reflected and return back to the aircraft.
            - text: measuring the time taken for a sound wave to travel from the aircraft transmitter to the surface and back to the aircraft receiver.
