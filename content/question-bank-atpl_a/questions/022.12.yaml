  templates:
    - type: simple
      question: |-
        An aircraft and an intruding aircraft both are TCAS II equipped.   
         How does the TCAS determine the bearing of the intruding aircraft?
      explanation: TCAS gets the range from the time between its interrogation and the transponder reply, and the bearing from a directional antenna that finds the direction from which the reply arrives.
      presets:
        - correctAnswers:
            - text: Using a specific directional antenna.
          wrongAnswers:
            - text: Using the bearing function of the on-board weather radar.
            - text: By measuring the time lapse between the transmission of an interrogation signal and the reception of a reply signal.
            - text: By comparing the gps positions of the two aircraft.
