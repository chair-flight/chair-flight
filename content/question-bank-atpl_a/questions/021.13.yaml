    - ATPLQ-211021
    - AVEXAM-77333
  annexes: []
  learningObjectiveIds:
    - 021.13.01.01.06
  templates:
    - type: simple
      question: Which of the following is a potential risk of carrying supplemental oxygen canisters onboard?
      explanation: ""
      presets:
        - correctAnswers:
            - text: When mixed with oil or grease, spontaneous combustion could happen.
          wrongAnswers:
            - text: Pure oxygen in canisters runs out too fast, and will not last until the aircraft gets to a safe altitude.
            - text: After maintenance there is always some residual grease or oil left, and mixing it with oxygen could result in toxic gases.
            - text: At high altitude and low outside pressure, the pressure of the oxygen system might not be enough for normal respiration.
