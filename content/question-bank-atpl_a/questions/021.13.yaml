  templates:
    - type: simple
      question: A pilot using a diluter-demand cockpit oxygen mask receives undiluted oxygen on demand. Which of the following selections is this?
      explanation: A diluter-demand mask has a normal setting that mixes cabin air with oxygen on demand, and a 100% setting that gives undiluted oxygen. 100% is the setting for smoke or fumes or high altitude.
      presets:
        - correctAnswers:
            - text: 100%
          wrongAnswers:
            - text: Normal
            - text: Diluter-demand
            - text: Emergency
- id: QTDTB
  subjectId: "021"
  chapterId: "021.13"
