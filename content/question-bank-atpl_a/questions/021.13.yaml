    - 021.13.01.01.04
  templates:
    - type: simple
      question: "When a cabin oxygen mask is pulled downwards, the passenger breathes:"
      explanation: A passenger mask in a chemical or gaseous system supplies a mix of oxygen and cabin air. The flow is not under pressure and is not pure oxygen.
      presets:
        - correctAnswers:
            - text: a mixture of oxygen and cabin air.
          wrongAnswers:
            - text: cabin air under pressure.
            - text: pure oxygen under pressure.
            - text: pure oxygen at the ambient pressure.
    - type: simple
      question: "The passenger oxygen mask will supply:"
      explanation: A passenger mask supplies a mixture of cabin air and oxygen. The reservoir bag fills with oxygen during exhalation and the cabin air is added on inhalation.
      presets:
        - correctAnswers:
            - text: a mixture of cabin air and oxygen.
          wrongAnswers:
            - text: a mixture of compressed air and oxygen or 100 % oxygen.
            - text: a mixture of oxygen and freon gas.
            - text: 100 % oxygen.
