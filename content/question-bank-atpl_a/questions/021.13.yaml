  learningObjectiveIds:
    - 021.13.01.01.02
  templates:
    - type: simple
      question: What are the basic functionalities of a smoke hood?
      explanation: A smoke hood covers the head and provides breathable gas, protecting the eyes, nose and mouth against toxic fumes and smoke. It does not protect the body against heat or flames.
      presets:
        - correctAnswers:
            - text: To provide breathable gas and protect the user's eyes, nose, and mouth from toxic fumes and smoke.
          wrongAnswers:
            - text: To protect the entire body of the user against toxic fumes, smoke, and heat.
            - text: To protect the user from flames and smoke irritating the eyes by providing goggles that are integrated in the smoke hood.
            - text: For sealing a smoke source by tightly covering it such that the smoke stops through oxygen starvation and cooling the smoke source.
