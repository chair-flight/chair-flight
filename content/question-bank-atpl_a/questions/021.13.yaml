  templates:
    - type: simple
      question: Which of these statements concerning oxygen on board of passenger transport aeroplanes is correct?
      explanation: Portable oxygen bottles in the cabin are mainly for first aid, for passengers who need oxygen. Chemical generators give heat when activated, and run for about 12 to 22 minutes, not an hour.
      presets:
        - correctAnswers:
            - text: Portable oxygen bottles in the cabin are primarily intended for first aid purposes.
          wrongAnswers:
            - text: After being activated a chemical oxygen generator does not produce any heat.
            - text: A chemical oxygen generator is able to provide oxygen for at least one hour.
            - text: Since lavatories are not fitted with an oxygen system, they should be evacuated quickly in case of decompression.
        - correctAnswers:
            - text: "Lavatories also have an oxygen drop out system to protect passengers in case of decompression.  "
          wrongAnswers:
            - text: "After being activated a chemical oxygen generator does not produce any heat.  "
            - text: "Portable oxygen bottles are primarily intended for use in case the chemical oxygen generators fail.  "
            - text: "A chemical oxygen generator is able to provide oxygen for at least one hour.  "
        - correctAnswers:
            - text: Lavatories are equipped with oxygen masks in case of a decompression.
          wrongAnswers:
            - text: A chemical oxygen generator is able to provide oxygen for at least one hour.
            - text: Since lavatories are not fitted with an oxygen system, they should be evacuated quickly in case of decompression.
            - text: After being activated a chemical oxygen generator does not produce any heat.
        - correctAnswers:
            - text: A chemical oxygen generator delivers oxygen for about 15 minutes.
          wrongAnswers:
            - text: After being activated a chemical oxygen generator does not produce any heat.
            - text: Portable oxygen bottles are primarily intended for use in case the chemical oxygen generators fail.
            - text: Since lavatories are not fitted with an oxygen system, they should be evacuated quickly in case of decompression.
    - type: simple
      question: Which of the following is true regarding oxygen systems on a transport aircraft?
      explanation: ""
      presets:
        - correctAnswers:
            - text: Portable oxygen bottles are generally for first aid use.
          wrongAnswers:
            - text: Every crew member has its own portable oxygen bottle.
            - text: Portable oxygen systems are only required for medical transport flights.
            - text: Portable oxygen bottles are only used for the cockpit and cabin crew members.
- id: QSAYI
