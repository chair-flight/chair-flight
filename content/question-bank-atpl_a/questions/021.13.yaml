  learningObjectiveIds:
    - 021.13.01.01.02
  templates:
    - type: simple
      question: What is the purpose of first-aid portable oxygen bottles?
      explanation: ""
      presets:
        - correctAnswers:
            - text: They are used for passengers who, for physiological reasons, might require oxygen following a cabin depressurisation.
          wrongAnswers:
            - text: They are used by the crew in order to prevent fatigue.
            - text: They must be used if an onboard fire needs to be extinguished.
            - text: They are only to be used in case of a sudden loss in aeroplane pressurisation, for pressurised aeroplanes operated at pressure altitudes of 10000 ft and above.
