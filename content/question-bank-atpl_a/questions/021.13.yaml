  templates:
    - type: simple
      question: Which of these statements about oxygen in transport aeroplanes is correct?
      explanation: A passenger oxygen mask has a flow indicator showing that oxygen flows when the mask is pulled down. Chemical generators serve the passengers and not the cockpit, which uses gaseous oxygen, and masks can be released manually.
      presets:
        - correctAnswers:
            - text: A passenger oxygen mask contains a device to check if a flow of oxygen is present.
          wrongAnswers:
            - text: Chemical oxygen generators are used in the cockpit to supply the flight crew because of the low weight of this system.
            - text: If the automatic passenger oxygen mask presentation fails, there is no manual backup.
            - text: A chemical oxygen generator can be switched off.
        - correctAnswers:
            - text: "A chemical oxygen generator cannot be switched off.  "
          wrongAnswers:
            - text: " It is not possible to visually verify when the oxygen flows to a passenger mask.  "
            - text: "If the automatic passenger oxygen mask presentation fails, there is no manual backup.  "
            - text: "Chemical oxygen generators are used in the cockpit to supply the flight crew because of the low weight of this system.  "
        - correctAnswers:
            - text: "Chemical oxygen generators are not used in the cockpit to supply the flight crew because they cannot be switched off.  "
          wrongAnswers:
            - text: "It is not possible to visually verify when the oxygen flows to a passenger mask.  "
            - text: "If the automatic passenger oxygen mask presentation fails, there is no manual backup.  "
            - text: "A chemical oxygen generator can be switched off.  "
