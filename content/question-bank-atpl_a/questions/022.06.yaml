  templates:
    - type: simple
      question: A fail-operational hybrid landing system is fitted to an aircraft. What does this consist of?
      explanation: ""
      presets:
        - correctAnswers:
            - text: A fail-passive automatic landing system and a secondary independent guidance system such as a head-up display (HUD). This enables the pilot to land manually if the automatic landing system fails.
          wrongAnswers:
            - text: A fail-passive guidance system and a secondary independent landing system enabling automatic landing if the guidance system fails.
            - text: A fail-operational landing system with a synthetic vision overlay, enabling better monitoring, and so a lower minimum RVR, than is possible with a simple fail-operational automatic landing system.
            - text: A fail-operational landing system which, if the runway has NO low visibility approach aid, can overlay the enhanced vision system on the head-up display to allow continued operations below normal RVR minima.
