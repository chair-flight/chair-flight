  templates:
    - type: simple
      question: "During a CAT III approach with NO decision height, you have passed the Alert Height, with NO visual references, when the ILS signal is lost. All other systems are working normally. As Co-Pilot and Pilot Monitoring (PM), you should:"
      explanation: With no decision height, a failure of the ILS signal below the alert height without visual references means the landing cannot be completed safely. The pilot monitoring cancels the warning and calls for a go-around.
      presets:
        - correctAnswers:
            - text: Cancel the warning and immediately call ‘Go-Around’.
          wrongAnswers:
            - text: Wait for the Commander to decide whether to continue or Go-Around.
            - text: Continue normal PM monitoring duties until the aircraft has landed.
            - text: Call ‘Check FMA’.
    - type: simple
      question: You are pilot monitoring on a CAT IIIB approach in LVO descending below alert height, when suddenly you get an ILS signal failure. Choose the correct action.
      explanation: Below the alert height in a CAT IIIB approach, a failure does not by itself require a go-around when visual references have been established. The approach may be continued to a landing.
      presets:
        - correctAnswers:
            - text: Provided that visual references have been established, the approach may be continued.
          wrongAnswers:
            - text: Call for a go around and continue with your monitoring duties.
            - text: Do not interrupt the pilot flying and confront the pilot when you have landed.
            - text: Call «Check FMA».
