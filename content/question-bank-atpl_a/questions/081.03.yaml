  templates:
    - type: simple
      question: |-
        An aircraft has the following data:

        - 1 g stall speed: {{vs_ref}} kt
        - Mass for this stall speed: {{mass_ref}} kg
        - New mass: {{mass}} kg
        - Bank angle: {{bank}}°

        What is the stall speed in the turn?
      explanation: |-
        The stall speed rises with the square root of the mass. In a banked turn the load factor increases as well, which raises the stall speed by a further factor of one over the square root of the cosine of the bank angle.

        **Solution**

        $$
        \frac{\text{1 g stall speed}\times \sqrt{\frac{\text{New mass}}{\text{Mass for this stall speed}}}}{\sqrt{\text{cos}(\text{Bank angle})}} = \frac{ {{vs_ref}}\times \sqrt{\frac{ {{mass}} }{ {{mass_ref}} }}}{\sqrt{\text{cos}({{bank}})}} = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: ignores the bank angle, so the turn has no effect on the stall speed.
        - **{{d2}} kt**: inverts the mass ratio, so a lighter aircraft would stall at a higher speed.
        - **{{d3}} kt**: divides by the cosine instead of the square root of the cosine.
        - **{{d4}} kt**: scales with the mass instead of the square root of the mass.
