        An aeroplane has a stall speed of {{vs1}} kt at its mass of {{m1}} kg.

        What is the stall speed when the mass is {{m2}} kg?
      explanation: |-
        The stall speed depends on the mass: at stall the lift equals the weight, so a heavier aeroplane stalls at a higher speed, and the stall speed rises with the square root of the mass. The known stall speed is therefore scaled by the square root of the ratio between the new mass and the known mass.

