  templates:
    - type: one-two
      question: Refer to figure. Regarding the Buffet Onset Boundary Chart in the annex, which of these statements are correct or incorrect?
      explanation: |-
        ![Buffet onset boundary chart](annex:APIJ?annotated=%7B%22width%22%3A1285%2C%22height%22%3A1540%2C%22annotations%22%3A%5B%7B%22type%22%3A%22line%22%2C%22from%22%3A%5B572.5%2C1415%5D%2C%22to%22%3A%5B572.5%2C213%5D%2C%22color%22%3A%22%230d33a6%22%2C%22width%22%3A4%2C%22dash%22%3A%2214%209%22%7D%2C%7B%22type%22%3A%22line%22%2C%22from%22%3A%5B671%2C1415%5D%2C%22to%22%3A%5B671%2C213%5D%2C%22color%22%3A%22%230d33a6%22%2C%22width%22%3A4%2C%22dash%22%3A%2214%209%22%7D%2C%7B%22type%22%3A%22line%22%2C%22from%22%3A%5B710.4%2C1415%5D%2C%22to%22%3A%5B710.4%2C213%5D%2C%22color%22%3A%22%230d33a6%22%2C%22width%22%3A4%2C%22dash%22%3A%2214%209%22%7D%5D%7D)

        Each buffet boundary curve peaks at about Mach 0.80, which is where the buffet free band is widest, so Mach 0.80 gives the optimum margin. Beyond it the curves fall away again, so Mach 0.84 or 0.85 leaves less margin and is suboptimal.

        For a given mass and load factor the buffet free flight levels are those whose curve lies above the weight line. At Mach 0.82 the curves reach higher flight levels than at Mach 0.75, so the maximum altitude is higher at Mach 0.82 than at Mach 0.75.
      pairs:
        - right:
            - Flying at M = 0.8 provides the optimum margin with respect to buffet onset.
          wrong:
            - Flying at M = 0.85 provides the optimum margin with respect to buffet onset.
        - right:
            - The maximum altitude that can be achieved with respect to buffet onset, according to Certification Specifications, is higher at M = 0.82 than at M = 0.75.
          wrong:
            - The maximum altitude that can be achieved with respect to buffet onset, according to Certification Specifications, is lower at M = 0.82 than at M = 0.75.
