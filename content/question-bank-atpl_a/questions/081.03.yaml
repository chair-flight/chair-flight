  templates:
    - type: simple
      question: |-
        A light aircraft has a demonstrated stall speed (VS) in straight and level flight of {{vs}} kt.

        If the same aircraft is flown with a {{bank}}° bank angle, by how much does VS change?

        Give the change in kt.
      explanation: |-
        In a turn the load factor is one divided by the cosine of the bank angle, and the stall speed rises with the square root of the load factor. The change is the new stall speed minus the stall speed in straight and level flight.

        **Solution**

        $$\text{Stall speed in straight and level flight}\times (\sqrt{\frac{1}{\text{cos}(\text{Bank angle})}}-1) = {{vs}}\times (\sqrt{\frac{1}{\text{cos}({{bank}})}}-1)$$ = the stall speed increases by **{{answer}} kt**

        ## Why the other answers are wrong

        - **{{d1}} kt**: uses the load factor increase instead of the stall speed increase.
        - **{{d2}} kt**: assumes the stall speed is halved by the turn.
        - **{{d3}} kt**: gives the new stall speed in the turn, without subtracting the original.
        - **{{d4}} kt**: takes half of the correct change.
      presets:
        - variables:
