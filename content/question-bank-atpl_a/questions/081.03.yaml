        ## Why the other answers are wrong

        - **{{d1}} kt**: ignores the change in mass.
        - **{{d2}} kt**: scales the stall speed directly with the mass, not its square root.
        - **{{d3}} kt**: inverts the mass ratio, so the lighter aeroplane shows a higher stall speed.
        - **{{d4}} kt**: uses the cube root of the mass ratio.
