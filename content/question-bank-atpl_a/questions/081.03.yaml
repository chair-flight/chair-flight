  templates:
    - type: simple
      question: |-
        An aeroplane has the following data:

        - Stall speed in straight and level flight (load factor 1): {{vs}} kt
        - Load factor in the turn: {{lf}}

        At what speed will the aeroplane stall in the turn?
      explanation: |-
        Stall speed grows with the square root of the load factor. In a turn the wing must carry more than the aeroplane's weight, so the load factor is above 1 and the stall occurs at a higher speed than in level flight.

        **Solution**

        $$
        \text{Stall speed in straight and level flight}\times \sqrt{\text{Load factor}} = {{vs}}\times \sqrt{ {{lf}} } = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: multiplies by the load factor directly instead of its square root.
        - **{{d2}} kt**: squares the load factor, which overstates the increase.
        - **{{d3}} kt**: divides instead of multiplies, so the stall speed would fall in a turn.
        - **{{d4}} kt**: uses the average of 1 and the load factor instead of its square root.
      presets:
        - variables:
            vs: 100
            lf: 2
            answer: 141
            d1: 200
            d2: 400
            d3: 71
            d4: 150
          correctAnswers:
            - text: 141 kt
          wrongAnswers:
            - text: 200 kt
            - text: 71 kt
            - text: 150 kt
            - text: 400 kt
        - variables:
            vs: 60
            lf: 2
