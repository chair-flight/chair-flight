    - type: multiple-correct
      question: Which of the following units are responsible to control the aircraft during the approach?
      explanation: |-
        ### ICAO Doc 4444, 4.1.2 Approach control service

        > Approach control service shall be provided: a) by an aerodrome control tower or an ACC, when it is necessary or desirable to combine under the responsibility of one unit the functions of the approach control service and those of the aerodrome control service or the area control service; or b) by an approach control unit, when it is necessary or desirable to establish a separate unit.

        The approach can therefore be controlled by an approach control unit, an aerodrome control tower or an area control centre. ATIS is a broadcast of routine information and not a control unit.
      options:
        - text: Approach Control.
          correct: true
        - text: ATIS Approach.
          correct: false
        - text: Control Tower.
          correct: true
        - text: Area Control Center.
          correct: true
      variants:
        - show:
            - 0
            - 1
            - 2
            - 3
