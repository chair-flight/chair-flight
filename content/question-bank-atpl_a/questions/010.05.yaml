      question: An IFR-rated pilot is performing a flight between two European aerodromes 100 NM apart. The weather conditions are VMC during the flight. According to SERA (Standardized European Rules of the Air), under which rules can the flight be performed?
      explanation: |-
        ### SERA.5005, Visual flight rules and SERA.5015, Instrument flight rules

        > (a) Except when operating as a special VFR flight, VFR flights shall be conducted so that the aircraft is flown in conditions of visibility and distance from clouds equal to or greater than those specified in Table S5-1.

        In VMC both sets of rules can be used. A pilot with an instrument rating may therefore choose VFR or IFR. Special VFR is a clearance for flights in a control zone in conditions below the VMC minima, so it is not needed here.
      presets:
        - correctAnswers:
            - text: VFR or IFR.
          wrongAnswers:
            - text: Special VFR only.
            - text: IFR only.
            - text: VFR only.
