  templates:
    - type: simple
      question: When flying on an airway with an easterly magnetic heading, the correct flight level will be..
      explanation: |-
        ### SERA.5020(b) and Appendix 3, Table of cruising levels

        > An IFR flight operating in cruising flight in controlled airspace shall be flown at a cruising level […] selected from the table of cruising levels in Appendix 3, except that the correlation of levels to track prescribed therein shall not apply whenever otherwise indicated in air traffic control clearances or specified by the competent authority in aeronautical information publications.

        | Track        | Cruising levels            |
        | ------------ | -------------------------- |
        | 000° to 179° | **Odd** (FL130, FL150, …)  |
        | 180° to 359° | **Even** (FL120, FL140, …) |

        An easterly heading is a track between 000° and 179°, so the level is odd, unless ATC or the competent authority says otherwise.
      presets:
        - correctAnswers:
            - text: usually odd (FL130, FL150, etc.), unless stated by the authorities.
          wrongAnswers:
            - text: always even.
            - text: usually even (FL120, FL140, etc.), unless stated by the authorities.
            - text: always odd.
