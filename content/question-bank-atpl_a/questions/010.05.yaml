  templates:
    - type: simple
      question: "VFR flights shall not be flown over the congested areas of cities at a height less than:"
      explanation: |-
        ### SERA.5005(f), Visual flight rules

        > Except when necessary for take-off or landing, or except by permission from the competent authority, a VFR flight shall not be flown: (1) over the congested areas of cities, towns or settlements or over an open-air assembly of persons at a height less than **300 m (1 000 ft) above the highest obstacle within a radius of 600 m** from the aircraft; […]

        Elsewhere the VFR minimum is 150 m (500 ft) above the ground, water or the highest obstacle within 150 m of the aircraft.
      presets:
        - correctAnswers:
            - text: 1 000 ft above the highest obstacle within a radius of 600 m from the aircraft.
          wrongAnswers:
            - text: 500 ft above the highest obstacle.
            - text: 2 000 ft above the highest obstacle within a radius of 600 m from the aircraft.
            - text: the highest obstacle.
- id: QJNYE
  subjectId: "010"
  chapterId: "010.05"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-105404
    - BGS-101418
    - AVEXAM-91456
