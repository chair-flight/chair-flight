    - 010.05.02.01.07
  templates:
    - type: simple
      question: "Before sleeping the PIC takes some sedative in order to sleep, the following day:"
      explanation: |-
        ### SERA.2020, Problematic use of psychoactive substances

        > No person whose function is critical to the safety of aviation (safety-sensitive personnel) shall undertake that function **while under the influence of any psychoactive substance, by reason of which human performance is impaired**. No such person shall engage in any kind of problematic use of substances.

        A sedative impairs human performance. A pilot under its influence must not fly, whether or not they are the pilot-in-command.
      presets:
        - correctAnswers:
            - text: The pilot must not fly.
          wrongAnswers:
            - text: The pilot can undertake their function only if the impact of the substances on the human performance is minor.
            - text: The pilot shall not undertake their function if they act as pilot-in-command for that flight.
            - text: The pilot can undertake their function only if not acting as pilot flying.
