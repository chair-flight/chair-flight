  annexes: []
  learningObjectiveIds:
    - 010.05.02.01.01
    - 010.05.02.01.03
  templates:
    - type: simple
      question: New pilot in the airline has just completed their checks. They are flying with a captain who is commencing a line check. The new pilot is in the commander's seat. What is the role of the new pilot on this flight?
      explanation: |-
        ### Regulation (EU) No 923/2012 (SERA), Article 2, Definitions

        > 100. 'pilot-in-command' means the pilot **designated by the operator**, or in the case of general aviation, the owner, as being in command and charged with the safe conduct of a flight;

        The seat occupied does not make a pilot the commander. The designation by the operator does.
      presets:
        - correctAnswers:
            - text: New pilot will be a commander if the operator designates them as such.
          wrongAnswers:
            - text: New pilot is a commander because they are in the commander's seat.
            - text: Both are commanders on this flight.
            - text: The captain commencing a check is a pilot of this flight.
- id: QNVSY
  subjectId: "010"
  chapterId: "010.05"
  relatedQuestionIds: []
  externalQuestionIds:
