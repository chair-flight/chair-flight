    - 010.05.03.01.03
  templates:
    - type: definition
      question: |-
        What does this marshalling signal mean?

        {term}
      explanation: |-
        The same hand shape can mean different things depending on who gives the signal and how the hand moves.

        See SERA Appendix 1, section 4 in the [CAA Regulatory Library](https://regulatorylibrary.caa.co.uk/923-2012/Content/Regs/03830_4._MARSHALLING_SIGNALS.htm).
      options:
        - id: OMART0001
          term: The marshaller holds their right wand upright above their head and swings their left wand down towards their body.
          definition: "Wingwalker: the path into or out of the stand is clear."
        - id: OMART0002
          term: The marshaller holds both arms straight up overhead, with both wands vertical.
          definition: Identify the gate or stand.
        - id: OMART0003
          term: The marshaller starts with both arms pointing up, then brings them out to point to one side, using the wands to indicate the onward direction.
          definition: Proceed in the direction indicated to the next marshaller or as directed by tower or ground control.
        - id: OMART0004
          term: The marshaller bends both elbows and repeatedly moves the wands between chest and head height.
          definition: Continue straight ahead.
        - id: OMART0005
          term: The marshaller holds their right wand straight out at shoulder height and beckons with their left wand, setting the turn rate with the speed of the gesture.
          definition: Turn left from the pilot’s perspective.
        - id: OMART0006
          term: The marshaller holds their left wand straight out at shoulder height and beckons with their right wand, setting the turn rate with the speed of the gesture.
          definition: Turn right from the pilot’s perspective.
        - id: OMART0007
          term: Starting with both wands held out at shoulder height, the marshaller slowly raises them until they cross overhead.
          definition: Normal stop.
        - id: OMART0008
          term: The marshaller snaps both arms up and crosses their wands over their head in one abrupt movement.
          definition: Emergency stop.
        - id: OMART0009
          term: After making eye contact, the marshaller closes their raised open hand into a fist just above shoulder height and waits for a thumbs-up.
          definition: Set the brakes.
        - id: OMART0010
          term: After making eye contact, the marshaller opens their raised fist into a flat palm just above shoulder height and waits for a thumbs-up.
          definition: Release the brakes.
        - id: OMART0011
          term: With both arms high overhead, the marshaller jabs the wands towards each other until they touch and waits for acknowledgement.
          definition: Chocks inserted.
        - id: OMART0012
          term: With both arms high overhead, the marshaller jabs the wands apart. They must receive authorisation before removing the chocks.
          definition: Chocks removed.
        - id: OMART0013
          term: The marshaller circles their upright right wand near head height and points their raised left wand at the engine to be started.
          definition: Start the indicated engine.
        - id: OMART0014
          term: The marshaller extends a wand forwards at shoulder height, then draws it across their throat from their left shoulder to their right.
          definition: Cut the engines.
        - id: OMART0015
          term: The marshaller makes a low patting motion with both wands, between waist and knee height.
          definition: Reduce the aircraft’s speed.
        - id: OMART0016
          term: From a position with both arms low and both wands down, the marshaller waves one wand up and down to indicate the engine on the opposite side from their own raised hand.
          definition: Reduce power on the indicated side.
        - id: OMART0017
          term: The marshaller rolls both forearms forwards in front of their waist.
          definition: Move the aircraft backwards.
        - id: OMART0018
          term: The marshaller keeps their left wand pointed down and repeatedly lowers their right arm from overhead to point forwards at shoulder height.
          definition: While backing up, turn the tail to starboard.
        - id: OMART0019
          term: The marshaller keeps their right wand pointed down and repeatedly lowers their left arm from overhead to point forwards at shoulder height.
          definition: While backing up, turn the tail to port.
        - id: OMART0020
          term: The marshaller gives a right-handed thumbs-up at head height, or holds the right wand upright at that height, while keeping their left arm down.
          definition: Affirmative or all clear.
        - id: OMART0021
          term: The marshaller holds both arms and wands fixed straight out at shoulder height.
          definition: Hover.
        - id: OMART0022
          term: With arms spread at shoulder height and palms up, the marshaller raises both hands. The speed of the movement indicates the climb rate.
          definition: Ascend from the hover.
        - id: OMART0023
          term: With arms spread at shoulder height and palms down, the marshaller lowers both hands. The speed of the movement indicates the descent rate.
          definition: Descend from the hover.
        - id: OMART0024
          term: The marshaller extends their right arm sideways at shoulder height and sweeps their other arm towards it.
          definition: Move sideways to the pilot’s left.
        - id: OMART0025
          term: The marshaller extends their left arm sideways at shoulder height and sweeps their other arm towards it.
          definition: Move sideways to the pilot’s right.
        - id: OMART0026
          term: The marshaller crosses both arms low in front of their body, with the wands pointing down.
          definition: Land.
        - id: OMART0027
          term: The marshaller keeps both arms straight and still, angled down and out at 45 degrees.
          definition: Hold position or stand by.
        - id: OMART0028
          term: The marshaller salutes with their right hand or wand and keeps eye contact until the aircraft starts taxiing.
          definition: Aircraft dispatched.
        - id: OMART0029
          term: The marshaller extends their right arm all the way overhead, with a closed fist or a horizontal wand, and leaves their left arm down.
          definition: Do not touch the controls.
        - id: OMART0030
          term: With both arms overhead, the marshaller brings the fingers of their right hand up against their horizontal left palm to form a T.
          definition: Connect ground power.
        - id: OMART0031
          term: The marshaller forms a T overhead with their hands, then moves their right fingers away from their left palm. They wait for authorisation before disconnecting power.
          definition: Disconnect ground power.
        - id: OMART0032
          term: With their left arm down, the marshaller extends their right arm sideways at shoulder height and points the wand down or gives a thumbs-down.
          definition: Negative.
        - id: OMART0033
          term: The marshaller starts with arms spread at shoulder height, then brings both hands in to cup their ears.
          definition: Establish contact via interphone.
        - id: OMART0034
          term: The marshaller holds their left arm diagonally overhead, then sweeps their right hand up from their side towards their left shoulder.
          definition: Open or close the aircraft stairs.
        - id: OMART0035
          term: In the cockpit, the pilot raises an open hand in front of their face and closes it into a fist as they engage the brakes.
          definition: The pilot has engaged the brakes.
        - id: OMART0036
          term: In the cockpit, the pilot raises a clenched fist in front of their face and opens it as they release the brakes.
          definition: The pilot has released the brakes.
        - id: OMART0037
          term: With both palms facing out, the pilot moves their outstretched arms inwards to cross their hands in front of their face.
          definition: The pilot requests that chocks be inserted.
        - id: OMART0038
          term: The pilot starts with hands crossed in front of their face and palms out, then moves both arms apart.
          definition: The pilot requests that chocks be removed.
        - id: OMART0039
          term: In the cockpit, the pilot raises the number of fingers corresponding to the engine they are ready to start.
          definition: The pilot is ready to start the engine indicated.
      fakeOptions: []
