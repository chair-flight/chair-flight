- id: QTTHF
  subjectId: "010"
  chapterId: "010.05"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-102211
    - BGS-101771
    - AVEXAM-730476
  annexes: []
  learningObjectiveIds:
    - 010.05.02.01.01
  templates:
    - type: simple
      question: An aircraft departs from the United States of America (USA) to its destination in France. During its cruise in IMC conditions above the Atlantic Ocean and still overflying USA territory, radio communication failure is experienced. The radio communication failure procedure outlined in the USA's AIP is different than the one described in ICAO Annex 2. The aircraft is registered in Italy. Which radio communication failure procedure should the aircraft follow?
      explanation: An aircraft is bound by the rules of the air of the State whose territory it overflies, whatever its State of registry or its destination. ICAO Annex 2 applies directly only over the high seas, and SERA is the European implementation of it. While over the USA, the aircraft therefore follows the USA radio communication failure procedure published in its AIP.
      presets:
        - correctAnswers:
            - text: According to ICAO Annex 2 and Part-SERA, the aircraft must follow the USA procedure.
          wrongAnswers:
            - text: According to ICAO Annex 2, the aircraft must follow the French procedure because its destination is in France.
            - text: According to Part-SERA, the aircraft must follow the European rules, which comply with the USA Rules of the Air.
            - text: According to the Italian Rules of the Air, the aircraft must follow the Italian procedure because it is registered in Italy.
- id: QENNE
  subjectId: "010"
  chapterId: "010.05"
  relatedQuestionIds: []
  externalQuestionIds:
