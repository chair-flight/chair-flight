  learningObjectiveIds:
    - 010.05.05.01.01
  templates:
    - type: simple
      question: On a VMC day, can the pilot-in-command elect to fly in accordance with the Instrument Flight Rules, despite being in visual conditions?
      explanation: |-
        ### SERA.5005, Visual flight rules and SERA.5015, Instrument flight rules

        > (a) Except when operating as a special VFR flight, VFR flights shall be conducted so that the aircraft is flown in conditions of visibility and distance from clouds equal to or greater than those specified in Table S5-1.

        VMC is the condition required to fly VFR, not an obligation to do so. An IFR flight may be flown in any meteorological conditions, so the pilot-in-command may choose IFR on a VMC day. No rule makes IFR mandatory because the pilot and aircraft are approved for it, and no rule ties the choice to a cruising level.
      presets:
        - correctAnswers:
            - text: Yes, the pilot may choose to do so if desired.
          wrongAnswers:
            - text: No, if the filed cruise level is below 5000 ft AMSL.
            - text: It is mandatory, if the pilot and the aircraft are IFR-approved.
            - text: No, the pilot must fly in accordance with the Visual Flight Rules.
