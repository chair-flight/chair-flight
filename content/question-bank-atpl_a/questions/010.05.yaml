  templates:
    - type: simple
      question: A flight is in controlled airspace, when circumstances arise, making the Pilot in Command, First Officer and Senior Cabin Crew Member disagree about the continuation of a flight. According to SERA, how should the crew reach a decision?
      explanation: |-
        ### SERA.2015, Authority of pilot-in-command of an aircraft

        > The pilot-in-command of an aircraft shall have **final authority as to the disposition of the aircraft while in command**.

        Neither a vote of the crew, nor the operator, nor ATC takes that authority away.
      presets:
        - correctAnswers:
            - text: The PIC holds final authority as to the disposition of the aircraft.
          wrongAnswers:
            - text: According to the Standardised European Rules of the Air, all crew members should reach a consensus for the safe continuation of the flight.
            - text: The pilots should consult their current ATS unit who shall make the final choice.
            - text: The Commander should agree with the decision of the First Officer.
