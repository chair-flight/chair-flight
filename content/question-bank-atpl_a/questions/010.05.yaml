- id: QSYCN
  subjectId: "010"
  chapterId: "010.05"
  relatedQuestionIds:
    - QZJOG
  externalQuestionIds:
    - ATPLQ-101500
    - AVEXAM-45761
  annexes: []
  learningObjectiveIds:
    - 010.05.03.01.18
  templates:
    - type: simple
      question: You are flying on a VFR flight in VMC in a controlled airspace. Suddenly, you realize you are unable to maintain VMC. What are your actions according ICAO Annex 2?
      explanation: |-
        ### SERA.8020(d), Adherence to flight plan

        > Weather deterioration below the VMC. When it becomes evident that flight in VMC in accordance with its current flight plan will not be practicable, a VFR flight operated as a controlled flight shall: (1) request an amended clearance enabling the aircraft to continue in VMC to destination or to an alternative aerodrome or operating site, or to leave the airspace within which an ATC clearance is required; or (2) if no clearance in accordance with point (1) can be obtained, continue to operate in VMC and notify the appropriate ATC unit of the action being taken either to leave the airspace concerned or to land at the nearest suitable aerodrome or operating site; or (3) if operated within a control zone, **request authorisation to operate as a special VFR flight**; or (4) request clearance to operate in accordance with the instrument flight rules.

        A controlled VFR flight never continues in IMC without a clearance.
      presets:
        - correctAnswers:
            - text: Request a special VFR clearance if flying in a control zone.
          wrongAnswers:
            - text: Continue in IMC and land on the next airport which is equipped for instrument approaches.
            - text: Continue in IMC and land on the next suitable airport.
            - text: Continue to fly in VMC as best as possible and land at the nearest suitable airport immediately.
