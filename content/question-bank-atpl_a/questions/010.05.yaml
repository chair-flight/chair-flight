  templates:
    - type: simple
      question: The objective of Standardised European Rules of the Air (SERA) Regulation (EU) No 923/2012 is to establish the (1) \_\_\_\_\_ and operational provisions regarding services and procedures in air navigation. SERA shall apply to aircraft engaged in general air traffic, the Competent Authorities of (2) \_\_\_\_\_, aerodrome operators, and ground personnel engaged in aircraft operations.
      explanation: |-
        ### Regulation (EU) No 923/2012 (SERA), Article 1, Subject matter and scope

        > 1. The objective of this Regulation is to establish the **common rules of the air** and operational provisions regarding services and procedures in air navigation that shall be applicable to general air traffic within the scope of Regulation (EC) No 551/2004.
        >
        > 3. This Regulation shall also apply to the competent authorities of the **Member States, air navigation service providers**, the Network Manager, aerodrome operators and ground personnel engaged in aircraft operations.
      presets:
        - correctAnswers:
            - text: (1) common rules of the air; (2) EU Member States, air navigation service providers
          wrongAnswers:
            - text: (1) rules of the air that shall apply within the EU; (2) EU Member States, military aviation authorities
            - text: (1) rules of the air that shall apply within the EU; (2) ICAO Contracting States, certification authorities
            - text: (1) common rules of the air; (2) ICAO Contracting States, search and rescue service providers
