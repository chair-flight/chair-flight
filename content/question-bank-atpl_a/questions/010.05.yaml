  learningObjectiveIds:
    - 010.05.02.01.01
  templates:
    - type: simple
      question: According to Part SERA, aircraft bearing the nationality and registration marks of a Member State of the EU, when flying over the high seas, are required to follow the Rules of the Air specified\_\_\_.
      explanation: |-
        ### SERA.1001, General

        > (a) For flight over the high seas, the rules specified in **Annex 2 to the Chicago Convention shall apply without exception**.

        Over the territory of a State, SERA applies to the extent that it does not conflict with the rules published by that State (SERA.2001). Over the high seas no State has jurisdiction, so Annex 2 applies without exception.
      presets:
        - correctAnswers:
            - text: In Annex 2 of the Chicago Convention.
          wrongAnswers:
            - text: By the State through whose airspace the aircraft last flew.
            - text: By the State of Registry of the aircraft.
            - text: In Part FCL.
- id: QDZLG
  subjectId: "010"
  chapterId: "010.05"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-106443
  annexes: []
  learningObjectiveIds:
    - 010.05.02.01.03
    - 010.07.02.05.02
  templates:
    - type: simple
      question: An aircraft is taking off while another military aircraft is approaching the runway in front of the aircraft taking off. ATC instructs the aircraft taking off to increase its vertical speed and climb at 2500 ft/minute. If the flight crew follows the instruction, the aircraft will approach the stall. What is the correct course of action by the flight crew?
      explanation: |-
        ### SERA.8015(ea), Changes in clearance regarding route or level

        > (2) When traffic conditions will not permit clearance of a requested change, the word '**UNABLE**' shall be used.

        The pilot-in-command may depart from the rules only in circumstances that render such departure absolutely necessary in the interests of safety (SERA.2010(a)). When the aircraft cannot comply with an instruction, the standard pilot reply is UNABLE. AFFIRMATIVE means yes and NEGATIVE means no.
      presets:
        - correctAnswers:
            - text: "They cannot comply with the instructions, so they respond: UNABLE."
          wrongAnswers:
            - text: Do what ATC instructs them to do.
            - text: "They can comply with the instructions, so they respond: AFFIRMATIVE."
            - text: "They cannot comply with the instructions, so they respond: NEGATIVE."
