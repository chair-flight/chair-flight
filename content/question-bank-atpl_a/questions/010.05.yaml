      question: When two aircraft are approaching head-on or approximately so and there is a danger of collision, each aircraft shall..
      explanation: |-
        ### SERA.3210, Right-of-way

        > (c) An aircraft that is obliged by the following rules to keep out of the way of another shall avoid passing over, under or in front of the other, unless it passes well clear and takes into account the effect of aircraft wake turbulence. (1) **Approaching head-on**. When two aircraft are approaching head-on or approximately so and there is danger of collision, **each shall alter its heading to the right**.
      presets:
        - correctAnswers:
            - text: alter its heading to the right.
          wrongAnswers:
            - text: switch on all lights to warn the other aircraft of its position.
            - text: alter its heading to the left.
