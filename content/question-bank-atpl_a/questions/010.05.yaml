    - AVEXAM-57936
  annexes: []
  learningObjectiveIds:
    - 010.05.03.01.02
  templates:
    - type: multiple-correct
      question: "According to SERA, unless subjecting outside observers to harmful dazzle, the following lights shall be displayed at night by all aircraft in flight (in the cruise):"
      explanation: |-
        ### SERA.3215, Lights to be displayed by aircraft

        > (a) Except as provided by (e), at night all aircraft in flight shall display: (1) **anti-collision lights** intended to attract attention to the aircraft; and (2) except for balloons, **navigation lights** intended to indicate the relative path of the aircraft to an observer. Other lights shall not be displayed if they are likely to be mistaken for these lights.

        Landing lights and cabin lights are not required in flight. Landing lights may be used in addition to enhance conspicuity (GM1 SERA.3215(a);(b)).
      options:
        - text: Anti-collision lights intended to attract attention to the aircraft
          correct: true
        - text: Lights in all relevant passenger and accessible cargo compartments
          correct: false
        - text: Navigation lights intended to indicate the relative path of the aircraft
          correct: true
        - text: Two landing lights conveniently positioned on the aircraft.
          correct: false
      variants:
        - show:
            - 0
            - 1
            - 2
            - 3
