  learningObjectiveIds:
    - 010.05.03.01.04
  templates:
    - type: simple
      question: "Except when necessary for take-off or landing, or except by permission from the appropriate authority, the minimum height to be maintained by an aircraft over the congested areas of cities, towns or settlements is:"
      explanation: |-
        ### SERA.3105, Minimum heights

        > Except when necessary for take-off or landing, or except by permission from the competent authority, aircraft shall not be flown over the congested areas of cities, towns or settlements or over an open-air assembly of persons, unless at such a height as will **permit, in the event of an emergency arising, a landing to be made without undue hazard to persons or property on the surface**. The minimum heights for VFR flights shall be those specified in SERA.5005(f) and minimum levels for IFR flights shall be those specified in SERA.5015(b).

        Flight below the minimum height is permitted only when necessary for take-off or landing, or with permission from the competent authority. The VFR figure is 300 m (1 000 ft) above the highest obstacle within a radius of 600 m (SERA.5005(f)).
      presets:
        - correctAnswers:
            - text: A height that will permit an emergency landing to be made without undue hazard to persons or property.
          wrongAnswers:
            - text: At least 1 NM radius from the centre of the town.
            - text: A height of 600 m (2000 ft) above the highest obstacle within a radius of 300 m.
            - text: A height of 1500 ft above the highest obstacle within a radius of 600 m.
    - type: simple
      question: Under which circumstances is flight permitted below the minimum height to be maintained over the congested areas of cities, towns or settlements?
      explanation: |-
        ### SERA.3105, Minimum heights

        > Except when necessary for take-off or landing, or except by permission from the competent authority, aircraft shall not be flown over the congested areas of cities, towns or settlements or over an open-air assembly of persons, unless at such a height as will **permit, in the event of an emergency arising, a landing to be made without undue hazard to persons or property on the surface**. The minimum heights for VFR flights shall be those specified in SERA.5005(f) and minimum levels for IFR flights shall be those specified in SERA.5015(b).

        Flight below the minimum height is permitted only when necessary for take-off or landing, or with permission from the competent authority. The VFR figure is 300 m (1 000 ft) above the highest obstacle within a radius of 600 m (SERA.5005(f)).
      presets:
        - correctAnswers:
            - text: When necessary for take-off and landing.
          wrongAnswers:
            - text: When flying under VFR during daytime.
            - text: When operating under an ATC clearance.
            - text: When flying in uncontrolled airspace.
- id: QYVLW
  subjectId: "010"
  chapterId: "010.05"
  relatedQuestionIds: []
  externalQuestionIds:
