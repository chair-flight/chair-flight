  templates:
    - type: simple
      question: "Deviation from Flight Plan: Pilots of controlled flights are requested to inform the appropriate ATS whenever the average TAS at cruising level between reporting points varies or is expected to vary from the TAS given in the flight plan by:"
      explanation: |-
        ### ICAO Annex 2, Chapter 3, 3.6.2.2

        > Deviations from the current flight plan. In the event that a controlled flight deviates from its current flight plan, the following action shall be taken: […]
        >
        > c) Deviation from Mach number/true airspeed: if the sustained Mach number/true airspeed at cruising level varies by plus or minus Mach 0.02 or more, or **plus or minus 19 km/h (10 kt)** true airspeed or more from the current flight plan, the appropriate air traffic services unit shall be so informed.

        ### SERA.8020(b), Adherence to flight plan

        > (3) Deviation from Mach number/true airspeed: if the sustained Mach number/true airspeed at cruising level varies by plus or minus Mach 0,02 or more, or plus or minus **19 km/h (10 kt)** true airspeed or more from the current flight plan, the appropriate air traffic services unit shall be so informed.

        Earlier editions of Annex 2 set this threshold as a percentage, plus or minus 5 per cent of the true airspeed. 
        That wording is no longer in effect: the current Annex 2 and SERA use a fixed value of 10 kt true airspeed, 
        or Mach 0.02, and this is the value to apply. 

        Question banks and exams written against the older text still key 5 %, 
        so you may see it as the correct answer in an exam.

        In summary:

        - **TAS deviation**: +/- 10 kt (19 km/h) or Mach 0.02. Older editions: +/- 5 % of the TAS.
      presets:
        - correctAnswers:
            - text: 10 kt
          wrongAnswers:
            - text: 19 kt
            - text: 7 kt
            - text: 25 kt
    - type: simple
      question: Pilots of controlled flights shall inform the appropriate ATS when the average TAS at cruising level varies or is expected to vary from the TAS given in the flight plan by..
      explanation: |-
        ### ICAO Annex 2, Chapter 3, 3.6.2.2

        > Deviations from the current flight plan. In the event that a controlled flight deviates from its current flight plan, the following action shall be taken: […]
        >
        > c) Deviation from Mach number/true airspeed: if the sustained Mach number/true airspeed at cruising level varies by plus or minus Mach 0.02 or more, or plus or minus **19 km/h (10 kt)** true airspeed or more from the current flight plan, the appropriate air traffic services unit shall be so informed.

        ### SERA.8020(b), Adherence to flight plan

        > (3) Deviation from Mach number/true airspeed: if the sustained Mach number/true airspeed at cruising level varies by plus or minus Mach 0,02 or more, or plus or minus **19 km/h (10 kt)** true airspeed or more from the current flight plan, the appropriate air traffic services unit shall be so informed.

        Earlier editions of Annex 2 set this threshold as a percentage, plus or minus 5 per cent of the true airspeed. That wording is no longer in effect: the current Annex 2 and SERA use a fixed value of 10 kt true airspeed, or Mach 0.02, and this is the value to apply. Question banks and exams written against the older text still key 5 %, so you may see it as the correct answer in an exam.

        In summary:

        - **TAS deviation**: plus or minus 10 kt (19 km/h) or Mach 0.02. Older editions: plus or minus 5 % of the TAS.
        - **Altitude deviation** (ICAO Doc 4444, 8.5.5.1.1, tolerance for level information displayed to the controller): plus or minus 300 ft (90 m), or plus or minus 200 ft (60 m) in RVSM airspace.
      presets:
        - correctAnswers:
            - text: plus or minus 10 kt
          wrongAnswers:
            - text: plus or minus 5 %
            - text: plus or minus 5 kt
            - text: plus or minus 20 kt
        - correctAnswers:
            - text: plus or minus 5 %
          wrongAnswers:
            - text: plus or minus 2 %
            - text: plus or minus 3 %
            - text: plus or minus 4 %
