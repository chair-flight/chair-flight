- id: QNWZG
  subjectId: "010"
  chapterId: "010.05"
  relatedQuestionIds:
    - QKXMX
  externalQuestionIds:
    - ATPLQ-719746
    - AVEXAM-58198
  annexes: []
  learningObjectiveIds:
    - 010.05.01.01.01
  templates:
    - type: multiple-correct
      question: An aircraft is operating a commercial flight from Italy to Libya. Whose rules of the air should be followed?
      explanation: |-
        ### SERA.1001 and SERA.2001, Applicability

        > SERA.1001 (a) For flight over the high seas, the rules specified in **Annex 2 to the Chicago Convention shall apply** without exception.
        >
        > SERA.2001 This Annex applies to airspace users and aircraft […] (b) bearing the nationality and registration marks of a Member State of the Union, and operating in any airspace **to the extent that they do not conflict with the rules published by the State having jurisdiction over the territory overflown**.

        Over the high seas the ICAO rules of the air (Annex 2) apply. Over the territory of a State the rules of the State being overflown apply, here Libya. The State of departure does not set the rules for the whole flight.
      options:
        - text: Italy.
          correct: false
        - text: Libya.
          correct: false
        - text: ICAO rules of the air.
          correct: true
        - text: The state being overflown.
          correct: true
      variants:
        - show:
            - 0
            - 1
            - 2
            - 3
