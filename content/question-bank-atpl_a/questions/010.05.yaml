  learningObjectiveIds:
    - 010.05.02.01.03
  templates:
    - type: simple
      question: In the event of an ATC controller giving instructions which violate SERA, who is responsible for maintaining compliance with SERA?
      explanation: |-
        ### SERA.2010, Responsibilities

        > (a) The pilot-in-command of an aircraft shall, whether manipulating the controls or not, be **responsible for the operation of the aircraft in accordance with this Regulation**, except that the pilot-in-command may depart from these rules in circumstances that render such departure absolutely necessary in the interests of safety.

        The responsibility for compliance with SERA stays with the pilot-in-command even when ATC issues an instruction.
      presets:
        - correctAnswers:
            - text: Pilot in command
          wrongAnswers:
            - text: ATC
            - text: Operator
            - text: Dispatcher
