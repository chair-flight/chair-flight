- id: QEGVU
  subjectId: "010"
  chapterId: "010.05"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-108225
    - BGS-102283
    - AVEXAM-56916
  annexes: []
  learningObjectiveIds:
    - 010.05.03.01.02
  templates:
    - type: simple
      question: An aircraft registered in France is executing a flight from Paris, France to Santiago, Chile. When should the aircraft follow the European Rules of the Air (SERA)?
      explanation: |-
        ### SERA.2001, Subject

        > Without prejudice to SERA.1001, this Annex applies to airspace users and aircraft: […] (b) bearing the nationality and registration marks of a Member State of the Union, and operating in any airspace **to the extent that they do not conflict with the rules published by the State having jurisdiction over the territory overflown**.

        A French-registered aircraft therefore follows SERA on the whole flight, including over other States, except where SERA conflicts with the rules of the State being overflown.
      presets:
        - correctAnswers:
            - text: All the time, except when the SERA regulations conflict with those from the state overflying.
          wrongAnswers:
            - text: All the time, without exception.
            - text: Only over European Airspace, but not over other states.
            - text: Never.
    - type: simple
      question: A French-registered aircraft flies from Paris, France, to Santiago, Chile. For which portions of the flight do the European rules of the air (SERA) apply?
      explanation: |-
        ### SERA.2001, Subject

        > Without prejudice to SERA.1001, this Annex applies to airspace users and aircraft: […] (b) bearing the nationality and registration marks of a Member State of the Union, and operating in any airspace **to the extent that they do not conflict with the rules published by the State having jurisdiction over the territory overflown**.

        A French-registered aircraft therefore follows SERA on the whole flight, including over other States, except where SERA conflicts with the rules of the State being overflown.
      presets:
        - correctAnswers:
            - text: all parts of the flight in the airspaces of the States overflown, so long as SERA does NOT conflict with the rules of these States.
          wrongAnswers:
            - text: the high seas and the parts over the territory of the European Union, but SERA does NOT apply over the territories of other States.
            - text: the whole flight regardless of any regulations of the States being overflown.
            - text: the part over any ICAO Member State and the high seas, but NOT over the territories of other States.
- id: QCMQE
  subjectId: "010"
  chapterId: "010.05"
  relatedQuestionIds:
    - QHRLJ
  externalQuestionIds:
    - ATPLQ-107269
