- id: QILQK
  subjectId: "040"
  chapterId: "040.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-405175
    - BGS-401315
    - AVEXAM-27872
    - AVEXAM-78452
  annexes: []
  learningObjectiveIds:
    - 040.01.04.01.07
  templates:
    - type: simple
      question: |-
        The fatigue risk management system (FRMS) is a data-driven means of continuously monitoring and managing fatigue-related safety risks, based upon scientific principles and knowledge as well as operational experience that aims to ensure relevant personnel are performing at adequate levels of alertness.   
         Which kind of safety culture is established in a company using a FRMS?
      explanation: A FRMS relies on continuous data collection, analysis and feedback to improve safety. This is typical of a learning culture, which is one of the five components of safety culture, together with informed, reporting, just and flexible cultures.
      presets:
        - correctAnswers:
            - text: Learning culture.
          wrongAnswers:
            - text: Anti-authority.
            - text: Closed culture.
            - text: Non-punitive culture.
