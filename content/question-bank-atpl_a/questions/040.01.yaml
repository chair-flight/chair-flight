- id: QARHZ
  subjectId: "040"
  chapterId: "040.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-407185
    - BGS-401215
    - AVEXAM-31931
  annexes: []
  learningObjectiveIds:
    - 040.01.04.01.06
  templates:
    - type: simple
      question: |-
        The operator of an aircraft takes disciplinary action against the captain of a flight, claiming that they violated established operating procedures by landing with insufficient fuel on board. The captain can plausibly demonstrate that they have only made a mistake when documenting the fuel mass in the technical logbook after the flight, while the actual fuel on board after landing was well within the operational limits. The operator decides to suspend the pilot from work for 10 days.

        Which of the following statements is correct with regard to the operator's safety culture?
      explanation: ""
      presets:
        - correctAnswers:
            - text: "The operator does not apply the principle of “just culture”: to foster trust and collaboration. Such an unintended slip should be reported and discussed to prevent their future re-occurrence, it should not be punished."
          wrongAnswers:
            - text: In a “just culture” environment, the punishment of an employee for making an error is an example of bad management; errors and violations should not be punished in order to promote an atmosphere of trust.
            - text: The operator demonstrates an adequate concern towards safety and considers negligent behavior as unacceptable. Negligence displays a lack of awareness of risks and hazards, probably reducing the safety margin in flight.
            - text: The operator efficiently applies the principle of “just culture”, fairly punishing negligent behavior as a form of positive control. This can motivate employees to be more careful before taking action and promote risk awareness.
