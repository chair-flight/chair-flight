      question: In a scenario where a highly experienced Captain, an experienced co-pilot, and a young, inexperienced co-pilot are assigned to fly together and have all received a briefing that includes weather information, what is the recommended course of action next?
      explanation: Threat management works best when the whole crew shares the same picture. The Captain should discuss the potential threats of the flight with both co-pilots, including the less experienced one, so that all of them contribute and anticipate.
