  learningObjectiveIds:
    - 022.13.03.03.03
    - 022.13.03.03.04
  templates:
    - type: definition
      question: |-
        Which mode is shown on this Electronic Flight Instrument System (EFIS) navigation display?

        ![EFIS navigation display](annex:{{term}}:md)
      explanation: |-
        1. **Full VOR** uses a 360° compass rose and shows the selected VOR frequency.
        2. **PLAN** shows the route against a true-north-up map. The north arrow is
           at the lower right.
        3. **MAP** shows the route relative to the aircraft, with the track at the
           top and the aircraft symbol near the bottom centre.
        4. **Expanded VOR** uses a compass arc and shows the VOR frequency and a
           TO/FROM indication.
        5. **Expanded ILS** uses a compass arc and shows the ILS frequency and
           glideslope deviation scale.
      options:
        - id: OTNACYAHY
          term: AKAT
          definition: Full VOR/ILS mode with a VOR frequency selected
        - id: OVFUXLPGQ
          term: AREL
          definition: PLAN mode
        - id: OY9QFT1LQ
          term: ABPM
          definition: MAP mode
        - id: OMANHL6K8
          term: ABIF
          definition: Expanded VOR/ILS mode with a VOR frequency selected
        - id: OU2TCM7IJ
          term: AAKS
          definition: Expanded VOR/ILS mode with an ILS frequency selected
      fakeOptions: []
