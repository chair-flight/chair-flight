  templates:
    - type: one-two
      question: In computer architecture, which of these statements about a bus are correct or incorrect?
      explanation: A bus is the set of wires or fibres that carries addresses, data and control signals between the parts of a computer. Sequencing and coordination of operations is the job of the control unit, not the bus.
      pairs:
        - right: []
          wrong:
            - A bus ensures sequencing and coordination of operations
        - right:
            - A bus transfers data between computer components
          wrong: []
- id: QIALS
