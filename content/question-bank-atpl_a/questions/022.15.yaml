  learningObjectiveIds:
    - 022.15.01.01.02
  templates:
    - type: simple
      question: A modern computer makes use of different internal buses to..
      explanation: Internal buses carry address, data and control signals between the processor, memory and the other parts of a computer. They are not about separating hardware from software or supplying power.
      presets:
        - correctAnswers:
            - text: transfer address, data and control signals.
          wrongAnswers:
            - text: separate the hardware from the software.
            - text: supply electrical power to the different devices.
            - text: send and receive analogue and digital data.
