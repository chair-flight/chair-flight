- id: QJOEX
  subjectId: "081"
  chapterId: "081.07"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-819298
    - BGS-811106
    - AVEXAM-79038
  annexes: []
  learningObjectiveIds:
    - 081.07.04.04.02
  templates:
    - type: simple
      question: "In twin engine aeroplanes with propellers turning clockwise as seen from behind:"
      explanation: |-
        At positive angle of attack, P-factor shifts the effective thrust of each clockwise-turning propeller to the right of its hub as seen from behind. With the left engine failed, the remaining right engine therefore has the larger yawing moment arm. That makes the left engine critical.
      presets:
        - correctAnswers:
            - text: the left engine is the critical engine.
          wrongAnswers:
            - text: the right engine is the critical engine.
            - text: the left engine produces a higher yaw moment if the right engine fails than vice versa.
            - text: the ‘minimum control speed’ is determined by the failure of the right engine.
