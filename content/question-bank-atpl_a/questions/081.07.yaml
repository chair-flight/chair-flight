    - type: simple
      question: |-
        Which statement about a propeller is correct?

        I. Asymmetric blade effect increases when engine power is increased.   
        II. Asymmetric blade effect increases when the angle between the propeller axis and airflow through the propeller disc increases.
      explanation: ""
      presets:
        - correctAnswers:
            - text: I is correct, II is correct.
          wrongAnswers:
            - text: I is correct, II is incorrect.
            - text: I is incorrect, II is correct.
            - text: I is incorrect, II is incorrect.
    - type: simple
      question: |-
        Considering subsonic incompressible airflow through a Venturi, which statement is correct? 
         
        I. The static pressure in the undisturbed airflow is the same as in the throat. 
        II. The speed in the undisturbed airflow is lower than in the throat.
      explanation: ""
      presets:
        - correctAnswers:
            - text: I is incorrect, II is correct.
          wrongAnswers:
            - text: I is correct, II is incorrect.
            - text: I is correct, II is correct.
            - text: I is incorrect, II is incorrect.
        - correctAnswers:
            - text: I is correct, II is incorrect.
          wrongAnswers:
            - text: I is incorrect, II is incorrect.
            - text: I is correct, II is correct.
            - text: I is incorrect, II is correct.
    - type: simple
      question: |-
        Which of these statements about drag divergence Mach number are correct or incorrect?1. The drag divergence Mach number is higher than MCRIT
        2. Below the drag divergence Mach number and for a given angle of attack the drag coefficient CD is practically constant as the Mach number changes
      explanation: ""
      presets:
        - correctAnswers:
            - text: 1 is correct, 2 is correct.
          wrongAnswers:
            - text: 1 is incorrect, 2 is correct.
            - text: 1 is incorrect, 2 is incorrect.
            - text: 1 is correct, 2 is incorrect.
        - correctAnswers:
            - text: 1 is incorrect, 2 is correct.
          wrongAnswers:
            - text: 1 is incorrect, 2 is incorrect.
            - text: 1 is correct, 2 is correct.
            - text: 1 is correct, 2 is incorrect.
    - type: simple
      question: |-
        Which of these statements about drag divergence Mach number are correct or incorrect?

        1. MCRIT is lower than the drag divergence Mach number.

        2. Assuming a given angle of attack and for M D remains practically constant above the drag divergence Mach number.
      explanation: ""
      presets:
        - correctAnswers:
            - text: 1 is correct, 2 is incorrect.
          wrongAnswers:
            - text: 1 is incorrect, 2 is correct.
            - text: 1 is correct, 2 is correct.
            - text: 1 is incorrect, 2 is incorrect.
        - correctAnswers:
            - text: 1 is correct, 2 is correct.
          wrongAnswers:
            - text: 1 is incorrect, 2 is correct.
            - text: 1 is incorrect, 2 is incorrect.
            - text: 1 is correct, 2 is incorrect.
