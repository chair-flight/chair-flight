            - text: A load of 400 kg in a crate with dimensions 1.4 m × 0.8 m × 0.8 m.
            - text: A load of 500 kg in a crate with dimensions 1.5 m × 1 m × 1 m.
    - type: simple
      question: A box weighing 300 kg has a maximum running load capacity of 275 kg/m. Box dimensions are 1m x 1.5 m x 0.5 m (length x width x height). Which side of the box can be placed on the aircraft floor without exceeding the maximum running load capacity?
