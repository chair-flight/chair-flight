      question: |-
        A container has a base area of {{base_area}} m².

        The container is loaded on two ground supports (of negligible mass), each having floor-contact dimensions of {{support_length}} m x {{support_width}} m.

        Given that the maximum permissible floor load of the cargo compartment, which is {{limit}} kg/m², must be respected, what is the maximum mass that can be loaded in the container?
      explanation: |-
        When a container stands on supports, the load is transferred to the floor only through the support contact area, not through the whole base. The maximum mass is the floor limit times the total contact area of the two supports.

        **Solution**

        Contact area = 2 x {{support_length}} x {{support_width}} = {{macro1}} m²

        $$
        \text{Floor load limit}\times 2\times \text{Support length}\times \text{Support width} = {{limit}}\times 2\times {{support_length}}\times {{support_width}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: Divides the limit by the contact area instead of multiplying.
        - **{{d2}} kg**: Uses the contact area of only one support.
        - **{{d3}} kg**: Uses the whole base area of the container instead of the support contact area.
