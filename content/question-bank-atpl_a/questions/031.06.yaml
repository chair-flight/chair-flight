        The maximum permissible floor load (distribution load intensity), read from the figure, is {{floor_load}} kg/m².

        Determine the maximum mass that can be loaded in the container.
      explanation: |-
        The maximum floor load is a mass per unit area. Multiplying it by the container base area (length x width) gives the maximum mass that keeps the floor loading within limits; the height of the container is irrelevant.

        **Solution**

        $$
        \text{Max floor load (read from figure)}\times \text{Container length}\times \text{Container width} = {{floor_load}}\times {{length}}\times {{width}} = \mathbf{ {{answer}}\ \text{kg} }
