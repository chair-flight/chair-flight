  templates:
    - type: simple
      question: |-
        The maximum permissible floor loading for a cargo compartment is {{limit}} kg per square metre.

        A package with a mass of {{mass}} kg is to be loaded on a pallet whose base is entirely in contact with the floor.

        The pallet is {{length}} m long.

        What is the minimum width of the pallet (in metres, rounded to one decimal)?
      explanation: |-
        The pallet base area must be at least the mass divided by the maximum floor loading. With the length fixed, the minimum width is that area divided by the length.

        **Solution**

        Minimum area = {{macro1}} m²

        $$
        \frac{\frac{\text{Package mass}}{\text{Maximum floor loading}}}{\text{Pallet length}} = \frac{\frac{ {{mass}} }{ {{limit}} }}{ {{length}} } = \mathbf{ {{answer}}\ \text{m} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} m**: this is the required area, the length was not divided out.
        - **{{d2}} m**: the area is multiplied by the length instead of divided.
        - **{{d3}} m**: the ratio is inverted.
        - **{{d4}} m**: an arbitrary margin is added to the correct width.
      presets:
        - variables:
            limit: 170
            mass: 374
            length: 1.6
            macro1: 2.2
            answer: 1.4
            d1: 2.2
            d2: 3.5
            d3: 0.7
            d4: 1.6
          correctAnswers:
            - text: 1.4 m
          wrongAnswers:
            - text: 2.2 m
            - text: 0.7 m
            - text: 1.6 m
            - text: 3.5 m
        - variables:
            limit: 150
            mass: 360
            length: 2
            macro1: 2.4
            answer: 1.2
            d1: 2.4
            d2: 4.8
            d3: 0.8
            d4: 1.4
          correctAnswers:
            - text: 1.2 m
          wrongAnswers:
            - text: 2.4 m
            - text: 0.8 m
            - text: 1.4 m
            - text: 4.8 m
        - variables:
            limit: 200
            mass: 480
            length: 1.5
            macro1: 2.4
            answer: 1.6
            d1: 2.4
            d2: 3.6
            d3: 0.6
            d4: 1.8
          correctAnswers:
            - text: 1.6 m
          wrongAnswers:
            - text: 2.4 m
            - text: 0.6 m
            - text: 1.8 m
            - text: 3.6 m
