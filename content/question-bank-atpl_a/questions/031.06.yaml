      question: "The floor of a cargo hold is limited to {{limit}} N/m². It is planned to load a cubic container measuring {{side}} m on each side. Its maximum gross mass must not exceed (assume g = {{g}} m/s²):"
      explanation: |-
        The floor limit is a force per unit area, so the maximum weight is the limit times the contact area (side squared). Dividing by g converts this weight in newtons into a mass in kilograms.

        **Solution**

        $$
        \frac{\text{Floor load limit}\times {\text{Container side}}^{2}}{\text{Gravitational acceleration}} = \frac{ {{limit}}\times {{side}}^{2}}{10} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: Gives the maximum force in newtons; it was not divided by g.
        - **{{d2}} kg**: Uses the volume (side cubed) instead of the contact area and does not convert to mass.
        - **{{d3}} kg**: Uses the volume (side cubed) instead of the contact area.
        - **{{d4}} kg**: Uses the volume and multiplies by g instead of dividing.
      presets:
