      question: |-
        The maximum load per running metre of an aeroplane is 350 kg/m.

        The width of the floor area is 2 metres.

        The floor strength limitation is 300 kg per square metre.

        Which one of the following crates can be loaded directly on the floor?
      explanation: |-
        Check each crate against both limits (running load = mass ÷ length along the floor; floor load = mass ÷ base area):

        - 400 kg, 1.2 m × 1.2 m: 333 kg/m and 278 kg/m². Both within limits.
        - 400 kg, 1.4 m × 0.8 m: 357 kg/m² is over the floor limit.
        - 500 kg, 1.5 m × 1 m: 333 kg/m² is over the floor limit.
        - 700 kg, 1.8 m × 1.4 m: 389 kg/m is over the running limit.

        Only the **first crate** can go directly on the floor.
      presets:
