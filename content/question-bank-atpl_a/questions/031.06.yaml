  annexes:
    - id: AVCZ
  learningObjectiveIds:
    - 031.06.02.01.02
  templates:
    - type: simple
      question: |-
        A pallet with a freight platform measuring {{plat_l}} cm x {{plat_w}} cm has a total mass of {{pallet_mass}} kg.

        The pallet is carried on {{n_sup}} ground supports, each measuring {{sup_w}} cm x {{sup_l}} cm.

        The maximum permitted distribution load intensity of the lower deck forward cargo compartment, read from the loading manual figure (CAP696 Figure 4.9), is {{max_int}} kg/m².

        Calculate how much mass may be added to the pallet (positive result) or must be off-loaded (negative result) to match this load intensity.
      explanation: |-
        The load intensity on the floor is the mass divided by the contact area, which for a pallet is the area of the ground supports, not of the platform. The maximum total mass is the load intensity limit times the contact area; the difference with the current mass is what may be added or must be removed.

        **Solution**

        Contact area = {{macro1}} m²

        $$\frac{\text{Max distribution load intensity (read from figure)}\times \text{Number of ground supports}\times \text{Support width}\times \text{Support length}}{10000}-\text{Pallet mass} = \frac{731.9\times 2\times 20\times 200}{10000}-300 = \mathbf{ {{answer}}\ \text{kg} }$$ (positive: may be added)

        ## Why the other answers are wrong

        - **{{d1}} kg**: the existing pallet mass is not subtracted (maximum allowed total instead of the change).
        - **{{d2}} kg**: the sign is reversed, so a mass that may be added is shown as off-loaded.
        - **{{d3}} kg**: only one ground support is used for the contact area.
        - **{{d4}} kg**: the whole platform area is used instead of the area of the ground supports.
      presets:
        - variables:
            plat_l: 200
            plat_w: 250
            pallet_mass: 300
            n_sup: 2
            sup_w: 20
            sup_l: 200
            max_int: 731.9
            macro1: 0.8
            answer: 285.5
            d1: 585.5
            d2: -285.5
            d3: -7.2
            d4: 3359.5
          correctAnswers:
            - text: 285.5 kg
          wrongAnswers:
            - text: 585.5 kg
            - text: -7.2 kg
            - text: 3359.5 kg
            - text: -285.5 kg
