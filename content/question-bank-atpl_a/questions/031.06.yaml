      question: Calculate the minimum required floor contact area for a load of {{mass_t}} metric tons, in order to avoid exceeding the cargo compartment’s maximum permissible floor load of {{load}} kg/m².
      explanation: |-
        The floor load is the mass divided by the contact area, so the minimum contact area that keeps the floor load at its limit is the mass divided by the maximum permissible floor load. Convert tonnes to kg first.

        **Solution**

        $$
        \frac{\text{Load mass}\times 1000}{\text{Maximum floor load}} = \frac{ {{mass_t}}\times 1000}{ {{load}} } = \mathbf{ {{answer}}\ \text{m²} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} m²**: the mass is multiplied by the floor load instead of divided.
        - **{{d2}} m²**: mass multiplied by the floor load, with the tonnes converted to kg.
        - **{{d3}} m²**: wrong unit conversion (1 t = 100 kg).
        - **{{d4}} m²**: this is the side length of a square contact area, not the area.
