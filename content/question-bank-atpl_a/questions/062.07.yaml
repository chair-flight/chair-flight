            - text: Linear guidance means instrument approach operation in which the maximum tolerable error/deviation from the planned track is expressed in units of length, for instance nautical miles, for cross-track lateral deviation.
          wrongAnswers:
            - text: Angular guidance means instrument approach operation in which the maximum tolerable error/deviation from the planned track is expressed in percent of maximum deviation distance for cross-track lateral deviation.
