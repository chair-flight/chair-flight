- id: QCJUT
  subjectId: "062"
  chapterId: "062.07"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-626263
    - BGS-621508
    - AVEXAM-79025
  annexes: []
  learningObjectiveIds:
    - 062.07.05.05.06
  templates:
    - type: simple
      question: An aircraft NOT equipped with temperature-compensating system is executing an RNP APCH to a Baro-VNAV minimum. The minimum temperature to execute the procedure (TMIN) is -8°C. The temperature at the airport is +10°C. The pilots have set the appropriate FMS settings based on the charts of the approach and the aircraft follows the FMS guidance. During the final approach segment, ATC instructs the pilots to go-around immediately as a result of insufficient separation from the surrounding terrain. What caused this outcome?
      explanation: Baro-VNAV relies on the altimeter setting. An incorrect setting makes the aircraft lower than the altimeter indicates, so it follows the vertical path below the intended one. The temperature of +10 °C is above the limit TMIN of -8 °C, so it is not the cause.
      presets:
        - correctAnswers:
            - text: Incorrect altimeter setting leading to the aircraft being lower than indicated.
          wrongAnswers:
            - text: The pilots miscalculated the rate of descent and selected an inappropriate vertical speed.
            - text: The temperature at the aerodrome is above the limiting temperature.
            - text: The vertical path in the FMS was incorrectly coded as it is NOT shown to the pilots.
