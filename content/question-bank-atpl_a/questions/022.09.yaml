    - 022.09.01.01.02
  templates:
    - type: simple
      question: During a normal take-off, what is the autothrust set to?
      explanation: During take-off the autothrust holds a fixed thrust setting, taken from the performance database, rather than a speed or climb rate. The pilot or the system sets it at the start of the roll.
      presets:
        - correctAnswers:
            - text: To maintain a constant pre-set thrust setting, in accordance with the performance database.
          wrongAnswers:
            - text: To maintain a constant aircraft pitch attitude.
            - text: To maintain a constant rate of climb.
            - text: To maintain a constant speed.
