  templates:
    - type: simple
      question: During engine start..
      explanation: The autothrottle is not used during engine start, and it does not protect against hot or wet starts. It is only available once the engines are running.
      presets:
        - correctAnswers:
            - text: the Autothrottle system is not used.
          wrongAnswers:
            - text: the Autothrottle protects against hot start.
            - text: the Autothrottle protects against wet start.
            - text: the Autothrottle uses ambient conditions to assist starting.
    - type: simple
      question: "The autothrottle system:"
      explanation: The autothrottle is not used during engine start, and it does not protect against hot or wet starts. It is only available once the engines are running. Once the engines are running, the autothrottle can be used for take-off thrust.
      presets:
        - correctAnswers:
            - text: can be used for take-off.
          wrongAnswers:
            - text: can be engaged in the TAS mode, holding a constant TAS, during a final approach.
            - text: can be engaged in the GS mode, holding a constant ground speed, during a final approach.
            - text: is automatically disconnected when the aircraft is on the ground.
