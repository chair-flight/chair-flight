- id: QDUGJ
  subjectId: "032"
  chapterId: "032.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-324861
    - AVEXAM-80335
  annexes: []
  learningObjectiveIds:
    - 032.01.02.02.01
  templates:
    - type: simple
      question: If the climb gradient in still air is {{grad}} percent, and the height achieved is {{height}} ft, what is the distance travelled in the climb in still air (in NM, 1 NM = 6076 ft)?
      explanation: |-
        Gradient is height gained divided by horizontal distance, so the distance equals height divided by gradient. The result in feet is converted to nautical miles.

        **Solution**

        Distance = {{macro1}} ft

        $$
        \frac{\frac{\text{Height gained}}{\frac{\text{Climb gradient}}{100}}}{6076} = \frac{\frac{ {{height}} }{\frac{ {{grad}} }{100}} }{6076} = \mathbf{ {{answer}}\ \text{NM} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} NM**: divides by 1852 (metres per NM) instead of 6076 ft per NM.
        - **{{d2}} NM**: treats the percentage as an angle in degrees.
        - **{{d3}} NM**: converts feet using 3281 (ft per km) instead of 6076.
        - **{{d4}} NM**: uses 5280 ft (statute mile) instead of the nautical mile.
      presets:
        - variables:
            grad: 3.2
            height: 640
            macro1: 20000
            answer: 3.29
            d1: 10.8
            d2: 1.88
            d3: 6.1
            d4: 3.79
          correctAnswers:
            - text: 3.29 NM
          wrongAnswers:
            - text: 10.8 NM
            - text: 6.1 NM
            - text: 3.79 NM
            - text: 1.88 NM
        - variables:
            grad: 5
            height: 1200
            macro1: 24000
            answer: 3.95
            d1: 12.96
            d2: 2.26
            d3: 7.31
            d4: 4.55
          correctAnswers:
            - text: 3.95 NM
          wrongAnswers:
            - text: 12.96 NM
            - text: 7.31 NM
            - text: 4.55 NM
            - text: 2.26 NM
        - variables:
            grad: 2.5
            height: 800
            macro1: 32000
            answer: 5.27
            d1: 17.28
            d2: 3.02
            d3: 9.75
            d4: 6.06
          correctAnswers:
            - text: 5.27 NM
          wrongAnswers:
            - text: 17.28 NM
            - text: 9.75 NM
            - text: 6.06 NM
            - text: 3.02 NM
