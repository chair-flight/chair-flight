- id: QFAAO
  subjectId: "032"
  chapterId: "032.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-323597
    - BGS-321226
  annexes: []
  learningObjectiveIds:
    - 032.01.04.01.11
  templates:
    - type: simple
      question: |-
        What is the all-engines climb gradient (in %) for a twin-engine aeroplane with the following data given? Use 1 kg = 2.2 lb.

        - Number of engines: {{n}}
        - Thrust per engine: {{thrust}} lbs
        - Mass: {{mass}} kg
        - Lift to Drag ratio: {{ld}}:1

        g = 10 m/s²
      explanation: |-
        In a steady climb the gradient is the thrust-to-weight ratio minus the drag-to-weight ratio, and drag over weight equals 1/(L/D). With all engines operating the total thrust is the number of engines times the thrust per engine; thrust and weight must be in the same unit (here lb).

        **Solution**

        $$
        (\frac{\text{Number of engines}\times \text{Thrust per engine}}{\text{Mass}\times 2.2}-\frac{1}{\text{Lift to drag ratio}})\times 100 = (\frac{2\times {{thrust}} }{ {{mass}}\times 2.2}-\frac{1}{ {{ld}} })\times 100 = \mathbf{ {{answer}}\ \text{%} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} %**: only the thrust of one engine is used.
        - **{{d2}} %**: the drag term 1/(L/D) is forgotten.
        - **{{d3}} %**: the drag term is added instead of subtracted.
        - **{{d4}} %**: this is only the drag-to-weight ratio 1/(L/D), not the gradient.
      presets:
        - variables:
            n: 2
            thrust: 33000
            mass: 89500
            ld: 7.8
            answer: 20.7
            d1: 3.9
            d2: 33.5
            d3: 46.3
            d4: 12.8
          correctAnswers:
            - text: 20.7 %
          wrongAnswers:
            - text: 3.9 %
            - text: 46.3 %
            - text: 12.8 %
            - text: 33.5 %
        - variables:
            n: 2
            thrust: 25000
            mass: 60000
            ld: 8.5
            answer: 26.1
            d1: 7.2
            d2: 37.9
            d3: 49.6
            d4: 11.8
          correctAnswers:
            - text: 26.1 %
          wrongAnswers:
            - text: 7.2 %
            - text: 49.6 %
            - text: 11.8 %
            - text: 37.9 %
        - variables:
            n: 2
            thrust: 20000
            mass: 45000
            ld: 9
            answer: 29.3
            d1: 9.1
            d2: 40.4
            d3: 51.5
            d4: 11.1
          correctAnswers:
            - text: 29.3 %
          wrongAnswers:
            - text: 9.1 %
            - text: 51.5 %
            - text: 11.1 %
            - text: 40.4 %
- id: QNOEV
  subjectId: "032"
  chapterId: "032.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-328094
    - BGS-320577
  annexes: []
  learningObjectiveIds:
    - 032.01.04.01.11
  templates:
    - type: simple
      question: |-
        Determine the one-engine-out climb gradient of a four-engined aeroplane, given:

        - Aeroplane mass: {{mass}} kg
        - Thrust per engine: {{thrust}} N
        - Drag: {{drag}} N
        - (Assume the acceleration due to gravity is {{g}} m/s**2**)
      explanation: |-
        The climb gradient is the excess thrust (thrust minus drag) divided by the weight. With one of the four engines failed, only three engines contribute thrust.

        **Solution**

        Excess thrust: 3 x {{thrust}} N - {{drag}} N = {{macro1}} N

