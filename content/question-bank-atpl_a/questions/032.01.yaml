- id: QCETK
  subjectId: "032"
  chapterId: "032.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-323379
  annexes: []
  learningObjectiveIds:
    - 032.01.01.03.01
    - 032.02.03.01.01
  templates:
    - type: simple
      question: |-
        Based on actual conditions, an aeroplane has the following performance take-off mass limitations:

        | FLAPS | **0º** | **10º** | **15º** |
        | ------ | ------- | ------- | ------- |
        | RUNWAY | {{r0}} kg | {{r10}} kg | {{r15}} kg |
        | CLIMB | {{c0}} kg | {{c10}} kg | {{c15}} kg |

        Structural limits: take-off/landing/zero fuel: {{smax}} kg

        The Maximum Take-off Mass is:
      explanation: |-
        For each flap setting the take-off mass is limited by the lower of the runway limit and the climb limit. The best flap setting is the one that gives the highest of these values, and the structural limit then caps the result.

        **Solution**

        For each flap setting take the lower of runway and climb limit, choose the highest of the three, then compare it with the structural limit:

        $$
        \text{min}(\text{Structural limit},\text{max}(\text{min}(\text{Runway limit flaps 0},\text{Climb limit flaps 0}),\text{min}(\text{Runway limit flaps 10},\text{Climb limit flaps 10}),\text{min}(\text{Runway limit flaps 15},\text{Climb limit flaps 15}))) = \text{min}({{smax}},\text{max}(\text{min}({{r0}},{{c0}}),\text{min}({{r10}},{{c10}}),\text{min}({{r15}},{{c15}}))) = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: takes the limit of flaps 15 only, which is not the best flap setting.
        - **{{d2}} kg**: takes the highest climb limit and ignores the runway and structural limits.
        - **{{d3}} kg**: takes the limit of flaps 0 only, which is not the best flap setting.
      presets:
        - variables:
            r0: 4100
            r10: 4400
            r15: 4600
            c0: 4700
            c10: 4500
            c15: 4200
            smax: 4300
            answer: 4300
            d1: 4200
            d2: 4700
            d3: 4100
          correctAnswers:
            - text: 4300 kg
          wrongAnswers:
            - text: 4100 kg
            - text: 4200 kg
            - text: 4700 kg
        - variables:
            r0: 5100
            r10: 5400
            r15: 5700
            c0: 5900
            c10: 5600
            c15: 5200
            smax: 5500
            answer: 5400
            d1: 5200
            d2: 5900
            d3: 5100
          correctAnswers:
            - text: 5400 kg
          wrongAnswers:
            - text: 5100 kg
            - text: 5200 kg
            - text: 5900 kg
