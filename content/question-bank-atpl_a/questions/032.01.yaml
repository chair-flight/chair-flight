  annexes: []
  learningObjectiveIds:
    - 032.01.03.02.06
  templates:
    - type: simple
      question: A turbojet is flying at a constant IAS and pressure altitude. Given that a ±1 °C ISA deviation results in a change in fuel flow of ±{{k}} %, determine by how many percent the specific fuel consumption (SFC) increases if the OAT is ISA +{{dev}} °C rather than ISA.
      explanation: |-
        At constant IAS and pressure altitude the thrust and the TAS-related quantities stay the same, so the fuel flow change per degree of ISA deviation translates directly into the same percentage change in SFC.

        **Solution**

        $$
        \text{ISA deviation}\times \text{Fuel flow change per °C} = {{dev}}\times 0.2 = \mathbf{ {{answer}}\ \text{% increase} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} % increase**: a factor 10 slip (20 % instead of 2 %).
        - **{{d2}} % increase**: dividing instead of multiplying.
        - **{{d3}} % increase**: inverting the ratio.
        - **{{d4}} % increase**: a wrong factor applied to the per-degree change.
      presets:
        - variables:
            k: 0.2
            dev: 10
            answer: 2
            d1: 20
            d2: 50
            d3: 0
            d4: 10
          correctAnswers:
            - text: 2 % increase
          wrongAnswers:
            - text: 20 % increase
            - text: 0 % increase
            - text: 10 % increase
            - text: 50 % increase
        - variables:
            k: 0.2
            dev: 15
            answer: 3
            d1: 30
            d2: 75
            d3: 0
            d4: 15
          correctAnswers:
            - text: 3 % increase
          wrongAnswers:
            - text: 30 % increase
            - text: 0 % increase
            - text: 15 % increase
            - text: 75 % increase
        - variables:
            k: 0.2
            dev: 5
            answer: 1
            d1: 10
            d2: 25
            d3: 0
            d4: 5
          correctAnswers:
            - text: 1 % increase
          wrongAnswers:
            - text: 10 % increase
            - text: 0 % increase
            - text: 5 % increase
            - text: 25 % increase
