- id: QFPRR
  subjectId: "032"
  chapterId: "032.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-325705
    - BGS-320496
  annexes: []
  learningObjectiveIds:
    - 032.01.02.02.02
  templates:
    - type: simple
      question: London City Airport has a landing approach glide slope of {{ang}}°. What flight path gradient does this equate to? Give the answer in %.
      explanation: |-
        A gradient in percent is the tangent of the flight path angle multiplied by 100 (height gained or lost per 100 units of horizontal distance).

        **Solution**

        $$
        100\times \text{tan}(\text{Glide slope angle}) = 100\times \text{tan}({{ang}}) = \mathbf{ {{answer}}\ \text{%} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} %**: uses the angle in degrees as if it were the gradient in percent.
        - **{{d2}} %**: applies a wrong rule-of-thumb factor to the angle.
        - **{{d3}} %**: gives the tangent without multiplying by 100.
        - **{{d4}} %**: adds an unjustified 1 % to the correct gradient.
      presets:
        - variables:
            ang: 5.5
            answer: 9.6
            d1: 5.5
            d2: 9.9
            d3: 0.1
            d4: 10.6
          correctAnswers:
            - text: 9.6 %
          wrongAnswers:
            - text: 5.5 %
            - text: 0.1 %
            - text: 10.6 %
            - text: 9.9 %
        - variables:
            ang: 3
            answer: 5.2
            d1: 3
            d2: 5.4
            d3: 0.1
            d4: 6.2
          correctAnswers:
            - text: 5.2 %
          wrongAnswers:
            - text: 3 %
            - text: 0.1 %
            - text: 6.2 %
            - text: 5.4 %
        - variables:
            ang: 4.5
            answer: 7.9
            d1: 4.5
            d2: 8.1
            d3: 0.1
            d4: 8.9
          correctAnswers:
