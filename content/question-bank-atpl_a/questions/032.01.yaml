  templates:
    - type: simple
      question: |-
        Determine the ASDA for runway 09, given:

        - TORA: {{tora}} m
        - Stopway: {{stopway}} m
        - Clearway: {{clearway}} m
      explanation: |-
        The Accelerate-Stop Distance Available (ASDA) is the take-off run available plus the stopway, since an aborted take-off can use the stopway. A clearway only extends the take-off distance available (TODA) and does not count for ASDA.

        **Solution**

        $$
        \text{TORA}+\text{Stopway} = {{tora}}+{{stopway}} = \mathbf{ {{answer}}\ \text{m} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} m**: this is only the TORA; the stopway is forgotten.
        - **{{d2}} m**: adds the clearway instead of the stopway (that is part of TODA, not ASDA).
        - **{{d3}} m**: adds both stopway and clearway; the clearway is not usable for stopping.
        - **{{d4}} m**: subtracts the stopway instead of adding it.
      presets:
