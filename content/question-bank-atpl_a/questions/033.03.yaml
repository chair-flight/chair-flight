  templates:
    - type: simple
      question: |-
        Refer to figure. For pre-flight planning, calculate the total fuel required for a Commercial Air Transport flight with a Performance Class A aeroplane. Assume the Basic Fuel Scheme WITHOUT variations applies, with contingency fuel of 5 % of the trip fuel and a final reserve of 30 minutes of holding fuel. The weather at the destination is forecast to be below the applicable minima, but two alternates with suitable weather have been chosen. The flight's payload means that minimum block fuel will be taken.

        - Taxi fuel: {{taxi}} kg
        - Trip fuel (read from the figure for 250 NGM, 50 kt headwind and an expected landing mass of 65 000 kg): {{trip_fuel}} kg
        - Holding fuel flow: {{holding_flow}} kg/h
        - Destination alternate 1 fuel: {{alt_fuel_1}} kg
        - Destination alternate 2 fuel: {{alt_fuel_2}} kg
        - Additional, extra and discretionary fuel: 0 kg

        What is the total fuel required?
      explanation: |-
        The total is built up block by block: taxi fuel, trip fuel, contingency fuel, alternate fuel and final reserve. With two alternates, the smaller of the two alternate fuel figures is carried.

        **Solution**

        - Contingency fuel: 5 % of {{trip_fuel}} kg
        - Total: $$\text{Taxi fuel}+1.05\times \text{Trip fuel (read from figure)}+\text{min}(\text{Alternate 1 fuel},\text{Alternate 2 fuel})+0.5\times \text{Holding fuel flow} = 230+1.05\times 2995.2+\text{min}(1230,1950)+0.5\times 2400 = \mathbf{ {{answer}}\ \text{kg} }$$

        ## Why the other answers are wrong

        - **{{d1}} kg**: leaves out the contingency fuel.
        - **{{d2}} kg**: carries the larger alternate fuel instead of the smaller one.
        - **{{d3}} kg**: leaves out the final reserve.
        - **{{d4}} kg**: carries a full hour of holding fuel as final reserve instead of 30 minutes.
      presets:
        - variables:
            taxi: 230
            trip_fuel: 2995.2
            holding_flow: 2400
            alt_fuel_1: 1230
            alt_fuel_2: 1950
