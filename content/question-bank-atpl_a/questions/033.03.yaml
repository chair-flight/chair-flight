        For pre-flight planning purposes, what is the required fuel for a VFR Commercial Air Transport flight with reciprocating engines? Assume the Basic Fuel Scheme WITHOUT variations applies. No alternate selected and good weather expected. Extra fuel: 0 kg. Discretionary fuel: 0 kg.

        - Fuel flow: {{ff}} kg/h
        - Trip time: {{trip_time}} min

        Give the answer in kg.
      explanation: |-
        Under the Basic Fuel Scheme for a VFR commercial air transport flight with reciprocating engines, the required fuel is the trip fuel, plus a contingency of 5 % of the trip fuel, plus the final reserve, which is the fuel for 60 minutes at the fuel flow. With no alternate, the alternate fuel is zero.

        **Solution**

        Trip fuel = $$\frac{ {{ff}}\times {{trip_time}} }{60}$$ kg

        Contingency (5 %) = {{macro2}} kg

        Final reserve (60 min) = $${{ff}}$$ kg

        $$
        \frac{\text{Fuel flow}\times \text{Trip time}}{60}\times 1.05+\text{Fuel flow} = \frac{ {{ff}}\times {{trip_time}} }{60}\times 1.05+{{ff}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: trip fuel only, without contingency and final reserve.
        - **{{d2}} kg**: trip fuel with contingency but without the final reserve.
        - **{{d3}} kg**: uses a 45 minute final reserve instead of 60 minutes.
        - **{{d4}} kg**: forgets the contingency fuel.
