        - **{{d2}} kg**: landing mass headroom without applying the fuel penalty.
        - **{{d3}} kg**: landing mass headroom with the penalty, but this limit is not the most restrictive one.
        - **{{d4}} kg**: tank headroom without subtracting the taxi fuel.
