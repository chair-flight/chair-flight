      explanation: |-
        Trip fuel is the fuel burnt on the route. It follows from the distance, the groundspeed (true airspeed plus tailwind) and the fuel consumption. The reduced contingency fuel procedure adds 5% of the trip fuel as contingency. Alternate fuel is not part of this sum, so it is not added.

