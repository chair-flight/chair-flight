        - Taxi fuel: {{taxi}} kg
        - Take-off and climb fuel: {{takeoff}} kg

        Cruise distance: 378 NAM
        Average wind component in cruise: +20 kt
        OAT: ISA

        - Descent fuel: {{descent}} kg
        - Approach and landing fuel: {{approach}} kg

