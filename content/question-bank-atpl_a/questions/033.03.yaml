        For the following information, calculate the maximum attainable range:

        - Average fuel flow: {{ff}} USG/h
        - Available fuel: {{fuel}} USG
        - TAS: {{tas}} kt
        - Wind component: {{wc}} kt (positive = tailwind, negative = headwind)
      explanation: |-
        The endurance is the available fuel divided by the fuel flow. The maximum range is the endurance multiplied by the ground speed, i.e. the TAS corrected for the wind component (plus for a tailwind, minus for a headwind).

        **Solution**

        Endurance: {{macro1}} h

