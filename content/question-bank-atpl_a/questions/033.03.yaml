  templates:
    - type: simple
      question: |-
        For pre-flight planning purposes, determine the required trip fuel for a turbine-engine jet aircraft. Assume the Basic Fuel Scheme WITHOUT variations applies.

        - Taxi fuel: {{taxi}} kg
        - APU consumption: {{apu}} kg
        - Take-off and climb fuel: {{takeoff}} kg
        - Cruise fuel flow: {{flow}} kg/h
        - Cruise time: {{cruise_min}} min
        - Descent and landing fuel: {{descent}} kg

        Contingency fuel: 5% or 5 min
        Alternate fuel: 2200 kg
        Final reserve fuel: 1100 kg
        Extra fuel: 0 kg
        Discretionary fuel: 0 kg

        Give the trip fuel in kg.
      explanation: |-
        The trip fuel is the take-off and climb fuel, plus the cruise fuel flow multiplied by the cruise time (converted to hours), plus the descent and landing fuel. Taxi fuel, APU fuel, contingency, alternate and final reserve are not part of the trip fuel.

        **Solution**

        Cruise fuel = {{macro1}} kg

        $$
        \text{Take-off and climb fuel}+\frac{\text{Cruise fuel flow}\times \text{Cruise time}}{60}+\text{Descent and landing fuel} = {{takeoff}}+\frac{ {{flow}}\times {{cruise_min}} }{60}+{{descent}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: adds the taxi fuel, which is not part of the trip fuel.
        - **{{d2}} kg**: adds the APU consumption, which is not part of the trip fuel.
        - **{{d3}} kg**: forgets the descent and landing fuel.
        - **{{d4}} kg**: uses the cruise time in minutes instead of hours.
      presets:
