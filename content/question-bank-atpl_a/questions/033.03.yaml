  templates:
    - type: simple
      question: |-
        For pre-flight planning purposes, what is the minimum Take-off Fuel required for the Commercial Air Transport flight in an MRJT aeroplane, given the following information? The operator has nominated a suitable En-Route Alternate aerodrome. Assume the Basic Fuel Scheme WITHOUT variations applies and ignore taxi fuel.

        - Estimated flight time: {{tt}} min
        - Estimated flight time to alternate: {{ta}} min
        - Average fuel flow: {{ff}} kg/h
        - Holding fuel flow: {{hold}} kg/h

        Extra fuel: 0 kg
        Discretionary fuel: 0 kg
      explanation: |-
        Take-off fuel = trip fuel + contingency fuel + alternate fuel + final reserve. With a nominated en-route alternate the contingency fuel is 3 % of the trip fuel, but not less than 5 minutes at holding fuel flow. The final reserve is 30 minutes at holding fuel flow for a jet.

        **Solution**

        Trip fuel = {{ff}} * {{tt}} / 60 = {{macro1}} kg
        Contingency = max(3 % = {{macro2}} kg; 5 min = {{macro3}} kg) = {{macro4}} kg
        Alternate fuel = {{macro5}} kg
        Final reserve = {{macro6}} kg

        Total = {{macro7}} kg = **{{answer}} kg**

        ## Why the other answers are wrong

        - **{{d1}} kg**: uses the 5 % contingency instead of the 3 % applicable with an en-route alternate.
        - **{{d2}} kg**: omits the alternate fuel.
        - **{{d3}} kg**: calculates the alternate fuel with the holding fuel flow instead of the average fuel flow.
        - **{{d4}} kg**: uses a 45 minute final reserve, which is the piston-engine value.
        - **{{d5}} kg**: calculates the final reserve with the average fuel flow instead of the holding fuel flow.
