        - **{{d1}} kg**: uses the nearer alternate (shorter flight time) instead of the more demanding one.
        - **{{d2}} kg**: correct alternate, but wrongly adds 30 minutes of fuel flow (final reserve is a separate item).
        - **{{d3}} kg**: uses the nearer alternate and also adds 30 minutes of fuel flow.
