        - Holding time required, read from the annex figure: {{ht}} h
      explanation: |-
        The additional fuel is the holding fuel flow multiplied by the holding time that the annex requires for the situation. The holding time is read from the figure; the calculation uses the holding fuel flow, not the trip fuel flow.

        **Solution**

        $$
        \text{Holding fuel flow}\times \text{Holding time read from the figure} = 2400\times 0.5 = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: uses the average trip fuel flow instead of the holding fuel flow.
        - **{{d2}} kg**: uses the trip fuel flow and four times the holding time.
        - **{{d3}} kg**: doubles the holding fuel flow and the holding time.
        - **{{d4}} kg**: adds an additional 30 minutes to the holding time.
      presets:
        - variables:
            ff: 2849
            hold: 2400
            ht: 0.5
            answer: 1200
            d1: 1425
            d2: 5698
            d3: 4800
            d4: 2400
          correctAnswers:
            - text: 1200 kg
          wrongAnswers:
            - text: 1425 kg
            - text: 4800 kg
            - text: 2400 kg
            - text: 5698 kg
