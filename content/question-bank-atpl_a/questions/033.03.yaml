        Due to significant weather conditions in the vicinity of the destination aerodrome, the pilot of a Commercial Air Transport flight has to plan for two destination alternate aerodromes. Given the following information, what is the Alternate Fuel required?

        - Average cruise fuel flow: {{ff}} kg/min
        - Fuel for missed approach: {{missed}} kg
        - Flight time from missed approach altitude to destination alternate 1: {{t1}} min
        - Flight time from missed approach altitude to destination alternate 2: {{t2}} min
      explanation: |-
        With two destination alternates, the alternate fuel must be sufficient to reach the one that needs more fuel, i.e. the one with the longer flight time. It consists of the missed approach fuel plus the cruise fuel to that alternate.

