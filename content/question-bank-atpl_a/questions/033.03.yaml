        \frac{\text{Available fuel}}{\text{Fuel flow}}\times (\text{TAS}+\text{Wind component (tailwind positive, headwind negative)}) = \frac{ {{fuel}} }{ {{ff}} }\times ({{tas}}+({{wc}})) = \mathbf{ {{answer}}\ \text{NM} }
