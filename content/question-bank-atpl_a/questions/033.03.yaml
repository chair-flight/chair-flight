        - **{{d1}} kg**: leaves out the APU fuel.
        - **{{d2}} kg**: forgets the taxi fuel.
        - **{{d3}} kg**: uses the APU fuel flow per hour with the time in minutes, a unit mistake.
        - **{{d4}} kg**: forgets the final reserve fuel.
