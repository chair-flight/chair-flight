  templates:
    - type: simple
      question: |-
        For pre-flight planning purposes what is the total fuel required for a Commercial Air Transport flight with a multi-engined piston aircraft under IFR? Assume the Basic Fuel Scheme WITHOUT variations applies.

        - Trip Fuel: {{trip}} litres
        - Destination Alternate Fuel: {{altf}} litres
        - Taxi Fuel: {{taxi}} litres
        - Fuel flow: {{ff}} litres per hour

        Extra Fuel: 0 litres
        Discretionary Fuel: 0 litres
      explanation: |-
        Under the Basic Fuel Scheme the total fuel is taxi fuel + trip fuel + contingency fuel + alternate fuel + final reserve fuel (+ extra and discretionary fuel, here zero). Contingency is 5% of trip fuel. For a piston-engine aeroplane the final reserve is 45 minutes at normal cruise consumption.

        **Solution**

        Contingency = 0.05 × {{trip}} = {{macro1}} litres
        Final reserve = 0.75 h × {{ff}} litres/h = {{macro2}} litres

        $$
        \text{Taxi fuel}+\text{Trip fuel}+0.05\times \text{Trip fuel}+\text{Alternate fuel}+0.75\times \text{Fuel flow} = {{taxi}}+{{trip}}+0.05\times {{trip}}+{{altf}}+0.75\times {{ff}} = \mathbf{ {{answer}}\ \text{litres} }
        $$

