        - Distance from A to DP: {{ddp}} NM
        - TAS: {{tas}} kt
        - Fuel flow: {{ff}} kg/h
        - Headwind component: {{hw}} kt

        Give the contingency fuel in kg.
      explanation: |-
        With the decision point procedure the contingency fuel is 5 % of the trip fuel from the decision point to the destination B (the longer of the two legs from DP). Trip fuel is flight time times fuel flow; the time uses the ground speed (TAS minus head wind).

        **Solution**

        Distance DP to B = {{dab}} - {{ddp}} = {{macro1}} NM

        Ground speed = {{tas}} - {{hw}} = {{macro2}} kt

        $$
        \frac{0.05\times \text{Fuel flow}\times (\text{Distance A to B}-\text{Distance A to DP})}{\text{TAS}-\text{Headwind component}} = \frac{0.05\times {{ff}}\times ({{dab}}-{{ddp}})}{ {{tas}}-{{hw}} } = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: the whole distance A to B was used instead of DP to B.
        - **{{d2}} kg**: the head wind was ignored (TAS used as ground speed).
        - **{{d3}} kg**: the wind was added instead of subtracted.
        - **{{d4}} kg**: the distance from DP to the alternate destination C direction was used instead of DP to B.
