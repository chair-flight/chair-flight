- id: QHPTH
  subjectId: "033"
  chapterId: "033.03"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-332637
    - BGS-330265
  annexes:
    - id: ARJO
  learningObjectiveIds:
    - 033.03.01.01.04
    - 033.03.02.02.02
  templates:
    - type: simple
      question: |-
        Refer to the figure (Flight Planning Manual MRJT 1 Figure 4.3.5). The following apply:

        Temperature: ISA +15°C
        Brake release mass: 62000 kg
        Trip time: {{trip_min}} min

        The average fuel flow read from the figure for these conditions is {{flow}} kg/h. Calculate the trip fuel in kg.
      explanation: |-
        Trip fuel is the average fuel flow multiplied by the flight time. The flight time must be in hours, so the trip time in minutes is divided by 60. The fuel flow is read from the figure for the given temperature and mass.

        **Solution**

        $$
        \frac{\text{Average fuel flow (read from the graph)}\times \text{Trip time}}{60} = \frac{2531.25\times 320}{60} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: a misread of the graph value (about 300 kg too low).
        - **{{d2}} kg**: a misread of the graph value (about 500 kg too low).
        - **{{d3}} kg**: a misread of the graph value (about 300 kg too high).
