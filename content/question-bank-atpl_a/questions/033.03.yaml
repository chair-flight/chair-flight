      explanation: |-
        The usable fuel is the fuel that can be used by the engines. It is the taxi fuel plus the APU fuel burned before take-off, plus the trip, contingency, alternate, final reserve, extra and discretionary fuel. The APU flow is given per hour, so it is divided by 60 to get the fuel per minute.

        **Solution**

        Taxi fuel: {{taxi_min}} min x {{taxi_ff}} kg/min = {{macro1}} kg

        APU fuel: {{apu_min}} min x {{apu_ff}} kg/h / 60 = {{macro2}} kg

        $$
        \text{Taxi time}\times \text{Taxi fuel flow}+\frac{\text{APU time}\times \text{APU fuel flow}}{60}+\text{Trip and contingency fuel}+\text{Destination alternate fuel}+\text{Final reserve fuel}+\text{Extra fuel}+\text{Discretionary fuel} = {{taxi_min}}\times {{taxi_ff}}+\frac{ {{apu_min}}\times {{apu_ff}} }{60}+{{trip_cont}}+{{alt}}+{{frf}}+{{extra}}+{{disc}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

