      question: |-
        Refer to figure. A twin-jet aeroplane is operated for a Commercial Air Transport flight. The Reduced Contingency Fuel (RCF) procedure is applied, with contingency fuel of 5% of the trip fuel. Given the following information, find the sum of the required trip fuel and contingency fuel.

