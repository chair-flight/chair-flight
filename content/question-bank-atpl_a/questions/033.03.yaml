    - BGS-331441
  annexes: []
  learningObjectiveIds:
    - 033.03.01.01.03
  templates:
    - type: simple
      question: |-
        Determine the maximum attainable range, given the following information:

        - Average fuel flow: {{ff}} lb/h
        - Available fuel: {{fuel}} lb
        - TAS: {{tas}} kt
        - Wind component: {{tw}} kt tailwind

        Do not consider final reserve, contingency or alternate fuel.
      explanation: |-
        The maximum flight time (endurance) is the available fuel divided by the fuel flow. The range is the distance covered in that time at the ground speed, which for a tailwind is TAS plus the wind component.

        **Solution**

        Endurance: $$\frac{\text{Available fuel}}{\text{Fuel flow}} = \frac{ {{fuel}} }{ {{ff}} }$$ h = {{macro3}} min

        Ground speed: $$\text{TAS}+\text{Tailwind component} = {{tas}}+{{tw}}$$ kt

        Range: $$\frac{(\text{TAS}+\text{Tailwind component})\times \text{round}(\frac{\text{Available fuel}}{\text{Fuel flow}}\times 60)}{60} = \frac{({{tas}}+{{tw}})\times \text{round}(\frac{ {{fuel}} }{ {{ff}} }\times 60)}{60} = \mathbf{ {{answer}}\ \text{NM} }$$

        ## Why the other answers are wrong

        - **{{d1}} NM**: uses TAS only and ignores the tailwind.
        - **{{d2}} NM**: converts the decimal part of the endurance directly into minutes (for example 2.41 h read as 2 h 41 min) and so overestimates the time.
        - **{{d3}} NM**: subtracts the wind instead of adding it and also misreads the decimal hours as minutes.
        - **{{d4}} NM**: subtracts the tailwind as if it were a headwind.
