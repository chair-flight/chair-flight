  templates:
    - type: simple
      question: |-
        For pre-flight planning purposes, what is the minimum Block Fuel required for the Commercial Air Transport flight in a Medium Range Jet Transport MRJT aeroplane, given the following information? The operator has nominated a suitable En-Route Alternate aerodrome. Assume the Basic Fuel Scheme WITHOUT variations applies.

        - Departure Taxi Fuel: {{taxi}} kg
        - Trip Fuel: {{trip}} kg
        - Alternate Fuel: {{alt}} kg
        - Destination Taxi Fuel: {{dtaxi}} kg
        - Average fuel flow: {{ff}} kg/h
        - Holding fuel flow: {{hold}} kg/h

        Extra Fuel: 0 kg
        Discretionary Fuel: 0 kg
      explanation: |-
        Block fuel = taxi fuel + trip fuel + contingency fuel + alternate fuel + final reserve. With a nominated en-route alternate, the contingency fuel is 3 % of the trip fuel but at least 5 minutes at holding fuel flow; the final reserve is 30 minutes at holding fuel flow. The taxi fuel at the destination is not part of the departure block fuel.

        **Solution**

        Contingency = max(3 % = {{macro1}} kg; 5 min = {{macro2}} kg) = {{macro3}} kg
        Final reserve = 0.5 h * {{hold}} kg/h = {{macro4}} kg

        $$
        \text{Departure taxi fuel}+\text{Trip fuel}+\text{max}(0.03\times \text{Trip fuel},\frac{\text{Holding fuel flow}\times 5}{60})+\text{Alternate fuel}+0.5\times \text{Holding fuel flow} = {{taxi}}+{{trip}}+\text{max}(0.03\times {{trip}},\frac{ {{hold}}\times 5}{60})+{{alt}}+0.5\times {{hold}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: uses a 5 % contingency and ignores the 5 minute minimum.
        - **{{d2}} kg**: adds the destination taxi fuel, which is not carried in the departure block fuel.
        - **{{d3}} kg**: computes the final reserve with the average fuel flow instead of the holding fuel flow.
        - **{{d4}} kg**: uses 3 % of the trip fuel without applying the 5 minute minimum.
        - **{{d5}} kg**: omits the alternate fuel.
