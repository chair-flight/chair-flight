    - ATPLQ-312494
  annexes: []
  learningObjectiveIds:
    - 033.03.01.01.01
  templates:
    - type: simple
      question: |-
        The maximum fuel capacity of an aircraft is {{maxfuel}} lb, and the pilot has to order fuel to fill up en route to the final destination.

        The pilot estimates landing at the fuelling point with {{fob}} lb on board.

        How many {{drum}} Imperial gallon fuel drums must be ordered if the fuel supplier states a specific gravity of {{sg}}?
      explanation: |-
        The fuel to uplift is the difference between the maximum capacity and the fuel already on board. One Imperial gallon of water weighs 10 lb, so a drum of fuel weighs drum volume × 10 lb × specific gravity. The number of drums is rounded up, because a part-drum cannot be ordered.

        **Solution**

        Fuel to uplift: $$\text{Max fuel capacity}-\text{Fuel on board at landing} = {{maxfuel}}-{{fob}}$$ lb

        Weight of one drum: $$\text{Drum volume}\times \text{Specific gravity}\times 10 = 40\times {{sg}}\times 10$$ lb

        Drums: $$\text{ceil}(\frac{\text{Max fuel capacity}-\text{Fuel on board at landing}}{\text{Drum volume}\times \text{Specific gravity}\times 10}) = \text{ceil}(\frac{ {{maxfuel}}-{{fob}} }{40\times {{sg}}\times 10}) = \mathbf{ {{answer}}\ \text{drums} }$$

        ## Why the other answers are wrong

        - **{{d1}} drums**: this is the weight of one drum in kg (litres × specific gravity), not the number of drums.
        - **{{d2}} drums**: mixes the lb quantity with a drum weight in kg and rounds down instead of up.
        - **{{d3}} drums**: uses the weight of one US gallon of water (8.345 lb) instead of the Imperial gallon (10 lb).
        - **{{d4}} drums**: mixes the lb quantity with a drum weight in kg.
      presets:
        - variables:
            maxfuel: 1200
            fob: 350
            drum: 40
            sg: 0.78
            answer: 3
            d1: 142
            d2: 5
            d3: 4
            d4: 6
          correctAnswers:
            - text: 3 drums
          wrongAnswers:
            - text: 142 drums
            - text: 4 drums
            - text: 6 drums
            - text: 5 drums
        - variables:
            maxfuel: 1500
            fob: 400
            drum: 40
            sg: 0.8
            answer: 4
            d1: 145
            d2: 7
            d3: 5
            d4: 8
          correctAnswers:
            - text: 4 drums
          wrongAnswers:
            - text: 145 drums
            - text: 5 drums
            - text: 8 drums
            - text: 7 drums
        - variables:
            maxfuel: 1000
            fob: 200
            drum: 40
            sg: 0.78
            answer: 3
            d1: 142
            d2: 5
            d3: 4
            d4: 6
          correctAnswers:
            - text: 3 drums
          wrongAnswers:
            - text: 142 drums
            - text: 4 drums
            - text: 6 drums
            - text: 5 drums
- id: QJIWY
  subjectId: "033"
