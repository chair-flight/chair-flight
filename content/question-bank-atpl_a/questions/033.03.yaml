      question: |-
        For pre-flight planning purposes what is the required take-off fuel for an IFR Commercial Air Transport flight with a turbine engine jet aircraft? Assume the Basic Fuel Scheme WITHOUT variations applies.

        - Taxi fuel (including APU usage): {{taxi}} kg
        - Fuel for the climb to cruise level: {{climb}} kg
        - Cruise distance to destination: {{dist}} NAM
        - Cruise fuel consumption: {{cons}} kg/NAM
        - Fuel for descent to the destination: {{desc}} kg
        - Fuel for approach & landing at destination: {{appr}} kg
        - Contingency fuel: {{cont}}% of trip
        - Fuel for alternate: {{alt}} kg
        - Holding fuel flow at destination & alternate: {{holdff}} kg/h
        - Missed approach fuel at alternate: {{missed}} kg

        Extra Fuel: 0 kg
        Discretionary Fuel: 0 kg
      explanation: |-
        Fuel is planned under the Basic Fuel Scheme: trip fuel (climb, cruise, descent, approach and landing), contingency fuel, alternate fuel and final reserve fuel (the taxi fuel is not part of the take-off fuel).

        **Solution**

        Trip fuel = {{climb}} + {{dist}} × {{cons}} + {{desc}} + {{appr}} = {{macro1}} kg
        Contingency fuel = {{cont}}% of trip fuel = {{macro2}} kg
        Final reserve fuel = 30 min × {{holdff}} kg/h = {{macro3}} kg

        $$
        (\text{Fuel for the climb to cruise level}+\text{Cruise distance to destination}\times \text{Cruise fuel consumption}+\text{Fuel for descent to the destination}+\text{Fuel for approach & landing at destination})\times (1+\frac{\text{Contingency percentage}}{100})+\text{Fuel for alternate}+\text{Holding fuel flow}\times 0.5 = ({{climb}}+{{dist}}\times {{cons}}+{{desc}}+{{appr}})\times (1+\frac{5}{100})+{{alt}}+{{holdff}}\times 0.5 = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: the taxi fuel is added, which gives the block fuel instead of the take-off fuel.
        - **{{d2}} kg**: the missed approach fuel at the alternate is added on top; it is already part of the alternate fuel.
        - **{{d3}} kg**: the contingency fuel is forgotten.
