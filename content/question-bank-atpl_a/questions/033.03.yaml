  templates:
    - type: simple
      question: |-
        The fuel burn of an aircraft turbine engine is measured as a volume flow.

        - Fuel burn: {{vol}} l/h at a fuel density of {{rho_old}} kg/l
        - New fuel density: {{rho_new}} kg/l

        Assume the same mass of fuel is burned per hour. What is the fuel burn in l/h at the new density?
      explanation: |-
        The engine burns the same mass of fuel per hour. Volume is mass divided by density, so a denser fuel gives a smaller volume per hour and a less dense fuel gives a larger volume. The new volume flow is the old volume flow multiplied by the old density divided by the new density.

        **Solution**

        $$
        \frac{\text{Fuel burn}\times \text{Original fuel density}}{\text{New fuel density}} = \frac{ {{vol}}\times {{rho_old}} }{ {{rho_new}} } = \mathbf{ {{answer}}\ \text{l/h} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} l/h**: inverts the density ratio.
        - **{{d2}} l/h**: assumes the volume flow does not change with the density.
        - **{{d3}} l/h**: squares the density ratio.
        - **{{d4}} l/h**: subtracts the densities and uses the wrong base.
      presets:
        - variables:
            vol: 220
            rho_old: 0.8
            rho_new: 0.75
            answer: 235
            d1: 206
            d2: 220
            d3: 250
