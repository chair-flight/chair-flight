    - type: simple
      question: |-
        An aeroplane with reciprocating engines plans to depart for an isolated destination aerodrome (Commercial Air Transport). Calculate the minimum amount of fuel required (to the nearest 10 kg) overhead the isolated aerodrome.

        - Flight time: {{ft}} h
        - Top of climb to top of descent time: {{cr}} h
        - Fuel to remain overhead: {{base}} minutes plus {{pct}}% of the flying time planned at cruising level
        - Normal cruise fuel consumption: {{ff}} kg/h
      explanation: |-
        For an isolated aerodrome (piston engines) the fuel required overhead is a fixed holding time plus a percentage of the flying time at cruising level, burned at the normal cruise fuel flow.

        **Solution**

        Time = {{base}} min + {{pct}}% of {{cr}} h = {{macro1}} h

        Fuel = {{macro2}} kg/h x {{macro1}} h = {{macro3}} kg, to the nearest 10 kg = **{{answer}} kg**

        ## Why the other answers are wrong

        - **{{d1}} kg**: the percentage was applied to the whole flight time instead of the time at cruising level.
        - **{{d2}} kg**: only the 45 minutes were considered.
        - **{{d3}} kg**: the percentage was applied to 1 hour instead of the cruise time.
        - **{{d4}} kg**: 1 hour was used instead of 45 minutes.
