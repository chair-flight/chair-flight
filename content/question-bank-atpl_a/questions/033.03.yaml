  templates:
    - type: simple
      question: |-
        Calculate the maximum possible extra fuel, based on the flight and aircraft data given below.

        - MTOM: {{mtom}} lb
        - MLM: {{mlm}} lb
        - MZFM: {{mzfm}} lb
        - Planned ZFM: {{zfm}} lb
        - Trip fuel: {{trip}} lb
        - Take-off fuel: {{tof}} lb
        - Fuel penalty: {{pen}} lb/1 000 lb
      explanation: |-
        The extra fuel is limited by the take-off mass headroom and by the landing mass headroom (adjusted with the fuel penalty). The smaller of the two limits is the maximum extra fuel.

        **Solution**

        Take-off headroom: $$\text{MTOM}-\text{Planned ZFM}-\text{Take-off fuel}$$ = {{macro2}} lb

        Landing headroom: {{macro3}} lb, adjusted with the penalty: $$(\text{MLM}-(\text{Planned ZFM}+\text{Take-off fuel}-\text{Trip fuel}))\times (1+\frac{\text{Fuel penalty (lb per 1000 lb)}}{1000})$$ = {{macro5}} lb

        Maximum extra fuel = smaller value = **{{answer}} lb**

        ## Why the other answers are wrong

        - **{{d1}} lb**: the landing headroom without the penalty adjustment.
        - **{{d2}} lb**: only the take-off headroom is used.
        - **{{d3}} lb**: the penalty is applied as a divisor (1 - penalty).
        - **{{d4}} lb**: the penalty is applied as a reduction factor.
        - **{{d5}} lb**: the penalty is applied to the take-off headroom instead of the landing headroom.
        - **{{d6}} lb**: MZFM headroom is used, which does not limit fuel.
