  templates:
    - type: simple
      question: |-
        Refer to figure. A twin-engine jet aeroplane cruises at FL370. Given the following information, what is the fuel required for the remainder of the cruise time? Consider a constant aircraft mass of 52 500 kg for calculation purposes.

        - Fuel flow read from the figure (at the given mass, FL370 and TAT): {{ff}} kg/h
        - True airspeed read from the figure: {{tas}} kt
        - Distance to top-of-descent: {{dist}} NM
        - Wind: {{wind}} kt head

        Give the answer in kg.
      explanation: |-
        The fuel burnt over a distance is the fuel flow multiplied by the time needed to fly it. With a headwind the ground speed is the true airspeed minus the headwind, so the time to the top-of-descent is the distance divided by that ground speed. The fuel flow and the TAS are read from the figure.

        **Solution**

        Ground speed = {{macro1}} kt

        Time to top-of-descent = {{macro2}} min

        $$
        \frac{\text{Fuel flow (read from the figure)}\times \text{Distance to top-of-descent}}{\text{TAS (read from the figure)}-\text{Headwind component}} = \frac{ {{ff}}\times {{dist}} }{ {{tas}}-{{wind}} } = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: uses the TAS without the headwind correction.
        - **{{d2}} kg**: adds the headwind to the TAS instead of subtracting it.
        - **{{d3}} kg**: adds the headwind to the distance instead of the ground speed.
        - **{{d4}} kg**: converts the fuel flow to kg per minute but uses the distance in hours, giving a value far too small.
      presets:
        - variables:
            ff: 2003
            tas: 450
            dist: 150
            wind: 25
