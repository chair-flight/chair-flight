  templates:
    - type: simple
      question: |-
        For pre-flight planning purposes, what is the minimum Ramp Fuel load for the Commercial Air Transport flight with a Jet aeroplane, given the following information? Assume the Basic Fuel Scheme WITHOUT variations applies.

        - Standard taxi fuel: {{taxi}} kg
        - Average cruise consumption: {{cruise_ff}} kg/h
        - Holding fuel consumption at 1 500 ft above alternate airfield elevation: {{hold_ff}} kg/h
        - Flight time from departure to destination: {{trip_time}} hours
        - Fuel for diversion to alternate: {{alt}} kg

        Extra Fuel: 0 kg
        Discretionary Fuel: 0 kg
      explanation: |-
        Under the Basic Fuel Scheme the ramp fuel is taxi fuel plus trip fuel, contingency fuel (5% of the trip fuel), alternate fuel and final reserve fuel (30 minutes of holding at 1 500 ft for a jet), plus any extra or discretionary fuel (zero here).

        **Solution**

        Trip fuel = {{cruise_ff}} * {{trip_time}} = {{macro1}} kg

        Contingency = 5% of trip = {{macro2}} kg

        Final reserve = {{hold_ff}} * 0.5 = {{macro3}} kg

        Ramp fuel = {{taxi}} + {{macro1}} + {{macro2}} + {{alt}} + {{macro3}} = **{{answer}} kg**

        ## Why the other answers are wrong

        - **{{d1}} kg**: forgets the 5% contingency fuel.
        - **{{d2}} kg**: forgets the taxi fuel.
        - **{{d3}} kg**: uses 45 minutes instead of 30 minutes of holding for the final reserve.
        - **{{d4}} kg**: forgets the final reserve fuel.
