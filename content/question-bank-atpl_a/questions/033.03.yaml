- id: QNEGA
  subjectId: "033"
  chapterId: "033.03"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-337690
    - BGS-330326
  annexes: []
  learningObjectiveIds:
    - 033.03.02.04.03
  templates:
    - type: simple
      question: |-
        (Use the annex.) The flight crew of a turbojet aeroplane prepares a flight of 3 500 NM at FL 310, TAS 450 kt, headwind component 55 kt, planned take-off mass (without extra fuel) 180 000 kg.

        Fuel price at destination: {{price_dest}} $/l.

        The commander may carry {{extra}} kg more fuel than that which is necessary.

        According to the annex, carrying this extra fuel causes an additional consumption of {{burn}} kg during the flight.

        For this fuel transport operation to be cost effective, the maximum fuel price at departure must be ($/l, 2 decimals):
      explanation: |-
        Carrying extra fuel is only cost effective if its purchase cost at departure is lower than the value of the part of it that is still on board at destination. Part of the extra fuel is burnt to carry itself, so only (extra - burn) / extra of it arrives.

        **Solution**

        Fraction arriving = {{macro1}}

        Maximum price = $$\frac{\text{Fuel price at destination}\times (\text{Extra fuel carried}-\text{Additional consumption caused by the extra fuel (read from annex)})}{\text{Extra fuel carried}} = \frac{0.27\times (8000-900)}{8000} = \mathbf{ {{answer}}\ \text{$/l} }$$

        ## Why the other answers are wrong

        - **{{d1}} $/l**: the burn-off penalty is ignored (price at destination).
        - **{{d2}} $/l**: the extra burn is added instead of subtracted.
        - **{{d3}} $/l**: only half of the extra burn is added.
        - **{{d4}} $/l**: only half of the extra burn is deducted.
        - **{{d5}} $/l**: price is multiplied by the burnt fraction instead of the remaining fraction.
      presets:
        - variables:
            price_dest: 0.27
            extra: 8000
            burn: 900
            macro1: 0.89
            answer: 0.24
            d1: 0.27
            d2: 0.3
            d3: 0.29
            d4: 0.25
            d5: 0.03
          correctAnswers:
            - text: 0.24 $/l
          wrongAnswers:
            - text: 0.29 $/l
            - text: 0.25 $/l
            - text: 0.27 $/l
            - text: 0.3 $/l
            - text: 0.03 $/l
