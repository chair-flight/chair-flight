  templates:
    - type: simple
      question: |-
        An IFR flight from departure A to destination B applies the decision point procedure (DPP), with decision point DP and en-route alternate C. Determine the trip fuel required.

        - Distance A to B: {{dist_ab}} NM
        - Distance A to C: {{dist_ac}} NM
        - Distance A to DP: {{dist_dp}} NM
        - TAS: {{tas}} kt
        - Tailwind component (TWC): {{tailwind}} kt
        - Fuel flow: {{flow}} kg/h
      explanation: |-
        The trip fuel is the fuel flow multiplied by the time needed to fly the trip distance A to B. The groundspeed is the TAS plus the tailwind component. The decision point and alternate distances are not part of the trip fuel for this calculation.

        **Solution**

        Groundspeed = {{macro1}} kt

        $$
        \frac{\text{Fuel flow}\times \text{Distance A to B}}{\text{TAS}+\text{Tailwind component}} = \frac{ {{flow}}\times {{dist_ab}} }{ {{tas}}+{{tailwind}} } = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: subtracts the tailwind from the TAS instead of adding it.
        - **{{d2}} kg**: uses the distance to the decision point instead of the distance to B.
        - **{{d3}} kg**: uses the distance to the alternate instead of the distance to B.
        - **{{d4}} kg**: ignores the tailwind component.
