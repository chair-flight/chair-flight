      question: |-
        A flight is planned using the Reduced Contingency Fuel (RCF) procedure to increase the traffic load. A decision point (DP) is selected along the route and an aerodrome R is the optional refuelling destination. An En-Route Alternate aerodrome (ERA) for the optional refuel station is NOT available. Alternate fuel and Extra Fuel are NOT taken into account.

        Calculate the minimum fuel required from the departure aerodrome to the destination, given:

        - Taxi fuel: {{taxi}} kg
        - Final Reserve Fuel: {{frf}} kg
        - Trip fuel to the destination via DP: {{trip}} kg
        - Trip fuel to R via DP: {{trip_r}} kg
        - Trip fuel from DP to the destination: {{trip_dp}} kg
      explanation: |-
        With the Reduced Contingency Fuel procedure the contingency fuel is 5% of the trip fuel from the decision point to the final destination only, not of the whole trip. The minimum fuel is then taxi fuel + trip fuel + this reduced contingency + final reserve fuel (alternate and extra fuel are zero here).

