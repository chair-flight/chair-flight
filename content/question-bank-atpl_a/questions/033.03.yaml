  templates:
    - type: simple
      question: During the pre-flight preparation, the pilot calculates a take-off fuel of {{usg}} US gallons. Considering a fuel density of {{dens}} lb per US gallon, this equals how many kilograms?
      explanation: |-
        Multiplying the volume by the density in lb per US gallon gives the mass in pounds. Dividing by 2.2046 converts pounds to kilograms.

        **Solution**

        $$
        \frac{\text{Fuel volume}\times \text{Fuel density}}{2.2046} = \frac{ {{usg}}\times {{dens}} }{2.2046} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: the density is ignored; the volume is converted as if it were a mass in lb.
        - **{{d2}} kg**: multiplies by 2.2046 instead of dividing, converting kg to lb the wrong way.
        - **{{d3}} kg**: this is the mass in lb; the conversion to kg is missing.
      presets:
        - variables:
            usg: 53
            dens: 6
            answer: 144
            d1: 24
            d2: 701
            d3: 318
          correctAnswers:
            - text: 144 kg
