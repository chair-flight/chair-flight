  templates:
    - type: simple
      question: |-
        Given the following data for the pre-flight calculations, determine the trip fuel required for a Commercial Air Transport flight. Assume the Basic Fuel Scheme WITHOUT variations applies.

        - Trip distance: {{distance}} NM
        - TAS: {{tas}} kt
        - Headwind component: {{headwind}} kt
        - Average fuel flow: {{flow}} kg/h

        Extra fuel: 0 kg
        Discretionary fuel: 0 kg
      explanation: |-
        With a headwind the groundspeed is the TAS minus the headwind component. The trip time is the distance divided by the groundspeed, and the trip fuel is the average fuel flow multiplied by the trip time.

        **Solution**

        Groundspeed = {{macro1}} kt

        $$
        \frac{\text{Average fuel flow}\times \text{Trip distance}}{\text{TAS}-\text{Headwind component}} = \frac{ {{flow}}\times {{distance}} }{ {{tas}}-{{headwind}} } = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: ignores the headwind and uses the TAS as groundspeed.
        - **{{d2}} kg**: adds the headwind instead of subtracting it.
        - **{{d3}} kg**: subtracts the headwind twice.
        - **{{d4}} kg**: uses minutes instead of hours for the trip time, which is a unit error.
      presets:
        - variables:
            distance: 122
            tas: 145
            headwind: 15
            flow: 4500
            macro1: 130
            answer: 4223
            d1: 3786
            d2: 3431
