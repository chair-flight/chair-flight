  templates:
    - type: simple
      question: |-
        During a VFR flight at a navigational checkpoint the remaining usable fuel in the tanks is {{fuel}} US gal.

        The reserve fuel is {{res}} US gal.

        According to the flight plan the remaining flight time is {{t}} min.

        Calculate the highest acceptable rate of consumption for the rest of the trip.
      explanation: |-
        Only the fuel above the reserve can be burned, so the maximum consumption rate is the usable fuel above the reserve divided by the remaining time in hours.

        **Solution**

        $$
        \frac{\text{Remaining usable fuel}-\text{Reserve fuel}}{\frac{\text{Remaining flight time}}{60}} = \frac{ {{fuel}}-{{res}} }{\frac{ {{t}} }{60}} = \mathbf{ {{answer}}\ \text{US gal/h} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} US gal/h**: the reserve was not deducted.
        - **{{d2}} US gal/h**: the minutes were treated as decimal hours (1 h 35 min = 1.35 h).
        - **{{d3}} US gal/h**: the reserve was added instead of subtracted.
        - **{{d4}} US gal/h**: only the reserve fuel was divided by the time.
      presets:
