        Calculate the minimum usable fuel required for a commercial air transport flight. Assume the Basic Fuel Scheme without variations applies.

        - Taxi time: {{taxi_min}} min, taxi fuel flow: {{taxi_ff}} kg/min
        - APU time: {{apu_min}} min, APU fuel flow: {{apu_ff}} kg/h
        - Trip fuel plus contingency fuel: {{trip_cont}} kg
        - Destination alternate fuel: {{alt}} kg
        - Final reserve fuel: {{frf}} kg
        - Extra fuel: {{extra}} kg
        - Discretionary fuel: {{disc}} kg

