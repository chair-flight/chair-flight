    - type: simple
      question: |-
        Given the following data for the pre-flight calculations, determine the required Alternate Fuel for a Commercial Air Transport flight. Assume the Basic Fuel Scheme WITHOUT variations applies. Extra Fuel and Discretionary Fuel are 0 kg.

        - Fuel for a missed approach at destination: {{mad}} kg
        - Fuel for the climb to cruise level: {{climb}} kg
        - Cruise distance to the alternate: {{dist}} NAM
        - Cruise fuel consumption: {{fpn}} kg/NAM
        - Fuel for the descent to the alternate: {{desc}} kg
        - Fuel for the approach and landing at the alternate: {{app}} kg
        - Holding fuel flow at the alternate: {{hold}} kg/h
        - Fuel for a missed approach at the alternate: {{mapalt}} kg
      explanation: |-
        Under the Basic Fuel Scheme the alternate fuel covers a missed approach at the destination, the climb, cruise and descent to the alternate, and the approach and landing there. Holding fuel belongs to the final reserve and the missed approach at the alternate is not added.

        **Solution**

        $$
        \text{Missed approach fuel at destination}+\text{Climb fuel}+\text{Cruise distance to alternate}\times \text{Cruise fuel per NAM}+\text{Descent fuel}+\text{Approach and landing fuel} = {{mad}}+{{climb}}+{{dist}}\times {{fpn}}+{{desc}}+{{app}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: forgets the missed approach fuel at the destination.
        - **{{d2}} kg**: also adds the missed approach fuel at the alternate, which is not part of alternate fuel.
        - **{{d3}} kg**: adds 30 minutes of holding fuel, which belongs to the final reserve fuel.
