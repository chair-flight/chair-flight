  templates:
    - type: simple
      question: |-
        Refer to figure. Assuming an average fuel flow of {{fuel_flow}} kg/h, complete the fuel log and determine the block fuel required by a jet aircraft to perform the Commercial Air Transport flight.

        - Trip time (read from figure): {{flight_hours}} h
        - Other fuel items in the fuel log (read from figure): {{other_fuel}} kg

        What is the block fuel required, in kg?
      explanation: |-
        The block fuel is the total fuel loaded before engine start. It is the trip fuel plus the other fuel items listed in the fuel log. The trip fuel is the average fuel flow multiplied by the trip time.

        **Solution**

        - Trip fuel: $${{flight_hours}}\times {{fuel_flow}}$$ = {{macro2}} kg
        - Block fuel: $$\text{Trip time (read from figure)}\times \text{Average fuel flow}+\text{Other fuel items (read from figure)} = {{flight_hours}}\times {{fuel_flow}}+{{other_fuel}} = \mathbf{ {{answer}}\ \text{kg} }$$

        ## Why the other answers are wrong

        - **{{d1}} kg**: leaves out the other fuel items in the log.
        - **{{d2}} kg**: keeps only the other fuel items and forgets the trip fuel.
        - **{{d3}} kg**: adds an extra hour of flying to the trip time.
        - **{{d4}} kg**: subtracts the other fuel items instead of adding them.
