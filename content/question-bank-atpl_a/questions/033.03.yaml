        \text{Taxi fuel (including APU usage)}+(\text{Fuel for the climb to cruise level}+\text{Cruise distance to destination}\times \text{Cruise fuel consumption}+\text{Fuel for descent to the destination}+\text{Fuel for approach & landing at destination})\times (1+\frac{\text{Contingency percentage}}{100})+\text{Fuel for alternate}+\text{Holding fuel flow}\times 0.5 = {{taxi}}+({{climb}}+{{dist}}\times {{cons}}+{{desc}}+{{appr}})\times (1+\frac{5}{100})+{{alt}}+{{holdff}}\times 0.5 = \mathbf{ {{answer}}\ \text{kg} }
