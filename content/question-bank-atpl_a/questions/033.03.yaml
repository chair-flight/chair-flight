      question: |-
        For pre-flight planning purposes, what is the required fuel for take-off for an IFR flight with a turbine engine jet aircraft? Assume the Basic Fuel Scheme WITHOUT variations applies.

        - Taxi fuel (with APU usage included): {{taxi}} lb
        - Climb fuel: {{climb}} lb
        - Cruise distance: {{cruise_dist}} NAM
        - Cruise fuel consumption: {{cruise_rate}} lb/NAM
        - Descent fuel: {{descent}} lb
        - Approach and landing fuel: {{approach}} lb
        - Alternate fuel: {{alt}} lb
        - Contingency fuel: {{cont}} % of trip fuel
        - Final reserve fuel: {{reserve_rate}} lb/h (30 minutes)
        - Fuel for missed approach at alternate: {{missed}} lb

        Extra fuel: 0 lb
        Discretionary fuel: 0 lb

        Give the answer in lb.
      explanation: |-
        The take-off fuel under the Basic Fuel Scheme is the trip fuel (climb, cruise, descent, approach and landing; taxi fuel is not part of the trip fuel) plus the contingency fuel (5 % of trip fuel) plus the alternate fuel plus the final reserve fuel, which is 30 minutes at the final reserve rate. The fuel for a missed approach at the alternate is not part of the basic scheme total.

        **Solution**

        Trip fuel = {{macro1}} lb

        Contingency = {{macro2}} lb

        Final reserve (30 min) = {{macro3}} lb

        $$
        (\text{Climb fuel}+\text{Cruise distance}\times \text{Cruise fuel consumption}+\text{Descent fuel}+\text{Approach and landing fuel})\times (1+\frac{\text{Contingency}}{100})+\text{Alternate fuel}+\text{Final reserve fuel rate}\times 0.5 = ({{climb}}+{{cruise_dist}}\times {{cruise_rate}}+{{descent}}+{{approach}})\times (1+\frac{5}{100})+{{alt}}+{{reserve_rate}}\times 0.5 = \mathbf{ {{answer}}\ \text{lb} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} lb**: trip fuel only.
        - **{{d2}} lb**: forgets the final reserve.
        - **{{d3}} lb**: uses the reserve rate for one hour instead of 30 minutes.
        - **{{d4}} lb**: adds the missed approach fuel at the alternate, which is not part of the basic scheme.
