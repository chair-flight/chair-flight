        Take-off mass headroom = {{macro2}} kg
        Landing mass headroom with penalty = {{macro3}} kg
        Tank headroom = $$\text{Tank capacity}-\text{Planned take-off fuel}-\text{Taxi fuel} = {{tank}}-10365-195$$ kg

        The smallest value limits the extra fuel: **{{answer}} kg**

