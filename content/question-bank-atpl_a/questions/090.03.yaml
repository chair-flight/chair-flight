          wrongAnswers:
            - text: RWY 08R, frequency 121.955
            - text: RWY 08L, frequency 119.415
            - text: RWY 08L, frequency 121.955
        - correctAnswers:
            - text: WORK IN PROGRESS ON APRON TWO.
          wrongAnswers:
            - text: ACKNOWLEDGE RECEIPT OF INFORMATION OSCAR WITH APP ON 121.955.
            - text: WORK IN PROGRESS ON RWY TWO.
            - text: ARRIVALS RUNWAY 08 LEFT. DEPARTURES RUNWAY 08 RIGHT.
