- id: QBQTZ
  subjectId: "061"
  chapterId: "061.02"
  relatedQuestionIds:
    - QRAOW
  externalQuestionIds:
    - ATPLQ-616244
    - BGS-611409
  annexes: []
  learningObjectiveIds:
    - 061.02.02.01.14
  templates:
    - type: simple
      question: |-
        What will be the revised ETA (to the nearest minute) over turning point B in the following situation? Assume that all other conditions remain unchanged.

        - Planned ETA over turning point B: 14:14 UTC
        - Planned distance from turning point A to turning point B: {{dist}} NM
        - Planned distance from turning point A to check feature X: {{dist_fix}} NM
        - Actual time over check feature X: {{lag}} min late

        What is the revised ETA over turning point B?
      explanation: |-
        The aircraft is late over check feature X. The lateness grows in proportion to distance, so the lateness at turning point B is the lateness at X multiplied by the ratio of the two distances. The revised ETA is the planned ETA plus that extra lateness.

        **Solution**

        - Ratio of distances: {{dist}} NM / {{dist_fix}} NM = {{macro1}}
        - Extra lateness at B: {{lag}} min × {{macro1}} = {{macro2}} min, rounded to the nearest minute
        - Revised ETA: 14:14 plus the extra lateness = **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}}**: the lateness at X is added without scaling to B.
        - **{{d2}}**: the scaling uses the distance beyond X instead of the whole distance to B.
        - **{{d3}}**: the lateness is ignored and the planned ETA is given.
      presets:
        - variables:
            dist: 43
            dist_fix: 10
            lag: 1.25
            macro1: 4
            macro2: 5
            answer: 14:19
            d1: 14:15
            d2: 14:18
            d3: 14:14
          correctAnswers:
            - text: 14:19
          wrongAnswers:
            - text: 14:14
            - text: 14:15
            - text: 14:18
        - variables:
            dist: 60
            dist_fix: 15
            lag: 2
            macro1: 4
            macro2: 8
            answer: 14:22
            d1: 14:16
            d2: 14:20
            d3: 14:14
          correctAnswers:
            - text: 14:22
          wrongAnswers:
            - text: 14:14
            - text: 14:16
            - text: 14:20
        - variables:
