- id: QPMDC
  subjectId: "061"
  chapterId: "061.02"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-618630
    - AVEXAM-80052
    - BGS-611434
  annexes: []
  learningObjectiveIds:
    - 061.02.02.01.08
  templates:
    - type: simple
      question: |-
        An aircraft takes two relative bearings from the same landmark.

        - First relative bearing: {{rb1}}°
        - Time between the bearings: {{t}} min
        - Second relative bearing: {{rb2}}°
        - TAS: {{tas}} kt
        - Tailwind component: {{tw}} kt

        Assume no drift. What is the distance to the landmark at the time of the second bearing?
      explanation: |-
        With a steady wind along the track, the ground speed is the TAS plus the tailwind. The ground distance flown between the two bearings and the two bearing angles then give the distance from the landmark with the sine rule.

        **Solution**

        Ground speed: $$\text{TAS}+\text{Tailwind component} = {{tas}}+{{tw}}$$ kt

        Distance flown between the bearings: {{macro3}} NM

        Distance at the second bearing: $$\frac{\frac{(\text{TAS}+\text{Tailwind component})\times \text{Time between bearings}}{60}\times \text{sin}(\text{First relative bearing})}{\text{sin}(\text{Second relative bearing}-\text{First relative bearing})} = \mathbf{ {{answer}}\ \text{NM} }$$

        ## Why the other answers are wrong

        - **{{d1}} NM**: forgets the tailwind and uses the TAS only.
        - **{{d2}} NM**: subtracts the tailwind instead of adding it.
        - **{{d3}} NM**: forgets to convert minutes to hours.
        - **{{d4}} NM**: applies an extra square root of 2 factor that is not part of the triangle.
      presets:
        - variables:
            rb1: 315
            t: 3
            rb2: 270
            tas: 90
            tw: 30
            macro3: 6
            answer: 6
            d1: 5
            d2: 3
            d3: 360
            d4: 8
          correctAnswers:
            - text: 6 NM
          wrongAnswers:
            - text: 5 NM
            - text: 360 NM
            - text: 8 NM
            - text: 3 NM
        - variables:
            rb1: 315
            t: 6
            rb2: 270
            tas: 120
            tw: 40
            macro3: 16
            answer: 16
            d1: 12
            d2: 8
            d3: 960
            d4: 23
          correctAnswers:
            - text: 16 NM
          wrongAnswers:
            - text: 12 NM
            - text: 960 NM
            - text: 23 NM
            - text: 8 NM
