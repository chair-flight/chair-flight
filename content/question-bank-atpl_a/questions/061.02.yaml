        - correctAnswers:
            - text: Visual range to the horizon is restricted at low level.
          wrongAnswers:
            - text: Features with great vertical extent are harder to see.
            - text: The feeling that you are flying more slowly over the ground changes how you perceive distance.
            - text: Navigation features can be noticed more easily, but are more difficult to identify.
