    - ATPLQ-613450
  annexes: []
  learningObjectiveIds:
    - 061.02.01.01.01
  templates:
    - type: simple
      question: Which is the best visual ground feature to establish a checkpoint for a day VFR flight over a mountainous area for an aircraft A flying at 5 000 ft AGL and an aircraft B flying at 1 000 ft AGL?
      explanation: A good checkpoint must be seen early and identified easily. From 5 000 ft AGL a large feature such as a lake is easy to see, while a small or low feature is lost. At 1 000 ft the horizon is close, so a tall mast stands out.
      presets:
        - correctAnswers:
            - text: A large lake for aircraft A and a 200-ft-high mast for aircraft B.
          wrongAnswers:
            - text: A 200-ft-high mast for aircraft A and a small lake for aircraft B.
            - text: A path for aircraft A and a small river for aircraft B.
            - text: A small lake for aircraft A and a path for aircraft B.
    - type: simple
      question: Which is the best visual ground feature to establish a checkpoint for a day VFR flight over a mountainous area for an aircraft A flying at 1 000 ft AGL and an aircraft B flying at 5 000 ft AGL?
      explanation: At 1 000 ft AGL the range of view is short, so a tall feature such as a high mast stands out. At 5 000 ft AGL a large feature such as a big lake is visible from far away and easy to recognise.
      presets:
        - correctAnswers:
            - text: High mast for A and big lake for B.
          wrongAnswers:
            - text: High mast for both A and B.
            - text: Big lake for both A and B.
            - text: Big lake for A and high mast for B.
