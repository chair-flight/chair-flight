      question: A pilot is planning a VFR flight which crosses a controlled airspace. Because of restrictions of the controlled airspace, part of the flight must be flown at a low level. Which of the following is a problem of navigation at low level that could be faced in a VFR flight?
      explanation: At low level the horizon is close and the visual range is restricted by terrain and haze. Features may be hidden behind terrain, and the visual cues needed for navigation are available for a shorter time.
