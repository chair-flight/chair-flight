      explanation: A drift check needs a point feature on or near the track, so the pilot can see how far off it lies. Two linear features that cross each other, such as a road over a river or a railway, give a unique point. A single road crossing the track gives only an along-track position line.
      options:
        - text: Dual-carriageway (four line) road crossing the intended track.
          correct: false
        - text: Dual-carriageway (four line) road crossing a river close to the intended track.
          correct: true
        - text: Disused railway crossing a river on intended track.
          correct: true
        - text: Single carriageway (two line) road crossing a railway close to intended track.
          correct: true
      variants:
        - show:
            - 0
            - 1
            - 2
            - 3
