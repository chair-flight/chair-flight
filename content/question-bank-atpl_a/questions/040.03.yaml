  templates:
    - type: simple
      question: |-
        An aircraft operating with the FMS in the LNAV VNAV mode is operating in a busy terminal area at the end of a flight. Bad weather in the area has resulted in ATC requiring the flight crew to make several changes to the aircraft's flight path.   
          
         In order to maintain the maximum awareness of their flight status, what is the best action for the pilots to take?
      explanation: ""
      presets:
        - correctAnswers:
            - text: Re-programming of the FMS in the LNAV VNAV mode during periods of high workload can lead to errors and also cause a loss of situational awareness. Therefore, the pilots should downgrade to a lower, simpler level of automation such as ALT/HDG or even to manual flying.
          wrongAnswers:
            - text: The FMS in LNAV VNAV mode is the primary, and most accurate, navigation system available to the pilots, and its use should be maintained. In order to minimise data entry errors, both pilots should check the entry of the new LNAV/VNAV parameters at the same time.
            - text: In order to mitigate against loss of situational awareness, and avoid the risk of errors while entering new data, the FMS should be switched off, and the pilots should respond to ATC instructions by flying the aircraft manually.
            - text: The main risk is that the pilots become distracted while re-programming the FMS. To reduce this risk, the Pilot-in-Command should immediately request a short delay or a hold, in order to complete the entry of the new LNAV VNAV parameters, before continuing with the approach.
