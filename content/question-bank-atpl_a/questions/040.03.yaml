    - 040.03.02.03.01
  templates:
    - type: simple
      question: |-
        Consider the following scenario during the initial approach phase of a commercial flight into an airfield situated in mountainous terrain:

        1) The pilots notice that information from two engine instruments does NOT agree.

        2) Both pilots are fully focused on analysing the problem.

        3) The weather is VMC and there is a lot of light and heavy aircraft traffic in the area.

        4) The ETA is 30 minutes behind schedule, endangering a timely departure for the next leg.

        Considering the theories and models of human error, to ensure the safety of the flight, what should the pilots do at this point?
      explanation: Instrument disagreement, task fixation, traffic, terrain and schedule pressure are several links that can combine into an error chain. Breaking any link in time prevents an undesired aircraft state, so preventative action is needed now.
      presets:
        - correctAnswers:
            - text: "An error chain might be developing: preventative actions should be taken to manage the threats and errors."
          wrongAnswers:
            - text: This might just be an isolated case of an engine indication error. Because the pilots are not sure they should ignore the indication until after landing.
            - text: The pilots should contact ATC and request advice on how to proceed.
            - text: The pilots should continue to focus their attention on the problem while they proceed to the destination for landing.
