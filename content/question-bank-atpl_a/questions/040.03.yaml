- id: QDZHL
  subjectId: "040"
  chapterId: "040.03"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-409502
    - BGS-401202
    - AVEXAM-68226
    - AVEXAM-26772
  annexes: []
  learningObjectiveIds:
    - 040.03.01.02.03
    - 040.03.04.04.07
  templates:
    - type: simple
      question: |-
        On 8th July 2010, the crew of a Boeing 737 from Nice to Frankfurt was cleared by the controller of Sector L14 to continue its climb to FL320. In an adjacent sector, the crew of an Airbus 319 from London to Milan were cleared to leave FL 390 and to descend to FL 330. The instruction was read back correctly, but the pilots incorrectly entered FL 320 into the FMS. Upon being handed off to sector L14, the Airbus called the controller:   
         "Easy 529 Yankee, descending FL320 on radar heading 150"   
         however they did not realise the incorrect flight level reported by the Airbus.   
         Shortly after, the two aircraft were converging on FL 320 and triggered potential conflict alerts on both the controller's system and the on-board TCAS of each aircraft. Corrective action had to be taken by each aircraft to re-establish separation.   
          
         Select the option which correctly states the type of communication and associated disadvantage which are illustrated by this serious incident of a "level bust" with resulting loss of separation:
      explanation: ""
      presets:
        - correctAnswers:
            - text: Explicit communication, which is prone to confirmation bias, that is, we hear what we expect to hear and NOT what is being said.
          wrongAnswers:
            - text: Implicit communication, which is prone to being biased towards hearing a message in accordance with one's mental picture of a situation.​​​​
            - text: Explicit communication, which means that the message is difficult to identify and is open to multiple interpretations.
            - text: Implicit communication, which is open to interpretation due to receiving erroneous or inconsistent pieces of information.
    - type: simple
      question: |-
        An air traffic controller clears the crew of a Boeing 737 aircraft to descend to FL330, thereafter, he instructs the crew of an Airbus A320 to climb to FL320. The Boeing crew correctly reads back and complies with the issued clearance. The Airbus crew incorrectly reads back their climb clearance to FL330 instead of FL320, and the co-pilot programs the FMS for a climb to FL330. After the incorrect readback, the aircraft is handed over to another controller who notes the selected FL but doesn't realise it is wrong.



        With regard to communication, state which kind of error occurred...
      explanation: ""
      presets:
        - correctAnswers:
            - text: Explicit, which is subject to confirmation bias.
          wrongAnswers:
            - text: Implicit, which is subject to misunderstandings due to omissions.
            - text: Implicit, which is subject to confirmation bias.
            - text: Explicit, which is subject to misunderstandings due to omissions.
    - type: simple
      question: |-
        An air traffic controller clears the crew of a Boeing 737 aircraft to descend to FL330, thereafter, he instructs the crew of an Airbus A320 to climb to FL320. The Boeing crew correctly reads back and complies with the issued clearance. The Airbus crew incorrectly reads back their climb clearance to FL330 instead of FL320, and the copilot programs the FMS for a climb to FL330. The air traffic controller continues issuing clearances to other aircraft in the vicinity without detecting the mistake.

        With regard to communication, state which kind of error occurred.
      explanation: ""
      presets:
        - correctAnswers:
            - text: Error in explicit communication, where the expectation of a correct readback caused the controller to mishear the pilot's reply to be correct.
          wrongAnswers:
            - text: Error in implicit communication, where the expectation of a correct readback caused the controller to mishear the pilot's reply to be correct.
            - text: Error in explicit communication, which can lead to ambiguities.
            - text: Error in implicit communication, which can lead to ambiguities.
