  templates:
    - type: simple
      question: An aircraft is cruising at FL{{fl}}, Mach {{mach}}. The ISA deviation is {{dev}}°C. What is the TAS of the aircraft (in kt)?
      explanation: |-
        TAS = Mach x local speed of sound, with a = 38.97 x sqrt(T) kt. The temperature is the ISA temperature at the flight level (15°C - 1.98°C per 1000 ft, constant -56.5°C above the tropopause at 36 089 ft) plus the ISA deviation.

        **Solution**

        T = {{macro1}} K, so a = {{macro2}} kt

        TAS = $$\text{Mach number}\times 38.97\times \sqrt{\text{max}(15-\frac{1.98\times \text{Flight level}}{10},-56.5)+\text{ISA deviation}+273.15} = \mathbf{ {{answer}}\ \text{kt} }$$

        ## Why the other answers are wrong
        - **{{d1}} kt**: ignores the ISA deviation.
        - **{{d2}} kt**: applies the ISA deviation with the wrong sign.
        - **{{d3}} kt**: keeps lowering the temperature above the tropopause instead of using the constant -56.5°C.
        - **{{d4}} kt**: uses the sea-level speed of sound (661.5 kt) instead of the local value.
      presets:
