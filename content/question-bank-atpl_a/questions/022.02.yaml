      question: |-
        An Air-Data Inertial Reference Unit (ADIRU) has separate controls for switching the air-data and inertial reference part ON or OFF. The pilot accidentally switches OFF the incorrect system when following a procedure to address a fault. What is correct?

        (For this question, only consider the system as a standalone part NOT including other aircraft systems that may also be affected by the scenario.)
      explanation: In an ADIRU the air-data part recovers at once when switched on again. The inertial reference part needs a full alignment before it gives correct data, so switching it off by mistake severely limits the function until it is realigned.
      options:
        - text: If the air-data part is switched OFF instead of the inertial reference part, there is NO effect as the data can be recovered when the air-data part is switched back on.
          correct: true
        - text: If the air-data part is switched OFF instead of the inertial reference part, the function is severely limited as the air-data part CANNOT be initialised when switched back ON.
          correct: false
        - text: If the inertial reference part is switched OFF instead of the air-data part, the function is severely limited as the inertial reference part CANNOT be fully re-aligned when switched back ON.
          correct: true
        - text: If the inertial reference part is switched OFF instead of the air-data part, there is NO effect as the data can be recovered when the inertial reference part is switched back on.
          correct: false
      variants:
