  learningObjectiveIds:
    - 022.02.05.01.01
  templates:
    - type: simple
      question: An aircraft has a vertical (or linear) speed of {{v}} ft/min. What is the equivalent speed in metres per second (m/s)?
      explanation: |-
        1 ft = 0.3048 m and 1 min = 60 s, so ft/min x 0.3048 / 60 = m/s (about 0.00508 m/s per ft/min).

        **Solution**

        $$
        \frac{\text{Speed}\times 0.3048}{60} = \frac{ {{v}}\times 0.3048}{60} = \mathbf{ {{answer}}\ \text{m/s} }
        $$

        ## Why the other answers are wrong
        - **{{d1}} m/s**: converts feet to metres but forgets to convert minutes to seconds (this is m/min).
        - **{{d2}} m/s**: multiplies by 60 instead of dividing, so the time conversion goes the wrong way.
        - **{{d3}} m/s**: converts only minutes to seconds and leaves the unit in feet (ft/s).
        - **{{d4}} m/s**: uses the knots-to-m/s factor (0.5144) instead of the feet-per-minute conversion.
      presets:
        - variables:
            v: 800
            answer: 4.1
            d1: 243.8
            d2: 14630.4
            d3: 13.3
            d4: 411.5
          correctAnswers:
