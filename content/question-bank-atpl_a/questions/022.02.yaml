  annexes: []
  learningObjectiveIds:
    - 022.02.07.01.01
  templates:
    - type: simple
      question: An aeroplane is flying at FL{{fl}} with a TAS of {{tas}} kt in standard (ISA) conditions. What is the Mach number?
      explanation: |-
        The speed of sound depends only on the air temperature. In ISA conditions the temperature falls at a constant rate of 1.98°C per 1000 ft from 15°C at sea level, so the temperature at the flight level is calculated first, then the local speed of sound, and finally the Mach number.

        $$
        T_{\text{ISA}} &= 15 - 1.98 \times \frac{ {{fl}} \times 100}{1000} = {{temp}}\ \text{°C} \\
        T_{\text{Kelvin}} &= 273.15 + ({{temp}}) = {{kelvin}}\ \text{K} \\
        \text{LSS} &= 38.967854 \times \sqrt{ {{kelvin}} } = {{lss}}\ \text{kt} \\
        M &= \frac{\text{TAS}}{\text{LSS}} = \frac{ {{tas}} }{ {{lss}} } = \mathbf{ {{answer}} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}**: divides by the sea-level speed of sound (661.5 kt) instead of the speed at the flight level.
        - **{{d2}}**: uses a temperature 20 K warmer than ISA.
        - **{{d3}}**: uses a temperature 20 K colder than ISA.
        - **{{d4}}**: inverts the ratio (speed of sound over TAS).
      presets:
        - variables:
            fl: 300
            temp: -44.4
            tas: 470
            kelvin: 228.75
            lss: 589.4
            answer: 0.8
            d1: 0.71
            d2: 0.76
            d3: 0.83
            d4: 1.25
          correctAnswers:
            - text: "0.8 "
          wrongAnswers:
