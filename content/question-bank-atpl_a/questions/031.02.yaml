  templates:
    - type: simple
      question: |-
        Determine the Take-off Mass for the following single engine aeroplane. Given:

        - Basic Empty Mass: {{bem}} lb
        - Pilot + front seat passenger: {{crew}} lb
        - Cargo mass: {{cargo}} lb
        - Ramp fuel = block fuel: {{block}} gal
        - Trip fuel: {{trip}} gal
        - Fuel density: {{dens}} lb/gal
        - Taxi fuel: {{taxi}} lb
      explanation: |-
        Take-off mass is the basic empty mass plus payload plus the fuel on board at brake release. The fuel on board is the block (ramp) fuel minus the taxi fuel; the trip fuel is burned later and does not reduce the take-off mass.

        **Solution**

        Block fuel = {{macro1}} lb

        $$
        \text{Basic empty mass}+\text{Pilot and passenger}+\text{Cargo mass}+\text{Block fuel}\times \text{Fuel density}-\text{Taxi fuel} = {{bem}}+{{crew}}+{{cargo}}+{{block}}\times 6-{{taxi}} = \mathbf{ {{answer}}\ \text{lb} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} lb**: taxi fuel is not subtracted.
        - **{{d2}} lb**: trip fuel is used instead of the block fuel.
        - **{{d3}} lb**: taxi fuel is added instead of subtracted.
        - **{{d4}} lb**: the fuel is forgotten.
