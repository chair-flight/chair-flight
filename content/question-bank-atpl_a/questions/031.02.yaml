  templates:
    - type: simple
      question: |-
        Refer to the figure (CAP 696 file 4.12). A medium range twin jet transport is scheduled to operate from a departure airfield where conditions limit the take-off mass to {{tomlim}} kg. The destination airfield has a performance limited landing mass of {{mlm}} kg. The dry operating mass is {{dom}} kg (assume the zero fuel mass limit is not restrictive). Loading data:

        - Taxi fuel: {{taxi}} kg
        - Trip fuel: {{trip}} kg
        - Contingency and final reserve fuel: {{res}} kg
        - Alternate fuel: {{alt}} kg
        - Traffic load: {{tl}} kg

        Changes in trip fuel caused by changes in total mass may be disregarded. What is the maximum traffic load, in kg, that can be carried without exceeding any limit?
      explanation: |-
        The traffic load may not exceed what the take-off mass limit and the landing mass limit allow. At take-off the fuel on board is trip + reserves + alternate (taxi fuel is burnt before the take-off run); at landing only reserves + alternate remain. The smallest of the planned load and the two limit-derived loads governs.

        **Solution**

        Take-off limit: {{tomlim}} - {{dom}} - {{macro1}} = {{macro2}} kg

        Landing limit: {{mlm}} - {{dom}} - {{macro3}} = {{macro4}} kg

        Planned load: {{tl}} kg

        Maximum traffic load = **{{answer}} kg**

        ## Why the other answers are wrong

        - **{{d1}} kg**: the planned load, ignoring the landing mass limit.
        - **{{d2}} kg**: subtracts the taxi fuel from the take-off mass, although it is burnt before take-off.
        - **{{d3}} kg**: subtracts the whole fuel load (including trip fuel) from the landing mass limit.
        - **{{d4}} kg**: also subtracts the taxi fuel from the landing mass limit.
        - **{{d5}} kg**: adds extra load to the planned figure although a limit is already exceeded.
