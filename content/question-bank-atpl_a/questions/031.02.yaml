- id: QSTXD
  subjectId: "031"
  chapterId: "031.02"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-313038
    - AVEXAM-82794
  annexes: []
  learningObjectiveIds:
    - 031.02.03.02.01
  templates:
    - type: simple
      question: |-
        What is the allowed traffic load, in kg?

        - MTOM: {{mtom}} kg
        - Performance limited TOM: {{ptom}} kg
        - Performance limited LM: {{plm}} kg
        - DOM: {{dom}} kg
        - Block fuel: {{block}} kg
        - Trip fuel: {{trip}} kg
        - Taxi fuel: {{taxi}} kg
      explanation: |-
        The traffic load is limited by the take-off mass (the lower of MTOM and the performance limit) and by the landing mass. For each limit the traffic load is the limit minus DOM minus the fuel on board at that moment (take-off fuel = block minus taxi; landing fuel = take-off fuel minus trip). The smaller result is the allowed traffic load.

        **Solution**

        Take-off limit: {{macro1}} - {{dom}} - {{macro2}} = {{macro3}} kg

        Landing limit: {{plm}} - {{dom}} - {{macro4}} = {{macro5}} kg

        Allowed traffic load = **{{answer}} kg**

        ## Why the other answers are wrong

        - **{{d1}} kg**: the take-off limit only; the landing limit is more restrictive.
        - **{{d2}} kg**: subtracts the whole block fuel from the landing-mass limit.
        - **{{d3}} kg**: subtracts the take-off fuel from the landing-mass limit, ignoring that the trip fuel is burnt.
        - **{{d4}} kg**: subtracts only the trip fuel from the landing-mass limit.
        - **{{d5}} kg**: ignores the fuel on board altogether.
      presets:
        - variables:
            mtom: 6100
            ptom: 6000
            plm: 5250
