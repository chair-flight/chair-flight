  templates:
    - type: simple
      question: |-
        Given:

        - Basic Empty Mass = {{bem}} kg
        - Dry Operating Mass = {{dom}} kg
        - Zero Fuel Mass = {{zfm}} kg
        - Take-off Mass = {{tom}} kg

        What is the traffic load?
      explanation: |-
        The Zero Fuel Mass is the Dry Operating Mass plus the traffic load, so the traffic load is ZFM minus DOM. Fuel is not part of either mass.

        **Solution**

        $$
        \text{Zero Fuel Mass}-\text{Dry Operating Mass} = {{zfm}}-{{dom}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: take-off mass minus DOM includes the take-off fuel in the load.
        - **{{d2}} kg**: take-off mass minus Basic Empty Mass includes both the fuel and the operating items.
        - **{{d3}} kg**: this is only the take-off fuel (take-off mass minus zero fuel mass), not the traffic load.
      presets:
        - variables:
            bem: 5300
            dom: 5500
            zfm: 5980
            tom: 7980
            answer: 480
            d1: 2480
            d2: 2680
            d3: 2000
          correctAnswers:
            - text: 480 kg
          wrongAnswers:
