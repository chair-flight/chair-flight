        Baggage: {{bag}} kg.

        Passengers: 33 male, 32 female and 5 children; the company uses the standard passenger masses allowed by regulations (flight is not a holiday charter).

        The total passenger mass obtained from the standard mass table (figure) is {{pax_mass}} kg.

        What is the maximum cargo that may be loaded?
      explanation: |-
        The take-off mass is DOM + fuel + traffic load, and the traffic load consists of passengers, baggage and cargo. The cargo is what remains of the maximum take-off mass after all other items are deducted.

        **Solution**

        $$
        \text{Maximum take-off mass}-\text{Dry operating mass}-\text{Take-off fuel}-\text{Baggage}-\text{Total passenger mass (from standard mass table)} = 37200-21600-8500-880-5635 = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: the passenger mass is forgotten.
        - **{{d2}} kg**: the baggage is forgotten.
        - **{{d3}} kg**: the take-off fuel is forgotten.
        - **{{d4}} kg**: the passenger mass is added instead of subtracted.
      presets:
