        A flight has been made from London to Valencia carrying minimum fuel and maximum traffic load. On the return flight the fuel tanks are filled to capacity with {{fuel_l}} litres at a density of {{dens}} kg/l. Structural limits:

        - Maximum Ramp Mass {{mrm}} kg
        - Maximum Take-off Mass {{mtom}} kg
        - Maximum Landing Mass {{mlm}} kg
        - Maximum Zero Fuel Mass {{mzfm}} kg
        - Performance limited Take-off Mass at Valencia {{tom_perf}} kg
        - Dry Operating Mass {{dom}} kg
        - Trip fuel (Valencia to London) {{trip}} kg
        - Taxi fuel {{taxi}} kg

