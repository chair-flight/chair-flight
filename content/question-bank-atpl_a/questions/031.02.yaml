  annexes: []
  learningObjectiveIds:
    - 031.02.01.02.04
    - 031.02.03.02.01
  templates:
    - type: simple
      question: |-
        Given the following information, what is the maximum amount of Extra Fuel that can be uploaded for this Commercial Air Transport flight?

        - MTOM: {{mtom}} lb
        - MLM: {{mlm}} lb
        - ZFM: {{zfm}} lb
        - Planned T/O Fuel: {{planned}} US gal
        - Trip Fuel: {{trip}} US gal
        - Fuel tank capacity: {{tank}} US gal
        - Specific gravity: {{sg}}
      explanation: |-
        The fuel on board is limited by three things: the maximum take-off mass, the maximum landing mass (landing fuel = take-off fuel - trip fuel) and the tank capacity. The smallest of the three limits the total fuel, and the extra fuel is that limit minus the planned take-off fuel. Fuel density: {{sg}} x 8.3454 = {{macro1}} lb/US gal.

        **Solution**

        Limit by MTOM: ({{mtom}} - {{zfm}}) / {{macro1}} = {{macro2}} US gal
        Limit by MLM: ({{mlm}} - {{zfm}}) / {{macro1}} + {{trip}} = {{macro3}} US gal
        Limit by tanks: {{tank}} US gal

        The smallest is the MTOM limit, so extra fuel = {{macro4}} - {{planned}} = **{{answer}} US gal** (rounded down).

        ## Why the other answers are wrong

        - **{{d1}} US gal**: only the tank capacity was considered ($$\text{Tank capacity}-\text{Planned T/O fuel}$$).
        - **{{d2}} US gal**: only the landing mass limit was applied.
        - **{{d3}} US gal**: tank capacity minus trip fuel instead of minus planned take-off fuel.
      presets:
        - variables:
            mtom: 2150
            mlm: 2030
            zfm: 1803
