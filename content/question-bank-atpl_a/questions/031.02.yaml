  learningObjectiveIds:
    - 031.02.01.02.02
  templates:
    - type: simple
      question: |-
        Given the following information, what will be the expected Landing Mass at the destination?

        - Maximum structural Take-Off Mass: {{mtom}} kg
        - Maximum structural Landing Mass: {{mlm}} kg
        - Zero Fuel Mass: {{zfm}} kg
        - Taxi Fuel: {{taxi}} kg
        - Contingency Fuel: {{cont}} kg
        - Alternate Fuel: {{alt}} kg
        - Final Reserve Fuel: {{res}} kg
        - Trip Fuel: {{trip}} kg

        (Changes in trip fuel due to mass changes may be ignored for this question, performance limitations are not restricted.)
      explanation: |-
        The landing mass at destination is the zero fuel mass plus the fuel still on board on arrival. When the flight is flown as planned, that is the contingency, alternate and final reserve fuel; taxi fuel and trip fuel have already been used. The structural limits are not needed for the calculation.

        **Solution**

        $$
        \text{ZFM}+\text{Contingency fuel}+\text{Alternate fuel}+\text{Final reserve fuel} = {{zfm}}+{{cont}}+{{alt}}+{{res}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: this is the take-off mass (all fuel on board, including taxi and trip fuel).
        - **{{d2}} kg**: the taxi fuel was subtracted but the trip fuel was left on board.
        - **{{d3}} kg**: the maximum structural landing mass; it is only a limit, not the expected landing mass.
        - **{{d4}} kg**: the final reserve fuel was left out and the trip fuel counted as remaining.
      presets:
        - variables:
            mtom: 8350
            mlm: 8350
            zfm: 6210
            taxi: 10
            cont: 90
            alt: 300
            res: 400
            trip: 780
            answer: 7000
            d1: 7790
            d2: 7780
            d3: 8350
            d4: 7380
