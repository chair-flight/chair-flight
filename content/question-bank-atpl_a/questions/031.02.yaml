  templates:
    - type: simple
      question: |-
        The following data applies to a planned flight.

        - Dry Operating Mass: {{dom}} kg
        - Performance limited Take-Off Mass: {{ptom}} kg
        - Performance limited Landing Mass: {{plm}} kg
        - Maximum Zero Fuel Mass: {{mzfm}} kg

        Fuel required at ramp:

        - Taxi fuel: {{taxi}} kg
        - Trip fuel: {{trip}} kg
        - Contingency fuel: {{cont}} kg
        - Alternate fuel: {{alt}} kg
        - Final reserve fuel: {{res}} kg
        - Traffic load: {{traffic}} kg

        Fuel costs at the departure airfield are such that it is decided to load the maximum fuel quantity possible. The total fuel (ramp fuel) which may be safely loaded prior to departure is:
      explanation: |-
        The ramp fuel is limited by both the take-off mass and the landing mass. The take-off limit allows (limiting TOM - DOM - traffic load) of fuel after taxi, and the landing limit allows (limiting LM - DOM - traffic load) of fuel at landing, to which the trip fuel and taxi fuel burned before landing must be added. The lower of the two values is the maximum ramp fuel. The zero fuel mass limit is not limiting here, since the actual zero fuel mass is below it.

        **Solution**

        Zero fuel mass = {{dom}} + {{traffic}} = {{macro1}} kg

        Take-off limit: {{ptom}} - {{macro1}} + {{taxi}} = {{macro2}} kg
        Landing limit: {{plm}} - {{macro1}} + {{trip}} + {{taxi}} = {{macro3}} kg

        Ramp fuel = min of both = **{{answer}} kg**

        ## Why the other answers are wrong

        - **{{d1}} kg**: respects only the take-off mass limit and ignores the landing mass limit.
        - **{{d2}} kg**: take-off limit reduced by the margin to the maximum zero fuel mass, which is not a restriction here, and without taxi fuel.
        - **{{d3}} kg**: correct limit but reduced again by the zero fuel mass margin and by the taxi fuel.
      presets:
