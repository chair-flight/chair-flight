  learningObjectiveIds:
    - 031.02.03.02.01
  templates:
    - type: simple
      question: |-
        The following data applies to an aeroplane which is about to take off:

        - Certified maximum take-off mass: {{mtom}} kg
        - Performance limited take-off mass: {{ptom}} kg
        - Dry Operating Mass: {{dom}} kg
        - Crew and crew hand baggage mass: {{crew_mass}} kg
        - Crew baggage in hold: {{crew_baggage}} kg
        - Take-off fuel: {{fuel}} kg

        From this data calculate the maximum traffic load.
      explanation: |-
        The maximum take-off mass is the lower of the certified and the performance-limited values. The dry operating mass already includes the crew and their baggage, so the traffic load is the take-off mass minus the DOM and the take-off fuel.

        **Solution**

        Limiting take-off mass = {{macro1}} kg

        $$
        \text{min}(\text{Certified MTOM},\text{Performance-limited TOM})-\text{DOM}-\text{Take-off fuel} = \text{min}({{mtom}},{{ptom}})-{{dom}}-{{fuel}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: Forgets to subtract the take-off fuel.
        - **{{d2}} kg**: Subtracts the crew masses a second time, although they are already included in the DOM.
        - **{{d3}} kg**: Forgets the fuel and subtracts the crew masses, which are already in the DOM.
      presets:
        - variables:
            mtom: 141500
            ptom: 137300
            dom: 58400
            crew_mass: 640
            crew_baggage: 110
            fuel: 60700
            macro1: 137300
