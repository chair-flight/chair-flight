      question: |-
        Based on actual conditions, an aeroplane has the following performance take-off mass limitations:

        | **FLAPS** | **0º** | **10º** | **15º** |
        | ---------- | ------- | ------- | ------- |
        | **RUNWAY** | {{r0}} kg | {{r10}} kg | {{r15}} kg |
        | **CLIMB** | {{c0}} kg | {{c10}} kg | {{c15}} kg |

        Structural limits: take-off/landing/zero fuel: {{struct}} kg

        The Maximum Take-off Mass is:
      explanation: |-
        For each flap setting the performance limit is the lower of the runway and climb limits. The best flap setting gives the highest of these values, and the take-off mass can never exceed the structural limit.

        **Solution**

        Flaps 0: min({{r0}}, {{c0}}) = {{macro1}} kg
        Flaps 10: min({{r10}}, {{c10}}) = {{macro2}} kg
        Flaps 15: min({{r15}}, {{c15}}) = {{macro3}} kg

