  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-315622
    - AVEXAM-31592
  annexes: []
  learningObjectiveIds:
    - 031.02.01.02.04
  templates:
    - type: simple
      question: For mass and balance purposes {{mass}} lb of Jet A-1 fuel needs to be drained before take-off. What is the volume of the drained fuel, in US gallons, if its specific gravity is {{sg}}?
      explanation: |-
        Volume is mass divided by density. 

        Conversion Factors: 

        - 1 kg = 2.2046 lb
        - 1 US gal = 3.785 l

        **Solution**

        $$
        \text{Mass}_{\text{kg}} &= \frac{\text{Mass}_{\text{lb}}}{2.2046} = \frac{ {{mass}} }{2.2046} = {{macro1}}\ \text{kg} \\
        \text{Vol}_{\text{litres}} &= \frac{\text{Mass}_{\text{kg}}}{\text{SG}} = \frac{ {{macro1}} }{ {{sg}} } = {{macro2}}\ \text{l} \\
        \text{Vol}_{\text{US gal}} &= \frac{\text{Vol}_{\text{litres}}}{3.785} = \frac{ {{macro2}} }{3.785} = \mathbf{ {{answer}}\ \text{US gal} }
        $$

