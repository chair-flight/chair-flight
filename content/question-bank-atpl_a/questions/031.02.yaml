        The dispatcher informs you that the Actual Traffic Load for your flight is {{tl}} kg. Given the following conditions, what is the maximum block fuel you can carry without exceeding the allowed take-off mass?

        - Dry Operating Mass: {{dom}} kg
        - Maximum Zero Fuel Mass: {{mzfm}} kg
        - Allowed Take-Off Mass: {{atom}} kg
        - Taxi Fuel: {{taxi}} kg

        Assume no restrictions on the Landing Mass.
      explanation: |-
        The maximum block fuel is limited by the allowed take-off mass (TOM). The fuel that fits is the allowed TOM minus the dry operating mass and the traffic load; the taxi fuel is burned before take-off, so it can be added on top. Here the zero fuel mass ({{macro1}} kg) is below the MZFM of {{mzfm}} kg, so the MZFM is not limiting.

