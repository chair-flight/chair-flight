      question: |-
        Refer to the figure. You are about to depart on a domestic commercial flight with an aircraft that has a capacity of 2 flight crew members and 10 passengers. Calculate the traffic load using the standard passenger and baggage masses from the annex. The flight crew is not part of the traffic load.

        - Flight crew: {{crew_count}}, standard mass {{crew_mass}} kg each
        - Male passengers: {{male_count}}
        - Female passengers: {{female_count}}
        - Checked baggage: 6 pieces, total mass {{baggage_mass}} kg
        - Hand baggage: 3 pieces

        The standard masses of a male passenger, a female passenger and the hand baggage are read from the annex.

        What is the traffic load (kg)?
      explanation: |-
        Traffic load is the mass of the passengers and their baggage. The flight crew is not included, so their mass is not added. Each passenger mass comes from the annex and is multiplied by the number of passengers of that type. The baggage is then added.

        **Solution**

        - Male passengers: {{male_count}} x {{male_mass}} kg = {{macro1}} kg
        - Female passengers: {{female_count}} x {{female_mass}} kg = {{macro2}} kg
        - Checked baggage and hand baggage: {{macro3}} kg
        - Traffic load = **{{answer}} kg**

        ## Why the other answers are wrong

        - **{{d1}} kg**: the flight crew is added, although the crew are not part of the traffic load.
        - **{{d2}} kg**: the hand baggage is left out.
        - **{{d3}} kg**: every passenger is given the male standard mass.
        - **{{d4}} kg**: the checked baggage is subtracted instead of added.
      presets:
        - variables:
            crew_count: 2
            crew_mass: 85
            male_count: 2
            female_count: 3
            baggage_mass: 63
            male_mass: 88
            macro1: 176
            female_mass: 70
            macro2: 210
            macro3: 83
            answer: 469
            d1: 639
            d2: 449
            d3: 523
            d4: 343
          correctAnswers:
            - text: 469 kg
          wrongAnswers:
            - text: 639 kg
            - text: 523 kg
            - text: 343 kg
            - text: 449 kg
