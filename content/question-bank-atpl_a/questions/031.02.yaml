  templates:
    - type: simple
      question: |-
        Given the following fuel masses, calculated by the pilot of a light aircraft with the following mass limitations, according to the Limitation section of the Aircraft Flight Manual, what is the maximum traffic load for this flight?

        - Block Fuel: {{block}} kg
        - Trip Fuel: {{trip}} kg
        - Taxi Fuel: {{taxi}} kg
        - Maximum Structural Take-Off Mass: {{mtom}} kg
        - Performance-Limited Take-Off Mass: {{ptom}} kg
        - Performance-Limited Landing Mass: {{pllm}} kg
        - Today's flight Dry Operating Mass: {{dom}} kg
      explanation: |-
        The take-off mass is limited by the lowest of the structural MTOM, the performance-limited take-off mass and the landing limit (performance-limited landing mass plus trip fuel). The traffic load is this take-off mass minus the DOM and the fuel on board at take-off (block fuel minus taxi fuel).

        **Solution**

        Limiting take-off mass = {{macro1}} kg

        $$
        \text{min}(\text{Maximum structural TOM},\text{Performance-limited TOM},\text{Performance-limited LM}+\text{Trip fuel})+\text{Taxi fuel}-\text{DOM}-\text{Block fuel} = \text{min}({{mtom}},{{ptom}},{{pllm}}+{{trip}})+{{taxi}}-{{dom}}-{{block}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: Uses only the structural MTOM and ignores the performance and landing limits.
        - **{{d2}} kg**: Ignores the landing limit (uses the lower of the take-off limits only).
        - **{{d3}} kg**: Uses the landing mass without adding the trip fuel.
