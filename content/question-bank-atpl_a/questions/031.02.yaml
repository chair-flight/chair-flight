  templates:
    - type: simple
      question: |-
        The crew of a transport jet aeroplane prepares a flight using the following data:

        - Dry Operating Mass: {{dom}} kg
        - Maximum Zero Fuel Mass: {{mzfm}} kg
        - Performance limited Take-off Mass: {{ptom}} kg
        - Performance limited Landing Mass: {{plm}} kg
        - Take-off fuel: {{tofuel}} kg
        - Trip fuel: {{trip}} kg

        What is the Traffic Load (TL) available for this flight?
      explanation: |-
        The traffic load is capped by three limits: zero fuel mass, take-off mass and landing mass. The landing limit adds the trip fuel, because the aeroplane lands lighter than it took off. The smallest of the three is the traffic load.

        **Solution**

        $$
        \begin{aligned}
        \text{TL}_{\text{ZFM}} &= \text{MZFM} - \text{DOM} = {{mzfm}} - {{dom}} = {{macro1}}\ \text{kg} \\
        \text{TL}_{\text{TOM}} &= \text{PTOM} - \text{DOM} - \text{TOF} = {{ptom}} - {{dom}} - {{tofuel}} = {{macro2}}\ \text{kg} \\
        \text{TL}_{\text{LM}} &= \text{PLM} + \text{Trip} - \text{DOM} - \text{TOF} = {{plm}} + {{trip}} - {{dom}} - {{tofuel}} = {{macro3}}\ \text{kg} \\
        \text{TL} &= \min(\text{TL}_{\text{ZFM}},\ \text{TL}_{\text{TOM}},\ \text{TL}_{\text{LM}}) = \mathbf{ {{answer}}\ \text{kg} }
        \end{aligned}
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: only the zero fuel mass limit is considered.
        - **{{d2}} kg**: only the landing limit is considered.
        - **{{d3}} kg**: the take-off fuel is not subtracted.
        - **{{d4}} kg**: trip fuel is subtracted instead of take-off fuel.
