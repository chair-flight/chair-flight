      question: |-
        Before departure for a flight, the load controller presents to you cargo documents for boxes containing spare parts. These boxes have a total mass of {{boxes}} kg. If you accept all the boxes, given the following information, what will be the Underload/Overload? Give the underload in kg as a positive number (an overload would be negative).

        - Allowed Take-Off Mass: {{atom}} kg
        - Maximum Zero Fuel Mass: {{mzfm}} kg
        - Operating Mass: {{om}} kg
        - Actual Zero Fuel Mass: {{zfm}} kg
        - Actual Traffic Load (without the boxes): {{tl}} kg
        - Take-off fuel: {{tofuel}} kg

        Disregard changes in fuel due to the increase in Total Mass. Consider no restrictions on structural limits and Allowed Landing Mass.
      explanation: |-
        The loaded aircraft must not exceed the allowed take-off mass. With the boxes added, the new zero fuel mass plus the take-off fuel gives the actual take-off mass; the difference to the allowed take-off mass is the underload (positive) or overload (negative). The MZFM is not the limiting value here, because the new ZFM stays below it.

        **Solution**

        New ZFM = {{macro1}} kg (below the MZFM of {{mzfm}} kg)

        $$\text{Allowed take-off mass}-(\text{Actual zero fuel mass}+\text{Mass of boxes}+\text{Take-off fuel}) = {{atom}}-({{zfm}}+{{boxes}}+{{tofuel}}) = \mathbf{ {{answer}}\ \text{kg} }$$ underload

        ## Why the other answers are wrong

        - **{{d1}} kg**: this is the margin to the MZFM, not to the allowed take-off mass.
        - **{{d2}} kg**: correct magnitude of the answer but the sign is reversed (underload read as overload).
        - **{{d3}} kg**: the mass of the boxes is not included in the take-off mass.
        - **{{d4}} kg**: the operating mass already includes fuel and the actual traffic load without boxes is ignored, so the figure is far too large.
        - **{{d5}} kg**: the MZFM margin with the sign reversed.
