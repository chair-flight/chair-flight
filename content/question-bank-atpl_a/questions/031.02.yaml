      question: |-
        According to the Flight Manual, the Maximum Structural Mass of your aircraft is {{struct}} lb, which may be increased by {{taxi}} lb for taxiing.

        It is a hot day and the performance charts restrict the Maximum All Up Mass (MAUM) to {{maum}} lb.

        The Regulated Take-Off Mass (RTOM) is:
      explanation: |-
        The regulated take-off mass is the lowest of the structural limit and the performance limit. The extra mass allowed for taxiing is burned off before take-off and is not part of the take-off limit.

        **Solution**

        $$
        \text{min}(\text{Maximum structural mass},\text{Performance limited MAUM}) = \text{min}({{struct}}, {{maum}}) = \mathbf{ {{answer}}\ \text{lb} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} lb**: adds the taxi allowance to the structural limit.
        - **{{d2}} lb**: adds the taxi allowance to the performance limit.
        - **{{d3}} lb**: uses the structural limit only and ignores the lower performance limit.
