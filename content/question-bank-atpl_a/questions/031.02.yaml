        - Zero Fuel Mass: {{zfm}} kg
        - Trip Fuel: {{trip}} kg
        - Block Fuel: {{block}} kg
        - Taxi Fuel: {{taxi}} kg

        The actual Take-Off Mass is equal to:
      explanation: |-
        The take-off mass is the zero fuel mass plus the fuel on board at take-off. That fuel is the block fuel minus the fuel burned during start-up and taxi.

        **Solution**

        $$
        \text{Zero fuel mass}+\text{Block fuel}-\text{Taxi fuel} = {{zfm}}+{{block}}-{{taxi}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: taxi fuel is not subtracted (this is the ramp mass).
        - **{{d2}} kg**: taxi fuel is added instead of subtracted.
        - **{{d3}} kg**: only the trip fuel is added (this is not the fuel on board at take-off).
        - **{{d4}} kg**: the trip fuel is subtracted from the block fuel instead of the taxi fuel.
