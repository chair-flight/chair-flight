      question: An aircraft is flying at a cruise altitude of 2 000 ft and at a distance of about 60 nm from its destination the pilot wants to listen to the ATIS. The message is very distorted and only parts of it can be received. What should the pilot do in order to have better reception?
      explanation: ""
      presets:
        - correctAnswers:
            - text: Fly at a higher altitude to increase the range of the reception.
          wrongAnswers:
            - text: Increase the volume of the receiver.
            - text: Increase the volume of their headset.
            - text: Select the frequency of APPROACH because they are responsible for the higher airspace.
