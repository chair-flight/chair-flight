      question: |-
        Provided that the flight is performed as planned, determine the in-flight revised landing mass at the destination (kg), given:

        - Dry Operating Mass (DOM): {{dom}} kg
        - Traffic Load: {{tl}} kg
        - Remaining Usable Fuel: {{rem_fuel}} kg
        - Remaining Trip Fuel: {{rem_trip}} kg
        - Final reserve fuel: {{fr}} kg
        - Alternate fuel: {{alt}} kg
      explanation: |-
        The current aircraft mass is DOM + traffic load + remaining usable fuel. If the flight goes as planned only the remaining trip fuel is burned, so reserves stay on board at landing.

        **Solution**

        $$
        \text{Dry operating mass}+\text{Traffic load}+\text{Remaining usable fuel}-\text{Remaining trip fuel} = {{dom}}+{{tl}}+{{rem_fuel}}-{{rem_trip}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: The remaining trip fuel was not subtracted (this is the current mass).
        - **{{d2}} kg**: The final reserve fuel was subtracted as well, although it is still on board at landing.
        - **{{d3}} kg**: The alternate fuel was subtracted as well, although it is still on board at landing.
        - **{{d4}} kg**: The remaining usable fuel was left out of the mass.
