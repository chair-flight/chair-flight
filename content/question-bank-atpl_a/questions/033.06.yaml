      question: |-
        Refer to the figure. You are cruising at FL380 with a twin-engined jet aeroplane. ATC instructs you to reduce speed to Mach .754. Given:

        Distance to Top-of-Descent: {{dist}} NM
        Aircraft mass: 50 000 kg (constant)
        TAT: -42 °C
        Average wind component: {{tw}} kt tailwind

        The TAS ({{tas}} kt) and total fuel flow ({{ff}} kg/h) at this Mach number are read from the figure. What fuel will you use for the remainder of the cruise?
      explanation: |-
        Ground speed is TAS plus the tailwind component. The time to the top of descent is distance divided by ground speed, and the fuel is that time multiplied by the fuel flow from the chart.

        **Solution**

        Ground speed: {{macro1}} kt

        $$
        \frac{\text{Distance to top of descent}}{\text{TAS read from the figure}+\text{Tailwind component}}\times \text{Fuel flow read from the figure} = \frac{ {{dist}} }{440+{{tw}} }\times {{ff}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: tailwind subtracted instead of added.
        - **{{d2}} kg**: wind ignored (ground speed = TAS).
        - **{{d3}} kg**: fuel flow read about 6 % too high.
        - **{{d4}} kg**: ground speed taken 10 kt too high.
      presets:
