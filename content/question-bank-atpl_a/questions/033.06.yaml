        - **{{d1}} l**: planned fuel flow used (and wind ignored) instead of the actual rate.
        - **{{d2}} l**: wind ignored in the ground speed.
        - **{{d3}} l**: headwind added to TAS instead of subtracted.
        - **{{d4}} l**: planned proportion of trip fuel used instead of actual consumption.
