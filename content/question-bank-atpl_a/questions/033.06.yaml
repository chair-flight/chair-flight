        Reserve fuel: {{res_pct}}% of trip fuel = {{macro4}} kg

        Trip fuel still to burn: {{macro3}} kg * {{t_rem}} / {{t_trip}} = {{macro5}} kg

        Fuel required = {{macro5}} + {{macro4}} = **{{answer}} kg**

        ## Why the other answers are wrong

        - **{{d1}} kg**: only the remaining trip fuel; the reserve fuel is forgotten.
        - **{{d2}} kg**: the reserve is taken as {{res_pct}}% of the remaining trip fuel instead of the full planned trip fuel.
        - **{{d3}} kg**: the start-up and taxi fuel is added again although it has already been used.
