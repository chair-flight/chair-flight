        - **{{d1}} kg**: this is only the planned fuel, not the difference.
        - **{{d2}} kg**: this is just the difference in fuel flow, ignoring the flight time.
        - **{{d3}} kg**: the planned fuel is computed with TAS instead of ground speed (wind ignored).
        - **{{d4}} kg**: this is the actual fuel consumption, not the difference.
