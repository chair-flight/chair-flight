- id: QXIJI
  subjectId: "033"
  chapterId: "033.06"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-339034
    - BGS-339592
    - AVEXAM-73673
  annexes: []
  learningObjectiveIds:
    - 033.06.01.01.02
  templates:
    - type: simple
      question: |-
        The planned flight time between two waypoints is {{tplan}} minutes, and the distance is {{dist}} NM. During the actual flight, the flight time between these waypoints is found to be {{tact}} minutes.

        How much lower is the actual groundspeed compared to the one that has been used for planning? Answer in kt.
      explanation: |-
        Groundspeed is distance divided by time. Compute the planned and the actual groundspeed and subtract them. Times in minutes are converted to hours by multiplying the result by 60.

        **Solution**

        Planned GS = {{dist}} NM / {{tplan}} min × 60 = {{macro1}} kt

        Actual GS = {{dist}} NM / {{tact}} min × 60 = {{macro2}} kt

        $$
        \frac{\text{Distance}}{\text{Planned flight time}}\times 60-\frac{\text{Distance}}{\text{Actual flight time}}\times 60 = \frac{ {{dist}} }{ {{tplan}} }\times 60-\frac{ {{dist}} }{ {{tact}} }\times 60 = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: this is the planned groundspeed, not the difference.
        - **{{d2}} kt**: this is the actual groundspeed, not the difference.
        - **{{d3}} kt**: the difference was taken with the wrong sign (actual minus planned).
        - **{{d4}} kt**: the time difference was multiplied by the planned distance per minute, which is not a speed difference.
        - **{{d5}} kt**: the distance was divided by the time difference only.
      presets:
        - variables:
            tplan: 25
            dist: 30
            tact: 32
            macro1: 72
            macro2: 56
            answer: 16
            d1: 72
            d2: 56
            d3: -16
            d4: 8
            d5: 257
          correctAnswers:
            - text: 16 kt
          wrongAnswers:
            - text: -16 kt
            - text: 8 kt
            - text: 72 kt
            - text: 56 kt
            - text: 257 kt
