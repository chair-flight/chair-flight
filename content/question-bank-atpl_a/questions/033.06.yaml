- id: QCAJH
  subjectId: "033"
  chapterId: "033.06"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-338956
  annexes: []
  learningObjectiveIds:
    - 033.06.01.01.03
  templates:
    - type: simple
      question: |-
        Given the following information, what time deviation will be encountered on the leg? Give the delay in minutes (a negative value means an advance).

        - Reference leg time on the flight plan: {{ref}} minutes
        - Leg track: {{trk}}°
        - Leg distance: {{dist}} NM
        - TAS: {{tas}} kt
        - Wind: {{wdir}}°/{{wspd}} kt
      explanation: |-
        The actual leg time is distance over ground speed. The deviation is the actual time minus the reference time on the flight plan; a positive result is a delay.

        **Solution**

        Ground speed: {{macro1}} kt

        Actual time: {{macro2}} min

        $$\frac{\text{Leg distance}}{\text{TAS}\times \text{cos}(\text{asin}(\frac{\text{Wind speed}\times \text{sin}(\text{Wind direction (from)}-\text{Leg track})}{\text{TAS}}))-\text{Wind speed}\times \text{cos}(\text{Wind direction (from)}-\text{Leg track})}\times 60-\text{Reference leg time} = \frac{ {{dist}} }{ {{tas}}\times \text{cos}(\text{asin}(\frac{ {{wspd}}\times \text{sin}({{wdir}}-{{trk}})}{ {{tas}} }))-{{wspd}}\times \text{cos}({{wdir}}-{{trk}})}\times 60-{{ref}} = \mathbf{ {{answer}}\ \text{min} }$$ (delay)

        ## Why the other answers are wrong

        - **{{d1}} min**: ignores the wind when computing the actual time.
        - **{{d2}} min**: adds the wind component with the wrong sign (tailwind instead of headwind).
        - **{{d3}} min**: gives the total leg time without subtracting the reference time.
        - **{{d4}} min**: subtracts in the wrong order, so the sign is inverted.
      presets:
