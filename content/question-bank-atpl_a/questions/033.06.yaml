        ## Why the other answers are wrong

        - **{{d1}} lb**: the planned fuel flow was used instead of the actual one.
        - **{{d2}} lb**: this is only the fuel used so far.
        - **{{d3}} lb**: the wind was ignored in the remaining time.
        - **{{d4}} lb**: the headwind was added to the TAS.
