    - 033.06.01.01.02
  templates:
    - type: simple
      question: |-
        You are flying a heading of {{hdg}}° with a TAS of {{tas}} kt. The wind is from {{wd}}° at {{ws}} kt.

        What will be your ground speed?
      explanation: |-
        With the heading known, the ground speed is the vector sum of the air vector (heading, TAS) and the wind vector. Split the wind into a component along the heading (head/tailwind) and a component across it (crosswind), then combine them with Pythagoras.

        **Solution**

        Along-heading speed: {{macro1}} kt

        Cross component: {{macro2}} kt

        $$
        \sqrt{{(\text{TAS}-\text{Wind speed}\times \text{cos}(\text{Wind direction (from)}-\text{Heading}))}^{2}+{(\text{Wind speed}\times \text{sin}(\text{Wind direction (from)}-\text{Heading}))}^{2}} = \sqrt{{({{tas}}-{{ws}}\times \text{cos}({{wd}}-{{hdg}}))}^{2}+{({{ws}}\times \text{sin}({{wd}}-{{hdg}}))}^{2}} = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: full wind speed subtracted as if it were a direct headwind.
        - **{{d2}} kt**: full wind speed added as if it were a direct tailwind.
        - **{{d3}} kt**: only the along-heading wind component applied, the crosswind effect is ignored.
        - **{{d4}} kt**: the wind component along the heading added with the wrong sign.
        - **{{d5}} kt**: the crosswind removed from the TAS but the wind component along the heading ignored.
      presets:
        - variables:
            hdg: 120
            tas: 110
            wd: 260
            ws: 30
            macro1: 133
            macro2: 19
            answer: 134
            d1: 80
            d2: 140
            d3: 133
            d4: 87
            d5: 108
          correctAnswers:
