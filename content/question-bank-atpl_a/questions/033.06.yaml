  templates:
    - type: simple
      question: |-
        Refer to figure. An aeroplane uses its fuel by these rules: each engine always feeds from the inner tank on its side. The aft trim tank transfers all its content to the inner tanks when these hold less than 4 000 kg. The outer tanks transfer all their content to the inner tanks when the inner tanks hold less than 3 500 kg. The trim tank and outer tanks are full at the start.

        During the flight, the trim tank transfer pump fails when the total fuel on board is {{total_fuel}} kg. The fuel still in the trim tank at that moment (read from the figure) is {{trim_fuel}} kg. The fuel consumption is {{consumption}} kg/min.

        What is the remaining endurance?
      explanation: |-
        Fuel in the trim tank cannot be transferred once its pump has failed, so it is not usable. The remaining endurance is the usable fuel divided by the fuel consumption, converted into hours and minutes.

        **Solution**

        - Usable fuel: $$\text{Total fuel on board when the pump fails}-\text{Fuel in trim tank (read from figure)} = 18590-4910$$ kg
        - Endurance: $$\frac{\text{Total fuel on board when the pump fails}-\text{Fuel in trim tank (read from figure)}}{\text{Fuel consumption}} = \frac{18590-4910}{95}$$ minutes = **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}}**: counts the fuel in the trim tank as usable.
        - **{{d2}}**: divides by a consumption 10 % lower than the given value.
        - **{{d3}}**: removes the trim tank fuel twice.
        - **{{d4}}**: adds the trim tank fuel instead of removing it.
