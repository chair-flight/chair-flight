  templates:
    - type: simple
      question: |-
        Determine the revised estimated landing mass at the destination aerodrome, given the following information:

        - DOM: {{dom}} lb
        - Traffic load: {{load}} lb
        - Remaining usable fuel: {{fuel}} lb
        - Remaining trip fuel to the destination: {{trip}} lb
        - Alternate fuel: {{alt}} lb
        - Final reserve fuel: {{res}} lb
      explanation: |-
        The landing mass is the mass the aeroplane has when it arrives: the dry operating mass plus the traffic load plus the fuel that is still on board at landing. The fuel still on board at landing is the remaining usable fuel minus the remaining trip fuel to the destination. Alternate and final reserve fuel are part of the remaining usable fuel and are not burned on the way to the destination, so they are not subtracted.

        **Solution**

        Fuel at landing = {{macro1}} lb

        $$
        \text{DOM}+\text{Traffic load}+\text{Remaining usable fuel}-\text{Remaining trip fuel} = {{dom}}+{{load}}+{{fuel}}-{{trip}} = \mathbf{ {{answer}}\ \text{lb} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} lb**: the trip fuel was added instead of subtracted, so the fuel burned is counted as fuel on board.
        - **{{d2}} lb**: the final reserve fuel was subtracted as well, although it stays in the tanks at landing.
        - **{{d3}} lb**: alternate and final reserve fuel were added on top of the remaining usable fuel, although they are already included in it.
