      question: |-
        The Block fuel for an IFR flight with a single engine aircraft was {{block}} lb.

        - Alternate fuel = {{alt}} lb
        - Final reserve fuel = {{frf}} lb
        - Taxi fuel = {{taxi}} lb

        After a flight time of {{elapsed}} minutes the remaining fuel is {{remaining}} lb. Considering a constant fuel flow, the remaining flight time to fly to the destination, landing with the required reserve fuel is (in minutes):
      explanation: |-
        Fuel flow is constant, so fuel burned in flight is proportional to time. The fuel used in flight is block fuel minus taxi fuel minus remaining fuel; the fuel still usable to the destination is the remaining fuel minus alternate and final reserve.

        **Solution**

        Fuel used in flight = {{block}} - {{taxi}} - {{remaining}} = {{macro1}} lb in {{elapsed}} min

        Usable fuel left = {{remaining}} - {{alt}} - {{frf}} = {{macro2}} lb

        Time = {{macro2}} * {{elapsed}} / {{macro1}} = **{{answer}} min**

        ## Why the other answers are wrong

        - **{{d1}} min**: does not subtract the alternate and final reserve fuel from the remaining fuel.
        - **{{d2}} min**: does not subtract the final reserve fuel.
        - **{{d3}} min**: does not subtract the alternate fuel.
        - **{{d4}} min**: includes the taxi fuel in the fuel burned in flight, which gives a too low fuel flow... actually a too high burn and therefore a too short time.
