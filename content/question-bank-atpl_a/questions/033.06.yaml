        - **{{d1}} kg/h**: this is the actual fuel flow itself, not the difference from the plan.
        - **{{d2}} kg/h**: treats the remaining fuel as if it were the fuel used.
        - **{{d3}} kg/h**: uses the whole planned trip fuel as fuel used and gets the opposite relation to the plan.
        - **{{d4}} kg/h**: gives the fuel used, forgetting to divide by the elapsed time.
