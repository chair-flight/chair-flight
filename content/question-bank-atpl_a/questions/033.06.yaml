      question: |-
        A pilot plans to fly from airport A to airport B, {{dtot}} NM away. After flying for {{t}} min covering {{dfl}} NM, the fuel remaining is {{frem}} lb plus reserves. Assuming conditions remain unchanged, what will be the remaining fuel at airport B (in lb, plus reserves)?

        - Average TAS: {{tas}} kt
        - Headwind component: {{hw}} kt
        - Trip fuel: {{trip}} lb
        - Planned average fuel flow: {{ffp}} lb/h
      explanation: |-
        The actual fuel flow is the fuel used so far (trip fuel minus fuel remaining) divided by the elapsed time. The remaining time uses the ground speed (TAS minus headwind). Fuel at destination is the present fuel minus the burn for the remaining distance.

        **Solution**

        Actual fuel flow = ({{trip}} - {{frem}}) / ({{t}} / 60) = {{macro1}} lb/h

        Remaining time = {{macro2}} NM / {{macro3}} kt = {{macro4}} h

