        The planned fuel flow is {{ff}} kg/h.

        By how many kg/h is the actual fuel flow lower than planned? (Give the difference as a positive number.)
      explanation: |-
        The planned trip fuel is the planned fuel flow times the planned flight time (distance / ground speed). The fuel used so far is the planned trip fuel minus the fuel remaining; dividing by the elapsed time gives the actual fuel flow.

        **Solution**

        Planned trip fuel = {{macro1}} kg
        Fuel used = {{macro2}} kg in {{t}} min
