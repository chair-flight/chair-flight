        - Reserve fuel: {{res}} % of the planned trip fuel
        - Start up and Taxi fuel: {{taxi}} kg
        - Block fuel: {{block}} kg

        How much fuel should remain after a flight time of {{el}} min?
      explanation: |-
        Block fuel minus taxi fuel is the fuel available for trip plus reserve. With the reserve being a percentage of the trip fuel, trip fuel = available / (1 + reserve %). Fuel burned is assumed proportional to flight time, and the remaining fuel is what is left of the available fuel.

        **Solution**

