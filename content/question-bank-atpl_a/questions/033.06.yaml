      question: |-
        Refer to figure.

        Planning data are shown in the Flight Log excerpt (Fuel Planning Section).

        After a balked landing at the destination airport you divert to the alternate with the gear extended.

        The mass at the balked landing, read from the flight log, is {{m_dest}} kg.

        The re-calculated flight time to the alternate due to the reduced speed is {{t_min}} min and the fuel flow will be {{ff}} kg/h.

        Final Reserve Fuel remains unchanged.

        What will be the estimated landing mass at the alternate airport (kg)?
      explanation: |-
        The landing mass at the alternate equals the mass at the balked landing minus the fuel burnt on the diversion. The fuel burnt is fuel flow times flight time, and the flight time must be converted to hours.

        **Solution**

        Fuel burnt = $$\frac{\text{Fuel flow}\times \text{Flight time to alternate}}{60}$$ = $$\frac{ {{ff}}\times {{t_min}} }{60}$$ = {{macro3}} kg

        Landing mass = $$\text{Mass at balked landing (read from flight log)}-\frac{\text{Fuel flow}\times \text{Flight time to alternate}}{60} = {{m_dest}}-\frac{ {{ff}}\times {{t_min}} }{60} = \mathbf{ {{answer}}\ \text{kg} }$$

        ## Why the other answers are wrong

        - **{{d1}} kg**: no diversion fuel is subtracted.
        - **{{d2}} kg**: the diversion fuel is added instead of subtracted.
        - **{{d3}} kg**: the flight time in minutes is multiplied by the hourly fuel flow without converting to hours.
        - **{{d4}} kg**: only one hour of fuel flow is subtracted instead of the actual flight time.
        - **{{d5}} kg**: the time is divided by 30 instead of 60 (wrong minute-to-hour conversion).
