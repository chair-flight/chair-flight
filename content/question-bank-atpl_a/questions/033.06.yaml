      question: |-
        An aircraft planning to fly a total distance of {{total}} NM covers {{cov}} NM in {{el}} min, and its actual fuel remaining is {{fn}} l. Given the following information and assuming that the actual fuel consumption remains at the same rate, what will be the actual fuel remaining at destination?

        - Average TAS: {{tas}} kt
        - Average wind component: {{hw}} kt headwind
        - Trip fuel (fuel at start): {{trip}} l
        - Planned average fuel flow: {{pff}} l/h
      explanation: |-
        The actual fuel flow is the fuel used so far (initial fuel minus fuel remaining) divided by the elapsed time. The remaining time is the remaining distance divided by the ground speed (TAS minus headwind). Fuel remaining at destination is the current fuel minus actual fuel flow times remaining time (fuel flow rounded to whole litres per hour and time to 0.01 h).

        **Solution**

        Actual fuel flow: {{macro1}} l/h

        Remaining time: {{macro2}} h

        $$
        \text{Actual fuel remaining}-\frac{\text{round}(\frac{\text{Trip fuel (fuel at start)}-\text{Actual fuel remaining}}{\frac{\text{Elapsed time}}{60}})\times \text{round}(\frac{\text{Total distance}-\text{Distance covered}}{\text{TAS}-\text{Headwind}}\times 100)}{100} = \mathbf{ {{answer}}\ \text{l} }
        $$

