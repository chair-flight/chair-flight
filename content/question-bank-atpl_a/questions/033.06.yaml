    - AVEXAM-73594
    - AVEXAM-5268
  annexes: []
  learningObjectiveIds:
    - 033.06.01.01.02
  templates:
    - type: simple
      question: |-
        Given the following information, calculate the ground speed (kt):

        - TAS: {{tas}} kt
        - Reported wind: {{wd}}°/{{ws}} kt
        - Course: {{mc}}° (M)
        - Variation: {{var_w}}° (W)
      explanation: |-
        The reported wind is a true direction, so the magnetic course must first be converted to a true course (west variation is added: magnetic + west = true). Then the wind triangle gives the ground speed.

        **Solution**

        True course = {{mc}}° + {{var_w}}° = {{macro1}}°; WCA = {{macro2}}°

        $$
        \text{TAS}\times \text{cos}(\text{asin}(\frac{\text{Wind speed}\times \text{sin}(\text{Wind direction (true)}-(\text{Magnetic course}+\text{West variation}))}{\text{TAS}}))-\text{Wind speed}\times \text{cos}(\text{Wind direction (true)}-(\text{Magnetic course}+\text{West variation})) = {{tas}}\times \text{cos}(\text{asin}(\frac{ {{ws}}\times \text{sin}({{wd}}-({{mc}}+{{var_w}}))}{ {{tas}} }))-{{ws}}\times \text{cos}({{wd}}-({{mc}}+{{var_w}})) = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: TAS and wind speed were added as if there were a pure tail wind.
        - **{{d2}} kt**: The variation was subtracted instead of added.
        - **{{d3}} kt**: The cross wind component was used instead of the head wind component.
        - **{{d4}} kt**: The variation was subtracted from the ground speed.
      presets:
        - variables:
            tas: 150
            wd: 204
            ws: 30
            mc: 200
            var_w: 10
            macro1: 210
            macro2: -1
            answer: 120
