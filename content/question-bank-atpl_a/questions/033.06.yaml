      question: |-
        Given the following information, the pilot decides to fly with a TAS of {{tas2}} kt because of a stronger headwind than forecast. What will be the difference in fuel consumption between the planned and the actual conditions?

        - Distance A-B: {{dist}} NM
        - Planned TAS: {{tas1}} kt
        - Planned headwind component: {{hw1}} kt
        - Actual headwind component: {{hw2}} kt
        - Fuel flow at TAS {{tas1}} kt: {{ff1}} kg/h
        - Fuel flow at TAS {{tas2}} kt: {{ff2}} kg/h
