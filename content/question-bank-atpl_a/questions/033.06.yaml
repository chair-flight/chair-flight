        - Operator's specified Reserve Fuel: {{res_pct}}% of the planned Trip Fuel
        - Start up and Taxi Fuel: {{taxi}} kg
        - Block Fuel: {{block}} kg
      explanation: |-
        Block fuel is the sum of start-up and taxi fuel, trip fuel and reserve fuel. Fuel required for the rest of the flight is the part of the trip fuel still to be burnt (proportional to the remaining time) plus the full reserve, which must still be on board. Start-up and taxi fuel has already been used.

        **Solution**

