        \text{Block fuel}-\text{Start up and taxi fuel}-\frac{\frac{\text{Block fuel}-\text{Start up and taxi fuel}}{1+\frac{\text{Reserve fuel percentage}}{100}}\times \text{Elapsed flight time}}{\text{Planned trip time}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: taxi fuel was not subtracted.
        - **{{d2}} kg**: the reserve was not separated, the whole available fuel was scaled by time.
        - **{{d3}} kg**: fuel for the remaining time was subtracted instead of the elapsed time.
        - **{{d4}} kg**: this is the trip fuel still to be burned, reserve not included.
