        Refer to the figure (Flight Log excerpt with planned and actual data).

        Arriving overhead a waypoint with {{fs}} kg fuel remaining, you are cleared for direct routeing to a later waypoint.

        The actual fuel flow shown in the log is {{ff}} kg/h and the flight time for the direct leg will be {{time}} min.

        Provided that flight conditions and fuel consumption remain unchanged, what fuel remaining should be expected at the end of the direct leg?

        Fuel remaining and fuel flow are read from the Flight Log.
      explanation: |-
        The fuel remaining at the end of the direct leg is the fuel remaining at its start minus the fuel burned during the leg, which is fuel flow multiplied by flight time.

        **Solution**

        Fuel burned: $$\frac{\text{Actual fuel flow (from log)}\times \text{Direct leg flight time}}{60} = \frac{ {{ff}}\times {{time}} }{60}$$ kg

        $$
        \text{Fuel remaining at the start waypoint (from log)}-\frac{\text{Actual fuel flow (from log)}\times \text{Direct leg flight time}}{60} = {{fs}}-\frac{ {{ff}}\times {{time}} }{60} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: minutes converted to hours by dividing by 100 instead of 60.
        - **{{d2}} kg**: fuel burned was added instead of subtracted.
        - **{{d3}} kg**: leg time taken 10 min too long.
        - **{{d4}} kg**: leg time taken 10 min too short.
        - **{{d5}} kg**: fuel flow increased by 10 %.
