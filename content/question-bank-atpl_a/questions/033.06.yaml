  templates:
    - type: simple
      question: |-
        A flight has been diverted off the planned route due to bad weather. ATC clears the flight to re-join the planned route at TUSKA. The pilot wishes to decide early whether there is enough fuel to safely complete the flight, so the fuel is checked {{t}} minutes before the ETO TUSKA. Given the following data, what is the minimum fuel required at the time of the check to complete the planned flight?

        - Minimum fuel at TUSKA to complete the flight: {{fmin}} litres
        - Average fuel flow: {{ff}} kg/h
        - Fuel density: {{rho}} kg/lt
      explanation: |-
        The fuel needed at the check point is the minimum fuel at the re-join point plus the fuel burned in between. Fuel flow is in kg/h while the quantities are in litres, so the mass must be converted with the density.

        **Solution**

        Minimum fuel at TUSKA = {{fmin}} x {{rho}} = {{macro1}} kg

        Fuel burned until TUSKA = {{ff}} x {{t}} / 60 = {{macro2}} kg

        Total = {{macro3}} kg, which is {{macro3}} / {{rho}} = **{{answer}} litres**

        ## Why the other answers are wrong

        - **{{d1}} litres**: the burned fuel in kg was added directly to litres without converting with the density.
        - **{{d2}} litres**: the fuel to be burned was subtracted instead of added.
        - **{{d3}} litres**: the burned fuel was converted from kg to litres in the wrong direction (multiplied by the density).
