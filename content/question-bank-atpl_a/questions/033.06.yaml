  templates:
    - type: simple
      question: |-
        A two-engine aircraft has three fuel tanks. At take-off the fuel on board is:

        - Centre tank: {{centre}} kg
        - Left wing tank: {{left}} kg
        - Right wing tank: {{right}} kg

        A pump continuously transfers fuel from the centre tank to the wing tanks at {{pump}} kg/h. On the flight from A to B the fuel flow is {{flow}} kg/h. {{t}} minutes into the flight the centre tank pump fails.

        From the point of the failure, how long can the aircraft fly? Give the answer in hours and minutes.
      explanation: |-
        The engines burn fuel from the wing tanks, and the pump keeps moving fuel from the centre tank into the wings. Until the pump fails, the wings gain what the pump transfers and lose what the engines burn. After the failure, the fuel left in the wing tanks is all that can be used, so the endurance is that fuel divided by the fuel flow.

        **Solution**

        Fuel in the wings at the failure = {{left}} + {{right}} + ({{pump}} - {{flow}}) x {{t}} / 60 = {{macro1}} kg

        Endurance = {{macro1}} / {{flow}} x 60 = **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}} min**: forgets the fuel transferred by the pump during the first {{t}} minutes.
        - **{{d2}} min**: counts the fuel in the centre tank, which cannot be used after the pump fails.
        - **{{d3}} min**: reverses the pump and fuel flow, so the wings are assumed to gain fuel faster than the engines burn it.
        - **{{d4}} min**: ignores the pump completely and uses the wing fuel at take-off.
      presets:
        - variables:
            centre: 650
            left: 250
            right: 250
            pump: 150
            flow: 170
