      question: |-
        Calculate the estimated total fuel used from Beta to Delta. The fuel remaining at each waypoint was:

        - Alpha: {{fa}} gallons (reference time)
        - Beta: {{fb}} gallons, {{tab}} min after Alpha
        - Charlie: {{fc}} gallons, {{tbc}} min after Beta
        - Delta: ? gallons, {{tcd}} min after Charlie
      explanation: |-
        The fuel flow is assumed constant and is derived from the last interval for which both fuel quantities and times are known. The fuel used over the elapsed time from Beta to Delta is then the fuel flow multiplied by that time.

        **Solution**

        Fuel flow Beta to Charlie: $$\frac{\text{Fuel at Beta}-\text{Fuel at Charlie}}{\text{Time Beta to Charlie}}$$ = $$\frac{ {{fb}}-{{fc}} }{ {{tbc}} }$$ = {{macro3}} gallons/min

        Time Beta to Delta: {{tbc}} + {{tcd}} = {{macro4}} min

        $$
        \frac{\text{Fuel at Beta}-\text{Fuel at Charlie}}{\text{Time Beta to Charlie}}\times (\text{Time Beta to Charlie}+\text{Time Charlie to Delta}) = \frac{ {{fb}}-{{fc}} }{ {{tbc}} }\times ({{tbc}}+{{tcd}}) = \mathbf{ {{answer}}\ \text{gallons} }
