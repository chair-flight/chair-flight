  templates:
    - type: simple
      question: |-
        For a planned flight the calculated fuel is as listed below. How much fuel should be aboard to cover the rest of the flight, if the remaining flight time to destination is {{remaining}} min?

        - Trip fuel: sufficient for a planned flight time of {{planned}} min
        - Operator's specified reserve fuel: {{reserve}} % of the planned trip fuel
        - Start-up and taxi fuel: {{taxi}} kg
        - Block fuel: {{block}} kg

        Give the answer in kg.
      explanation: |-
        Block fuel = taxi fuel + planned trip fuel + reserve, and the reserve is a percentage of the planned trip fuel. The planned trip fuel is therefore (block - taxi) / (1 + reserve). The fuel for the rest of the flight is the planned trip fuel scaled by the ratio of remaining to planned time, plus the reserve.

        **Solution**

        Planned trip fuel = (block - taxi) / (1 + reserve) = {{macro1}} kg

        Trip fuel for the rest of the flight = {{macro2}} kg

        Reserve = {{macro3}} kg

        $$
        \frac{\text{Block fuel}-\text{Start-up and taxi fuel}}{1+\frac{\text{Reserve fuel}}{100}}\times (\frac{\text{Remaining flight time}}{\text{Planned flight time}}+\frac{\text{Reserve fuel}}{100}) = \frac{ {{block}}-{{taxi}} }{1+\frac{ {{reserve}} }{100}}\times (\frac{ {{remaining}} }{ {{planned}} }+\frac{ {{reserve}} }{100}) = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: the rest-of-flight trip fuel only, forgetting the reserve.
        - **{{d2}} kg**: does not divide by (1 + reserve), so the block fuel is treated as if the reserve were not part of it.
        - **{{d3}} kg**: forgets to subtract the taxi fuel from the block fuel.
        - **{{d4}} kg**: uses (1 - reserve) instead of (1 + reserve) in the trip fuel.
