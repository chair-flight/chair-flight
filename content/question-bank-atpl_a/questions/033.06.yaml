    - type: simple
      question: |-
        Refer to figure. The engines always feed from their own inner tank (left engine from the left inner tank, right engine from the right inner tank). During flight, when the total fuel quantity reaches 12 730 kg, the left hand transfer valve between the left outer and inner tanks fails to open.

        - Fuel in the right inner tank at that moment (read from the figure): {{right_inner_fuel}} kg
        - Fuel flow of each engine: {{flow_per_engine}} kg/h

        What is the remaining endurance for the right engine?
      explanation: |-
        The right engine only uses fuel from the right inner tank, so its endurance is the fuel in that tank divided by the engine's fuel flow. The fuel flow is given in kilograms per hour, so the result is converted into minutes.

        **Solution**

        $$\frac{\text{Fuel in right inner tank (read from figure)}}{\text{Fuel flow of each engine}}\times 60 = \frac{6323}{5420}\times 60$$ minutes = **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}}**: doubles the fuel in the right inner tank, as if both inner tanks fed the right engine.
        - **{{d2}}**: halves the fuel flow, which doubles the result wrongly.
        - **{{d3}}**: adds 10 minutes to the correct result.
        - **{{d4}}**: adds 30 minutes to the correct result.
