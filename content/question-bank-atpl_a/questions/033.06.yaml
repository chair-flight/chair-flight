- id: QGLBG
  subjectId: "033"
  chapterId: "033.06"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-339761
    - BGS-330213
    - AVEXAM-6758
  annexes: []
  learningObjectiveIds:
    - 033.06.01.02.05
  templates:
    - type: simple
      question: |-
        Refer to figure. Finish the endurance and fuel calculation and determine the ATC endurance for a twin jet aeroplane, with the help of the table provided.

        - Trip fuel (read from the figure): {{trip_fuel}} kg
        - Fuel on board (read from the figure): {{fuel_on_board}} kg
        - Contingency fuel: 5 % of the trip fuel
        - Fuel flow for extra fuel: {{extra_flow}} kg/h

        What is the ATC endurance?
      explanation: |-
        The ATC endurance is the fuel left over after the trip and the contingency fuel, divided by the fuel flow for the extra fuel. The contingency fuel is 5 % of the trip fuel and is added to the trip fuel before it is taken off the fuel on board.

        **Solution**

        $$\frac{\text{Fuel on board (read from figure)}-1.05\times \text{Trip fuel (read from figure)}}{\text{Fuel flow for extra fuel}}\times 60 = \frac{30880-1.05\times 20000}{2400}\times 60$$ minutes = **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}}**: leaves out the contingency fuel, so too much fuel is left for the extra endurance.
        - **{{d2}}**: takes the contingency off the trip fuel instead of adding it, so too much fuel is left.
        - **{{d3}}**: divides by 2 500 kg/h instead of the given fuel flow of 2 400 kg/h.
        - **{{d4}}**: uses the correct fuel but adds 5 minutes to the result.
      presets:
