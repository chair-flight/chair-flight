  templates:
    - type: simple
      question: |-
        Due to a passenger's serious illness while en-route, the aircraft must divert to the nearest suitable airfield.

        The FMC calculates a flight time of {{time}} minutes to the nearest diversion airfield and shows a gross mass of {{gross}} kg.

        The fuel on board is {{fob}} kg and the FMC gives a fuel on landing of {{fol}} kg.

        How much is the landing mass (kg)?
      explanation: |-
        The fuel burned until landing is the fuel on board minus the predicted fuel on landing. The landing mass is the current gross mass minus that fuel burn.

        **Solution**

        Fuel burned: {{macro1}} kg

        $$
        \text{Gross mass}-\text{Fuel on board}+\text{FMC fuel on landing} = {{gross}}-{{fob}}+{{fol}} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: The whole fuel on board was subtracted, as if all of it were burned.
        - **{{d2}} kg**: The fuel on landing was subtracted instead of the fuel burned.
        - **{{d3}} kg**: The fuel burn was added instead of subtracted.
        - **{{d4}} kg**: Both the fuel on board and the fuel on landing were subtracted.
