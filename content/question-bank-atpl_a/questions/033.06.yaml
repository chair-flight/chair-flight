        Fuel for a leg is the fuel flow multiplied by the flight time, and the flight time is the distance divided by the ground speed (TAS minus headwind). Compute the fuel for the planned and the actual conditions and subtract.

        **Solution**

        Planned: $$\frac{ {{ff1}}\times {{dist}} }{ {{tas1}}-{{hw1}} }$$ = {{macro2}} kg

        Actual: $$\frac{ {{ff2}}\times {{dist}} }{ {{tas2}}-{{hw2}} }$$ = {{macro4}} kg

        Difference = **{{answer}} kg**

