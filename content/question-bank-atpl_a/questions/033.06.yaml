        What will be the estimated landing mass at the alternate airport (kg)?
      explanation: |-
        The mass at the alternate is the mass at the balked landing minus the fuel burned during the diversion, which is the fuel flow times the flight time in hours.

        **Solution**

        Fuel burned: {{macro1}} kg

        $$
        \text{Mass at balked landing (read from figure)}-\text{Fuel flow}\times (\text{Flight time, hours}+\frac{\text{Flight time, minutes}}{60}) = {{m0}}-{{ff}}\times ({{t_h}}+\frac{ {{t_min}} }{60}) = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: The diversion fuel was not subtracted.
        - **{{d2}} kg**: The diversion fuel was added instead of subtracted.
        - **{{d3}} kg**: The minutes were converted to hours by dividing by 100 instead of 60.
        - **{{d4}} kg**: The minutes of the flight time were ignored.
