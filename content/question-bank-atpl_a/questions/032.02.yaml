  templates:
    - type: simple
      question: What is the minimum speed at 50 ft above the take-off surface for a single-engine aeroplane with a VS1 of {{vs1}} kt?
      explanation: |-
        For single-engine aeroplanes (performance class B) the speed at the 50 ft screen height must be at least 1.2 times the stall speed VS1 in the take-off configuration. The result is rounded up to the next whole knot.

        **Solution**

        $$1.2\times \text{VS1}$$ = $$1.2\times {{vs1}}$$ = {{macro3}} kt, rounded up to **{{answer}} kt**

        ## Why the other answers are wrong

        - **{{d1}} kt**: uses a factor of 1.3 instead of 1.2.
        - **{{d2}} kt**: uses a factor of 1.1 instead of 1.2.
        - **{{d3}} kt**: uses a factor of only 1.05, which is too low for the 50 ft screen height.
      presets:
