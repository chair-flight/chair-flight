  templates:
    - type: simple
      question: |-
        What will be the V_REF speed for a Class B performance category single-engined piston aeroplane with a maximum take-off mass of 1633 kg, given the following stall speeds?

        - V_SO: {{vso}} kt
        - V_S1: {{vs1}} kt
        - V_S: {{vs}} kt
      explanation: |-
        For a Class B aeroplane the reference landing speed V_REF is 1.3 times the stall speed in the landing configuration, V_SO.

        **Solution**

        $$
        1.3\times \text{V_SO} = 1.3\times {{vso}} = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: uses a factor of 1.2 applied to V_S1.
        - **{{d2}} kt**: applies 1.3 to V_S1 (clean/specified configuration) instead of V_SO (landing configuration).
        - **{{d3}} kt**: applies 1.3 to V_S instead of V_SO.
      presets:
        - variables:
            vso: 60
            vs1: 63
            vs: 68
            answer: 78
            d1: 76
            d2: 82
            d3: 88
          correctAnswers:
