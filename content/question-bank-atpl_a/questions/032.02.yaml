      question: |-
        A multi-engine turboprop aircraft with a max take-off weight of 5 300 kg is under performance class B.

        Given the following speeds, what is its V**R** and V**2**.

        V**SO**: 63 kt V**S1**: 69 kt V**S**: 77 kt V**MC**: 70 kt
      explanation: For a Performance Class B aeroplane the rotation speed is 1.1 × VS1 = 1.1 × 69 = 76 kt. The take-off safety speed is 1.2 × VS1 = 1.2 × 69 = 83 kt. Both are above VMC (70 kt), so the answer is **VR 76 kt, V2 83 kt**.
      presets:
