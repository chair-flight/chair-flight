      explanation: |-
        The crosswind is the part of the wind that blows across the runway. It is found from the angle between the wind and the runway heading, using the sine. The maximum wind is therefore the crosswind limit divided by that crosswind factor.

        **Solution**

        - Crosswind factor for each knot of wind: {{macro1}}
        - Maximum wind = {{cw_limit}} kt / {{macro1}} = **{{answer}} kt**

        ## Why the other answers are wrong

        - **{{d1}} kt**: the tailwind limit is used instead of the crosswind limit.
        - **{{d2}} kt**: the cosine is used instead of the sine, which gives the headwind-based result.
        - **{{d3}} kt**: the headwind limit is used in place of the crosswind limit.
        - **{{d4}} kt**: the crosswind limit is multiplied by the sine instead of divided.
