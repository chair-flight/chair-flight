      question: |-
        For a single-engine aeroplane, calculate the net glide distance following an engine failure. Given:

        - Altitude: {{alt}} ft
        - Terrain elevation: {{elev}} ft
        - Gross gradient: {{grad}}%
        - TAS: {{tas}} kt
        - Headwind: {{hw}} kt (a negative value is a tailwind)

        Still air distance = (height difference (ft) x 100) / net gradient (%)
        Ground distance = still air distance x (GS / TAS)
        Assume 1 NM = 6 080 ft.
      explanation: |-
        After an engine failure the aeroplane glides at the net gradient, which is the gross gradient increased by 0.5% (the net glide path is steeper than the gross one). The still-air distance is the height above the terrain divided by that gradient, and it is converted to a ground distance with the groundspeed to TAS ratio, so a headwind shortens the glide.

        **Solution**

        Height difference = {{macro1}} ft

        Net gradient = {{macro2}}%

        GS = {{macro3}} kt

        $$
        \frac{\frac{\frac{(\text{altitude}-\text{terrain elevation})\times 100}{\text{gross gradient}+0.5}}{6080}\times (\text{TAS}-\text{headwind})}{\text{TAS}} = \frac{\frac{\frac{({{alt}}-{{elev}})\times 100}{ {{grad}}+0.5}}{6080}\times ({{tas}}-{{hw}})}{ {{tas}} } = \mathbf{ {{answer}}\ \text{NM} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} NM**: still-air distance, the wind correction GS / TAS is not applied.
        - **{{d2}} NM**: the ratio is inverted (TAS / GS), so a headwind wrongly lengthens the glide.
        - **{{d3}} NM**: gross gradient used instead of net, and the ratio is inverted.
        - **{{d4}} NM**: gross gradient used instead of the net gradient.
        - **{{d5}} NM**: the 0.5% is subtracted instead of added, giving a gradient that is too shallow.
