  templates:
    - type: simple
      question: |-
        According to CS-23, determine the minimum VR speed for a Class B twin-engine aeroplane, given:

        - VS: {{vs}} kt
        - VMC: {{vmc}} kt
      explanation: |-
        For a CS-23 Class B twin, the rotation speed VR must not be less than the larger of 1.05 VMC and 1.10 VS.

        **Solution**

        $$
        \text{max}(1.05\times \text{VMC},1.1\times \text{VS}) = \text{max}(1.05\times {{vmc}},1.1\times {{vs}}) = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: applies the 1.10 factor to VMC instead of 1.05.
        - **{{d2}} kt**: applies the 1.05 factor to VS instead of 1.10.
        - **{{d3}} kt**: takes the smaller of the two limits instead of the larger.
        - **{{d4}} kt**: uses 1.2 VS, which is the V2 factor, not the VR minimum.
      presets:
        - variables:
            vs: 76
            vmc: 84
            answer: 88
            d1: 92
            d2: 80
            d3: 84
            d4: 91
          correctAnswers:
