    - type: simple
      question: The wind direction is {{wd}}°(M) and the runway direction is {{rwy}}°(M). With a maximum allowable tailwind component of {{tw}} kt, determine the maximum wind speed for take-off.
      explanation: |-
        The tailwind component is the wind speed multiplied by the cosine of the angle between the wind direction and the runway heading. To find the largest wind speed that keeps the tailwind at its limit, divide the limit by the absolute value of that cosine.

        **Solution**

        Angle between wind and runway = {{macro1}}°

        $$
        \frac{\text{Maximum tailwind component}}{|\text{cos}(\text{Wind direction}-\text{Runway direction})|} = \frac{10}{|\text{cos}({{wd}}-{{rwy}})|} = \mathbf{ {{answer}}\ \text{kt} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kt**: multiplies the limit by the cosine instead of dividing, which gives the tailwind component of a wind as strong as the limit.
        - **{{d2}} kt**: uses the sine (the crosswind relation) instead of the cosine.
        - **{{d3}} kt**: takes the limit itself as the wind speed, ignoring the angle.
      presets:
        - variables:
            wd: 180
            rwy: 60
            tw: 10
            macro1: 120
            answer: 20
            d1: 5
            d2: 11
            d3: 10
