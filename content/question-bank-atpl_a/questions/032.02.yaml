  templates:
    - type: simple
      question: From the screen height of {{sh}} ft, a single-engined piston aeroplane performs a straight-out climb in VMC with an air climb gradient of {{grad}}%, a TAS of {{tas}} kt and a headwind component of {{hw}} kt. What will be the expected height clearance above a group of trees that are {{obst}} m tall and located {{dist}} m from reference zero on the extended runway centre line? (1 ft = 0.3048 m)
      explanation: |-
        The climb gradient is flown through the air, so a headwind steepens the flight path over the ground: the gradient over the ground is the air gradient multiplied by TAS / ground speed. The height at the obstacle is the screen height plus the climb gained over the horizontal distance; the clearance is that height minus the obstacle height.

        **Solution**

        Ground speed = $${{tas}}-{{hw}}$$ = {{macro2}} kt

        Gradient over the ground = $$\frac{ {{grad}}\times {{tas}} }{ {{tas}}-{{hw}} }$$ = {{macro4}} %

        Height gained = $$\frac{\frac{ {{grad}} }{100}\times {{dist}}\times {{tas}} }{ {{tas}}-{{hw}} }$$ = {{macro6}} m

        Clearance = $$50\times 0.3048+\frac{\frac{ {{grad}} }{100}\times {{dist}}\times {{tas}} }{ {{tas}}-{{hw}} }-{{obst}} = \mathbf{ {{answer}}\ \text{m} }$$

        ## Why the other answers are wrong

        - **{{d1}} m**: ignores the wind effect and uses the air gradient directly over the ground.
        - **{{d2}} m**: forgets the screen height ({{sh}} ft) that the climb starts from.
        - **{{d3}} m**: adds the screen height in feet to a result in metres without converting.
