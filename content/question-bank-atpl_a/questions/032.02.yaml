      question: |-
        A single-engined piston aeroplane is flying at an altitude of {{alt}} ft with a constant headwind component of {{hw}} kt. If the engine fails at this altitude, what is the expected net glide distance over the ground to an elevation of {{elev}} ft?

        - L/D: {{ld}}:1
        - TAS: {{tas}} kt

        Assume 1 NM = 6 080 ft and a 0.5 % decrement (net gradient = 100 / (L/D) + 0.5 %).

        Still air distance = (height difference / net gradient) x 100
        Ground distance = still air distance x (GS / TAS)
      explanation: |-
        The glide gradient follows from the lift-to-drag ratio (100 / (L/D) in %), made 0.5 % steeper for the decrement. The still-air distance is the height available divided by this net gradient; a headwind reduces the ground speed, so the ground distance is scaled by GS / TAS.

        **Solution**

        Height difference = {{macro1}} ft

        Net gradient = 100 / {{ld}} + 0.5 = {{macro2}} %

        GS = {{tas}} - {{hw}} = {{macro3}} kt

        $$
        \frac{\frac{\frac{(\text{Altitude}-\text{Terrain elevation})\times 100}{\frac{100}{\text{L/D ratio}}+0.5}}{6080}\times (\text{TAS}-\text{Headwind component})}{\text{TAS}} = \frac{\frac{\frac{({{alt}}-{{elev}})\times 100}{\frac{100}{ {{ld}} }+0.5}}{6080}\times ({{tas}}-{{hw}})}{ {{tas}} } = \mathbf{ {{answer}}\ \text{NM} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} NM**: ignores the headwind (no GS / TAS correction).
        - **{{d2}} NM**: adds the headwind to the TAS as if it were a tailwind.
        - **{{d3}} NM**: omits the 0.5 % decrement.
        - **{{d4}} NM**: uses the full altitude instead of the height above the terrain.
