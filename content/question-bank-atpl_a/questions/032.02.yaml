      question: |-
        Refer to the figure. You are taking off with a single-engined aeroplane at a field-length-limited take-off mass, in VMC, for a straight-out departure. Given the following information, what is the expected obstacle clearance over the obstacle on the extended centre line?

        - Climb gradient: {{gradient}} %
        - TAS: {{tas}} kt
        - Wind component: {{headwind}} kt (positive = headwind, negative = tailwind)

        1 NM = 6080 ft

        The ground distance to the obstacle ({{gd}} NM) and the obstacle height ({{obst}} ft) are the values read from the figure.

        Height gain = ((GD x TAS) / GS) x gradient / 100. Give the obstacle clearance in ft.
      explanation: |-
        The obstacle clearance is the height the aeroplane has gained at the obstacle minus the obstacle height. The climb gradient is flown relative to the air, while the distance to the obstacle is measured over the ground, so the gained height is corrected by TAS/GS.

        **Solution**

        GS = TAS - headwind = {{macro1}} kt

        Height gain = $$\frac{\frac{\text{Ground distance to obstacle (read from the figure)}\times 6080\times \text{Climb gradient}}{100}\times \text{TAS}}{\text{TAS}-\text{Headwind component (negative = tailwind)}}$$ = $$\frac{\frac{ {{gd}}\times 6080\times {{gradient}} }{100}\times {{tas}} }{ {{tas}}-({{headwind}})}$$ = {{macro4}} ft

        Clearance = {{macro4}} ft - {{obst}} ft = **{{answer}} ft**

        ## Why the other answers are wrong

        - **{{d1}} ft**: ignores the wind (uses TAS = GS).
        - **{{d2}} ft**: applies the wind component with the wrong sign when computing GS.
        - **{{d3}} ft**: this is the height gain; the obstacle height was not subtracted.
        - **{{d4}} ft**: uses GS/TAS instead of TAS/GS.
        - **{{d5}} ft**: adds the obstacle height instead of subtracting it.
