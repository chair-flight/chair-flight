  templates:
    - type: simple
      question: |-
        Refer to figure or CAP698 file 4.31.  
        An MRJT aeroplane is landing on runway 25 at an airport which has a long, dry runway with no performance restrictions. The runway has been chosen because of its negligible taxi distance after landing. The planned turnaround time is 25 minutes. Given the following information, is this turnaround time achievable?

        Landing mass: 51 000 kg  
        V**REF**: 132 kt  
        Surface Wind: 070°/6 kt (use 50% of headwind component or 150% of tailwind component as applicable)  
        Airfield Elevation: 280 ft  
        QNH: 1013 hPa  
        OAT: +19°C
      explanation: "In Figure 4.31, enter with the landing mass of 51 000 kg and VREF 132 kt, then the pressure altitude and OAT of 19 °C, then the braking configuration. The brake energy gives a cooling time on the scale below. With reverse #2 detent and autobrake 1 or 2, the cooling time is under 25 minutes, so the turnaround is achievable."
      presets:
        - correctAnswers:
            - text: "Yes, provided reverse #2 detent is used with autobrake #1 or #2."
          wrongAnswers:
            - text: No, reverse thrust cannot be used for credit during landing and most conservative braking must be accounted for, requiring an inspection of the fuse plugs after 30 minutes.
            - text: "Yes, provided reverse #2 detent is used with any autobrake setting."
            - text: "No, reverse thrust cannot be used for credit during landing resulting in a minimum cooling time of approximately 60 minutes for the lowest autobrake settings #1 and #2."
- id: QAKZS
  subjectId: "032"
  chapterId: "032.05"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-322377
    - BGS-321221
  annexes:
    - id: ARMT
  learningObjectiveIds:
    - 032.05.03.01.04
  templates:
    - type: simple
      question: |-
        Refer to figure or to CAP 698 figure 4.31.

        An MRJT (Medium Range Jet Transport) aircraft is performing circuits as part of pilot training.

        So far, 17.6 Million foot-pounds of energy have been absorbed by the brakes, and the pilots now want to make a final landing without any reverse thrust, which shall add a further 10 Million foot-pounds of energy.

        Which of the following is the best procedure to follow?
      explanation: |-
        The brakes would hold 17.6 + 10 = 27.6 million ft-lb after the landing. On Figure 4.31 this is above the limit for landing straight away, so the brakes must be cooled first.

        The chart gives a procedure of flying with the **gear down for 6 minutes** before landing, then parking for at least 60 minutes.
      presets:
        - correctAnswers:
            - text: Fly around with the gear down for 6 minutes, then land. Park the aircraft for at least 60 minutes.
          wrongAnswers:
            - text: Land as soon as required, there is no brake cooling requirement.
            - text: Land, then cool the brakes for no more than 80 minutes before the next take-off.
            - text: Fly around with the gear up for 30 minutes, then land.
