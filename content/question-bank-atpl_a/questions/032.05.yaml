            pa: 2000
            climb_chart: 57900
            answer: 57900
            d1: 53700
            d2: 57000
            d3: 52800
          correctAnswers:
            - text: 57900 kg
          wrongAnswers:
            - text: 52800 kg
            - text: 53700 kg
            - text: 57000 kg
