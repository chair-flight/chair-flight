  templates:
    - type: simple
      question: |-
        During the pre-flight planning procedure, the pilot of a Commercial Air Transport flight has calculated various performance-limited landing masses. Given the following limit masses, determine the maximum performance limited landing mass which complies with the operational requirements.

        - Approach climb limit mass: {{acl}} lb
        - Landing climb limit mass: {{lcl}} lb
        - Field length limit mass: {{fll}} lb
        - Structural limit landing mass: {{slm}} lb
      explanation: |-
        The landing mass must satisfy every limitation at the same time: structural, approach climb, landing climb and field length. The maximum permitted landing mass is therefore the smallest of all the limit masses.

        **Solution**

        $$
        \text{min}(\text{Approach climb limit mass},\text{Landing climb limit mass},\text{Field length limit mass},\text{Structural limit landing mass}) = \text{min}({{acl}},{{lcl}},{{fll}},{{slm}}) = \mathbf{ {{answer}}\ \text{lb} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} lb**: the structural limit only, which ignores the more restrictive performance limits.
        - **{{d2}} lb**: the field length limit only, which is not the smallest limit.
        - **{{d3}} lb**: the landing climb limit only, which is not the smallest limit.
      presets:
