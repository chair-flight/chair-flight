        Refer to the figure or CAP 698 Figure 4.5. Find the climb limited take-off mass for a medium range jet transport (MRJT) aeroplane, given:

        - Airport OAT: {{oat}} °C
        - Airport pressure altitude: {{pa}} ft
        - Take-off flap setting: {{flap}}°
        - Air conditioning packs: off

        What is the climb limited take-off mass?
      explanation: |-
