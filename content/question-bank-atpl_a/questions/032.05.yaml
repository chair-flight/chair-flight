      question: |-
        Refer to the figure (CAP698 figure 4.5).

        Determine the climb limited take-off mass, given: OAT +{{oat}} °C, pressure altitude {{pa}} ft, flaps 5°, A/C pack OFF, anti-icing OFF, PMC OFF.

        Use the value read from the chart.
      explanation: |-
        The climb limited take-off mass is read from the climb limit chart using OAT and pressure altitude for the given flap setting and bleed configuration.

        **Solution**

        The value read from the chart is {{climb_chart}} kg, so the answer is **{{answer}} kg**.

        ## Why the other answers are wrong

        - **{{d1}} kg**: using the chart for packs on or a different flap setting.
        - **{{d2}} kg**: a misread of the temperature curve.
        - **{{d3}} kg**: using the wrong altitude curve.
      presets:
