  templates:
    - type: simple
      question: |-
        Refer to CAP 698 Figure 4.28. Given the following information for a Commercial Air Transport jet aircraft:

        - Landing mass: {{mass}} kg
        - Flaps position: 30°
        - Runway condition: dry
        - Wind component: {{tail}} kt tailwind
        - Pressure altitude: {{pa}} ft
        - Anti-skid: operative
        - Spoilers: automatic

        What is the minimum field length required?
      explanation: |-
        The minimum field length required is read from the landing distance chart in CAP 698 Figure 4.28. The chart uses the landing mass, the flap setting, the runway condition, the wind, the pressure altitude and the braking configuration.

        **Solution**

        - Enter the chart at a landing mass of {{mass}} kg and {{pa}} ft, with a tailwind of {{tail}} kt.
        - The chart gives a minimum field length of 5 725 ft.

        ## Why the other answers are wrong

        - **5 350 ft**: a value read for a lower wind or mass, which gives a shorter field.
        - **8 200 ft**: a value read for a higher altitude or mass, which gives a longer field.
        - **4 700 ft**: far too short, usually from reading the headwind line instead of the tailwind line.
      presets:
        - variables:
            mass: 51000
            tail: 10
            pa: 2000
          correctAnswers:
            - text: 5 725 ft
          wrongAnswers:
            - text: 4 700 ft
            - text: 5 350 ft
            - text: 8 200 ft
