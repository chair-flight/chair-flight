- id: QZOAJ
  subjectId: "032"
  chapterId: "032.05"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-325438
    - AVEXAM-67366
    - BGS-320826
    - BGS-321266
  annexes:
    - id: AKWV
  learningObjectiveIds:
    - 032.05.01.01.05
  templates:
    - type: simple
      question: |-
        Refer to the figure (CAP 698 Figure 4.7). Given the following conditions, at what mass is the maximum take-off mass (MTOM) limited by VMBE?

        - Airfield elevation: {{elev}} ft
        - Slope: {{slope}} % upslope
        - QNH: {{qnh}} hPa
        - OAT: {{oat}} °C
        - V1: {{v1}} kt
        - Headwind: {{headwind}} kt
      explanation: |-
        VMBE is the maximum brake energy speed. The chart shows the mass at which the brake energy limit starts to restrict the take-off mass for the given runway and weather conditions.

        **Solution**

        With an elevation of {{elev}} ft, a {{slope}} % upslope, QNH {{qnh}} hPa, OAT {{oat}} °C, V1 {{v1}} kt and a {{headwind}} kt headwind, the chart gives a VMBE limit only above **68 000 kg**.

        ## Why the other answers are wrong

        - **VMBE can NOT be lower than V1**: VMBE is not compared with V1 this way, so the take-off is not blocked by it.
        - **The same as the maximum structural take-off mass of 62 800 kg**: confuses the VMBE limit with the structural limit.
        - **It cannot be determined**: the chart gives a result for these conditions, so the value can be determined.
      presets:
        - variables:
            elev: 111
            slope: 0.5
            qnh: 1013
            oat: 41
            v1: 149
            headwind: 10
          correctAnswers:
            - text: In excess of 68 000 kg.
          wrongAnswers:
            - text: It cannot be determined.
            - text: VMBE can NOT be lower than V1 thus a take-off can NOT be commenced in these conditions.
            - text: The same as the maximum structural take-off mass of 62 800 kg.
- id: QEPCJ
  subjectId: "032"
  chapterId: "032.05"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-328537
  annexes:
    - id: AKWV
  learningObjectiveIds:
    - 032.05.01.01.05
  templates:
    - type: simple
      question: |-
        Refer to the figure or CAP 4.7. Determine the brake release weight, given:

        - V1: {{v1}} kt
        - Pressure altitude: {{pa}} ft
        - OAT: +{{oat}} °C
        - Runway slope: {{slope}}% up
        - Wind: {{wind}} kt headwind

        What is the brake release weight?
      explanation: |-
        The brake release weight is read from the brake release weight chart. The chart uses the V1 speed, the pressure altitude, the temperature, the runway slope and the wind together.

        **Solution**

        - Enter the chart at V1 {{v1}} kt, pressure altitude {{pa}} ft, OAT +{{oat}} °C, a slope of {{slope}}% up and a headwind of {{wind}} kt.
        - For these conditions the chart gives a weight above the maximum shown, so the answer is an excess of 68 000 kg.

        ## Why the other answers are wrong

        - **The same as the MSTOM 62 800 kg.**: quotes the maximum structural take-off mass instead of the chart reading.
        - **Cannot be determined.**: the chart does give a result for these conditions.
        - **V1 can't be higher than VMBE.**: a speed limit statement that does not answer the weight question.
      presets:
        - variables:
            v1: 149
            pa: 1487
            oat: 19
            slope: 0.5
            wind: 10
          correctAnswers:
            - text: Excess of 68 000 kg.
          wrongAnswers:
            - text: V1 can't be higher than VMBE.
            - text: The same as the MSTOM 62 800 kg.
            - text: Cannot be determined.
