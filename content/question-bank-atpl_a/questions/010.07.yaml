    - type: simple
      question: When does a clearance issued by an ATC unit include the prevention of collision with terrain?
      explanation: |-
        ### ICAO Doc 4444, 2.1 Note 2 and 8.6.5.2

        > Note 2.— The objectives of the air traffic control service as prescribed in Annex 11 **do not include prevention of collision with terrain**. […] When an IFR flight is vectored or is given a direct routing which takes the aircraft off an ATS route, the procedures in Chapter 8, 8.6.5.2 apply.

        > 8.6.5.2 When vectoring an IFR flight and when giving an IFR flight a direct routing which takes the aircraft off an ATS route, the controller shall issue clearances such that **the prescribed obstacle clearance will exist at all times** until the aircraft reaches the point where the pilot will resume own navigation.
