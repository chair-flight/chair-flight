    - ATPLQ-105058
    - AVEXAM-72616
  annexes: []
  learningObjectiveIds:
    - 010.07.01.01.01
  templates:
    - type: simple
      question: What does the term "DANGER AREA" describe?
      explanation: |-
        ### SERA, Article 2, Definitions

        > ‘danger area’ means an airspace of defined dimensions within which activities **dangerous to the flight of aircraft may exist at specified times**;

        Controlled airspace is the airspace in which air traffic control service is provided.
      presets:
        - correctAnswers:
            - text: An airspace of defined dimensions within which activities dangerous to the flight of aircraft may exist at specified times.
          wrongAnswers:
            - text: An airspace of defined dimensions within which air traffic control service is provided to IFR flights and to VFR flights in accordance with the airspace classification.
            - text: An airspace of defined dimensions above the land areas or territorial waters of a State within which flight of aircraft is prohibited.
            - text: An airspace of defined dimensions, above the land areas or territorial waters of a State, within which the flight of aircraft is restricted.
