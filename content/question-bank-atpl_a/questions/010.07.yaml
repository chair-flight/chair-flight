    - 010.07.02.09.04
  templates:
    - type: simple
      question: An aerodrome meteorologist measures the QNH as {{qnh}} hPa. What QNH value will be reported in the METAR or ATIS?
      explanation: |-
        QNH is reported in whole hectopascals, and the value is always truncated (rounded down), never rounded to the nearest value. This way the reported pressure is never higher than the measured one, which keeps the altimeter setting on the safe side.

        **Solution**

        $$
        \text{floor}(\text{measured QNH}) = \text{floor}({{qnh}}) = \mathbf{ {{answer}}\ \text{hPa} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} hPa**: truncates and then subtracts a further hPa for no reason.
        - **{{d2}} hPa**: rounds to the nearest hPa instead of truncating.
        - **{{d3}} hPa**: rounds to the nearest 10 hPa.
      presets:
        - variables:
            qnh: 1006.6
            answer: 1006
            d1: 1005
            d2: 1007
            d3: 1010
          correctAnswers:
            - text: 1006 hPa
          wrongAnswers:
            - text: 1010 hPa
            - text: 1005 hPa
            - text: 1007 hPa
        - variables:
            qnh: 1013.8
            answer: 1013
            d1: 1012
            d2: 1014
            d3: 1010
          correctAnswers:
            - text: 1013 hPa
          wrongAnswers:
            - text: 1010 hPa
            - text: 1012 hPa
            - text: 1014 hPa
        - variables:
            qnh: 998.7
            answer: 998
            d1: 997
            d2: 999
            d3: 1000
          correctAnswers:
            - text: 998 hPa
          wrongAnswers:
            - text: 1000 hPa
