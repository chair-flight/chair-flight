  templates:
    - type: simple
      question: When shall the responsibility for the control of an arriving aircraft be transferred from the unit providing approach control service to the aerodrome control tower?
      explanation: |-
        ### Regulation (EU) 2017/373, ATS.TR.230, Transfer of responsibility for control

        > (3) Between a unit providing approach control service and an aerodrome control tower
        >
        > (i) Arriving aircraft – The responsibility for the control of an arriving aircraft shall be transferred, as specified in letters of agreement and operation manuals, as appropriate, from the unit providing approach control service to the aerodrome control tower when the aircraft is in either of the following states:
        >
        > (A) is **in the vicinity of the aerodrome**, and: (a) it is considered that approach and landing will be completed in visual reference to the ground, or (b) it has **reached uninterrupted VMC**; (B) is at a prescribed point or level; (C) has landed.

        The transition level, the transition altitude, the control zone boundary and the terminal area boundary are not the transfer criteria.
      presets:
        - correctAnswers:
            - text: When the aircraft is in the vicinity of the aerodrome.
          wrongAnswers:
            - text: When this is requested by the aircrew of the aircraft.
            - text: When the aircraft enters the control zone.
            - text: When the aircraft enters the terminal area.
    - type: simple
      question: An aircraft is approaching a controlled airport. Which option describes where, according to ICAO Annex 11, the pilot can expect to be transferred from the unit providing approach control service to the aerodrome control tower? Assume a specific point or level has NOT been prescribed by ATS.
      explanation: |-
        ### Regulation (EU) 2017/373, ATS.TR.230, Transfer of responsibility for control

        > (3) Between a unit providing approach control service and an aerodrome control tower
        >
        > (i) Arriving aircraft – The responsibility for the control of an arriving aircraft shall be transferred, as specified in letters of agreement and operation manuals, as appropriate, from the unit providing approach control service to the aerodrome control tower when the aircraft is in either of the following states:
        >
        > (A) is **in the vicinity of the aerodrome**, and: (a) it is considered that approach and landing will be completed in visual reference to the ground, or (b) it has **reached uninterrupted VMC**; (B) is at a prescribed point or level; (C) has landed.

        The transition level, the transition altitude, the control zone boundary and the terminal area boundary are not the transfer criteria.
      presets:
        - correctAnswers:
            - text: When the pilot is in the vicinity of the aerodrome with uninterrupted VMC.
          wrongAnswers:
            - text: When the pilot of the aircraft is descending below the transition level.
            - text: When the pilot of the aircraft is descending below the transition altitude.
            - text: When the pilot is passing the outer limit of the control zone in IMC conditions.
    - type: simple
      question: When shall the responsibility for the control of an arriving aircraft be transferred from the unit providing approach control service to the aerodrome control tower? Assume a specific point or level has NOT been prescribed by ATS.
      explanation: |-
        ### Regulation (EU) 2017/373, ATS.TR.230, Transfer of responsibility for control

        > (3) Between a unit providing approach control service and an aerodrome control tower
        >
        > (i) Arriving aircraft – The responsibility for the control of an arriving aircraft shall be transferred, as specified in letters of agreement and operation manuals, as appropriate, from the unit providing approach control service to the aerodrome control tower when the aircraft is in either of the following states:
