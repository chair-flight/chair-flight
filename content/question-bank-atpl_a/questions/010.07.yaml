  templates:
    - type: simple
      question: "While in VMC, a B737 is established on an RNP APCH. ATC instructs the B737 pilot to follow and maintain its own separation from a preceding HEAVY B777, which the B737 pilot has already acknowledged they have in-sight. The B737 pilot:"
      explanation: |-
        ### ICAO Doc 4444, 6.5.3.5

        > For successive visual approaches, separation shall be maintained by the controller until the pilot of a succeeding aircraft **reports having the preceding aircraft in sight**. The aircraft shall then be **instructed to follow and maintain own separation** from the preceding aircraft. […] The pilot-in-command of the aircraft concerned shall be **responsible for ensuring that the spacing from a preceding aircraft of a heavier wake turbulence category is acceptable**. If it is determined that additional spacing is required, the flight crew shall inform the ATC unit accordingly, stating their requirements.
      presets:
        - correctAnswers:
            - text: Must ensure that the spacing from the preceding aircraft is acceptable for wake turbulence purposes.
          wrongAnswers:
            - text: Must NOT delay the approach and must maintain high speed until at least 4 NM to touchdown.
            - text: Shall NOT receive a landing clearance, and they will be expected to land after the preceding aircraft vacates the runway.
            - text: Must reduce speed to ensure maximum spacing from the preceding aircraft for wake turbulence purposes.
