      question: The crew of a Boeing 747 on a transoceanic flight have been assigned a speed of Mach 0.76 in order to provide longitudinal separation using the Mach number technique. Suddenly, the aircraft experiences severe turbulence and has to decrease speed. What does the crew have to do, with regards to their longitudinal separation?
      explanation: |-
        ### SERA.8020, Adherence to current flight plan

        > Aircraft subject to the Mach number technique should adhere to the true Mach number approved by ATC and should request ATC approval before making any changes thereto. If it is essential to make an immediate temporary change in the Mach number (e.g. due to **turbulence**), **ATC should be notified as soon as possible** that such a change has been made.
      presets:
        - correctAnswers:
            - text: They must contact ATC to notify them of the change as soon as possible.
          wrongAnswers:
            - text: Reduce Mach number without contacting ATC.
            - text: They can change their Mach number by up to M0.05 without notifying ATC.
            - text: They can reduce their speed immediately as the traffic behind will also have to reduce speed due to turbulence.
