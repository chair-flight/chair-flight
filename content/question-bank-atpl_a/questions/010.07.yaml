    - ATPLQ-101509
  annexes: []
  learningObjectiveIds:
    - 010.07.01.02.02
    - 010.07.01.02.03
  templates:
    - type: definition
      question: According to ICAO Annex 11, what are the three basic types of {term}?
      explanation: |-
        ### ICAO Doc 4444, Chapter 1 Definitions

        > **Air traffic service (ATS).** A generic term meaning variously, flight information service, alerting service, air traffic advisory service, air traffic control service (area control service, approach control service or aerodrome control service).

        The three basic ATS are the air traffic control service, the flight information service and the alerting service. The air traffic control service itself is split into three: area control service, approach control service and aerodrome control service.

        | Term                        | Three basic types                                                         |
        | --------------------------- | ------------------------------------------------------------------------- |
        | Air Traffic Services        | Air traffic control, flight information and alerting services             |
        | Air Traffic Control service | **Area** control, **approach** control and **aerodrome** control services |

        Advisory service and aeronautical information service are not among the basic types.
      options:
        - id: OATS3TYPE1
          term: Air Traffic Services
          definition: Air traffic control service, flight information service, and alerting service.
        - id: OATC3TYPE1
          term: Air Traffic Control services
          definition: Area control service, approach control service, and aerodrome control service.
      fakeOptions:
        - id: FATS3TYPE1
          definition: Area control service, alerting service, and aeronautical information service.
        - id: FATS3TYPE2
          definition: Air traffic control service, flight information service, and advisory service.
