         The transfer of an aircraft from one ATC unit to another is done:
      explanation: |-
        ### Regulation (EU) 2017/373, ATS.TR.230, Transfer of responsibility for control

        > (2) Between a unit providing area control service and a unit providing approach control service or between two units providing approach control service. The responsibility for the control of an aircraft shall be transferred from one unit to another, and vice versa, **at a point or time agreed between the two units**.

        The transfer is agreed between the units. It is not automatic and it does not depend on the pilot's consent.
      presets:
