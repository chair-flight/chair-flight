- id: QFZCF
  subjectId: "010"
  chapterId: "010.07"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-106976
    - AVEXAM-91536
  annexes: []
  learningObjectiveIds:
    - 010.07.02.20.02
  templates:
    - type: simple
      question: What is the definition of an Air Traffic Incident Report?
      explanation: |-
        ### ICAO Doc 4444, 16.3.1

        > An air traffic incident report shall be submitted, normally to the air traffic services unit concerned, for **incidents specifically related to the provision of air traffic services** involving such occurrences as aircraft proximity (AIRPROX), or other serious difficulty resulting in a hazard to aircraft, caused by, among others, faulty procedures, non-compliance with procedures, or failure of ground facilities.
      presets:
        - correctAnswers:
            - text: An air traffic incident report shall be submitted, normally to the air traffic services unit concerned, for incidents specifically related to the provision of air traffic services involving such occurrences as aircraft proximity (AIRPROX), or other serious difficulty resulting in a hazard to aircraft, caused by, among others, faulty procedures, non-compliance with procedures, or failure of ground facilities.
          wrongAnswers:
            - text: A unit established for the purpose of receiving reports concerning air traffic services and flight plans submitted before departure.
            - text: A report from an aircraft in flight prepared in conformity with requirements for position, and operational and/or meteorological reporting.
            - text: An air traffic incident report shall be submitted, normally to the air traffic services unit concerned, for incidents specifically related to the provision of air traffic services involving such occurrences as aircraft proximity (AIRPROX) only.
