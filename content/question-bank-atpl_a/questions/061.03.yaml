        - Latitude of both positions: {{lat}}°N
        - Difference in longitude: {{dlon}}°

        What is the Earth convergency between the two positions?
      explanation: |-
        The Earth convergency between two meridians is the difference in longitude multiplied by the sine of the latitude. Both positions lie on the same parallel, so the convergency depends only on the longitude difference and that latitude.

        **Solution**

