    - type: simple
      question: A pilot is flying from A {{lat}}°S, {{lonw}}°W to B {{lat}}°S, {{lone}}°E. What is the angle between the initial true great circle track and the true rhumb line track?
      explanation: |-
        The angle between the great circle and the rhumb line is half the convergency. The convergency is the longitude difference multiplied by the sine of the latitude. Here the route crosses the date line, so the longitude difference is 360 minus the two longitudes.

        **Solution**

        Longitude difference: 360 - {{lonw}} - {{lone}} = {{macro1}}°

        Angle: $$\frac{360-\text{west longitude of A}-\text{east longitude of B}}{2}\times \text{sin}(\text{latitude}) = \frac{360-{{lonw}}-{{lone}} }{2}\times \text{sin}({{lat}}) = \mathbf{ {{answer}}\ \text{°} }$$

        ## Why the other answers are wrong

        - **{{d1}}°**: the full convergency is used, without halving it.
        - **{{d2}}°**: the latitude factor is forgotten.
        - **{{d3}}°**: the cosine of the latitude is used instead of the sine.
        - **{{d4}}°**: the difference between the two longitudes is used instead of the distance across the date line.
