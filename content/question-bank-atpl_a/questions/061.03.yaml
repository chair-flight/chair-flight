    - type: simple
      question: |-
        Determine the great circle distance between two positions:

        - Position A: {{lat1_d}}°{{lat1_m}}'N, {{lon1_d}}°{{lon1_m}}'E
        - Position B: {{lat2_d}}°{{lat2_m}}'N, {{lon2_d}}°{{lon2_m}}'W

        What is the shortest distance between A and B in NM?
      explanation: |-
        The shortest distance between two positions is the great circle distance. It is the arc of the great circle through both positions, measured along the surface of the Earth. One degree of arc equals 60 NM.

        **Solution**

        Longitude difference between A and B: {{macro1}}°

        $$
        60\times \text{acos}(\text{sin}(\text{Latitude A, degrees}+\frac{\text{Latitude A, minutes}}{60})\times \text{sin}(\text{Latitude B, degrees}+\frac{\text{Latitude B, minutes}}{60})+\text{cos}(\text{Latitude A, degrees}+\frac{\text{Latitude A, minutes}}{60})\times \text{cos}(\text{Latitude B, degrees}+\frac{\text{Latitude B, minutes}}{60})\times \text{cos}(\text{Longitude A, degrees}+\frac{\text{Longitude A, minutes}}{60}+(\text{Longitude B, degrees}+\frac{\text{Longitude B, minutes}}{60}))) = 60\times \text{acos}(\text{sin}({{lat1_d}}+\frac{ {{lat1_m}} }{60})\times \text{sin}({{lat2_d}}+\frac{ {{lat2_m}} }{60})+\text{cos}({{lat1_d}}+\frac{ {{lat1_m}} }{60})\times \text{cos}({{lat2_d}}+\frac{ {{lat2_m}} }{60})\times \text{cos}({{lon1_d}}+\frac{ {{lon1_m}} }{60}+({{lon2_d}}+\frac{ {{lon2_m}} }{60}))) = \mathbf{ {{answer}}\ \text{NM} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} NM**: half of the arc is taken.
        - **{{d2}} NM**: the arc is doubled.
        - **{{d3}} NM**: the distance is converted to kilometres and that figure is written as nautical miles.
        - **{{d4}} NM**: the east-west distance along the mean latitude is used (rhumb line approximation), which is longer than the great circle distance.
