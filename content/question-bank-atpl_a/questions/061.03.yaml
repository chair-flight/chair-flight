      question: |-
        While flying in the northern hemisphere, an aircraft has a VOR RMI reading of {{rmi}}° M to ‘BUB’ VOR. Given the following information, what bearing should be plotted from the VOR to the aircraft on a Mercator chart?

        - Variation at the aircraft: {{var_ac}}°E
        - Variation at the station: {{var_st}}°E
        - Earth convergence between the aircraft and the VOR: {{conv}}°
      explanation: |-
        The RMI reading is the magnetic bearing from the aircraft to the VOR. Reversed, it is the magnetic bearing from the VOR to the aircraft. The VOR station variation converts it to a true bearing. On a Mercator chart a straight line is a rhumb line, which differs from the true bearing by half the convergence.

        **Solution**

        Reciprocal, magnetic bearing from the VOR: {{macro1}}° M

        True bearing with the station variation: {{macro2}}° T

        Adding half the convergence for the Mercator chart: $$\text{RMI reading (magnetic, to the VOR)}-180+\text{Variation at the station}+\frac{\text{Convergence}}{2} = \mathbf{ {{answer}}\ \text{°T} }$$

        ## Why the other answers are wrong

        - **{{d1}} °T**: forgets the convergence correction.
        - **{{d2}} °T**: applies the full convergence instead of half of it.
        - **{{d3}} °T**: uses the variation at the aircraft instead of at the station.
        - **{{d4}} °T**: forgets the variation at the station.
