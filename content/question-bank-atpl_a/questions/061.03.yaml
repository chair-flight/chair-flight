  templates:
    - type: simple
      question: |-
        A pilot flies the great circle (shortest distance) from position X to position Z. Position Z is in the northern hemisphere, and its exact coordinates are not needed. The data are:

        - Initial true track at X: {{trk}}°
        - Convergency between X and Z: {{conv}}°

        What is the final true track at Z?
      explanation: |-
        Convergency is the angle by which the track changes between two positions along a great circle. The final track is the initial track changed by the full convergency. Here the convergency is positive, so it is added to the initial track.

        **Solution**

        - Final true track = initial track + convergency = $$\text{initial true track}+\text{convergency} = {{trk}}+{{conv}} = \mathbf{ {{answer}}\ \text{°} }$$

        ## Why the other answers are wrong

        - **{{d1}}°**: only half the convergency was applied.
        - **{{d2}}°**: half the convergency was subtracted, so the track turned the wrong way.
        - **{{d3}}°**: the convergency was subtracted instead of added.
        - **{{d4}}°**: the convergency was ignored and the initial track was kept.
      presets:
