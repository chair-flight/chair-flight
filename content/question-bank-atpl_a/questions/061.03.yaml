  learningObjectiveIds:
    - 061.03.01.02.01
  templates:
    - type: simple
      question: |-
        An aircraft passes position A on its route to position B. Both positions are on the same latitude:

        - Latitude: {{lat_d}}°{{lat_m}}'N
        - Longitude of A: {{lon_a_d}}°{{lon_a_m}}'W
        - Longitude of B: {{lon_b_d}}°{{lon_b_m}}'W

        What is the great circle track on departure from A in °T?
      explanation: |-
        The great circle track leaves the route at an angle that changes along the way. For two positions on the same latitude, the initial track follows from the longitude difference and the latitude. The result is given from 0 to 360°.

        **Solution**

        Longitude difference: {{macro1}}°

        Track before correction: {{macro2}}°

        $$
        \text{atan2}(\text{sin}(\text{Longitude of A, degrees}+\frac{\text{Longitude of A, minutes}}{60}-(\text{Longitude of B, degrees}+\frac{\text{Longitude of B, minutes}}{60})),\text{sin}(\text{Latitude, degrees}+\frac{\text{Latitude, minutes}}{60})\times (1-\text{cos}(\text{Longitude of A, degrees}+\frac{\text{Longitude of A, minutes}}{60}-(\text{Longitude of B, degrees}+\frac{\text{Longitude of B, minutes}}{60}))))-360\times \text{floor}(\frac{\text{atan2}(\text{sin}(\text{Longitude of A, degrees}+\frac{\text{Longitude of A, minutes}}{60}-(\text{Longitude of B, degrees}+\frac{\text{Longitude of B, minutes}}{60})),\text{sin}(\text{Latitude, degrees}+\frac{\text{Latitude, minutes}}{60})\times (1-\text{cos}(\text{Longitude of A, degrees}+\frac{\text{Longitude of A, minutes}}{60}-(\text{Longitude of B, degrees}+\frac{\text{Longitude of B, minutes}}{60}))))}{360}) = \text{atan2}(\text{sin}({{lon_a_d}}+\frac{ {{lon_a_m}} }{60}-({{lon_b_d}}+\frac{ {{lon_b_m}} }{60})),\text{sin}({{lat_d}}+\frac{0}{60})\times (1-\text{cos}({{lon_a_d}}+\frac{ {{lon_a_m}} }{60}-({{lon_b_d}}+\frac{ {{lon_b_m}} }{60}))))-360\times \text{floor}(\frac{\text{atan2}(\text{sin}({{lon_a_d}}+\frac{ {{lon_a_m}} }{60}-({{lon_b_d}}+\frac{ {{lon_b_m}} }{60})),\text{sin}({{lat_d}}+\frac{0}{60})\times (1-\text{cos}({{lon_a_d}}+\frac{ {{lon_a_m}} }{60}-({{lon_b_d}}+\frac{ {{lon_b_m}} }{60}))))}{360}) = \mathbf{ {{answer}}\ \text{°T} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}°**: due west is assumed instead of the great circle track.
        - **{{d2}}°**: the track is measured from the other side (360° minus the track).
        - **{{d3}}°**: the reciprocal track is used.
        - **{{d4}}°**: the negative angle is not converted to the range 0° to 360°.
      presets:
