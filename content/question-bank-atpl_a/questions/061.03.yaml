        What is the great circle bearing of A from B?
      explanation: |-
        In the Northern Hemisphere the great circle track changes along the route. The bearing back from B to A is the reciprocal of the track at B, and the track at B differs from the track at A by twice the conversion angle.

        **Solution**

        Reciprocal of the bearing: {{gc}}° + 180° = {{macro1}}°

        Add twice the conversion angle: {{macro1}}° + 2 × {{ca}}° = **{{answer}}°**

