        >
        > (d) The task specialist shall **report to the pilot-in-command**: (1) any fault, failure, malfunction or defect, which he/she believes may affect the airworthiness or safe operation of the aircraft, including emergency systems; and (2) any incident that was endangering, or could endanger, the safety of the operation.
