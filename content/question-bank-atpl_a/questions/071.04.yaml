- id: QYQNF
  subjectId: "070"
  chapterId: "071.04"
  relatedQuestionIds:
    - QMAJC
  externalQuestionIds:
    - ATPLQ-705046
    - BGS-711953
    - AVEXAM-30116
  annexes: []
  learningObjectiveIds:
    - 071.04.01.02.01
  templates:
    - type: simple
      question: Consider the applicable operational requirements on task specialists' responsibilities. Task specialists' duties shall be specified...
      explanation: |-
        ### Regulation (EU) No 965/2012, SPO.GEN.106, Task specialists responsibilities

        > (a) The task specialist shall be responsible for the proper execution of his/her duties. Task specialists’ duties shall **be specified in the SOP**. […]
        >
        > (d) The task specialist shall **report to the pilot-in-command**: (1) any fault, failure, malfunction or defect, which he/she believes may affect the airworthiness or safe operation of the aircraft, including emergency systems; and (2) any incident that was endangering, or could endanger, the safety of the operation.
      presets:
        - correctAnswers:
            - text: In the SOPs (Standard Operating Procedures).​​​
          wrongAnswers:
            - text: On the AOC (Air Operator Certificate).
            - text: In the TM (Training Manual).
            - text: In the TSC (Task Specialists' Checklist).
