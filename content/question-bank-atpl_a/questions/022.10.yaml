- id: QNJHO
  subjectId: "022"
  chapterId: "022.10"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-223538
    - AVEXAM-81925
    - BGS-221620
  annexes: []
  learningObjectiveIds:
    - 022.10.01.01.02
  templates:
    - type: simple
      question: You are in the cruise, and approaching a FIR in which CPDLC is available but NOT compulsory. What factors influence whether to use the data link or rely on voice communications?
      explanation: Where CPDLC is available but not compulsory, datalink reduces the chance of misunderstanding and the workload for both pilots and controllers, since messages are displayed in writing.
      presets:
        - correctAnswers:
            - text: Pilot errors and workload are reduced, and ATC workload is reduced, by using datalink communications.
          wrongAnswers:
            - text: Voice communications are more reliable and easier for the controller.
            - text: Short-cuts and direct routings are easier for both pilots and controllers using voice communications.
            - text: In remote areas, with datalink there is a greater risk of being out of range of the current controller WITHOUT being handed over to the next controller.
