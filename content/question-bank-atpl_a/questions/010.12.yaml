    - 010.12.04.01.04
  templates:
    - type: simple
      question: The carriage of weapons on a civil aviation aircraft is only allowed under certain conditions. Which of the following is a condition that permits a weapon to be carried on board?
      explanation: A weapon may be carried only under strict conditions, one being that it is unloaded and stowed where no one can reach it during the flight. Flight crew holding a permit, or officers not notifying the crew, do not meet the conditions.
      presets:
        - correctAnswers:
            - text: When it is unloaded and stowed in a place inaccessible to any person during the flight.
          wrongAnswers:
            - text: When carried by a flight crew member, provided they hold a valid firearms permit.
            - text: When carried by in-flight security-officers without notification to the flight crew.
            - text: When carried by a professional hunter who holds a firearms permit with an ICAO endorsement.
