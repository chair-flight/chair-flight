  templates:
    - type: simple
      question: |-
        According to ICAO Annex 17, to what does the following definition correspond to?

        "An inspection of the interior of an aircraft to which passengers may have had access and an inspection of the hold for the purposes of discovering suspicious objects, weapons, explosives or other dangerous devices, articles and substances."
      explanation: An aircraft security check is an inspection of the interior of an aircraft to which passengers may have had access, and of the hold, to find suspicious objects, weapons, explosives or other dangerous articles.
      presets:
        - correctAnswers:
            - text: Aircraft security check.
          wrongAnswers:
            - text: Aircraft pre-flight check.
            - text: Security control.
            - text: Screening.
- id: QHWSI
  subjectId: "010"
  chapterId: "010.12"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-106000
    - AVEXAM-25779
    - AVEXAM-88811
  annexes: []
  learningObjectiveIds:
    - 010.12.01.01.01
  templates:
    - type: simple
      question: According to ICAO Annex 17, what is the definition of ‘Security Control’?
      explanation: ""
      presets:
        - correctAnswers:
            - text: A means by which the introduction of weapons, explosives or other dangerous devices, articles or substances which may be used to commit an act of unlawful interference can be prevented.
          wrongAnswers:
            - text: A secret or public trial of an aviation security measure which simulates an attempt to commit an unlawful act.
            - text: A check on a person’s identity and previous experience including where legally permissible, any criminal history.
            - text: The application of technical or other means which are intended to identify and/or detect weapons, explosives or other dangerous devices, articles or substances which may be used to commit an act of unlawful interference.
    - type: simple
      question: What is meant by the term 'security control' when referring to (EC) No 300/2008 or ICAO Annex 17?
      explanation: ""
      presets:
        - correctAnswers:
            - text: Security control means the application of means by which the introduction of prohibited articles may be prevented.
          wrongAnswers:
            - text: Security control an examination of the implementation of relevant national civil aviation security programme requirements by an airline, airport, or other entity involved in security.
            - text: Security control means the application of technical or other means which are intended to identify and/or detect prohibited articles.
            - text: Security control means the application of means by which the entry of unauthorised persons or unauthorised vehicles, or both, may be prevented.
