  learningObjectiveIds:
    - 010.12.04.01.01
  templates:
    - type: multiple-correct
      question: For security reasons, what objects listed below shall NOT be introduced, by any means whatsoever, on board an aircraft that is engaged in international civil aviation according to ICAO Annex 17?
      explanation: Weapons whose carriage is not authorised and explosives that may be used for an unlawful act must never be brought on board. Partially charged electronic devices and liquids bought outside the airside zone are not in the prohibited list.
      options:
        - text: Weapons, the carriage of which is NOT authorised.
          correct: true
        - text: Electronic devices with partially charged batteries.
          correct: false
        - text: Explosives that may be used to commit an unlawful act.
          correct: true
        - text: Liquids purchased outside of the airside zone of the aerodrome.
          correct: false
      variants:
        - show:
            - 0
            - 1
            - 2
            - 3
- id: QSHIS
