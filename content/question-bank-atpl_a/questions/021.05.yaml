  templates:
    - type: simple
      question: What is the basic principle of a fully manual flight control system?
      explanation: |-
        In a fully manual flight control system the pilot's inputs reach the control surfaces only through mechanical links (cables, pulleys and pushrods). There is no hydraulic or electrical assistance, so the pilot supplies all the force needed to move the surface and must overcome the aerodynamic loads acting on it.

        The system is therefore reversible: the aerodynamic loads on the surface are felt directly at the cockpit controls, so no artificial feel system is needed. Because those loads grow with airspeed, the control forces are not constant.
      presets:
        - correctAnswers:
            - text: The flight control surfaces are connected to the flight deck controls by means of mechanical links only.
          wrongAnswers:
            - text: The deflection angle of the flight control surface will vary with airspeed, therefore, the flight control forces are constant.
            - text: A fully manual flight control system is an irreversible system because there is no flight deck flight control feedback when a flight control surface is in motion.
            - text: A fully manual flight control system is manually operated by the pilot by means of the flight control elements and is powered by a hydraulic system.
    - type: simple
      question: In a fully manual flight control system, the pilot must exert sufficient force to ..
      explanation: |-
        In a fully manual flight control system the pilot's inputs reach the control surfaces only through mechanical links (cables, pulleys and pushrods). There is no hydraulic or electrical assistance, so the pilot supplies all the force needed to move the surface and must overcome the aerodynamic loads acting on it.

        The system is therefore reversible: the aerodynamic loads on the surface are felt directly at the cockpit controls, so no artificial feel system is needed. Because those loads grow with airspeed, the control forces are not constant.
      presets:
        - correctAnswers:
            - text: overcome the aerodynamic loads felt at the control surface.
          wrongAnswers:
            - text: allow pressure to build up in the flight control actuators.
            - text: separate each pilot's yaw control in the case of a jam.
            - text: activate the artificial feel system.
