      question: What is the function of a flap load limiting (relief) protection system?
      explanation: |-
        Flap load relief (flap load limiting) protects the flaps against excessive aerodynamic loads. If the airspeed exceeds the limit for the selected flap position, the flaps automatically retract, for example when a pressure-relief valve opens under the excessive load, until the load is acceptable again.

        It protects the flaps at their various positions. It does not select flaps to reduce the workload and does not extend them at the correct speeds.
      presets:
        - correctAnswers:
            - text: To retract the flaps when exceeding the limiting speed of the currently selected flap position.
          wrongAnswers:
            - text: To reduce flight deck workload by automatically selecting flaps.
            - text: To increase the aircraft's angle of attack such that the limiting speed of the currently selected flap position is respected.
            - text: To increase the lift of the aeroplane.
