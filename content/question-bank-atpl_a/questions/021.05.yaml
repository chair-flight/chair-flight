  templates:
    - type: one-two
      question: Which of these statements about trimming in an irreversible flight control system of a conventional aeroplane are correct or incorrect?
      explanation: |-
        Trimming moves the zero-force position of the controls, the control position at which the pilot feels no force.

        - **Pitch**: in an aeroplane with a trimmable horizontal stabiliser, trimming moves the stabiliser and not the feel unit. The elevator and the control column stay where they were, so the zero-force position of the control column does not change.
        - **Roll (and yaw)**: in an irreversible system trimming shifts the neutral position of the artificial feel unit. The zero-force position of the control wheel changes.
      pairs:
        - right:
            - The zero force position of the control column does not change when using the pitch trim.
          wrong:
            - The zero force position of the control column changes when using the pitch trim.
        - right:
            - The zero force position of the control wheel changes when using the aileron trim.
          wrong:
            - The zero force position of the control wheel does not change when using the aileron trim.
    - type: one-two
      question: Which of these statements is correct as regards trimming in an irreversible flight control system of a conventional aeroplane equipped with a trimmable horizontal stabiliser?
      explanation: |-
        Trimming moves the zero-force position of the controls, the control position at which the pilot feels no force.

        - **Pitch**: in an aeroplane with a trimmable horizontal stabiliser, trimming moves the stabiliser and not the feel unit. The elevator and the control column stay where they were, so the zero-force position of the control column does not change.
        - **Roll (and yaw)**: in an irreversible system trimming shifts the neutral position of the artificial feel unit. The zero-force position of the control wheel changes.
      pairs:
        - right:
            - The zero force position of the control column does not change when using the pitch trim.
          wrong:
            - The zero force position of the control column changes when using the pitch trim.
        - right:
            - The zero force position of the control wheel changes when using the aileron trim.
          wrong:
            - The zero force position of the control wheel does not change when using the aileron trim.
