        - **Irreversible**: the surface is moved by an actuator, so there is no direct mechanical feedback from the surface to the cockpit controls. A fully powered system is irreversible and needs an artificial feel system to give the pilot control forces. A partially powered system is not fully irreversible, because the pilot still feels part of the aerodynamic load.
