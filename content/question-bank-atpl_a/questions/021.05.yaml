  templates:
    - type: simple
      question: What is the function of the hydraulic control valves in a fully powered flight control system?
      explanation: |-
        In a fully powered flight control system the pilot's input does not move the control surface directly. It moves a control valve, which directs hydraulic pressure to the actuator, and the actuator moves the surface. The valve therefore controls the actuator. It does not move the surface itself and does not reduce a force generated by cables or pushrods.

        Because the actuator carries the aerodynamic load, the pilot feels no feedback from the surface, which is why a fully powered system needs an artificial feel system.
      presets:
        - correctAnswers:
            - text: They act on the actuator of the control surface.
            - text: The control valves control the movement of the hydraulic actuators.
          wrongAnswers:
            - text: They decrease the control force generated by the cables or pushrods.
            - text: They only provide the pilot with an “artificial feel” feedback.
            - text: They directly cause a movement of the control surface.
            - text: Fully powered flight control systems operate actuators without control valves.
            - text: The actuators operate the control valves, which in turn move the control surfaces.
            - text: Control valves convert hydraulic pressure into control column movement.
