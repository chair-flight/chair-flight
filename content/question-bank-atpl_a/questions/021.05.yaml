  templates:
    - type: one-two
      question: Which of these statements about rudder limiting are correct or incorrect?
      explanation: |-
        At high airspeed full rudder deflection would load the fin and the structure excessively, so the available rudder deflection is reduced as the IAS increases.

        - **Rudder ratio changer**: reduces the rudder deflection for a given rudder pedal deflection as the IAS increases. The rudder pedals still move through their full range at all speeds.
        - **Variable stop**: limits the rudder and the rudder pedal travel together as the IAS increases.
        - On powered controls the available force can also be limited by reducing the hydraulic pressure as the IAS increases.
      pairs:
        - right:
            - A rudder ratio changer system reduces the rudder deflection for a given rudder pedal deflection as the IAS increases.
          wrong:
            - A rudder ratio changer system increases the rudder deflection for a given rudder pedal deflection as the IAS increases.
            - A rudder ratio changer system reduces the rudder deflection for a given rudder pedal deflection as the IAS decreases.
        - right:
            - A variable stop system limits both rudder and rudder pedal deflection as the IAS increases.
          wrong:
            - A variable stop system limits neither rudder nor rudder pedal deflection as the IAS increases.
            - A variable stop system limits both rudder and rudder pedal deflection as the IAS decreases.
        - right:
            - With a rudder ratio changer system the rudder pedals move through their full range at all speeds.
          wrong:
            - A rudder ratio changer system limits both rudder and rudder pedal deflection as the IAS increases.
            - A variable stop system reduces the rudder deflection for a given rudder pedal deflection as the IAS increases.
