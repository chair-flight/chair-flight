      question: In a fly-by-wire flight control system, why do critical parameters require multiple sensors?
      explanation: Critical parameters are measured by multiple sensors so that flight control can be maintained after a single sensor failure. The computers compare the sensor values to detect a failed sensor and ignore it.
      presets:
        - correctAnswers:
