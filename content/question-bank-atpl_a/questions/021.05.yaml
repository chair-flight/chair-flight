      explanation: A flap/slat asymmetry protection system compares the left and right flap and slat positions. If it detects an asymmetry it stops any further movement of the surfaces, so the asymmetry cannot grow. It does not compensate for the asymmetry through the FMS, the air data computer or the yaw damper.
      presets:
        - correctAnswers:
            - text: A system which detects flaps and slats position in real time and which prevents any further extension if asymmetry is detected.
