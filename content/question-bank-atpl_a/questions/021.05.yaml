      question: Which of these statements about a Fly-By-Wire (FBW) flight control system are correct or incorrect?
      explanation: |-
        A fly-by-wire system replaces cables, pulleys and pushrods with wiring and computers, which reduces the weight of the system.

        It depends on electrical power and digital circuits, so it is regarded as less reliable than a conventional mechanical system. This is why it needs redundancy in computers, sensors, actuators and power supplies.
      pairs:
        - right:
            - An advantage of a FBW flight control system is the reduced weight of its components in comparison with a conventional flight control system.
          wrong:
            - A FBW flight control system relies on electricity and digital control circuits and it is therefore more reliable than a conventional flight control system.
