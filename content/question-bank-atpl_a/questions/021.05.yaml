  templates:
    - type: simple
      question: A double-pole switch is used to activate the elevator trim..
      explanation: |-
        In an electrically operated pitch trim system a trim runaway is a failure in which the trimmable stabiliser keeps moving towards its stops without being commanded. A double-pole switch needs both of its contacts to close, so a single failed or shorted contact cannot start trim motion. This reduces the probability of a trim runaway.

        The switch does not select the trim rate, does not relate to the number of trim motors and does not arbitrate between the two pilots.
      presets:
        - correctAnswers:
            - text: to reduce the probability of a trim runaway.
          wrongAnswers:
            - text: to allow the use of a slow trim rate at high speed and a high trim rate at low speed.
            - text: because there are two trim motors.
            - text: to prevent both pilots from performing opposite trim inputs.
