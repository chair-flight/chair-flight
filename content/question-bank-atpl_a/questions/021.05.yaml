      explanation: Auto-slats extend automatically when the angle of attack approaches the stall, which delays the stalling angle of attack and improves the stall characteristics during take-off, approach and landing. They retract when the condition no longer exists, which minimises drag.
      presets:
        - correctAnswers:
            - text: It provides improved stall characteristics at high angles of attack during take-off, approach, and landing.
          wrongAnswers:
            - text: It provides for increased endurance during holding operations in icing conditions.
