    - type: one-two
      question: Which of these statements about a gust lock system are correct or incorrect?
      explanation: |-
        A gust lock holds the flight controls and control surfaces in position on the ground so that wind gusts cannot damage them when the aeroplane is parked.

        - Reversible controls, including a fully manual system, transmit the wind loads on the surfaces to the cockpit controls, so they need a gust lock.
        - Irreversible controls hold the surfaces in position through their actuators, and wind on the surface cannot move the control column, so they need no gust lock.
        - A gust lock must never be used in flight. There must be suitable design precautions to prevent flight with the gust lock engaged.
      pairs:
        - right:
            - Reversible flight controls should have a gust lock.
            - There is a need for a gust lock on reversible flight controls.
          wrong:
            - Reversible flight controls should not have a gust lock.
            - There is no need for a gust lock on reversible flight controls.
        - right:
            - There is no need for a gust lock on irreversible flight controls.
          wrong:
            - There is a need for a gust lock on irreversible flight controls.
            - Irreversible flight controls should have a gust lock.
        - right:
            - There is a need for a gust lock on a fully manual flight control system.
            - A fully manual flight control system should have a gust lock.
          wrong:
            - There is no need for a gust lock on a fully manual flight control system.
            - A fully manual flight control system should not have a gust lock.
        - right:
            - There should be suitable design precautions to prevent flight with the gust lock engaged.
          wrong:
            - There should be suitable design precautions to allow flight with the gust lock engaged.
            - There should be unsuitable design precautions to prevent flight with the gust lock engaged.
        - right:
            - A gust lock cannot be used in flight to reduce the effects of turbulence.
          wrong:
            - A gust lock can be used in flight to reduce the effects of turbulence.
            - A gust lock can be used in flight to increase the effects of turbulence.
