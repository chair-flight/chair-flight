  templates:
    - type: simple
      question: How can sufficient control-capability be maintained in case of a malfunction/jam in the flight control system?
      explanation: |-
        Control capability after a malfunction or jam is maintained by redundancy: several actuators, usually on independent hydraulic systems, are coupled to the same control surface. If one actuator fails or jams, the others can still move the surface.

        An actuator-disconnect system lets a jammed or failed actuator be disconnected from the surface so that the remaining ones can move it. Disconnecting all of the actuators, or engaging the autopilot, would not restore control.
      presets:
        - correctAnswers:
            - text: By having multiple actuators coupled to a single flight control surface.
          wrongAnswers:
            - text: By implementing an actuator-disconnect system so that all actuators can be disconnected from the control surface.
            - text: By engaging the autopilot system.
            - text: By coupling more than one flight control surface to a single actuator.
