  templates:
    - type: simple
      question: Which of the following best describes a Monsoon?
      explanation: A monsoon is a seasonal reversal of the large-scale, low-level wind. In summer it blows from the ocean to the continent and in winter from the continent to the ocean.
      presets:
        - correctAnswers:
            - text: During the summer, the large-scale, low-level wind predominantly blows from the ocean towards the continent, but during the winter, it blows from the continent towards the ocean.
          wrongAnswers:
            - text: The winter monsoon is an offshore wind created by a continental low pressure, the summer monsoon is onshore and created by a continental high pressure.
            - text: During the summer, the warm ocean causes large-scale, low-level winds to blow from the landmass to the sea, but in winter, the cooler ocean causes these winds to blow from the sea to the land mass.
            - text: The summer monsoon is predominantly warm and dry blowing towards the sea, the winter monsoon is predominantly cool and moist, and blows towards the land.
