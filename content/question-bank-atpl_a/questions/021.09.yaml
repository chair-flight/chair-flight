    - 021.09.03.02.03
  templates:
    - type: simple
      question: "In order to produce an alternating voltage of {{f}} Hz, the number of pairs of poles required in an AC generator running at {{rpm}} rpm is:"
      explanation: |-
        One electrical cycle is produced for each pair of poles passing a stator winding. Frequency = pole pairs x rpm / 60, so pole pairs = 60 x frequency / rpm.

        **Solution**

        $$
        \frac{60\times \text{Frequency}}{\text{Generator speed}} = \frac{60\times 400}{ {{rpm}} } = \mathbf{ {{answer}}\ \text{pole pairs} }
        $$

        ## Why the other answers are wrong
        - **{{d1}} pole pairs**: uses 120 instead of 60, which gives the number of poles rather than pole pairs.
        - **{{d2}} pole pairs**: inverts the relationship (rpm over frequency).
        - **{{d3}} pole pairs**: uses 30 instead of 60.
        - **{{d4}} pole pairs**: uses 240 instead of 60.
      presets:
        - variables:
            f: 400
            rpm: 6000
            answer: 4
            d1: 8
            d2: 900
            d3: 2
            d4: 16
          correctAnswers:
            - text: 4 pole pairs
          wrongAnswers:
            - text: 8 pole pairs
            - text: 2 pole pairs
            - text: 16 pole pairs
            - text: 900 pole pairs
        - variables:
            f: 400
            rpm: 4000
            answer: 6
            d1: 12
            d2: 600
            d3: 3
            d4: 24
          correctAnswers:
            - text: 6 pole pairs
          wrongAnswers:
            - text: 12 pole pairs
            - text: 3 pole pairs
            - text: 24 pole pairs
            - text: 600 pole pairs
        - variables:
            f: 400
            rpm: 12000
            answer: 2
            d1: 4
            d2: 1800
            d3: 1
            d4: 8
          correctAnswers:
            - text: 2 pole pairs
          wrongAnswers:
            - text: 4 pole pairs
            - text: 1 pole pairs
            - text: 8 pole pairs
            - text: 1800 pole pairs
    - type: simple
      question: In order to produce an alternating voltage of 400 Hz, the RPM required for a 6-pole AC generator is…
      explanation: ""
      presets:
