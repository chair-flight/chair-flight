          definition: Require assistance.
        - id: OSIG2A
          term: X
          definition: Require medical assistance.
        - id: OSIG3A
          term: N
          definition: No or negative.
        - id: OSIG4A
          term: Y
          definition: Yes or affirmative.
        - id: OSIG5A
          term: An arrow pointing in a direction
          definition: Proceeding in this direction.
        - id: OSIG6A
          term: LLL
          definition: Operation completed.
        - id: OSIG7A
          term: LL
          definition: We have found all personnel.
        - id: OSIG8A
          term: ++
          definition: We have found only some personnel.
