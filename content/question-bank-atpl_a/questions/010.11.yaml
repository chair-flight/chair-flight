  templates:
    - type: simple
      question: According to ICAO Annex 12, what does Rescue Coordination Centre mean?
      explanation: |-
        ### Annex 12, 1.1 Definitions

        > **Rescue coordination centre (RCC).** A unit responsible for promoting efficient organization of search and rescue services and for coordinating the conduct of search and rescue operations within a search and rescue region.
      presets:
        - correctAnswers:
            - text: A unit responsible for promoting efficient organisation of search and rescue services and for coordinating the conduct of search and rescue operations within a search and rescue region.
          wrongAnswers:
            - text: A mobile resource composed of trained personnel and provided with equipment suitable for the expeditious conduct of search and rescue operations.
            - text: A unit performing distress monitoring, communication, coordination and search and rescue functions, initial medical assistance or medical evacuation, through the use of public and private resources, including cooperating aircraft, vessels and other craft and installations.
            - text: A unit retrieving persons in distress, providing for their initial medical or other needs, and delivering them to a place of safety.
    - type: simple
      question: The unit responsible for promoting efficient organisation of search and rescue services and for co-ordinating the conduct of search and rescue operations within a search and rescue region is the..
      explanation: |-
        ### Annex 12, 1.1 Definitions

        > **Rescue coordination centre (RCC).** A unit responsible for promoting efficient organization of search and rescue services and for coordinating the conduct of search and rescue operations within a search and rescue region.
      presets:
        - correctAnswers:
            - text: Rescue Co-ordination Centre (RCC).
          wrongAnswers:
            - text: International Alerting Centre (INAC).
            - text: Flight Information Centre (FIC).
            - text: Area Control Centre (ACC).
- id: QIDST
  subjectId: "010"
  chapterId: "010.11"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-106397
    - BGS-100272
    - AVEXAM-33079
    - BGS-101772
    - AVEXAM-62963
  annexes: []
  learningObjectiveIds:
    - 010.11.01.01.01
  templates:
    - type: simple
      question: 'According to ICAO Annex 12, "emergency phase" means:'
      explanation: |-
        ### Annex 12, 1.1 Definitions

        > **Emergency phase.** A generic term meaning, as the case may be, **uncertainty phase, alert phase or distress phase**.
        >
        > **Uncertainty phase.** A situation wherein uncertainty exists as to the safety of an aircraft and its occupants.
        >
        > **Alert phase.** A situation wherein apprehension exists as to the safety of an aircraft and its occupants.
        >
        > **Distress phase.** A situation wherein there is a reasonable certainty that an aircraft and its occupants are threatened by grave and imminent danger and require immediate assistance.
      presets:
        - correctAnswers:
            - text: Uncertainty phase, alert phase, or distress phase.
          wrongAnswers:
            - text: Distress phase only.
            - text: Hazard phase, warning phase, or emergency phase.
            - text: Uncertainty phase only.
