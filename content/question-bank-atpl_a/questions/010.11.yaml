  learningObjectiveIds:
    - 010.11.04.01.02
  templates:
    - type: definition
      question: Which air-to-ground signal means that the ground signals have been understood {term}?
      explanation: |-
        ### Annex 12, Appendix, 3 Air-to-ground signals

        > 3.1 The following signals by aircraft mean that the ground signals have been understood:
        >
        > - a) during the hours of daylight:
        >   - **by rocking the aircraft’s wings**;
        >
        > - b) during the hours of darkness:
        >   - **flashing on and off twice the aircraft’s landing lights or, if not so equipped, by switching on and off twice its navigation lights**.
        >
        > 3.2 Lack of the above signal indicates that the ground signal is not understood.
      options:
        - id: OACKD001
          term: during the hours of daylight
          definition: Rocking the aircraft’s wings.
        - id: OACKN002
          term: during the hours of darkness
          definition: Flashing on and off twice the aircraft’s landing lights or, if not so equipped, switching on and off twice its navigation lights.
      fakeOptions:
        - id: FACK1A
          definition: Circling the ground signals at least once.
        - id: FACK2A
          definition: Overflying the ground signals twice on a North-South heading.
        - id: FACK3A
          definition: Flying over the group of people in difficulty as low as possible.
    - type: definition
      question: "When does this air-to-ground signal mean that the ground signals have been understood: {term}?"
      explanation: |-
        ### Annex 12, Appendix, 3 Air-to-ground signals

        > 3.1 The following signals by aircraft mean that the ground signals have been understood:
        >
        > - a) during the hours of daylight:
        >   - **by rocking the aircraft’s wings**;
        >
        > - b) during the hours of darkness:
        >   - **flashing on and off twice the aircraft’s landing lights or, if not so equipped, by switching on and off twice its navigation lights**.
        >
        > 3.2 Lack of the above signal indicates that the ground signal is not understood.
      options:
        - id: RACKD001
          term: Rocking the aircraft’s wings
          definition: During the hours of daylight.
        - id: RACKN002
          term: Flashing on and off twice the aircraft’s landing lights or, if not so equipped, switching on and off twice its navigation lights
          definition: During the hours of darkness.
      fakeOptions:
        - id: RFACK001
          definition: Never, it means the ground signals have not been understood.
        - id: RFACK002
          definition: Only when the aircraft is below 500 ft.
