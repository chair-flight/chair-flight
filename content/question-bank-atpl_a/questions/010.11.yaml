- id: QNFNM
  subjectId: "010"
  chapterId: "010.11"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-108956
    - BGS-101506
    - ATPLQ-108854
    - AVEXAM-90729
  annexes: []
  learningObjectiveIds:
    - 010.11.03.01.01
  templates:
    - type: simple
      question: If the first aircraft to reach the scene of an accident is not a search and rescue aircraft, what action must it take until the arrival of the first search and rescue aircraft?
      explanation: |-
        ### Annex 12, 5.6 Procedures at the scene of an accident

        > 5.6.2.1 If the first aircraft to reach the scene of an accident is not a search and rescue aircraft, it shall **take charge of on-scene activities of all other aircraft subsequently arriving until the first search and rescue aircraft reaches the scene of the accident**. If, in the meantime, such aircraft is unable to establish communication with the appropriate rescue coordination centre or air traffic services unit, it shall, **by mutual agreement, hand over to an aircraft capable of establishing and maintaining such communications** until the arrival of the first search and rescue aircraft.
      presets:
        - correctAnswers:
            - text: Take charge of on-scene activities of all other arriving aircraft.
          wrongAnswers:
            - text: Remain in the area, overflying the scene of the accident at a height of 1000 ft on a North-South heading.
            - text: Leave the area to avoid hampering subsequent search and rescue activities.
            - text: Overfly the wreckage every 10 minutes, searching for any surface-to-air visual signals.
    - type: simple
      question: |-
        Three aircraft: (1), (2) and (3), arrive successively at ten minute intervals, overhead the scene of a recent aircraft accident.

        (1) is unable to establish contact with the Search and Rescue Centre;   
        (2) is able to contact the Search and Rescue Centre;   
        (3) is a Search and Rescue aircraft.

        The command of the situation is the responsibility of:
      explanation: |-
        ### Annex 12, 5.6 Procedures at the scene of an accident

        > 5.6.2.1 If the first aircraft to reach the scene of an accident is not a search and rescue aircraft, it shall **take charge of on-scene activities of all other aircraft subsequently arriving until the first search and rescue aircraft reaches the scene of the accident**. If, in the meantime, such aircraft is unable to establish communication with the appropriate rescue coordination centre or air traffic services unit, it shall, **by mutual agreement, hand over to an aircraft capable of establishing and maintaining such communications** until the arrival of the first search and rescue aircraft.
      presets:
        - correctAnswers:
            - text: (1), then by mutual consent (2) and then (3).
          wrongAnswers:
            - text: (1) until the completion of operations.
            - text: (1), and then by mutual consent to (3).
            - text: (2), then by mutual consent (3) until the completion of operations.
- id: QCPBS
  subjectId: "010"
  chapterId: "010.11"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-101429
    - AVEXAM-37976
    - BGS-100464
  annexes: []
  learningObjectiveIds:
    - 010.11.03.01.02
  templates:
    - type: simple
      question: Whenever a distress transmission is intercepted by a pilot-in-command of an aircraft, the pilot shall, if feasible...
      explanation: |-
        ### Annex 12, 5.7 Procedures for a pilot-in-command intercepting a distress transmission

        > Whenever a distress transmission is intercepted by a pilot-in-command of an aircraft, the pilot shall, if feasible:
        >
        > - a) **acknowledge the distress transmission**;
        > - b) **record the position of the craft in distress if given**;
        > - c) take a bearing on the transmission;
        > - d) inform the appropriate rescue coordination centre or air traffic services unit of the distress transmission, giving all available information; and
        > - e) at the pilot’s discretion, while awaiting instructions, proceed to the position given in the transmission.
      presets:
        - correctAnswers:
            - text: acknowledge the distress transmission and record the position of the aircraft in distress if given.
          wrongAnswers:
            - text: hold at the position and coordinate the SAR operation.
            - text: record the position of the transmission and proceed according to the flight.
            - text: enter into a holding pattern and wait for instructions.
