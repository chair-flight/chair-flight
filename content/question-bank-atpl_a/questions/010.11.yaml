        > | No. | Message                      | Code symbol                     |
        > | --- | ---------------------------- | ------------------------------- |
        > | 1   | Require assistance           | V                               |
        > | 2   | Require medical assistance   | X                               |
        > | 3   | No or Negative               | N                               |
        > | 4   | Yes or Affirmative           | Y                               |
        > | 5   | Proceeding in this direction | Arrow pointing in the direction |

