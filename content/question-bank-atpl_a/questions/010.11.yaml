- id: QZOVN
  subjectId: "010"
  chapterId: "010.11"
  relatedQuestionIds:
    - QRENU
  externalQuestionIds:
    - ATPLQ-101690
  annexes: []
  learningObjectiveIds:
    - 010.11.02.01.03
  templates:
    - type: simple
      question: How should the Search and Rescue (SAR) regions be defined by the contracting states?
      explanation: |-
        ### Annex 12, 2.2 Search and rescue regions

        > 2.2.1 Contracting States shall delineate the search and rescue regions within which they will provide search and rescue services. Such regions **shall not overlap and neighbouring regions shall be contiguous**.
        >
        > […]
        >
        > Note 2.— The delineation of search and rescue regions is determined on the basis of technical and operational considerations and is **not related to the delineation of boundaries between States**.
      presets:
        - correctAnswers:
            - text: SAR regions shall be next to each other but NOT overlap, and their boundaries can differ from State boundaries.
          wrongAnswers:
            - text: SAR regions can overlap if the extent of the overlapping area has been agreed between States.
            - text: SAR regions shall be next to each other but NOT overlap, and follow the delineation of the boundaries between states.
            - text: SAR regions can overlap whenever it’s more efficient.
