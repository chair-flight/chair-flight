  annexes: []
  learningObjectiveIds:
    - 090.07.01.01.02
  templates:
    - type: simple
      question: You are approaching an ATS reporting point. The controller has instructed you to make routine meteorological reports, the last of which was approximately one hour ago. You experience turbulence, which makes occupants feel strain against the seat belts. As required by the Standardised European Rules of the Air (SERA), you should..
      explanation: ""
      presets:
        - correctAnswers:
            - text: make a special air report and omit the routine report.
          wrongAnswers:
            - text: include the information in the routine report due at the reporting point.
            - text: make the routine report at the reporting point but, since the turbulence is only moderate, it can be excluded from the report.
            - text: include the information in the routine report, which should be made in approximately one hour.
