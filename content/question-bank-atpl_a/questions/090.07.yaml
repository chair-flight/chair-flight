- id: QBBJW
  subjectId: "090"
  chapterId: "090.07"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-908362
    - BGS-900251
    - AVEXAM-33028
  annexes: []
  learningObjectiveIds:
    - 090.07.01.01.02
  templates:
    - type: simple
      question: While crossing a large mountain range, you encounter moderate turbulence. Is there an obligation to report this?
      explanation: ""
      presets:
        - correctAnswers:
            - text: Yes, a special aircraft observation shall be made by air-ground datalink. Where air-ground data link is not available it shall be reported via voice communication.
          wrongAnswers:
            - text: No, pilots are not obliged to report on weather conditions. However, if the conditions could affect the safety of other aircraft the pilot can decide to provide a report via voice communication.
            - text: If an air-ground data link is available, a special aircraft observation must be reported. If only voice communication is available no report should be made, to avoid frequency congestion.
            - text: No. Reporting is obligatory in case of severe turbulence, or in case of severe mountain wave associated with moderate turbulence.
- id: QNIRW
  subjectId: "090"
  chapterId: "090.07"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-929872
    - BGS-900103
    - AVEXAM-7214
