  templates:
    - type: simple
      question: A pilot is flying a scheduled international commercial air transport flight, climbing to FL100\. The aircraft is equipped with all the necessary communication and navigation equipment. Weather conditions at the moment are moderate to severe icing. When shall auto-reports be made?
      explanation: ""
      presets:
        - correctAnswers:
            - text: Required every 30 seconds.
          wrongAnswers:
            - text: These are not required below FL195.
            - text: Required every 15 minutes.
            - text: Not required, but should be made for the first 10 minutes in cruise.
- id: QDQDT
