  learningObjectiveIds:
    - 090.07.01.01.01
  templates:
    - type: simple
      question: A flight is planned to cruise at FL260 to the destination aerodrome, which is 90 minutes away. You are equipped with a VHF radio and a transponder, but you are NOT equipped with data link equipment. Which option is correct about the transmission of routine meteorological observations?
      explanation: ""
      presets:
        - correctAnswers:
            - text: You are exempted for this aircraft, so NO reports of this kind are required.
          wrongAnswers:
            - text: You must report every 15 minutes in the en route phase of the flight.
            - text: This is the correct method for reporting severe weather such as thunderstorm with hail.
            - text: You must report 1 hour after your departure.
    - type: simple
      question: You intend to cruise at FL 60 to your destination aerodrome, which requires 90 minutes of flight time. You are equipped with a VHF radio and a transponder, but you are NOT equipped with data link. Which option is correct about the transmission of routine meteorological observations?
      explanation: ""
      presets:
        - correctAnswers:
            - text: You are exempted for this aircraft, so NO reports of this kind are required.
          wrongAnswers:
            - text: You must report 1 hour after your departure.
            - text: You must report every 15 minutes in the en route phase of the flight.
            - text: This is the correct method for reporting severe weather such as thunderstorm with hail.
    - type: simple
      question: An aircraft operating at FL260 on a 90-minute flight to its destination is equipped with a VHF radio and a transponder, but not with data link capability. Under these circumstances, what is the correct procedure for transmitting routine meteorological observations?
      explanation: ""
      presets:
        - correctAnswers:
            - text: You are exempted for this aircraft, so NO reports of this kind are required.
          wrongAnswers:
            - text: You must report 1 hour after your departure.
            - text: This is the correct method for reporting severe weather such as thunderstorm with hail.
            - text: You must report every 15 minutes in the en route phase of the flight.
