  learningObjectiveIds:
    - 010.10.02.03.02
  templates:
    - type: simple
      question: Unaccompanied baggage to be carried by air shall be cleared under the procedures applicable for..
      explanation: Unaccompanied baggage is cleared under the procedures that apply to accompanied baggage, or under another simplified customs procedure distinct from the one for cargo.
      presets:
        - correctAnswers:
            - text: accompanied baggage, or under another simplified customs procedure distinct from that normally applied to cargo.
          wrongAnswers:
            - text: cargo when covered by a traffic document.
            - text: cargo but shall be not subject to any kind of declaration forms.
            - text: cargo but the requested customs clearance documents provided by airlines shall be completed by the passenger prior to shipment.
