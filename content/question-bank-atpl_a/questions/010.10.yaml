  annexes: []
  learningObjectiveIds:
    - 010.10.02.03.01
  templates:
    - type: simple
      question: When a passenger and their luggage arrive at an aerodrome, in ICAO Annex 9 provisions request the State to…
      explanation: Annex 9 asks States to adopt border control regulations suited to air transport and to avoid unnecessary delay, without giving priority by ticket class.
      presets:
        - correctAnswers:
            - text: Adopt border control regulations appropriate to the air transport environment and prevent unnecessary delays.
          wrongAnswers:
            - text: Give passengers with first class tickets priority over other passengers for their inspections as well as their luggage.
            - text: Perform at least a double border control. For security reasons, the delays caused by these measures have NO limitation.
            - text: Prevent any delays for passengers due to the increase of the border and luggage controls.
