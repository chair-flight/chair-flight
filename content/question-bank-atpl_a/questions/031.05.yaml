  templates:
    - type: simple
      question: The mass of an aircraft is {{mass}} kg and {{added}} kg of freight is added to a hold {{dist}} m aft of the present CG position. By how many metres does the CG move aft?
      explanation: |-
        Adding a mass at a distance from the CG shifts the CG towards it by the added moment divided by the new total mass.

        **Solution**

        $$\frac{\text{Added freight}\times \text{Distance of hold aft of CG}}{\text{Aircraft mass}+\text{Added freight}} = \frac{ {{added}}\times {{dist}} }{ {{mass}}+{{added}} } = \mathbf{ {{answer}}\ \text{m} }$$ aft

        ## Why the other answers are wrong

        - **{{d1}} m**: the added mass is not included in the new total mass.
        - **{{d2}} m**: the added mass is subtracted instead of added.
        - **{{d3}} m**: the wrong mass is used in the numerator.
        - **{{d4}} m**: the CG moves in the wrong direction (forward instead of aft).
      presets:
        - variables:
            mass: 2000
            added: 400
            dist: 2
            answer: 0.33
            d1: 0.4
            d2: 0.5
            d3: 1.67
            d4: -0.33
          correctAnswers:
            - text: 0.33 m
          wrongAnswers:
            - text: 0.4 m
            - text: 1.67 m
            - text: -0.33 m
            - text: 0.5 m
        - variables:
            mass: 1800
            added: 300
            dist: 2.5
            answer: 0.36
            d1: 0.42
            d2: 0.5
            d3: 2.14
            d4: -0.36
          correctAnswers:
