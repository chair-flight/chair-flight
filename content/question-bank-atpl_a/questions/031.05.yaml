      question: |-
        During the pre-flight, the pilot assumed that the only passenger weighing 170 lb would sit at the front-row seat (located 85 inches aft of datum).

        The calculations gave a Take-Off Mass of 4100 lb and a take-off CG located at 94 inches aft of datum.

