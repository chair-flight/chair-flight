- id: QUDAV
  subjectId: "031"
  chapterId: "031.05"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-312573
    - AVEXAM-65028
  annexes:
    - id: AVKK
  learningObjectiveIds:
    - 031.05.01.01.01
  templates:
    - type: simple
      question: |-
        Refer to figure or CAP 696 Figure 2.5. During dispatch you perform mass and balance calculations. Given the following information, what is the zero fuel mass CG position, in inches aft of the datum?

        - Basic empty mass: {{bem}} lb
        - Basic empty mass moment: {{bemm}} in·lb
        - Front seat occupant: {{fm}} lb, arm {{fa}} in
        - Aft seat occupant: {{am}} lb, arm {{aa}} in
        - Block fuel: {{fuel}} lb, arm {{fuela}} in

        Disregard start-up and taxi fuel.
      explanation: |-
        The zero fuel mass (ZFM) is the basic empty mass plus the payload, without fuel. The ZFM CG is the sum of the moments divided by the ZFM.

        **Solution**

        ZFM = {{macro1}} lb; moment = {{macro2}} in·lb

        $$
        \frac{\text{BEM moment}+\text{Front seat occupant mass}\times \text{Front seat arm}+\text{Aft seat occupant mass}\times \text{Aft seat arm}}{\text{Basic empty mass}+\text{Front seat occupant mass}+\text{Aft seat occupant mass}} = \frac{ {{bemm}}+{{fm}}\times {{fa}}+{{am}}\times {{aa}} }{ {{bem}}+{{fm}}+{{am}} } = \mathbf{ {{answer}}\ \text{in} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} in**: includes the fuel, which gives the take-off (ramp) CG instead of the ZFM CG.
        - **{{d2}} in**: includes the fuel mass in the divisor but not its moment.
        - **{{d3}} in**: leaves out the aft seat occupant.
        - **{{d4}} in**: takes the plain average of the seat arms.
      presets:
