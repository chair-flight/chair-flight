  templates:
    - type: simple
      question: |-
        You are operating a light aircraft for humanitarian operations.

        Today, you will transport food parcels of {{parcel}} kg each, stored in the cargo bay with a CG of {{arm}} m aft of the datum line.

        Before loading the cargo, the total mass of the aircraft is {{mass}} kg and its CG is {{cg}} m aft of the datum line.

        To be within the aft CG limit of {{lim}} m, what is the maximum number of food parcels you can load today?
      explanation: |-
        Loading cargo moves the CG towards the cargo arm. Setting the new CG equal to the aft limit, (mass × CG + m × arm) / (mass + m) = limit, gives the maximum cargo mass m. The number of parcels must be a whole number, so it is rounded down.

        **Solution**

        m = mass × (limit - CG) / (arm - limit) = {{macro1}} kg

        Number of parcels = {{macro1}} / {{parcel}} = {{macro2}} → **{{answer}} parcels**

        ## Why the other answers are wrong

        - **{{d1}} parcels**: rounds the result up, which would put the CG beyond the aft limit.
        - **{{d2}} parcels**: rounds down and then removes one parcel unnecessarily.
        - **{{d3}} parcels**: rounds down and then removes two parcels unnecessarily.
