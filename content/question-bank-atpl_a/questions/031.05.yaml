  templates:
    - type: simple
      question: |-
        Determine the Dry Operating Index (DOI) of the aircraft, given:

        - BEM: {{bem}} kg
        - CG at BEM: {{cg_bem}} inches aft of datum
        - 2 crew members: {{crew}} kg
        - Crew seats: {{crew_arm}} inches aft of datum

        DOI = (mass (kg) x CG (inches) / 5000) - 30
      explanation: |-
        The DOI uses the total moment (BEM moment plus crew moment) of the aircraft, divided by 5000 and reduced by a constant of 30. Each item contributes mass times its own arm.

        **Solution**

        Total moment = {{macro1}} kg.in

        $$
        \frac{\text{BEM}\times \text{CG at BEM}+\text{Crew mass}\times \text{Crew seat arm}}{5000}-30 = \frac{ {{bem}}\times {{cg_bem}}+{{crew}}\times {{crew_arm}} }{5000}-30 = \mathbf{ {{answer}} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} **: the crew is not included.
        - **{{d2}} **: the constant of 30 is not subtracted.
        - **{{d3}} **: the crew mass is placed at the BEM CG instead of at the crew seat arm.
        - **{{d4}} **: the crew moment is subtracted instead of added.
      presets:
