  templates:
    - type: simple
      question: |-
        The total mass of an aeroplane is {{m}} kg with the CG at {{cg}} m aft of the datum.

        The CG limits are between {{fwd}} m and {{aft}} m aft of the datum.

        How much mass must be removed from the rear hold ({{arm}} m aft of the datum) to move the CG to the middle of the limits?
      explanation: |-
        The target CG is the mid-point of the limits. Removing mass x at the hold arm moves the CG: m x cg - x x arm = (m - x) x target, so x = m x (cg - target) / (arm - target).

        **Solution**

        Target CG = {{macro1}} m

