  templates:
    - type: simple
      question: The Basic Empty Mass (BEM) of a light aircraft used for aerial photography is {{bem}} lb and its Centre of Gravity is located {{cg}} inches aft of datum. What will be the new CG of the BEM, if a camera which weighs {{cam}} lb is installed {{arm}} in aft of datum?
      explanation: |-
        Installing equipment changes both the mass and the total moment. The new CG is the new total moment divided by the new total mass.

        **Solution**

        New mass = {{bem}} + {{cam}} = {{macro1}} lb

        New moment = {{bem}} x {{cg}} + {{cam}} x {{arm}} = {{macro2}} lb in

        $$
        \frac{\text{BEM}\times \text{BEM CG}+\text{Camera mass}\times \text{Camera arm}}{\text{BEM}+\text{Camera mass}} = \frac{ {{bem}}\times {{cg}}+{{cam}}\times {{arm}} }{ {{bem}}+{{cam}} } = \mathbf{ {{answer}}\ \text{in} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} in**: the moment of the camera was added but its mass was not included in the divisor.
        - **{{d2}} in**: the camera moment was subtracted instead of added.
        - **{{d3}} in**: the camera moment was subtracted and its mass was left out of the divisor.
      presets:
        - variables:
            bem: 2415
            cg: 77.7
            cam: 190
            arm: 108
            macro1: 2605
            macro2: 208165.5
            answer: 79.9
            d1: 86.2
            d2: 64.2
            d3: 69.2
          correctAnswers:
