  templates:
    - type: simple
      question: |-
        A loaded aircraft has its centre of gravity (CG) {{cg}} inches aft of the datum, and its mass is {{mass}} lb.

        A last minute load of {{add}} lb is placed on board {{fwd}} inches forward of the datum.

        Determine the new position of the CG, in inches aft of the datum.
      explanation: |-
        The new CG is the total moment divided by the new total mass. A mass placed forward of the datum has a negative arm, so it reduces the total moment.

        **Solution**

        $$
        \frac{\text{Aircraft mass}\times \text{CG position}-\text{Added mass}\times \text{Distance of added mass forward of datum}}{\text{Aircraft mass}+\text{Added mass}} = \frac{ {{mass}}\times {{cg}}-{{add}}\times {{fwd}} }{ {{mass}}+{{add}} } = \mathbf{ {{answer}}\ \text{in aft of the datum} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} in**: the added moment is added instead of subtracted (arm treated as aft of the datum).
        - **{{d2}} in**: the added mass is left out of the total mass.
        - **{{d3}} in**: the added mass is subtracted from the total mass.
        - **{{d4}} in**: the arm is subtracted from the CG instead of computing moments.
      presets:
        - variables:
            cg: 35
            mass: 4500
            add: 334
            fwd: 20
            answer: 31.2
            d1: 34
            d2: 33.5
            d3: 36.2
            d4: 15
          correctAnswers:
            - text: 31.2 in
          wrongAnswers:
