        - **{{d1}} kg**: Moves the CG to the aft limit instead of the middle.
        - **{{d2}} kg**: Moves the CG to the forward limit instead of the middle.
        - **{{d3}} kg**: Divides by the hold arm instead of its distance from the target CG.
        - **{{d4}} kg**: Uses the distance from the hold to the current CG instead of the target.
