      question: |-
        Refer to figure. Using the graph, and given the following parameters, what is the loaded Centre of Gravity (in m) of this aircraft?

        - BEM: {{bem}} kg
        - BEM CG: {{bem_cg}} m
        - Front pax: {{front}} kg
        - Rear pax: {{rear}} kg
        - Fuel: {{fuel}} kg

        The total moment of front pax, rear pax and fuel read from the graph is {{load_moment}} kg.m (value read from the figure).
      explanation: |-
        The loaded CG is the total moment divided by the total mass. The moment of each load is read from the graph (mass versus moment), and the BEM moment is BEM times BEM CG.

        **Solution**

        Total mass = {{macro1}} kg

        Total moment = {{macro2}} kg.m

        CG = total moment / total mass = **{{answer}} m**

        ## Why the other answers are wrong

        - **{{d1}} m**: the BEM CG is given as the answer; the loads are ignored.
        - **{{d2}} m**: the load moment is forgotten but the load mass is added.
        - **{{d3}} m**: the load mass is not added to the total mass.
        - **{{d4}} m**: the fuel mass is forgotten in the total mass.
