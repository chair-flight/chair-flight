        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: divides by the distance from the old CG instead of from the new CG.
        - **{{d2}} kg**: subtracts the CG shift from the load arm instead of the new CG.
        - **{{d3}} kg**: divides by the new CG value instead of by the lever arm to the new CG.
