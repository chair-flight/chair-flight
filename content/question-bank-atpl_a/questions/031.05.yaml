  templates:
    - type: simple
      question: |-
        You are departing for a flight with a planned landing fuel of {{lf}} kg. According to aircraft limitations, the centre tank fuel must be used prior to the wing tank fuel. Given the following information, the location of the CG on landing will be how many metres aft of the datum?

        - Maximum Take-Off Mass: {{mtom}} kg
        - Actual Take-Off Mass: {{tom}} kg
        - Take-off CG location: {{cg}} m aft of the datum
        - Fuel in centre tank at take-off: {{c}} kg
        - Fuel in wing tanks at take-off: {{w}} kg
        - Centre fuel tank centroid: {{carm}} m aft of the datum
        - Wing fuel tank centroid: {{warm}} m aft of the datum
      explanation: |-
        The landing CG follows from the moment balance: take-off moment minus the moments of the fuel burned, divided by the landing mass. Centre-tank fuel is burned first, so all of it is gone and the rest comes from the wing tanks.

        **Solution**

        Fuel burned = {{macro1}} kg (centre {{c}} kg, wing {{macro2}} kg)
        Landing mass = {{macro3}} kg
        Landing moment = {{macro4}} kg·m
        Landing CG = {{macro4}} / {{macro3}} = **{{answer}} m**

        ## Why the other answers are wrong

        - **{{d1}} m**: Burns the wing tank fuel first, leaving centre tank fuel at landing.
        - **{{d2}} m**: Is the unchanged take-off CG.
        - **{{d3}} m**: Treats the burned fuel as taken from the mean of both tank centroids.
        - **{{d4}} m**: Divides the landing moment by the take-off mass instead of the landing mass.
