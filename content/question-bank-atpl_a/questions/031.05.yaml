        Moving a mass over a distance changes the total moment, so the CG moves by (mass moved x distance) / total mass. Rearranged, the mass to move equals the total mass times the required CG shift divided by the distance over which it is moved.

        **Solution**

        $$
        \frac{\text{Take-off mass}\times |\text{Target CG position}-\text{Current CG position}|}{\text{Distance the mass is moved}} = \frac{ {{tom}}\times |{{cg_tgt}}-{{cg_cur}}|}{ {{dist}} } = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: the CG shift is divided by twice the distance moved.
        - **{{d2}} kg**: the distance moved is wrongly added to the current CG position.
        - **{{d3}} kg**: the CG shift is multiplied by the distance instead of divided.
        - **{{d4}} kg**: the CG shift is wrongly subtracted from the distance moved.
