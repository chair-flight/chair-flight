  templates:
    - type: simple
      question: |-
        Refer to the figure (index chart). Given the following indexes and masses, determine the take-off CG position as % MAC.

        - Dry operating index and mass: {{doi}} and {{dom}} kg
        - Passenger load index and mass: {{pi}} and {{pm}} kg
        - Cargo load index and mass: {{ci}} and {{cm}} kg
        - Take-off fuel index and mass: {{fi}} and {{fm}} kg

        The total index is the sum of the four indices. The CG in % MAC read from the chart at the total mass and total index is {{cgchart}}%.
      explanation: |-
        The total index is the sum of the dry operating index and the load indices. The total mass and the total index are then entered in the index chart of the load sheet, from which the CG in % MAC is read.

        **Solution**

        Total index = $$\text{Dry operating index}+3.141593+\text{Cargo index}+\text{Take-off fuel index}$$ = $${{doi}}+3.141593+{{ci}}+{{fi}}$$ = {{macro3}}

        Total mass = {{macro4}} kg

        CG read from the chart at this mass and index: **{{answer}} % MAC**

        ## Why the other answers are wrong

        - **{{d1}} % MAC**: the total index is mistaken for the CG position.
        - **{{d2}} % MAC**: the chart is misread (point read too far forward).
        - **{{d3}} % MAC**: the chart is misread (point read too far aft).
        - **{{d4}} % MAC**: the chart is misread by a large amount.
