  templates:
    - type: simple
      question: |-
        An aircraft has its datum at the nose.

        The front seats are 65 inches aft of datum, the passenger seats are 105 inches aft and the separate baggage compartment is 145 inches aft.

        The aft CG limit is {{limit}} inches aft.

        The current mass is {{mass}} lb.

        Three passengers are in the rear seats, with the baggage compartment full, and the front seat is empty.

        In this situation the CG is {{excess}} inches behind the aft limit.

        Ignoring maximum mass limits, how much extra ballast, in lb, must be secured in the front seat (arm {{arm}} inches) to bring the CG to the aft limit?
      explanation: |-
        Adding ballast m at the front seat arm moves the CG forward. The new CG must equal the aft limit: (M * (limit + excess) + m * arm) / (M + m) = limit, which gives m = M * excess / (limit - arm).

        **Solution**

        $$\frac{\text{Current mass}\times \text{CG excess behind the aft limit}}{\text{Aft CG limit}-\text{Front seat arm}}$$ = $$\frac{ {{mass}}\times 3}{ {{limit}}-65}$$ = {{macro3}} lb, rounded: **{{answer}} lb**

        ## Why the other answers are wrong

        - **{{d1}} lb**: divides by the distance from the front seat to the current (out-of-limit) CG instead of to the limit.
        - **{{d2}} lb**: divides by the arm of the seat instead of the lever arm to the limit.
        - **{{d3}} lb**: divides by the aft limit instead of the lever arm.
        - **{{d4}} lb**: uses the lever arm to a point forward of the limit.
