  templates:
    - type: simple
      question: A loaded aircraft has its Centre of Gravity (CG) {{cg}} inches forward of the datum, and its mass is {{mass}} lb. If a last minute load of {{add}} lb is added {{arm}} inches aft of the datum, what is the new position of the CG?
      explanation: |-
        The new CG is the total moment divided by the total mass. Taking distances aft of the datum as positive, a CG forward of the datum has a negative arm, so the initial moment is negative. A negative result means the CG is still forward of the datum.

        **Solution**

        Initial moment = -{{cg}} × {{mass}} = {{macro1}} lb·in
        Added moment = {{arm}} × {{add}} = {{macro2}} lb·in
        New mass = {{mass}} + {{add}} = {{macro3}} lb

        New CG = {{macro4}} / {{macro3}} = {{macro5}} in, i.e. **{{answer}} inches forward of the datum**

        ## Why the other answers are wrong

        - **{{d1}} inches**: ignores the moment of the added load.
        - **{{d2}} inches**: uses the arm of the added load times the mass ratio as the shift and forgets to subtract the original CG position.
        - **{{d3}} inches**: divides the moment change by the original mass instead of the new mass.
        - **{{d4}} inches**: adds the two moments with the same sign, ignoring that the original CG is forward of the datum.
      presets:
