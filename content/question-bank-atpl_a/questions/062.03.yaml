  templates:
    - type: simple
      question: What are Airborne weather radars generally based on?
      explanation: "Airborne weather radar is a primary radar: it uses the echo reflected from raindrops, not a transponder reply. It operates at about 9 GHz, a wavelength of about 3 cm, which is in the SHF band and is reflected well by water droplets."
      presets:
        - correctAnswers:
            - text: The use of primary radar with a frequency of 9 GHz.
          wrongAnswers:
            - text: The use of secondary radar with a frequency of 9 GHz.
            - text: The use of secondary radar with a frequency of 9 MHz.
            - text: The use of primary radar with a wavelength of 9 mm.
