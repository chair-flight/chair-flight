- id: QVMJP
  subjectId: "062"
  chapterId: "062.03"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-625191
    - BGS-621195
    - AVEXAM-52895
  annexes: []
  learningObjectiveIds:
    - 062.03.03.05.02
  templates:
    - type: simple
      question: |-
        An aircraft flying at a given altitude uses its weather radar to find the top of a cloud. Given:

        - Aircraft altitude: {{alt}} ft
        - Distance to the cloud: {{dist}} NM
        - Tilt angle at which the cloud disappears: {{tilt}}°
        - Beam width: {{beam}}°

        At what altitude is the top of the cloud, in ft?
      explanation: |-
        The radar beam is a narrow cone, and its lower edge is half a beam width below the tilt angle. The top of the cloud lies on that lower edge. At 60 NM, one degree of angle is about one NM of height, so the height of the cloud top above the aircraft is the distance divided by 60, times the angle, times 6076 ft per NM. The answer is rounded to the nearest 100 ft.

        **Solution**

        - Angle to the cloud top: {{tilt}}° minus half of {{beam}}° = {{macro1}}°
        - $$\text{round}(\frac{\text{Aircraft altitude}+\frac{\text{Distance to the cloud}}{60}\times (\text{Tilt angle}-\frac{\text{Beam width}}{2})\times 6076}{100})\times 100 = \text{round}(\frac{ {{alt}}+\frac{ {{dist}} }{60}\times ({{tilt}}-\frac{ {{beam}} }{2})\times 6076}{100})\times 100 = \mathbf{ {{answer}}\ \text{ft} }$$

        ## Why the other answers are wrong

        - **{{d1}} ft**: uses the full tilt angle instead of the tilt minus half the beam width.
        - **{{d2}} ft**: uses the tilt plus half the beam width, the upper edge of the beam.
        - **{{d3}} ft**: ignores the tilt angle and gives only the aircraft altitude.
        - **{{d4}} ft**: doubles the height gained above the aircraft.
      presets:
        - variables:
            alt: 12000
            dist: 120
            tilt: 3.5
            beam: 5
            macro1: 1
            answer: 24200
            d1: 54500
            d2: 84900
            d3: 12000
            d4: 36300
          correctAnswers:
            - text: 24200 ft
          wrongAnswers:
            - text: 54500 ft
            - text: 12000 ft
            - text: 36300 ft
            - text: 84900 ft
        - variables:
            alt: 9000
            dist: 90
            tilt: 4
            beam: 5
            macro1: 2
            answer: 22700
            d1: 45500
            d2: 68200
            d3: 9000
            d4: 36300
          correctAnswers:
            - text: 22700 ft
          wrongAnswers:
            - text: 45500 ft
            - text: 9000 ft
            - text: 36300 ft
            - text: 68200 ft
        - variables:
            alt: 6000
            dist: 60
            tilt: 3
            beam: 4
            macro1: 1
            answer: 12100
            d1: 24200
            d2: 36400
            d3: 6000
            d4: 18200
          correctAnswers:
            - text: 12100 ft
          wrongAnswers:
            - text: 24200 ft
            - text: 6000 ft
            - text: 18200 ft
            - text: 36400 ft
