      question: The flight crew of a large jet transport aeroplane are expecting to encounter icing conditions during the flight. Is it important for the crew to keep their eye reference positions aligned throughout the flight?
      explanation: In icing conditions the crew use visual cues such as ice building up on the windshield frame or on probes. These must be in the primary field of view, so the crew keep their eyes at the design eye reference position.
      presets:
        - correctAnswers:
            - text: Yes. If possible, visual icing cues should be within the crew's primary field of view.
          wrongAnswers:
