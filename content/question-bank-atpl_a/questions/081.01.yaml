        What is its lift coefficient (CL) as a percentage of the maximum lift coefficient (CLMAX)?
      explanation: |-
        The lift needed is always the weight, so the faster the aeroplane flies, the less CL it needs. Lift depends on speed squared, so CL compared with CLMAX (reached at the stall speed VS) is the square of the speed ratio VS / V.

        **Solution**

        - CL / CLMAX = (VS / V) ^ 2 = 1 / {{v}} ^ 2
        - As a percentage: $$\frac{100}{{\text{Speed}}^{2}} = \frac{100}{ {{v}}^{2}} = \mathbf{ {{answer}}\ \text{%} }$$

        ## Why the other answers are wrong

        - **{{d1}}%**: uses the speed multiple once instead of squaring it.
        - **{{d2}}%**: squares the speed instead of its inverse, giving a value above 100 %.
        - **{{d3}}%**: uses the square root of the speed multiple instead of its square.
        - **{{d4}}%**: multiplies the speed multiple by 100 instead of dividing by its square.
