        - **{{d1}}**: uses the speed ratio once instead of squaring it.
        - **{{d2}}**: inverts the speed ratio, so CL appears to fall when the speed drops.
        - **{{d3}}**: inverts the speed ratio and squares it, so CL falls instead of rising.
        - **{{d4}}**: cubes the speed ratio instead of squaring it.
