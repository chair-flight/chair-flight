  templates:
    - type: simple
      question: |-
        A light aircraft is flying straight and level:

        - Speed: {{speed}} kt
        - CL: {{cl}}

        The pilot immediately pulls into a climb with a load factor of {{n}} g. What is the new CL?
      explanation: |-
        The speed stays the same, so the lift needed for the manoeuvre is the load factor times the weight. The lift coefficient therefore rises in the same proportion as the load factor, and the new CL is the initial CL multiplied by the load factor.

        **Solution**

        - $$\text{Initial CL}\times \text{Load factor} = {{cl}}\times {{n}} = \mathbf{ {{answer}} }$$

        ## Why the other answers are wrong

        - **{{d1}}**: divides instead of multiplies, as if the load factor reduced the lift.
        - **{{d2}}**: keeps the original CL and ignores the extra load.
        - **{{d3}}**: squares the load factor.
        - **{{d4}}**: uses only the extra load (load factor minus 1) and ignores the weight already carried.
      presets:
        - variables:
            speed: 110
            cl: 0.42
            n: 2.2
            answer: 0.92
            d1: 0.19
            d2: 0.42
            d3: 2.03
            d4: 0.5
          correctAnswers:
