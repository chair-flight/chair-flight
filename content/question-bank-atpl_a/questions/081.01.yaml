        - Lift coefficient (CL): {{cl1}}

        ATC asks you to reduce speed to {{v2}} kt.

        What is the new CL needed to stay in straight and level flight?
      explanation: |-
        Lift must still equal weight. Lift grows with speed squared times CL, so for the same weight a lower speed needs a higher CL. The CL needed scales with the square of the speed ratio.

        **Solution**

        $$
        \text{Initial CL}\times {\frac{\text{Initial speed}}{\text{New speed}}}^{2} = {{cl1}}\times {\frac{ {{v1}} }{ {{v2}} }}^{2} = \mathbf{ {{answer}} }
