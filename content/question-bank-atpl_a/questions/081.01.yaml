    - type: simple
      question: |-
        Which of these statements about the strength of wing tip vortices are correct or incorrect?

        I. Assuming no flow separation, {{first}}.
        II. {{second}}.
      explanation: "Wing tip vortices are a by-product of lift: the pressure difference between the lower and upper surface drives air round the tip. Before flow separation, a higher angle of attack increases that pressure difference and strengthens the vortices, so statements that the strength is unaffected by, or decreases with, angle of attack are incorrect. A lower aspect ratio (short span for the chord) makes the tip flow affect a larger share of the wing, so the vortices become stronger as aspect ratio decreases and weaker as it increases; the strength is therefore affected by aspect ratio."
