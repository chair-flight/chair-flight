      question: Which statements about wingtip vortex strength are correct?
      explanation: Before separation, raising angle of attack increases circulation and typically strengthens the tip vortices. For a like-for-like comparison at the same lift, a greater span spreads the circulation and reduces induced effects. Aspect ratio alone is insufficient to predict vortex strength without specifying what is held fixed.
      pairs:
