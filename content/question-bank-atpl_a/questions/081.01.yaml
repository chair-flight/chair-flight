  learningObjectiveIds:
    - 081.01.04.03.11
  templates:
    - type: simple
      question: |-
        An aeroplane is in level flight. Given:

        - Lift coefficient (CL): {{cl}}
        - Induced drag coefficient (CDi): {{cdi}}

        The aeroplane slows down, keeping level flight, and the lift coefficient increases by a factor of {{f}} to maintain lift. There is no change in configuration.

        What is the new CDi?
      explanation: |-
        The induced drag coefficient is proportional to the square of the lift coefficient. When the lift coefficient increases by a factor, the induced drag coefficient increases by the square of that factor, provided the configuration does not change.

        **Solution**

        The new lift coefficient is {{macro1}}, but the induced drag coefficient depends on its square. Starting from a CDi of {{cdi}}:

        $$
        \text{Induced drag coefficient}\times {\text{Increase factor of CL}}^{2} = {{cdi}}\times {{f}}^{2} = \mathbf{ {{answer}} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}**: uses the factor once instead of squaring it.
        - **{{d2}}**: divides by the factor instead of multiplying, so CDi would fall when CL rises.
        - **{{d3}}**: raises the factor to the power of three.
        - **{{d4}}**: multiplies by CL as well, which is not part of the relationship.
      presets:
        - variables:
            cl: 0.6
            cdi: 0.1
            f: 1.5
            macro1: 0.9
            answer: 0.225
            d1: 0.15
            d2: 0.067
            d3: 0.338
            d4: 0.09
          correctAnswers:
            - text: "0.225 "
          wrongAnswers:
