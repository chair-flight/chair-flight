  templates:
    - type: simple
      question: While performing a take-off under icing conditions, the pilot rotates the aircraft at the correct speed and rate, but notices that the aircraft does NOT lift off as expected. What could be the cause?
      explanation: ""
      presets:
        - correctAnswers:
            - text: The angle of attack during rotation exceeds the lower, icing-induced critical angle of attack, preventing the aircraft from becoming airborne.
          wrongAnswers:
            - text: The rotation speed is too fast, significantly increasing drag and preventing the aircraft to lift off.
            - text: Ice can distort the flow of air over the wing, increasing the angle of attack for maximum lift and significantly increasing drag.
            - text: The rotation rate is too fast, increasing the critical angle of attack and preventing the aircraft to lift off.
