- id: QDSOR
  subjectId: "081"
  chapterId: "081.01"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-812776
  annexes: []
  learningObjectiveIds:
    - 081.01.01.01.01
  templates:
    - type: simple
      question: |-
        A rate of climb is given in feet per minute. Convert it to metres per second (1 ft = 0.3048 m).

        - Rate of climb: {{fpm}} ft/min

        What is this rate in m/s?
      explanation: |-
        Convert the feet to metres (1 ft = 0.3048 m) and the minutes to seconds (divide by 60).

        **Solution**

        $$
        \frac{\text{Rate of climb}\times 0.3048}{60} = \frac{ {{fpm}}\times 0.3048}{60} = \mathbf{ {{answer}}\ \text{m/s} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} m/s**: halves the rate instead of converting it.
        - **{{d2}} m/s**: forgets to convert feet to metres.
        - **{{d3}} m/s**: applies the metre conversion twice.
        - **{{d4}} m/s**: stops after the metre conversion, so the result is in metres per minute.
      presets:
        - variables:
            fpm: 470
            answer: 2.4
            d1: 235
            d2: 7.8
            d3: 0.7
            d4: 143.3
          correctAnswers:
            - text: 2.4 m/s
          wrongAnswers:
            - text: 235 m/s
            - text: 0.7 m/s
            - text: 143.3 m/s
            - text: 7.8 m/s
        - variables:
            fpm: 1000
            answer: 5.1
            d1: 500
            d2: 16.7
            d3: 1.5
            d4: 304.8
          correctAnswers:
            - text: 5.1 m/s
          wrongAnswers:
            - text: 500 m/s
            - text: 1.5 m/s
            - text: 304.8 m/s
            - text: 16.7 m/s
