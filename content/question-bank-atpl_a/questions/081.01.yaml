  templates:
    - type: simple
      question: Whilst maintaining straight and level flight with a lift coefficient CL of {{cl}}, what will be the new approximate value of CL after the speed is increased by {{pct}}%?
      explanation: |-
        In level flight the lift equals the weight, so the lift coefficient falls with the square of the speed. Increasing the speed by a given percentage multiplies the speed by (1 + percentage / 100), so the CL is divided by that factor squared.

        **Solution**

        - New speed = {{macro1}} times the old speed
        - New CL = old CL / (speed factor)²
        - $$\frac{\text{Initial CL}}{{(1+\frac{\text{Speed increase}}{100})}^{2}} = \frac{1}{{(1+\frac{ {{pct}} }{100})}^{2}} = \mathbf{ {{answer}} }$$

        ## Why the other answers are wrong

        - **{{d1}}**: subtracts the speed increase instead of dividing by the speed factor.
        - **{{d2}}**: divides by the speed factor once, not squared.
        - **{{d3}}**: divides by the speed factor cubed.
        - **{{d4}}**: multiplies by the squared factor, so the CL increases with the speed.
      presets:
