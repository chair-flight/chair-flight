            f: 2
            macro1: 0.8
            answer: 0.2
            d1: 0.1
            d2: 0.025
            d3: 0.4
            d4: 0.04
          correctAnswers:
            - text: "0.2 "
          wrongAnswers:
            - text: "0.1 "
            - text: "0.4 "
            - text: "0.04 "
            - text: "0.025 "
        - variables:
            cl: 0.5
