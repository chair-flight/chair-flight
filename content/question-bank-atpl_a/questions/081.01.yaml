  templates:
    - type: simple
      question: |-
        Calculate the coefficient of lift for an aircraft in straight and level flight, in clean configuration, flying at its stall speed (VS).

        - Density: {{rho}} kg/m³
        - TAS at the stall speed: {{tas}} kt
        - Mass: {{mass}} kg
        - Wing area: {{area}} m²
        - g: {{g}} m/s²
      explanation: |-
        In level flight the lift equals the weight. The lift coefficient follows from the lift equation, which uses the air density, the speed squared and the wing area. The speed must be in metres per second, so the knots are converted with 1 kt = 0.514444 m/s.

        **Solution**

        The speed in metres per second is {{macro1}} m/s.

        $$
        \frac{2\times \text{Mass}\times \text{Gravity}}{\text{Density}\times {(\text{TAS}\times 0.514444)}^{2}\times \text{Wing area}} = \frac{2\times {{mass}}\times {{g}} }{1.225\times {({{tas}}\times 0.514444)}^{2}\times {{area}} } = \mathbf{ {{answer}} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}**: leaves out the factor of 2 from the lift equation.
        - **{{d2}}**: uses the speed once instead of squaring it.
        - **{{d3}}**: leaves out the wing area.
        - **{{d4}}**: uses the speed in knots without converting it to metres per second.
      presets:
