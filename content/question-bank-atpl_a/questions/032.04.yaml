  templates:
    - type: simple
      question: |-
        The aeroplane, for which data are provided by the Buffet Onset Boundary Chart, is 
        flying at FL350 through the tropics in the late afternoon. Ahead of the aeroplane is 
        an extended line of thunderstorms. If the 1.4 g buffet range is Mach 0.79 to 0.81, 
        which of the following answers is the most appropriate operational decision?

        ![Buffet onset boundary chart](annex:APIJ:editable)
      explanation: |-
        At FL350 the 1.4 g buffet range of Mach 0.79 to 0.81 corresponds to a mass of about 128 t. The band is very narrow, so little manoeuvre or turbulence margin is left near thunderstorms.

        Descending to FL330 with the same mass and 1.4 g widens the band to roughly Mach 0.73 to above Mach 0.84.

        ![Buffet onset boundary chart](annex:buffet:md:editable)

        {{wrong-answers-table}}
      presets:
        - correctAnswers:
            - text: Descend to FL330 where the 1.4 g buffet margin is Mach 0.73 to greater than Mach 0.84 and navigate laterally between the thunderstorm cells.
          wrongAnswers:
            - text: Navigate laterally between the thunderstorm cells, limiting the angle of bank to no more than 30°, which will ensure a buffet margin of Mach 0.67 to greater than Mach 0.84.
              mistake: A 30° bank is 1.15 g, which does give a wide band at FL350, but turbulence near thunderstorms can push the load factor well past that, back towards the narrow 1.4 g band.
            - text: Continue as planned because the threat of stall has already been mitigated against by using the 1.4 g buffet margin.
              mistake: A 1.4 g band of only Mach 0.79 to 0.81 at FL350 is a very small margin, so the threat has not been mitigated.
            - text: Navigate laterally between the thunderstorm cells, ensuring straight and level flight at a load factor of 1, which will ensure a buffet margin of Mach 0.62 to greater than Mach 0.84.
              mistake: The 1 g band is wider, but straight and level flight cannot be assured while weaving through thunderstorm cells.
