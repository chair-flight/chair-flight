        Given a tailwind component of {{tw}} kt, what is the maximum mass on brake release (choosing the best flap angle)? Give the mass in kg.
      explanation: |-
        For each flap setting the maximum mass on brake release is the lower of the runway limitation and the 2nd segment climb limitation. The tailwind correction reduces the runway-limited mass only. The best flap angle is the one with the highest resulting mass.

        **Solution**

        Runway limit corrected for wind: flap 5 = {{macro1}} kg, flap 15 = {{macro2}} kg, flap 25 = {{macro3}} kg

        Maximum mass per flap (lower of the two limits): flap 5 = {{macro4}} kg, flap 15 = {{macro5}} kg, flap 25 = {{macro6}} kg

        Best value: **{{answer}} kg**

        ## Why the other answers are wrong

        - **{{d1}} kg**: ignores the tailwind correction.
        - **{{d2}} kg**: takes only the 2nd segment limitation and ignores the runway limit.
        - **{{d3}} kg**: applies the wind correction to the best runway limit but ignores the 2nd segment limit.
        - **{{d4}} kg**: also applies the wind correction to the 2nd segment climb limitation.
