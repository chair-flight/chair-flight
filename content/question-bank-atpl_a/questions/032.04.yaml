  learningObjectiveIds:
    - 032.04.01.08.04
  templates:
    - type: simple
      question: |-
        Given that the characteristics of a three engined turbojet aeroplane are as follows:

        - Thrust = {{thrust}} N per engine
        - g = {{g}} m/s²
        - Drag = {{drag}} N
        - Minimum steady gradient of climb (2nd segment) = {{grad}}%

        sin(angle of climb) = (Thrust - Drag) / Weight

        The Maximum Take-Off Mass under the 2nd segment conditions is (kg):
      explanation: |-
        The second-segment climb gradient requirement applies with one engine inoperative, so only the thrust of the remaining engines is used. With sin(angle) = (Thrust - Drag) / Weight, the maximum weight is (Thrust - Drag) divided by the gradient, and the mass is the weight divided by g.

        **Solution**

        Thrust (two engines) = {{macro1}} N

        $$
        \frac{\frac{2\times \text{Thrust per engine}-\text{Drag}}{\frac{\text{Required gradient}}{100}}}{g} = \frac{\frac{2\times {{thrust}}-{{drag}} }{\frac{ {{grad}} }{100}} }{10} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: uses the thrust of all three engines instead of two.
        - **{{d2}} kg**: multiplies the excess thrust by the gradient instead of dividing, and does not divide by g.
        - **{{d3}} kg**: uses all three engines and multiplies by the gradient instead of dividing.
      presets:
