        Taking into account both the regulation and obstacle clearance, what is the minimum gross gradient required before commencing the turn?
      explanation: |-
        For a two-engine aeroplane the regulatory gross gradient in the second segment is 2.4%, and the net gradient is the gross gradient reduced by 0.8%. The gross gradient needed is therefore the larger of the regulatory value (2.4%) and the obstacle requirement (net gradient + 0.8%), and the decrement for the turn is added on top.

        **Solution**

        Obstacle: {{macro1}}% gross is needed, regulation: 2.4% gross, so the larger value applies.

        $$
        \text{max}(2.4,\text{net gradient required for obstacle}+0.8)+\text{turn decrement} = \text{max}(2.4,{{net_obst}}+0.8)+{{turn_dec}} = \mathbf{ {{answer}}\ \text{%} }
        $$

        ## Why the other answers are wrong

        - **{{d1}}%**: obstacle gradient converted to gross but the turn decrement is forgotten.
        - **{{d2}}%**: adds the regulatory 2.4% and the 0.8% net/gross difference together, double counting.
        - **{{d3}}%**: uses only the regulatory gradient plus the turn decrement and ignores the obstacle requirement.
        - **{{d4}}%**: adds the turn decrement to the net obstacle gradient without converting net to gross.
      presets:
        - variables:
            net_obst: 2
            turn_dec: 0.5
            macro1: 2.8
            answer: 3.3
            d1: 2.8
            d2: 3.7
            d3: 2.9
            d4: 2.5
          correctAnswers:
            - text: 3.3 %
          wrongAnswers:
            - text: 2.8 %
            - text: 2.9 %
            - text: 2.5 %
            - text: 3.7 %
        - variables:
            net_obst: 2.5
            turn_dec: 0.3
            macro1: 3.3
            answer: 3.6
            d1: 3.3
            d2: 3.5
            d3: 2.7
            d4: 2.8
          correctAnswers:
            - text: 3.6 %
          wrongAnswers:
            - text: 3.3 %
            - text: 2.7 %
            - text: 2.8 %
            - text: 3.5 %
        - variables:
            net_obst: 2.3
            turn_dec: 0.6
            macro1: 3.1
            answer: 3.7
            d1: 3.1
            d2: 3.8
            d3: 3
            d4: 2.9
          correctAnswers:
