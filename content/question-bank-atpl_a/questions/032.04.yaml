    - 032.04.01.09.03
  templates:
    - type: simple
      question: |-
        On a segment of the take-off flight path an obstacle requires a minimum climb gradient of {{g_req}} % in order to provide an adequate margin of safe clearance.

        At a mass of {{m_ref}} kg the climb gradient is {{g_ref}} %.

        For the same power and assuming that the sine of the angle of climb varies inversely with mass, at what maximum mass will the aeroplane be able to achieve the minimum gradient?

        Give the mass in kg.
      explanation: |-
        For the same power, the sine of the climb angle is inversely proportional to mass: mass x sin(angle) is constant. The gradient is tan(angle), so the angle is found with atan and then its sine is used.

        **Solution**

        Maximum mass = $$\frac{\text{Reference mass}\times \text{sin}(\text{atan}(\frac{\text{Gradient at reference mass}}{100}))}{\text{sin}(\text{atan}(\frac{\text{Required gradient}}{100}))} = \frac{ {{m_ref}}\times \text{sin}(\text{atan}(\frac{ {{g_ref}} }{100}))}{\text{sin}(\text{atan}(\frac{ {{g_req}} }{100}))} = \mathbf{ {{answer}}\ \text{kg} }$$

        ## Why the other answers are wrong

        - **{{d1}} kg**: inverted ratio (a lower mass would give a higher gradient, not a lower one).
        - **{{d2}} kg**: adds the gradient difference linearly instead of using the inverse proportionality.
        - **{{d3}} kg**: squares the inverted ratio.
        - **{{d4}} kg**: uses the sum of the gradients in the ratio.
        - **{{d5}} kg**: adds a fixed margin on top of the simple ratio.
