    - BGS-330393
    - BGS-330419
  annexes: []
  learningObjectiveIds:
    - 033.04.03.01.02
  templates:
    - type: simple
      question: |-
        Given:

        - Distance from departure to destination: {{dist}} NM
        - GS out: {{gsout}} kt
        - GS home: {{gsback}} kt

        What is the distance of the PET from the departure point?
      explanation: |-
        The Point of Equal Time (PET) is the point from which it takes the same time to continue to the destination as to return to the departure point. Because the ground speeds differ in the two directions, the PET lies closer to the leg with the lower ground speed, so the distance to the PET is weighted by the ground speed home.

        **Solution**

        $$
        \frac{\text{Total distance}\times \text{Ground speed home}}{\text{Ground speed out}+\text{Ground speed home}} = \frac{ {{dist}}\times {{gsback}} }{ {{gsout}}+{{gsback}} } = \mathbf{ {{answer}}\ \text{NM} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} NM**: uses the ground speed out in the numerator, which gives the distance from the destination instead of from the departure point.
        - **{{d2}} NM**: takes the half-way point, which is only the PET when the ground speeds out and home are equal.
        - **{{d3}} NM**: inverts the speed ratio (out over home).
        - **{{d4}} NM**: inverts the speed ratio (home over out) and ignores the sum of the speeds in the denominator.
      presets:
        - variables:
            dist: 435
            gsout: 110
            gsback: 130
            answer: 236
            d1: 199
