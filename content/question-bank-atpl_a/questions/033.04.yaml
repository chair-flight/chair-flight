  annexes: []
  learningObjectiveIds:
    - 033.04.02.02.06
  templates:
    - type: simple
      question: |-
        Given the following information for a Commercial Air Transport flight, what is the time (in minutes) needed from the destination to the alternate aerodrome? Assume an operation with a Performance Class A aeroplane applying the Basic Fuel Scheme or with a helicopter (the basic fuel planning provisions are the same).

        - Missed approach at the destination: {{missed}} min
        - Climb to cruise level: {{climb}} min
        - Cruise distance: {{dist}} NM
        - Cruise TAS: {{tas}} kt
        - Wind component: {{wind}} kt (positive = tailwind, negative = headwind)
        - Anticipated hold at the alternate: {{hold}} min
        - Descent to the alternate: {{descent}} min
        - Approach to the alternate: {{approach}} min
      explanation: |-
        The time from the destination to the alternate is the sum of the manoeuvre times at both aerodromes and the time flown on the cruise leg. The cruise time is the distance divided by the ground speed, and the ground speed is the TAS plus any tailwind (minus any headwind).

        **Solution**

        Cruise time: $$\frac{\text{Cruise distance}}{\text{Cruise TAS}+\text{Tailwind component}}\times 60 = \frac{ {{dist}} }{ {{tas}}+({{wind}})}\times 60$$ min

        Total: $$\text{Missed approach}+\text{Climb}+\frac{\text{Cruise distance}}{\text{Cruise TAS}+\text{Tailwind component}}\times 60+\text{Holding at alternate}+\text{Descent}+\text{Approach} = {{missed}}+{{climb}}+\frac{ {{dist}} }{ {{tas}}+({{wind}})}\times 60+{{hold}}+{{descent}}+{{approach}} = \mathbf{ {{answer}}\ \text{min} }$$

        ## Why the other answers are wrong
        - **{{d1}} min**: ignores the wind component.
        - **{{d2}} min**: reverses the sign of the wind component.
        - **{{d3}} min**: leaves out the holding time at the alternate.
        - **{{d4}} min**: adds the cruise time in hours instead of converting it to minutes.
