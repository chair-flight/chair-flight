- id: QAFKR
  subjectId: "033"
  chapterId: "033.04"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-338613
    - BGS-330258
    - AVEXAM-2056
  annexes:
    - id: AQSF
  learningObjectiveIds:
    - 033.04.02.02.01
  templates:
    - type: simple
      question: |-
        Refer to figure or CAP697 file 4.3.1C. For a flight of {{distance}} nautical ground miles the following apply:

        - Head wind component: {{wind}} kt
        - Temperature: ISA {{temp_dev}}°C
        - Trip fuel available: {{trip_fuel}} kg
        - Landing mass: {{landing_mass}} kg

        What is the minimum cruise level pressure altitude which may be planned?
      explanation: |-
        The minimum cruise level is read from the chart. It depends on the distance, the headwind, the temperature, the trip fuel available and the landing mass together.

        **Solution**

        - Enter the chart at {{distance}} nautical miles, a headwind of {{wind}} kt, ISA {{temp_dev}}°C, {{trip_fuel}} kg of trip fuel and a landing mass of {{landing_mass}} kg.
        - The lowest level that still meets these conditions is **17000 ft**.

        ## Why the other answers are wrong

        - **10000 ft**: too low for the trip fuel to cover the distance.
        - **14000 ft**: too low for these conditions.
        - **22000 ft**: above the minimum, so it is not the minimum cruise level.
      presets:
        - variables:
            distance: 1900
            wind: 10
            temp_dev: -5
            trip_fuel: 15000
            landing_mass: 50000
          correctAnswers:
            - text: 17000 ft
          wrongAnswers:
            - text: 22000 ft
            - text: 10000 ft
            - text: 14000 ft
- id: QDONP
  subjectId: "033"
  chapterId: "033.04"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-338572
    - BGS-331463
  annexes:
    - id: AWOY
  learningObjectiveIds:
    - 033.04.02.02.03
  templates:
    - type: simple
      question: |-
        Refer to figure. After the pre-flight preparation, the flight plan log shown in the annex was completed, taking into account the meteorological conditions for the scheduled Estimated Time of Departure at 07:30 UTC. Due to the passage of a cold front, a delay of 3 hours is expected.

        Use the following values:

        - Distance from WPT B to WPT C (read from figure): {{leg_distance}} NM
        - Time from WPT B to WPT C (read from figure): {{leg_time}} min

        What is the revised groundspeed between WPT B and WPT C, in knots?
      explanation: |-
        The groundspeed is the distance covered over the ground divided by the time taken. The time is in minutes, so the distance is first multiplied by 60 to put the result in knots.

        **Solution**

        - Groundspeed: $$\frac{\text{Distance from WPT B to WPT C (read from figure)}\times 60}{\text{Time from WPT B to WPT C (read from figure)}} = \frac{ {{leg_distance}}\times 60}{ {{leg_time}} } = \mathbf{ {{answer}}\ \text{knots} }$$

        ## Why the other answers are wrong

        - **{{d1}} knots**: multiplies by the time instead of dividing by it, which mixes up the two values.
        - **{{d2}} knots**: forgets to convert minutes into hours.
        - **{{d3}} knots**: adds 6 minutes to the time by mistake.
        - **{{d4}} knots**: converts the speed into kilometres per hour, which is not needed.
      presets:
        - variables:
            leg_distance: 62
            leg_time: 24
            answer: 155
