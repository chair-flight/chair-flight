  learningObjectiveIds:
    - 033.04.02.05.01
  templates:
    - type: simple
      question: |-
        Given the following information, and taking into account that the fuel was initially calculated with no wind, determine the updated trip fuel for the flight (in kg).

        - Trip fuel (no wind): {{trip0}} kg
        - Flight time (no wind): {{t0}} hours
        - Distance: {{dist}} NM
        - Headwind: {{hw}} kt
      explanation: |-
        With no wind the groundspeed is the distance divided by the flight time. With a headwind the groundspeed is reduced by the headwind, so the flight time increases by the ratio distance / (distance minus headwind times the time without wind). The trip fuel scales with the flight time, so the updated trip fuel is the original trip fuel multiplied by that ratio.

        **Solution**

        Groundspeed without wind = {{macro1}} kt

        $$
        \frac{\text{Trip fuel (no wind)}\times \text{Distance}}{\text{Distance}-\text{Headwind}\times \text{Flight time (no wind)}} = \frac{ {{trip0}}\times {{dist}} }{ {{dist}}-{{hw}}\times 2} = \mathbf{ {{answer}}\ \text{kg} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: keeps the original trip fuel and does not update it for the headwind.
        - **{{d2}} kg**: adds the headwind instead of subtracting it.
        - **{{d3}} kg**: uses the ratio of the wrong way round, so the trip fuel is reduced.
        - **{{d4}} kg**: adds the headwind as a percentage of the distance, which is not a valid time correction.
      presets:
        - variables:
            trip0: 2000
            t0: 2
            dist: 240
            hw: 20
            macro1: 120
            answer: 2400
            d1: 2000
            d2: 1714
            d3: 1667
            d4: 2167
          correctAnswers:
            - text: 2400 kg
          wrongAnswers:
