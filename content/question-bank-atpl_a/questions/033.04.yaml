  learningObjectiveIds:
    - 033.04.03.01.02
  templates:
    - type: simple
      question: |-
        A flight is planned over a distance of {{d}} NM. The TAS is {{tas}} kt and the wind gives a head wind component of {{hw}} kt on the outbound leg (so a tail wind of {{hw}} kt on the return).

        What is the distance from the departure point to the Point of Equal Time (PET)? Answer in NM.
      explanation: |-
        The PET is the point from which the flight time to the destination equals the flight time back to the departure. Outbound groundspeed is {{macro1}} kt (head wind), return groundspeed is {{macro2}} kt (tail wind). x = d × G_back / (G_out + G_back), and G_out + G_back = 2 × TAS.

        **Solution**

        G_out = {{macro1}} kt, G_back = {{macro2}} kt

        $$
        \frac{\text{Total distance}\times (\text{TAS}+\text{Head wind component outbound})}{2\times \text{TAS}} = \frac{ {{d}}\times ({{tas}}+{{hw}})}{2\times {{tas}} } = \mathbf{ {{answer}}\ \text{NM} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} NM**: the groundspeeds were swapped, giving a PET that is too close to the departure point.
        - **{{d2}} NM**: the mid-point was used; the wind was ignored.
        - **{{d3}} NM**: wrong ratio of TAS to the return groundspeed.
        - **{{d4}} NM**: the groundspeeds were used in the wrong ratio (difference of leg speeds over return speed).
      presets:
