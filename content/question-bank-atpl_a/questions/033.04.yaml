  templates:
    - type: simple
      question: |-
        Given:

        - Distance from departure to destination: {{dist}} NM
        - Safe endurance: {{endurance}} h
        - TAS: {{tas}} kt
        - Ground speed out: {{gso}} kt
        - Ground speed home: {{gsh}} kt

        What is the time of the PSR from the departure point? Give the answer in minutes.
      explanation: |-
        The point of safe return (PSR) is the point beyond which the aircraft no longer has enough safe endurance to fly back to the departure point. The outbound and homebound legs are flown at different ground speeds, so the endurance is shared in inverse proportion to them: the time out is the endurance multiplied by the home ground speed and divided by the sum of both ground speeds.

        **Solution**

        Time out (h) = {{macro1}} h

        $$
        \frac{\text{Safe endurance}\times \text{Ground speed home}}{\text{Ground speed out}+\text{Ground speed home}}\times 60 = \frac{ {{endurance}}\times {{gsh}} }{ {{gso}}+{{gsh}} }\times 60 = \mathbf{ {{answer}}\ \text{min} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} min**: uses the outbound ground speed in the ratio instead of the home ground speed (inverted ratio).
        - **{{d2}} min**: uses the safe endurance alone, ignoring the ground speed split.
        - **{{d3}} h**: gives the result in hours instead of converting it to minutes.
        - **{{d4}} min**: uses the TAS in place of the outbound ground speed.
