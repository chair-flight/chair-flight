      question: |-
        An aircraft flies the following leg. Calculate the time at which the point of equal time (PET) is reached.

        - Departure time: {{dep_h}}:00
        - Leg distance: {{dist}} NM
        - Leg track: {{track}}°
        - TAS: {{tas}} kt
        - Wind (direction/speed): {{wd}}° / {{ws}} kt

        At what time (hh:mm) is the PET reached?
      explanation: |-
        The PET is reached when the time to go on equals the time to return. The distance to the PET is then found from the ground speeds, and the time from departure is that distance divided by the outbound ground speed. The departure time plus this time gives the clock time.

        **Solution**

        Headwind component: {{macro1}} kt, so GS out = {{macro2}} kt and GS home = {{macro3}} kt

        Distance to PET: {{macro4}} NM

        $$\text{Departure hour}\times 60+\frac{\frac{\text{Leg distance}\times (\text{TAS}+\text{Wind speed}\times \text{cos}(\text{Wind direction}-\text{Leg track}))}{2\times \text{TAS}}}{\text{TAS}-\text{Wind speed}\times \text{cos}(\text{Wind direction}-\text{Leg track})}\times 60 = {{dep_h}}\times 60+\frac{\frac{ {{dist}}\times ({{tas}}+{{ws}}\times \text{cos}({{wd}}-{{track}}))}{2\times {{tas}} }}{ {{tas}}-{{ws}}\times \text{cos}({{wd}}-{{track}})}\times 60$$ minutes after midnight = **{{answer}}**

        ## Why the other answers are wrong

        - **{{d1}}**: uses the home ground speed to find the time to the PET.
        - **{{d2}}**: forgets to add the departure time.
        - **{{d3}}**: flies the whole leg at the outbound ground speed instead of up to the PET.
        - **{{d4}}**: uses the wrong ground speeds in the distance and in the time.
