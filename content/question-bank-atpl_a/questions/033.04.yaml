- id: QFISZ
  subjectId: "033"
  chapterId: "033.04"
  relatedQuestionIds: []
  externalQuestionIds: []
  annexes: []
  learningObjectiveIds:
    - 033.04.02.05.01
  templates:
    - type: simple
      question: |-
        Given the following information, calculate the change in planned Trip Fuel when applying the updated meteorological conditions. Round up the calculation to the next full kilogram.

        - Trip distance: {{dist}} NAM
        - Planned TAS: {{tas}} kt
        - Change TAS: {{dtas}} kt for every 1° C change in OAT
        - Planned average trip fuel consumption: {{cons}} kg/NAM
        - Change of Trip Fuel required: {{pct}}% increase for every 10° C increase in OAT
        - Revised OAT: {{doat}}° C above planned OAT

        The trip fuel will increase by how many kg?
      explanation: |-
        The planned trip fuel is the distance in NAM times the fuel consumption per NAM. A change in TAS only changes the flight time for a given air distance; the fuel per NAM stays the same, so the only change comes from the stated percentage increase with OAT.

        **Solution**

        Planned trip fuel = {{dist}} × {{cons}} = {{macro1}} kg
        Increase = {{macro1}} × {{pct}}% × ({{doat}} / 10) = {{macro2}} kg, rounded up to the next full kilogram.

        $$
        \text{ceil}(\frac{\frac{\text{Trip distance}\times \text{Planned fuel consumption}\times \text{Fuel increase per 10° C}}{100}\times \text{OAT increase}}{10}) = \mathbf{ {{answer}}\ \text{kg increase} }
        $$

        ## Why the other answers are wrong

        - **{{d1}} kg**: the percentage is applied once per degree instead of once per 10° C (an increase ten times too large).
        - **{{d2}} kg**: only the TAS effect is considered, as a decrease of fuel in proportion to the higher TAS; the fuel per NAM does not change with TAS.
        - **{{d3}} kg**: the TAS effect and the percentage increase are combined; the TAS effect should not be applied.
