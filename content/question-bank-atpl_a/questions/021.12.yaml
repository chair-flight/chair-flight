    - AVEXAM-3156
  annexes: []
  learningObjectiveIds:
    - 021.12.02.02.04
  templates:
    - type: simple
      question: What are the possible cockpit indications of an engine fire?
      explanation: "An engine fire warning is a red alert: an aural bell, a red warning message and a red light in the engine fire switch. Amber is used for cautions."
      presets:
        - correctAnswers:
            - text: Bell, red alert message, red light in the engine fire switch.
          wrongAnswers:
            - text: Beeper, amber alert message, red light in the engine fire switch.
            - text: Bell, red alert message, amber light in the engine fire switch.
            - text: Beeper, amber alert message, amber light in the engine fire switch.
    - type: simple
      question: How will a fire warning be indicated?
      explanation: An engine fire gives a continuous bell, the red master warning light and a red light in the engine fire switch. Red is reserved for warnings that need immediate action, and an intermittent bell or yellow caution light is not used.
      presets:
        - correctAnswers:
            - text: Continuous bell, red master warning light, red light on engine fire extinguisher button.
          wrongAnswers:
            - text: Continuous bell, yellow master caution light, red light on engine fire extinguisher button.
            - text: Intermittent bell, red master warning light, red light on engine fire extinguisher button.
            - text: Beeper, red master warning light, amber light on engine fire extinguisher button.
