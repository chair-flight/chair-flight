- id: QCHDG
  subjectId: "021"
  chapterId: "021.12"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-214243
    - AVEXAM-65056
    - BGS-211090
    - ATPLQ-217115
    - BGS-211594
    - AVEXAM-36134
    - ATPLQ-214387
    - BGS-211652
    - AVEXAM-15805
  annexes: []
  learningObjectiveIds:
    - 021.12.02.02.02
  templates:
    - type: simple
      question: In a gas filled fire detection system, what would be the cause of an error warning?
      explanation: In a gas-filled loop, a leak or break lowers the gas pressure. A low pressure is detected by an integrity switch, which gives a loop fault or error indication, not a fire warning.
      presets:
        - correctAnswers:
            - text: Low pressure
          wrongAnswers:
            - text: High pressure
            - text: High temperature
            - text: High resistance
    - type: simple
      question: What could be a cause of a loop fault in a gas-filled fire detection system?
      explanation: A decrease in loop pressure, caused by a leak or break in the sensing tube, opens the integrity switch and gives a loop fault indication.
      presets:
        - correctAnswers:
            - text: A decrease in loop pressure.
          wrongAnswers:
            - text: An increase in loop capacitance.
            - text: An increase in loop resistance.
            - text: A decrease in atmospheric pressure.
    - type: simple
      question: If a gas-filled fire detector becomes broken, the result will be ..
      explanation: A broken gas-filled detector loses its gas, so the pressure falls. This opens the integrity switch and gives a loop fault indication, and not a fire warning.
      presets:
        - correctAnswers:
            - text: a decrease in pressure, causing a loop fault indication.
          wrongAnswers:
            - text: an increase in pressure, causing a fire warning.
            - text: an increase in pressure, causing a loop fault indication.
            - text: a decrease in pressure, causing a fire warning.
