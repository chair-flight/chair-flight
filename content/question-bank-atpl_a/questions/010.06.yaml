      question: It is NOT possible to design a single procedure that can cater for every situation when a circling approach would be conducted. What are the variables that make every circling situation different?
      explanation: |-
        ### ICAO Doc 8168, Volume I, Part II, Section 5, Chapter 6, 6.2.1

        > A circling approach is a visual flight manoeuvre. Each circling situation is different because of variables such as **runway layout, final approach track, wind velocity and meteorological conditions**. Therefore, there can be no single procedure designed that will cater for conducting a circling approach in every situation.
      presets:
        - correctAnswers:
            - text: Runway layout, final approach track, wind velocity, and meteorological conditions.
          wrongAnswers:
            - text: Availability of navigation aids, obstacles around the airport, and pilot experience.
            - text: Meteorological conditions, availability of navigation aids, pilot experience, and final approach track.
            - text: Pilot experience, obstacles around the airport, and meteorological conditions.
