  templates:
    - type: simple
      question: |-
        When passing over a hold fix, an aircraft performs a left turn to heading 090. The pilot maintains track for a specified time, and then performs a second left turn to intercept the 270 inbound radial of the same hold fix. After flying over the hold fix for a second time, they perform a right turn and continues tracking around the hold procedure.   
         The entry procedure which is being described is:
      explanation: |-
        ### ICAO Doc 8168, Volume I, Part II, Section 6, 2.2.4

        > Sector 1 procedure — **parallel entry**: a) at the fix, the aircraft is turned left onto an outbound heading for the appropriate period of time […]; then b) the aircraft is turned toward the holding side to intercept the inbound track or to return directly to the fix; and then c) on second arrival over the holding fix, the aircraft is turned right to follow the holding pattern.

        The procedures in this section are written for right-turn holding patterns; for a left-turn pattern the entry and holding procedures are symmetrical about the inbound track.
      presets:
        - correctAnswers:
            - text: Parallel entry procedure.
          wrongAnswers:
            - text: Offset entry procedure.
            - text: Reverse procedure.
            - text: Direct entry procedure.
