- id: QDLSU
  subjectId: "010"
  chapterId: "010.06"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-103080
    - BGS-100155
  annexes: []
  learningObjectiveIds:
    - 010.06.03.01.01
    - 010.06.04.01.06
  templates:
    - type: simple
      question: What are pilots expected to do when flying an instrument departure procedure?
      explanation: |-
        ### ICAO Doc 8168, Volume I, Part II, Section 2, 1.3.3

        > When flying departure routes expressed as tracks or bearings, the pilot shall **compensate for known or estimated winds**.

        > When being vectored, the pilot should not compensate for wind effects.
      presets:
        - correctAnswers:
            - text: Correct the track for known wind to remain within the protected airspace.
          wrongAnswers:
            - text: Ignore the wind and proceed on a heading equal to the track.
            - text: Request a clearance from ATC for the wind correction to be applied.
            - text: Request from ATC an adequate heading for the correction of wind direction and strength.
