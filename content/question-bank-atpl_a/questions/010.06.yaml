      question: If a missed approach is initiated prior to reaching the MAPt, what should the pilot do?
      explanation: |-
        ### ICAO Doc 8168, Volume I, Part II, Section 5, Chapter 7, 7.1.8.3

        > If a missed approach is initiated before arriving at the MAPt, the pilot should **continue the lateral tracking of the approach being conducted until reaching the MAPt, then follow the missed approach procedure as published** in order to remain within the protected airspace. This does not preclude flying over the MAPt at an altitude/height greater than that required by the procedure.
      presets:
        - correctAnswers:
            - text: Proceed to that point and then follow the procedure.
          wrongAnswers:
            - text: Maintain runway track and wait for ATC instructions.
            - text: If above the MSA, turn to the IAF for the subsequent approach.
            - text: Climb straight ahead until over the MAPt and request radar vectors.
    - type: simple
      question: Is it possible to initiate a missed approach before reaching the Missed Approach Point (MAPt)?
      explanation: |-
        ### ICAO Doc 8168, Volume I, Part II, Section 5, Chapter 7, 7.1.8.3

        > If a missed approach is initiated before arriving at the MAPt, the pilot should **continue the lateral tracking of the approach being conducted until reaching the MAPt, then follow the missed approach procedure as published** in order to remain within the protected airspace. This does not preclude flying over the MAPt at an altitude/height greater than that required by the procedure.
      presets:
        - correctAnswers:
            - text: Yes, and the pilot must follow the lateral track of the missed approach procedure.
          wrongAnswers:
            - text: Yes, and the pilot must turn directly to the Initial Approach Fix (IAF).
            - text: No, as the pilot must reach the MAPt before initiating the missed approach.
            - text: No, as the lateral track of the missed approach cannot be joined early.
