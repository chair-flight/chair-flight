  learningObjectiveIds:
    - 010.06.05.01.09
  templates:
    - type: simple
      question: "On entering and joining a hold you make only right hand turns. What are you performing? "
      explanation: |-
        ### ICAO Doc 8168, Volume I, Part II, Section 6, Chapter 2, 2.2.6

        > Sector 3 procedure — direct entry (see Figure II-6-2-1):
        >
        > Having reached the fix, **the aircraft is turned right to follow the holding pattern**.

        In the parallel entry (Sector 1) the aircraft first turns left, and in the offset entry (Sector 2) it flies a 30° offset track before turning right. Only the direct entry involves right-hand turns alone.
      presets:
        - correctAnswers:
            - text: A direct entry with turns to the right.
          wrongAnswers:
            - text: A direct entry with turns to the left.
            - text: An indirect entry with turns to the left.
            - text: An indirect entry with turns to the right.
