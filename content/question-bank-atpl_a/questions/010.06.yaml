- id: QVIEA
  subjectId: "010"
  chapterId: "010.06"
  relatedQuestionIds: []
  externalQuestionIds:
    - ATPLQ-108420
    - BGS-101761
    - AVEXAM-63267
  annexes: []
  learningObjectiveIds:
    - 010.06.04.01.11
  templates:
    - type: simple
      question: |-
        The OCH of a precision approach to runway 01 is {{och}} ft. In accordance with ICAO Doc 8168, what is the OCA of the approach (in ft)?

        - Aerodrome elevation: {{elev}} ft
        - RWY 01 threshold elevation: {{t01}} ft
        - RWY 19 threshold elevation: {{t19}} ft
      explanation: |-
        For a precision approach, OCA is referenced to the elevation of the threshold of the runway concerned. OCA = OCH + threshold elevation.

        **Solution**

        $$
        \text{OCH}+\text{RWY 01 threshold elevation} = {{och}}+{{t01}} = \mathbf{ {{answer}}\ \text{ft} }
        $$

        ## Why the other answers are wrong
        - **{{d1}} ft**: uses the aerodrome elevation instead of the RWY 01 threshold elevation.
        - **{{d2}} ft**: uses the elevation of the opposite threshold (RWY 19).
        - **{{d3}} ft**: gives the OCH, which is a height, not an altitude.
        - **{{d4}} ft**: adds both the aerodrome and the threshold elevation.
      presets:
        - variables:
            och: 154
            elev: 35
            t01: 40
            t19: 30
            answer: 194
            d1: 189
            d2: 184
            d3: 154
            d4: 229
          correctAnswers:
            - text: 194 ft
          wrongAnswers:
            - text: 189 ft
            - text: 154 ft
            - text: 229 ft
            - text: 184 ft
        - variables:
            och: 180
            elev: 50
            t01: 56
            t19: 44
            answer: 236
            d1: 230
            d2: 224
            d3: 180
            d4: 286
          correctAnswers:
