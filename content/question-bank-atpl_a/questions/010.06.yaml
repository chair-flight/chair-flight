    - type: simple
      question: A Visual Manoeuvring (Circling) Area may be sectored to exclude a prominent obstacle. Under what circumstances is this permitted?
      explanation: |-
        ### ICAO Doc 8168, Volume I, Part II, Section 5, Chapter 6, 6.3.4

        > A sector in the circling area where a prominent obstacle exists may be ignored for OCA/H calculations if it is outside the final approach and missed approach areas for the instrument approach. […]
        >
        > When this option is exercised, the published procedure **prohibits circling within the entire sector** in which the obstacle is located.
