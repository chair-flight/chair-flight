            - text: Fly toward RWY 04 and initiate the missed approach for RWY 22.
          wrongAnswers:
            - text: Fly toward RWY 22 and initiate the missed approach for RWY 22.
            - text: Fly toward RWY 04 and initiate the missed approach for RWY 04.
            - text: Continue until the minimums and initiate missed approach if visual references are not recovered.
