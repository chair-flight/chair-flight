        - correctAnswers:
            - text: The required visual references have been established and can be maintained.
          wrongAnswers:
            - text: The horizontal visibility is at least 5 NM and the ceiling is 1 500 ft or higher.
            - text: The landing runway or an alternative runway is in sight.
            - text: The ceiling is 1 500 ft or higher.
