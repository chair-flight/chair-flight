    - ATPLQ-312125
  annexes: []
  learningObjectiveIds:
    - 031.01.02.01.02
  templates:
    - type: simple
      question: What is a possible consequence of loading an aircraft incorrectly so that the Centre of Gravity is positioned ahead of the forward limit?
      explanation: A CG ahead of the forward limit gives a strong nose-down moment. At low speed, as in the flare, the elevator may not give enough nose-up force to keep the aircraft level.
      presets:
        - correctAnswers:
            - text: There may be insufficient aft pitch control available to keep the aircraft level.
          wrongAnswers:
            - text: The aircraft may become excessively manoeuvrable and beyond control.
            - text: There may be insufficient forward pitch control available to keep the aircraft level.
            - text: There may be a tendency to over-pitch the aircraft during the flare just before landing.
- id: QICEU
  subjectId: "031"
  chapterId: "031.01"
  relatedQuestionIds:
    - QTOYC
  externalQuestionIds:
    - BGS-310467
    - ATPLQ-319246
  annexes: []
  learningObjectiveIds:
    - 031.01.02.01.03
  templates:
    - type: simple
      question: What are the possible consequences when loading an aircraft incorrectly so that its CG is positioned behind the aft limit?
      explanation: A CG behind the aft limit means less nose-down pitching moment is available from the elevator. There may be insufficient forward control to keep the aircraft level, and the aircraft is less stable.
      presets:
        - correctAnswers:
            - text: There may be insufficient forward pitch control available to keep the aircraft level in straight flight.
          wrongAnswers:
            - text: There may be insufficient aft pitch control available to keep the aircraft level in straight flight.
            - text: There may be an inability to flare the aircraft on landing.
            - text: The aircraft will be extremely stable.
