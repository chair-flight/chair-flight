  templates:
    - type: simple
      question: The permissible centre of gravity range of an aircraft spans from 8% MAC to 42% MAC. The actual centre of gravity is situated at 10% MAC, consequently the stalling speed (1)\_\_\_\_\_ and the endurance (2)\_\_\_\_\_.
      explanation: A CG at 10% MAC is near the forward limit of 8%. A forward CG needs a larger tail-down force, so the wing must produce more lift, which raises the stall speed. The extra drag reduces the endurance.
      presets:
        - correctAnswers:
            - text: (1) increases; (2) decreases.
          wrongAnswers:
            - text: (1) increases; (2) increases.
            - text: (1) decreases; (2) decreases.
            - text: (1) decreases; (2) increases.
