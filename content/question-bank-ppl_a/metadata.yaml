  - id: AXXH
    format: svg
    description: Cruise chart. Outside air temperature in °C with pressure altitude
      lines from mean sea level to 12 000 ft, and curves for 55 % power at 17
      l/h, 65 % power at 20 l/h and 75 % power at 23 l/h giving the true
      airspeed in kt. A sample path is drawn in green.
    source: ""
  - id: AYIM
    format: svg
    description: "Centre of gravity envelope chart with mass in lb and kg (vertical
      axis) against moment in inlb and mmkg (horizontal axis). The envelope is
      bounded by two sloping lines and a horizontal upper limit. Four crosses
