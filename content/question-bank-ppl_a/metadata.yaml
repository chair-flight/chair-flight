    source: https://www.austrocontrol.at/jart/prj3/ac/data/uploads/PEL/Fragenkatalog/ECQB-PPL-A-70-FPP_EN.pdf#page=57
  - id: AYZP
    format: webp
    description: Aeronautical chart showing the Brünkendorf, Uelzen and Neustadt area.
    source: https://github.com/PupoSDC/ppl-quiz/blob/master/question-bank/src/questions/navigation/images/NAV03.png
  - id: AZAH
    format: svg
    description: CAP 697 table 2.2.3, cruise at 23.0 in. Hg or full throttle at 2300
      rpm, lean mixture, cruise weight 3400 lb. For ISA deviations of -20, 0 and
      +20 °C and pressure altitudes from 0 to 16 000 ft it lists indicated
      outside air temperature, manifold pressure, fuel flow in PPH and GPH, and
      airspeed in KIAS and KTAS.
    source: CAP 697 Flight Planning Manual
  - id: AZBG
    format: svg
    description: Cross section of a microburst with air flowing down at the centre
      and spreading outwards along the ground, with an aeroplane on take-off
      from the runway on the left flying through the outflow over 1 to 2 NM.
      Point 1 is in the outflow before the centre, point 2 is in the downdraught
      at the centre, point 3 is in the outflow after the centre.
    source: ""
