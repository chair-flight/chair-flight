    source: ""
  - id: AXOB
    format: svg
    description: Historical NOTAM excerpt with the text and vertical limits.
    source: https://www.austrocontrol.at/jart/prj3/ac/data/uploads/PEL/Fragenkatalog/ECQB-PPL-A-70-FPP_EN.pdf#page=29
  - id: AXQE
    format: webp
    description: Cloud photograph with distinct rounded towers and individual bases.
