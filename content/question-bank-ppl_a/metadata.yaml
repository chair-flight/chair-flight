      ground roll and then climbs more steeply.
    source: ""
  - id: AOJU
    format: svg
    description: "Centre of gravity envelope chart with mass in lb and kg (vertical
      axis) against moment in inlb and mmkg (horizontal axis). The envelope is
      bounded by two sloping lines and a horizontal upper limit. Four crosses
      are marked: 1 to the right of the envelope at low mass, 2 inside the
      envelope near the upper limit, 3 far to the right of the envelope at mid
      mass, 4 inside the envelope near the right edge and the upper limit."
    source: ""
  - id: AOMT
    format: svg
    description: Lift and drag polar with six marked points and a tangent.
    source: https://www.austrocontrol.at/jart/prj3/ac/data/uploads/PEL/Fragenkatalog/ECQB-PPL-A-51-PFA.pdf#page=22
  - id: APIV
    format: svg
    description: Loading table with basic empty mass 3156 lb at 135.33 in, front
      seats 320 lb at 135.50 in, rear seats 340 lb at 177.00 in, baggage 80 lb
      at 248.23 in and fuel 321.5 lb at 150.31 in.
    source: ""
  - id: APQJ
    format: svg
    description: Weight and balance record table with columns for date, entry number
      in and out, description, additions, subtractions and actual empty weight,
      arm and moment. Entries are GPS added 25.10.2010 giving 512 kg, ADF
      removed 10.11.2010 giving 506 kg, left aft seat removed 04.03.2011 giving
      494 kg and HSI added 06.11.2011 giving 498 kg with an arm of 280.59 m.
    source: ""
  - id: AQLM
    format: svg
    description: Time, fuel and distance to climb chart. Outside air temperature in
      °C with pressure altitude lines from 2000 to 16 000 ft, and initial mass
      curves for 2600, 3000, 3400 and 3650 lb giving time to climb in minutes,
      fuel in gallons and distance in NM. Climb conditions are full throttle at
      2700 RPM, full rich mixture, flaps up and 110 kt for all masses. Sample
      paths are drawn in green.
    source: ""
  - id: ASWN
    format: svg
    description: Oleo landing gear
    source: https://github.com/PupoSDC/ppl-quiz/blob/master/question-bank/src/questions/aircraftGeneralKnowledge/images/AGK0018.png
  - id: ASYW
    format: webp
