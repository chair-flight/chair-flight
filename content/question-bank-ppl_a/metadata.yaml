  - id: AUSO
    format: svg
    description: "Curve of performance (vertical axis P) against arousal or stress
      (horizontal axis A). Performance rises to a peak and falls again. Marked
      points: A on the rising side at low arousal, B on the rising side near the
      peak, C at the peak, D on the falling side at high arousal."
    source: ""
  - id: AVOA
    format: svg
    description: "Airspeed indicator in knots with a white arc, a green arc and a
      yellow arc and a red line. Five points are marked: 1 at the start of the
      white arc, 2 at the start of the green arc, 3 at the end of the white arc,
      4 at the end of the green arc, 5 at the red line at the end of the yellow
      arc."
    source: ""
  - id: AVSR
    format: svg
    description: Aerofoil chord and camber
