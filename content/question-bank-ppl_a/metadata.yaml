      the envelope at the lower mass, 3 on the right edge of the envelope, 4 on
      the left edge of the envelope."
    source: ""
  - id: AYIV
    format: svg
    description: Square ground signal with a red field and a yellow diagonal cross.
    source: ""
  - id: AYLA
    format: svg
    description: An extract of an ICAO flight plan with departure time, flight rules
