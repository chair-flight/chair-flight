  - id: ANTP
    format: webp
    description: Light aeroplane on grass, viewed from the front quarter.
    source: https://github.com/PupoSDC/ppl-quiz/blob/master/question-bank/src/questions/aircraftGeneralKnowledge/images/AGK0004.png
  - id: AOBF
    format: svg
    description: Two take-off profiles from the same runway. Line A has a shorter
