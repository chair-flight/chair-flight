- id: QLJKN
  subjectId: "01"
  chapterId: "01.07"
  relatedQuestionIds:
    - QOCWL
    - QWBGU
  annexes: []
  learningObjectiveIds:
    - "01.07.02"
  templates:
    - type: simple
      question: What must a pilot do before entering an RMZ as a VFR flight, unless the ANSP has prescribed alternative procedures?
      explanation: |-
        ### Regulation (EU) No 923/2012, SERA.6005(a)

        > Before entering a radio mandatory zone, an initial call […] shall be made by pilots on the appropriate communication channel.
      presets:
        - correctAnswers:
            - text: Make an initial call on the designated channel and maintain a continuous air-ground voice communication watch in the RMZ.
          wrongAnswers:
            - text: Set the transponder to 7000 and enter without a radio call.
            - text: Make the first call after crossing the RMZ boundary.
            - text: Monitor the channel only if ATC has assigned a discrete transponder code.
