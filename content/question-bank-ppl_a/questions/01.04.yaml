  learningObjectiveIds:
    - "01.04.02"
  templates:
    - type: simple
      question: In which way is a SEP (land) rating renewed if you do not meet the required flight time?
      explanation: ""
      presets:
        - correctAnswers:
            - text: A proficiency check with an examiner.
          wrongAnswers:
            - text: The ATO can renew the rating after a training flight with a flight instructor.
            - text: The required flight experience has to be accumulated under supervision of a flight instructor.
            - text: According to the flight experience there have to be several training flights under supervision of an ATO.
- id: QXPYI
  subjectId: "01"
  chapterId: "01.04"
  relatedQuestionIds:
    - QUQTP
  annexes: []
  learningObjectiveIds:
    - "01.04.02"
  templates:
    - type: simple
      question: What are the minimum requirements among others to acquire a rating for VFR night flights?
      explanation: ""
      presets:
        - correctAnswers:
            - text: At least 5 additional flight hours at night, three of them with a flight instructor, with at least 1 hour cross-country flight plus 5 solo take-offs and full-stop landings.
          wrongAnswers:
            - text: At least 10 additional flight hours at night, three of them with a flight instructor with at least 1 hour cross-country flight plus 5 solo take-offs and full-stop landings.
            - text: At least 5 additional flight hours at night, four of them with a flight instructor with at least 1 hour cross-country flight plus 5 solo take-offs and full-stop landings.
            - text: At least 5 additional flight hours at night, three of them with a flight instructor with at least 1 hour cross-country flight plus 10 solo take-offs and full-stop landings.
