    - QELSV
    - QUQTP
  annexes: []
  learningObjectiveIds:
    - "01.04.02"
  templates:
    - type: simple
      question: The possession of a European PPL(A) entitles the holder to...
      explanation: ""
      presets:
        - correctAnswers:
            - text: Act as PIC on non-commercial flights without compensation as well as to receive compensation as a flight instructor.
          wrongAnswers:
            - text: Act as pilot in commercial and non-commercial flights with single engine aircraft.
            - text: Act as pilot on a commercial flight when there are at most 4 people on board.
            - text: Act as PIC, and only for flights in aircraft with a MTOW of maximum 2000 kg a compensation may be obtained.
