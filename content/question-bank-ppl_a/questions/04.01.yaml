- id: QUDTK
  subjectId: "04"
  chapterId: "04.01"
  relatedQuestionIds:
    - QHUDT
    - QKNKU
  annexes: []
  learningObjectiveIds:
    - "04.01.03.03"
  templates:
    - type: simple
      question: When must a pilot use a blind transmission under SERA?
      explanation: |-
        ### Regulation (EU) No 923/2012, SERA.14085(a)

        Try the designated channel, the previous channel and other appropriate channels, then try reaching an ATS unit or another aircraft by available means. If contact cannot be established, transmit the message blind.
      presets:
        - correctAnswers:
            - text: When attempts to establish communication on the appropriate channels and by other available means have failed.
          wrongAnswers:
            - text: Whenever there is more than one aircraft on the frequency.
            - text: Whenever the initial call receives no response, before trying other channels.
            - text: Whenever the pilot expects to change to a different frequency.
    - type: simple
      question: What is the correct phrase to begin a blind transmission?
      explanation: ""
      presets:
        - correctAnswers:
            - text: Transmitting blind
          wrongAnswers:
            - text: Blind
            - text: No reception
            - text: Listen
    - type: simple
      question: After unsuccessful attempts to establish contact, on which channel or channels is a blind transmission sent under SERA?
      explanation: |-
        ### Regulation (EU) No 923/2012, SERA.14085(a)

        > […] the aircraft shall transmit its message twice on the designated channel(s) […]
      presets:
        - correctAnswers:
            - text: On the designated channel or channels
          wrongAnswers:
            - text: Only on 121.500
            - text: On any unused VHF channel
            - text: Only on the departure aerodrome’s ATIS channel
    - type: simple
      question: How many times is a blind transmission made under SERA?
      explanation: |-
        ### Regulation (EU) No 923/2012, SERA.14085(a)

        > […] the aircraft shall transmit its message twice on the designated channel(s) […]
      presets:
        - correctAnswers:
            - text: Twice
          wrongAnswers:
            - text: Once
            - text: Three times
            - text: Four times
