  annexes: []
  learningObjectiveIds:
    - "07.03.02.02.01"
  templates:
    - type: simple
      question: An aeroplane on a daytime VFR flight intends to enter a Class D control zone and join the aerodrome traffic circuit. The ATIS reports a ground visibility of 4000 m. Assuming the special VFR minima and conditions are met, which clearance is required?
      explanation: |-
        ### Regulation (EU) No 923/2012, SERA.5005(b) and SERA.5010

        > […] VFR flights shall not take off or land at an aerodrome within a control zone, or enter the aerodrome traffic zone or aerodrome traffic circuit when […] the ground visibility is less than 5 km […]

        The reported ground visibility is 4000 m. If cleared by ATC, the pilot may operate under special VFR subject to its conditions.
      presets:
        - correctAnswers:
            - text: Special VFR clearance
          wrongAnswers:
            - text: A routine VFR entry clearance
            - text: A take-off clearance
            - text: A taxi clearance
