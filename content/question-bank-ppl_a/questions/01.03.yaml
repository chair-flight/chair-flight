      question: Under which circumstances are aircraft obliged to carry the national flag?
      explanation: ""
      presets:
        - correctAnswers:
            - text: On every flight.
          wrongAnswers:
            - text: Only for international flights.
            - text: Only on flights outside the EU countries.
