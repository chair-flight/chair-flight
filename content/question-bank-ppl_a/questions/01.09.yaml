- id: QIGFI
  subjectId: "01"
  chapterId: "01.09"
  relatedQuestionIds: []
  annexes:
    - id: AFHD
    - id: AYIV
    - id: AKDD
    - id: AEAP
  learningObjectiveIds:
    - "01.09.03"
  templates:
    - type: definition
      question: |-
        What is the meaning of this ground signal shown in the signal area of an aerodrome?

        {term}
      explanation: |-
        Ground signals in the signal area are white, red or yellow shapes laid out so that pilots can read them from the air.

        {table}
      options:
        - id: a
          term: "![](annex:AFHD)"
          definition: Caution, the manoeuvring area is poor.
        - id: b
          term: "![](annex:AYIV)"
          definition: Landing is prohibited for a longer period.
        - id: c
          term: "![](annex:AKDD)"
          definition: Glider flying is in progress.
        - id: d
          term: "![](annex:AEAP)"
          definition: After take-off and before landing all turns must be made to the right.
      fakeOptions:
        - id: x
          definition: Ground movement is restricted to hard surfaces.
        - id: y
          definition: The aerodrome is closed for all traffic until further notice.
