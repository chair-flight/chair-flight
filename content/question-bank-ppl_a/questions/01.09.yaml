  learningObjectiveIds:
    - "01.09.02"
  templates:
    - type: simple
      question: Under the global reporting format, what does the runway condition WET mean?
      explanation: |-
        ### Regulation (EU) No 139/2014, Article 2, point (49)

        > ‘wet runway’ means a runway whose surface is covered by any visible dampness or water up to and including 3 mm deep within the area intended to be used.
      presets:
        - correctAnswers:
            - text: Visible dampness or water up to and including 3 mm deep
          wrongAnswers:
            - text: Water more than 3 mm deep
            - text: A covering of wet snow
            - text: No visible moisture or contaminant
