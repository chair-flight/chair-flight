  templates:
    - type: simple
      question: 'According to ICAO Annex 2, the term "aerodrome traffic" is defined as:'
      explanation: ""
      presets:
        - correctAnswers:
            - text: All traffic on the manoeuvring area of an aerodrome and all aircraft flying in the vicinity of an aerodrome.
          wrongAnswers:
            - text: All traffic on the manoeuvring area of an aerodrome and all aircraft flying in the vicinity of an aerodrome except aircraft in a visual circuit.
            - text: All traffic on the movement area of an aerodrome and all aircraft flying in the vicinity of an aerodrome.
            - text: All traffic on the apron and on the manoeuvring area of an aerodrome and all aircraft flying in the vicinity of an aerodrome.
