- id: QKPSL
  subjectId: "03"
  chapterId: "03.09"
  relatedQuestionIds:
    - QIPHG
    - QIXAX
  annexes: []
  learningObjectiveIds:
    - "03.09.04.01"
  templates:
    - type: simple
      question: What conditions are favourable for the formation of thunderstorms?
      explanation: ""
      presets:
        - correctAnswers:
            - text: Warm humid air, conditionally unstable environmental lapse rate
          wrongAnswers:
            - text: Calm winds and cold air, overcast cloud cover with St or As.
            - text: Clear night over land, cold air and patches of fog
            - text: Warm and dry air, strong inversion layer
    - type: simple
      question: What conditions are mandatory for the formation of thermal thunderstorms?
      explanation: ""
      presets:
        - correctAnswers:
            - text: Conditionally unstable atmosphere, high temperature and high humidity
          wrongAnswers:
            - text: Conditionally unstable atmosphere, low temperature and low humidity
            - text: Absolutely stable atmosphere, high temperature and high humidity
            - text: Absolutely stable atmosphere, high temperature and low humidity
