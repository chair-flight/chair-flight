  relatedQuestionIds: []
  annexes: []
  learningObjectiveIds:
    - "03.09.07.01"
  templates:
    - type: simple
      question: What clouds and weather may result from an humid and instable air mass, that is pushed against a chain of mountains by the predominant wind and forced to rise?
      explanation: ""
      presets:
        - correctAnswers:
            - text: Embedded CB with thunderstorms and showers of hail and/or rain.
          wrongAnswers:
            - text: Thin Altostratus and Cirrostratus clouds with light and steady precipitation.
            - text: Overcast low stratus (high fog) with no precipitation.
            - text: Smooth, unstructured NS cloud with light drizzle or snow (during winter).
- id: QFASA
  subjectId: "03"
  chapterId: "03.09"
  relatedQuestionIds:
    - QOUQJ
  annexes: []
  learningObjectiveIds:
    - "03.09.01.01"
  templates:
    - type: simple
      question: Which of the following conditions are most favourable for ice accretion?
      explanation: ""
      presets:
        - correctAnswers:
            - text: Temperatures between 0 °C and -12 °C, presence of supercooled water droplets (clouds)
          wrongAnswers:
            - text: Temperaturs below 0 °C, strong wind, sky clear of clouds
            - text: Temperatures between +10 °C and -30 °C, presence of hail (clouds)
            - text: Temperatures between -20 °C and -40 °C, presence of ice crystals (Ci clouds)
    - type: simple
      question: What temperatures are most dangerous with respect to airframe icing?
      explanation: ""
      presets:
        - correctAnswers:
            - text: 0° to -12 °C
          wrongAnswers:
            - text: +5° to -10 °C
            - text: -20° to -40 °C
            - text: +20° to -5 °C
