  learningObjectiveIds:
    - "03.06.02.02"
  templates:
    - type: simple
      question: What cloud sequence can typically be observed during the passage of a warm front?
      explanation: ""
      presets:
        - correctAnswers:
            - text: Cirrus, thickening altostratus and altocumulus clouds, lowering cloud base with rain, nimbostratus
          wrongAnswers:
            - text: In coastal areas during daytime wind from the coast and forming of cumulus clouds, dissipation of clouds during evening and night
            - text: Wind becoming calm, dissipation of clouds and warming during summer; formation of extended high fog layers during winter
            - text: Squall line with showers of rain and thunderstorms (Cb), gusting wind followed by cumulus clouds with isolated showers of rain
