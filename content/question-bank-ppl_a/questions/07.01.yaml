- id: QDEYV
  subjectId: "07"
  chapterId: "07.01"
  relatedQuestionIds: []
  annexes:
    - id: APIV
    - id: AIGZ
  learningObjectiveIds:
    - "07.01.04.01.01"
  templates:
    - type: simple
      question: |-
        The position of the centre of gravity equals...

        ![Loading table with basic empty mass 3156 lb at 135.33 in, front seats 320 lb at 135.50](annex:APIV)
      explanation: |-
        Multiply each mass by its arm to get its moment, add the moments and divide by the total mass.

        | Item            | Mass (lb) | Arm (in) | Moment (lb in) |
        | --------------- | --------- | -------- | -------------- |
        | Basic empty mass| 3156      | 135.33   | 427 101        |
        | Front seats     | 320       | 135.50   | 43 360         |
        | Rear seats      | 340       | 177.00   | 60 180         |
        | Baggage         | 80        | 248.23   | 19 858         |
        | Fuel            | 321.5     | 150.31   | 48 325         |
        | Total           | 4217.5    |          | 598 825        |

        CG = 598 825 / 4217.5 = 142 in.
      presets:
        - correctAnswers:
            - text: 142 in
          wrongAnswers:
            - text: 147.5 in
            - text: 137.5 in
            - text: 145.7 in
    - type: simple
      question: |-
        The position of the centre of gravity (including fuel) equals...

        ![Loading table with basic empty mass 560 kg at 0.35 m, pilot and passenger 150 kg at 0.4](annex:AIGZ)
      explanation: |-
        Convert the fuel to mass with the density of aviation gasoline (0.72 kg/l): 60 l is 43.2 kg. Then multiply each mass by its arm, add the moments and divide by the total mass.

        | Item                | Mass (kg) | Arm (m) | Moment (kg m) |
        | ------------------- | --------- | ------- | ------------- |
        | Basic empty mass    | 560       | 0.35    | 196.00        |
        | Pilot and passenger | 150       | 0.40    | 60.00         |
        | Baggage             | 15        | 0.65    | 9.75          |
        | Fuel                | 43.2      | 0.45    | 19.44         |
        | Total               | 768.2     |         | 285.19        |

        CG = 285.19 / 768.2 = 0.371 m = 37.1 cm.
      presets:
        - correctAnswers:
            - text: 37.1 cm
          wrongAnswers:
            - text: 0.403 m
            - text: 0.401 m
            - text: 37.3 cm
